끼,\n아니 딱 한 술만이라도 천천히 맛보는 연습을 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n앞에 따뜻한 밥 한 그릇이 놓여 있다고 떠올려 봅니다.\n실제 음식을 앞에 두고 해도 좋습니다.\n\n준비가 되면 어깨의 힘을 살며시 내려놓습니다.\n급하게 먹던 마음도 잠시 내려놓습니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 몸이 느긋해집니다.\n\n이제 두 손으로 그릇을 감싸 봅니다.\n손바닥에 따뜻한 온기가 전해집니다.\n그릇의 묵직함이 손에 담깁니다.\n\n그릇 안의 밥을 가만히 바라봅니다.\n김이 천천히 피어오릅니다.\n그 위로 은은한 냄새가 올라옵니다.\n\n코로 그 냄새를 가만히 맡아 봅니다.\n입안에 침이 조금 고입니다.\n서두르지 않아도 됩니다.\n\n이제 한 술을 떠서 천천히 입에 넣어 봅니다.\n바로 삼키지 말고 잠시 그대로 둡니다.\n\n혀에 닿는 온도와 결을 느껴 봅니다.\n그리고 천천히 씹기 시작합니다.\n열 번, 스무 번,\n평소보다 오래 씹어 봅니다.\n\n씹을수록 맛이 조금씩 달라집니다.\n처음엔 몰랐던 단맛이 배어 나옵니다.\n맛이 잘 안 느껴져도 괜찮습니다.\n그저 씹고 있다는 것만 알아차리면 됩니다.\n\n충분히 씹은 뒤 천천히 삼켜 봅니다.\n따뜻함이 목을 지나 몸속으로 내려갑니다.\n\n이 한 술이 여기 오기까지를 잠시 떠올려 봅니다.\n흙과 햇살과 비가 곡식을 키웠습니다.\n\n씨를 뿌린 손,\n거두고 나른 손,\n밥을 지은 손이 있었습니다.\n\n수많은 손과 자연이 이어져 지금 내 앞에 한 그릇이 놓였습니다.\n나는 그 둥근 이어짐의 한가운데 있습니다.\n\n마음이 다른 데로 흘러가도 괜찮습니다.\n흘러간 것을 알아차린 그 순간,\n다시 이 밥 앞으로 돌아온 것입니다.\n\n이렇게 한 술을 온전히 먹고 나면 많이 먹지 않아도 마음이 이상하게 넉넉해집니다.\n\n가슴 한가운데가 조금 따뜻해집니다.\n살아 있어 이 한 술을 먹는다는 것이 새삼 고맙게 느껴집니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 다음 끼니의 첫 술은 말없이,\n아주 천천히 떠먹어 봅니다.\n그 한 술이면 충분합니다.","duration":"약 8분","tags":"#먹기명상 #마음챙김 #감사","series":"숨비명상"},{"id":"d6fec340","category":"관찰","title":"한 번에 하나","body":"밥을 먹을 때 우리 몸은 참 분주합니다.\n한 손은 반찬을 집고 다른 손은 밥을 뜨고 입은 쉴 새 없이 씹습니다.\n\n세 가지 일이 한꺼번에 일어나느라 정작 무엇을 먹는지 느낄 새가 없습니다.\n\n오늘은 반대로 해 봅니다.\n한 번에 딱 한 가지씩만.\n그 연습을 함께 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n앞에 간단한 음식이 놓여 있다고 떠올려 봅니다.\n실제 음식을 두고 해도 좋습니다.\n\n준비가 되면 두 손을 무릎이나 식탁 위에 가만히 내려놓습니다.\n지금 이 손은 비어 있습니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n빈 손의 가벼움을 잠시 느껴 봅니다.\n\n이제 한 가지 동작만 시작합니다.\n숟가락을 들어 한 술을 뜹니다.\n지금은 뜨는 일만 합니다.\n\n그 한 술을 천천히 입으로 가져갑니다.\n지금은 옮기는 일만 합니다.\n입에 넣었으면,\n숟가락을 다시 내려놓습니다.\n\n이제 두 손이 비었습니다.\n손이 비어 있으니 입은 씹는 일에만 집중할 수 있습니다.\n\n천천히 씹어 봅니다.\n손이 다음 것을 집으러 가지 않습니다.\n그저 씹기만 합니다.\n\n자꾸 손이 먼저 나가려 해도 괜찮습니다.\n그걸 알아차린 순간,\n손을 다시 살며시 내려놓으면 됩니다.\n\n충분히 씹은 뒤 천천히 삼킵니다.\n한 번 숨을 쉽니다.\n그다음에야 비로소 다시 숟가락을 듭니다.\n\n집을 때는 집기만,\n옮길 때는 옮기기만,\n씹을 때는 씹기만 합니다.\n\n동작과 동작 사이,\n손이 잠깐 비는 그 순간이 오늘의 쉼표입니다.\n\n그 작은 쉼표 속에서 내가 지금 밥을 먹고 있구나,\n하고 또렷이 느껴집니다.\n\n신기하게도 급하게 먹을 때보다 마음이 훨씬 고요해집니다.\n쌀 한 톨의 수고도 그제야 눈에 들어옵니다.\n\n가슴이 조금 넉넉해집니다.\n많이 먹지 않아도 이미 충분한 느낌이 듭니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 밥을 먹을 때 한 입 넣고 젓가락을 잠깐 내려놓아 봅니다.\n설거지할 때도,\n길을 걸을 때도 한 번에 하나씩이면 충분합니다.","duration":"약 7분","tags":"#먹기명상 #한번에하나 #마음챙김","series":"숨비명상"},{"id":"5c45d5fa","category":"관찰","title":"고요한 호수","body":"우리는 늘 더 많은 것을 바라며 삽니다.\n더 좋은 것,\n더 새것을 사고도 얼마 지나지 않아 또 다른 것을 찾습니다.\n\n그렇게 바쁘게 채우다 보면 정작 마음은 자주 헛헛합니다.\n\n오늘은 잠시 숲속의 고요한 호수 하나를 떠올려 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n머릿속이 아직 분주해도 괜찮습니다.\n사야 할 것,\n해야 할 일이 떠올라도 괜찮습니다.\n그저 잠시 그대로 두면 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n몸이 조금씩 고요해집니다.\n\n이제 이른 새벽의 숲을 그려 봅니다.\n키 큰 소나무들 사이로 작고 맑은 호수 하나가 고여 있습니다.\n\n나는 그 호숫가 넓적한 바위에 앉아 있습니다.\n바위가 서늘하고 매끈합니다.\n공기에서 은은한 솔 냄새가 납니다.\n\n호수의 물을 가만히 바라봅니다.\n물결 하나 없이 잔잔합니다.\n너무 맑아서 깊은 초록으로 보입니다.\n\n잔잔한 물 위에 하늘과 나무가 그대로 비칩니다.\n호수는 아무것도 붙잡지 않고 그저 비춥니다.\n\n내 마음도 이 물처럼 가만히 두면 저절로 잔잔해집니다.\n생각이 일렁여도 괜찮습니다.\n알아차린 순간,\n물결은 다시 가라앉습니다.\n\n멀리서 새 한 마리가 웁니다.\n솔숲을 지나온 바람이 뺨을 스치고 지나갑니다.\n\n이윽고 나무들 사이로 해가 천천히 떠오릅니다.\n붉은빛이 물 위로 길게 번집니다.\n\n내가 해를 뜨게 한 것은 아닙니다.\n그저 여기 앉아 해가 뜨는 모습을 바라보고 있을 뿐입니다.\n\n그런데 그것만으로 마음이 이상하리만치 넉넉해집니다.\n\n이곳에 나는 가진 것이 거의 없습니다.\n바위 하나, 바람 한 줄기,\n호수 하나.\n그런데 조금도 부족하지 않습니다.\n\n더 채우지 않아도 지금 이대로 충분합니다.\n자연의 한 자리에 앉아 있는 것만으로 충분합니다.\n\n가슴 한가운데가 조용히 따뜻해집니다.\n\n이 잔잔한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n더 가지려는 마음에 쫓기는 날이 오면,\n잠시 이 고요한 호수를 떠올려 봅니다.\n숨을 한 번 쉬고,\n이미 곁에 있는 것들을 바라봅니다.","duration":"약 8분","tags":"#자연명상 #고요 #만족","series":"숨비명상"},{"id":"78cce2e7","category":"멈춤","title":"마음을 기다려","body":"옛날 어느 먼 곳에서는 말을 타고 길을 가다가 이따금 말을 멈추고 뒤를 돌아보았다고 합니다.\n\n왜 그렇게 자주 멈추느냐고 묻자 말이 너무 빨라 자기 마음이 미처 따라오지 못할까 봐,\n마음이 따라올 때까지 기다리는 것이라 했습니다.\n\n오늘은 우리도 저만치 앞서간 마음을 잠시 기다려 주는 시간을 가져 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n하루 종일 바삐 달려왔어도 괜찮습니다.\n아직 마음이 저 앞을 달리고 있어도 괜찮습니다.\n이제 잠시 멈추면 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n몸은 지금 여기 이렇게 앉아 있습니다.\n\n이제 긴 길을 떠올려 봅니다.\n나는 그 길을 쉼 없이 서둘러 걸어왔습니다.\n발이 앞으로,\n앞으로만 향했습니다.\n\n여기서 걸음을 멈춥니다.\n가만히 서서 지나온 길을 돌아봅니다.\n\n몸은 여기까지 왔는데 마음은 아직 저 뒤에서 헐레벌떡 오고 있습니다.\n급하게 달리느라 두고 온 나입니다.\n\n재촉하지 않고 가만히 기다려 줍니다.\n숨을 한 번 쉴 때마다 그 마음이 조금씩 가까워집니다.\n\n마음이 자꾸 다시 앞서 달려가도 괜찮습니다.\n그걸 알아차린 순간,\n나는 이미 멈춰 서 있는 것입니다.\n\n이윽고 뒤처졌던 마음이 지금 여기,\n내 몸에 도착합니다.\n몸과 마음이 나란히 섭니다.\n\n이제야 주변이 눈에 들어옵니다.\n길가의 풀이 바람에 흔들립니다.\n어디선가 새소리가 들려옵니다.\n서두를 때는 보이지 않던 것들입니다.\n\n빨리 가는 것만이 좋은 것은 아니었습니다.\n천천히 걸어야 길 위의 풍경도,\n향기도 만날 수 있습니다.\n\n몸과 마음이 함께 있으니 비로소 내가 어디로 가고 있는지 방향이 다시 또렷해집니다.\n\n가슴 한가운데가 차분하게 가라앉습니다.\n\n이 차분한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n하루가 너무 빨라 마음이 흩어지는 날이면,\n잠깐 멈춰 숨을 한 번 쉬며 앞서간 마음이 따라올 때까지 기다려 봅니다.","duration":"약 8분","tags":"#느림명상 #멈춤 #마음챙김","series":"숨비명상"},{"id":"747904d5","category":"움직임명상","title":"맨발로 걷기","body":"우리는 하루의 대부분을 신발 속에 발을 넣고 지냅니다.\n발바닥이 땅에 직접 닿는 일이 좀처럼 없습니다.\n\n오늘은 잠시 신발을 벗고 맨발로 땅을 밟아 봅니다.\n\n이 명상은 서서,\n그리고 걸으면서 합니다.\n눈은 편하게 뜬 채 시선을 발 앞쪽 바닥에 부드럽게 둡니다.\n\n발을 디딜 수 있는 평평하고 안전한 곳에 섭니다.\n맨발이 어려우면 양말을 신어도 괜찮습니다.\n\n먼저 그 자리에 가만히 서 봅니다.\n두 발을 어깨너비로 두고 무릎의 힘을 살며시 풉니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 두 발바닥으로 주의를 가만히 옮겨 봅니다.\n발이 땅에 닿아 있는 느낌을 느껴 봅니다.\n\n바닥의 온도가 전해집니다.\n서늘한지, 따뜻한지, 흙인지,\n풀인지 느껴 봅니다.\n\n잘 느껴지지 않아도 괜찮습니다.\n느껴지지 않는다는 것을 알아차리기만 하면 됩니다.\n\n이제 아주 천천히 한쪽 발에 몸무게를 실어 봅니다.\n반대쪽 발이 가벼워집니다.\n\n가벼워진 발을 천천히 들어 올립니다.\n발바닥이 땅에서 떨어지는 순간을 느낍니다.\n\n그 발을 앞으로 옮겨 천천히 내려놓습니다.\n발뒤꿈치, 발바닥,\n발가락 순으로 땅에 닿습니다.\n\n이제 반대쪽 발도 같은 방식으로 천천히 옮깁니다.\n한 걸음, 또 한 걸음.\n\n서두르지 않습니다.\n한 걸음에 온 마음을 담습니다.\n땅과 발이 만나고 헤어지는 것을 느낍니다.\n\n걷다 보면 마음이 딴 데로 갑니다.\n그래도 괜찮습니다.\n다음 한 걸음이 나를 다시 데려옵니다.\n\n이제 발밑뿐 아니라 둘레로도 감각을 열어 봅니다.\n코끝에 흙냄새가 스칩니다.\n\n어디선가 새소리가 들려옵니다.\n바람이 발등과 뺨을 스쳐 갑니다.\n빠르게 걸을 때는 몰랐던 것들입니다.\n\n한 걸음씩 땅을 밟을 때마다 발바닥으로 대지가 나를 받쳐 줍니다.\n넘어지지 않도록,\n늘 그 자리에서.\n\n이렇게 두 발로 땅을 딛고 걸을 수 있다는 것이 새삼 고맙게 느껴집니다.\n\n가슴 한가운데가 조용히 따뜻해집니다.\n\n이제 걸음을 천천히 늦추어 다시 그 자리에 가만히 섭니다.\n\n두 발바닥이 땅에 닿은 느낌을 마지막으로 한 번 더 느껴 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n오늘 하루,\n바삐 걷다가 문득 생각나면 한 걸음만,\n온전히 땅을 밟아 봅니다.\n그거면 충분합니다.","duration":"약 9분","tags":"#걷기명상 #맨발걷기 #지금여기","series":"숨비명상"},{"id":"0","category":"수용","title":"가만히 듣기","body":"사람에게 귀는 둘,\n입은 하나입니다.\n어쩌면 말하기보다 듣기를 두 배로 하라는 뜻인지도 모릅니다.\n\n우리는 대개 내 말을 하고 싶어 합니다.\n그래서 정작 잘 듣는 일은 드뭅니다.\n\n오늘은 입을 잠시 쉬게 하고 두 귀를 활짝 열어 그저 듣기만 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n주변이 시끄러워도 괜찮습니다.\n반대로 너무 조용해도 괜찮습니다.\n어떤 소리든 그대로 두면 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 두 귀로 가만히 주의를 옮겨 봅니다.\n귀를 활짝 열어 둡니다.\n\n먼저 가까이 있는 소리를 들어 봅니다.\n내 숨소리,\n옷이 스치는 소리,\n가까운 어딘가의 작은 소리.\n\n이번엔 조금 더 멀리 들어 봅니다.\n방 밖의 소리,\n바깥을 지나는 소리,\n저 멀리서 오는 희미한 소리.\n\n소리를 붙잡지 않습니다.\n소리에 좋다 싫다 이름을 붙이지 않습니다.\n그저 오고 가게 둡니다.\n\n어느새 소리에 이름을 붙이고 판단하고 있어도 괜찮습니다.\n알아차린 순간,\n다시 가만히 듣기로 돌아옵니다.\n\n소리와 소리 사이,\n잠깐의 고요도 들어 봅니다.\n아무 소리가 없다면,\n그 고요를 듣고 있는 것입니다.\n\n이제 귀를 안으로 돌려 봅니다.\n평소 잘 듣지 못했던 내 안의 소리를 들어 봅니다.\n\n가슴이 뛰는 소리,\n숨이 드나드는 소리,\n오늘 하루 고단했던 마음의 소리.\n\n그 마음에게 답하거나 고치려 하지 않습니다.\n그저 '그랬구나' 하고 끝까지 들어 줍니다.\n\n누군가 내 말을 끝까지 들어줄 때 오랜 친구를 만난 듯 마음이 놓입니다.\n지금 나는 나에게 그 친구가 되어 주고 있습니다.\n\n가슴 한가운데가 조용히 따뜻해집니다.\n\n이 편안한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 누군가 말을 건네면 답을 서두르기 전에 숨을 한 번 쉬며 조금 더 들어 봅니다.\n그 한 박자가 마음을 엽니다.","duration":"","tags":"#듣기명상 #소리명상 #마음챙김","series":"숨비명상"},{"id":"a09594a0","category":"수용","title":"가만히 듣기","body":"사람에게 귀는 둘,\n입은 하나입니다.\n어쩌면 말하기보다 듣기를 두 배로 하라는 뜻인지도 모릅니다.\n\n우리는 대개 내 말을 하고 싶어 합니다.\n그래서 정작 잘 듣는 일은 드뭅니다.\n\n오늘은 입을 잠시 쉬게 하고 두 귀를 활짝 열어 그저 듣기만 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n주변이 시끄러워도 괜찮습니다.\n반대로 너무 조용해도 괜찮습니다.\n어떤 소리든 그대로 두면 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 두 귀로 가만히 주의를 옮겨 봅니다.\n귀를 활짝 열어 둡니다.\n\n먼저 가까이 있는 소리를 들어 봅니다.\n내 숨소리,\n옷이 스치는 소리,\n가까운 어딘가의 작은 소리.\n\n이번엔 조금 더 멀리 들어 봅니다.\n방 밖의 소리,\n바깥을 지나는 소리,\n저 멀리서 오는 희미한 소리.\n\n소리를 붙잡지 않습니다.\n소리에 좋다 싫다 이름을 붙이지 않습니다.\n그저 오고 가게 둡니다.\n\n어느새 소리에 이름을 붙이고 판단하고 있어도 괜찮습니다.\n알아차린 순간,\n다시 가만히 듣기로 돌아옵니다.\n\n소리와 소리 사이,\n잠깐의 고요도 들어 봅니다.\n아무 소리가 없다면,\n그 고요를 듣고 있는 것입니다.\n\n이제 귀를 안으로 돌려 봅니다.\n평소 잘 듣지 못했던 내 안의 소리를 들어 봅니다.\n\n가슴이 뛰는 소리,\n숨이 드나드는 소리,\n오늘 하루 고단했던 마음의 소리.\n\n그 마음에게 답하거나 고치려 하지 않습니다.\n그저 '그랬구나' 하고 끝까지 들어 줍니다.\n\n누군가 내 말을 끝까지 들어줄 때 오랜 친구를 만난 듯 마음이 놓입니다.\n지금 나는 나에게 그 친구가 되어 주고 있습니다.\n\n가슴 한가운데가 조용히 따뜻해집니다.\n\n이 편안한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 누군가 말을 건네면 답을 서두르기 전에 숨을 한 번 쉬며 조금 더 들어 봅니다.\n그 한 박자가 마음을 엽니다.","duration":"약 8분","tags":"#듣기명상 #소리명상 #마음챙김","series":"숨비명상"},{"id":"ec4fc5b9","category":"수용","title":"가슴에 손을","body":"우리는 하루의 많은 시간을 머릿속에서 보냅니다.\n따지고, 계산하고,\n판단합니다.\n\n그런데 어떤 것은 머리로는 끝내 이해되지 않다가 가슴으로는 단번에 느껴지기도 합니다.\n\n오늘은 잠시 머리에서 가슴으로 천천히 내려와 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n머릿속이 여전히 바쁘게 돌아가도 괜찮습니다.\n생각이 꼬리를 물어도 괜찮습니다.\n그저 잠시 그대로 두면 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 한 손을 가만히 가슴 한가운데 얹어 봅니다.\n손바닥의 온기가 가슴에 전해집니다.\n\n손 아래에서 가슴이 천천히 오르내립니다.\n그 안쪽 어딘가에서 심장이 조용히 뛰고 있습니다.\n\n잘 느껴지지 않아도 괜찮습니다.\n손이 가슴에 닿아 있다는 것만 알아차리면 됩니다.\n\n이제 머릿속에 머물던 주의를 숨을 내쉴 때마다 조금씩 가슴 쪽으로 내려 봅니다.\n\n생각이 자꾸 머리로 올라가도 괜찮습니다.\n알아차린 순간,\n다시 숨을 따라 가슴으로 내려옵니다.\n\n이 따뜻한 자리에서 지난날의 나를 하나 떠올려 봅니다.\n힘들고 외로웠던 어느 순간의 나입니다.\n\n아주 아픈 기억은 오늘 꺼내지 않아도 됩니다.\n작고 사소한 것 하나면 충분합니다.\n\n그때의 나를 분석하거나 나무라지 않습니다.\n그저 '많이 힘들었지' 하고 가슴으로 안아 줍니다.\n\n이제 다른 한 사람을 떠올려 봅니다.\n그 사람도 살아오면서 나와 비슷한 아픔을 겪었을 것입니다.\n\n그 마음을 머리로 헤아리는 대신 가슴으로 가만히 느껴 봅니다.\n'당신도 그 마음 알겠구나.' '나와 그리 다르지 않구나.'\n\n그렇게 느끼는 순간 두 마음 사이의 거리가 조금 가까워집니다.\n\n가슴 한가운데가 잔잔하게 따뜻해집니다.\n\n이 따뜻함을 그대로 지녀 봅니다.\n가슴에 얹은 손의 무게를 한 번 더 느껴 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 손을 천천히 내리고 눈을 떠 봅니다.\n\n오늘 누군가를 머리로 판단하게 될 때,\n숨을 한 번 가슴으로 내리며 '나도 그런 적 있지' 하고 떠올려 봅니다.","duration":"약 8분","tags":"#가슴명상 #공감 #자기연민","series":"숨비명상"},{"id":"0cf690a6","category":"자비희사","title":"정성 한 줌","body":"옛이야기 하나를 들려 드립니다.\n\n아주 가난한 한 여인이 가진 것을 다 털어 겨우 동전 두 닢을 마련했습니다.\n\n그 돈으로 작은 등불 하나를 밝혔습니다.\n부자들은 크고 화려한 등불을 수없이 내걸었습니다.\n\n밤이 깊어 부자들의 등불이 하나둘 꺼져 갈 때에도 여인의 작은 등불만은 끝까지 환했습니다.\n\n크기가 아니라 그 안에 담긴 정성이 그 불을 오래 지킨 것입니다.\n\n오늘은 그 마음,\n작지만 정성 담긴 마음을 가만히 느껴 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 차분해집니다.\n\n이제 지난날을 떠올려 봅니다.\n누군가 내게 건넨 작지만 따뜻했던 것 하나를.\n\n비싼 선물이 아니어도 좋습니다.\n따뜻한 말 한마디,\n꾹꾹 눌러쓴 짧은 쪽지,\n나눠 준 밥 한 술.\n\n잘 떠오르지 않아도 괜찮습니다.\n떠올리려 한 그 마음만으로도 가슴이 조금 데워집니다.\n\n값이 얼마였는지는 기억나지 않습니다.\n다만 그 안에 담긴 마음은 지금도 따뜻하게 남아 있습니다.\n\n이제 가만히 내 두 손을 느껴 봅니다.\n이 손도 그런 따뜻함을 건넬 수 있습니다.\n\n값비싼 것이 아니어도 됩니다.\n오늘 누군가에게 건넬 정성 어린 말 한마디,\n작은 도움 하나를 떠올려 봅니다.\n\n그 마음을 두 손에 가만히 모아 봅니다.\n크지 않아도 정성이 담기면 오래 빛납니다.\n\n문득 이런 생각이 듭니다.\n나의 값어치는 내가 가진 것에 있지 않다는 것.\n\n무엇을 걸치고 무엇을 지녔는지가 아니라 지금 내가 내는 마음과 행동이 나를 귀하게 한다는 것.\n\n가만히 속삭여 봅니다.\n'나는 가진 것으로 값이 매겨지지 않습니다.' '내 마음이 나를 귀하게 합니다.'\n\n가슴 한가운데가 잔잔하게 따뜻해집니다.\n\n이 따뜻함을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 하루 한 가지 일을 값이 아니라 정성으로 해 봅니다.\n작아도 마음을 담으면 그것으로 충분합니다.","duration":"약 8분","tags":"#정성명상 #나눔 #자기존중","series":"숨비명상"},{"id":"467f69d2","category":"탈중심화","title":"껍질을 벗다","body":"우리는 저마다 여러 겹의 껍질을 입고 삽니다.\n\n무슨 일을 하는 사람인지,\n어떤 자리에 있는지,\n누구의 윗사람이고 아랫사람인지.\n\n그 껍질이 나를 지켜 주는 것 같지만,\n가만 보면 꽤나 무겁습니다.\n\n오늘은 잠시 그 무거운 껍질을 하나씩 벗어 보는 시간을 가져 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n몸이 조금씩 편안해집니다.\n\n이제 내가 걸치고 있는 껍질들을 가만히 떠올려 봅니다.\n\n'나는 이런 사람이다',\n'나는 이 정도는 되는 사람이다',\n'나는 이런 대접을 받아야 한다'.\n\n그 마음들이 어깨와 가슴을 무겁게 누르고 있습니다.\n\n이제 그 껍질을 무거운 겉옷을 벗듯 천천히 한 겹 벗어 봅니다.\n\n내 직함이라는 껍질을 벗습니다.\n남보다 위에 있으려는 마음을 벗습니다.\n지지 않으려는 자존심도 내려놓습니다.\n\n한 겹 벗을 때마다 어깨가 조금씩 가벼워집니다.\n잘 벗겨지지 않아도 괜찮습니다.\n벗으려는 그 마음만으로도 이미 가볍습니다.\n\n껍질을 다 내려놓고 나면 그 안에 남는 것은 그저 담백한 한 사람입니다.\n\n지킬 것도,\n내세울 것도 없는 가볍고 편안한 나입니다.\n\n이 사람은 누구보다 높지도 낮지도 않습니다.\n스치는 모든 사람과 똑같은 숨을 쉬는 한 사람입니다.\n\n이제 그 가벼운 마음으로 누군가를 향해 고개를 아주 살짝 숙여 봅니다.\n\n낮춘다고 잃는 것은 없습니다.\n오히려 마음이 더 넓어지고 상대도 나를 편안하게 바라봅니다.\n\n가슴 한가운데가 조용히 따뜻해집니다.\n\n문득 알게 됩니다.\n나를 귀하게 하는 것은 걸친 껍질이 아니라 지금 내가 하는 행동이라는 것을.\n\n이 가볍고 따뜻한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 자존심이 뾰족하게 솟는 순간이 오면,\n껍질 한 겹을 슬며시 벗고 고개를 조금 숙여 봅니다.\n그럴수록 마음은 더 가벼워집니다.","duration":"약 8분","tags":"#내려놓기 #겸손 #마음챙김","series":"숨비명상"},{"id":"60f450d5","category":"탈중심화","title":"물처럼","body":"옛말은 이렇게 전합니다.\n가장 좋은 것은 물과 같다고.\n\n물은 누구와도 다투지 않고,\n억지로 밀어붙이지 않으며,\n낮은 곳으로 흘러 만물을 이롭게 한다고 합니다.\n\n오늘은 그 물의 마음을 가만히 따라가 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n오늘 부딪치고 다투느라 지쳐 있어도 괜찮습니다.\n그 마음도 그대로 데려와도 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 온몸이 부드러워집니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n어깨의 힘이 스르르 풀립니다.\n\n이제 산속의 작은 개울을 떠올려 봅니다.\n맑은 물이 돌 사이를 지나 흘러갑니다.\n\n졸졸 흐르는 물소리가 들립니다.\n손을 담그면 서늘하고 부드럽습니다.\n\n물이 흐르다 커다란 바위를 만납니다.\n그런데 물은 멈춰 서서 다투지 않습니다.\n\n몸을 낮추고 스르르 바위를 돌아 아무 일 없다는 듯 다시 흘러갑니다.\n\n물은 서두르지 않습니다.\n높은 곳을 탐하지 않고 늘 낮은 곳으로 흘러갑니다.\n\n이제 요즘 나를 자꾸 막아서는 어떤 일 하나를 떠올려 봅니다.\n아주 힘든 것은 오늘 꺼내지 않아도 됩니다.\n\n그 일 앞에서 나는 자주 몸이 단단하게 굳고 맞서 밀어붙이려 했습니다.\n\n이번에는 물이 되어 봅니다.\n숨을 내쉬며 몸을 부드럽게 풀고,\n그 앞에서 딱딱해지는 대신 스르르 에둘러 흘러가 봅니다.\n\n굳이 부수지 않아도 됩니다.\n부드러운 물도 오랜 시간이 지나면 가장 단단한 돌을 둥글게 다듬습니다.\n\n흐르는 동안에도 물의 속은 못처럼 고요합니다.\n그 물은 지나는 자리마다 풀과 나무를 조용히 적셔 줍니다.\n\n애쓰지 않아도 그저 흐르는 것만으로 곁을 이롭게 합니다.\n\n가슴 한가운데가 잔잔하게 편안해집니다.\n\n이 부드럽고 고요한 느낌을 그대로 지녀 봅니다 손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 무언가와 맞서 굳어지려는 순간이 오면,\n숨을 한 번 내쉬며 몸을 풀고,\n물처럼 부드럽게 돌아 흘러가 봅니다.","duration":"약 8분","tags":"#물명상 #부드러움 #내려놓기","series":"숨비명상"},{"id":"ad6b1932","category":"수면·이완","title":"두 번째 화살","body":"살다 보면 뜻밖의 일이 불쑥 날아와 마음을 찌릅니다.\n\n누군가의 말 한마디,\n갑자기 틀어진 일.\n그것이 첫 번째 화살입니다.\n\n첫 번째 화살은 살아 있는 한 피하기 어렵습니다.\n\n그런데 우리는 종종 그 위에 두 번째 화살을 쏩니다.\n'왜 나한테만',\n'어떻게 그럴 수가' 하며 스스로를 한 번 더 찌릅니다.\n\n오늘은 그 두 번째 화살을 내려놓는 연습을 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 차분해집니다.\n\n이제 최근에 있었던 작은 짜증 하나를 떠올려 봅니다.\n아주 큰 일은 오늘 꺼내지 않아도 됩니다.\n\n그 일을 떠올리면 가슴이 조금 조여들지도 모릅니다.\n그 느낌을 밀어내지 말고 그대로 둡니다.\n\n이제 앵무새가 되어 봅니다.\n앵무새는 들은 말을 아무 감정 없이 그대로 옮깁니다.\n\n그 일을 있는 그대로,\n짧게 한 문장으로 말해 봅니다.\n그리고 끝에 '-구나'를 붙입니다.\n\n'그 사람이 그렇게 말했구나.' '그 일이 그렇게 되었구나.' 덧붙이지 않고,\n딱 그만큼만.\n\n그렇게 소리 내어 보면 부풀어 있던 화가 조금 납작해집니다.\n\n여전히 화가 남아 있어도 괜찮습니다.\n그러면 이번엔 상대의 자리에 잠깐 서 봅니다.\n\n그 사람도 무슨 사정이 있었겠지.\n급하고 지치고 서툴렀겠지.\n끝에 '-겠지'를 붙여 봅니다.\n\n옳다고 하려는 게 아닙니다.\n그저 꽉 쥔 마음을 조금 느슨하게 푸는 것입니다.\n\n그래도 앙금이 남으면 마지막으로 이렇게 말해 봅니다.\n'그래도 이만하길 다행이다.'\n\n더 나쁠 수도 있었는데 이 정도로 지나간 것에 작은 고마움을 얹어 봅니다.\n\n가만히 보니 처음의 따끔함은 작았는데,\n내가 얹은 두 번째 화살이 더 컸습니다.\n\n그 화살을 손에서 내려놓으니 마음이 한결 가벼워집니다.\n\n이런 짜증은 나만 겪는 게 아닙니다.\n누구나 저마다의 화살을 맞으며 삽니다.\n그렇게 생각하니 남의 마음도 조금 애틋해집니다.\n\n가슴 한가운데가 잔잔하게 편안해집니다.\n\n이 가벼운 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 문득 화가 치미는 순간이 오면,\n숨을 한 번 쉬고 '아, 이런 일이 있었구나' 하고 있는 그대로 읊조려 봅니다.","duration":"약 8분","tags":"#화다스리기 #두번째화살 #마음챙김","series":"숨비명상"},{"id":"6e8680ac","category":"수용","title":"저마다의 꽃","body":"우리는 자주 '다르다'를 '틀리다'라고 말합니다.\n\n'네 생각은 나와 틀려',\n'저 사람은 틀렸어'.\n사실은 다른 것뿐인데 자꾸 틀렸다고 합니다.\n\n'틀리다'에는 옳고 그름의 판단이 들어 있습니다.\n나는 옳고 너는 그르다는 마음이지요.\n\n오늘은 그 판단을 잠시 내려놓고 '다름'을 있는 그대로 바라보는 연습을 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 부드러워집니다.\n\n이제 봄날의 과수원을 떠올려 봅니다.\n넓은 밭에 온갖 꽃이 한데 어우러져 피어 있습니다.\n\n하얀 배꽃,\n발그레한 복숭아꽃,\n연분홍 사과꽃이 저마다의 빛깔로 피어 있습니다.\n\n벌은 분주하게 날아다니고 나비는 한가로이 팔랑입니다.\n꽃향기가 은은하게 코끝에 스칩니다.\n\n만약 이 밭에 똑같은 꽃 한 종류만 있다면 어땠을까요.\n\n보기에 단조롭고 어딘가 허전했을 것입니다.\n서로 다르기에 이 풍경이 이토록 아름답습니다.\n\n어느 꽃도 다른 꽃을 틀렸다고 하지 않습니다.\n그저 저마다의 자리에서 저마다의 모양으로 피어 있을 뿐입니다.\n\n이제 요즘 나와 너무 달라 불편했던 한 사람을 떠올려 봅니다.\n\n그 사람도 이 밭의 한 송이입니다.\n나와 색이 다른 꽃일 뿐,\n틀린 꽃이 아닙니다.\n\n마음속으로 가만히 바꿔 말해 봅니다.\n'저 사람은 틀린 게 아니라 나와 다른 것이구나.'\n\n그렇게 말하니 팽팽하던 마음이 조금 풀립니다.\n\n이번엔 나 자신을 봅니다.\n남들과 달라 마음 쓰였던 나의 어떤 점도 틀린 것이 아닙니다.\n\n그저 이 세상에 보태진 또 하나의 다른 빛깔입니다.\n\n여러 빛깔이 어우러져 비로소 온전한 꽃밭이 됩니다.\n\n가슴 한가운데가 잔잔하게 따뜻해집니다.\n\n이 넉넉한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 '저건 틀렸어'라는 말이 떠오르면,\n숨을 한 번 쉬고 '아, 그저 다르구나' 하고 살며시 바꿔 봅니다.","duration":"약 7분","tags":"#다름명상 #있는그대로 #마음챙김","series":"숨비명상"},{"id":"e8e34e27","category":"관찰","title":"벚꽃 아래서","body":"봄날은 참 빨리 지나갑니다.\n활짝 핀 벚꽃도 며칠이면 바람에 흩어집니다.\n\n곧 진다는 것을 알기에 그 꽃이 더 애틋하고 예쁩니다.\n\n우리 곁의 사람도 어쩌면 그와 같습니다.\n늘 있을 것 같지만 함께할 시간은 생각보다 짧습니다.\n\n오늘은 잠시 소중한 한 사람을 마음에 초대해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 포근해집니다.\n\n이제 활짝 핀 벚나무 아래를 떠올려 봅니다.\n연분홍 꽃이 가득 피어 있고 따뜻한 봄바람이 붑니다.\n\n꽃잎이 하나둘 천천히 흩날려 내립니다.\n공기에서 은은한 꽃향기가 납니다.\n\n그 나무 아래 내가 아끼는 한 사람이 함께 있습니다.\n가족이든, 벗이든,\n누구든 좋습니다.\n\n지금 곁에 없는 사람이어도,\n이미 멀리 떠난 사람이어도 괜찮습니다.\n마음속에서는 지금 여기 함께 있습니다.\n\n그 사람의 얼굴을 가만히 바라봅니다.\n평소 바빠서 그냥 지나쳤던 작은 모습들이 눈에 들어옵니다.\n\n웃을 때 지는 잔주름,\n익숙한 목소리,\n나를 챙겨 주던 사소한 손길.\n\n꽃잎이 지는 것을 보며 문득 이런 마음이 듭니다.\n이 사람과의 시간도 영원하지는 않겠구나.\n\n그렇게 생각하니 지금 이 순간이 더없이 귀하게 느껴집니다.\n\n혹시 그동안 전하지 못하고 미뤄 둔 말이 있다면 마음속으로 조용히 건네 봅니다.\n\n'고마워요.' '많이 아꼈어요.' 말이 어색해도 괜찮습니다.\n\n가슴 한가운데가 따뜻하게,\n그러면서도 뭉클하게 차오릅니다.\n\n그 사람도 꽃잎처럼 흩어질 이 봄을 나와 함께 걷고 있습니다.\n\n이 따뜻한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 곁에 있는 사람에게 평소 아껴 두었던 따뜻한 말 한마디를 건네 봅니다.\n그 얼굴을 한 번 더 바라봐 줍니다.","duration":"약 8분","tags":"#사랑명상 #소중한사람 #봄날","series":"숨비명상"},{"id":"f3b3a635","category":"수용","title":"마음 여인숙","body":"우리 마음은 작은 여인숙과 같습니다.\n\n기쁨, 걱정, 화, 슬픔,\n평온.\n여러 감정이 나그네처럼 찾아왔다가 또 떠나갑니다.\n\n우리는 흔히 반가운 손님만 붙잡아 두고 불편한 손님은 문을 쾅 닫아 내쫓으려 합니다.\n\n하지만 여인숙은 찾아온 손님을 막을 수 없습니다.\n오늘은 그 손님들을 가만히 맞이하는 연습을 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 차분해집니다.\n\n이제 지금 내 마음에 어떤 손님이 와 있는지 살펴봅니다.\n\n들뜸일 수도, 피곤함일 수도,\n옅은 슬픔이나 조바심일 수도 있습니다.\n아무 감정이 없다면,\n그 고요함이 오늘의 손님입니다.\n\n그 감정에게 가만히 이름을 붙여 봅니다.\n'아, 걱정이 왔구나.' '조금 지쳐 있구나.'\n\n밀어내지도,\n붙잡지도 않습니다.\n그저 '어서 와' 하고 자리를 내어 줍니다.\n\n그 감정이 몸의 어디쯤 머무는지 느껴 봅니다.\n가슴인지, 목인지, 배인지.\n그 자리를 따뜻하게 그냥 둡니다.\n\n손님은 영원히 머물지 않습니다.\n때가 되면 스스로 일어나 떠나갑니다.\n이 감정도 그렇게 지나갈 것입니다.\n\n불편한 손님이 와도 괜찮습니다.\n걱정도,\n화도 잠시 머물다 갈 나그네입니다.\n계속 붙들고 대접하지 않아도,\n문을 걸어 잠그지 않아도 됩니다.\n\n혹시 너무 크고 아픈 감정이 밀려오면 눈을 뜨고 주변의 소리를 들어도 됩니다.\n그것은 물러섬이 아니라 지혜입니다.\n가장 힘든 손님은 오늘 부르지 않아도 됩니다.\n\n손님들이 오가는 동안에도 여인숙은 늘 그 자리에 있습니다.\n나도 그렇습니다.\n\n나는 스쳐 가는 감정이 아니라,\n그 감정을 맞이하고 배웅하는 조용한 집입니다.\n\n그렇게 생각하니 마음 한가운데가 잔잔하고 든든해집니다.\n\n이 편안한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 어떤 감정이 불쑥 찾아오면,\n'어서 와' 하고 자리를 내어 주고,\n때가 되면 떠나가도록 가만히 지켜봐 줍니다.","duration":"약 8분","tags":"#감정명상 #받아들임 #마음챙김","series":"숨비명상"},{"id":"41dc2db5","category":"멈춤","title":"빈 의자","body":"살다 보면 가슴에 전하지 못한 말이 남습니다.\n\n먼저 떠나보낸 사람에게,\n혹은 멀어진 누군가에게.\n얼굴을 마주하고는 끝내 하지 못한 말들입니다.\n\n그 말은 밖으로 나오지 못한 채 오래 앙금으로 남기도 합니다.\n\n오늘은 마음속 조용한 방에서 그 말을 가만히 꺼내 봅니다.\n\n먼저 안내를 드립니다.\n이 시간은 깊은 감정을 건드릴 수 있습니다.\n\n상처가 아주 깊거나 이별이 얼마 되지 않았다면,\n믿을 만한 사람이나 전문가와 함께하는 편이 더 좋습니다.\n\n하다가 너무 힘들면 언제든 눈을 뜨고 발바닥과 주변 소리를 느껴도 됩니다.\n멈추는 것은 물러섬이 아니라 지혜입니다.\n\n그리고 가장 힘든 사람은 오늘 부르지 않아도 됩니다.\n지금 마주할 수 있는 만큼만 합니다.\n\n편안한 곳에 앉아 봅니다.\n마음이 불안하면 눈을 반쯤 뜬 채로 있어도 좋습니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n발바닥이 바닥에 닿아 있는 것을 느낍니다.\n나는 지금 안전한 이 자리에 있습니다.\n\n이제 마음속에 조용하고 따뜻한 방 하나를 그려 봅니다.\n햇살이 부드럽게 드는 방입니다.\n\n그 방에 의자 두 개가 놓여 있습니다.\n나는 한 의자에 앉아 있고,\n맞은편 의자는 비어 있습니다.\n\n그 빈 의자에 오늘 만나고 싶은 한 사람을 가만히 초대해 봅니다.\n\n먼저 떠난 그리운 사람일 수도,\n사이가 멀어진 누군가일 수도 있습니다.\n아무도 부르고 싶지 않다면,\n그냥 빈 의자를 바라보며 숨만 쉬어도 괜찮습니다.\n\n그 사람이 맞은편 의자에 편안한 얼굴로 앉아 있다고 그려 봅니다.\n나를 조용히,\n다정하게 바라봅니다.\n\n이제 그동안 가슴에만 담아 둔 말을 천천히 건네 봅니다.\n\n고마웠다는 말,\n사랑했다는 말,\n미안했다는 말,\n혹은 서운했다는 말.\n\n몇 마디밖에 안 나와도 괜찮습니다.\n눈물이 나도 괜찮습니다.\n말이 잘 안 나오면 마음으로만 전해도 됩니다.\n\n충분히 건넸다면 이제 그 사람의 대답을 들어 봅니다.\n내가 가장 듣고 싶었던,\n가장 따뜻한 말로.\n\n'그건 네 잘못이 아니야.' '나는 여기서 편안하단다.' '네가 나를 얼마나 아꼈는지 다 안다.'\n\n그 말이 가슴에 오래 얹혀 있던 죄책감을 조금 가볍게 해 줍니다.\n\n혹시 나를 아프게 한 사람에게 화가 남아 있다면,\n그 마음도 억지로 없애지 않습니다.\n\n오늘 다 용서하지 않아도 됩니다.\n쥐고 있던 것을 아주 조금 내려놓는 것만으로도 그 무게에서 풀려나는 건 다름 아닌 나 자신입니다.\n\n이제 가만히 느껴 봅니다.\n그 사람은 완전히 사라진 것이 아닙니다.\n내 말투 속에,\n내 습관 속에,\n그가 남긴 것들 속에 여전히 함께 있습니다.\n\n나는 그를 가슴에 품고 살아갑니다.\n이어짐은 끊어지지 않았습니다.\n\n가슴 한가운데가 따뜻하고,\n조금은 홀가분해집니다.\n\n이제 그 사람에게 오늘은 여기까지라고 가만히 인사를 건넵니다.\n언제든 이 방에서 다시 만날 수 있습니다.\n\n방의 문을 조용히 닫습니다.\n다시 지금 이 자리로 돌아옵니다.\n\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n내가 듣고 싶었던 그 따뜻한 말은 이미 내 안에 있습니다.\n힘든 날이면 언제든 이 조용한 방으로 돌아와도 됩니다.","duration":"약 10분","tags":"#화해명상 #슬픔다독임 #마음챙김","series":"숨비명상"},{"id":"5c3a5ac0","category":"자비희사","title":"먼저 인사","body":"낯선 사람과 마주치면 우리는 흔히 시선을 피합니다.\n\n괜히 어색해서,\n아는 사이도 아니어서,\n그냥 지나칩니다.\n\n사람과 사람 사이에는 눈에 보이지 않는 얇은 벽이 서 있는 것 같습니다.\n\n그런데 그 벽은 작은 웃음 하나면 의외로 쉽게 허물어집니다.\n\n오늘은 그 벽을 낮추고 먼저 인사를 건네는 마음을 가만히 연습해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n얼굴의 힘도 살며시 풀립니다.\n\n이제 익숙한 어느 장면을 떠올려 봅니다.\n엘리베이터 안, 버스 안,\n자주 가는 가게 안.\n\n그곳에 잘 모르는 한 사람이 있습니다.\n평소 같으면 슬쩍 시선을 돌렸을 것입니다.\n\n두 사람 사이에 그 얇은 벽이 느껴집니다.\n어색함이라는 벽입니다.\n\n이번에는 조금 다르게 해 봅니다.\n얼굴을 부드럽게 하고,\n그 사람과 같은 눈높이에서 가만히 바라봅니다.\n\n내려다보지도,\n올려다보지도 않습니다.\n나와 똑같이 귀한 한 사람으로 바라봅니다.\n\n그리고 아주 작게 먼저 웃어 봅니다.\n'안녕하세요.' 마음속으로 가볍게 건네 봅니다.\n\n그러자 그 얇은 벽이 스르르 옅어집니다.\n상대도 옅게 웃어 줍니다.\n\n두 사람 사이로 따뜻한 기운이 오갑니다.\n웃음이 웃음을 부릅니다.\n\n이제 다른 얼굴도 떠올려 봅니다.\n이웃 한 사람,\n가게에서 마주친 사람,\n길에서 스친 사람.\n\n한 사람 한 사람에게 차례로 먼저 웃음을 건네 봅니다.\n어색해도 괜찮습니다.\n건네려는 그 마음만으로 충분합니다.\n\n먼저 웃음을 건네는 데는 아무것도 들지 않습니다.\n그런데 신기하게도 내 가슴이 먼저 따뜻해집니다.\n\n돌아보면 우리는 그리 멀리 떨어져 있지 않습니다.\n벽은 처음부터 그리 두껍지 않았습니다.\n\n가슴 한가운데가 잔잔하게 따뜻해집니다.\n\n이 따뜻한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 누군가와 마주치면 눈높이를 맞추고 아주 작게 먼저 웃어 봅니다.\n그 한 번이 벽을 허뭅니다.","duration":"약 8분","tags":"#관계명상 #먼저웃기 #연결","series":"숨비명상"},{"id":"858997d7","category":"탈중심화","title":"문 밖의 햇살","body":"가끔 정체 모를 두려움이 우리를 안에 가둡니다.\n\n무엇이 무서운지도 모른 채 그저 마음이 오그라들고 한 걸음도 나서지 못합니다.\n\n두려움은 등을 돌리고 바라보지 않을 때 가장 크게 부풀어 오릅니다.\n\n오늘은 그 두려움을 가만히 마주 보는 연습을 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n불안하면 눈을 감지 않아도 됩니다.\n시선을 바닥에 부드럽게 두어도 좋습니다.\n\n두 발이 바닥에 닿아 있습니다.\n나는 지금 안전한 이 자리에 있습니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n바닥이 나를 단단히 받쳐 줍니다.\n\n이제 마음속에 조금 어둑한 방 하나를 떠올려 봅니다.\n창밖에는 환한 빛이 있는데,\n어쩐지 나갈 엄두가 나지 않습니다.\n\n방 한구석에 무거운 그림자 같은 것이 있습니다.\n요즘 나를 눌러 온 두려움입니다.\n\n그 느낌이 몸의 어디에 있는지 살펴봅니다.\n가슴이 조이는지,\n속이 답답한지,\n어깨가 굳어 있는지.\n\n밀어내려 하지 않습니다.\n그저 거기 있구나,\n하고 바라봅니다.\n\n지금까지 나는 그 그림자에 자꾸 등을 돌렸습니다.\n그럴수록 그것은 더 크고 무섭게 느껴졌습니다.\n\n이번에는 천천히 그쪽으로 몸을 돌려 가만히 바라봅니다.\n\n나무라지 않고,\n겁내지도 않고,\n그저 궁금한 눈으로.\n'무엇이 그렇게 두려웠을까?' 가만히 물어보고,\n잠시 기다립니다.\n\n정체가 또렷이 보이지 않아도 괜찮습니다.\n바라보려 한 것만으로 충분합니다.\n\n신기하게도 똑바로 바라보면 그 그림자는 조금씩 작아집니다.\n\n그것은 하나의 감정일 뿐,\n나의 전부가 아닙니다.\n그림자를 바라보고 있는 나는,\n그 그림자보다 큽니다.\n\n만약 그 느낌이 너무 커지면 눈을 뜨고 주변의 소리를 들어도 됩니다.\n멈추는 것은 물러섬이 아니라 지혜입니다.\n\n이제 조이던 것이 조금 느슨해집니다.\n숨이 한결 편안해집니다.\n\n가만히 일어나 방문 쪽으로 걸어가 봅니다.\n손잡이를 잡고,\n천천히 문을 엽니다.\n\n환한 햇살이 쏟아져 들어옵니다.\n눈이 부셔 잠시 눈을 가늘게 뜹니다.\n\n한 걸음,\n문 밖으로 나섭니다.\n멀리 푸른 산에서 불어온 맑은 공기가 코로 들어옵니다.\n어디선가 새소리가 들립니다.\n\n살아서 이 빛 속에 서 있다는 것이 새삼 고맙게 느껴집니다.\n\n그때 누군가 환하게 웃으며 인사를 건넵니다.\n나는 혼자 떠 있는 섬이 아니었습니다.\n\n가슴 한가운데가 따뜻하고 환하게 열립니다.\n\n이 밝은 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n막연한 두려움이 나를 가두려 할 때면,\n등을 돌리는 대신 가만히 마주 보고 '무엇이 두려운 걸까' 하고 물어봅니다.\n바라보는 나는,\n두려움보다 큽니다.","duration":"약 9분","tags":"#불안다독임 #두려움마주보기 #마음챙김","series":"숨비명상"},{"id":"129653a3","category":"용서감사","title":"봄볕에 녹다","body":"늘 곁에 있는 것은 공기처럼 잘 보이지 않습니다.\n\n우리를 키워 준 손길도 그렇습니다.\n너무 당연해서 헤아려 본 적이 드뭅니다.\n\n오늘은 그 보이지 않던 돌봄을 가만히 세어 보는 시간을 가져 봅니다.\n\n먼저 안내를 드립니다.\n부모나 가족과의 관계가 편치 않을 수도 있습니다.\n\n세상에 완벽한 부모는 없고,\n아픈 기억이 있다면 오늘은 무리하지 않아도 됩니다.\n\n꼭 부모가 아니어도 좋습니다.\n나를 돌봐 준 누군가를 떠올려도 되고,\n아무도 떠오르지 않으면 그저 숨만 쉬어도 괜찮습니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 부드러워집니다.\n\n이제 이른 봄날을 떠올려 봅니다.\n겨우내 얼어 있던 작은 개울이,\n따뜻한 볕에 가장자리부터 천천히 녹기 시작합니다.\n\n졸졸,\n물이 다시 흐르는 소리가 들립니다.\n오래 굳어 있던 가슴 어딘가도 그 볕에 조금씩 부드러워집니다.\n\n이 따뜻한 자리에서 내가 아주 어렸을 때 나를 돌봐 준 한 사람을 떠올려 봅니다.\n\n스스로 먹지도 못하던 때 누군가 나를 먹여 주었습니다.\n춥지 않도록 덮어 주었고,\n아플 때 밤새 곁을 지켰습니다.\n\n씻기고, 업고,\n걱정하던 손길이 셀 수 없이 많았습니다.\n오랜 세월 나는 그것을 세어 본 적이 없었습니다.\n\n그 사람도 완전하지 않았습니다.\n저마다의 상처와 서투름이 있었습니다.\n그래도 나를 이만큼 살게 한 돌봄이 분명히 있었습니다.\n\n하나씩 떠올릴 때마다 언 개울이 조금씩 더 풀리고,\n가슴에 따뜻한 물이 흐릅니다.\n\n가만히 마음속으로 '고맙습니다' 한마디를 얹어 봅니다.\n고마움이 잘 일어나지 않아도 괜찮습니다.\n떠올려 본 것만으로 충분합니다.\n\n혹시 가슴에 오래 언 채로 남은 서운함이 있다면,\n녹은 물에 아주 조금만 실어 흘려보내도 됩니다.\n\n힘든 것은 오늘 다 흘려보내지 않아도 됩니다.\n녹일 수 있는 만큼만 녹입니다.\n\n가슴 한가운데가 잔잔하게,\n따뜻하게 흐릅니다.\n\n이 따뜻한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 나를 돌봐 준 누군가에게 작은 '고맙습니다'를 건네 봅니다.\n멀리 있거나 곁에 없다면 마음속으로 전해도 됩니다.","duration":"약 9분","tags":"#감사명상 #가족 #마음챙김","series":"숨비명상"},{"id":"c77ecb39","category":"용서감사","title":"마음의 안경","body":"우리는 저마다 보이지 않는 안경을 끼고 사람을 바라봅니다.\n\n같은 사람도 어떤 안경으로 보느냐에 따라 전혀 다르게 보입니다.\n\n'고집불통'으로도,\n'심지가 곧은 사람'으로도.\n'권위적'으로도,\n'든든한 사람'으로도.\n\n오늘은 안경을 한번 바꿔 끼고,\n가까운 한 사람을 다시 바라보는 연습을 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 부드러워집니다.\n\n이제 가까운 한 사람을 떠올려 봅니다.\n가족이든, 오래된 벗이든,\n곁에 있는 사람이든.\n\n요즘 그 사람의 어떤 점이 자꾸 마음에 걸렸을지 모릅니다.\n아주 힘든 사람은 오늘 말고,\n조금 불편한 정도의 사람이면 됩니다.\n\n그 걸리는 점을 가만히 이름 붙여 봅니다.\n'잔소리가 많다',\n'고집이 세다',\n'무뚝뚝하다'.\n\n지금 나는 조금 흐려진 안경으로 그 사람을 보고 있는지도 모릅니다.\n\n이제 그 안경을 가만히 닦아 봅니다.\n그리고 같은 점을 다른 빛으로 바라봅니다.\n\n잔소리가 많은 것은 그만큼 나를 걱정하기 때문일 수 있습니다.\n고집이 센 것은 그만큼 심지가 곧기 때문일 수 있습니다.\n무뚝뚝함 속에는 서툰 다정함이 숨어 있을 수 있습니다.\n\n그 사람은 조금도 변하지 않았습니다.\n다만 내가 안경을 바꿔 꼈을 뿐인데,\n같은 모습이 조금 따뜻해 보입니다.\n\n이제 그 사람이 나에게 해 준 일 하나를 떠올려 봅니다.\n아주 작고 당연해 보이는 것이어도 좋습니다.\n\n따뜻한 밥 한 끼,\n말없이 챙겨 준 무언가,\n그저 곁에 있어 준 시간.\n\n떠올려 보면 받은 것이 생각보다 많습니다.\n가슴에 작은 고마움이 번집니다.\n\n마음속으로 평소 아껴 두었던 따뜻한 말 한마디를 그 사람에게 건네 봅니다.\n말이 어색해도 괜찮습니다.\n\n가슴 한가운데가 잔잔하게 따뜻해집니다.\n\n돌아보면 세상도,\n사람도 내가 낀 안경만큼 따뜻해지기도,\n차가워지기도 합니다.\n\n이 따뜻한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 누군가의 어떤 점이 거슬리면,\n안경을 한 번 닦고 그 안에 숨은 따뜻한 면을 찾아봅니다.\n그리고 다정한 말 한마디를 건네 봅니다.","duration":"약 8분","tags":"#관계명상 #다시보기 #감사","series":"숨비명상"},{"id":"7f1741a2","category":"탈중심화","title":"마음의 닻","body":"하루를 살다 보면 마음이 자꾸 밖으로 끌려 나갑니다.\n\n해야 할 일,\n남의 말 한마디,\n내게 없는 것들을 좇다 보면 어느새 나 자신에게서 멀리 떠내려와 있습니다.\n\n닻 없는 배가 파도에 이리저리 밀리는 것처럼요.\n\n오늘은 그 배에 닻을 내리고 나에게 돌아오는 연습을 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n몸이 조금씩 가라앉듯 편안해집니다.\n\n이제 넓은 바다 위 작은 배 한 척을 떠올려 봅니다.\n그 배가 바로 나입니다.\n\n크고 작은 파도가 밀려와 배를 이리저리 흔듭니다.\n바쁜 하루를 보내는 요즘 내 모습과 닮았습니다.\n\n전화 한 통에, 걱정 하나에,\n누군가의 말 한마디에 마음이 저 멀리 끌려갑니다.\n그렇게 나에게서 멀어집니다.\n\n이제 배에서 천천히 닻을 내려 봅니다.\n그 닻은 다름 아닌 지금 이 순간의 숨과 몸입니다.\n\n닻줄이 아래로,\n아래로 내려갑니다.\n바쁘던 머리에서 숨으로,\n엉덩이가 닿은 자리로,\n그 아래 단단한 바닥으로.\n\n무언가가 나를 붙잡아 줍니다.\n파도는 여전히 밀려오고 배는 여전히 흔들리지만,\n이제 멀리 떠내려가지는 않습니다.\n\n나는 내 자리 위에 가만히 머물러 있습니다.\n\n자꾸 파도에 휩쓸려 마음이 또 밖으로 나가도 괜찮습니다.\n알아차린 순간,\n닻줄을 따라 다시 돌아오면 됩니다.\n\n이 중심 잡힌 자리에서 나는 비로소 내 삶의 주인입니다.\n상황에 끌려다니는 것이 아니라,\n어떻게 대할지를 내 안에서 고를 수 있습니다.\n\n어디에 있든 이 닻은 늘 나와 함께 있습니다.\n북적이는 곳에서도,\n힘든 하루 속에서도 언제든 내릴 수 있습니다.\n\n가슴 한가운데가 잔잔하고 든든해집니다.\n\n이 안정된 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 마음이 밖으로 끌려 나가는 순간이 오면,\n숨을 한 번 쉬고 엉덩이가 닿은 자리를 느끼며 가만히 나에게 돌아옵니다.","duration":"약 8분","tags":"#중심잡기 #자기중심 #마음챙김","series":"숨비명상"},{"id":"48e33bf4","category":"자비희사","title":"진주","body":"조개 속에 작은 모래 한 알이 들어오면 조개는 아프고 쓰라립니다.\n\n그런데 조개는 그 모래를 뱉어내지 못합니다.\n대신 얇은 막으로 한 겹,\n또 한 겹 감쌉니다.\n\n그렇게 오랜 시간이 지나면 그 아픈 모래 한 알이 영롱한 진주가 됩니다.\n\n우리 마음의 상처도 때로는 그와 조금 닮았습니다.\n오늘은 그 이야기를 가만히 따라가 봅니다.\n\n먼저 안내를 드립니다.\n이 시간은 아픈 자리를 건드릴 수 있습니다.\n\n아직 생생하고 깊은 상처라면 오늘은 멀리서 바라보기만 해도 됩니다.\n힘들면 언제든 멈추고 주변 소리를 들어도 됩니다.\n그것은 지혜입니다.\n\n깊은 상처는 믿을 만한 사람이나 전문가와 함께 다루는 편이 좋습니다.\n\n편안한 곳에 앉아 봅니다.\n마음이 불안하면 눈을 반쯤 뜬 채로 있어도 좋습니다.\n\n두 발이 바닥에 닿아 있습니다.\n나는 지금 안전한 이 자리에 있습니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 차분해집니다.\n\n이제 지나온 날들 중 이제는 조금 아물어 가는 어떤 힘들었던 시간을 떠올려 봅니다.\n\n가장 깊은 상처는 오늘 말고,\n지금 가만히 바라볼 수 있는 그 정도의 것이면 됩니다.\n\n그 일을 여기서,\n조금 떨어져 가만히 바라봅니다.\n그때 참 아팠구나,\n하고 스스로를 다독여 봅니다.\n\n그 일이 일어난 것을 좋았다고 여기지 않아도 됩니다.\n다만 한 가지만 살펴봅니다.\n그 시간을 지나며 내 안에 무엇이 자랐을까.\n\n어쩌면 조금 더 단단해졌고,\n어쩌면 남의 아픔을 전보다 깊이 헤아리게 되었고,\n어쩌면 더 다정해졌는지도 모릅니다.\n\n그것들이 아픈 모래알을 감싼 한 겹 한 겹의 막입니다.\n\n그렇게 감싸이고 감싸여 그 상처는 내 안 어딘가에서 작은 진주가 되어 갑니다.\n\n아직 진주가 보이지 않아도 괜찮습니다.\n어떤 상처는 시간이 조금 더 필요합니다.\n지금은 조개가 여전히 감싸고 있는 중입니다.\n\n이 진주는 다른 누구의 것도 아닌 나만의 것입니다.\n나는 그저 견디기만 한 것이 아니라,\n그 안에서 무언가를 길러 낸 것입니다.\n\n가슴 한가운데가 아릿하면서도,\n따뜻하게 차오릅니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오래된 상처가 다시 아려 올 때면,\n가만히 떠올려 봅니다.\n조개는 아직 감싸는 중이고,\n그 안에서 진주가 익어 가고 있음을.","duration":"약 9분","tags":"#상처회복 #자기연민 #마음챙김","series":"숨비명상"},{"id":"926688ea","category":"수면·이완","title":"오늘을 내려놓고","body":"하루가 저물었습니다.\n오늘도 애쓰며 여기까지 왔습니다.\n\n이제 모든 것을 잠시 내려놓고 편안히 잠으로 건너가는 시간을 가져 봅니다.\n\n잠자리에 앉거나 누워 봅니다.\n편한 쪽으로 하면 됩니다.\n눈을 부드럽게 감습니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 하루의 무게가 조금씩 흘러나갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n어깨에서, 등에서,\n다리에서 힘이 스르르 빠져나갑니다.\n\n이제 오늘 하루를 천천히 되돌아봅니다.\n\n아침부터 지금까지 어떤 말을 하고,\n어떤 생각을 하고,\n어떻게 지냈는지 가만히 떠올려 봅니다.\n\n잘한 일도,\n아쉬운 일도 그저 있는 그대로 바라봅니다.\n오늘을 평가하려는 것이 아닙니다.\n그냥 하루를 배웅하는 것입니다.\n\n혹시 오늘 누군가에게 미안한 일이 있었다면,\n그 사람을 가만히 떠올리며 마음속으로 전합니다.\n'미안했어요.'\n\n이번엔 고마운 일을 떠올려 봅니다.\n오늘 나에게 건네진 작은 친절,\n따뜻한 말 한마디.\n그 사람에게 전합니다.\n'고마웠어요.'\n\n그리고 나 자신에게도 가만히 말해 줍니다.\n'오늘도 참 애썼어. 수고했어.'\n\n이제 오늘 만난 모든 이들을 마음에 품어 봅니다.\n그들 모두가 힘든 일에서 벗어나 편안하고 행복하기를 바랍니다.\n\n다가올 내일이 오늘보다 조금 더 지혜롭고 다정하기를 빕니다.\n\n이제 자리에 편안히 눕습니다.\n이불을 부드럽게 덮습니다.\n이불의 무게가 온몸을 포근하게 감쌉니다.\n\n두 손을 가만히 배 위에 올려 둡니다.\n손 아래에서 배가 천천히 부풀고 천천히 꺼집니다.\n\n그 오르내림을 가만히 느끼기만 하면 됩니다.\n잠이 바로 오지 않아도 괜찮습니다.\n생각이 떠오르면 다시 숨으로 돌아오면 됩니다.\n\n이제 숨을 따라 마음속으로 조용히 되뇌어 봅니다.\n들이쉬며,\n'편안하다.' 내쉬며,\n'고요하다.'\n\n편안하다……\n고요하다……\n\n숨이 점점 느려집니다.\n말도 점점 잦아듭니다.\n\n편안하다……\n\n고요하다……\n\n몸이 이불 속으로 조금씩 가라앉습니다.\n\n편안하다……\n\n그저……\n\n이대로……","duration":"약 12분","tags":"#수면명상 #하루마무리 #미고사","series":"숨비명상"},{"id":"0d290f90","category":"용서감사","title":"오늘을 열며","body":"아침,\n막 잠에서 깨어났습니다.\n곧 바쁜 하루가 시작되겠지만,\n그 전에 잠깐,\n오늘을 다정하게 여는 시간을 가져 봅니다.\n\n아직 자리에 누운 채로 시작합니다.\n서두르지 않아도 됩니다.\n\n먼저 천천히 세 번 깊게 숨을 쉬어 봅니다.\n들이쉬고…… 내쉬고.\n들이쉬고…… 내쉬고.\n들이쉬고…… 내쉬고.\n\n이렇게 오늘 아침 다시 눈을 떴다는 것,\n살아서 새 하루를 맞았다는 것.\n그것만으로도 참 고마운 일입니다.\n마음속으로 가만히 말해 봅니다.\n'고맙다. 오늘도 깨어났구나.'\n\n이제 한 손으로 머리부터 천천히 쓸어내려 봅니다.\n이마와 얼굴, 목과 어깨,\n가슴과 배, 다리와 발끝까지.\n\n밤새 쉬지 않고 나를 살려 준 이 몸에게 고마움을 전합니다.\n'고마워. 오늘도 잘 부탁해.'\n\n이제 두 팔로 나 자신을 가만히 안아 봅니다.\n어깨를 토닥토닥 두드려 줍니다.\n\n'오늘 하루도 나에게, 그리고 만나는 사람들에게 조금 더 다정하게 대하자.'\n\n창밖을 떠올려 봅니다.\n새 아침의 빛이 천천히 밝아 오고 있습니다.\n어제와는 다른,\n오늘의 빛입니다.\n\n오늘 하루,\n내가 어떤 말을 하는지,\n어떤 생각을 하는지,\n어떤 행동을 하는지 순간순간 가만히 바라보겠습니다.\n\n잊어버려도 괜찮습니다.\n잊었다는 걸 알아차린 그 순간,\n다시 지금으로 돌아오면 됩니다.\n\n이제 천천히 몸을 일으켜 앉아 봅니다.\n가볍게 기지개를 켜 봅니다.\n\n숨을 크게 들이마시고 길게 내쉽니다.\n\n이 상쾌하고 다정한 마음을 안고 오늘 하루를 시작합니다.\n지금 이 순간 내가 낸 마음이 오늘의 나를 만듭니다.\n\n자,\n좋은 하루를 열어 봅니다.","duration":"약 7분","tags":"#아침명상 #기상루틴 #감사","series":"숨비명상"},{"id":"40ac31cf","category":"자비희사","title":"마음속 샘","body":"우리가 좇는 기쁨은 흔히 밖에서 옵니다.\n좋은 일이 생기고,\n칭찬을 듣고,\n원하던 것을 얻을 때.\n\n그런 기쁨은 반갑지만 오래가지 않고,\n얻지 못하면 이내 시들해집니다.\n\n그런데 또 다른 기쁨이 있습니다.\n밖에서 오는 것이 아니라 안에서 솟아오르는 기쁨입니다.\n\n오늘은 그 마음속 샘을 가만히 찾아봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 잔잔해집니다.\n\n이제 최근에 작은 착한 일을 했던 순간을 하나 떠올려 봅니다.\n\n누군가를 도운 일,\n화를 꾹 참아 준 일,\n솔직하게 말한 일,\n그저 곁에 있어 준 일.\n아주 사소한 것이어도 좋습니다.\n\n잘 떠오르지 않아도 괜찮습니다.\n떠올려 보려는 그 마음도 이미 착한 마음입니다.\n\n그 순간의 느낌을 가슴에서 가만히 찾아봅니다.\n자랑스러워 우쭐한 것이 아니라,\n어딘가 맑고 따뜻하고 떳떳한 느낌입니다.\n\n그 느낌은 무언가를 받아서 생긴 것이 아닙니다.\n내가 무언가를 베풀고,\n나에게 부끄럽지 않게 산 데서 저절로 솟아난 것입니다.\n\n그것은 누구도 가져갈 수 없습니다.\n마음 깊은 곳에서 맑은 샘물처럼 조용히 솟아오릅니다.\n\n그 샘이 솟을수록 가슴이 따뜻하게 차오릅니다.\n차오른 물이 넘쳐 곁의 사람에게도 스며듭니다.\n\n내 안이 환할 때 그 빛은 애쓰지 않아도 주변으로 번져 갑니다.\n\n가만히 마음속으로 다짐해 봅니다.\n'오늘 하루, 작은 착한 일 하나를 가만히 해 보자.' 그때마다 이 샘은 다시 솟아오를 것입니다.\n\n이 맑고 따뜻한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 작은 친절 하나를 건넨 뒤에는,\n잠시 멈춰 가슴에서 솟는 그 기쁨을 가만히 느껴 봅니다.","duration":"약 7분","tags":"#환희 #선한마음 #자기존중","series":"숨비명상"},{"id":"d4e365dc","category":"자비희사","title":"긴 젓가락","body":"오래된 이야기 하나를 떠올려 봅니다.\n\n한 상 가득 따뜻한 음식이 차려져 있는데,\n젓가락이 팔보다 훨씬 길어서 제 입에는 도무지 넣을 수가 없습니다.\n\n이 상에서 저마다 제 입에 먼저 넣으려고만 하면,\n아무도 먹지 못하고 서로 다투다 배를 곯습니다.\n\n그런데 같은 젓가락으로 맞은편 사람의 입에 넣어 주면,\n모두가 배부르게 먹습니다.\n\n똑같은 상인데 한쪽은 다툼과 굶주림의 자리가 되고 한쪽은 더없이 넉넉한 자리가 됩니다.\n그 차이는 오직 젓가락을 어느 쪽으로 향하느냐에 있습니다.\n\n오늘은 그 마음을 가만히 느껴 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 부드러워집니다.\n\n이제 그 긴 상에 내가 앉아 있다고 그려 봅니다.\n김이 오르는 따뜻한 음식과 아주 긴 젓가락이 놓여 있습니다.\n\n맞은편에는 요즘 나와 자주 부딪치는 한 사람이 앉아 있습니다.\n\n먼저 내 안의 마음을 살펴봅니다.\n'내가 먼저, 내 뜻대로.' 일상에서도 나는 자주 내 입부터 채우려 했는지 모릅니다.\n\n내 말이 옳다고 우기고,\n내 방식대로 상대를 움직이려 하고.\n그런데 그럴수록 이상하게 마음은 더 헛헛했습니다.\n\n이번에는 젓가락을 맞은편으로 돌려 봅니다.\n음식을 집어 그 사람의 입에 먼저 가만히 넣어 줍니다.\n\n'많이 드세요.' 그 사람의 얼굴이 조금 풀리는 것이 보입니다.\n\n이윽고 그 사람도 젓가락을 들어 내 입에 음식을 넣어 줍니다.\n\n나는 배부르게 먹습니다.\n움켜쥐어서가 아니라,\n먼저 건넸더니 나에게도 돌아온 것입니다.\n\n내가 나를 위하듯 상대를 위할 때,\n막혔던 사이가 통하고 둘 다 넉넉해집니다.\n\n가슴 한가운데가 따뜻하게 차오릅니다.\n\n이 따뜻한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 누군가와 마주할 때,\n첫 젓가락을 그 사람에게 건네 봅니다.\n먼저 들어 주고,\n먼저 이해해 주고,\n먼저 건네 봅니다.","duration":"약 8분","tags":"#소통명상 #배려 #관계","series":"숨비명상"},{"id":"cbcdf709","category":"자비희사","title":"가벼워지다","body":"치유는 무언가를 새로 얻는 일이 아닙니다.\n오히려 오래 짊어져 온 것을 하나씩 잃어버리는 일에 가깝습니다.\n\n묵은 분노, 끝없는 걱정,\n막연한 두려움.\n그것들을 조금씩 내려놓을 때 우리는 한결 가벼워집니다.\n\n오늘은 그 가벼워짐을 가만히 연습해 봅니다.\n\n먼저 안내를 드립니다.\n이 시간은 아픈 자리를 건드릴 수 있습니다.\n\n아주 깊고 생생한 상처라면 오늘은 멀리서 바라보기만 해도 됩니다.\n힘들면 언제든 멈추고 주변 소리를 들어도 됩니다.\n그것은 지혜입니다.\n\n편안한 곳에 앉아 봅니다.\n불안하면 눈을 반쯤 떠도 좋습니다.\n두 발이 바닥에 닿아 있습니다.\n나는 지금 안전한 이 자리에 있습니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨마다 가슴에 얹힌 것이 조금씩 가벼워집니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n\n이제 나를 아프게 했던 일을 하나 떠올려 봅니다.\n가장 깊은 것은 오늘 말고,\n지금 바라볼 수 있는 만큼만.\n\n떠올리는 것만으로도 아프고 슬픈 마음이 올라올 수 있습니다.\n밀어내지 않고 가만히 그 마음을 바라봅니다.\n\n한 손을 가슴에 얹고 그때의 나에게 말해 줍니다.\n'많이 힘들었구나.' '참 아팠겠구나.'\n\n상처 난 자리를 따뜻한 손으로 어루만지듯 그 마음을 다독여 줍니다.\n\n숨을 내쉴 때마다 그 안에 뭉쳐 있던 분노와 걱정이 조금씩 풀려 나갑니다.\n다 풀리지 않아도 괜찮습니다.\n\n이제 반대로,\n내가 누군가에게 상처를 주었던 일을 떠올려 봅니다.\n\n무심코 던진 말,\n돌보지 못한 마음.\n아주 무거운 일은 오늘 말고,\n가만히 바라볼 수 있는 것으로.\n\n나를 탓하며 짓누르려는 게 아닙니다.\n그저 솔직하게 그 마음을 내려놓으려는 것입니다.\n\n마음속으로 그 사람을 가만히 안고 이렇게 전해 봅니다.\n'아프게 해서 미안합니다.' '그 아픔에서 벗어나 편안하기를 바랍니다.'\n\n이미 지난 일을 되돌릴 수는 없습니다.\n하지만 미안한 마음을 전하고 나면,\n가슴을 누르던 것이 조금 가벼워집니다.\n\n받은 상처도,\n준 상처도 이렇게 조금씩 어루만지고 내려놓을 때 마음에 넉넉한 자리가 생깁니다.\n\n가슴 한가운데가 아릿하면서도,\n한결 편안해집니다.\n\n이 가벼운 느낌을 그대로 지녀 봅니다.\n가슴에 얹은 손의 온기를 한 번 더 느껴 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n무언가 가슴을 무겁게 누르는 날이면,\n숨을 한 번 길게 내쉬며 그 무게를 아주 조금 내려놓아 봅니다.\n나를 다독이고,\n상대의 편안함을 빌면서.","duration":"약 9분","tags":"#치유명상 #자기연민 #미안함","series":"숨비명상"},{"id":"9a330192","category":"자비희사","title":"빈손이 아니야","body":"우리는 흔히 나누려면 가진 것이 많아야 한다고 생각합니다.\n\n돈이 있어야,\n여유가 있어야 베풀 수 있다고요.\n\n그런데 돈이 들지 않으면서도 아무리 나눠도 줄지 않는 것들이 있습니다.\n게다가 우리는 그것을 늘 몸에 지니고 다닙니다.\n\n오늘은 내가 이미 지닌 그 선물들을 하나씩 꺼내 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 부드러워집니다.\n\n먼저 내 얼굴을 느껴 봅니다.\n입꼬리를 아주 살짝 올려 옅은 미소를 지어 봅니다.\n이 환한 얼굴 하나로 누군가의 마음을 편안하게 할 수 있습니다.\n\n이제 내 눈을 떠올려 봅니다.\n차갑게 훑는 눈이 아니라 따뜻하게 바라보는 눈.\n그 눈길 하나가 상대를 안심하게 합니다.\n\n이번엔 내 말입니다.\n'고마워요', '괜찮아요',\n'잘했어요'.\n따뜻한 말 한마디는 돈 한 푼 들지 않지만 가슴에 오래 남습니다.\n\n이제 내 마음의 귀를 열어 봅니다.\n상대가 지금 어떤지 가만히 헤아리고 들어 주는 것.\n그 관심도 귀한 나눔입니다.\n\n두 손도 있습니다.\n무거운 짐을 함께 들어 주고,\n문을 잡아 주고,\n작은 일을 거들어 주는 손.\n\n내가 앉은 자리,\n내 차례도 나눌 수 있습니다.\n가만히 자리를 내주고 한 걸음 양보하는 것으로.\n\n이 모든 것은 돈이 들지 않습니다.\n아무리 나눠도 줄지 않습니다.\n나는 결코 빈손이 아니었습니다.\n\n이제 오늘 하루를 돌아봅니다.\n누군가에게 미소를 지었는지,\n따뜻한 말을 건넸는지,\n곁의 마음을 살펴 주었는지.\n\n단 하나라도 있었다면 오늘 나는 이미 나눈 것입니다.\n없었다면,\n내일이 또 있습니다.\n자책하지 않아도 됩니다.\n\n가슴 한가운데가 넉넉하게 따뜻해집니다.\n\n이 넉넉한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 누군가를 만나면 이 선물 중 하나를 그냥 건네 봅니다.\n환한 얼굴,\n따뜻한 말 한마디면 그것으로 충분합니다.","duration":"약 8분","tags":"#나눔명상 #돈안드는나눔 #마음챙김","series":"숨비명상"},{"id":"c3a571f2","category":"수면·이완","title":"마음의 나침반","body":"바쁜 하루하루를 살다 보면 내가 어디로 가고 있는지 잊어버릴 때가 있습니다.\n\n그럴 때 꿈은 나침반과 같습니다.\n가야 할 방향을 가만히 일러 줍니다.\n\n다만 우리는 가끔 꿈과 욕심을 헷갈립니다.\n무언가를 이루고 싶다는 점에서는 닮았지만,\n그 뿌리는 사뭇 다릅니다.\n\n오늘은 잠시 내 마음의 나침반에 가만히 귀 기울여 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 잔잔해집니다.\n\n이제 한 손을 가슴에 얹어 봅니다.\n손 아래에서 심장이 조용히 뛰고 있습니다.\n\n그 심장에게 가만히 물어봅니다.\n'내가 살아 있는 동안 정말 이루고 싶은 것은 무엇일까?' '무엇이 내 가슴을 두근거리게 할까?'\n\n서두르지 않고 잠시 그대로 기다립니다.\n\n아무것도 떠오르지 않아도 괜찮습니다.\n어떤 장면 하나,\n어떤 느낌 하나면 충분합니다.\n\n떠오르는 것들을 하나씩 바라봅니다.\n그중 어떤 것을 떠올리면 가슴이 답답하게 조여들고,\n어떤 것을 떠올리면 가슴이 넓어지며 따뜻해집니다.\n\n조여드는 것은 남보다 앞서려는 마음,\n더 가지려는 조바심일 때가 많습니다.\n\n넓어지는 것,\n떠올리기만 해도 마음이 환해지는 것.\n그것이 내 나침반이 가리키는 방향입니다.\n\n이제 그 방향의 꿈을 하나 골라 가만히 들여다봅니다.\n그리고 조용히 물어봅니다.\n'이 꿈 안에 다른 사람의 자리도 있을까?'\n\n그 꿈이 나만 채우는 것이 아니라 곁의 누군가에게도 무언가를 건네는 모습을 그려 봅니다.\n\n그러자 꿈이 조금 더 크고 따뜻하게 가슴을 채웁니다.\n\n나도 살리고 남도 살리는 꿈.\n그 방향으로 나침반의 바늘이 가만히 멈춰 섭니다.\n\n가슴 한가운데가 따뜻하게,\n그리고 설레게 두근거립니다.\n\n이 느낌을 그대로 지녀 봅니다.\n가슴에 얹은 손을 한 번 더 느껴 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n길을 잃은 듯 마음이 어지러운 날이면,\n가슴에 손을 얹고 물어봅니다.\n'이 길이 나도, 남도 살리는 방향인가?' 그리고 그 꿈을 향해 오늘 한 걸음만 내디뎌 봅니다.","duration":"약 8분","tags":"#꿈명상 #방향찾기 #가슴의소리","series":"숨비명상"},{"id":"9d9235ba","category":"수용","title":"그 사람의 자리","body":"살다 보면 도무지 이해되지 않는 사람이 있습니다.\n그래서 화가 나고, 서운하고,\n원망하게 됩니다.\n\n그런데 남과 나는 생각보다 멀리 떨어져 있지 않습니다.\n잠시 그 사람의 자리에 서 보면 보이지 않던 것이 보이기 시작합니다.\n\n오늘은 그 연습을 가만히 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 부드러워집니다.\n\n이제 요즘 나와 부딪친 한 사람을 떠올려 봅니다.\n아주 힘든 사람은 오늘 말고,\n조금 껄끄러운 정도의 사람이면 됩니다.\n\n먼저 내 자리에서 그 사람을 바라봅니다.\n나를 서운하게 했던 그 말,\n그 행동이 떠오릅니다.\n\n이제 가만히 내 자리에서 일어나 그 사람이 서 있는 쪽으로 천천히 걸어가 봅니다.\n\n그 사람의 자리에 서서 방금 그 상황을 그 사람의 눈으로 돌아봅니다.\n\n그 사람의 하루를 그려 봅니다.\n어떤 걱정에 쫓기고 있었을지,\n얼마나 지치고 두려웠을지.\n\n그 사람의 마음속 말을 내 목소리로 가만히 말해 봅니다.\n'나도 사실 많이 힘들었어.' '나도 그때 무서웠어.'\n\n그 사람의 무거움을 잠시 내 것처럼 느껴 봅니다.\n완전히 그 사람이 되지 않아도 괜찮습니다.\n한 뼘만 다가가도 충분합니다.\n\n그 자리에서 보니 그 사람의 말과 행동이 조금은 이해가 됩니다.\n날카롭던 마음이 어느새 부드러워집니다.\n\n그렇게 상대를 헤아려 준 마음은 신기하게도 나에게 편안함으로 돌아옵니다.\n미움을 품을 때보다 마음이 한결 가볍습니다.\n\n이제 다시 내 자리로 천천히 돌아옵니다.\n방금 그 사람의 자리에서 느낀 이해를 가슴에 담은 채로.\n\n가슴 한가운데가 잔잔하게 따뜻해집니다.\n\n이 따뜻한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 누군가가 이해되지 않을 때면,\n잠시 그 사람의 자리로 건너가 숨을 한 번 쉬며 물어봅니다.\n'저 사람은 지금 무엇을 느끼고 있을까?'","duration":"약 8분","tags":"#공감명상 #역지사지 #관계","series":"숨비명상"},{"id":"a1f942bd","category":"자비희사","title":"지나가는 구름","body":"고요란 마음을 억지로 눌러 아무 생각도 없게 만드는 것이 아닙니다.\n\n생각을 꾹꾹 눌러 담으면 오히려 더 답답해집니다.\n\n참된 고요는 넓은 하늘과 같습니다.\n구름이 이리저리 흘러가도 하늘은 늘 그 자리에 있습니다.\n\n오늘은 그 하늘 같은 고요를 가만히 만나 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 넓어집니다.\n\n이제 넓은 하늘 아래 가만히 누워 있다고 그려 봅니다.\n끝없이 열린 하늘이 눈앞에 펼쳐져 있습니다.\n\n잠시 뒤면 생각들이 하나둘 떠오를 것입니다.\n그것들은 하늘을 가로지르는 구름과 같습니다.\n\n어떤 생각이 떠오르면 쫓아가지도,\n밀어내지도 않습니다.\n그저 '아, 생각이 왔구나' 하고 가만히 바라봅니다.\n\n그 구름이 천천히 흘러가도록 그냥 둡니다.\n\n이번엔 어떤 감정이 올라옵니다.\n작은 걱정일 수도,\n알 수 없는 조바심일 수도 있습니다.\n그것도 한 조각 구름입니다.\n\n떠오르는 것을 바라보고,\n때가 되면 흘러가게 둡니다.\n붙잡지 않아도,\n싸우지 않아도 됩니다.\n\n어느새 한 구름을 붙잡고 멀리 따라갔을 수도 있습니다.\n그래도 괜찮습니다.\n따라갔다는 걸 알아차린 그 순간,\n나는 이미 다시 하늘로 돌아온 것입니다.\n\n이 모든 구름 뒤에서 하늘은 조금도 흔들리지 않습니다.\n넓고, 열려 있고,\n고요합니다.\n\n그 고요한 하늘은 멀리 있지 않습니다.\n분주한 구름 아래 줄곧 내 안에 있었습니다.\n\n고요는 구름을 멈춰야 생기는 것이 아니라,\n내가 하늘임을 떠올릴 때 비로소 드러납니다.\n\n가슴 한가운데가 넓고 잔잔하게 열립니다.\n\n이 고요한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n마음이 어지럽게 들끓는 날이면,\n숨을 한 번 쉬고 떠올려 봅니다.\n나는 하늘이고,\n이 생각은 지나가는 구름일 뿐임을.","duration":"","tags":"#고요명상 #평정심 #마음챙김","series":"숨비명상"},{"id":"7ddd085f","category":"수용","title":"끝까지 듣기","body":"소통은 듣는 것에서 시작합니다.\n특히 나와 부딪치는,\n듣기 불편한 사람 앞에서 그렇습니다.\n\n그런데 우리는 흔히 상대의 말이 끝나기도 전에 이미 내 대답을 준비합니다.\n\n'그건 아니지',\n'나도 할 말 있어.' 그러느라 정작 상대의 말은 놓쳐 버립니다.\n\n오늘은 한 사람의 말을 끝까지 들어 주는 연습을 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 부드러워집니다.\n\n이제 내가 듣기 어려워하는 한 사람을 떠올려 봅니다.\n말만 꺼내면 마음이 뾰족해지는 사람.\n아주 힘든 사람은 오늘 말고,\n조금 불편한 정도면 됩니다.\n\n그 사람이 지금 내 앞에서 이야기를 시작한다고 그려 봅니다.\n\n말이 이어지는 동안 내 안에서도 무언가 올라옵니다.\n반박하고 싶은 말,\n끼어들어 바로잡고 싶은 마음.\n그것은 자연스러운 일입니다.\n\n그 말들을 곧바로 내뱉는 대신,\n잠시 옆에 가만히 내려놓아 봅니다.\n막 던지려던 돌을 내려놓듯이.\n\n그리고 다시 그 사람에게로 귀를 돌립니다.\n말뿐 아니라 그 말 밑에 있는 마음까지 들어 봅니다.\n\n무엇이 그렇게 걱정스러운지,\n무엇에 서운하고 아팠는지,\n무엇을 바라고 있는지.\n\n자꾸 내 반박이 다시 올라와도 괜찮습니다.\n올라온 것을 알아차리고 또 가만히 내려놓은 뒤,\n상대에게로 돌아오면 됩니다.\n\n그렇게 상대의 말과 내 마음속 말을 동시에 들어 봅니다.\n\n끝까지 들어 주면 신기한 일이 일어납니다.\n상대의 얼굴이 조금 풀리고,\n내 마음의 날도 함께 무뎌집니다.\n\n우리 사이를 막고 있던 벽이 어느새 얇아져 있습니다.\n\n가슴 한가운데가 잔잔하게 따뜻해집니다.\n\n이 편안한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 누군가와 이야기할 때,\n대답을 서두르는 대신 그 사람이 다 말할 때까지 내 말을 잠시 내려놓고 들어 봅니다.","duration":"약 8분","tags":"#경청명상 #관계 #마음챙김","series":"숨비명상"},{"id":"791b0cfc","category":"수면·이완","title":"물에 뜨기","body":"우리는 흔히 평화를 애써 만들어 내려 합니다.\n일을 내 뜻대로 바로잡고,\n내 생각이 옳다고 우기면서요.\n\n그런데 평화는 힘을 준다고 만들어지지 않습니다.\n꽉 쥘수록 오히려 손가락 사이로 빠져나갑니다.\n\n평화는 애쓰기를 멈출 때 비로소 남는 것입니다.\n마치 물 위에 몸을 맡길 때처럼요.\n\n오늘은 그 느낌을 가만히 만나 봅니다.\n\n편안한 곳에 앉거나 누워 봅니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n몸이 조금씩 부드러워집니다.\n\n이제 따뜻하고 잔잔한 물 위에 등을 대고 누워 있다고 그려 봅니다.\n하늘이 넓게 열려 있고,\n물은 포근하게 나를 감쌉니다.\n\n만약 가라앉지 않으려고 팔다리를 마구 휘저으면 몸은 굳고 자꾸 가라앉습니다.\n\n그런데 몸에서 힘을 빼고 물을 믿고 맡기면,\n신기하게도 물이 나를 떠받쳐 줍니다.\n나는 저절로 뜹니다.\n\n우리 하루의 몸부림도 그와 비슷합니다.\n내 뜻대로 하려는 마음,\n내가 옳다고 붙드는 고집,\n움켜쥐고 통제하려는 힘.\n\n그 힘을 하나씩 천천히 풀어 봅니다.\n내 뜻대로 하려던 마음을 놓고,\n꼭 이겨야 한다는 고집을 놓습니다.\n\n힘을 뺄수록 물이 나를 더 편안히 받쳐 줍니다.\n모든 것이 있는 그대로 떠 있어도 괜찮습니다.\n\n나는 나로서, 너는 너로서.\n꽃은 꽃으로서,\n나무는 나무로서.\n\n이제 요즘 내가 자꾸 바꾸려 애쓰던 한 사람을 떠올려 봅니다.\n\n그 사람을 붙잡으려는 손을 놓고,\n그저 내 곁에서 그 사람답게 떠 있도록 둡니다.\n마음속으로 조용히 빌어 줍니다.\n'당신도 편안하기를.'\n\n자꾸 몸에 다시 힘이 들어가도 괜찮습니다.\n알아차리고 다시 힘을 빼면 됩니다.\n\n애쓰기를 멈춘 그 자리에 잔잔한 평화가 떠오릅니다.\n만든 것이 아니라,\n원래 있던 것이 드러난 것입니다.\n\n온몸이 가볍고 편안하게 떠 있습니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n무언가를 억지로 붙들고 힘이 잔뜩 들어가는 날이면,\n숨을 한 번 내쉬며 몸을 풀고 가만히 물에 뜨듯 놓아 봅니다.","duration":"약 8분","tags":"#평화명상 #내려놓기 #이완","series":"숨비명상"},{"id":"e033428d","category":"용서감사","title":"인연의 실","body":"가까운 한 사람을 떠올리면 가슴이 따뜻해지고 입가에 저절로 미소가 지어집니다.\n\n우리는 모두 보이지 않는 실로 서로 이어져 있습니다.\n\n오늘은 그 실을 하나하나 따라가며 고마운 마음을 전하는 시간을 가져 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 따뜻해집니다.\n\n이제 한 손을 가슴에 얹어 봅니다.\n그 가슴 한가운데에서 따뜻한 실들이 사방으로 뻗어 나간다고 그려 봅니다.\n\n각각의 실은 내 삶의 사람들에게 가만히 이어져 있습니다.\n\n먼저 그중 한 가닥을 따라가 가장 소중한 사람에게 닿아 봅니다.\n그 얼굴을 떠올리면 가슴이 환하게 데워집니다.\n\n그 사람이 나에게 준 것을 하나 떠올려 봅니다.\n곁에 있어 준 시간,\n함께 웃던 순간,\n힘들 때 내밀어 준 손.\n\n그 실을 따라 가만히 고마움을 보냅니다.\n'고마워요.'\n\n이제 다른 실을 따라가 봅니다.\n가족, 오래된 벗,\n나를 도와준 누군가.\n한 사람 한 사람에게 차례로 고마움을 전합니다.\n\n나를 불편하게 했던 사람에게 닿는 실도 있습니다.\n그 사람에게서도 나는 무언가를 배웠습니다.\n'당신에게도 고마워요.'\n\n떠오르는 얼굴이 많지 않아도 괜찮습니다.\n단 한 사람이면 충분합니다.\n\n이렇게 실을 따라 고마움을 보내다 보면 그 온기가 실을 타고 나에게도 되돌아옵니다.\n\n나는 혼자가 아니었습니다.\n이렇게 많은 실에 따뜻하게 이어져 있었습니다.\n\n가슴 한가운데가 넉넉하고 환하게 차오릅니다.\n\n이 따뜻한 느낌을 그대로 지녀 봅니다.\n가슴에 얹은 손을 한 번 더 느껴 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 그 실 중 하나에 닿은 사람에게 작은 '고마워요'를 건네 봅니다.\n문득 외로운 날이면,\n나를 잇고 있는 이 실들을 떠올려 봅니다.","duration":"약 8분","tags":"#감사명상 #인연 #관계","series":"숨비명상"},{"id":"f2791bee","category":"탈중심화","title":"겨울나무","body":"충만이란 빈틈없이 가득 찬 것일까요?\n아니면 텅 비어 있음의 넉넉함일까요?\n\n한겨울의 나무를 떠올려 봅니다.\n잎도 꽃도 다 떨군 채 앙상한 가지로 서 있습니다.\n\n비어 있어 보이지만,\n그 나무는 죽은 것이 아닙니다.\n모든 것을 내려놓고 안으로 봄을 품고 있습니다.\n\n텅 비어 있기에 오히려 충만한 것입니다.\n\n오늘은 그 텅 빈 충만을 가만히 만나 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 고요해집니다.\n\n이제 겨울 들판에 선 한 그루 나무를 그려 봅니다.\n차고 맑은 하늘을 배경으로 가지들이 조용히 뻗어 있습니다.\n\n그 나무가 바로 나입니다.\n\n내 가지마다 그동안 짊어져 온 것들이 매달려 있습니다.\n묵은 서운함,\n놓지 못한 걱정,\n꺾이지 않는 고집,\n더 가지려는 욕심.\n\n이제 나무가 마지막 잎을 떨구듯,\n그것들을 하나씩 내려놓아 봅니다.\n\n가만히 물어봅니다.\n'나는 무엇을 내려놓아야 할까?' 떠오르는 것 하나를 숨을 내쉬며 가지에서 떨어뜨립니다.\n\n'나는 어떤 고집을 비워야 할까?' 그것도 잎처럼 바닥으로 떨어뜨립니다.\n\n'나는 무슨 욕심을 비워야 할까?' 그것마저 가만히 내려놓습니다.\n\n가지가 하나씩 비어 갈수록 이상하게 초라해지는 것이 아니라 가볍고,\n고요하고, 넓어집니다.\n\n빈 가지에는 이제 새로운 것이 들어설 자리가 있습니다.\n\n그리고 그 텅 빈 가지 속에서 무언가 조용히 준비되고 있습니다.\n앙상한 겨울나무가 이미 봄을 품고 있듯이.\n\n숨을 따라 가만히 음미해 봅니다.\n들이쉬며,\n'텅 비어.' 내쉬며,\n'충만하다.'\n\n텅 비어…… 충만하다……\n\n이윽고 그 빈 가지 끝에 작은 봉오리들이 맺히기 시작합니다.\n비운 나무만이 피울 수 있는 그런 꽃입니다.\n\n가슴 한가운데가 넓고 잔잔하게 차오릅니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n마음이 무겁고 빽빽하게 차오르는 날이면,\n겨울나무처럼 잎 하나를 가만히 떨구어 봅니다.\n그 빈자리에서 봄이 준비됩니다.","duration":"약 8분","tags":"#비움명상 #텅빈충만 #평정","series":"숨비명상"},{"id":"5b44d422","category":"수면·이완","title":"오늘의 한 가지","body":"소망과 욕망은 닮았지만 방향이 다릅니다.\n\n욕망은 나만 채우려 하고,\n소망은 나와 남을 함께 살립니다.\n\n거창한 다짐은 자주 먼 미래에만 머뭅니다.\n오늘은 아주 작은,\n오늘 당장 할 수 있는 소망 하나를 세워 봅니다.\n\n편안한 곳에 앉아 봅니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 잔잔해집니다.\n\n이제 가만히 물어봅니다.\n'오늘 하루, 나에게도 좋고 누군가에게도 좋은 작은 일 한 가지는 무엇일까?'\n\n서두르지 않고 잠시 기다립니다.\n떠오르는 것이 작을수록 좋습니다.\n\n먼저 안부를 묻는 일,\n고맙다고 말하는 일,\n누군가의 짐을 조금 덜어 주는 일,\n나를 위해 잠깐 쉬어 주는 일.\n\n떠오른 그 한 가지를 마음속에 또렷이 새겨 봅니다.\n'오늘 나는 이것을 하겠다.'\n\n이 작은 마음은 오늘 세상에 심는 한 알의 씨앗입니다.\n언젠가 나에게도 따뜻함으로 되돌아올 것입니다.\n\n가슴 한가운데가 잔잔하게 밝아집니다.\n\n이제 천천히 눈을 떠 봅니다.\n괜찮다면 그 한 가지를 짧게 적어 두어도 좋습니다.\n그리고 오늘,\n그것을 그대로 해 봅니다.","duration":"약 5분","tags":"#소망명상 #자리이타 #오늘의다짐","series":"숨비명상"},{"id":"d24d7bd7","category":"자비희사","title":"나룻배","body":"누군가에게 해 줄 수 있는 가장 다정한 일 중 하나는,\n그가 힘든 물을 건널 때 곁에서 든든한 배가 되어 주는 것입니다.\n\n문제를 대신 풀어 주지 않아도,\n그저 흔들림 없이 함께 건너 주는 것만으로 큰 힘이 됩니다.\n\n오늘은 그런 나룻배의 마음을 가만히 느껴 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 잔잔해집니다.\n\n이제 요즘 힘든 시간을 지나고 있는 한 사람을 떠올려 봅니다.\n\n그 사람의 짐을 내가 다 짊어질 수는 없습니다.\n그럴 필요도 없습니다.\n\n다만 나는 그가 거친 물을 건너는 동안 흔들리지 않는 배가 되어 줄 수 있습니다.\n\n가만히 들어 주는 귀,\n곁에 있어 주는 따뜻한 자리,\n작게 내미는 손 하나로.\n\n그 사람이 내 배에 올라탄다고 그려 봅니다.\n나는 조용히 중심을 잡고,\n그를 실은 채 천천히 물을 건너갑니다.\n\n내가 흔들리지 않으니 그 사람도 조금 안심합니다.\n그 모습을 보는 것만으로 내 가슴도 따뜻해집니다.\n\n보답을 바라지 않아도 괜찮습니다.\n'나와 똑같이',\n나라도 이런 배가 있으면 좋겠다는 마음.\n그 마음이 이미 나를 넉넉하게 합니다.\n\n한 가지만 기억합니다.\n좋은 배도 때로는 나루에 매여 쉬어야 합니다.\n남을 건네주는 만큼 지친 나도 돌보아야 합니다.\n\n남을 태우기만 하다 내가 텅 비지 않도록,\n쉴 때는 나도 누군가의 배에 실려도 됩니다.\n\n만약 오늘 태워 줄 사람이 없다면,\n지친 나 자신을 이 배에 태워 가만히 건너게 해 주어도 좋습니다.\n\n가슴 한가운데가 잔잔하게 따뜻해집니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 힘들어하는 누군가가 보이면,\n잠시 그 곁에서 흔들리지 않는 배가 되어 봅니다.\n그리고 나도,\n나루에서 쉬어 갑니다.","duration":"약 8분","tags":"#배려명상 #곁에있기 #돌봄","series":"숨비명상"},{"id":"165343d4","category":"자비희사","title":"복의 그릇","body":"좋은 것들은 늘 우리 곁에 내리고 있습니다.\n따뜻한 차 한 잔,\n누군가의 미소,\n잠깐의 햇살처럼.\n\n마치 온 하늘 가득 보슬비가 내리는 것과 같습니다.\n\n그런데 우리는 저마다 손에 든 그릇만큼만 그 비를 받습니다.\n\n그릇이 작으면,\n내리는 것이 아무리 많아도 대부분 그냥 흘려보냅니다.\n\n오늘은 그 그릇을 조금 넓혀 보는 시간을 가져 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 열립니다.\n\n이제 두 손을 모아 작은 그릇을 만들어 하늘을 향해 들고 있다고 그려 봅니다.\n\n그 위로 보슬비가 내립니다.\n이 비는 오늘 나에게 온 좋은 것들입니다.\n\n그동안 이 비는 하루 종일,\n사실은 평생 내 위로 내리고 있었습니다.\n\n그런데 바쁠 때,\n'이건 별거 아니야' 하고 지나칠 때,\n더 큰 것만 바라며 딴 데를 볼 때,\n내 그릇은 자꾸 작아지거나 엎어져 있었습니다.\n\n이제 그 그릇을 가만히 바로 세우고 넓혀 봅니다.\n그릇을 넓히는 일은 천천히 멈추어 작은 것 하나하나를 소중히 세는 일입니다.\n\n지금 몇 방울을 받아 봅니다.\n오늘 있었던 작고 좋은 일 세 가지를 떠올려 봅니다.\n\n따뜻한 밥 한 끼,\n건네받은 다정한 말 한마디,\n잠시 웃었던 순간.\n하나씩 그릇에 떨어지는 것을 느껴 봅니다.\n\n별거 아닌 것 같아도,\n이렇게 받아 담으면 그것이 곧 복입니다.\n\n떠오르는 것이 적어도 괜찮습니다.\n물방울 하나면 충분합니다.\n\n그릇이 조금씩 차오를수록 마음이 넉넉해집니다.\n더 많은 비가 내려서가 아니라,\n늘 있던 것을 더 많이 받았기 때문입니다.\n\n가슴 한가운데가 잔잔하고 따뜻하게 차오릅니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 작고 좋은 일이 스칠 때면,\n잠깐 멈춰 그 한 방울을 그릇에 받아 봅니다.\n그냥 흘려보내지 않고서.","duration":"약 8분","tags":"#감사명상 #복의그릇 #지금이순간","series":"숨비명상"},{"id":"fb713fb8","category":"관찰","title":"말하기 전에","body":"대화가 어긋나는 것은 말을 못 해서가 아닙니다.\n\n내 말을 미처 살펴보지도 않고 그냥 쏟아 내기 때문입니다.\n\n사실 말보다 더 깊은 대화가 있습니다.\n바로 침묵입니다.\n\n말이 입 밖으로 나가기 전,\n아주 짧은 침묵이 있습니다.\n오늘은 그 자리에 가만히 머무는 연습을 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n\n잠시 그대로 아무 말 없이 머물러 봅니다.\n이 고요 속에서는 내 마음의 소리가 들립니다.\n말이 많을 때는 잘 들리지 않던 소리입니다.\n\n이제 최근의 한 대화를 떠올려 봅니다.\n나가고 나서 '괜히 그랬나' 싶었던 말 한마디.\n날카로운 대꾸,\n습관 같은 불평.\n\n그 말은 내가 살펴보기도 전에 이미 입 밖으로 나가 있었습니다.\n그럴 수 있습니다.\n\n이제 앞으로 있을 어떤 대화를 그려 봅니다.\n말이 막 나오려는 순간,\n그 사이의 짧은 틈을 찾아 숨을 한 번 쉬어 봅니다.\n\n그 틈에서 나가려는 말을 가만히 바라봅니다.\n이 말은 따뜻한가,\n날카로운가.\n상대의 가슴에 꽃처럼 내려앉을까,\n가시처럼 박힐까.\n\n따뜻한 말이라면 부드럽게 건네 봅니다.\n\n가시 같은 말이라면 잠시 내려놓습니다.\n숨을 한 번 쉬고,\n그 자리에 조금 더 다정한 말이 자라나기를 기다립니다.\n\n때로는 아무 말도 하지 않는 것이 가장 따뜻한 대답이기도 합니다.\n\n내가 하는 말은 그저 사라지지 않습니다.\n상대의 마음에,\n이 세상에 심어져 말이 떠난 뒤에도 자랍니다.\n\n늘 잘 멈추지 못해도 괜찮습니다.\n이미 나간 말을 알아차린 것만으로도,\n다음엔 한 박자 쉴 수 있습니다.\n\n가슴 한가운데가 잔잔하게 가라앉습니다.\n\n이 고요한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 중요한 말을 하기 전에는,\n숨을 한 번 쉬며 그 말을 잠깐 바라봅니다.\n따뜻한 말을 건네거나,\n다정한 침묵에 머물면서.","duration":"약 8분","tags":"#말알아차림 #침묵 #관계","series":"숨비명상"},{"id":"4a10dc21","category":"탈중심화","title":"대나무","body":"끈기란 이를 악물고 뻣뻣하게 버티는 것이 아닙니다.\n\n뻣뻣한 것은 센 바람에 오히려 부러집니다.\n\n대나무를 떠올려 봅니다.\n폭풍이 몰아치면 낮게 휘어졌다가,\n바람이 지나가면 다시 곧게 일어섭니다.\n\n휘어지되 꺾이지 않는 것,\n그것이 끈기입니다.\n\n오늘은 그 대나무의 마음을 가만히 느껴 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n몸이 조금씩 편안해집니다.\n\n이제 푸른 대나무 숲을 그려 봅니다.\n그 가운데 곧게 자란 대나무 한 그루가 바로 나입니다.\n\n두 발은 땅에 뿌리내려 있고,\n몸은 하늘을 향해 시원하게 뻗어 있습니다.\n\n이제 바람이 불어옵니다.\n요즘 나를 흔드는 걱정과 지침,\n잘 풀리지 않는 일들의 바람입니다.\n\n대나무는 그 바람에 맞서 뻣뻣하게 버티지 않습니다.\n바람이 미는 대로 몸을 낮게 휘어 줍니다.\n\n휘청휘청 흔들려도 괜찮습니다.\n휘어지는 것은 약함이 아니라 견디는 지혜입니다.\n\n몸은 흔들려도 땅속 깊은 뿌리는 단단히 나를 붙들고 있습니다.\n그래서 나는 휘어질지언정 꺾이지 않습니다.\n\n바람은 언젠가 제풀에 잦아듭니다.\n모든 폭풍이 그렇듯이.\n\n바람이 지나가자 대나무는 천천히,\n다시 곧게 몸을 일으킵니다.\n\n가만히 보니 대나무는 마디마디 한 칸씩 천천히 자랍니다.\n단숨에 꼭대기까지 자라는 대나무는 없습니다.\n\n끈기도 그렇습니다.\n대단한 힘이 아니라,\n오늘 하루 더 버텨 내는 것.\n그렇게 하루가 한 마디가 됩니다.\n\n지금 꺾이지 않고 서 있는 것만으로 나는 이미 충분히 끈기 있습니다.\n\n가슴 한가운데가 잔잔하고 단단하게 차오릅니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n거센 바람이 몰아치는 날이면,\n대나무처럼 가만히 휘어 숨을 고르고,\n뿌리를 믿고 버텨 봅니다.\n바람은 지나가고,\n나는 다시 일어섭니다.","duration":"약 8분","tags":"#끈기명상 #회복탄력 #버티기","series":"숨비명상"},{"id":"8cc108d4","category":"수용","title":"너그러운 눈","body":"다른 사람의 잘못이 눈에 띄면 손가락이 먼저 올라갑니다.\n\n탓하고 싶고, 꾸짖고 싶고,\n가르쳐 주고 싶어집니다.\n\n그런데 그 잘못을 어떤 눈으로 바라보는가는 사실 내 마음을 비추는 거울입니다.\n\n관용은 잘못을 못 본 척 넘기는 것이 아니라,\n비난하는 마음은 내려놓되 그 사람을 향한 다정함은 지키는 것입니다.\n\n오늘은 그 너그러운 눈을 가만히 연습해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 차분해집니다.\n\n이제 최근에 누군가의 잘못이나 실수를 마주했던 순간을 떠올려 봅니다.\n아주 큰 일은 오늘 말고,\n가볍게 볼 수 있는 것으로.\n\n그 순간 내 안에서 올라오던 것을 살펴봅니다.\n탓하고 싶은 마음,\n바로잡아 주고 싶은 마음,\n'나라면 안 그럴 텐데' 하는 마음.\n\n가슴이 조여들고 턱에 힘이 들어갔을지도 모릅니다.\n그 반응을 밀어내지 말고 가만히 바라봅니다.\n\n손가락을 밖으로 겨누기 전에,\n먼저 나 자신에게 물어봅니다.\n'지금 내 마음에 무엇이 올라오는가?' '나는 지금 무슨 말을 하고 싶은가?'\n\n잠시 그 물음에 머뭅니다.\n\n비난하는 마음은 사실 상대가 아니라 내 안에 먼저 심어집니다.\n그것은 내 마음을 딱딱하게 굳힙니다.\n\n이제 조금 부드러워져 봅니다.\n그 사람도 나처럼 서툴고,\n넘어지고,\n실수하는 한 사람입니다.\n나 역시 그런 적이 많았습니다.\n\n겨누던 손가락을 천천히 내리고,\n손을 가만히 펴 봅니다.\n\n정말 짚어야 할 일이라면 나중에,\n차분하고 지혜롭게 말할 기회를 만들면 됩니다.\n지금은 먼저 경멸의 마음만 내려놓습니다.\n\n그리고 그 사람을 위해 조용히 빌어 줍니다.\n'당신에게도 지혜와 편안함이 있기를.'\n\n화가 다 사라지지 않아도 괜찮습니다.\n비난을 조금 내려놓은 것만으로도 내 마음이 한결 맑아집니다.\n\n가슴 한가운데가 잔잔하게 편안해집니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 누군가의 잘못이 눈앞에 보이면,\n손가락을 겨누기 전에 먼저 내 마음을 한 번 바라봅니다.\n그리고 그 사람에게도 너그러운 눈길을 건네 봅니다.","duration":"약 8분","tags":"#관용명상 #판단내려놓기 #마음챙김","series":"숨비명상"},{"id":"857c2e7a","category":"수용","title":"등 뒤의 손","body":"격려는 힘이 됩니다.\n누군가에게 건네도 힘이 나고,\n누군가에게 받아도 힘이 납니다.\n\n우리는 자신을 채찍질하는 데는 익숙하지만,\n누군가의 응원을 가만히 받아들이는 일에는 서툽니다.\n\n오늘은 잠시 내 등 뒤의 따뜻한 손을 느껴 봅니다.\n\n편안한 곳에 앉아 봅니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 편안해집니다.\n\n이제 요즘 기운이 빠지고 작아졌던 순간을 하나 떠올려 봅니다.\n\n그리고 나를 믿어 주는 한 사람을 떠올립니다.\n나를 응원해 주었던 사람,\n나에게 따뜻했던 사람.\n지금 곁에 없거나 떠난 이여도 괜찮습니다.\n\n그 사람이 내 곁에,\n혹은 등 뒤에 서 있습니다.\n따뜻한 손을 내 등에 가만히 얹고,\n믿음 어린 눈으로 나를 봅니다.\n\n그 사람의 목소리를 들어 봅니다.\n'괜찮아, 잘하고 있어.' '나는 네 편이야.'\n\n우리는 자주 그런 말을 밀어냅니다.\n'아니야, 난 부족해' 하고요.\n\n오늘은 그냥 그 말을 가만히 받아 봅니다.\n쑥스러워도 괜찮습니다.\n곧이곧대로 믿기지 않아도,\n그저 들어 보기만 해도 됩니다.\n\n이제 내 한 손을 가슴에 얹어 봅니다.\n그리고 나 자신에게도 가만히 말해 줍니다.\n'오늘도 애썼어.' '너는 소중해. 계속 가 보자.'\n\n그 따뜻함이 가슴에서 온몸으로 번집니다.\n\n마지막으로,\n지금 응원이 필요할 누군가를 떠올려 그 손을 그 사람에게도 건네 봅니다.\n'당신은 소중한 사람이에요. 응원할게요.'\n\n가슴 한가운데가 든든하고 따뜻하게 차오릅니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n기운이 빠지는 날이면,\n한 손을 내 등에,\n혹은 가슴에 얹고 가장 다정한 사람이 해 줄 말을 나에게 들려줍니다.","duration":"약 6분","tags":"#격려명상 #자기응원 #힘내기","series":"숨비명상"},{"id":"4ea2b61a","category":"용서감사","title":"고마운 몸","body":"우리는 일에, 돈에,\n노는 일에 밀려 건강을 자꾸 뒤로 미룹니다.\n그러다 지나고 나서 후회하곤 합니다.\n\n건강을 지키는 일은 사실 살아 있음을 소중히 여기는 일입니다.\n\n오늘은 딱 10분,\n지금도 나를 살리고 있는 이 몸에게 가만히 고마움을 전해 봅니다.\n\n편안한 곳에 앉거나 누워 봅니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이 숨은 내가 시키지 않아도 하루 종일,\n밤새도록 이어졌습니다.\n쉬지 않고 숨 쉬어 준 가슴에게 가만히 말해 봅니다.\n'고마워.'\n\n그 안쪽에서 심장이 조용히 뛰고 있습니다.\n오늘도 수만 번,\n내가 잊고 있는 동안에도 한 번도 멈추지 않았습니다.\n'고마워.'\n\n이제 머리로 주의를 옮겨 봅니다.\n눈은 사랑하는 얼굴을 보게 해 주었고,\n귀는 반가운 목소리를 들려주었습니다.\n'고마워.'\n\n어깨와 두 팔,\n두 손으로 옮겨 갑니다.\n오늘 무언가를 들고, 쥐고,\n만들고,\n누군가를 안아 준 손입니다.\n참 많은 일을 해냈습니다.\n'고마워.'\n\n등과 허리, 배로 내려갑니다.\n하루 종일 나를 곧게 세워 주고,\n먹은 것을 말없이 소화해 주었습니다.\n'고마워.'\n\n두 다리와 발로 내려갑니다.\n내 온몸의 무게를 지고 오늘 나를 여기저기 데려다주었습니다.\n'고마워.'\n\n혹시 어딘가 아프거나 불편한 곳이 있다면,\n그곳도 나무라지 말고 가만히 손을 얹어 봅니다.\n'많이 애썼구나. 힘들었지.'\n\n몸이 아플 때는 치료가 먼저입니다.\n명상은 그 곁에서 함께 가는 벗일 뿐,\n치료를 대신하지는 않습니다.\n\n이제 몸뿐 아니라 마음에게도 고마움을 전합니다.\n오늘 하루 느끼고, 기억하고,\n견뎌 준 마음에게.\n'너도 참 애썼어. 고마워.'\n\n가만히 느껴 봅니다.\n지금 이렇게 숨 쉬고,\n심장이 뛰고,\n살아 있다는 것.\n그것 자체가 큰 선물입니다.\n\n가슴 한가운데가 따뜻하고 뭉클하게 차오릅니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n하루에 한 번쯤,\n숨을 한 번 깊이 쉬며 나를 살려 주는 이 몸에게 '고마워' 하고 말해 봅니다.\n그리고 오늘,\n조금 더 다정하게 돌봐 줍니다.","duration":"약 10분","tags":"#몸감사 #살아있음 #자기돌봄","series":"숨비명상"},{"id":"c96278b6","category":"멈춤","title":"멈추면 보인다","body":"우리는 하루 종일 말하고,\n듣고, 바쁘게 움직입니다.\n그러느라 정작 지금의 내 모습은 잘 보이지 않습니다.\n\n침묵은 바쁜 입과 마음에 '잠깐 멈춤'을 선물합니다.\n\n그리고 멈추면,\n비로소 보이기 시작합니다.\n\n오늘은 아주 잠깐이라도 그 침묵에 머물러 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n\n이제 잠시,\n아무것도 하지 않고 그저 침묵 속에 머뭅니다.\n\n무언가를 애써 하려 하지 않아도 됩니다.\n그냥 조용히 여기 있습니다.\n\n……\n\n고요해지자 작은 소리들이 들립니다.\n내 숨소리,\n멀리서 오는 희미한 소리.\n\n……\n\n그리고 지금 내 마음에서 일어나는 것이 보입니다.\n'아, 지금 내가 이런 생각을 하고 있구나.' '아, 지금 마음이 이렇구나.'\n\n바꾸려 하지 않아도 됩니다.\n그저 보이는 것만으로 충분합니다.\n\n생각이 많아도 괜찮습니다.\n그 많음을 알아차린 것 자체가 침묵이 준 선물입니다.\n\n……\n\n이 고요 속에서 나는 내 안의 나를 가만히 만납니다.\n말이 멈춘 자리에 지금의 내가 조용히 앉아 있습니다.\n\n……\n\n가슴 한가운데가 잔잔하고 맑아집니다.\n\n이제 천천히 숨을 크게 들이마시고 내쉽니다.\n손끝을 조금씩 움직여 봅니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n하루에 몇 번쯤,\n입과 마음에 단 1분의 침묵을 선물해 봅니다.\n잠깐 멈추면,\n지금의 내가 보입니다.","duration":"약 6분","tags":"#침묵명상 #멈춤 #마음챙김","series":"숨비명상"},{"id":"42d5a486","category":"용서감사","title":"감사합니다","body":"늘 행복해 보이는 한 사람에게 그 비결을 물었더니 이렇게 답했다고 합니다.\n\n\"내 웃음은 삶이 완벽하다는 뜻이 아니라, 가진 것에 감사하고 일어나는 일을 받아들인다는 뜻입니다.\"\n\n'감사합니다'라는 말은 천천히 되뇌기만 해도 가라앉았던 마음이 온화해집니다.\n\n오늘은 그 한마디에 가만히 머물러 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n입가에 옅은 미소를 지어 봅니다.\n\n이제 숨을 내쉴 때마다 마음속으로 천천히 말해 봅니다.\n\n들이쉬고…… 내쉬며,\n'감사합니다.'\n\n들이쉬고…… 내쉬며,\n'감사합니다.'\n\n특별한 이유를 애써 찾지 않아도 됩니다.\n그저 그 말이 숨을 타고 흐르게 둡니다.\n\n들이쉬고…… 내쉬며,\n'감사합니다.'\n\n이렇게 되뇌다 보면 마음이 스스로 고마운 것들을 하나씩 데려옵니다.\n\n떠오르는 한 얼굴에게,\n'감사합니다.' 오늘 나를 살린 이 숨에게,\n'감사합니다.' 아침에 다시 눈을 뜬 것에게,\n'감사합니다.'\n\n아무것도 떠오르지 않아도 괜찮습니다.\n그냥 그 한마디에 머무는 것만으로도 마음이 따뜻해집니다.\n\n신기하게도 감사하면 감사할 일이 조금씩 더 보이기 시작합니다.\n\n가슴 한가운데가 잔잔하고 온화하게 차오릅니다.\n\n행복은 멀리 있지 않습니다.\n지금 여기,\n들이쉬고 내쉬는 숨 사이에 있습니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n하루에 몇 번쯤,\n숨을 길게 내쉬며 '감사합니다' 한마디를 건네 봅니다.\n아침에는 가슴에 손을 얹고,\n'오늘도 살아 있어 감사합니다.'","duration":"약 7분","tags":"#감사명상 #감사합니다 #마음챙김","series":"숨비명상"},{"id":"9172a10e","category":"자비희사","title":"마음의 날씨","body":"똑같은 자리에 있어도 어떤 날은 지옥 같고 어떤 날은 더없이 편안합니다.\n\n그 차이는 바깥이 아니라 지금 내 마음속에 있습니다.\n\n화와 미움,\n원망이 들어차면 그 자리가 곧 차갑고 힘든 곳이 되고,\n다정함과 이해가 있으면 그 자리가 곧 따뜻한 곳이 됩니다.\n\n그리고 어느 쪽으로 만들지는 다른 누구도 아닌 내가 정합니다.\n\n오늘은 잠시 내 마음의 날씨를 살펴봅니다.\n\n편안한 곳에 앉아 봅니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n\n이제 가만히 마음속을 들여다봅니다.\n지금 내 마음의 날씨는 어떤가요.\n\n먹구름이 낀 듯 답답한가요,\n바람이 거센가요,\n아니면 잔잔하고 맑은가요.\n\n탓하지 않고 그저 있는 그대로 바라봅니다.\n\n만약 차갑고 흐린 기운이 있다면,\n그것이 몸의 어디에 있는지 느껴 봅니다.\n밀어내지 말고,\n가만히 둡니다.\n\n이제 그 자리를 천천히 데워 봅니다.\n숨을 몇 번 부드럽게 쉬고,\n입가에 옅은 미소를 지어 봅니다.\n\n그리고 따뜻한 것 하나를 떠올립니다.\n사랑하는 얼굴, 작은 고마움,\n'다들 편안하기를' 하는 마음.\n\n그러자 마음의 날씨가 조금씩 풀립니다.\n같은 자리인데 어쩐지 더 따뜻해졌습니다.\n\n활짝 개지 않아도 괜찮습니다.\n구름이 조금 걷힌 것만으로 충분합니다.\n\n나는 내가 사는 자리를 이렇게 조금씩 바꿀 수 있습니다.\n\n가슴 한가운데가 잔잔하게 따뜻해집니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 하루,\n마음이 차갑게 굳는 순간이 오면,\n잠시 마음의 날씨를 살피고 숨 한 번으로 그 자리를 데워 봅니다.","duration":"약 5분","tags":"#마음챙김 #감정전환 #따뜻한마음","series":"숨비명상"},{"id":"f6233436","category":"수용","title":"무엇을 바꿀까","body":"우리는 자주 소원을 빕니다.\n그런데 많은 소원이 소원인 채로 머뭅니다.\n\n바라는 결과에만 마음을 두고,\n그것도 나 혼자만을 위해 바라기 때문인지 모릅니다.\n\n소원은 조금 다르게 이루어집니다.\n'우리 함께'를 향할 때,\n그리고 그 소원이 나의 변화로 바뀔 때.\n\n오늘은 잠시 내 소원을 그렇게 돌려놓아 봅니다.\n\n편안한 곳에 앉아 봅니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 잔잔해집니다.\n\n이제 요즘 내가 바라고 있는 것 하나를 떠올려 봅니다.\n\n먼저 가만히 물어봅니다.\n'이 소원 안에 다른 사람의 자리도 있을까?' 그 소원을 조금 넓혀,\n'우리 함께'의 모양으로 그려 봅니다.\n\n이제 방향을 바꿔 가장 중요한 물음을 던져 봅니다.\n'이 소원이 이루어지려면, 나는 어떤 사람이 되어야 할까?' '내 생각과 말과 행동에서 무엇을 바꿔야 할까?'\n\n서두르지 않고 잠시 그 물음에 머뭅니다.\n\n떠오르는 것 하나를 붙잡아 봅니다.\n버려야 할 습관 하나,\n바꿔야 할 말투 하나,\n꾸준히 이어야 할 노력 하나.\n\n큰 변화가 아니어도 괜찮습니다.\n아주 작은 한 가지면 충분합니다.\n\n그러자 소원이 저 멀리 있는 바람이 아니라,\n지금 내 손안의 첫 걸음이 됩니다.\n\n가슴 한가운데가 잔잔하고 단단해집니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n무언가를 간절히 바라게 될 때면,\n'나는 무엇을 바꿀까'를 함께 물어봅니다.\n그리고 그 작은 변화를 오늘 하나 시작해 봅니다.","duration":"약 5분","tags":"#성취명상 #자기변화 #다짐","series":"숨비명상"},{"id":"899037f7","category":"탈중심화","title":"조금만 더","body":"우리는 자주 '조금만 더 있으면 행복할 텐데' 하고 생각합니다.\n\n그런데 이상하게도 그 '조금 더'에 닿고 나면,\n만족의 선은 어느새 한 걸음 더 물러나 있습니다.\n\n그렇게 우리는 행복을 향해 달리지만 늘 한 걸음이 모자랍니다.\n마치 제자리를 도는 쳇바퀴처럼요.\n\n진짜 부유한 사람은 가장 많이 가진 사람이 아니라,\n'이만하면 됐다' 하고 멈출 줄 아는 사람입니다.\n\n오늘은 잠시 그 쳇바퀴에서 내려서 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 잔잔해집니다.\n\n이제 요즘 '이것만 있으면',\n'이게 없어서' 하고 마음이 걸리던 것을 하나 떠올려 봅니다.\n\n그것이 없어서 지금 내가 부족하다고 느낍니다.\n\n그런데 가만히 돌아보면,\n예전에 그토록 바라던 것을 이미 이룬 적도 많습니다.\n그때마다 만족의 선은 다시 앞으로 물러났습니다.\n\n지금도 나는 그 보이지 않는 쳇바퀴 위를 달리고 있는지 모릅니다.\n\n이제 달리기를 잠시 멈춥니다.\n쳇바퀴에서 가만히 한 걸음 내려섭니다.\n\n그리고 지금 이 자리에 이미 있는 것들을 둘러봅니다.\n없는 것이 아니라,\n있는 것을.\n\n지금 쉬고 있는 이 숨,\n비바람을 막아 주는 지붕,\n이 잠깐의 고요,\n나를 아끼는 누군가.\n\n신기하게도 가진 것은 그대로인데,\n'더'를 향한 달음질을 멈추자 문득 이만하면 넉넉하게 느껴집니다.\n\n부족한 마음이 다시 올라와도 괜찮습니다.\n알아차리고 다시 쳇바퀴에서 내려서면 됩니다.\n\n만족은 더 많이 갖는 데 있지 않았습니다.\n달리기를 멈추고 지금을 바라보는 데 있었습니다.\n\n가슴 한가운데가 잔잔하고 넉넉하게 차오릅니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n'조금만 더'가 나를 다시 몰아세우는 날이면,\n잠시 멈춰 숨을 한 번 쉬고,\n이미 내게 있는 것 하나를 가만히 떠올려 봅니다.","duration":"약 7분","tags":"#지족 #만족 #내려놓기","series":"숨비명상"},{"id":"8c838fb5","category":"수용","title":"마주보기","body":"누군가와 진심으로 마주할 때,\n눈과 눈,\n마음과 마음이 열릴 때,\n무언가 통하고 따뜻해집니다.\n\n그런데 '마주봄'에는 숨은 뜻이 하나 있습니다.\n상대를 마주보는 일이 곧 나를 보는 일이라는 것.\n\n당신을 온전히 바라볼 때,\n나는 내 안의 온전함도 함께 만나게 됩니다.\n\n오늘은 그 마주봄을 가만히 연습해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 부드러워집니다.\n\n이제 한 사람을 떠올려 봅니다.\n조금 더 가까워지고 싶은 사람,\n혹은 그저 자주 마주치는 사람.\n\n그 사람이 지금 내 앞에 마주 앉아 있다고 그려 봅니다.\n\n평소 우리는 슬쩍 시선을 돌리곤 합니다.\n오늘은 부드럽게 그 사람의 눈을 가만히 바라봅니다.\n\n그 사람의 겉모습이나 직함,\n허물 너머를 봅니다.\n\n그 사람에게도 나만큼이나 긴 하루하루가 있고,\n두려움과 바람이 있고,\n행복하고 싶은 마음이 있습니다.\n나와 똑같이 말입니다.\n\n'당신도 나처럼 온전하고 귀한 사람이구나.'\n\n그렇게 그 사람의 귀함을 보는 순간,\n신기하게도 무언가가 나에게로 되비칩니다.\n그 사람의 눈이 거울처럼 나를 비춥니다.\n\n'당신을 보니, 나도 보입니다.' '당신이 귀하듯, 나도 귀합니다.'\n\n옳고 그름을 따지던 마음이 잠시 조용해집니다.\n그저 온전한 두 사람이 마주 앉아 있을 뿐입니다.\n\n눈맞춤이 어색해도 괜찮습니다.\n마음속으로 잠깐 바라보는 것만으로도 충분합니다.\n\n가슴 한가운데가 잔잔하고 따뜻하게 차오릅니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 누군가와 마주할 때,\n그 눈을 한 박자 더 바라보며 마음속으로 건네 봅니다.\n'당신도 나처럼 귀한 사람이에요.'","duration":"약 7분","tags":"#마주봄 #연결 #자기존중","series":"숨비명상"},{"id":"a914b110","category":"수용","title":"이해의 셈법","body":"오래된 간단한 셈법이 하나 있습니다.\n\n오해가 생겼을 때 그것을 내 입장에서만 세 번 곱씹으면,\n화가 자꾸 커집니다.\n5 더하기 3은 8이 되듯이.\n\n그런데 그 오해를 상대의 입장에서 세 번 생각하면,\n화가 빠지고 이해가 남습니다.\n5 빼기 3은 2가 되듯이.\n\n그리고 이해에 이해를 한 번 더 더하면,\n그것이 곧 사랑이 됩니다.\n2 더하기 2는 4이듯이.\n\n오늘은 그 셈을 가만히 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n\n이제 최근의 작은 오해 하나를 떠올려 봅니다.\n나를 조금 서운하게 했던 일.\n\n먼저 내 입장에서 그 일을 떠올려 봅니다.\n'어떻게 나한테 그럴 수 있어.' 곱씹을수록 마음이 뜨거워집니다.\n이것이 더하기입니다.\n\n이제 셈을 바꿔 봅니다.\n그 일을 상대의 자리에서 세 번 생각해 봅니다.\n그 사람은 어떤 사정이 있었을까.\n무엇에 지치고 서툴렀을까.\n\n한 번, 두 번, 세 번.\n생각할수록 뜨겁던 마음에서 화가 빠져나가고 이해가 남습니다.\n이것이 빼기입니다.\n\n완전히 이해되지 않아도 괜찮습니다.\n화가 조금 빠진 것만으로 충분합니다.\n\n여기에 이해를 한 번 더 더해,\n그 사람을 위해 가만히 빌어 봅니다.\n'당신도 편안하기를.' 그 마음이 곧 사랑입니다.\n\n가슴 한가운데가 잔잔하게 풀립니다.\n\n이제 천천히 숨을 고르고 눈을 떠 봅니다.\n\n오해로 마음이 뜨거워지는 날이면,\n빼기를 떠올려 봅니다.\n그 일을 상대의 자리에서 세 번만 생각해 보는 것입니다.","duration":"약 4분","tags":"#동감 #역지사지 #마음챙김","series":"숨비명상"},{"id":"3e0da2a0","category":"자비희사","title":"품는 바다","body":"우리는 모두 보이지 않게 이어져 '다 함께' 살아갑니다.\n\n나에게 오는 인연은 피할 수 없습니다.\n좋은 사람도,\n불편한 사람도 파도처럼 밀려옵니다.\n\n'이건 좋다, 저건 싫다' 하며 파도 하나하나에 끌려다니면 우리는 쉴 새 없이 흔들립니다.\n\n그럴 때 파도가 아니라 모든 것을 품는 바다가 되어 봅니다.\n\n오늘은 그 넓은 바다의 마음을 가만히 만나 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 넓어집니다.\n\n이제 끝없이 펼쳐진 넓고 깊은 바다를 그려 봅니다.\n수평선까지 아득하게 열려 있습니다.\n\n나는 그 위에 떠 있는 하나의 파도가 아니라,\n그 모든 것을 품고 있는 바다 그 자체입니다.\n\n내 위로 크고 작은 파도가 쉼 없이 일었다 스러집니다.\n이 파도들은 내 삶에 오가는 사람들과 일들입니다.\n\n반가운 파도도 있고,\n밀어내고 싶은 파도도 있습니다.\n\n파도 하나에 나를 실으면 나는 이리저리 휩쓸립니다.\n하지만 바다인 나는 그 모든 파도를 그저 품습니다.\n일어난 파도도,\n스러지는 파도도 모두 내 안에서 오갑니다.\n\n이제 몇몇 인연을 떠올려 파도로 맞아 봅니다.\n사랑하는 한 사람,\n나를 힘들게 한 한 사람,\n스쳐 간 낯선 사람.\n\n붙잡지도,\n밀어내지도 않고 넓은 바다로 가만히 품습니다.\n\n그리고 그 모든 파도에게 조용히 세 마디를 건넵니다.\n\n'미안합니다.' '고맙습니다.' '이만해서 다행입니다.'\n\n자꾸 한 파도에 휩쓸려도 괜찮습니다.\n알아차리고 다시 바다처럼 넓어지면 됩니다.\n\n바다는 잔잔한 물결도,\n거친 물결도 어느 하나 빼지 않고 품습니다.\n다 함께, 그렇게.\n\n가슴 한가운데가 넓고 깊게 열립니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n어떤 사람이,\n어떤 일이 파도처럼 나를 흔드는 날이면,\n가만히 떠올려 봅니다.\n나는 파도가 아니라,\n그것을 품는 바다임을.","duration":"약 8분","tags":"#평정심 #포용 #관계","series":"숨비명상"},{"id":"a40ccf14","category":"수용","title":"거름","body":"우리는 힘든 일이 그냥 사라져 버리기를 바랍니다.\n\n그런데 옛말에 이런 말이 있습니다.\n씨앗은 텅 빈 허공에서는 싹트지 않는다고.\n거름이 잘 든,\n기름진 땅에서만 자라난다고요.\n\n우리를 힘들게 하는 것들도 어쩌면 그 거름과 같습니다.\n버려질 쓰레기가 아니라,\n무언가를 자라게 할 기름진 흙이 되어 줍니다.\n\n오늘은 그 마음으로 내 고민을 가만히 바라봅니다.\n\n편안한 곳에 앉아 봅니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n\n이제 요즘 나를 힘들게 하는 일 하나를 떠올려 봅니다.\n가장 깊은 것은 오늘 말고,\n가만히 볼 수 있는 만큼만.\n\n우리는 흔히 그것을 얼른 치워 버리고 싶어 합니다.\n\n이번에는 조금 다르게 봅니다.\n가을에 떨어진 낙엽과 부스러기가 천천히 썩어 검고 기름진 흙이 되듯이,\n\n쓸모없어 보이던 이 시간도 무언가 자라날 땅으로 익어 가는 중입니다.\n\n가만히 물어봅니다.\n'이 힘든 시간이 내 안에 무엇을 길러 냈을까?' '혹은 무엇을 기를 수 있을까?'\n\n조금 더 깊어진 마음,\n남의 아픔을 헤아리는 눈,\n정말 중요한 게 무엇인지 아는 감각.\n\n아직 아무것도 자라지 않았어도 괜찮습니다.\n지금은 흙이 익어 가는 중입니다.\n\n버려진 것은 하나도 없습니다.\n힘들고 지저분해 보이던 부분까지 모두 이 땅을 기름지게 합니다.\n\n텅 빈 허공에서는 아무것도 자라지 않지만,\n이 고단함이라는 거름진 땅에서는 언젠가 싹이 틉니다.\n\n가슴 한가운데가 잔잔하고 든든해집니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n무언가 힘든 일이 헛되이 느껴지는 날이면,\n가만히 떠올려 봅니다.\n이것도 지금 내 안의 흙을 기름지게 하고 있음을.","duration":"약 6분","tags":"#회복 #의미찾기 #마음챙김","series":"숨비명상"},{"id":"8d2007ae","category":"자비희사","title":"마음의 손전등","body":"우리의 관심은 손전등의 불빛과 같습니다.\n\n그 빛을 비추는 곳은 더 크고 또렷하게 보입니다.\n\n그런데 우리는 자주 그 빛을 걱정과 화,\n갈등에 습관처럼 비춥니다.\n\n그러면 그것들이 점점 커져서 하루가 온통 답답하게 느껴집니다.\n\n다행히 그 빛은 내가 어디로든 돌릴 수 있습니다.\n\n오늘은 그 손전등을 가만히 살펴봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n\n이제 가만히 살펴봅니다.\n지금,\n그리고 요즘 내 관심의 빛은 어디를 비추고 있었나요.\n\n풀리지 않은 걱정,\n누군가와의 갈등,\n내게 없는 것.\n그 언저리를 자꾸 맴돌고 있었을지 모릅니다.\n\n탓하지 않고 그저 빛이 향하던 곳을 바라봅니다.\n\n그러고 보니 그 걱정을 자꾸 비출수록 걱정이 더 커졌습니다.\n\n이제 손전등의 손잡이를 가만히 쥐어 봅니다.\n이 빛은 내가 돌릴 수 있습니다.\n\n천천히 빛의 방향을 옮겨 지금 여기 있는 따뜻한 것에 비춰 봅니다.\n\n쉬고 있는 이 숨,\n사랑하는 한 사람,\n오늘의 작은 고마움,\n내가 되고 싶은 모습.\n\n빛이 옮겨 가자 시선도,\n생각도,\n기분도 그 빛을 따라 달라집니다.\n\n가만히 떠올려 봅니다.\n요즘 내 관심이 가장 많이 간 것 세 가지.\n그것이 지금의 내 모습입니다.\n\n그리고 앞으로 관심을 두고 싶은 것 세 가지.\n그것이 나를 이끄는 방향입니다.\n\n자꾸 빛이 걱정으로 돌아가도 괜찮습니다.\n알아차리고 다시 살며시 돌리면 됩니다.\n\n가슴 한가운데가 조금 가볍고 밝아집니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n하루 중 문득,\n내 손전등이 어디를 비추고 있는지 살펴봅니다.\n걱정에 붙들려 있다면,\n지금 여기 있는 좋은 것 하나로 살며시 빛을 돌려 봅니다.","duration":"","tags":"#마음챙김 #관심의방향 #걱정내려놓기","series":"숨비명상"},{"id":"e8475d2a","category":"자비희사","title":"어우러진 꽃밭","body":"조화란 혼자서는 이룰 수 없는 것입니다.\n서로 다른 것들이 한자리에서 어우러질 때 비로소 생겨납니다.\n\n배꽃과 사과꽃이 저마다 피어도,\n벌과 나비가 없으면 열매는 맺히지 않습니다.\n꽃은 벌을 부르고,\n벌은 꽃을 살립니다.\n\n오늘은 그 어우러짐,\n서로가 서로를 살리는 조화를 가만히 느껴 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 부드러워집니다.\n\n이제 봄날의 꽃밭을 떠올려 봅니다.\n넓은 밭에 온갖 꽃이 한데 어우러져 피어 있습니다.\n\n하얀 배꽃,\n발그레한 복숭아꽃,\n연분홍 사과꽃,\n이름 모를 들꽃이 저마다의 빛깔로 피어 있습니다.\n\n그 사이로 벌이 분주히 날고,\n나비가 한가로이 팔랑입니다.\n꽃향기가 은은하게 코끝에 스칩니다.\n\n만약 이 밭에 똑같은 꽃 한 종류만 있다면,\n혹은 꽃만 있고 벌과 나비가 없다면 어땠을까요.\n\n보기에 단조롭고,\n어딘가 생기가 빠졌을 것입니다.\n서로 다른 것들이 함께 있어야 아름답고,\n또 열매도 열립니다.\n\n가만히 보면 이 꽃밭에서는 어느 하나도 혼자 살지 않습니다.\n\n꽃은 벌을 불러 열매를 맺고,\n벌은 그 꽃에서 먹이를 얻습니다.\n서로가 서로에게 기대어 함께 살아갑니다.\n\n이제 요즘 나와 자주 부딪치는 한 사람을 떠올려 봅니다.\n\n그 사람도 이 꽃밭의 한 자리입니다.\n빛깔이 나와 다를 뿐,\n같은 밭에서 함께 피어 있습니다.\n\n부딪치는 인연조차 이 어우러짐의 한 부분입니다.\n그 사람 덕분에 배우고,\n그 사람도 나로 인해 살아갑니다.\n\n이제 나 자신을 봅니다.\n나는 이 꽃밭에 혼자 핀 꽃이 아닙니다.\n\n다른 꽃들,\n벌과 나비와 어우러져 비로소 하나의 온전한 꽃밭이 됩니다.\n너로 인해 내가 있고,\n나로 인해 네가 있습니다.\n\n나 역시 이 조화의 한 자리에서 누군가를 부르고,\n누군가를 살립니다.\n\n가슴 한가운데가 넓고 따뜻하게 차오릅니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 누군가와 함께 있을 때,\n'우리는 서로가 있어야 함께 산다'는 것을 가만히 떠올려 봅니다.\n그 어우러짐 속에 나의 자리가 있습니다.","duration":"","tags":"#조화명상 #공존 #관계","series":"숨비명상"},{"id":"f16054b5","category":"수용","title":"매일 다시","body":"우리는 조금 더 다정하고 지혜로운 사람이 되려고 애씁니다.\n참 좋은 마음입니다.\n\n그런데 여기에 작은 함정이 하나 있습니다.\n\n'나는 이만큼 했어',\n'나는 꽤 괜찮은 사람이야' 하고 어느새 마음속에 점수판을 세우는 것입니다.\n\n그 은근한 우쭐함이 오히려 마음을 닫아 버립니다.\n\n참된 꾸준함은 다 이루었다고 뽐내는 것이 아니라,\n매일 다시,\n기꺼이 처음처럼 시작하는 것입니다.\n\n오늘은 그 마음을 가만히 느껴 봅니다.\n\n편안한 곳에 앉아 봅니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n\n이제 요즘 내가 더 잘하려고 애써 온 것을 하나 떠올려 봅니다.\n더 다정한 말,\n조금 더 참는 마음,\n곁에 있어 주는 것.\n\n가만히 살펴봅니다.\n그 안에 혹시 '나는 이 정도는 하잖아' 하는 점수판이 세워져 있지는 않은지.\n\n탓하지 않고 그저 있는지 없는지 바라봅니다.\n\n그 점수판을 가만히 내려놓아 봅니다.\n\n다 도착했다고 여기지 않아도 됩니다.\n증명할 것도 없습니다.\n나는 그저 오늘,\n작고 따뜻한 한 걸음을 기꺼이 내디디면 됩니다.\n\n'오늘 내가 실천할 작은 한 가지는 무엇일까?' 따뜻한 말 한마디,\n한 번의 깊은 숨,\n작은 솔직함.\n\n어제 잘 못했어도 괜찮습니다.\n꾸준함은 완성이 아니라,\n매일 아침 다시 시작하는 것입니다.\n\n그 작은 한 걸음 안에 잔잔한 기쁨이 있습니다.\n\n가슴 한가운데가 가볍고 맑아집니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n아침마다 어제의 점수판은 가만히 내려놓고,\n오늘 기꺼이 할 따뜻한 한 가지를 골라 봅니다.","duration":"약 6분","tags":"#꾸준함 #초심 #자기돌봄","series":"숨비명상"},{"id":"7567ab10","category":"탈중심화","title":"떨리는 한 걸음","body":"용기는 두려움을 느끼지 않는 것이 아닙니다.\n\n두려움을 그대로 느끼면서도 한 걸음 내딛는 것,\n그것이 용기입니다.\n\n가슴이 쿵쿵 뛰는 것은 멈추라는 신호가 아니라,\n내가 조금 자라나려는 자리에 서 있다는 신호이기도 합니다.\n\n오늘은 두려움을 데리고 작은 한 걸음을 내딛는 연습을 해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n불안하면 눈을 감지 않아도 됩니다.\n두 발이 바닥에 닿아 있습니다.\n나는 지금 안전한 이 자리에 있습니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n\n이제 요즘 두려워서 자꾸 미뤄 온 일 하나를 떠올려 봅니다.\n망설이던 연락, 어려운 대화,\n새로 내딛고 싶은 한 걸음.\n아주 무서운 일은 오늘 말고,\n가만히 볼 수 있는 것으로.\n\n그것을 떠올리면 몸 어딘가에 두려움이 느껴집니다.\n가슴이 조이는지,\n속이 울렁이는지,\n손이 살짝 떨리는지.\n\n밀어내지 않습니다.\n두려움도 여기 있어도 괜찮습니다.\n\n우리는 흔히 이렇게 미룹니다.\n'두려움이 사라지면 그때 하자.' 그런데 두려움은 좀처럼 저절로 사라지지 않습니다.\n\n그러니 오늘은 두려움을 데리고 가 봅니다.\n\n그 두려움이 내 옆에 가만히 서 있다고 그려 봅니다.\n굳이 내쫓지 않아도 됩니다.\n\n숨을 한 번 쉬고,\n그 일을 향해 아주 작은 한 걸음을 내딛는 모습을 그려 봅니다.\n두려움을 옆에 둔 채로.\n\n나는 두려워하면서도 동시에 나아갈 수 있습니다.\n두려움이 내 결정을 대신하지는 못합니다.\n\n그 한 걸음을 내디딘 나를 그려 봅니다.\n'무서웠는데도, 해냈다.' 작은 안도와 조용한 뿌듯함이 번집니다.\n\n큰 도약이 아니어도 괜찮습니다.\n아주 작은 한 걸음이면 충분합니다.\n오늘 끝내 못 하더라도,\n두려움을 데리고 그 앞에 서 본 것만으로도 이미 용기입니다.\n\n벽처럼 느껴지던 두려움이 이제는 함께 걸을 수 있는 동행이 됩니다.\n\n가슴 한가운데가 잔잔하고 단단하게 차오릅니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n두려움이 '아직은 하지 마' 하고 붙잡는 날이면,\n숨을 한 번 쉬고 그 두려움을 데리고 할 수 있는 가장 작은 한 걸음을 내디뎌 봅니다.","duration":"","tags":"#용기 #두려움 #한걸음","series":"숨비명상"},{"id":"d6265d9d","category":"자비희사","title":"마음의 원","body":"우리'라는 말, 여러분의 '우리'는 어디까지인가요?\n\n우리는 저마다 마음속에 보이지 않는 원을 그립니다.\n\n나, 내 가족,\n내 사람들은 그 원 안의 '우리'이고,\n그 바깥은 '남',\n'그들'이 됩니다.\n\n그 원의 크기가 곧 내 마음의 크기입니다.\n\n오늘은 그 원을 가만히 살펴보고,\n조금 넓혀 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 넓어집니다.\n\n이제 나를 가운데 두고,\n그 둘레에 하나의 원을 그려 봅니다.\n내가 '우리'라고 느끼는 사람들,\n저절로 마음이 쓰이는 사람들의 원입니다.\n\n그 안에 누가 있나요. 가족,\n가까운 벗의 얼굴을 떠올려 봅니다.\n그 안쪽의 따뜻함을 느껴 봅니다.\n\n이제 원의 가장자리를 봅니다.\n어디서부터 '우리'가 끝나고 '남'이 시작되나요.\n\n이웃, 같이 일하는 사람,\n길에서 스친 이,\n나와 다른 무리의 사람,\n내가 미워하는 누군가.\n그들을 나도 모르게 원 밖에 세워 두었는지 모릅니다.\n\n탓하지 않습니다.\n누구나 원을 그리며 삽니다.\n그저 내 원이 어디쯤인지 바라봅니다.\n\n이제 그 가장자리를 조금 바깥으로 밀어 봅니다.\n방금 원 밖에 있던 한 사람을 안으로 들여 봅니다.\n\n이웃 한 사람,\n물건을 가져다준 사람,\n버스에서 스친 낯선 사람.\n그가 원 안으로 들어옵니다.\n'이 사람도 우리.'\n\n조금 더 넓혀 봅니다.\n나와 부딪쳤던 사람마저도.\n그 사람도 나처럼 행복하고 싶은 한 사람입니다.\n'그 사람도 우리.'\n\n이제 원을 더 크게 넓힙니다.\n멀고 가까운 모든 사람,\n같은 하늘 아래 함께 살아가는 이들.\n'세상 모두가 우리.'\n\n원이 크게 안 넓혀져도 괜찮습니다.\n한 사람만 더 들여도 마음은 그만큼 넓어집니다.\n\n원이 넓어질수록 마음이 커지고,\n따뜻해지고, 덜 외로워집니다.\n'그들'은 줄고,\n'우리'가 늘어납니다.\n\n가슴 한가운데가 넓고 따뜻하게 열립니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 평소 '남'이라 여기던 한 사람을 '우리' 안으로 들여 봅니다.\n미소 한 번,\n따뜻한 말 한마디로.","duration":"약 8분","tags":"#포용 #우리 #관계","series":"숨비명상"},{"id":"e391446e","category":"수용","title":"이 또한 지나간다","body":"맑던 하늘에서 갑자기 소나기가 쏟아지면,\n우리는 종종 하늘을 탓합니다.\n\n하지만 하늘은 늘 변하는 것이 자연스럽습니다.\n맑았다가 흐리고,\n비 왔다가 다시 갭니다.\n\n우리 삶도 그렇습니다.\n좋은 때도,\n힘든 때도 계절처럼 오고 갑니다.\n그 변화에 맞서 버틸수록 마음은 더 힘들어집니다.\n\n오늘은 '이 또한 지나간다'는 마음에 가만히 머물러 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 잔잔해집니다.\n\n이제 한 해의 계절이 천천히 도는 모습을 떠올려 봅니다.\n차가운 겨울이 지나면 봄이 오고,\n뜨거운 여름이 지나면 가을이 옵니다.\n\n어느 계절도 머물지 않습니다.\n그리고 우리는 겨울엔 옷을 껴입고 여름엔 얇게 입으며 살아갑니다.\n겨울을 탓하지 않고,\n그저 거기에 맞춰 입습니다.\n\n이제 요즘 나에게 힘든 일 하나를 떠올려 봅니다.\n내가 지나고 있는 차갑고 긴 겨울 같은 시간입니다.\n\n이것도 하나의 계절입니다.\n영원하지 않습니다.\n가만히 그 힘든 마음에게 말해 봅니다.\n'이 또한 지나갈 거야.'\n\n겨울이 끝나듯,\n이 시간도 언젠가 지나갑니다.\n오늘 다 해결하지 않아도 됩니다.\n그저 따뜻하게 껴입고,\n쉬어 가며 이 계절을 건너면 됩니다.\n\n가슴을 누르던 것이 조금 가벼워집니다.\n\n이번엔 지금 내게 있는 좋은 것 하나를 떠올려 봅니다.\n작은 기쁨, 따뜻한 사람.\n\n이것도 하나의 계절입니다.\n그러니 움켜쥐려 하기보다,\n지나가기 전에 지금 더 아끼고 누려 봅니다.\n\n가만히 느껴 봅니다.\n모든 것을 그대로 붙들어 두려는 마음,\n변하지 않으려는 고집을 살며시 내려놓습니다.\n\n날씨에 옷을 맞추듯,\n나도 내 삶의 변화에 맞춰 부드럽게 흘러가도 됩니다.\n\n변화가 두려워도 괜찮습니다.\n저항하는 마음이 올라와도,\n알아차리고 다시 흐름에 몸을 맡기면 됩니다.\n\n가슴 한가운데가 잔잔하고 편안해집니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n힘든 계절이 마음을 누르는 날이면,\n숨을 한 번 쉬며 가만히 되뇌어 봅니다.\n'이 또한 지나간다.' 그리고 좋은 계절이 올 때는,\n지금 여기서 충분히 누려 봅니다.","duration":"약 8분","tags":"#이또한지나간다 #변화수용 #쉼","series":"숨비명상"},{"id":"d52fbb5a","category":"탈중심화","title":"소신과 고집","body":"무언가를 굳게 지킬 때 우리는 '소신 있다'고 말합니다.\n\n그런데 소신이라 여긴 것이 사실은 고집일 때가 있습니다.\n지기 싫은 마음,\n내가 옳다는 우김,\n욱하고 올라온 감정 말입니다.\n\n둘은 겉으로는 비슷해 보여서 스스로도 헷갈립니다.\n\n오늘은 그 둘을 내 안에서 가만히 구별해 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 잔잔해집니다.\n\n이제 요즘 내가 굳게 지키고 있는 것 하나를 떠올려 봅니다.\n어떤 의견, 어떤 결정,\n누군가와의 다툼에서의 내 입장.\n\n그것을 떠올릴 때 몸에서 올라오는 느낌을 살펴봅니다.\n\n가슴이 뜨거워지고 턱에 힘이 들어가나요.\n'절대 물러설 수 없어',\n'어떻게 나한테 그래' 하는 뜨거운 기운이 있나요.\n\n아니면 어쩐지 잔잔하고 담담한가요.\n아무도 보지 않아도,\n마음이 고요할 때에도 그대로 지킬 만한 것인가요.\n\n뜨거운 기운은 대개 고집을 가리킵니다.\n지기 싫은 마음, 두려움,\n욱한 감정의 파도이지요.\n\n잔잔한 굳셈은 바른 믿음,\n곧 소신을 가리킵니다.\n\n그 뜨거움을 숨과 함께 잠시 가라앉혀 봅니다.\n그리고 가만히 물어봅니다.\n'이건 옳아서 굳센 걸까, 아니면 지기 싫어서 굳센 걸까?'\n\n답을 서둘러 내리지 않아도 됩니다.\n그저 정직하게 바라봅니다.\n\n대부분은 소신과 고집이 조금씩 섞여 있습니다.\n그것을 알아차린 것만으로도 충분합니다.\n\n고집인 부분은 살며시 느슨하게 풀고,\n바른 믿음인 부분은 뜨겁게 우기지 않고 조용히,\n단단하게 지키면 됩니다.\n\n가슴 한가운데가 맑고 차분해집니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n무언가를 강하게 밀어붙이게 되는 순간,\n숨을 한 번 쉬고 물어봅니다.\n'이건 바른 믿음일까, 내 고집일까?' 그 한 번의 물음이 나를 조금 더 지혜롭게 합니다.","duration":"약 7분","tags":"#소신 #고집내려놓기 #자기성찰","series":"숨비명상"},{"id":"81d7aa3b","category":"관찰","title":"돌아본 발자국","body":"우리는 모두 성공하고 싶어 합니다.\n\n그런데 내가 바라는 성공은 어떤 모습일까요.\n대개는 더 많이 갖고,\n더 높이 오르고,\n남보다 앞서는 것입니다.\n\n하지만 오래된 한 가지 기준이 있습니다.\n누군가를 아프게 하고 얻은 것은 성공이 아니라는 것.\n\n참된 성공은 내 뒤에 우는 사람을 남기지 않는 것입니다.\n\n오늘은 잠시 내가 걸어온 길을 돌아봅니다.\n\n편안한 곳에 앉아 봅니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n\n이제 나에게 '성공'이 무엇을 뜻하는지 떠올려 봅니다.\n요즘 내가 좇고, 비교하고,\n바라는 것은 무엇인가요.\n\n내가 쓰는 잣대를 가만히 봅니다.\n남보다 많이, 남보다 높이.\n탓하지 않고 그저 바라봅니다.\n\n이제 그 성공을 향해 걸어온 길을 돌아봅니다.\n내가 남긴 발자국을 봅니다.\n\n그 자취 어딘가에 아프게 한 사람이 있지는 않은지요.\n내 욕심을 위해,\n앞서기 위해 누군가를 밀치거나 눈물짓게 하지는 않았는지요.\n\n아주 깊은 일은 오늘 말고,\n가만히 볼 수 있는 것으로.\n\n떠오르는 사람이 있다면,\n죄책감에 빠지지 않아도 됩니다.\n그저 솔직하게 인정합니다.\n'그때 내가 그 사람을 아프게 했구나.'\n\n그리고 마음속으로 건넵니다.\n'미안합니다. 부디 편안하기를.'\n\n이제 가만히 성공을 다시 그려 봅니다.\n\n남을 딛고 꼭대기에 서는 것이 아니라,\n아무도 울리지 않고 좋은 곳에 이르는 것.\n나와 곁의 사람이 함께 나아가는 것.\n\n완벽할 필요는 없습니다.\n오늘 한 번 발자국을 돌아본 것만으로도 가는 방향이 조금 달라집니다.\n\n가슴 한가운데가 맑고 단단해집니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n무언가를 향해 달려가게 될 때면,\n잠깐 뒤의 발자국을 돌아봅니다.\n누군가 다치고 있지는 않은지.\n아무도 울리지 않는 길을 골라 봅니다.","duration":"약 6분","tags":"#성공의의미 #성찰 #선한마음","series":"숨비명상"},{"id":"5d507c91","category":"자비희사","title":"세 마디","body":"극락과 지옥은 멀리 있지 않습니다.\n\n함께 사는 사람들과 화목하면 그 자리가 곧 극락이고,\n마음이 어긋나면 그 자리가 곧 지옥이 됩니다.\n\n그리고 그것을 만드는 것은 다른 누구도 아닌 지금 이 순간의 내 마음입니다.\n\n화목한 꽃동산을 사나운 풍파로 만드는 것도,\n다시 꽃동산으로 되돌리는 것도 내 마음에 달려 있습니다.\n\n그 풍파를 잠재우는 세 마디의 말이 있습니다.\n오늘은 그 말을 가만히 건네 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 부드러워집니다.\n\n이제 나와 가장 가까이 함께 사는 사람을 떠올려 봅니다.\n가족, 곁의 사람,\n한 집에 사는 이.\n가까운 만큼 가장 자주 부딪치는 사람입니다.\n\n그 얼굴을 가만히 떠올립니다.\n\n먼저 첫 번째 말입니다.\n그 사람에게 무심코 날카롭거나 차가웠던 순간을 떠올려 봅니다.\n마음속으로 가만히 건넵니다.\n'미안했어요.'\n\n두 번째 말입니다.\n그 사람이 늘 해 주지만 당연하게 여겼던 것을 떠올려 봅니다.\n'고마워요.'\n\n세 번째 말입니다.\n매일의 부딪침 아래에는 아끼는 마음이 있습니다.\n조금 낯간지러워도 가만히 건네 봅니다.\n'사랑해요.'\n\n말이 어색해도 괜찮습니다.\n마음속으로만 건네도 그 사이가 조금 부드러워집니다.\n\n두 사람 사이의 공기가 조금 따뜻해진 것 같습니다.\n\n떠오르는 사람이 여럿이라면,\n한 사람씩 얼굴을 떠올리며 같은 세 마디를 건네 봅니다.\n\n가만히 보면 집도,\n그 사람도 그대로인데 내 마음이 달라졌습니다.\n꽃동산도 풍파도 모두 여기서 만들어집니다.\n\n가슴 한가운데가 잔잔하고 따뜻하게 차오릅니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 함께 사는 누군가에게 이 세 마디 중 하나를 소리 내어 건네 봅니다.\n'미안해요.' '고마워요.' '사랑해요.'","duration":"약 7분","tags":"#화목 #가족 #관계","series":"숨비명상"},{"id":"8fa4a4d4","category":"관찰","title":"누구를 위한 마음","body":"우리는 남의 허물은 빨리 보고 내 마음은 잘 들여다보지 않습니다.\n\n바른 마음은 그 빛을 먼저 나에게 돌립니다.\n그리고 한 가지를 점검합니다.\n내가 하려는 이 일이 나만을 위한 것인지,\n다른 사람도 담고 있는지.\n\n오늘은 그 물음을 가만히 던져 봅니다.\n\n편안한 곳에 앉아 봅니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 잔잔해집니다.\n\n먼저 최근에 누군가의 잘못을 빠르게 판단했던 순간을 떠올려 봅니다.\n그게 얼마나 쉬웠는지 봅니다.\n\n이제 그 빛을 돌려 상대의 허물이 아니라 나의 최근 행동,\n혹은 지금 내가 하려는 선택을 가만히 바라봅니다.\n\n그것을 마음 앞에 놓고 정직하게 물어봅니다.\n'이 마음은 나만을 위한 것일까, 아니면 다른 사람도 담고 있을까?'\n\n답을 몰아세우지 않습니다.\n그저 솔직하게 바라봅니다.\n\n만약 대부분 나만을 위한 것이라면,\n그걸 본 것만으로도 이미 돌아선 것입니다.\n'조금 더 넓혀 다른 사람도 담을 수 있을까?' 가만히 물어봅니다.\n\n이미 다른 사람도 담겨 있다면,\n그 잔잔하고 든든한 느낌을 느껴 봅니다.\n\n대부분은 욕심과 다정함이 조금씩 섞여 있습니다.\n알아차린 것만으로도 방향이 조금 달라집니다.\n\n신기하게도 내 마음을 정직하게 들여다보는 순간,\n남을 판단하려던 마음도 함께 조용해집니다.\n\n가슴 한가운데가 맑고 차분해집니다.\n\n이 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n중요한 말이나 행동을 하기 전에,\n숨을 한 번 쉬고 물어봅니다.\n'이건 나만을 위한 걸까, 함께를 위한 걸까?'","duration":"약 5분","tags":"#자기성찰 #동기점검 #마음챙김","series":"숨비명상"},{"id":"f9ff16ec","category":"용서감사","title":"감사 명상 (수면용)","body":"자세를 바르게 합니다.\n부드럽게 눈을 감습니다.\n\n숨이 드나드는 것을 느껴 봅니다.\n일부러 바꾸지 않아도 됩니다.\n다만 숨을 내쉴 때마다,\n어깨가 조금씩 아래로 내려앉는 것을 느껴 봅니다.\n\n우리는 곁에 있는 것들을 당연하게 여기며 살아갑니다.\n가족의 얼굴, 매일 걷는 길,\n아침마다 눈이 떠지는 일까지도.\n\n가까운 것일수록 고맙다는 말은 자꾸만 뒤로 미뤄집니다.\n\n오늘은 그 미뤄 둔 인사를 전하는 시간입니다.\n먼저,\n가장 가까이에서 가장 오래 함께해 온 것.\n바로 내 몸에게 첫 인사를 건네 보겠습니다.\n\n—\n\n먼저 두 눈에 주의를 보냅니다.\n이 눈은 내가 태어나 처음으로 세상의 빛을 만난 창입니다.\n\n사랑하는 사람의 웃는 얼굴,\n해 질 녘 물드는 하늘을 보여 주고,\n울고 싶은 날에는 말없이 눈물을 흘려보내며 마음의 무게를 대신 덜어 주었습니다.\n\n그 눈에게 마음속으로 말해 봅니다.\n'눈아, 고마워. 네 덕분에 이 세상을 볼 수 있었어.'\n\n—\n\n이제 귀로 주의를 옮깁니다.\n\n내 이름을 부르는 목소리,\n좋아하는 노래,\n창밖의 빗소리를 하루도 빠짐없이 안으로 들여보내 주었습니다.\n\n세상과 나를 이어 준 귀에게,\n고마움을 전합니다.\n\n—\n\n이제 코로 주의를 가져갑니다.\n코는 내가 처음 울음을 터뜨린 그 순간부터 단 한 번도 쉬지 않고 숨을 이어 왔습니다.\n내가 잠든 밤에도,\n정신이 팔린 낮에도.\n\n숨을 한 번 천천히 들이쉬며,\n살아 있음을 느끼게 해 주는 코에게 고마움을 전합니다.\n\n—\n\n이제 입으로 주의를 가져옵니다.\n우리는 입을 통해 수많은 인사를 건네고,\n누군가를 웃게 한 농담과 누군가를 일으킨 위로를 세상에 내보냈습니다.\n그리고 매일,\n따뜻한 밥을 먹여 나를 살아 있게 해 주었습니다.\n\n오늘 하루의 말과 밥을 가능하게 해 준 입에게,\n고마움을 전합니다.\n\n—\n\n이제 가슴 한가운데,\n심장으로 주의를 가져갑니다.\n한 손을 가슴 위에 가만히 얹어 보세요.\n손바닥 아래에서 심장이 조용히 뛰고 있습니다.\n\n이 심장은 내가 태어나기 전,\n엄마의 뱃속에서부터 뛰기 시작해 오늘 이 순간까지 단 일 초도 쉬지 않았습니다.\n\n내가 심장을 까맣게 잊고 지낸 수많은 날에도,\n누가 알아주지 않아도,\n묵묵히 나를 위해 뛰어 왔습니다.\n\n그 리듬을 손바닥으로 느끼며,\n가만히 말해 봅니다.\n'심장아, 고마워. 네가 있어서 내가 여기까지 왔어.'\n\n—\n\n이제 팔과 손을 떠올려 봅니다.\n두 손의 무게와 온기를 느껴 보세요.\n\n아기였을 때 나를 안아 준 사람의 손가락을 고사리처럼 꼭 쥐던 그 작은 손이 자라나,\n이제는 지친 누군가의 등을 두드려 주고,\n사랑하는 사람을 끌어안아 온기를 전하는 손이 되었습니다.\n\n오늘 하루 나의 손이 닿았던 모든 순간에 고마움을 전합니다.\n\n—\n\n이제 다리와 발로 주의를 옮깁니다.\n두 발의 감각을 가만히 느껴 보세요.\n\n수없이 넘어지며 첫걸음마를 배운 그날부터,\n보고 싶은 사람에게 달려가던 길까지 그 모든 길을 나와 함께 걸었고,\n아무리 지친 날에도 어김없이 나를 집으로 데려다주었습니다.\n\n땅과 나를 이어 주는 다리와 발에게 고마움을 전합니다.\n\n—\n\n이제 몸 전체를 따뜻한 빛으로 감싸듯 느껴 봅니다.\n상처가 나면 말없이 아물게 하고,\n내가 모르는 사이에도 나를 돌보아 온,\n세상에서 가장 오래 나를 보살펴 온 것은 바로 이 몸이었습니다.\n\n머리끝에서 발끝까지,\n깊은 고마움을 전합니다.\n\n—\n\n이제 고마움을 조금씩 넓혀 보겠습니다.\n\n생각만 해도 미소가 지어지는 행복한 순간 하나를 떠올려 봅니다.\n사랑하는 사람의 얼굴일 수도,\n비 오는 날 창밖의 빗소리일 수도 있습니다.\n\n그 장면 속에서 입가가 저절로 부드러워지고,\n가슴에 잔잔한 온기가 번져 가는 것을 느껴 봅니다.\n\n그 온기 속에서 한 사람의 얼굴을 떠올려 봅니다.\n나를 위해 밥을 지어 준 사람,\n힘든 날 말없이 곁을 지켜 준 사람.\n\n그 얼굴을 마음에 품고 가만히 고마움을 전합니다.\n'당신이 있어서 여기까지 올 수 있었습니다. 감사합니다.'\n\n—\n\n이제 조금 더 멀리,\n마음을 넓혀 봅니다.\n\n오늘 아침의 밥 한 그릇에는 땀 흘려 농사지은 이의 수고가,\n지금 이 자리에는 벽돌을 쌓아 올린 이들의 손길이 담겨 있습니다.\n\n나는 혼자 살아온 것이 아닙니다.\n셀 수 없이 많은 고마움에 둘러싸여 여기까지 왔습니다.\n\n그 모든 존재들을 향해 마음속으로 인사를 전합니다.\n'당신들 덕분입니다. 감사합니다.'\n\n—\n\n그리고 마지막으로,\n오늘 처음 인사를 건넨 나의 몸과 마음에게 다시 한 번 전해 봅니다.\n'고맙습니다. 사랑합니다.'\n\n이제 그 고마움을 가만히 내려놓아도 좋습니다.\n\n애써 무언가를 느끼려 하지 않아도 됩니다.\n떠올렸던 얼굴도,\n전하고 싶던 말도,\n이제 천천히 흩어지도록 그냥 두세요.\n\n숨은 점점 느려지고,\n몸은 조금씩 더 무거워집니다.\n어깨도, 팔도,\n다리도 바닥에 포근히 잠겨 듭니다.\n\n내쉬는 숨마다 오늘 하루가 저 멀리 흘러갑니다.\n\n이제 아무것도 하지 않아도 됩니다.\n\n이 따뜻함 속에서,\n편안히 잠들어도 좋습니다.\n\n그저 숨이 나를 데려가는 곳으로,\n천천히, 가만히……\n\n—--------------------------------------\n\n감사 명상\n\n편안한 자세로 누워 봅니다.\n준비가 되었다면,\n천천히 눈을 감아 봅니다.\n\n숨이 드나드는 것을 느껴 봅니다.\n일부러 바꾸지 않아도 됩니다.\n다만 숨을 내쉴 때마다,\n어깨가 조금씩 아래로 내려앉습니다.\n\
