n벽이 좀, 밀리셨나요?\n\n*(웃음. 잠시 쉬었다가 한 번 더 30초.)*\n\n한 번 더.\n이번에는 정말,\n온 힘을 다해서.\n\n*(멈추게 한 뒤.)*\n\n팔이 떨리고 있지요.\n숨이 가빠졌지요.\n어깨가 뻐근하지요.\n그런데 벽은,\n일 밀리미터도\n움직이지 않았습니다.\n\n우리는 마음속에서\n매일 이 동작을 하며 삽니다.\n지나간 일을 밀면서.\n\"그때 그러지 말았어야 했는데.\"\n타인을 밀면서.\n\"저 사람만 바뀌면 되는데.\"\n자신을 밀면서.\n\"나는 왜 이 모양일까.\"\n\n벽은 밀리지 않았습니다.\n지친 것은,\n언제나 나였습니다.\n고통의 대부분은\n벽에서 오는 것이 아니라,\n벽을 미느라 지친\n이 팔에서 옵니다.\n\n2단계 — 손 내리기 (2분)\n\n이제, 밀기를 멈추고\n두 손을 천천히\n내려 보세요.\n\n팔에 퍼지는\n그 느낌을 느껴 보세요.\n저릿하게 풀리는 안도감.\n숨이 돌아오는 소리.\n\n이상하지 않으신가요.\n아무것도 해결되지 않았습니다.\n벽은 여전히 저기 있습니다.\n그런데 밀기를 멈춘 것만으로,\n몸이 이렇게\n편안해졌습니다.\n\n받아들임의 첫걸음은\n거창한 것이 아닙니다.\n그저, 미는 손을\n내리는 것입니다.\n\n3단계 — 기대기 (5분)\n\n이제, 이 명상의\n가장 중요한 순간입니다.\n\n천천히 돌아서서,\n그 벽에\n등을 기대어 보세요.\n\n처음에는 살짝,\n그리고 조금씩\n몸의 무게를 벽에\n맡겨 봅니다.\n\n*(전원이 기댄 뒤, 눈을 감게 한다.)*\n\n눈을 감고,\n등으로 느껴 보세요.\n벽의 단단함이\n등 전체로 전해집니다.\n벽이 지금,\n나를 받쳐 주고 있습니다.\n\n조금 전까지\n이 벽은 나의 적이었습니다.\n밀어도 밀리지 않는,\n나를 지치게 하는 벽이었습니다.\n그런데 지금,\n같은 벽이\n나를 지탱해 주고 있습니다.\n\n벽은, 그대로였습니다.\n달라진 것은\n벽을 대하는\n나의 자세뿐입니다.\n\n받아들임이란,\n그 일을 좋아하게 되는 것이\n아닙니다.\n그 일과 싸우기를 멈추고,\n싸움에 쓰던 그 힘을\n내 삶으로 되찾아 오는 것입니다.\n\n그리고 어쩌면,\n살아온 날들의 어떤 벽들은\n이미 그렇게\n등받이가 되어 있는지도 모릅니다.\n그때는 원망스럽기만 했던 일들이,\n지금의 나를 세운\n버팀벽이 되어 있기도 하니까요.\n\n*(원하는 사람은 벽에 등을 댄 채 스르르 미끄러져 바닥에 앉게 해도 좋다.)*\n\n이제 눈을 뜨고,\n앞을 바라보세요.\n\n벽을 밀 때,\n우리 눈에는\n벽밖에 보이지 않았습니다.\n그런데 벽에 기대는 순간,\n처음으로\n벽의 반대편이 보입니다.\n창이 보이고,\n곁의 사람들이 보이고,\n가야 할 앞이 보입니다.\n\n받아들인다는 것은,\n벽을 등 뒤에 두고,\n드디어 앞을\n바라보게 되는 일입니다.\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n살다가 문득,\n내 마음이 또 무언가를\n밀고 있다는 것을\n알아차리는 순간이 올 겁니다.\n같은 후회를 되감고,\n같은 사람과 마음속에서\n싸우고 있는 순간이요.\n\n그때, 가까운 벽에\n삼십 초만 등을 기대어 보세요.\n집이든, 사무실이든,\n지하철 승강장이든,\n벽은 어디에나 있습니다.\n\n등에 닿는 단단함을 느끼며\n속으로 한 문장만 말해 보세요.\n\"밀지 않고, 기댄다.\"\n\n세상 어디에나 벽이 있다는 것은,\n다행히,\n기댈 곳도 어디에나\n있다는 뜻입니다.\n\n───\n\n진행 팁\n\n- 안전이 먼저다. 밀기 전에 손목을 가볍게 풀게 하고, 팔꿈치를 살짝 굽힌 자세로 밀게 한다. 벽은 콘크리트나 기둥처럼 확실히 고정된 면을 쓴다(칸막이, 가벽 금지).\n- 어깨나 손목이 약한 참가자는 약하게 밀어도 원리는 동일하게 체험된다. \"지그시, 그러나 벽이 밀리지 않는 것을 느낄 만큼\"이면 충분하다. 휠체어 이용 참가자는 등받이에 깊이 기대는 것으로 3단계를 함께한다.\n- 1단계의 \"벽이 좀 밀리셨나요?\"라는 유머가 중요하다. 웃음이 있어야 3단계의 고요한 반전이 깊어진다.\n- 3단계에서 바닥에 미끄러져 앉는 동작은 강요하지 않고 선택으로 둔다. 앉은 참가자들에게는 \"벽에 기대어 앉아 쉬는 이 자세가, 오늘 배운 것의 전부입니다\"라고 짚어 줄 수 있다.\n- 이 기법은 산 명상·바다 명상 직전에 배치하면 좋다. 벽에서 저항의 비용과 기댐의 전환을 몸으로 겪은 뒤에, 폭풍을 밀어내지 않는 산과 파도를 거부하지 않는 바다의 심상이 훨씬 깊이 스며든다.\n- 무거운 사연(사별, 투병 등)을 벽으로 떠올린 참가자가 눈물을 보일 수 있다. \"그 벽을 지금 여기서 다 받아들이지 않으셔도 됩니다. 오늘은 미는 손을 내려 본 것만으로 충분합니다\"라고 안전망을 쳐 준다. 받아들임을 숙제로 만들지 않는 것이 이 단계의 윤리다.\n- 감정 나눔 질문: \"벽을 밀 때와 기댈 때, 몸에서 무엇이 달랐나요?\" / \"여러분이 밀어 온 벽은 무엇이었나요? 말할 수 있는 만큼만요.\" / \"기대어 보니, 무엇이 보였나요?\"","duration":"","tags":"행동형","series":"숨비명상"},{"id":"033c790b","category":"수용","title":"왼손 자화상 - 오늘의 화가","body":"왼손 자화상\n\n늘봄명상 · 수용 단계 — 놀이형 기법 부제 : 서툰 것과 사랑스러운 것은 함께 있을 수 있다 소요 시간 : 약 20분 준비물 : 1인당 도화지 1장과 사인펜(지우개는 나눠 주지 않는다),\n그림을 붙일 벽면과 테이프\n\n───\n\n기법의 원리\n\n수용을 가로막는 가장 큰 적은 \"고쳐야 한다\"는 마음이다. 우리는 거울을 볼 때도, 실수를 했을 때도, 고쳐야 할 곳부터 찾도록 길들여져 왔다. 이 기법은 그 교정의 충동을 안전한 놀이 속으로 불러내어, 눈앞에서 알아차리고, 내려놓는 연습을 시킨다.\n\n장치는 단순하다. 안 쓰는 손으로 자기 얼굴을 그리는 것이다. 비주도 손의 그림은 반드시 서툴다. 즉, 실패가 규칙으로 보장된 활동이다. 잘 그릴 방법이 원천적으로 없으므로 잘 그려야 한다는 부담이 사라지고, 서툶은 부끄러움이 아니라 웃음이 된다. 모두가 함께 서툴기에, 이 방에서 서툶은 완벽하게 안전하다.\n\n핵심은 그린 뒤에 온다. 비뚤어진 눈과 일그러진 입을 보는 순간 누구나 고치고 싶어진다. 그 충동이 바로, 우리가 평생 자신에게 해 온 일의 축소판이다. 오늘의 규칙은 하나 — 고치지 않는다. 서툰 그림을 서툰 그대로 벽에 거는 것이다. 마음 미술관에서 심상으로 연습한 일이, 여기서 실물이 된다.\n\n그리고 이 기법의 가장 깊은 감동은 왼손 그 자체에 있다. 왼손은 평생 오른손 뒤에서 종이를 잡아 주고 그릇을 받쳐 주며 묵묵히 살아온 손이다. 서툴다는 이유로 이 손을 잘라 내자고 한 사람은 아무도 없다. 내 안의 서툰 부분들도 이 왼손과 같다는 것 — 잘난 나를 말없이 받쳐 온, 없어서는 안 될 나의 일부라는 것을, 참가자는 자기 왼손을 내려다보며 깨닫게 된다.\n\n───\n\n진행 절차와 멘트\n\n열기 — 오늘의 화가 (2분)\n\n여러분, 잘 쓰는 손을\n들어 보시겠어요.\n\n*(대부분 오른손을 든다.)*\n\n네, 그 손은 오늘,\n쉬는 날입니다.\n\n오늘의 화가는,\n반대쪽 손입니다.\n평생 조연으로만 살아온\n그 손이, 오늘 처음으로\n붓을 잡습니다.\n\n주제는, 자화상.\n나의 얼굴을 그립니다.\n규칙은 단 하나입니다.\n잘 그리는 것, 금지.\n걱정 마세요.\n그 손으로는, 잘 그리고 싶어도\n그릴 수가 없습니다.\n\n1단계 — 왼손으로 그리기 (5분)\n\n*(사인펜을 비주도 손에 쥐게 한다. 지우개는 없다.)*\n\n자, 시작합니다.\n얼굴 윤곽부터, 천천히.\n선이 벌벌 떨려도,\n동그라미가 감자가 되어도,\n그대로 갑니다.\n\n*(여기저기서 웃음이 터진다. 그리는 중간에 한 번.)*\n\n지금, 고치고 싶으시죠.\n오른손이 근질근질하시죠.\n참으세요.\n그 마음 이야기는,\n잠시 후에 하겠습니다.\n\n눈도 그리고, 코도 그리고,\n입도 그려 주세요.\n비뚤어지면, 비뚤어진 대로.\n오늘만큼은\n비뚤어질 자유가 있습니다.\n\n2단계 — 고치고 싶은 마음 (3분)\n\n*(완성된 그림을 각자 눈앞에 들게 한다.)*\n\n자, 완성입니다.\n잠시 자기 그림을\n바라보세요.\n\n솔직하게 여쭙겠습니다.\n지금, 어디를\n고치고 싶으신가요.\n짝짝이가 된 눈인가요.\n산으로 간 콧대인가요.\n비뚤어진 입인가요.\n\n그 마음, 아주 익숙하지요.\n우리는 평생\n그 마음으로 살아왔습니다.\n거울을 볼 때마다\n고칠 곳부터 찾았고,\n실수를 할 때마다\n모자란 곳부터 봤습니다.\n잘한 아홉보다\n서툰 하나가 먼저 보이는 눈으로요.\n\n그래서 오늘의 규칙은\n하나입니다.\n고치지 않습니다.\n이 그림은, 이대로\n완성입니다.\n\n3단계 — 전시회 (5분)\n\n*(그림을 벽에 나란히 붙이게 한다. 원치 않는 참가자는 자기 자리 앞에 세워 두어도 된다.)*\n\n지금부터,\n우리들의 미술관을\n개관하겠습니다.\n천천히 걸으며\n작품들을 감상해 주세요.\n\n관람 규칙은 두 가지입니다.\n평가하지 않기.\n그리고 각 작품에서\n마음에 드는 곳을\n하나씩 찾기.\n\n*(웃음과 감탄이 오간다. \"이 미소 좀 보세요\", \"눈빛이 살아 있네요\" 같은 말들이 나온다. 충분히 관람하게 둔 뒤, 모두를 그림 앞에 모은다.)*\n\n닫기 — 왼손에게 (5분)\n\n여기, 이상한 미술관이\n하나 생겼습니다.\n\n잘 그린 그림은\n한 장도 없습니다.\n그런데,\n사랑스럽지 않은 그림도\n한 장도 없습니다.\n\n서툰 것과 사랑스러운 것은,\n이렇게\n함께 있을 수 있습니다.\n\n그리고 방금,\n남의 서툰 그림을 보며\n우리는 흉보지 않았습니다.\n오히려 웃었고, 아꼈고,\n마음에 드는 곳을 찾아냈습니다.\n그렇다면 어쩌면,\n나의 서툰 모습을 보는\n다른 사람들의 눈도,\n내가 두려워하는 것보다\n훨씬 따뜻할지 모릅니다.\n\n마지막으로,\n오늘 수고한 왼손을\n가만히 내려다보세요.\n\n이 손은 평생,\n오른손 뒤에서 살았습니다.\n칭찬은 오른손이 받는 동안,\n이 손은 말없이\n종이를 잡아 주고,\n그릇을 받쳐 주고,\n짐의 반쪽을 들어 주었습니다.\n서툴다는 이유로\n이 손을 잘라 내자고 한 사람은,\n아무도 없습니다.\n\n내 안의 서툰 부분들도,\n이 왼손과 같습니다.\n잘하는 나를\n평생 말없이 받쳐 온,\n없어서는 안 될\n나의 일부입니다.\n\n오른손으로,\n왼손을 가만히\n감싸 쥐어 보세요.\n그리고 속으로\n한마디만 건네 봅니다.\n\"오늘, 수고했어.\n그리고 지금까지도,\n수고했어.\"\n\n이제 그림 아래에\n제목을 붙여 주세요.\n그리고 사인은,\n당연히, 왼손으로.\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n이 그림을 집에 가져가서,\n냉장고나 책상 앞에\n붙여 두세요.\n\n이 그림은\n못 그린 그림이 아닙니다.\n완벽하지 않아도\n벽에 걸릴 자격이 있다는,\n나 자신에게 주는\n증명서입니다.\n\n그리고 살다가\n일을 그르친 날,\n스스로가 한심해지는 날,\n그 그림을 한번 봐 주세요.\n그리고 이렇게 말해 보는 겁니다.\n\"오늘은, 왼손 그림 같은\n하루였네.\"\n비뚤어졌지만,\n그런대로 정겨운 하루.\n고치지 않아도,\n걸어 둘 수 있는 하루.\n\n가족이 있다면,\n언젠가 저녁에 둘러앉아\n서로의 얼굴을\n왼손으로 그려 주세요.\n서로의 서툰 그림을 주고받으며\n웃는 그 저녁이,\n온 가족이 함께하는\n수용 명상이 됩니다.\n\n───\n\n진행 팁\n\n- 왼손잡이 참가자는 오른손으로 그린다. 시작 전에 \"잘 쓰는 손의 반대\"로 통일해 안내한다.\n- \"저는 원래 그림을 못 그려요\"라며 걱정하는 참가자에게는 \"오늘은 그게 특기입니다\"라고 답한다. 이 활동에서는 그림 실력이 좋은 사람이 오히려 불리하다는 점이 방을 평등하게 만든다.\n- 외모에 민감한 참가자가 있을 수 있다. 얼굴 대신 전신이나 뒷모습, 또는 '오늘의 나를 닮은 무엇'을 그려도 된다는 선택지를 처음부터 열어 둔다.\n- 벽에 붙이는 전시는 권하되 강요하지 않는다. 붙이지 않은 그림도 관람 대상에서 빼지 말고, 그 자리에서 함께 봐 준다.\n- 2단계의 \"고치고 싶은 마음\" 대목이 이 기법의 심장이다. 웃음이 가라앉기 전에 서두르지 말고, 그림을 바라보는 침묵을 몇 초 둔 뒤에 물어야 충동이 생생할 때 알아차림이 일어난다.\n- 마음 미술관 명상과 짝을 이룬다. 심상으로 미술관을 경험한 회기 뒤에 이 실물 전시를 배치하면, \"그냥 그림\"이라 이름 붙이던 연습이 자기 그림 앞에서 완성된다.\n- 감정 나눔 질문: \"고치고 싶은 충동이 올라왔을 때, 어떤 느낌이었나요?\" / \"다른 사람의 그림을 보며 무슨 마음이 들었나요?\" / \"왼손을 감싸 쥐던 순간, 떠오른 것이 있다면?\"\n\n서툰 나에게\n\n왼손 자화상 후속 명상 · 수용과 자기 감사\n예상 낭독 시간 : 약 14분\n진행 : 왼손 자화상 활동을 마친 직후, 그림을 벽에 건 채(또는 무릎 앞에 둔 채) 자리에 앉아 진행한다.\n\n───\n\n그림은 그 자리에 그대로 두고,\n편안한 자세로 앉아 보세요.\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 올려놓습니다.\n\n준비가 되었다면,\n천천히 눈을 감아 보세요.\n\n방 안에 아직,\n웃음의 온기가 남아 있습니다.\n그 따뜻한 기운 속에서,\n숨이 드나드는 것을 느껴 봅니다.\n숨을 내쉴 때마다,\n웃느라 들썩이던 어깨가\n조금씩 가라앉습니다.\n\n이제 마음의 눈으로,\n조금 전의 시간을\n천천히 되짚어 봅니다.\n\n펜을 쥔 왼손이\n가늘게 떨리던 느낌.\n마음처럼 그어지지 않던 선.\n그리고 그 사이사이,\n자꾸만 올라오던 마음.\n\n고치고 싶다.\n바로잡고 싶다.\n이대로 두면 안 될 것 같다.\n\n그 마음을 탓하지 않고,\n가만히 바라봅니다.\n아주 오래된,\n낯익은 마음이니까요.\n\n이제 마음의 눈앞에,\n내가 그린 자화상을\n떠올려 봅니다.\n\n삐뚤빼뚤한 얼굴선.\n짝짝이가 된 두 눈.\n어디론가 흘러간 콧대.\n비뚜름하게 웃고 있는 입.\n\n그런데,\n가만히 보고 있으면\n이 그림, 어딘가\n낯익지 않으신가요.\n\n떨리는 선,\n짝짝이 눈,\n서툴지만 정직한 얼굴.\n\n우리가 아주 어릴 적에\n그리던 그림입니다.\n예닐곱 살 무렵,\n크레파스를 쥐고 그리던\n바로 그 그림입니다.\n\n그때 우리는,\n이런 그림을 그려 놓고도\n조금도 부끄러워하지 않았습니다.\n오히려 자랑스럽게 들고 달려가,\n봐 달라고 했습니다.\n그 삐뚤빼뚤한 그림이\n냉장고에, 벽에,\n자랑처럼 붙어 있었습니다.\n\n언제부터였을까요.\n우리가 자신의 그림을,\n자신의 모습을,\n부끄러워하게 된 것은.\n\n자라면서 우리는\n어디선가 배웠습니다.\n잘해야 칭찬받는다고.\n잘해야 사랑받는다고.\n그날부터 우리는\n스스로를 고치기 시작했고,\n서툰 나를\n숨기기 시작했습니다.\n\n그림 속의 그 아이가,\n지금 나를\n마주 보고 있습니다.\n\n살아온 날들에도,\n왼손 그림 같은 순간들이\n있었습니다.\n말이 마음처럼 나오지 않아\n어색하게 끝난 자리.\n잘하고 싶었는데\n자꾸만 어긋나던 일.\n돌아보면 얼굴이 화끈거리는,\n서툴렀던 나의 장면들.\n\n우리는 그 장면들을\n찢어 버리고 싶어 했습니다.\n\n오늘은, 다르게 해 봅니다.\n그 서툴렀던 장면 하나를\n가만히 떠올려,\n액자에 담아,\n고치지 않은 채,\n마음의 벽에 걸어 봅니다.\n\n괜찮습니다.\n오늘 우리는 배웠으니까요.\n서툰 그림도\n벽에 걸릴 수 있다는 것을.\n\n이제,\n오른손으로\n왼손을 가만히\n감싸 쥐어 보세요.\n\n오늘 처음으로\n주인공이 되어 본 손입니다.\n\n이 손은 평생,\n칭찬받는 자리에\n서 본 적이 없습니다.\n오른손이 글씨를 쓰는 동안\n말없이 종이를 잡아 주었고,\n오른손이 박수를 받는 동안\n조용히 곁에서 함께 쳤습니다.\n\n그리고 생각해 보면,\n아픈 밤 이마를 짚던 것도,\n답답한 날 가슴을\n쓸어내리던 것도,\n흐르는 눈물을\n닦아 주던 것도,\n언제나 이 손이었습니다.\n서툴다고 여겼던 이 손이,\n가장 힘든 순간마다\n나를 만져 주고 있었습니다.\n\n그 손의 온기를 느끼며,\n마음속으로 말해 봅니다.\n\n'고마워.\n잘하지 못해도,\n늘 곁에 있어 줘서.'\n\n그리고 이제,\n그 고마움을\n조금 더 넓혀 봅니다.\n\n이 왼손처럼,\n내 안에도\n서툰 부분들이 있습니다.\n그런데 가만히 돌아보면,\n그 서툰 부분들이야말로\n말없이 나를 도와 왔습니다.\n\n머뭇거리는 소심함은,\n나를 함부로 뛰어들지 않게\n지켜 주었습니다.\n지나치게 예민한 마음은,\n남들이 놓치는 누군가의 아픔을\n알아채게 해 주었습니다.\n쉽게 차오르는 눈물은,\n내가 여전히 따뜻한 사람이라는\n증거가 되어 주었습니다.\n\n잘난 나만\n나를 살게 한 것이 아니었습니다.\n서툰 나도,\n평생 이 왼손처럼,\n말없이 나를 받쳐 왔습니다.\n\n그리고, 한 가지 더\n떠올려 봅니다.\n\n지금까지 나를\n아껴 준 사람들이 있습니다.\n나를 보고 웃어 준 사람,\n내 곁에 남아 준 사람.\n\n그 사람들은,\n완벽한 나를\n사랑한 것이 아니었습니다.\n허둥대던 나,\n말실수하고 얼굴 붉히던 나,\n서툰 채로 웃던,\n그냥 나를 사랑했습니다.\n\n완벽해서 사랑받은 것이 아니라,\n나여서, 사랑받았습니다.\n\n이제 마지막으로,\n그림 속의 그 아이에게\n돌아가 봅니다.\n\n크레파스를 쥐고\n삐뚤빼뚤한 그림을 그리던,\n그리고 그것을 자랑스러워하던,\n어린 날의 나.\n\n그 아이는 단 한 번도,\n나에게 완벽해지라고\n말한 적이 없습니다.\n그 아이가 바란 것은\n어쩌면 하나뿐이었는지도 모릅니다.\n내가, 나를\n미워하지 않는 것.\n\n그 아이에게,\n마음속으로\n가만히 말해 봅니다.\n\n'미안해.\n그동안 너를\n많이 다그쳤지.'\n\n'그리고, 고마워.\n서툰 걸음으로,\n여기까지 나를\n데려와 줘서.'\n\n'이제부터는,\n너를 덜 혼내고,\n더 자주 안아 줄게.'\n\n울컥하는 마음이\n올라와도 괜찮습니다.\n흐르는 눈물이 있다면,\n닦지 않고\n그대로 두어도 괜찮습니다.\n그 아이는 이 말을,\n아주 오랫동안\n기다려 왔을 테니까요.\n\n가슴 한가운데에\n잔잔한 온기가\n번져 가는 것을 느껴 봅니다.\n숨을 들이쉴 때마다\n그 온기가 조금씩 차오르고,\n내쉴 때마다\n오래 움켜쥐고 있던 것들이\n조금씩 놓여 갑니다.\n이 느낌 속에,\n잠시 머물러 보세요.\n\n이제 그 따뜻함을\n가슴에 담은 채,\n천천히 돌아올 준비를 합니다.\n\n감싸 쥐었던 왼손을\n가만히 풀어,\n두 손을 무릎 위에 내려놓습니다.\n손가락 끝을 가볍게 움직여 보세요.\n발가락도 천천히 움직여 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서,\n지금 앉아 있는 이 자리의 감각을\n느껴 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 보세요.\n\n눈을 뜨면,\n나의 자화상이\n그 자리에서\n나를 기다리고 있습니다.\n\n이 그림을 집에 가져가,\n냉장고에 붙여 주세요.\n어릴 적 누군가\n우리의 그림을 붙여 주었듯이.\n혹시 그때\n아무도 붙여 주지 않았다면,\n그렇다면 더더욱,\n오늘은 내가,\n나의 그림을 붙여 줍니다.\n\n일곱 살의 나와,\n지금의 내가,\n그 냉장고 앞에서\n처음으로 함께 웃을 것입니다.\n\n───\n\n낭독 팁 : 어린 시절 그림 대목과 아이에게 건네는 사과의 말은 이 명상의 두 정점이니 가장 낮고 느린 목소리로 충분한 침묵과 함께 읽고, 눈물이 보이는 참가자가 있어도 멈추지 말고 같은 속도로 끝까지 안아 가듯 이어 가 주세요.\n\n가장 결이 맞는 곡\nQuiet Dawn — Gentle Ambient Piano for Relaxation & Inner Peace\r 공기처럼 가벼운 패드 위에 부드러운 피아노가 얹힌, 조용하고 은은한 분위기의 앰비언트 곡으로 이완과 명상, 내면의 고요를 위해 만들어진 트랙이에요. 멜로디가 앞으로 나서지 않아서 나래이션 전체에 깔기에 제일 좋습니다. YouTube\nHealing Ambient Music — Inner Peace Soundscape\r 젠 명상 사운드와 잔잔한 피아노가 섞인 힐링 사운드스케이프예요. 위 곡보다 조금 더 깊고 어두운 온도라, 서툴렀던 장면들을 마음의 벽에 거는 중반부와 잘 어울립니다.\n따뜻하게 감싸는 온도가 필요하다면\nSoothing Relaxation — Our Journey (Peder B. Helland)\r 이 채널은 유도 명상·힐링 쪽에서 가장 널리 쓰이는 창작곡 채널이에요. 멜로디가 살짝 있는 편이지만 다정하고 서정적이라, 왼손을 감싸 쥐는 대목부터 마지막 냉장고 장면까지 — 온기가 차오르는 후반부에 어울립니다. 같은 채널의 10시간 소프트 피아노 모음도 길게 틀어 두기 좋고요.\n아, 편안해 — 잔잔한 창작 피아노 모음\r '빗물에 씻겨가듯', '일상에 감사하며' 같은 창작곡들로만 구성된 한국 채널이라 아는 멜로디에 마음을 빼앗길 걱정이 없어요. 곡 제목들의 정서도 이 명상과 묘하게 닮아 있습니다.","duration":"","tags":"놀이형","series":"숨비명상"},{"id":"cfb95615","category":"수용","title":"모난 돌 명상","body":"늘봄명상 · 수용 단계 — 감각·소장형 기법 부제 : 깎는 것과 다듬어지는 것은 다릅니다 소요 시간 : 약 20분 준비물 : 모나고 거친 자연석을 담은 바구니(인원보다 넉넉하게,\n둥근 조약돌은 넣지 않는다.\n깨끗이 씻어 말려 둘 것).\n야외라면 직접 줍는 판이 가장 좋다.\n\n───\n\n기법의 원리\n\n\"모난 돌이 정 맞는다.\" 우리는 이 속담을 들으며 자랐다. 모나면 안 된다고, 둥글게 살라고. 그래서 평생 자신의 모난 곳 — 예민함, 고집, 욱하는 성미, 소심함 — 을 정으로 쪼아 내며 살아왔다. 이 기법은 그 오래된 속담을, 손안의 돌 하나로 뒤집는다.\n\n장치는 세 겹이다. 첫째, 촉각 관찰. 눈을 감고 손끝으로 돌의 차가움과 무게, 거친 결과 모서리를 판단 없이 따라간다. 셋째 주에 익힌 관찰이 촉각으로 이어지는 것이다. 둘째, 데우기. 돌을 두 손으로 감싸 쥐고 있으면, 돌은 조금도 변하지 않았는데 어느새 따뜻해져 있다. 고치지 않아도, 품으면 따뜻해진다는 수용의 본질이 손바닥 위에서 증명된다. 셋째, 모서리의 재발견. 둥글기만 한 조약돌들은 서로 구별되지 않는다. 이 돌을 세상에 하나뿐인 이 돌이게 하는 것은, 바로 모난 곳이다. 나의 모난 부분 역시 깎아 낼 결함이 아니라 나를 나이게 하는 지문임을, 참가자는 돌의 모서리를 쓰다듬으며 깨닫는다.\n\n그리고 강돌의 진실이 마지막 위로가 된다. 강의 돌들도 둥글다. 그러나 정으로 쪼아 둥글어진 돌은 단 하나도 없다. 물살에 안겨 구르며, 수만 년에 걸쳐 저마다의 속도로 다듬어졌을 뿐이다. 깎는 것과 다듬어지는 것은 다르다 — 자신을 정으로 쪼며 살아온 사람에게, 이 한 문장이 깊은 사면(赦免)이 된다.\n\n완성된 것은 없다. 다만 돌 하나가 주머니로 들어간다. 마음이 모나지는 순간마다 손안에서 만나는, 평생의 수용 도구다.\n\n───\n\n진행 절차와 멘트\n\n열기 — 오래된 속담 (3분)\n\n우리가 어릴 때부터\n귀에 못이 박이게 들어 온\n속담이 하나 있습니다.\n\n\"모난 돌이, 정 맞는다.\"\n\n튀지 마라.\n둥글게 살아라.\n모난 곳은 깎아 내라.\n\n그래서 우리는 평생,\n자신의 모난 곳을\n정으로 쪼며 살아왔습니다.\n예민한 성격을 쪼고,\n고집을 쪼고,\n소심함을 쪼면서.\n그런데 쪼아도 쪼아도,\n모난 곳은 잘\n없어지지 않았습니다.\n아프기만 했습니다.\n\n오늘은,\n이 속담과 반대로\n해 보겠습니다.\n모난 돌을,\n깎지 않고,\n품어 보겠습니다.\n\n1단계 — 돌 고르기 (3분)\n\n*(모난 돌들이 담긴 바구니를 돌리거나, 야외라면 주변에서 직접 줍게 한다.)*\n\n바구니에서\n돌 하나를 골라 주세요.\n\n예쁘고 둥근 돌 말고,\n어딘가 울퉁불퉁하고,\n어딘가 나를 닮은 것 같은\n돌을 골라 보세요.\n손이 먼저 가는 돌이면\n됩니다.\n\n*(고르는 동안 서두르지 않게 둔다. 고르는 행위 자체가 자기 관찰이다.)*\n\n2단계 — 돌 만나기 (5분)\n\n돌을 손바닥에 올리고,\n눈을 감아 보세요.\n\n먼저, 무게를 느껴 봅니다.\n묵직한가요, 가벼운가요.\n\n온도를 느껴 봅니다.\n돌은 지금, 서늘합니다.\n\n이제 손끝으로,\n돌의 표면을\n천천히 여행해 봅니다.\n매끈한 곳, 거친 곳,\n움푹 팬 곳.\n\n그리고 모서리를 찾아,\n그 모난 곳을\n손끝으로 가만히\n따라가 보세요.\n날카로운가요, 뭉툭한가요.\n좋다, 나쁘다는 붙이지 않습니다.\n그저, 만나기만 합니다.\n\n이제 눈을 뜨고,\n돌을 자세히 들여다보세요.\n색의 얼룩, 가느다란 금,\n작은 흠집들.\n이 돌과 똑같은 돌은\n이 세상에 없습니다.\n방금 여러분은,\n세상에 하나뿐인 돌과\n인사를 나눴습니다.\n\n3단계 — 품어서 데우기 (4분)\n\n이제 그 돌을\n두 손으로 감싸 쥐고,\n가슴 앞으로 가져와 보세요.\n그리고 눈을 감습니다.\n\n두 손의 온기가\n돌에게 스며들고 있습니다.\n서두르지 않아도 됩니다.\n그저 쥐고만 있으면 됩니다.\n\n그동안,\n나의 모난 곳을\n하나 떠올려 봅니다.\n너무 예민한 성격일 수도,\n꺾이지 않는 고집일 수도,\n울컥 치미는 성미일 수도,\n머뭇거리는 소심함일 수도\n있습니다.\n평생 깎아 내려 애썼던\n바로 그곳을,\n지금 이 돌처럼,\n손안에 함께 쥐어 봅니다.\n\n*(1분쯤 침묵을 두었다가.)*\n\n이제 돌의 온도를\n느껴 보세요.\n\n따뜻해졌습니다.\n\n돌은 조금도\n변하지 않았습니다.\n모서리도 그대로,\n흠집도 그대로입니다.\n그런데, 따뜻해졌습니다.\n\n고치지 않아도,\n품으면,\n따뜻해집니다.\n\n닫기 — 모서리는 지문이다 (5분)\n\n마지막으로,\n두 가지 이야기를\n들려 드리고 싶습니다.\n\n강가에 가면\n둥근 조약돌이 지천입니다.\n그런데 둥글기만 한 돌들은,\n서로 잘 구별되지 않습니다.\n지금 손안의 이 돌을\n세상에 하나뿐인 돌로\n만들어 주는 것은,\n바로 그 모난 곳입니다.\n\n우리도 그렇습니다.\n예민함은,\n남들이 못 보는 것을 보는\n섬세함의 다른 이름입니다.\n고집은,\n끝내 지키고 싶은 것이\n있다는 뜻입니다.\n나의 모난 곳은\n깎아 낼 결함이 아니라,\n나를 나이게 하는\n지문입니다.\n\n그리고 또 하나.\n강의 돌들도 둥글지요.\n그런데 그중에\n정으로 쪼아서 둥글어진 돌은,\n단 하나도 없습니다.\n물살에 안겨 구르며,\n수만 년에 걸쳐,\n저마다의 속도로\n다듬어졌을 뿐입니다.\n\n깎는 것과,\n다듬어지는 것은 다릅니다.\n나를 정으로 쪼지 마세요.\n삶이라는 강물이,\n나의 속도대로,\n천천히 다듬어 줄 것입니다.\n\n이제 손안의 돌에게,\n아니, 나 자신에게,\n마음속으로 한마디만\n건네 봅니다.\n\n\"모난 채로 와 줘서,\n고마워.\"\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n이 돌은 오늘부터\n여러분의 것입니다.\n주머니에, 가방에,\n책상 위에 두세요.\n\n살다가 마음이\n모나지는 순간이 옵니다.\n스스로가 미워지는 순간,\n또 나를 깎아 내리기\n시작하는 순간.\n\n그때 이 돌을\n가만히 쥐어 보세요.\n손안에서 돌이\n따뜻해지는 동안,\n오늘을 기억해 내면 됩니다.\n고치지 않아도,\n품으면 따뜻해진다는 것을.\n모난 채로도,\n충분히 괜찮다는 것을.\n\n정 맞으라고 있는 돌이 아니라,\n쥐라고 있는 돌입니다.\n오늘부터 이 돌은,\n나의 부적입니다.\n\n───\n\n진행 팁\n\n- 돌 준비가 핵심이다. 매끈한 장식용 조약돌이 아니라 모나고 결이 살아 있는 자연석을 구한다. 손바닥에 쏙 들어오는 크기(4~6cm)가 쥐고 데우기에 알맞다. 반드시 씻어 말려 둔다.\n- 야외 회기라면 마당이나 강가에서 직접 줍는 판이 가장 깊다. \"나를 닮은 돌을 찾아오세요\"라는 채집 자체가 10분짜리 걷기 명상이 된다.\n- 2단계 촉각 관찰은 셋째 주 관찰 훈련의 복습이고, 3단계의 '모난 곳을 함께 쥐기'는 안아주기 명상의 촉각판이다. \"지난주 우리 마음을 안아 주었듯, 오늘은 손으로 품어 봅니다\"로 이어 줄 수 있다.\n- 돌이 따뜻해지는 데는 2~3분이면 충분하다. 3단계의 침묵을 줄이지 말 것. 온도의 변화를 스스로 발견하는 순간이 이 기법의 정점이다.\n- '나의 모난 곳'을 떠올리는 대목에서 깊은 감정이 올라오는 참가자가 있을 수 있다. \"그 모난 곳의 이야기를 지금 다 꺼내지 않으셔도 됩니다. 오늘은 쥐고 있는 것만으로 충분합니다\"로 안전망을 친다.\n- 왼손 자화상과 좋은 짝이다. 자화상이 서툰 나를 웃음으로 받아들이는 연습이라면, 모난 돌은 그 수용을 손에 쥐고 일상으로 가져가는 도구다. 마음 유리병과 함께 '가져가는 명상 도구' 한 쌍을 이룬다.\n- 감정 나눔 질문: \"왜 그 돌을 골랐나요?\" / \"돌이 따뜻해진 것을 느낀 순간, 어떤 마음이 들었나요?\" / \"여러분이 평생 깎아 내려 했던 모난 곳은, 혹시 무엇의 다른 이름일까요?\"","duration":"","tags":"","series":"숨비명상"},{"id":"ada69c4c","category":"자비희사","title":"축원 걷기","body":"늘봄명상 · 자비희사 단계(慈) — 행동형 기법 완전판 부제 : 자애는 향과 같아서,\n상대에게 닿기 전에 먼저 나를 통과한다 소요 시간 : 약 15분 (걷을 수 있는 공간,\n도구 없음)\n\n───\n\n기법의 원리\n\n자애 명상을 처음 배우는 사람들이 가장 어려워하는 것은, 문구의 어색함이다. \"모든 존재가 평안하기를\"이라는 말은 아름답지만, 방석 위에서 외기에는 어딘가 남의 옷 같다. 그러나 사실 우리는 축원을 배운 적이 없어도 이미 알고 있다. 시험 보러 가는 자식의 등 뒤에 대고 비는 마음, 먼 길 떠나는 이에게 건네는 \"조심히 다녀와\" 속에 담긴 마음. 축원은 새로 익히는 기술이 아니라, 이미 우리 안에 있던 마음에 걸음을 붙여 주는 일이다.\n\n이 기법은 자애 문구를 다리로 옮긴다. 공간을 걷다가 누군가와 스칠 때마다 마음속으로 축원을 건네는 것이다. 말도, 아는 사이일 필요도 없다. 세 겹의 장치가 작동한다. 첫째, 걷기가 어색함을 지운다. 가만히 앉아 문구를 외면 어색하지만, 걸으며 스치는 사람에게 건네면 축원이 자연스러운 인사가 된다. 둘째, 문구가 점차 깊어지며 '같음'의 발견으로 이끈다. \"이 분도 나처럼 웃고 싶고, 사랑받고 싶고, 힘든 날이 있는 사람\"이라는 알아차림은, 스치던 타인을 처음으로 나와 같은 한 사람으로 보게 한다. 셋째, 축원의 순서를 뒤집는다. 자기 자신에게 비는 일이 가장 낯선 이들을 위해, 타인을 향한 축원으로 마음을 먼저 데운 뒤, 그 따뜻해진 마음으로 마지막에 나를 축원하게 한다.\n\n그리고 이 기법의 가장 큰 힘은 이동성이다. 회기장을 나서는 순간부터 거리, 지하철, 시장 어디서든, 평생 쓸 수 있다.\n\n───\n\n진행 절차와 멘트\n\n열기 — 우리는 이미 축원을 안다 (2분)\n\n*(참가자들을 공간에 자유롭게 서게 한다.)*\n\n자애 명상이라고 하면,\n어렵게 들립니다.\n\"모든 존재가 평안하기를\"\n이런 말은, 어쩐지\n내 입에 안 붙는 것 같지요.\n\n그런데 사실 우리는,\n축원을 이미 알고 있습니다.\n\n시험 보러 가는 아이의\n등 뒤에 대고,\n우리는 무언가를 빌었습니다.\n먼 길 떠나는 사람에게 건넨\n\"조심히 다녀와\" 한마디에도,\n축원이 들어 있었습니다.\n\n오늘은 그 마음에,\n걸음을 붙여 보겠습니다.\n\n1단계 — 그냥 걷기 (2분)\n\n먼저, 평소처럼\n이 공간을 걸어 보세요.\n길에서 걷듯이,\n서로 스쳐 지나가면서.\n\n*(2분간 자유롭게 걷게 한 뒤.)*\n\n방금, 몇 분과 스치셨나요.\n그런데 스친 분들이,\n기억나시나요.\n\n우리는 평소에\n스치는 사람을\n이렇게 지나칩니다.\n비켜 가야 할 무엇으로,\n풍경의 일부로.\n오늘은, 다르게 스쳐 보겠습니다.\n\n2단계 — 첫 축원 (3분)\n\n다시 걷습니다.\n이제부터는 누군가와 스칠 때마다,\n마음속으로 이렇게 건네 보세요.\n\n'이 분이, 평안하기를.'\n\n소리 내지 않아도 됩니다.\n눈이 마주치면\n가볍게 목례해도 좋습니다.\n\n처음에는 어색할 겁니다.\n쑥스러워 웃음이 나도 괜찮습니다.\n어색함은, 처음 하는\n좋은 일의 표시입니다.\n\n*(3분간 걷게 둔다. 진행자도 함께 걸으며 축원한다.)*\n\n3단계 — 나처럼 (4분)\n\n이제, 축원을\n조금 더 깊게 하겠습니다.\n\n이번에 누군가와 스칠 때는,\n아주 잠깐,\n그분의 삶을 떠올려 보세요.\n\n이 분에게도\n오늘 아침이 있었습니다.\n이 분에게도\n기다리는 사람이 있고,\n말 못 할 걱정이 있고,\n남몰래 흘린 눈물이 있습니다.\n나처럼, 웃고 싶고,\n나처럼, 사랑받고 싶은\n한 사람입니다.\n\n그것을 떠올리며, 건넵니다.\n\n'이 분도, 나와 같은 사람.\n이 분이, 행복하기를.'\n\n*(4분간 걷게 둔다. 걸음이 자연히 느려지고, 공간이 고요해진다.)*\n\n4단계 — 멈춰서 넓히기 (3분)\n\n이제, 그 자리에\n가만히 멈추어 서세요.\n그리고 눈을 감습니다.\n\n방금 스쳐 간\n모든 분들에게,\n한 번 더 축원을 보냅니다.\n'모두, 평안하기를.'\n\n이제 그 축원을\n이 방 밖으로 넓힙니다.\n이 건물의 사람들에게.\n이 거리의 사람들에게.\n그리고 지금 문득 떠오르는,\n내가 사랑하는\n그 얼굴들에게.\n'평안하기를. 행복하기를.'\n\n그리고 마지막으로,\n이 축원을 받을 사람이\n한 명 남았습니다.\n\n오늘 하루도 애쓰며\n여기까지 걸어온 사람.\n남들을 축원하느라\n정작 자신은 늘 뒤로 미뤄 온 사람.\n\n나 자신입니다.\n\n가슴에 한 손을 얹고,\n지금 가장 따뜻해진 그 마음으로,\n나에게 건네 봅니다.\n\n'나도, 평안하기를.\n나도, 행복하기를.'\n\n닫기 (1분)\n\n*(잠시 침묵 후, 눈을 뜨게 한다.)*\n\n방금 여러분은\n한마디 말도 하지 않았습니다.\n그런데 이 방의 공기가\n달라진 것을, 느끼셨을 겁니다.\n축원은 소리가 없어도\n건너갑니다.\n\n그리고 이상한 일이\n하나 일어났을 겁니다.\n남의 평안을 비는 동안,\n내 마음이 먼저\n평안해졌습니다.\n자애는 화살이 아니라\n향과 같아서,\n상대에게 가 닿기 전에\n먼저 나를 통과하기 때문입니다.\n\n그리고 생각해 보면,\n우리도 누군가의 축원 속에서\n여기까지 왔습니다.\n우리가 모르는 사이에도,\n누군가는 우리의 등 뒤에서\n빌어 주고 있었습니다.\n오늘부터 우리는,\n그 축원을\n세상에 돌려주기 시작합니다.\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n내일 아침, 길에 나서면\n마주 오는 사람 세 명에게만\n마음속 축원을 건네 보세요.\n'평안하시기를.'\n그 세 번이면 충분합니다.\n\n붐비는 지하철이 짜증스러운 것은,\n그 안이 '사람들'로\n가득하기 때문입니다.\n그런데 축원을 시작하는 순간,\n그 안은 저마다의 하루를 살아 내는\n'한 사람, 한 사람'으로\n가득 차게 됩니다.\n붐비는 지하철이,\n자애 수행의 도량이 됩니다.\n\n그리고 언젠가, 마음이 넉넉한 날,\n조금 어려운 축원에도\n도전해 보세요.\n나를 서운하게 했던 그 사람에게,\n딱 한 번.\n'그 사람도, 평안하기를.'\n아직은 안 되어도 괜찮습니다.\n그 축원은, 용서를 배우는 주간에\n함께 다시 연습하겠습니다.\n\n───\n\n진행 팁\n\n- 진행자가 반드시 함께 걷는다. 진행자가 참가자와 스치며 목례하는 모습 자체가 가장 좋은 시범이다.\n- 2단계에서 웃음이 나는 것은 실패가 아니다. \"어색함은 처음 하는 좋은 일의 표시\"라는 멘트로 웃음까지 품고 간다.\n- 공간이 좁으면 두 줄로 마주 서서 천천히 엇갈려 지나가는 방식으로 대체할 수 있고, 거동이 불편한 참가자는 앉은 자리에서 지나가는 이들에게 축원을 건네는 역할로 함께한다.\n- 3단계의 '나처럼' 대목이 이 기법의 심장이다. 문구를 서두르지 말고, 걸음 속도가 저절로 느려지는 것을 확인하며 천천히 안내한다.\n- 4단계에서 자신에게 축원을 건네는 순간 눈물을 보이는 참가자가 있다. 남을 축원하는 것은 쉬워도 자신을 축원해 본 적 없는 이들이다. 개입하지 말고 침묵으로 안아 준다.\n- 미운 사람을 향한 축원은 이 회기에서 다루지 않는다. 일상의 다리에서 '언젠가의 도전'으로만 예고하고, 용서 주간으로 넘긴다. 순서를 건너뛰면 저항이 생긴다.\n- 야외 확장판: 프로그램 후반부에 실제 거리나 시장을 함께 걸으며 진행하면, 명상실의 연습이 삶의 실전으로 건너가는 가장 강력한 회기가 된다.\n- 감정 나눔 질문: \"축원을 건네며 걷는 동안, 스치는 사람들이 어떻게 다르게 보였나요?\" / \"자신에게 축원을 건넸을 때, 어떤 마음이 올라왔나요?\" / \"지금까지 나를 위해 빌어 주었을 사람은, 누구일까요?\"","duration":"","tags":"행동형,慈","series":"숨비명상"},{"id":"440f06d0","category":"자비희사","title":"받쳐 주는 손","body":"받쳐 주는 손' 본문을 그대로 펼쳐 드립니다.\n\n───\n\n받쳐 주는 손\n\n늘봄명상 · 자비희사 단계(悲) — 행동형 기법 완전판\n부제 : 짐은 그대로인데, 견딜 만해졌습니다\n소요 시간 : 약 15분 (1인당 500ml 물병 1개, 둘씩 짝지을 수 있는 공간)\n\n───\n\n기법의 원리\n\n연민에 대한 가장 큰 오해는, 상대의 고통을 없애 주어야 한다는 부담이다. 그래서 우리는 해결해 줄 수 없는 고통 앞에서 어쩔 줄 몰라 한다. 뭐라고 말해야 할지 몰라 전화를 미루고, 병문안을 미루고, 끝내 자리를 피한다. 곁에 있어 주지 못한 것이 아니라, 곁에 있는 법을 몰랐던 것이다. 이 기법은 그 법을, 팔의 감각으로 가르친다.\n\n구조는 물 한 잔의 오래된 비유 위에 서 있다. 물병 하나의 무게는 대단치 않다. 그러나 팔을 뻗어 오래 들고 있으면, 그 가벼운 무게가 고통이 된다. 무거워서가 아니라, 혼자 오래 들었기 때문이다. 마음의 짐도 같다. 우리를 무너뜨리는 것은 걱정의 크기가 아니라, 그것을 혼자 든 시간이다.\n\n그때 짝이 그 팔 아래에 말없이 손을 받친다. 물병은 그대로다. 무게도 그대로다. 그런데, 견딜 만해진다. 연민이란 짐을 치워 주는 것이 아니라 그 무게를 함께 드는 것임이, 삼십 초 만에 팔로 증명된다. 그리고 역할을 바꾸면 두 번째 발견이 온다. 받쳐 주는 쪽은, 힘들지 않았다는 것. 연민은 나를 갈아 넣는 희생이 아니라, 지속 가능한 곁이라는 것이다.\n\n마지막으로 이 손은 안으로 향한다. 힘든 날의 나에게도, 이 손이 필요하다.\n\n───\n\n진행 절차와 멘트\n\n열기 — 곁에 있는 법을 몰라서 (2분)\n\n*(둘씩 짝을 짓고, 각자 물병 하나씩 들게 한다.)*\n\n살면서 이런 순간이 있었을 겁니다.\n아끼는 사람이 힘들어하는데,\n뭐라고 말해야 할지 몰라서\n전화를 미루던 순간.\n무슨 위로를 해야 할지 몰라서,\n끝내 자리를 피하던 순간.\n\n우리가 매정해서가 아니었습니다.\n곁에 있는 법을,\n배운 적이 없었을 뿐입니다.\n\n오늘, 그 법을 배웁니다.\n말이 아니라, 팔로 배웁니다.\n\n1단계 — 혼자 드는 짐 (4분)\n\n먼저, 손에 든 물병에\n요즘 나의 무거운 일 하나를\n담아 보세요.\n걱정 하나, 책임 하나,\n말 못 한 마음 하나.\n\n담으셨다면,\n그 물병을 쥐고\n팔을 어깨높이로\n곧게 뻗어 주세요.\n그리고 그대로, 버팁니다.\n\n*(침묵 속에 30~40초. 팔이 떨리기 시작하는 것을 확인하며.)*\n\n지금 드시는 물병,\n무게가 얼마나 될까요.\n500그램입니다.\n들 때는 아무것도 아니었지요.\n\n그런데 지금, 팔이 떨리고\n어깨가 저려 옵니다.\n\n물병이 무거워진 것이 아닙니다.\n혼자, 오래 들었기 때문입니다.\n\n우리 마음의 짐도 똑같습니다.\n우리를 지치게 하는 것은\n걱정의 크기가 아니라,\n그것을 혼자 들고 버틴\n시간입니다.\n\n2단계 — 받쳐 주는 손 (3분)\n\n*(팔의 떨림이 뚜렷해졌을 때, 낮은 목소리로.)*\n\n이제, 짝은\n아무 말 없이,\n그 팔 아래에\n두 손을 가만히\n받쳐 주세요.\n\n*(방 안의 공기가 바뀐다. 안도의 숨소리들. 1분간 그대로 둔다.)*\n\n드는 분, 느껴 보세요.\n물병은 그대로 손에 있습니다.\n짐은 사라지지 않았습니다.\n그런데, 숨이 쉬어집니다.\n\n아무 말도\n오가지 않았습니다.\n해결된 것도 없습니다.\n그저 팔 아래에\n손이 닿았을 뿐인데,\n견딜 만해졌습니다.\n\n3단계 — 떼었다가, 다시 (2분)\n\n이제 받치던 손을,\n잠시만 떼어 보세요.\n\n*(10초. 무게가 온전히 돌아온다.)*\n\n무게가, 돌아왔지요.\n혼자 드는 무게가\n어떤 것이었는지,\n이제 또렷해졌습니다.\n\n다시, 받쳐 주세요.\n\n*(다시 받친다. 안도. 잠시 후 물병을 내리고 팔을 풀게 한 뒤, 역할을 바꾸어 1~3단계를 반복한다. 두 번째는 멘트를 줄이고 침묵을 늘린다.)*\n\n4단계 — 받쳐 주는 손은 힘들지 않았다 (2분)\n\n*(양쪽 모두 마친 뒤.)*\n\n이번에는 받쳐 준 분들께\n여쭙겠습니다.\n짝의 팔 아래에\n손을 받치고 있는 동안,\n힘드셨나요.\n\n*(고개를 젓는다.)*\n\n그렇습니다.\n받치는 손은,\n힘들지 않았습니다.\n\n우리가 연민을 두려워한 것은\n남의 짐을 통째로\n대신 들어야 하는 줄\n알았기 때문입니다.\n그러다 나까지 무너질까 봐\n곁을 피했습니다.\n\n그런데 오늘 배웠습니다.\n연민은 짐을 빼앗아 드는 것이 아니라,\n그 아래에 손을 대는 것.\n'내가 여기 있다'는 것을,\n무게로 전하는 것.\n그래서 연민은,\n나를 갈아 넣는 희생이 아니라\n오래 곁에 머물 수 있는\n지속 가능한 사랑입니다.\n\n닫기 — 나에게도, 이 손 (2분)\n\n마지막으로,\n눈을 감아 보세요.\n\n살아오는 동안,\n누군가 내 팔 아래에\n말없이 손을 받쳐 준\n순간들이 있었습니다.\n아무 해결도 해 주지 못하면서,\n그저 곁에 있어 준 사람들.\n그 얼굴들을\n잠시 떠올려 봅니다.\n그 손들 덕분에,\n우리는 무너지지 않고\n여기까지 왔습니다.\n\n그리고 이제,\n한 손으로\n반대쪽 팔을\n가만히 받쳐 안아 보세요.\n\n힘든 날의 나에게도,\n이 손이 필요합니다.\n누구의 손도 닿지 않는 밤에는,\n내가 나의 팔 아래에\n손을 받쳐 줄 수 있습니다.\n\n'무거웠지.\n내가 여기 있어.'\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n살다가, 해결해 줄 수 없는\n하소연을 듣게 되는 날이 옵니다.\n그때 조언을 찾느라\n애쓰지 마세요.\n이 두 마디면 충분합니다.\n\n\"많이 무거웠겠다.\n내가 옆에 있을게.\"\n\n받쳐 주는 손의, 말 버전입니다.\n\n그리고 말조차\n필요 없는 자리도 있습니다.\n병실에서, 장례식장에서,\n무슨 말을 해야 할지 몰라\n발길이 무거웠다면,\n이제 아실 겁니다.\n아무 말 없이 곁에 앉아 있는 것,\n그것이 이미\n팔 아래에 받친 손이라는 것을.\n위로의 말을 몰라도,\n우리는 위로할 수 있습니다.\n\n───\n\n진행 팁\n\n- 신체 접촉이 있는 활동이므로 시작 전에 반드시 안내한다. \"짝의 팔에 손이 닿는 활동입니다. 불편하신 분은 말씀해 주세요.\" 접촉이 어려운 짝은 팔 바로 아래 손바닥을 닿을 듯 말 듯 받치는 방식으로 대체한다. 시각적 받침만으로도 심리적 효과가 상당하다.\n- 어깨나 팔이 불편한 참가자는 팔 높이를 가슴 아래로 낮추거나 빈 병으로 대체한다. 버티는 시간도 짧게 조절한다. 핵심은 고통의 크기가 아니라 '혼자'와 '함께'의 대비다.\n- 1단계에서 팔이 떨리기 전에 받치게 하면 효과가 반감된다. 떨림이 눈에 보일 때까지 기다렸다가 2단계로 넘어간다. 단, 40초를 넘기지는 않는다.\n- 3단계의 '떼었다가 다시'를 생략하지 말 것. 무게가 돌아오는 그 10초가 함께의 소중함을 각인시키는 결정적 대비다.\n- 부부, 가족이 함께 참여한 회기라면 서로 짝을 지어 준다. 말없이 서로의 팔을 받치는 이 1분이, 어떤 대화보다 깊은 화해가 되는 경우가 많다.\n- 닫기의 '받쳐 준 손들을 떠올리기' 대목에서 눈물이 나는 참가자가 있다. 이미 세상을 떠난 이의 손을 떠올리는 경우다. 개입하지 않고, 팔을 감싸 안는 마지막 동작으로 자연스럽게 안아 준다.\n- 축원 걷기와 한 회기로 묶는다면 받쳐 주는 손을 먼저 한다. 구체적 한 사람에게 손을 대 본 뒤라야, 스치는 모든 이를 향한 축원이 관념이 아니라 체온을 갖는다.\n- 감정 나눔 질문: \"팔 아래에 손이 닿는 순간, 어떤 느낌이었나요?\" / \"받쳐 주는 쪽일 때는 어떤 마음이었나요?\" / \"지금까지 내 팔을 받쳐 준 손은, 누구의 손이었나요?\"\n\n───\n\n수정하실 대목이 있으면 말씀해 주세요. 다음으로 '자랑 잔치'나 '가위바위보 명상' 완전판으로 이어 갈 수도 있습니다.","duration":"","tags":"행동형,悲","series":"숨비명상"},{"id":"b1efe913","category":"자비희사","title":"자랑 잔치","body":"늘봄명상 · 자비희사 단계(喜) — 놀이형 기법 완전판 부제 : 기쁨은 나누면 배가 된다는 말을,\n실험으로 증명하는 시간 소요 시간 : 약 20분 (도구 없음,\n장난감 마이크가 있으면 재미가 커진다)\n\n───\n\n기법의 원리\n\n자비희사 네 마음 가운데 가장 어려운 것이 희(喜), 곧 남의 기쁨을 시기 없이 함께 기뻐하는 마음이다. 남의 고통에는 눈물지어도, 남의 경사 앞에서는 마음 한구석이 서늘해지는 것이 보통의 마음이기 때문이다. 이 기법은 그 어려운 마음을 의지로 짜내게 하지 않는다. 대신 규칙이 그 마음을 대신하게 한다. 한 사람이 자랑하면 전원이 온 힘을 다해 축하한다는 규칙이다. 처음에는 연기여도 좋다. 박수를 치고 환호하는 몸의 동작이 거꾸로 마음에 불을 붙인다는 것, 곧 몸이 먼저 하면 마음이 따라온다는 것이 이 기법의 심리학이다.\n\n여기에는 두 겹의 숨은 치유가 있다. 하나는 자랑의 복권이다. 우리는 \"벼는 익을수록 고개를 숙인다\"는 말을 들으며 자랐다. 겸손을 배우는 사이, 기쁨을 말하는 법을 잃었다. 잘난 척으로 보일까 봐, 남이 배 아파할까 봐, 좋은 일이 생겨도 아껴 두고 삼켰다. 이 방에서는 그 두 걱정이 규칙으로 제거된다. 자랑은 의무이고, 축하는 전력이며, 사소할수록 훌륭하다. 다른 하나는 축하의 첫 경험이다. 온전한 축하를 받아 본 기억이 드문 어른들이, 사소한 자랑에 방 전체가 진심으로 환호해 줄 때, 뜻밖의 눈물이 터진다.\n\n그리고 2라운드의 '대신 자랑'에서 희의 심화가 일어난다. 짝의 기쁨을 내 입으로, 내 일처럼 소개하는 것이다. 남의 기쁨을 말하는 동안 내 어깨가 펴지는 이상한 경험 — 그것이 무디타, 함께 기뻐하는 마음의 실체다.\n\n───\n\n진행 절차와 멘트\n\n열기 — 자랑을 잃어버린 어른들 (3분)\n\n*(둥글게 앉는다.)*\n\n여쭤보겠습니다.\n최근에, 누군가에게\n자랑을 해 보신 적 있으세요.\n\n*(대부분 웃으며 고개를 젓는다.)*\n\n어릴 때 우리는\n자랑쟁이였습니다.\n그림 하나 그려도 자랑,\n달리기 한 번 이겨도 자랑.\n그런데 어른이 되면서\n자랑을 잃어버렸습니다.\n\n\"벼는 익을수록\n고개를 숙인다\"고 배웠으니까요.\n겸손을 배우는 사이에,\n기쁨을 말하는 법을\n잊어버린 겁니다.\n\n자랑을 못 하는 이유는\n둘입니다.\n잘난 척으로 보일까 봐.\n그리고, 듣는 사람이\n배 아파할까 봐.\n\n오늘 이 방에서는,\n그 두 가지 걱정을\n규칙으로 없애 버리겠습니다.\n\n규칙 하나, 자랑은 의무입니다.\n규칙 둘, 축하는 전력입니다.\n규칙 셋, 사소할수록 훌륭합니다.\n\n시범 — 축하 연습 (2분)\n\n먼저 축하 연습부터\n해 보겠습니다.\n제가 자랑을 하나 하면,\n여러분은 세상이 떠나가라\n축하해 주시는 겁니다.\n박수, 환호, 감탄,\n전부 아낌없이.\n자, 갑니다.\n\n\"저는 어제,\n삼 주째 시들어 가던 화분에서\n새 잎이 돋은 걸 발견했습니다!\"\n\n*(전원 폭풍 축하. 어색하면 \"다시! 이번엔 진짜로!\"라며 재축하를 시킨다. 방이 웃음으로 뜨거워진다.)*\n\n좋습니다.\n바로 그 온도로 가겠습니다.\n\n1라운드 — 자랑 한 바퀴 (8분)\n\n*(마이크를 돌린다. 한 사람씩 자랑하고, 전원이 전력으로 축하한다.)*\n\n한 분씩,\n요즘 있었던 기쁜 일이나\n자랑을 하나 말해 주세요.\n\"김치를 삼 년 만에 담갔어요\"도,\n\"오늘 아침에 일찍 일어났어요\"도\n훌륭한 자랑입니다.\n\n*(진행 요령 — 축하가 형식적이면 \"다시, 진짜로!\"를 외쳐 재축하시킨다. 자랑을 머뭇거리는 참가자에게는 \"오늘 이 자리에 오신 것부터가 자랑입니다\"라고 길을 터 준다. 진행자는 자랑마다 한 번씩 크게 되받아 준다. \"여러분, 들으셨습니까. 삼 년 만에 김치를 담그셨답니다!\" 그 되받음이 축하의 불씨가 된다.)*\n\n2라운드 — 대신 자랑 (5분)\n\n이번에는 조금 특별한\n자랑을 하겠습니다.\n\n둘씩 짝을 지어 주세요.\n그리고 서로에게\n자랑 하나씩을\n이야기해 줍니다.\n\n*(2분간 짝끼리 자랑을 교환하게 한다.)*\n\n이제, 전체 앞에서\n자기 자랑이 아니라,\n짝의 자랑을\n대신 소개해 주시는 겁니다.\n내 일처럼, 아니\n내 일보다 더 신나게.\n\"여러분, 제 짝을\n자랑하겠습니다!\" 하고요.\n\n*(한 짝씩 서로를 대신 자랑하고, 전원이 축하한다. 남의 기쁨을 제 입으로 말하는 동안 목소리가 커지고 얼굴이 밝아지는 것을 볼 수 있다.)*\n\n닫기 — 옮겨붙는 불 (4분)\n\n*(웃음이 잦아들면, 목소리를 낮춘다.)*\n\n잠시, 지금 내 몸을\n느껴 보세요.\n손바닥이 얼얼하고,\n광대가 뻐근하고,\n가슴이 데워져 있습니다.\n\n우리는 방금\n남의 기쁨에 박수를 쳤을 뿐인데,\n내 몸이 이렇게\n뜨거워졌습니다.\n\n남의 기쁨은,\n나눠 가지면 줄어드는\n떡이 아니었습니다.\n옮겨붙는, 불이었습니다.\n\n그리고 짝을 대신 자랑하던\n그 순간을 떠올려 보세요.\n남의 자랑을 하는데,\n이상하게 내 어깨가\n펴지지 않았습니까.\n남의 기쁨을 내 입에 담는 순간,\n그 기쁨의 절반은\n이미 내 것이 됩니다.\n그것이 '함께 기뻐하는 마음'의\n실체입니다.\n\n그리고 오늘, 어쩌면\n난생처음으로\n온전한 축하를\n받아 보신 분이 있을 겁니다.\n사소한 자랑에\n이렇게 많은 사람이\n진심으로 환호해 준 것이\n처음인 분들이요.\n그 박수 소리를,\n가슴에 담아 가세요.\n여러분의 기쁨은,\n축하받아 마땅한 것입니다.\n\n슬픔은 나누면 반이 되고\n기쁨은 나누면 배가 된다는\n오래된 말이 있습니다.\n오늘 우리는 그 말을,\n이 방에서\n실험으로 증명했습니다.\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n오늘부터,\n'축하 삼 초 규칙'을\n가져가시길 바랍니다.\n누군가의 좋은 소식을 들으면,\n마음속 계산이 시작되기 전에,\n삼 초 안에 몸이 먼저\n하게 하는 겁니다.\n손뼉 한 번,\n\"우와, 잘됐다!\" 한마디.\n마음이 아직 준비되지 않았어도,\n몸이 먼저 축하하면\n마음이 따라옵니다.\n\n가족이 있다면,\n저녁 식탁에서\n'오늘의 자랑 하나'를\n돌려 보세요.\n아이의 사소한 자랑에\n온 가족이 박수 치는 저녁이\n쌓이면, 그 아이는\n기쁨을 말할 줄 아는\n어른으로 자랍니다.\n\n그리고 마지막으로,\n당신의 기쁨도\n아껴 두지 마세요.\n좋은 일이 생기면, 말하세요.\n당신의 자랑을 기다리는\n사람들이 있습니다.\n오늘 이 방이,\n그 증거입니다.\n\n───\n\n진행 팁\n\n- 진행자의 시범 자랑은 반드시 사소해야 한다. 화분, 늦잠, 라면 물 조절 성공 같은 것. 시범이 사소할수록 참가자들의 자랑 문턱이 낮아진다.\n- 자랑이 비교나 배틀로 흐르지 않게 한다. 순서대로 한 명씩, 평가와 순위 없이. \"누구 자랑이 더 큰가\"가 아니라 \"모든 자랑에 같은 크기의 축하\"가 원칙이다.\n- 힘든 근황뿐이라 자랑할 것이 없다는 참가자가 반드시 있다. \"그 힘든 시간을 견디고 오늘 여기 오신 것, 그것이 오늘의 가장 큰 자랑입니다\"라고 받고, 전원 축하로 잇는다. 이 순간이 회기 전체에서 가장 깊은 축하가 되곤 한다.\n- 축하 도중 눈물을 보이는 참가자가 있다. 축하를 멈추지 말고 박수를 더 따뜻하게 이어 가게 한다. 눈물 위에 얹히는 박수가 이 기법의 가장 아름다운 장면이다.\n- 인원이 15명을 넘으면 1라운드를 모둠(6~8명)으로 나눠 진행하고, 2라운드의 대신 자랑만 전체로 모아 한다.\n- 감사 명상·기쁨 나눔 주간과 자연스럽게 이어진다. \"오늘 받은 박수를, 이번 주에 만나는 누군가에게 돌려주고 오세요\"를 과제로 내면 다음 회기의 감정 나눔이 풍성해진다.\n- 감정 나눔 질문: \"축하를 받는 순간, 어떤 마음이 들었나요?\" / \"짝을 대신 자랑할 때, 내 안에서 무엇이 일어났나요?\" / \"누구에게 이 박수를 돌려주고 싶은가요?\"","duration":"","tags":"놀이형,喜","series":"숨비명상"},{"id":"e2f8c27f","category":"자비희사","title":"가위바위보 명상","body":"늘봄명상 · 자비희사 단계(捨) — 놀이형 기법 완전판 부제 : 결과와 나 사이에,\n호흡 하나를 끼워 넣는 연습 소요 시간 : 약 18분 (도구 없음,\n둘씩 짝지을 수 있으면 어디서든 가능)\n\n───\n\n기법의 원리\n\n평정심(捨)은 무덤덤함이 아니다. 이김과 짐, 얻음과 잃음, 칭찬과 비난 앞에서 출렁이되, 뒤집히지 않는 마음이다. 문제는 이 마음을 연습할 안전한 승부의 장이 일상에 없다는 것이다. 실제 삶의 승부는 판돈이 너무 크고, 상처가 너무 깊어서, 연습장이 되지 못한다. 이 기법은 세상에서 가장 작고, 가장 빠르고, 가장 무해한 승부 — 가위바위보를 그 도량으로 삼는다.\n\n구조는 세 라운드다. 1라운드에서는 이기면 환호하고 지면 탄식하는 과장 연기로 승부에 출렁이는 마음을 증폭해 보여 준다. 웃음 속에서 참가자는 알아차린다. 과장이었지만, 낯설지 않았다는 것을. 우리는 매일 이렇게 산다는 것을. 2라운드에서는 침묵 속에 승패를 이어 가며, 이기고 질 때마다 마음속에서 솟고 꺼지는 것을 그저 관찰한다. 여기서 중요한 발견이 온다. 반응은 자동으로 올라오며, 없앨 수 없다는 것. 평정은 출렁임이 없는 상태가 아니라, 출렁임을 아는 데서 시작한다는 것이다. 그리고 3라운드에서 핵심 기술이 놓인다. 결과를 확인한 뒤, 숨을 한 번 고르고, 같은 호흡으로 다음 판을 내는 것. 결과와 반응 사이에 호흡 하나를 끼워 넣는 이 작은 기술이, 첫 주에 배운 멈춤의 완성이자 평정의 실체다.\n\n마지막으로 이 기법은 자비희사 전체의 닫음이 된다. 평정은 차가움이 아니라, 자애와 연민과 기쁨을 오래 지켜 주는 그릇이기 때문이다. 흔들리지 않는 접시가 있어야, 따뜻한 국을 엎지르지 않고 나를 수 있다.\n\n───\n\n진행 절차와 멘트\n\n열기 — 인생 최다 승부 (2분)\n\n*(둘씩 짝을 짓게 한다.)*\n\n여쭤보겠습니다.\n여러분이 인생에서\n가장 많이 해 본 승부는\n무엇일까요.\n\n가위바위보입니다.\n\n청소 당번을 정할 때도,\n마지막 만두 하나를 두고도,\n우리는 주먹을 쥐고\n\"가위, 바위, 보\"를 외쳤습니다.\n우리는 이 놀이로\n승부를 배웠습니다.\n\n오늘은 이 놀이로,\n승부에 흔들리지 않는 법을\n배워 보겠습니다.\n\n1라운드 — 천국과 지옥 (4분)\n\n먼저, 짝과 가위바위보를\n쉬지 않고 열 판 하겠습니다.\n단, 조건이 있습니다.\n이기면, 세상을 다 가진 듯\n만세를 부르며 환호하세요.\n지면, 하늘이 무너진 듯\n탄식하세요.\n연기여도 좋습니다.\n크면 클수록 좋습니다.\n\n*(진행자가 짝 한 명과 시범을 보인다. 이기고 과하게 만세, 지고 과하게 무너지는 시범에 웃음이 터진다. 10판을 진행하게 한다. 방이 환호와 탄식으로 시끌벅적해진다.)*\n\n자, 멈추세요.\n방금 몇 분 동안,\n10초에 한 번씩\n천국과 지옥을 오가셨습니다.\n\n과장이었지요.\n그런데, 아주 낯설지는\n않으셨을 겁니다.\n\n우리는 매일 이렇게 삽니다.\n칭찬 한마디에 만세를 부르고,\n지적 한마디에 무너지고,\n일이 풀리면 날아갈 듯하다가,\n일이 막히면 잠을 설칩니다.\n하루에도 몇 번씩,\n마음속에서 만세와 탄식이\n오갑니다.\n\n그런데 잠깐,\n전적이 어떻게 되시나요.\n\n*(몇 짝에게 물어본다. 대부분 5승 5패 언저리다.)*\n\n신기하지요.\n열 판쯤 하면,\n결국 비슷해집니다.\n기억해 두세요.\n이따가 다시 이야기하겠습니다.\n\n2라운드 — 출렁임 바라보기 (4분)\n\n다시 열 판 하겠습니다.\n이번에는 정반대입니다.\n환호도, 탄식도 없이,\n완전한 침묵 속에서.\n\n대신 할 일이 하나 있습니다.\n이겼을 때, 마음속에서\n무엇이 솟는지.\n졌을 때, 마음속에서\n무엇이 꺼지는지.\n그것만 가만히\n지켜보는 겁니다.\n속으로 중계해도 좋습니다.\n'이겼다는 소식에,\n기쁨이 한 줄기 솟는 중.'\n'졌다는 소식에,\n아쉬움이 살짝 스치는 중.'\n\n*(침묵 속에 10판. 방이 조용한 가운데 표정만 오간다.)*\n\n어떠셨나요.\n소리를 내지 않았는데도,\n마음속에서는\n무언가가 계속\n솟고, 꺼졌을 겁니다.\n\n여기서 중요한 것을\n하나 발견합니다.\n그 반응은,\n자동으로 올라옵니다.\n없앨 수 없습니다.\n평정심이란 출렁임이\n없는 상태가 아닙니다.\n출렁임을 아는 것,\n거기서 평정이 시작됩니다.\n\n3라운드 — 호흡 하나 (4분)\n\n마지막 열 판입니다.\n이번에는 한 가지 기술을\n쓰겠습니다.\n\n가위바위보를 내고,\n결과를 확인하면,\n바로 다음 판으로 가지 말고,\n숨을 한 번, 고릅니다.\n이겼어도, 숨 한 번.\n졌어도, 숨 한 번.\n그리고 같은 표정,\n같은 호흡으로\n다음 판을 냅니다.\n\n산이 맑은 날과 흐린 날을\n같은 자리에서 맞이하듯이.\n\n*(10판. 속도가 자연히 느려지고, 판과 판 사이에 고요한 리듬이 생긴다. 가위바위보가 명상이 되는 순간이다.)*\n\n느끼셨나요.\n같은 놀이인데,\n방이 고요해졌습니다.\n승부는 그대로 있는데,\n출렁임의 폭이 달라졌습니다.\n\n닫기 — 흔들리지 않는 접시 (4분)\n\n삶은, 멈추지 않는\n가위바위보입니다.\n되는 날과 안 되는 날,\n칭찬과 비난,\n얻음과 잃음이\n쉬지 않고 뒤바뀝니다.\n그 승부를 멈출 방법은,\n없습니다.\n\n그러나 오늘 3라운드에서\n경험하셨듯,\n할 수 있는 일이\n하나 있습니다.\n결과와 나 사이에,\n호흡 하나를\n끼워 넣는 것입니다.\n그 호흡 하나의 폭만큼,\n우리는 자유로워집니다.\n\n그리고 아까의 전적을\n기억하시나요.\n대부분 5승 5패\n언저리였습니다.\n길게 보면, 삶도 그렇습니다.\n이긴 날과 진 날은\n결국 엇비슷해지고,\n끝에 남는 것은\n승률이 아니라,\n그 판들을 어떤 마음으로\n냈는가입니다.\n\n마지막으로,\n이 평정이 왜 자비희사의\n마지막 글자인지를\n말씀드리고 싶습니다.\n\n평정은, 차가움이 아닙니다.\n자애도, 연민도, 기쁨도,\n이 평정 위에 놓일 때\n오래갑니다.\n흔들리는 접시로는\n따뜻한 국을 나를 수 없습니다.\n흔들리지 않는 접시가 있어야,\n그 온기가 엎질러지지 않고\n상대에게까지 가 닿습니다.\n\n그 접시의 이름이,\n우리가 함께 만났던,\n산의 마음입니다.\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n내일부터, 좋은 소식이든\n나쁜 소식이든\n받아 드는 순간이 오면,\n반응하기 전에\n숨을 한 번만 고르세요.\n기쁜 소식에도, 숨 한 번.\n서운한 말에도, 숨 한 번.\n결과와 나 사이에\n호흡 하나를 끼워 넣는 것,\n그것이 일상의 3라운드입니다.\n\n그리고 집에서\n아이와, 배우자와\n가위바위보 세 판을 해 보세요.\n한 판은 마음껏 환호하고,\n한 판은 조용히 바라보고,\n한 판은 숨 고르며.\n거실이, 평정심의\n도량이 됩니다.\n\n───\n\n진행 팁\n\n- 1라운드의 과장 연기는 진행자의 시범이 결정한다. 진행자가 민망할 만큼 크게 만세 부르고 크게 무너져야, 참가자들이 마음 놓고 과장한다. 이 웃음의 진폭이 3라운드 고요의 진폭이 된다.\n- 승부욕이 강해 3라운드에서도 표정 관리가 안 되는 참가자가 있다. 지적하지 말고 웃으며 받는다. \"출렁임이 크게 보이는 분일수록, 오늘 가장 많이 배워 가시는 분입니다.\" 웃음이 터져도 실패가 아니다. 웃고, 다시 호흡으로 돌아오면 그것이 연습이다.\n- 손 사용이 어려운 참가자는 홀짝(주먹 속 손가락 개수 맞히기)이나 눈짓 가위바위보(눈 감기=바위, 크게 뜨기=보, 윙크=가위)로 대체할 수 있다.\n- 2라운드의 '속으로 중계하기'는 관찰 단계의 마음 일기예보와 이어진다. \"지난번 일기예보관의 목소리로 중계해 보세요\"라고 연결해 주면 배움이 포개진다.\n- 이 기법은 자비희사 종합 회기의 닫는 기법으로 배치하는 것이 가장 좋다. 자랑 잔치(희)로 달아오른 마음, 받쳐 주는 손(비)과 축원 걷기(자)로 데워진 마음을, 흔들리지 않는 접시(사) 위에 올려 마무리하는 흐름이다. 닫기 멘트의 '접시' 비유가 그 통합을 완성한다.\n- 산 명상을 이미 경험한 집단이라면 닫기의 \"산의 마음\"이 깊이 울린다. 아직이라면 \"그 산은 다음에 함께 만나러 갑니다\"로 예고한다.\n- 감정 나눔 질문: \"1라운드와 3라운드, 같은 놀이가 어떻게 달랐나요?\" / \"결과를 보고 숨을 고르는 그 한 박자에서, 무엇을 느꼈나요?\" / \"요즘 내 삶에서, 호흡 하나를 끼워 넣고 싶은 승부는 무엇인가요?\"","duration":"","tags":"놀이형,捨","series":"숨비명상"},{"id":"1a7d430a","category":"탈중심화","title":"강 건너기 명상","body":"늘봄명상 · 거리두기 단계 — 행동형 기법 (강 건너 불구경의 행동판) 부제 : 도망친 것이 아니라,\n제대로 보기 위해 물러선 것이다 소요 시간 : 약 20분 준비물 : 강을 표시할 파란 천 또는 긴 끈,\n징검돌로 쓸 방석(또는 A4 발판) 3개,\n종이와 펜,\n종이를 붙일 벽면(불의 기슭)과 테이프,\n건너편에 앉을 방석들(관찰의 기슭)\n\n───\n\n기법의 원리\n\n강 건너 불구경 명상은 누워서 자신을 삼인칭으로 읊조리며 관찰자의 자리를 익히는 심상 기법이다. 이 행동판은 같은 원리를 공간과 걸음으로 옮긴다. 관점의 이동을 상상하는 대신, 몸을 실제로 이동시키는 것이다. 심리학이 확인해 온 사실이 하나 있다. 몸이 물리적으로 물러나면, 마음의 거리도 함께 벌어진다는 것. 이 기법은 그 사실을 방 하나의 지형으로 만든다.\n\n방에는 두 개의 기슭이 생긴다. 한쪽 벽은 불의 기슭 — 나를 태우는 문제가 적힌 종이가 붙는 자리다. 반대편은 관찰의 기슭 — 방석이 놓인, 안전하게 바라보는 자리다. 그 사이에 파란 천의 강이 흐르고, 강 위에는 징검돌 세 개가 놓인다. 이 징검돌에는 멈춤 걷기에서 익힌 착지 3단계의 이름이 붙는다. 발바닥, 숨, 눈. 불에서 관찰자의 자리로 건너오는 다리가, 언제나 이 세 걸음이라는 것을 몸에 새기기 위해서다.\n\n참가자는 먼저 불의 기슭에 바짝 서서 자기 문제를 마주하고(1인칭의 뜨거움), 돌아서서 징검돌을 하나씩 밟아 강을 건넌 뒤(관점 이동의 의식), 건너편에 앉아 강 너머의 제 종이를 별칭 삼인칭으로 중계한다(관찰자의 자리). 여기서 셋째 주의 그 증언 — 불 속에 있을 때는 그저 뜨겁고 숨 막힐 뿐이었는데, 강 이쪽에서 보니 비로소 불이 어디서 시작됐고 어디로 번지는지 보이더라는 발견 — 을 모든 참가자가 자기 걸음으로 재현하게 된다.\n\n그리고 마지막에 주도권이 돌아온다. 강은 언제든 다시 건널 수 있다. 다만 이번에는 불에 타는 사람이 아니라, 불을 살피는 소방수의 눈으로. 거리두기가 도망이 아니라 제대로 보기 위한 물러섬임이, 왕복 가능한 강 하나로 완성된다.\n\n───\n\n진행 절차와 멘트\n\n준비 — 방에 강을 놓는다\n\n진행 전에 공간을 만든다. 한쪽 벽이 불의 기슭, 반대편 방석들이 관찰의 기슭. 그 사이 바닥에 파란 천(또는 끈 두 줄)으로 폭 1미터쯤의 강을 표시하고, 강 위에 징검돌 방석 세 개를 놓는다. 참가자 인원이 많으면 강을 길게 만들어 여러 명이 나란히 건널 수 있게 한다.\n\n열기 — 오늘, 이 방에 강이 흐릅니다 (2분)\n\n오늘 이 방에는,\n강이 하나 흐릅니다.\n\n저쪽 벽은, 불의 기슭입니다.\n우리를 태우는 문제들이\n타오르는 자리입니다.\n이쪽은, 관찰의 기슭입니다.\n안전하게 바라보는 자리입니다.\n\n우리는 지금까지\n불 속에서 불과 싸웠습니다.\n오늘은 다른 것을 해 봅니다.\n불을 끄러 뛰어드는 대신,\n강을 건너와서,\n바라보는 것입니다.\n\n1단계 — 불 적기 (3분)\n\n먼저, 종이에\n요즘 나를 태우고 있는 것\n하나를 적어 주세요.\n머릿속을 떠나지 않는 걱정,\n자꾸만 되감기는 그 일,\n생각만 하면 속이 타는 그 사람.\n\n한 줄이면 됩니다.\n아무에게도 보여 주지 않습니다.\n접어서 붙여도 됩니다.\n\n다 적으셨으면,\n저쪽 불의 기슭 벽에\n붙여 주세요.\n\n2단계 — 불 속에 서 보기 (2분)\n\n이제, 자기 종이 앞에\n한 발짝 거리로\n바짝 서 보세요.\n\n그 문제를 가만히\n바라봅니다.\n평소처럼, 그 생각 속으로\n들어가 봅니다.\n가슴이 답답해지고,\n어깨가 굳고,\n숨이 얕아지는 것을\n느껴 보세요.\n\n이것이, 불 속의 자리입니다.\n여기서는 뜨겁기만 하고,\n아무것도 보이지 않습니다.\n우리가 매일 밤\n서 있던 자리입니다.\n\n3단계 — 강 건너기 (4분)\n\n이제, 천천히\n뒤로 돌아서세요.\n\n눈앞에 강이 있습니다.\n그리고 강 위에,\n징검돌이 세 개 놓여 있습니다.\n이 돌들에는 이름이 있습니다.\n\n첫 번째 돌, '발바닥'.\n밟으면서, 두 발이 땅에 닿는\n감각을 느낍니다.\n\n두 번째 돌, '숨'.\n밟으면서, 숨을 한 번\n깊게 쉽니다.\n\n세 번째 돌, '눈'.\n밟으면서, 고개를 들어\n앞을 바라봅니다.\n\n자, 한 걸음씩,\n서두르지 말고,\n건너오세요.\n\n*(참가자들이 하나씩 징검돌을 밟아 건너온다. 진행자는 낮은 목소리로 \"발바닥… 숨… 눈…\"을 함께 짚어 준다. 건너온 사람부터 관찰의 기슭 방석에 앉게 한다.)*\n\n4단계 — 강 건너 불구경 (5분)\n\n*(전원이 건너와 앉으면.)*\n\n이제, 강 건너를\n바라보세요.\n저기, 내가 적은 종이가\n붙어 있습니다.\n\n이제 별칭의 힘을 빌려,\n마음속으로\n중계해 보겠습니다.\n나를 별칭으로 부르며,\n이렇게요.\n\n'강 건너에서,\n나비의 걱정이 타고 있다.'\n\n'○○는 지금, 강 이쪽에 앉아,\n그 불을 바라보고 있다.'\n\n*(잠시 침묵을 두고, 각자 중계하게 한다.)*\n\n느껴 보세요.\n같은 문제인데,\n여기서는 뜨겁지 않습니다.\n숨이 쉬어집니다.\n\n그리고 한 가지가\n더 일어납니다.\n불 속에 있을 때는\n그저 뜨겁고\n숨 막힐 뿐이었는데,\n이만큼 떨어져서 보니,\n조금씩 보이기 시작합니다.\n저 불이 어디서 시작됐는지.\n무엇이 저 불에\n기름을 붓고 있는지.\n어디까지 번졌고,\n어디는 아직 타지 않았는지.\n\n불과 싸울 때는\n보이지 않던 것들이,\n바라볼 때 보입니다.\n\n닫기 — 소방수의 눈 (4분)\n\n혹시 지금,\n불이 어디서 시작됐는지\n실마리가 보인 분은,\n원한다면 다시 강을 건너가,\n종이 아래에 한 줄을\n적고 오셔도 좋습니다.\n저 불에 대해\n새로 보이는 것, 한 가지.\n\n*(원하는 참가자만 징검돌을 다시 밟고 건너가 한 줄을 적고 돌아온다.)*\n\n방금, 중요한 일이\n일어났습니다.\n다시 불 앞에 갔는데,\n아까처럼 타지\n않으셨을 겁니다.\n\n강을 한 번 건너 본 사람은,\n불 앞에 다시 서도\n다른 사람입니다.\n불에 타는 사람이 아니라,\n불을 살피는,\n소방수의 눈을 가진 사람입니다.\n\n강 이쪽으로 물러선 것은,\n문제에서 도망친 것이\n아닙니다.\n문제를 제대로 보기 위해,\n한 걸음 물러선 것입니다.\n소방수는 불 속에서\n불을 끄지 않습니다.\n한 발 물러나\n불 전체를 본 뒤에,\n물을 어디에 뿌릴지 정합니다.\n\n종이는, 저 기슭에\n두고 갑니다.\n불을 오늘 다 끄지 않아도\n됩니다.\n필요할 때 언제든,\n세 걸음이면\n다시 건너갈 수 있습니다.\n발바닥, 숨, 눈.\n강을 건너는 다리는,\n언제나 세 걸음입니다.\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n집에도, 사무실에도,\n강을 놓을 수 있습니다.\n\n어떤 문제로 머리가\n타오르기 시작하면,\n그 자리에서\n일어나세요.\n그리고 세 걸음만\n물러나서, 돌아봅니다.\n첫걸음에 발바닥,\n두 걸음에 숨,\n세 걸음에 눈.\n\n방금까지 앉아 있던\n그 책상이,\n불의 기슭이 됩니다.\n그리고 세 걸음 떨어진 그 자리가,\n강 건너 관찰의 기슭입니다.\n물리적인 세 걸음이,\n심리적인 강이 됩니다.\n\n그 자리에서, 별칭으로\n한 줄만 중계하세요.\n'저기, ○○의 걱정이\n타고 있구나.'\n그러면 됩니다.\n\n───\n\n진행 팁\n\n- 종이는 끝까지 비공개다. 접어 붙여도 되고, 자기만 아는 단어 하나로 적어도 된다는 것을 처음부터 안내해야 무거운 문제도 안심하고 꺼낸다.\n- 2단계 '불 속에 서 보기'는 2분을 넘기지 않는다. 몰입이 목적이 아니라, 건너온 뒤의 대비를 위한 짧은 체험이다. 눈에 띄게 힘들어하는 참가자가 있으면 조용히 다가가 \"이제 건너오셔도 됩니다\"라고 먼저 건너게 한다.\n- 3단계 징검돌 건너기는 이 기법의 의식(儀式)이다. 뛰어 건너거나 장난스럽게 건너도 웃으며 두되, 마지막 한 명까지 건넌 뒤에 4단계를 시작한다. 먼저 건너온 사람들이 뒤 사람을 기다리며 바라보는 그 시간도 훈련이다.\n- 닫기의 '다시 건너가 한 줄 적기'는 반드시 선택으로 둔다. 실마리가 보이지 않는 참가자에게는 \"오늘은 강을 건너 본 것만으로 충분합니다. 실마리는 보일 때 보입니다\"라고 받는다. 통찰을 숙제로 만들지 않는다.\n- 무거운 사연(사별, 투병, 깊은 갈등)이 적힐 수 있다. 이 기법은 문제 해결이 아니라 거리 확보가 목적임을 진행자가 붙들고 있어야 한다. \"오늘 그 불을 끄지 않아도 됩니다\"가 이 회기의 안전망이다.\n- 누워서 하는 강 건너 불구경 명상과 한 쌍으로 배치하면 좋다. 행동판으로 강을 몸으로 건너 본 뒤에 누워서 하는 심상판을 이어 하면, 상상 속의 강이 훨씬 선명해진다. 순서는 행동판이 먼저다.\n- 공간이 좁으면 강을 의자 사이 통로로, 징검돌을 바닥의 종이 세 장으로 줄여도 원리는 동일하게 작동한다. 야외라면 실제 개울이나 화단 경계를 강으로 삼는 판이 가장 깊다.\n- 감정 나눔 질문: \"불 앞에 서 있을 때와 강 건너에서 볼 때, 몸에서 무엇이 달랐나요?\" / \"강 건너에서 바라보니, 새로 보인 것이 있었나요?\" / \"일상에서 나의 '세 걸음'은 어디에 놓고 싶은가요?\"","duration":"","tags":"행동형","series":"숨비명상"},{"id":"1f5154dc","category":"탈중심화","title":"십 년 후의 의자","body":"늘봄명상 · 거리두기 단계 — 시간으로 멀리 보기 부제 : 빈 의자 하나가,\n십 년의 망원경이 됩니다 소요 시간 : 약 15분 (1인당 의자 또는 방석 2개 — 지금의 자리와 십 년 후의 자리)\n\n───\n\n기법의 원리\n\n멀리서 본다는 것이 꼭 공간의 일은 아니다. 시간도 거리다. 심리학은 이를 시간적 거리두기라 부른다. 지금의 스트레스를 먼 미래의 관점에서 바라보게 하면 감정의 강도가 뚜렷이 가라앉고 지혜로운 판단이 돌아온다는 것이, 거듭 확인된 연구 결과다. 문제는 \"십 년 후의 눈으로 보라\"는 말이 머리로는 알아도 몸으로는 되지 않는다는 것이다. 이 기법은 그 관점 이동에 몸을 하나 얹는다. 옮겨 앉는 것이다.\n\n구조는 의자 두 개가 전부다. 지금 앉은 자리가 오늘의 자리, 옆의 빈 의자가 십 년 후의 자리다. 참가자는 오늘의 자리에서 지금의 걱정을 마주한 뒤, 일어나 십 년 후의 의자로 옮겨 앉는다. 그 한 걸음이 십 년이다. 그리고 그 자리에서, 방금까지 앉아 있던 빈 의자 — 오늘의 나 — 를 바라본다.\n\n이 기법의 문은 하나의 질문이 연다. \"십 년 전 오늘, 무슨 걱정을 하고 계셨나요?\" 아무도 기억하지 못한다. 그때는 분명 세상이 무너질 것 같았는데. 이 침묵의 발견이, 뒤에 이어질 모든 체험의 토대가 된다. 십 년 전의 걱정이 기억나지 않는다면, 오늘의 걱정도 십 년의 길이로 재어 볼 수 있다는 것.\n\n그리고 정점에서, 십 년 후의 내가 오늘의 나에게 한마디를 건넨다. 이 말이 특별한 이유가 있다. 위로 중에 가장 힘이 센 위로는, 그 시간을 이미 살아 낸 사람의 위로이기 때문이다. 십 년 후의 나는, 오늘의 이 걱정이 어떻게 되었는지 아는 유일한 사람이다.\n\n───\n\n진행 절차와 멘트\n\n준비\n\n참가자마다 의자(또는 방석) 두 개를 나란히 놓는다. 왼쪽이 오늘의 자리, 오른쪽이 십 년 후의 자리. 전원이 자기 자리 세트에서 동시에 진행한다.\n\n열기 — 십 년 전 오늘 (3분)\n\n*(전원 오늘의 자리에 앉은 상태로.)*\n\n질문 하나로 시작하겠습니다.\n\n십 년 전 오늘,\n여러분은 무슨 걱정을\n하고 계셨나요.\n\n*(침묵. 갸웃거리는 표정들.)*\n\n기억이, 나지 않으시지요.\n\n이상한 일입니다.\n십 년 전에도 우리는\n분명 무언가를 걱정하고\n있었을 텐데요.\n잠 못 이룬 밤도 있었고,\n세상이 무너질 것 같던\n날도 있었을 텐데요.\n\n그 걱정들은,\n다 어디로 갔을까요.\n\n어떤 것은 해결되었고,\n어떤 것은 흐지부지되었고,\n어떤 것은 걱정과 전혀 다르게\n흘러갔습니다.\n분명한 것은 하나입니다.\n그 걱정들 대부분이,\n지금은 기억조차\n나지 않는다는 것.\n\n이 사실을 가슴에 담고,\n오늘의 명상을 시작합니다.\n\n1단계 — 오늘의 자리 (2분)\n\n지금 앉아 계신 이 자리는,\n오늘의 자리입니다.\n\n눈을 감고,\n요즘 나를 무겁게 하는\n걱정 하나를 떠올려 보세요.\n밤에 자꾸 생각나는 그 일,\n가슴을 조이는 그 문제.\n\n그 걱정을 안은 채,\n잠시 그대로 앉아 있어 봅니다.\n어깨의 무게,\n가슴의 답답함을\n그대로 느껴 봅니다.\n이것이, 오늘의 나입니다.\n\n2단계 — 십 년을 건너 앉기 (3분)\n\n이제, 눈을 뜨고\n천천히 일어나세요.\n\n그리고 옆의 빈 의자로,\n한 걸음 옮겨 앉습니다.\n\n*(전원이 옮겨 앉으면.)*\n\n방금 그 한 걸음으로,\n십 년이 흘렀습니다.\n\n눈을 감아 보세요.\n나는 지금,\n십 년 후의 나입니다.\n나이를 열 살 더 먹었고,\n그 사이 많은 계절이\n지나갔습니다.\n기쁜 일도 있었고,\n힘든 일도 있었지만,\n나는 그 십 년을\n살아 냈습니다.\n십 년치의 시간이\n내 안에 쌓여 있습니다.\n\n그 몸으로, 그 마음으로,\n숨을 몇 번\n천천히 쉬어 봅니다.\n\n3단계 — 십 년 후의 눈으로 바라보기 (3분)\n\n이제 십 년 후의 나로서,\n눈을 뜨고,\n방금까지 앉아 있던\n저 빈 의자를 바라보세요.\n\n저기, 십 년 전의 내가\n앉아 있습니다.\n바로, 오늘의 나입니다.\n\n저 사람이 지금\n무슨 걱정을 안고 있는지,\n나는 압니다.\n저 걱정 때문에\n잠을 설치고 있다는 것도,\n혼자 얼마나 애쓰고 있는지도,\n나는 다 압니다.\n\n그리고 십 년 후의 나는,\n한 가지를 더 알고 있습니다.\n저 걱정이,\n그 후로 어떻게 되었는지를.\n\n십 년의 눈으로\n저 사람을 가만히 바라봅니다.\n저 걱정은, 십 년 뒤에도\n저렇게 클까요.\n아니면 십 년 전 오늘의 걱정처럼,\n언젠가 기억도 나지 않을\n하나의 계절이 될까요.\n\n4단계 — 한마디 (2분)\n\n이제, 십 년 후의 내가\n저 자리의 나에게\n한마디를 건넬 시간입니다.\n\n그 시간을 이미 살아 낸\n사람만이 할 수 있는 말을,\n마음속으로,\n천천히 건네 보세요.\n\n'그 일, 네 생각처럼\n되지는 않았어.\n그런데, 괜찮았어.'\n\n'그때 너, 참 애썼다.\n그거면 됐어.'\n\n'너무 오래\n혼자 끌어안고 있지 마.\n그건 그렇게까지\n네 잘못이 아니야.'\n\n어떤 말이든 좋습니다.\n십 년 후의 나만이\n해 줄 수 있는 그 말을,\n저 의자를 향해\n가만히 보내 주세요.\n\n*(충분한 침묵. 울컥하는 참가자가 나오는 자리다.)*\n\n5단계 — 그 말을 가지고 돌아오기 (2분)\n\n이제 그 한마디를\n가슴에 담고,\n천천히 일어나\n오늘의 자리로\n돌아와 앉으세요.\n\n*(전원이 돌아와 앉으면.)*\n\n눈을 감고,\n방금 받은 그 말을\n다시 한 번\n들어 봅니다.\n\n걱정은 아직\n그 자리에 있습니다.\n그러나 이제 그 걱정 곁에,\n십 년의 길이로 재어 본\n눈금 하나가\n함께 놓였습니다.\n\n그리고 기억하세요.\n옆의 저 빈 의자에는,\n십 년 후의 내가\n언제나 앉아 있습니다.\n오늘의 나를,\n가장 잘 아는 얼굴로,\n가만히 지켜보면서.\n\n닫기 (1분)\n\n오늘 우리는\n걱정을 지우지 않았습니다.\n걱정을,\n십 년의 자로\n재어 보았을 뿐입니다.\n\n어떤 걱정은\n그 자로 재는 순간\n제 크기로 줄어들고,\n어떤 걱정은\n그 자로 재어야 비로소\n지금 정성을 다해야 할 일로\n또렷해집니다.\n어느 쪽이든,\n십 년의 눈은\n오늘의 눈보다 지혜롭습니다.\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n집의 식탁에는\n빈 의자가 있습니다.\n사무실에도, 카페에도,\n빈 의자는 어디에나 있습니다.\n\n걱정이 가슴을 조이는 날,\n맞은편 빈 의자를\n잠시 바라보세요.\n저 자리에 십 년 후의 내가\n앉아 있다고 생각하고,\n속으로 물어보는 겁니다.\n'십 년 후의 나야,\n이 일, 어떻게 됐어?'\n\n옮겨 앉을 수 있다면\n더 좋습니다.\n자리를 바꿔 앉아,\n방금까지 내가 앉았던\n그 자리를 십 년의 눈으로\n바라봐 주세요.\n\n빈 의자 하나가,\n십 년의 망원경입니다.\n\n───\n\n진행 팁\n\n- 열기의 질문이 이 기법의 절반이다. \"십 년 전 오늘, 무슨 걱정을 하셨나요?\"를 던진 뒤의 침묵을 서두르지 말 것. 참가자들이 정말로 기억을 뒤지다가 실패하는 그 몇 초가, 이후 모든 체험의 토대가 된다.\n- 4단계의 예시 한마디들은 세 개를 넘기지 않는다. 예시가 많으면 참가자가 자기 말을 찾는 대신 고르게 된다. 예시 후의 침묵을 넉넉히 두어 각자의 문장이 올라오게 한다.\n- 고령의 참가자에게는 '십 년 후'가 무겁게 닿을 수 있다. 이 경우 \"지금까지의 인생을 다 살아 보신, 가장 지혜로워진 먼 훗날의 나\"로 바꾸거나, 거꾸로 \"십 년 전의 나를 바라보는 지금의 나\"로 방향을 뒤집어 같은 구조를 쓸 수 있다. 지금의 내가 십 년 전의 나에게 \"그 걱정, 그렇게 됐단다. 애썼다\"라고 건네는 판이다.\n- 걱정이 사별이나 투병처럼 시간이 해결하지 않는 종류일 수 있다. 닫기 멘트의 후반부(\"어떤 걱정은 그 자로 재어야 비로소 지금 정성을 다해야 할 일로 또렷해집니다\")가 그 경우를 안는 문장이다. \"십 년이 지나도 소중할 것은, 지금 소중히 하면 됩니다\"로 받아 준다.\n- 강 건너 불구경과의 관계: 별칭 삼인칭이 '나를 남처럼' 보는 거리라면, 이 기법은 '지금을 훗날처럼' 보는 거리다. 같은 주에 나란히 배치하면 공간과 시간, 두 개의 망원경을 모두 쥐여 주는 셈이 된다.\n- 의자가 부족하면 방석 두 장으로, 그것도 어려우면 한 자리에서 몸의 방향만 돌려 앉는 것으로 대체할 수 있다. 핵심은 소품이 아니라 '몸이 이동했다'는 감각이다.\n- 감정 나눔 질문: \"십 년 전의 걱정이 기억나지 않는다는 것을 알았을 때, 어떤 마음이 들었나요?\" / \"십 년 후의 내가 건넨 말은 무엇이었나요? 나눌 수 있는 만큼만요.\" / \"그 말을 듣고, 오늘의 걱정이 어떻게 보였나요?\"","duration":"","tags":"","series":"숨비명상"},{"id":"3ada98e5","category":"탈중심화","title":"새의 눈","body":"늘봄명상 · 거리두기 단계 — 내레이션 명상 (행동판: 고개 들어 하늘 보기)\n예상 낭독 시간 : 약 11분\n\n───\n\n편안한 자세로 앉아 보세요.\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 올려놓습니다.\n\n준비가 되었다면,\n천천히 눈을 감아 보세요.\n\n시작하기 전에,\n한 가지만 떠올려 봅니다.\n걱정에 빠져 있을 때,\n우리의 시선은\n어디를 향해 있었나요.\n\n아래였습니다.\n바닥을, 발끝을,\n손안의 화면을 보고 있었습니다.\n걱정은 이상하게도,\n고개를 아래로 당깁니다.\n그리고 시야가 좁아진 만큼,\n마음도 좁아집니다.\n\n오늘은 그 시선을,\n세상에서 가장 높은 곳까지\n들어 올려 보겠습니다.\n\n먼저, 숨이 드나드는 것을\n느껴 봅니다.\n숨을 내쉴 때마다,\n어깨가 조금씩\n아래로 내려갑니다.\n\n이제 마음의 눈으로,\n지금 이 방에 앉아 있는\n나의 모습을\n천장쯤의 높이에서\n내려다본다고 상상해 보세요.\n\n저기, 내가 앉아 있습니다.\n가만히 숨 쉬고 있는\n한 사람의 뒷모습.\n어깨의 기울기까지,\n새의 눈으로\n가만히 내려다봅니다.\n\n이제 조금 더\n높이 올라가 봅니다.\n지붕 위입니다.\n\n내가 있는 건물이 보이고,\n그 곁의 골목과\n가로수가 보입니다.\n바람이 지나가고,\n새 한 마리가\n곁을 스쳐 날아갑니다.\n\n더 올라갑니다.\n이제 동네 전체가\n한눈에 들어옵니다.\n길들이 실처럼 이어져 있고,\n그 위로 작은 사람들이\n오가고 있습니다.\n저 사람들 하나하나가,\n저마다의 하루를,\n저마다의 걱정을\n안고 걷고 있습니다.\n나처럼.\n\n구름의 높이까지\n올라왔습니다.\n도시 전체가\n손바닥만 하게 내려다보입니다.\n이 높이에서는,\n소리가 들리지 않습니다.\n경적도, 말다툼도,\n서두르는 발소리도.\n바람 소리뿐인\n깊은 고요가 있습니다.\n\n그 고요 속에서\n숨을 한 번,\n천천히 쉬어 봅니다.\n\n더 올라가 봅니다.\n이제 산맥이 주름처럼 보이고,\n강이 은빛 실처럼 흐르고,\n바다와 땅이 만나는\n해안선이 그림처럼 이어집니다.\n그리고 마침내,\n지구의 둥근 테두리가\n보이기 시작합니다.\n\n우주에서 지구를 내려다본\n비행사들은,\n하나같이 같은 말을\n했다고 합니다.\n그 높이에서는\n국경이 보이지 않았다고.\n지구는 얇은 대기에 싸인,\n푸르고 여린 구슬이었다고.\n그것을 본 순간,\n싸우고 있던 모든 일들이\n이상하리만큼 작아 보이고,\n가슴에는 뜻밖에도\n사랑이 차올랐다고.\n\n과학자들은 그것을\n조망 효과라고 부릅니다.\n멀리서 보면,\n마음이 커집니다.\n\n이제 그 높이에서,\n오늘 나를 무겁게 하던\n그 걱정을\n찾아보겠습니다.\n\n저 아래, 저 도시의,\n저 동네의, 저 지붕 아래.\n나의 걱정은\n어디쯤 있을까요.\n\n보이지 않습니다.\n이 높이에서는,\n보이지도 않을 만큼\n작습니다.\n\n그런데, 이상한 일이\n하나 일어납니다.\n\n걱정은 이렇게\n작아졌는데,\n저 지붕 아래의 그 사람은,\n작아지지 않습니다.\n\n오히려,\n애틋해집니다.\n\n저 작은 지붕 아래에서,\n한 사람이\n오늘 하루를\n애쓰며 살아 냈습니다.\n아무도 몰라주는 걱정을\n혼자 안고서도,\n아침에 일어났고,\n밥을 먹었고,\n제 몫의 하루를 걸었습니다.\n\n새의 눈으로 내려다본 나는,\n미워할 수가 없습니다.\n하늘의 눈은\n심판하는 눈이 아니라,\n품는 눈이기 때문입니다.\n\n그 사람에게,\n이 높이에서,\n마음속으로 가만히\n말해 봅니다.\n\n'네 걱정, 여기서 보니\n저렇게 작구나.\n그런데 너는,\n하나도 작지 않구나.'\n\n'오늘도, 애썼다.'\n\n이제 그 애틋한 마음을 안고,\n천천히 내려갑니다.\n\n지구의 테두리가 멀어지고,\n구름을 지나,\n도시가 가까워지고,\n우리 동네의 지붕이 보이고,\n이 방의 천장을 지나,\n가만히 앉아 숨 쉬고 있는\n내 몸속으로,\n부드럽게 돌아옵니다.\n\n돌아온 이 자리에서,\n숨을 한 번 깊게 쉬어 봅니다.\n방금 그 높이에서 가져온\n넓은 마음이,\n가슴 안에\n그대로 남아 있습니다.\n\n손가락 끝을 가볍게 움직여 보세요.\n발가락도 천천히 움직여 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 보세요.\n\n그리고 오늘부터,\n이 명상에는\n세상에서 가장 간단한\n행동판이 있습니다.\n\n걱정이 나를 삼키려 하고,\n고개가 자꾸\n아래로 떨어지는 순간이 오면,\n딱 한 동작만 하세요.\n\n고개를 들어,\n하늘을 보는 것입니다.\n\n십 초면 됩니다.\n하늘은 언제나 그 자리에,\n방금 우리가 다녀온\n그 높이 그대로,\n걸려 있습니다.\n고개를 드는 그 동작 하나가,\n새의 눈으로 올라가는\n가장 빠른 날갯짓입니다.\n\n걱정하는 사람의 고개는\n숙여져 있습니다.\n하늘을 올려다본 지\n얼마나 되셨나요.\n오늘, 집에 가는 길에\n한 번, 올려다보세요.\n\n───\n\n낭독 팁 : 올라가는 동안은 고도가 높아질수록 목소리를 조금씩 낮추고 느리게 하여 상승을 소리로 느끼게 하고, '애틋해집니다'부터의 정점은 가장 조용한 목소리로, 빈 줄마다 두어 호흡의 침묵과 함께 읽어 주세요.","duration":"","tags":"","series":"숨비명상"},{"id":"1af7f3e2","category":"용서감사","title":"감사 세 동작","body":"늘봄명상 · 감사 — 몸으로 하는 감사 (종교색 없는 보편 동작) 부제 : 가득 찬 것은,\n저절로 숙여집니다 소요 시간 : 약 12분 (도구 없음,\n서서 또는 앉아서 가능)\n\n───\n\n기법의 원리\n\n감사는 마음의 일이기 전에 몸의 일이다. 고마움이 차오르면 손이 가슴으로 가고, 고개가 숙여지고, 두 손이 공손해진다. 이 기법은 그 자연스러운 몸의 문법을 세 동작으로 정리한 것이다. 받기, 품기, 전하기. 특정 전통의 형식을 빌리지 않는다. 두 팔을 벌려 받고, 가슴에 모아 품고, 두 손으로 내밀어 전하는 동작은 어느 문화, 어느 종교의 사람에게도 저절로 읽히는 보편의 몸짓이기 때문이다.\n\n세 동작에는 각각 감사의 세 국면이 담긴다. 받기는 알아차림이다. 오늘 하루 나에게 온 것들 — 햇빛, 밥, 누군가의 말 한마디 — 을 두 팔 가득 받아들이는 자세는, 받은 것이 이렇게 많았다는 발견을 몸으로 만든다. 품기는 간직이다. 받은 것을 가슴에 모아 안는 동작에서, 감사가 정보가 아니라 온기가 된다. 전하기는 회향이다. 두 손을 앞으로 내미는 순간, 감사는 나에게 고이지 않고 세상으로 흐르기 시작한다. 한국인이라면 몸에 새겨져 있는 두 손의 공손함 — 어른께 무엇을 드릴 때 저절로 나오는 그 몸짓 — 이 여기서 깨어난다.\n\n그리고 이 기법의 설계에는 숨은 결말이 하나 있다. 세 동작을 정성껏 반복하다 보면, 마지막 즈음 고개가 저절로 숙여진다. 시켜서가 아니다. 벼 이삭이 익으면 휘듯, 가슴이 가득 차면 고개는 저절로 낮아진다. 절을 형식으로 가르치는 대신, 절이 저절로 태어나는 자리를 마련해 두는 것이다. 누가 시키지 않았는데 스스로 숙여진 고개 — 그것이야말로 어떤 전통의 절보다 깊은, 그 사람 자신의 절이다.\n\n───\n\n진행 절차와 멘트\n\n열기 — 감사의 몸짓들 (2분)\n\n*(서서 진행하는 것이 기본. 앉아서도 무방하다.)*\n\n우리는 고마울 때,\n몸이 먼저 움직입니다.\n\n뜻밖의 선물을 받으면\n두 손이 저절로 나가고,\n큰 도움을 받으면\n가슴에 손이 올라가고,\n\"감사합니다\" 하는 순간,\n고개는 이미\n살짝 숙여져 있습니다.\n\n감사는 마음의 일이기 전에,\n몸의 일입니다.\n오늘은 그 몸의 감사를,\n세 동작으로 배워 보겠습니다.\n받기, 품기, 전하기.\n\n첫째 동작 — 받기 (3분)\n\n두 발을 어깨너비로 벌리고\n편안히 서 주세요.\n\n숨을 들이쉬면서,\n두 팔을 옆으로, 위로,\n크게 벌려 봅니다.\n하늘에서 내리는 것을\n두 팔 가득 받는 자세입니다.\n\n그 자세로, 잠시 멈추고,\n오늘 하루 내가 받은 것들을\n떠올려 봅니다.\n\n아침의 햇빛을 받았습니다.\n따뜻한 밥을 받았습니다.\n숨 쉴 공기를 받았고,\n누군가의 인사를,\n말 한마디를 받았습니다.\n헤아려 보면,\n오늘 하루에도\n받은 것이 이렇게 많습니다.\n\n벌린 두 팔에\n그 모든 것이\n내려앉는다고 느껴 보세요.\n팔이 살짝\n묵직해질 만큼.\n\n둘째 동작 — 품기 (3분)\n\n이제 숨을 내쉬면서,\n벌렸던 두 팔을\n천천히 가슴으로 모아,\n두 손을 가슴 위에\n포개어 얹습니다.\n\n받은 것들을\n가슴에 품는 자세입니다.\n\n손바닥의 온기가\n가슴으로 스며듭니다.\n방금 받은 그 모든 것들이\n가슴 안에서\n따뜻하게 데워지는 것을\n느껴 봅니다.\n\n이 자세로,\n마음속으로 가만히\n말해 봅니다.\n'고맙습니다.'\n\n머리로 아는 감사가,\n가슴의 온기가 되는\n순간입니다.\n\n셋째 동작 — 전하기 (3분)\n\n이제 숨을 내쉬면서,\n가슴에 포갰던 두 손을\n앞으로 천천히\n내밀어 봅니다.\n\n손바닥을 위로 하고,\n무언가를 두 손으로\n공손히 건네는 자세입니다.\n어른께 무엇을 드릴 때\n저절로 나오던,\n우리 몸에 새겨진\n그 공손한 몸짓입니다.\n\n가슴에서 데워진 감사를,\n이제 두 손에 담아\n세상으로 건넵니다.\n\n오늘 고마웠던 그 사람에게.\n얼굴 모를 수고한 이들에게.\n그리고 오늘 하루를\n애쓰며 살아 낸,\n나 자신에게도.\n\n감사는 받아서 끝나는 것이\n아니라,\n이렇게 흘려보낼 때\n완성됩니다.\n\n이어서 — 세 동작을 하나로 (2분)\n\n이제 이 세 동작을,\n숨과 함께\n천천히 이어 보겠습니다.\n\n들이쉬며, 두 팔 벌려 받고.\n내쉬며, 가슴에 모아 품고.\n내쉬며, 두 손 내밀어 전하고.\n\n받기, 품기, 전하기.\n자신의 호흡 속도대로,\n세 번, 반복합니다.\n\n*(참가자들이 각자의 리듬으로 반복한다. 동작이 거듭될수록 느려지고 정성스러워진다. 마지막 반복 즈음, 전하기 동작에서 고개가 저절로 숙여지는 참가자들이 나타난다. 그 모습을 확인하며, 낮은 목소리로.)*\n\n지금, 느끼셨나요.\n전하는 두 손을 따라,\n고개가 저절로\n숙여지고 있습니다.\n\n시켜서가 아닙니다.\n벼 이삭이 익으면\n저절로 휘듯이,\n가슴이 가득 차면\n고개는 저절로 낮아집니다.\n\n가득 찬 것은,\n저절로 숙여집니다.\n\n누가 가르쳐 준 형식이 아니라,\n내 가슴이 스스로 만들어 낸\n이 인사 —\n이것이 세상에서 가장 깊은,\n나의 감사 인사입니다.\n\n닫기 (1분)\n\n마지막으로 한 번만 더,\n가장 천천히.\n\n받고,\n품고,\n전하고,\n그리고 고개가 숙여지는\n그 자리까지.\n\n그대로 잠시 머물렀다가,\n천천히 몸을 세우고,\n숨을 한 번 깊게 쉬며\n마칩니다.\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n이 세 동작은\n아침 인사로 삼기에\n가장 좋습니다.\n자리에서 일어나\n창가에 서서,\n받고, 품고, 전하고.\n삼십 초면\n하루가 감사로 열립니다.\n\n동작이 어려운 자리에서는\n손만으로도 됩니다.\n식당에서, 지하철에서,\n두 손을 가슴에\n잠깐 포개는 것만으로,\n품기 동작 하나만으로도,\n몸은 오늘을 기억해 냅니다.\n\n그리고 정말 고마운 사람을\n만나는 날에는,\n말과 함께\n두 손을 내밀어 보세요.\n받은 것을 두 손으로\n돌려주는 그 몸짓이,\n백 마디 말보다\n먼저 가 닿을 것입니다.\n\n───\n\n진행 팁\n\n- 이 기법은 특정 전통의 형식을 쓰지 않으므로 어떤 배경의 참가자에게도 부담이 없다. 다만 열기에서 \"종교와 무관한, 사람의 보편적 몸짓\"이라고 짚어 줄 필요조차 없다. 해명은 오히려 의식하게 만든다. 그냥 받기·품기·전하기로 시작하면 된다.\n- 핵심은 '이어서' 단계다. 세 동작을 따로 배울 때가 아니라 호흡과 함께 반복할 때, 동작이 저절로 느려지고 고개가 숙여지는 순간이 온다. 그 순간을 진행자가 포착해 \"지금, 느끼셨나요\"로 짚어 주는 타이밍이 이 기법의 정점이다. 고개가 숙여지지 않는 참가자가 있어도 지적하지 않는다. \"숙여지는 날이 올 것입니다\"면 족하다.\n- 기존의 감사 절하기를 아끼는 집단(사찰 프로그램 등)에서는 이 기법을 절하기의 준비 동작으로 배치할 수 있다. 세 동작으로 가슴을 채운 뒤 \"이 마음을 온몸으로 표현하고 싶은 분은, 설날 아침 부모님께 올리던 그 절로 이어 가셔도 좋습니다\"라고 선택지를 열면, 절은 형식이 아니라 넘친 마음의 자연스러운 다음 동작이 된다.\n- 일반 강좌·기업·학교 등 세속 환경에서는 이 기법 단독으로 완결된다. 용어도 '절'이라는 말 없이 처음부터 끝까지 진행된다.\n- 어깨가 불편한 참가자는 팔 벌리기를 가슴 높이의 작은 원으로 줄인다. 앉은 채로, 손목 동작만으로도 세 국면은 온전히 경험된다.\n- 감사 명상(눈감고 하는 내레이션)과 짝을 이룬다. 내레이션으로 감사의 내용을 채운 직후 이 세 동작으로 몸에 새기면, 마음의 감사와 몸의 감사가 하나로 닫힌다.\n- 감정 나눔 질문: \"세 동작 중 어느 동작에서 마음이 가장 움직였나요?\" / \"고개가 저절로 숙여지던 순간, 무엇을 느꼈나요?\" / \"두 손으로 감사를 전하고 싶은 사람이 떠올랐다면, 누구인가요?\"","duration":"","tags":"","series":"숨비명상"},{"id":"b388955c","category":"자비희사","title":"자애 물결","body":"늘봄명상 · 자비희사 단계(慈) — 몸으로 하는 자애 (네 동작) 부제 : 자애가 무엇이냐 물으면,\n지금 손바닥의 이 온기입니다 소요 시간 : 약 12분 (도구 없음,\n서서 또는 앉아서 가능)\n\n───\n\n기법의 원리\n\n자애 명상의 문턱은 문구의 어색함이다. \"내가 평안하기를\"이라는 말은 처음 외는 사람에게 남의 옷처럼 겉돈다. 이 기법은 그 문구에 몸을 입힌다. 그리고 몸 중에서도, 누구도 의심할 수 없는 것에서 출발한다. 제 손으로 비벼 만든, 손바닥의 온기다.\n\n자애는 방향을 가진 마음이다. 나에게서 시작해, 한 사람에게 건너가고, 모두에게로 퍼진다. 이 동심원의 구조를 네 동작으로 옮긴다. 모으기 — 두 손을 비벼 데운 온기를 가슴에 얹는다(나에게). 건네기 — 그 손을 앞으로 내민다(한 사람에게). 펼치기 — 두 팔을 수평으로 활짝 벌린다(모두에게). 그리고 돌아오기 — 펼친 팔로 큰 원을 그리며 다시 가슴으로 모은다.\n\n마지막 동작에 이 기법의 정점이 숨어 있다. 돌아온 손바닥이, 아직 따뜻하다는 것이다. 온기를 그렇게 내보냈는데 식지 않았다. 자애는 쓸수록 줄어드는 재화가 아니라 돌수록 데워지는 온기라는 것 — 자애가 화살이 아니라 향과 같아서 상대에게 닿기 전에 먼저 나를 통과한다는 원리가, 여기서 손의 온도로 증명된다.\n\n동작은 어느 전통의 형식도 빌리지 않는다. 언 손을 비비고, 가슴에 손을 얹고, 손을 내밀고, 팔을 벌리는 것은 모든 사람의 몸에 이미 있는 보편의 몸짓이다.\n\n───\n\n진행 절차와 멘트\n\n열기 — 온기 만들기 (2분)\n\n*(서서 진행이 기본. 앉아서도 무방하다.)*\n\n자애가 무엇인지,\n말로 설명하면 어렵습니다.\n오늘은 말 대신,\n손으로 만들어 보겠습니다.\n\n두 손바닥을 마주 대고,\n겨울에 언 손을 녹이듯,\n따뜻해질 때까지\n비벼 주세요.\n\n*(10~15초, 방 안에 손 비비는 소리가 가득해진다.)*\n\n이제 두 손을 떼고,\n손바닥의 온기를\n느껴 보세요.\n\n자애가 무엇이냐고 물으면,\n지금 손바닥의\n이 온기입니다.\n누군가가 평안하기를 바라는 마음은,\n관념이 아니라\n이런 온도를 가진 것입니다.\n오늘 우리는 이 온기를,\n여행 보내 보겠습니다.\n\n첫째 동작 — 모으기, 나에게 (3분)\n\n숨을 들이쉬며,\n따뜻해진 두 손을\n가슴 한가운데에\n가만히 얹습니다.\n\n온기가 손바닥에서\n가슴으로 스며듭니다.\n\n자애의 여행은\n언제나 여기서 시작합니다.\n나에게서.\n내 잔이 데워져야,\n남에게 따뜻한 것을\n따라 줄 수 있으니까요.\n\n그 온기 속에서,\n마음속으로 가만히 건넵니다.\n\n'내가, 평안하기를.'\n'내가, 행복하기를.'\n\n말이 어색해도 괜찮습니다.\n손바닥의 온기가\n말을 대신하고 있습니다.\n\n둘째 동작 — 건네기, 한 사람에게 (3분)\n\n이제 눈앞에,\n한 사람을 떠올려 보세요.\n사랑하는 얼굴,\n요즘 마음이 쓰이는 얼굴.\n\n숨을 내쉬며,\n가슴의 두 손을\n그 사람을 향해\n천천히 앞으로 내밉니다.\n손바닥은 위를 향하게.\n무언가 따뜻한 것을\n두 손으로 건네는 자세입니다.\n\n가슴에서 데워진 온기가\n팔을 타고, 손바닥을 지나,\n그 사람에게\n건너간다고 느껴 보세요.\n\n'당신이, 평안하기를.'\n'당신이, 행복하기를.'\n\n셋째 동작 — 펼치기, 모두에게 (2분)\n\n이제 숨을 들이쉬며,\n내밀었던 두 팔을\n좌우로, 수평선처럼,\n활짝 펼칩니다.\n\n호수에 돌 하나가 떨어지면\n파문이 사방으로 퍼지듯,\n가슴의 온기가\n파문이 되어\n사방으로 번져 갑니다.\n\n이 방의 모든 분들에게.\n이 건물, 이 거리,\n얼굴 모를 모든 이들에게.\n\n'모든 분들이, 평안하기를.'\n'모든 분들이, 행복하기를.'\n\n넷째 동작 — 돌아오기 (2분)\n\n이제 숨을 내쉬며,\n활짝 펼쳤던 두 팔로\n허공에 크고 둥근 원을 그리며,\n천천히,\n다시 가슴으로\n모아 옵니다.\n\n두 손이 가슴에 닿으면,\n확인해 보세요.\n\n손바닥이,\n아직 따뜻합니다.\n\n그 온기를 나에게 주고,\n한 사람에게 건네고,\n온 사방에 펼쳤는데,\n돌아온 손은\n식지 않았습니다.\n오히려 처음보다\n더 따뜻한지도 모릅니다.\n\n자애는,\n쓸수록 줄어드는 것이 아니라,\n돌수록 데워지는 것입니다.\n내보낸 자애는 사라지지 않고,\n반드시 나를 거쳐\n돌아옵니다.\n\n이어서 — 네 동작을 물결로 (2분)\n\n이제 네 동작을\n호흡과 함께\n하나의 물결로 이어 보겠습니다.\n\n들이쉬며 가슴에 모으고,\n내쉬며 앞으로 건네고,\n들이쉬며 활짝 펼치고,\n내쉬며 원을 그려 돌아오고.\n\n나에게, 당신에게,\n모두에게, 그리고 다시 나에게.\n\n자신의 호흡대로,\n세 번, 물결을 그려 봅니다.\n\n*(반복될수록 동작이 부드러워지고 커진다. 마지막 반복 후, 가슴에 손을 얹은 채로.)*\n\n지금, 거울이 있다면\n보여 드리고 싶습니다.\n이 동작을 하는 동안\n여러분의 입가가\n얼마나 부드러워졌는지.\n몸이 자애를 그리는 동안,\n얼굴이 먼저\n자애가 되어 있었습니다.\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n마음이 쓰이는 사람이\n생기는 날이 있습니다.\n아픈 가족, 힘들어하는 친구,\n전화를 끊고 나면\n마음이 무거워지는 그 사람.\n\n그럴 때, 해 줄 수 있는 것이\n없어 보이는 그 순간에,\n이 동작을 기억하세요.\n\n두 손을 비벼 온기를 만들고,\n가슴에 한 번 얹었다가,\n그 사람이 있는 쪽을 향해\n두 손을 내미는 것.\n\n병실 문 앞에서도,\n전화를 끊은 자리에서도,\n멀리 떠난 이를 향해서도\n할 수 있습니다.\n십 초의 이 몸짓이,\n말로 다 못 한 마음을\n대신 건너가 줍니다.\n\n그리고 나 자신이 힘든 밤에는,\n첫째 동작 하나면 됩니다.\n손을 비벼, 가슴에 얹기.\n'내가, 평안하기를.'\n자애의 여행은\n언제나, 나에게서 시작하니까요.\n\n───\n\n진행 팁\n\n- 손 비비기가 이 기법의 열쇠다. 대충 비비면 온기가 안 생긴다. \"겨울에 언 손 녹이듯\" 충분히 비비게 하고, 손을 뗀 뒤 온기를 확인하는 순간을 반드시 갖는다. 이 실감이 이후 모든 동작의 밑천이 된다.\n- 넷째 동작의 \"손바닥이 아직 따뜻합니다\"는 진행자가 서두르면 죽는 대목이다. 손이 가슴에 닿은 뒤 두어 호흡 기다렸다가, 참가자 스스로 온기를 확인할 시간을 준 뒤에 말을 얹는다.\n- 둘째 동작에서 떠올리는 '한 사람'은 사랑하거나 마음 쓰이는 사람으로 한정한다. 미운 사람을 향한 자애는 이 회기에서 다루지 않는다(용서 주간으로 넘긴다). 참가자가 스스로 미운 이를 떠올려 힘들어하면 \"오늘은 편한 얼굴부터면 충분합니다\"로 받는다.\n- 집단 마무리 판: 마지막 물결을 전원이 둥글게 서서 함께 하면, 셋째 동작에서 서로의 펼친 팔이 하나의 큰 원을 이루고, 서로가 보낸 자애가 방 안에서 교차한다. \"지금 이 방에는, 서른 개의 파문이 겹치고 있습니다\"라는 멘트로 닫을 수 있다.\n- 축원 걷기와 한 벌이다. 자애 물결이 제자리에서 몸으로 익히는 판이라면, 축원 걷기는 그 자애를 다리에 실어 세상으로 나가는 판이다. 순서는 물결(몸에 새기기) → 걷기(세상에 내보내기)를 권한다.\n- 어깨가 불편한 참가자는 팔 동작의 반경을 가슴 앞 작은 원으로 줄인다. 손 비비기와 가슴 얹기만으로도 핵심은 온전히 경험된다.\n- 감사 세 동작과의 구분: 감사가 받기에서 시작하는 수직의 흐름(하늘에서 받아 세상으로)이라면, 자애는 나에게서 시작하는 수평의 동심원이다. 두 기법을 같은 회기에 쓸 경우 감사 세 동작 → 자애 물결 순서가 자연스럽다. 받은 것을 헤아린 가슴이라야, 내보낼 온기가 넉넉하다.\n- 감정 나눔 질문: \"손바닥의 온기를 확인한 순간, 어떤 마음이 들었나요?\" / \"두 손을 내밀 때 떠오른 얼굴은 누구였나요? 나눌 수 있는 만큼만요.\" / \"돌아온 손이 아직 따뜻하다는 것은, 무슨 뜻일까요?\"\n\n 1단계~5단계 기본 스크립트 + ① 맥박 동조 조합\n\n전체 세션 — 총 8분 30초\n\n준비물: 음악(잔잔한 무비트 앰비언트), 타이머, 진행자 목소리. 그 외 없음.\n대형: 의자에 앉기. 등을 등받이에서 살짝 띄우고 발바닥은 바닥에.\n\n> 는 그대로 읽으시면 되는 대사, [ ] 는 진행자 메모입니다.\n\n───\n0단계 — 도입 (40초) · 음악 시작\n\n▎ \"오늘은 명상을 '느껴보는' 게 아니라 측정해보겠습니다.\n▎ 여러분 각자의 숫자가 하나씩 나올 겁니다. 그 숫자는 아무도 볼 수 없고, 저도 묻지 않겠습니다.\n▎ 오직 여러분 자신하고만 비교할 겁니다.\n▎\n▎ 자세를 잡아주세요. 발바닥 전체가 바닥에 닿게. 어깨는 한 번 올렸다가… 툭, 내려놓으세요.\n▎ 눈은 감으셔도 되고, 시선을 바닥 1미터 앞에 두셔도 됩니다.\"\n\n[음악은 여기서 시작해서 끝까지 끊지 않습니다. 볼륨은 목소리보다 확실히 낮게.]\n\n───\n1단계 — 1차 측정 (1분)\n\n▎ \"지금부터 1분입니다. 이 1분 동안 호흡을 바꾸려고 하지 마세요.\n▎ 이건 연습이 아니라 검사입니다. 잘하려는 순간 숫자가 거짓말을 합니다.\n▎\n▎ 방법은 이렇습니다. 숨을 들이쉬기 시작할 때마다 손가락을 하나씩 접으세요.\n▎ 열 개를 다 접으면 다시 펴고, 몇 번 접었다 폈는지만 기억하세요.\n▎\n▎ 시작합니다. 평소처럼.\"\n\n[정확히 60초. 이 동안 진행자는 말하지 않습니다. 침묵을 지키세요.]\n[참가자들이 이 침묵에서 불편해하는 게 정상입니다. 그게 첫 번째 데이터입니다.]\n\n▎ \"…네, 멈추세요. 숫자를 기억하세요.\"\n\n───\n2단계 — 공개와 사다리 (40초)\n\n▎ \"손가락으로 들어주세요. 열 개가 넘으면 두 손 다 펴시고요.\n▎ 옆을 보실 필요는 없습니다. 자기 손만 보세요.\"\n\n[3초 정도 두고 관찰. 진행자만 분포를 파악합니다.]\n\n▎ \"이 방에 손가락 다섯 개인 분도, 열 개가 넘는 분도 계십니다.\n▎ 어느 쪽도 잘하거나 못한 게 아닙니다. 출발점이 다를 뿐입니다.\n▎\n▎ 참고로, 성인이 편히 쉴 때 1분에 12번에서 20번 숨을 쉽니다.\n▎ 명상 상태로 들어가면 6번에서 8번까지 내려갑니다.\n▎\n▎ 이제 이 숫자를 바꿔보겠습니다. 그 전에, 왜 이게 되는지부터 보여드릴게요.\"\n\n───\n3단계 — 맥박 동조 (1분 30초) · 핵심 구간\n\n[여기가 이 세션의 심장입니다. 서두르지 마세요.]\n\n▎ \"오른손 검지와 중지를, 왼쪽 손목 안쪽 엄지 쪽 가장자리에 대세요.\n▎ 손목 한가운데가 아니라, 엄지 방향 끝입니다. 힘을 주지 말고 살짝 얹으세요.\n▎\n▎ 찾으셨나요? 못 찾으신 분은 손가락을 아주 조금씩 옮겨보세요. 톡, 톡, 하는 게 느껴질 겁니다.\"\n\n[여기서 20~30초 여유를 주세요. 못 찾는 분이 반드시 나옵니다.]\n[끝까지 못 찾으면: \"목 옆, 턱 아래쪽을 살짝 눌러보세요\"로 안내. 그래도 안 되면 다음으로 넘어가되 \"괜찮습니다, 다음 순서는 다 하실 수 있습니다\"라고 안심시키세요.]\n\n▎ \"찾으신 분들, 이제 손가락을 그대로 두고 제 말을 따라오세요.\n▎\n▎ 깊게, 천천히 들이쉬세요. …계속… 계속…\n▎ 맥박이 어떻습니까. 조금 빨라지지 않았나요?\n▎\n▎ 이제 길게 내쉬세요. 천천히… 끝까지… 더…\n▎ 느려집니다.\n▎\n▎ 한 번 더 갑니다. 들이쉬고… 빨라지고…\n▎ 내쉬고… 느려지고…\"\n\n[2~3회 반복. 여기서 참가자들 표정이 바뀝니다.]\n\n▎ \"지금 여러분이 느낀 건 착각이 아닙니다.\n▎ 호흡성 동성 부정맥이라고 부르는, 모든 사람에게 있는 생리 현상입니다.\n▎\n▎ 들이쉬면 심장이 빨라지고, 내쉬면 느려집니다.\n▎ 다시 말해 — 숨을 길게 내쉬는 것만으로 여러분은 자기 심박수를 직접 내릴 수 있습니다.\n▎\n▎ 약도, 앱도, 전문가도 필요 없습니다. 방금 하셨잖아요.\n▎ 오늘 나머지 시간은 이것 하나만 연습합니다. 날숨을 들숨보다 길게.\"\n\n───\n4단계 — 페이싱 (3분)\n\n▎ \"손 내려놓으세요. 눈 감으셔도 좋습니다.\n▎\n▎ 이제 숫자를 세지 마세요. 제 목소리만 따라오시면 됩니다.\n▎ 4초 들이쉬고, 6초 내쉽니다. 1분에 여섯 번입니다.\n▎\n▎ 코로 들이쉬고, 입이나 코 편한 쪽으로 내쉬세요.\n▎ 배가 먼저 나오고 가슴이 따라오면 잘 하고 계신 겁니다.\"\n\n이후 3분간 반복 (약 18사이클):\n\n▎ \"들이쉬고… 둘… 셋… 넷…\n▎  내쉬고… 둘… 셋… 넷… 다섯… 여섯…\"\n\n[진행 요령]\n- 첫 1분: 매 사이클 또박또박 카운트\n- 둘째 분: \"들이쉬고 …… 내쉬고 ……\" 로 축약, 숫자는 뺌\n- 셋째 분: 거의 침묵. 30초에 한 번 \"내쉬는 쪽을 길게\"만 툭 던지기\n- 중간에 한 번: > \"숨이 답답하면 언제든 평소 호흡으로 돌아가세요. 참는 게 아닙니다.\"\n\n[핵심: 진행자의 목소리 자체가 페이서입니다. 말끝을 절대 서두르지 마세요. 진행자가 급하면 참가자도 급해집니다.]\n\n───\n5단계 — 2차 측정 (1분)\n\n▎ \"그대로 계세요. 페이싱은 멈춥니다.\n▎ 이제 다시 1분입니다. 또 바꾸려 하지 마세요.\n▎ 몸이 알아서 쉬는 대로, 들숨 시작할 때마다 손가락을 접으세요.\n▎\n▎ 시작합니다.\"\n\n[정확히 60초. 완전한 침묵.]\n\n▎ \"네, 멈추세요.\"\n\n───\n6단계 — 클로징 (40초)\n\n▎ \"두 숫자를 비교해보세요. 처음 것과 지금 것.\n▎\n▎ 줄어든 분 — 여러분은 방금 8분 만에 자율신경계를 직접 조작했습니다. 그 숫자 차이가 증거입니다.\n▎\n▎ 그대로거나 늘어난 분 — 실패가 아닙니다. 몸이 아직 긴장 신호를 붙들고 있다는 정보를 얻으신 겁니다. 그건 오늘 이 방에서 알아낸 가장 쓸모 있는 사실일 수도 있습니다.\n▎\n▎ 오늘 가져가실 건 딱 하나입니다.\n▎ 날숨을 들숨보다 길게.\n▎\n▎ 지하철에서도, 회의 들어가기 직전에도, 잠 안 오는 새벽에도 됩니다.\n▎ 손목에 손가락 얹고 확인해보세요. 심장이 따라옵니다.\n▎\n▎ 수고하셨습니다.\"\n\n[음악 페이드아웃.]\n\n───\n진행 전 체크리스트\n\n┌───────────┬─────────────────────────────────────────────────────────┐\n│   항목    │                          확인                           │\n├───────────┼─────────────────────────────────────────────────────────┤\n│ 타이머    │ 무음 진동 또는 화면만. 알람음 절대 금지                 │\n├───────────┼─────────────────────────────────────────────────────────┤\n│ 음악      │ 비트·드럼 없는 것. 리듬이 있으면 호흡 페이싱과 충돌     │\n├───────────┼─────────────────────────────────────────────────────────┤\n│ 목소리    │ 평소보다 반 톤 낮게, 속도는 70%                         │\n├───────────┼─────────────────────────────────────────────────────────┤\n│ 사전 고지 │ \"어지러우면 언제든 평소 호흡으로. 참는 시간이 아닙니다\" │\n└───────────┴─────────────────────────────────────────────────────────┘\n\n자주 터지는 지점 3가지\n\n1. 맥박을 못 찾는 사람 — 전체의 20~30%는 나옵니다. 목동맥으로 우회시키고, 그래도 안 되면 빠르게 넘어가세요. 여기서 지체하면 세션 리듬이 무너집니다.\n2. 1차 측정에서 호흡을 조절해버리는 사람 — \"이건 검사지 연습이 아니다\"를 두 번 말하세요. 그래도 조절합니다. 대신 2차에서 안 줄어드는 이유가 되니, 클로징 멘트로 커버됩니다.\n3. 4초/6초가 힘든 사람 — 폐활량 차이입니다. > \"6초가 힘들면 3초 들이쉬고 5초 내쉬세요. 비율만 지키면 됩니다.\" 를 4단계 시작 시 미리 넣으면 중간 이탈이 줄어듭니다.","duration":"","tags":"慈","series":"숨비명상"},{"id":"e496c018","category":"용서감사","title":"나에게 돌아오는 시간 — 자기 감사 명상","body":"편안한 자리를 찾습니다.\n어디에도 힘줄 필요 없습니다.\n눈을 감으면,\n바깥세상이 스르르 문을 닫습니다.\n\n숨을 들이마십니다.\n그리고 내쉬는 숨에,\n오늘 하루 어깨에 얹혀 있던 것들을 바닥에 가만히 내려놓습니다.\n또 한 번 들이마시고,\n내쉬면서 이제 아무것도 하지 않아도 된다고 스스로에게 허락해 줍니다.\n\n애쓰지 않아도 됩니다.\n잘 하려 하지 않아도 됩니다.\n지금 이 순간만큼은,\n그냥 여기 있어 주기만 하면 됩니다.\n\n숨이 점점 느려집니다.\n가슴 한가운데,\n아주 작은 따뜻함이 있다고 상상해 봅니다.\n촛불 하나만 한,\n작고 은은한 온기입니다.\n숨을 들이쉴 때마다 그 온기가 조금씩 밝아집니다.\n내쉴 때마다 그 따뜻함이 가슴에서 어깨로,\n팔로, 손끝으로,\n따뜻한 물이 번지듯 천천히 퍼져 갑니다.\n\n이 온기는 어디서 온 것일까요.\n바깥에서 들어온 것이 아닙니다.\n누가 준 것도 아닙니다.\n이것은 원래부터 당신 안에 있던 온기입니다.\n그동안 너무 바빠서,\n미처 느끼지 못했을 뿐입니다.\n\n그 따뜻함이 이제 가슴을 지나 등을,\n배를, 다리를,\n발끝까지 감쌉니다.\n몸 전체가 하나의 따뜻한 담요에 폭 안긴 것처럼 포근하게 감싸입니다.\n\n지금 이 몸은,\n당신이 태어난 순간부터 단 하루도 쉬지 않고 당신을 살아 있게 해 온 유일한 집입니다.\n당신이 잠든 밤에도 심장은 당신을 위해 뛰었습니다.\n당신이 스스로를 미워하던 날에도,\n숨은 당신을 위해 들고 났습니다.\n당신은 한 번도 혼자였던 적이 없습니다.\n이 몸이 늘 당신 곁을 지켰습니다.\n\n이제 가슴 속으로 조용히 물어봅니다.\n나는 누군가 나를 알아봐 주기를 얼마나 오래 기다려 왔을까.\n괜찮다고, 잘 하고 있다고,\n그 한마디를 누군가 해 주기를 얼마나 바라 왔을까.\n\n우리는 늘 밖을 향해 서 있었습니다.\n사랑을, 인정을, 위로를,\n언제나 저 바깥의 누군가에게서 받으려 했습니다.\n그런데 정작 그 사랑을 가장 오래,\n가장 간절히 나에게 주지 않은 사람은 바로 나 자신이었습니다.\n\n여기,\n오래된 진실이 하나 있습니다.\n우리는 자비와 사랑을 언제나 밖으로 내보내는 것이라 배웠습니다.\n남을 어여삐 여기는 마음이 자비이고,\n남의 기쁨을 함께 기뻐하는 것이 사랑이라고.\n그러나 그 모든 마음에는 반드시 처음 흘러나오는 자리,\n곧 샘의 근원이 있습니다.\n그 근원이 바로 나 자신입니다.\n\n내 안이 메말라 있는데,\n어떻게 남을 적실 물이 흘러나오겠습니까.\n내가 나를 향해 단 한 번도 따뜻한 적 없으면서,\n어떻게 남에게 건네는 따뜻함이 진짜일 수 있겠습니까.\n억지로 짜낸 친절은 이내 바닥을 드러내고,\n나를 미워하며 베푼 희생은 결국 원망으로 돌아옵니다.\n내가 나를 사랑하는 딱 그만큼만,\n나는 비로소 세상도 사랑할 수 있습니다.\n\n그러니 자비의 첫 번째 대상은 저 멀리 있는 누군가가 아니라,\n지금 이 자리에 앉아 있는 나 자신입니다.\n가엾이 여기는 마음도 나에게 먼저,\n함께 기뻐하는 마음도 나에게 먼저,\n무엇도 바라지 않고 있는 그대로 놓아주는 마음도 나에게 먼저입니다.\n나를 향한 이 마음이 가득 차 넘칠 때,\n그제야 넘친 물이 저절로 흘러 남에게 가 닿습니다.\n애쓰지 않아도,\n억지로 하지 않아도,\n사랑은 넘쳐서 저절로 흐르는 것입니다.\n\n내가 그토록 기다리던 그 사람은 멀리 있지 않았습니다.\n지금 이 숨을 쉬고 있는 바로 나 자신이었습니다.\n평생 밖으로만 향하던 그 사랑을,\n이제 방향을 돌려 나에게로 흐르게 합니다.\n\n이제 마음의 목소리로 나에게 말을 건넵니다.\n소리 낼 필요 없습니다.\n마음이 알아듣습니다.\n\n그동안 참 애썼어.\n아무도 몰라줘도 너는 끝까지 나를 놓지 않았구나.\n미안해. 그리고 고마워.\n\n가슴이 뜨거워진다면 그대로 두십시오.\n그것은 오래 참아온 사랑이 드디어 제자리로 돌아오는 소리입니다.\n\n원한다면 한 손을 가슴에 얹어 봅니다.\n내 손의 온기가 내 가슴에 닿습니다.\n그리고 마지막으로 나에게 속삭입니다.\n나는,\n있는 그대로의 나를 사랑해.\n\n이 따뜻함을 그대로 가슴에 담아 둡니다.\n이제 이 사랑은 넘쳐서 당신 곁의 사람에게로 조용히 흘러갈 것입니다.\n\n천천히 숨을 깊게 들이마시고,\n손끝과 발끝을 조금씩 움직여 봅니다.\n어깨를 부드럽게 풀어 줍니다.\n서두르지 않아도 됩니다.\n준비가 되면 천천히 눈을 뜹니다.\n\n당신은 사랑받기 위해 무언가를 해내야 하는 사람이 아닙니다.\n그냥 존재하는 것만으로 이미 충분한 사람입니다.\n오늘,\n나에게 돌아와 주셔서 감사합니다.","duration":"","tags":"","series":"숨비명상"},{"id":"78e30702","category":"수용","title":"산처럼 앉아보기","body":"자리에 편안하게 앉습니다.\n두 다리를 겹쳐 땅에 뿌리내리듯 내려놓고,\n허리는 곧게,\n어깨의 힘은 스르르 풉니다.\n이제 천천히 눈을 감습니다.\n\n숨을 깊게 들이쉬고,\n길게 내쉬면서 몸의 무게를 아래로,\n땅속 깊은 곳으로 흘려보냅니다.\n\n다시 한 번 들이쉬고,\n길게 내쉬면서 오늘 하루 짊어졌던 것들을 가만히 내려놓습니다.\n\n지금 이 순간만큼은,\n우리 저 거룩한 산처럼 한번 묵직하게 앉아봅시다.\n\n당신의 엉덩이와 두 다리는 산의 든든한 밑동입니다.\n넓고 깊게 땅을 딛고,\n쉽게 흔들리지 않습니다.\n\n허리와 등은 하늘을 향해 솟은 산의 능선입니다.\n그리고 머리끝은 구름에 닿은 산의 정상입니다.\n\n바람이 불어도, 비가 내려도,\n산은 자리를 뜨지 않습니다.\n그저 묵묵히,\n있는 그대로 그 자리에 있습니다.\n\n당신도 지금 그렇습니다.\n서두를 곳도,\n가야 할 곳도 없습니다.\n그저 하나의 산으로,\n여기 이렇게 앉아 있습니다.\n\n이제 이 산을 가만히 들여다봅니다.\n당신 마음속 산에는 수많은 생각의 나무들이 우거져 자라고 있습니다.\n\n어떤 나무는 뾰족한 소나무입니다.\n누군가를 콕콕 찌르고 싶은,\n미워하고 원망하는 생각의 나무입니다.\n그 나무도 내 산에 자라고 있습니다.\n\n또 어떤 나무는 가지를 넓게 드리운 풍성한 나무입니다.\n누군가 지쳐 다가왔을 때 편히 쉴 그늘을 내어주는,\n따뜻하고 너그러운 마음의 나무입니다.\n\n또 어떤 나무는 울긋불긋 화려한 단풍나무입니다.\n나를 세상에 뽐내고 싶고,\n인정받고 싶은 마음의 나무입니다.\n\n밉다고 베어낼 것도 없고,\n곱다고 움켜쥘 것도 없습니다.\n그 나무들은 모두 그저 내 산에서 자라는 나무일 뿐입니다.\n\n산은 어느 나무도 미워하지 않습니다.\n뾰족한 소나무도,\n화려한 단풍도,\n모두 품고 있을 뿐입니다.\n\n그렇게 나의 모든 생각을,\n좋다 나쁘다 가르지 않고 가만히 품어 봅니다.\n\n이제 산의 더 깊은 곳으로 들어갑니다.\n그 깊은 계곡 한편에는 졸졸졸 맑게 흘러가는 물소리가 가만히 울려 퍼집니다.\n\n그 물소리가 얼마나 맑고 청량한지 귀를 기울여 봅니다.\n\n계곡의 또 다른 편에는 소리 없이 고여 있는 물도 있습니다.\n말 못 할 슬픔,\n차마 흘려보내지 못한 어두운 마음이 그곳에 고요히 잠겨 있습니다.\n\n그 슬픔을 밀어내지 않습니다.\n그것 또한 내 산의 일부이니까요.\n맑은 물도, 고인 물도,\n모두 이 산이 품고 있습니다.\n\n어디선가 새소리가 들려옵니다.\n밖에서 들리는 소리가 아닙니다.\n내 마음속 깊은 산에서 울려 퍼지는 아름다운 소리입니다.\n\n그 소리를 따라 마음이 점점 맑아집니다.\n\n나는 이토록 깊고 아름다운 산을,\n언제나 내 안에 지니고 있었습니다.\n다른 어떤 산을 찾아 헤맬 것도 없이,\n나 자신이 이미 하나의 산이었습니다.\n\n이 산은 무너지지 않습니다.\n누가 흔들어도,\n세상이 나를 밀쳐내도,\n나는 여기 이렇게 묵직하게 앉아 있을 수 있습니다.\n\n흔들리지 않는 이 고요함은 밖에서 얻어오는 것이 아닙니다.\n내가 나에게 자리를 내어주고 가만히 머물러 줄 때,\n저절로 솟아나는 것이었습니다.\n\n이제 그 든든함을 가슴에 담고,\n천천히 숨을 깊게 들이마십니다.\n손끝과 발끝을 조금씩 움직여 봅니다.\n어깨를 부드럽게 풀어 줍니다.\n\n내가 하나의 산이었음을 잊지 않습니다.\n세상이 나를 흔들어도 나는 다시 이 자리로 돌아와 묵묵히 앉을 수 있습니다.\n\n서두르지 않아도 됩니다.\n준비가 되면,\n천천히 눈을 뜹니다.\n\n오늘,\n내 안의 산을 만나 주셔서 감사합니다.","duration":"","tags":"","series":"표현명상"},{"id":"f3b76daa","category":"수용","title":"나무처럼 서보기","body":"두 발을 어깨너비로 벌리고 편안하게 섭니다.\n무릎의 힘은 살짝 풀고,\n어깨는 아래로 툭 내려놓습니다.\n눈을 지그시 감습니다.\n\n숨을 천천히 들이마시고,\n길게 내쉽니다.\n내쉬는 숨과 함께 몸의 긴장을 아래로 흘려보냅니다.\n\n지금부터 우리는 한 그루의 나무가 되어 봅니다.\n\n두 발을 땅에 단단히 딛습니다.\n이 두 발이 나무의 뿌리입니다.\n발바닥에서 뿌리가 뻗어 나와 땅속 깊이,\n더 깊이 내려간다고 상상해 봅니다.\n\n그 뿌리가 흙을 움켜쥐고,\n나를 든든하게 붙잡아 줍니다.\n이제 나는 쉽게 넘어지지 않습니다.\n\n두 다리와 허리는 곧게 솟은 나무의 줄기입니다.\n땅에서부터 하늘까지,\n하나의 곧은 기둥으로 이어집니다.\n\n어깨와 두 팔은 하늘을 향해 뻗은 가지입니다.\n그 가지 끝에서 잎사귀들이 햇빛을 받아 반짝이고 있습니다.\n\n이제 바람이 불어옵니다.\n가지가 흔들립니다.\n잎사귀가 살랑입니다.\n\n그러나 뿌리는 흔들리지 않습니다.\n가지는 흔들려도,\n나무는 넘어지지 않습니다.\n\n흔들리는 것을 두려워하지 않아도 됩니다.\n나무는 흔들리면서도 제자리를 지킵니다.\n흔들림은 넘어짐이 아닙니다.\n\n이제 가만히 서 있어 봅니다.\n아무것도 하지 않아도 됩니다.\n그저 나무처럼,\n말없이 이 자리에 서 있기만 하면 됩니다.\n\n처음에는 다리가 저리고,\n자꾸만 딴생각이 밀려올지도 모릅니다.\n그래도 그대로 서 있습니다.\n서 있는 것 말고는 아무것도 하지 않습니다.\n\n가만히 서 있는 시간이 깊어질수록 마음의 거친 물결이 잦아듭니다.\n짜증도, 조급함도,\n서서히 가라앉습니다.\n\n그리고 살아온 지난날들이 하나씩 고요히 떠올랐다 가라앉습니다.\n\n애써 무언가를 이루려던 마음,\n남보다 앞서려던 마음,\n잘 보이려던 마음을 가만히 내려놓습니다.\n\n그저 존재하는 것,\n여기 이렇게 서 있는 것만으로 나는 이미 충분합니다.\n\n이제 마음속으로,\n바로 곁에 든든한 나무가 한 그루 서 있다고 상상해 봅니다.\n혹은 실제로 한 손을 그 나무에 가만히 대어도 좋습니다.\n\n그 나무에게 조용히 이야기를 건네 봅니다.\n가슴 깊이 눌러온 고민을,\n누구에게도 못 했던 이야기를,\n말없이 서 있는 이 나무에게 솔직하게 털어놓아 봅니다.\n\n나무는 아무 말도 하지 않습니다.\n판단하지도,\n충고하지도 않습니다.\n그저 묵묵히,\n끝까지 다 들어줍니다.\n\n그렇게 마음의 소리를 다 내어놓고 나면,\n가슴 한켠이 한결 가벼워집니다.\n\n그리고 문득 깨닫습니다.\n내 이야기를 끝까지 들어준 그 나무가,\n사실은 나 자신이었음을.\n\n말없이 나를 지켜준 든든함도,\n흔들려도 넘어지지 않는 뿌리 깊은 고요함도,\n밖에서 얻어오는 것이 아니었습니다.\n내가 나에게 가만히 귀 기울여 줄 때,\n저절로 자라나는 것이었습니다.\n\n나는 언제나 한 그루의 든든한 나무였습니다.\n\n이제 그 든든함을 가슴에 담고,\n천천히 숨을 깊게 들이마십니다.\n발끝으로 땅을 가만히 느껴 봅니다.\n손끝을 조금씩 움직이고,\n어깨를 부드럽게 풀어 줍니다.\n\n내가 한 그루의 나무였음을 잊지 않습니다.\n세상이 나를 흔들어도 나는 뿌리 깊은 나무처럼 다시 이 자리에 설 수 있습니다.\n\n서두르지 않아도 됩니다.\n준비가 되면,\n천천히 눈을 뜹니다.\n\n오늘,\n내 안의 나무를 만나 주셔서 감사합니다.","duration":"","tags":"","series":"표현명상"},{"id":"5f3fc659","category":"수용","title":"빈방에 서서 — 비움이 열어주는 넓이","body":"편안하게 앉습니다.\n등은 곧게 펴고,\n어깨는 스르르 내려놓습니다.\n천천히 눈을 감습니다.\n\n숨을 천천히 들이마시고,\n길게 길게 내쉽니다.\n내쉬는 숨에 오늘 하루의 무게를 가만히 내려놓습니다.\n\n이제 마음속에 한 장면을 그려 봅니다.\n오래 살던 집에서 이사를 하는 날입니다.\n\n누구나 한 번쯤 겪어 보았을 풍경입니다.\n아침부터 짐이 실려 나가고,\n익숙하던 방들이 하나씩 비어 갑니다.\n\n이윽고 짐이 모두 빠져나가고,\n텅 빈 집만 남았습니다.\n마지막으로 그 집을 천천히 한 바퀴 돌아봅니다.\n\n벽에는 가구가 서 있던 자리마다 빛바랜 자국이 남아 있습니다.\n문틀 어딘가에는 아이들 키를 표시해 둔 작은 눈금도 보입니다.\n\n슬플 줄 알았습니다.\n그런데 이상하게도,\n그 텅 빈 방 앞에 서자 뜻밖의 후련함과 고요가 밀려옵니다.\n\n그리고 문득 깨닫습니다.\n이 방이 이렇게 넓은 줄 처음 알았다는 것을.\n\n그 오랜 세월 동안 한 번도 방 자체를 본 적이 없었습니다.\n늘 그 안에 놓인 물건들만 보았을 뿐입니다.\n\n물건이 빠져나가자,\n비로소 방이 보였습니다.\n\n이제 그 장면을 내 마음으로 가져와 봅니다.\n\n가만히 내 안을 들여다봅니다.\n지금 이 마음속에는 얼마나 많은 것이 들어차 있습니까.\n\n해야 할 일들,\n하지 못한 말들,\n누군가에게 서운했던 마음,\n내일에 대한 걱정.\n\n우리의 마음도 그 집과 같습니다.\n늘 무언가로 가득 채워져 있어서,\n담긴 것들만 보일 뿐 담는 자리 자체는 좀처럼 보이지 않습니다.\n\n이제 하나씩,\n그 물건들을 마음의 방에서 내보내 봅니다.\n\n먼저,\n오늘 해야 할 일들을 문밖에 잠시 내려놓습니다.\n지금 이 순간에는 아무것도 하지 않아도 됩니다.\n\n다음으로,\n마음에 걸리던 그 걱정을 잠깐 방 밖에 세워 둡니다.\n잠시 자리를 비워도 큰일은 일어나지 않습니다.\n\n누군가에게 품었던 서운함과 미움도,\n잠시 문밖에 내려놓습니다.\n지금은 들고 있지 않아도 됩니다.\n\n내일의 계획도,\n어제의 후회도,\n하나씩 방에서 내보냅니다.\n\n숨을 들이마시고,\n내쉴 때마다 마음의 방에서 짐이 하나씩 빠져나갑니다.\n\n이제 방이 점점 비어 갑니다.\n가구가 서 있던 자리에는 자국만 남았습니다.\n\n그 빈자리를 가만히 바라봅니다.\n\n처음에는 조금 허전할지도 모릅니다.\n늘 무언가로 채워져 있던 곳이 텅 비었으니까요.\n\n그 허전함을 밀어내지 않습니다.\n비움은 친해지는 데 시간이 걸리는 친구입니다.\n\n조금 더 그 빈방에 머물러 봅니다.\n허전함이 지나가고 나면,\n어색함이 지나가고 나면,\n그다음에 비로소 넓이가 찾아옵니다.\n\n오랜 세월 만에 처음 보는 넓이,\n평생 처음 만나는 나의 넓은 마음이 거기 있습니다.\n\n생각이 빠져나간 자리,\n감정이 빠져나간 자리,\n그 텅 빈 자리가 사실은 얼마나 넓고 고요했는지를 이제야 봅니다.\n\n이 넓음은 잃어버려서 생긴 것이 아닙니다.\n원래부터 거기 있었습니다.\n다만 물건에 가려 보이지 않았을 뿐입니다.\n\n이 텅 빔 속에서 숨을 쉬어 봅니다.\n채우려 하지 않고,\n잡으려 하지 않고,\n그저 이 넓은 자리에 가만히 머물러 봅니다.\n\n비움 뒤에 오는 것이 결핍만은 아니었습니다.\n빈방에 서 본 사람은 압니다.\n없음은,\n한번 친해지면 평생 곁을 내주는 친구라는 것을.\n\n이 넓은 고요를 가슴 깊이 담아 둡니다.\n언제든 마음이 가득 차 버거울 때면,\n다시 짐을 내려놓고 이 빈방으로 돌아올 수 있습니다.\n\n이제 천천히 숨을 깊게 들이마십니다.\n손끝과 발끝을 조금씩 움직여 봅니다.\n어깨를 부드럽게 풀어 줍니다.\n\n방을 가득 채우지 않아도 나는 이미 넓은 사람이라는 것을 잊지 않습니다.\n\n서두르지 않아도 됩니다.\n준비가 되면,\n천천히 눈을 뜹니다.\n\n오늘,\n내 마음의 빈방에 가만히 서 주셔서 감사합니다.","duration":"","tags":"","series":"숨비명상"},{"id":"5f14fc61","category":"수면·이완","title":"빛 명상 — 나를 비추는 첫 번째 빛","body":"편안하게 자리에 눕습니다.\n천천히 눈을 감습니다.\n두 손바닥을 하늘로 향하게 열어둡니다.\n그 손 위로 따스한 햇살이 내려앉는다고 상상해봅니다.\n\n숨을 깊게 들이마시고 천천히,\n길게 내쉽니다.\n들이쉴 때 그 빛이 몸 안으로 스며들고 내쉴 때 하루의 무게가 조금씩 빠져나갑니다.\n\n숨을 마시며 하나,\n내쉬며 둘, 다시 마시며 셋,\n그렇게 열까지,\n파도처럼 천천히 셉니다.\n숫자가 흐려져도 괜찮습니다.\n그저 빛과 호흡에 몸을 맡깁니다.\n\n이제 그 따뜻한 빛이 아랫배 단전에 고입니다.\n작은 촛불 하나가 몸 한가운데 켜진 듯합니다.\n그 온기가 명치로 번지며 오래 뭉쳐 있던 자리를 부드럽게 풀어줍니다.\n\n빛은 쉬지 않고 뛰어온 심장으로 흘러갑니다.\n한 번도 멈추지 않고 나를 살려온 그 심장에게 수고했다고,\n고맙다고 가만히 손을 얹습니다.\n빛이 목을 지나 미간으로 오르고 찌푸려 있던 이마가 스르르 펴집니다.\n무겁던 정수리가 가벼워지고 따뜻한 담요를 덮은 듯 온몸이 노곤해집니다.\n\n여기서 잠시 마음을 돌이켜봅니다.\n나는 늘 이 빛을,\n이 온기를 바깥의 누군가에게 먼저 건네려 애써왔습니다.\n사랑하는 사람에게,\n지켜야 할 사람에게.\n\n그러나 오늘은 압니다.\n내가 나를 데운 딱 그만큼만 나는 다른 사람을 데울 수 있다는 것을.\n자비도 감사도,\n그 첫 번째 자리는 언제나 나 자신입니다.\n\n그러니 이 빛 앞에서 나에게 처음으로 말해봅니다.\n그동안 참 애썼어.\n힘든 줄도 모르고 버티게 해서 미안해.\n그래도 여기까지 와줘서 고마워.\n잘난 것도 부족한 것도,\n있는 그대로의 나를 사랑해.\n\n그 고백과 함께 가슴속 빛이 한층 밝아집니다.\n차오른 온기는 손끝 발끝까지 흘러넘치고 넘친 빛은 애쓰지 않아도 곁의 사람에게,\n세상으로 저절로 번져갑니다.\n가만히,\n그 따뜻함이 퍼지는 것을 지켜봅니다.\n\n이제 천천히 돌아옵니다.\n손가락과 발가락을 조금씩 움직이고 크게 기지개를 켜봅니다.\n오른쪽으로 돌아누웠다가 왼손으로 바닥을 짚으며 서서히 일어납니다.\n\n두 손을 비벼 따뜻해진 손바닥으로 눈을 덮습니다.\n머리와 목,\n어깨와 팔을 가볍게 쓸어내립니다.\n수고하셨습니다.\n이 빛은 늘 당신 안에 있었습니다.\n잠들기 전 잠시 이 명상을 떠올리면 그 온기가 당신의 밤을 편안하게 지켜줄 것입니다.","duration":"","tags":"","series":"숨비명상"},{"id":"e1190c4a","category":"멈춤","title":"주먹 쥐기","body":"편안히 앉아 눈을 감습니다\n두 손은 무릎 위에 가볍게 올려둡니다\n\n지금부터 딱 하나만 부탁드리겠습니다\n오른손을 천천히 들어\n주먹을 쥐어보세요\n\n꽉,\n쥡니다 조금 더 힘을 줍니다 손톱이 손바닥에 닿을 만큼 있는 힘껏 쥐어봅니다\n\n그대로 유지합니다\n\n숨을 들이쉬고\n내쉬면서도\n주먹은 풀지 않습니다\n\n어떤가요\n손이 조금씩 떨려오지 않나요\n손등이 뻐근하고\n팔뚝까지 힘이 번집니다\n\n아무것도 쥐지 않았는데\n손안은 이렇게 무겁습니다\n\n조금만 더 쥐고 있어봅니다\n쥐고 있는 것은 손인데\n지쳐가는 것은 온몸입니다\n\n우리 마음도 꼭 이렇습니다\n\n놓지 못한 말 한마디\n풀지 못한 서운함\n지나간 일인 줄 알면서도\n손에서 떠나지 않는 것들\n\n쥐고 있는 동안\n그것이 나를 지켜준다고 믿었습니다\n그런데 정말 그런가요\n지켜지고 있는 것은 그 일인가요\n지쳐가고 있는 것은 나인가요\n\n당신이 모자라서가 아닙니다 쉽게 놓아지지 않는 것은 그만큼 오래,\n힘껏 살아왔다는 뜻입니다\n\n이제 다르게 해보겠습니다\n\n숨을 깊이 들이쉬고\n\n내쉬면서\n손가락을 하나씩\n천천히 펴봅니다\n\n엄지가 열리고 검지가 열리고 하나씩,\n하나씩\n\n손바닥이 하늘을 향해\n활짝 열립니다\n\n지금 손바닥의 느낌은 어떤가요\n저릿하게 피가 돌고\n따뜻한 기운이 번져옵니다\n\n이상하지요\n힘을 줄 때가 아니라\n힘을 놓은 지금\n손은 비로소 살아납니다\n\n놓는 것은 잃는 것이 아니었습니다\n빈손이 되어서야\n손은 무엇이든 받을 수 있습니다\n\n애써 놓으려 하지 않아도 됩니다\n오늘은 다만\n내가 무엇을 쥐고 있었는지\n알아차린 것으로 충분합니다\n\n쥐고 있음을 아는 손은\n언젠가 스스로 열립니다\n\n이제 두 손을 무릎 위에 내려놓습니다\n손바닥의 온기가\n무릎으로 스며듭니다\n\n앉아 있는 몸의 무게를 느껴봅니다\n들려오는 소리에\n잠시 귀를 기울입니다\n\n준비가 되면\n천천히 눈을 뜹니다","duration":"","tags":"","series":"숨비명상"},{"id":"0a589422","category":"멈춤","title":"침 삼키기","body":"편안히 앉아 눈을 감습니다\n두 손은 무릎 위에 가볍게 올려둡니다\n\n지금부터 딱 하나만 부탁드리겠습니다\n지금 이 순간부터\n침을 삼키지 마세요\n\n방금까지 당신은\n침을 삼키는 줄도 몰랐습니다\n하루에도 수천 번\n저절로 넘겨왔는데 말입니다\n\n이제 그것을 멈춰보세요\n\n숨을 천천히 들이쉬고\n천천히 내쉽니다\n\n삼키지 않으려 애써봅니다\n\n또 애써봅니다\n\n입안에 침이 고이는 것이 느껴지나요 삼키지 말라고 하니 오히려 더 삼키고 싶어집니다 혀 밑에,\n입 안쪽에 자꾸만 신경이 쏠립니다\n\n당신은 분명 최선을 다했습니다\n그런데 왜\n참으려 할수록 더 넘기고 싶을까요\n\n침은 멈추지 않습니다\n계속 고입니다\n내 안에서 저절로 일어납니다\n\n우리 마음속 어떤 생각도\n꼭 이렇습니다\n참으라고 하면 더 하고 싶고\n멈추라고 하면 더 차오릅니다\n\n그 고이는 것이\n그리움이라면 어떨까요\n\n그 차오르는 것이\n눈물이라면 어떨까요\n\n삼키고 삼켜 눌러온 날마다\n그것은 더 가득 차오르지 않았나요\n\n우리가 부족해서가 아닙니다\n의지가 약해서도 아닙니다\n저절로 일어나는 것은\n참는다고 사라지지 않습니다\n\n이제 다르게 해보겠습니다\n\n참으려 하지 마세요 넘기고 싶으면 그저 한 번 삼켜봅니다 천천히,\n편안하게\n\n일어나는 것을\n일어나게 둡니다\n\n그리고 숨으로\n의식을 옮겨봅니다\n\n들이쉬는 숨이\n코끝을 스치는 자리\n그 서늘한 감각에\n가만히 머뭅니다\n\n들이쉬고\n\n내쉬고\n\n그런데 지금\n그 조급함은 어디로 갔나요\n\n참을 때는 그토록 차오르더니\n삼켜도 좋다고 허락하자\n스스로 잔잔해졌습니다\n\n생각도,\n감정도 참는 힘이 아니라 허락하는 마음 안에서 풀어집니다\n\n눌러 삼키지 않아도 됩니다\n싸우지 않아도 됩니다\n\n저절로 일어나는 것은 흐르게 두고\n우리는 다만\n숨으로 돌아옵니다\n\n그렇게 마음은\n부드럽게 제자리를 찾아갑니다\n\n이제 앉아 있는 몸의 무게를 느껴봅니다\n손바닥이 무릎에 닿아 있는 감각\n들려오는 소리에\n잠시 귀를 기울입니다\n\n준비가 되면\n천천히 눈을 뜹니다","duration":"","tags":"","series":"숨비명상"},{"id":"dbb46c43","category":"멈춤","title":"별칭 짓기","body":"우리가 이틀동안 프로그램을 같이할텐데요.\n먼저 여러분들은 이제 7살 이전으로 돌아간다고 생각하고 명상프로그램을 진행하겠습니다.\n여러분들이 동심을 가지고 아무런 조건없이 행복했던 시절로 돌아가 7살 이전으로 돌아간다고 생각합니다.\n\n이제 프로그램을 진행하는 동안 불려질 자신의 별칭을 만들어보겠습니다.\n\n불교신자들은 법명을 사용해도 좋고,\n평소 자신이 별명이나 애칭을 사용해도 좋지만,\n자기 스스로를 되돌아보시고 지금 바로 떠오르는 단어를 별칭으로 사용하셔도 좋습니다.\n\n함께 진행할 선생님들도 애칭으로 부르겠습니다.\n선생님들부터 별칭으로 자기를 소개해보겠습니다.\n\n오래 고민한다고 좋은 결과가 있지는 않은 것 같으니 그냥 지금 머릿속에 떠오르는 별칭을 사용하시는게 좋을 것 같습니다.\n지금 떠오르는 별칭이 없으시면 별명이나 법명을 사용하셔도 좋습니다.\n\n이제 생각하신 별칭을\n나눠드린 이름표에 직접 써넣어주시기 바랍니다\n\n그럼,\n여러분들의 별칭을 공개하겠습니다.\n저를 기준으로 시계방향으로 발표하겠습니다.\n\n네,\n이상으로 별칭짓기를 마치겠습니다.\n\n감사합니다.","duration":"15분","tags":"늘봄8회기,1회기","series":"늘봄명상"},{"id":"0fc56112","category":"멈춤","title":"블라인드 명상","body":"ᄋ 준비물 : 안대, 사탕,\n종이컵, 명상발우\n\n모두 안대와 종이컵 받으셨죠?\n5명씩 안대를 착용하고,\n종이컵을 들고 앞으로 이동 후 앞에 준비된 사탕을 5개씩 종이컵에 담아주시면 됩니다.\n\n앞이 보이시나요?\n앞이 보이시면 반칙입니다.\n사탕 5개를 다 담으시면 손을 들어주세요.\n맨 먼저 담으신 분이 결정되면 명상발우로 종료합니다.\n자,\n명상발우 소리를 시작으로 출발하겠습니다.\n(시작 명상발우) 땡~\n\n(1등이 결정되면 종료 명상발우) 땡~\n\n네, 고생하셨어요.\n다음 다섯 분 출발하겠습니다.\n(인원수에 따라 운영) ...\n\n​마무리(간단 정리)하고 나서\n\n모두 자리에 앉아주세요.\n우리는 평상시에 마치 안대를 착용하고 움직이는 것처럼 본인도 모르게 습관화된 행동을 하고 있습니다.\n그동안 눈을 뜨고도 보지 못했던 행동들을 이제부터는 제대로 볼 수 있는 계기가 되셨기를 바랍니다.","duration":"5분","tags":"늘봄8회기,1회기","series":"늘봄명상"},{"id":"c5f2282e","category":"멈춤","title":"즐겁게 춤을 추다가","body":"여러분 우리가 몇 살로 돌아가기로 했죠?\n“7살이요~“ 네 맞아요. 지금부터 7세 이전으로 돌아가서 움직임 명상을 해보도록 하겠습니다.\n\n멈춤이라는 뜻은 여러분 모두 잘 알고 계시겠지만 생각보다 멈춘다는 것이 쉽지만은 않습니다.\n몸은 멈춰도 생각은 계속 움직이려고 하고,\n생각이 멈춘 듯 하면 욕망이 쉬려 하지 않습니다.\n\n그래서 욕망을 쉬기 위해서 제일 먼저 몸을 멈추는 것을 연습해보겠습니다.\n\n여러분 모두 이 노래 아시죠?\n‘즐겁게 춤을 추다가’라는 노래입니다.\n모두 노래에 맞춰 자유롭게 몸을 움직이다가 노래가사에 맞춰 멈춰보는 것입니다.\n\n모두 어른이라는 허울을 벗어놓고 어린 시절로 돌아가겠습니다.\n동심만큼 행복하고 즐거운 시절이 어디있습니까?\n앞에 나오는 노래와 영상을 보면서 그대로 따라해 보셔도 좋고 편하게 몸을 움직이셔도 좋습니다.\n자유롭게 움직이다가 멈추는 것입니다.\n\n자 이제 시작합니다.\n「즐겁게 춤을 추다가 그대로 멈춰라!」(5분) - (뽀로로) 3개1세트 2회 반복 총6회\n\n이제 자리에 편안히 앉아주십시오.\n눈을 감고 자연스럽게 호흡을 하며 숨을 고릅니다.\n(2분) 마음이 좀 차분해지셨나요?\n아마 마음이 멈춰지진 않아도 좀 느려진 것을 느끼실 수 있을 겁니다.\n좀 느려진 마음을 가지고 다음 명상은 허당(나기태선생)님이 시작하시겠습니다.","duration":"10분","tags":"늘봄8회기,1회기","series":"늘봄명상"},{"id":"17dc048a","category":"멈춤","title":"청개구리 명상","body":"편안한 자세로 눈을 감아주세요.\n여러분은 어린 시절 냇가에서 보았던 청개구리를 기억하나요?\n퉁망울 눈에 파란 몸을 가지고 물갈퀴를 가진 청개구리를 자세히 눈앞에 그려보겠습니다.\n\n잠시 전래 동화 <청개구리>를 생각해 보겠습니다.\n엄마의 말을 늘 반대로 듣는,\n말 안 듣는 청개구리였지요.\n아기 청개구리가 엄마의 유언을 지킨 결과 비가 내릴 때마다 엄마의 시신이 떠내려 갈까봐 걱정이 돼서 운다는 이야기이지요.\n이번 명상은 이 전래동화와 연관이 있습니다.\n\n(계속 눈을 감은 상태로) 청개구리가 그려지나요?\n1분 동안 어떤 책의 내용을 되뇌어도 좋고,\n미뤄놓았던 일상의 문제들을 생각해도 좋고,\n오늘 저녁 메뉴를 생각해도 좋습니다.\n“오늘 저녁 공양은 뭐가 나올까요?” 단지 절대로 ‘청개구리’는 단 한 번도 생각하지 않도록 ‘최선’을 다해서 노력해야 합니다.\n가능한 한 최선을 다하십시오.\n자 이제 시작합니다.\n(2분 발우명상볼  땡~)\n\n이제 천천히  눈을 뜨십시오.\n\n(맨 앞에 보살님께 질문) “청개구리가 몇 번이나 떠오르던가요? 1번? 5번 이내? 10번 이내? 아니면 10번 이상?”\n\n여러분은 아마 최선을 다했을 것입니다.\n우리는 최선을 다해 원치 않는 생각을 머릿속에서 밀어내려 노력했을 것입니다.\n\n이때 청개구리가 ‘우울’한 생각이나 ‘불안’한 생각이라면 어떻게 될까요?\n우리가 생각하지 않으려,\n최선을 다해 억제하고 통제하려,\n노력하면 할수록 더 적게 경험할까요?\n잠시는 다른 생각을 하는 것 같지만 결국은 다시 원치 않는 생각으로 되돌아온 경험이 누구나 있을 것입니다.\n우리가 최선을 다하지 않은 것일까요?\n그렇지 않습니다.\n인간 공통의 경험으로서 우리의 마음이 그렇게 움직이지 않은 것뿐입니다.\n개인의 성격이나 지능 또는 노력의 문제가 아니라는 점을 강조하고 싶습니다.\n\n그럼 이제부터 청개구리에 관한 생각을 쉽게 지우는 법을 알려드리겠습니다.\n청개구리에 대한 생각을 지우기 전에 엄지 발가락에 의식을 집중합니다.\n오른쪽 엄지 발가락에 의식을 집중하면서 어떤 감각이 느껴지는지 관찰합니다.\n아무런 느낌이 없어도 괜찮습니다.\n\n그냥 편안하게 엄지 발가락의 감각을 느껴봅니다.\n(2분 발우명상볼 땡~)\n\n어떤 감각이 느껴지셨나요?\n아무런 느낌도 없었나요?\n그런데 엄지 발가락 감각에 집중하는 동안 청개구리는 어디로 갔죠?\n\n우리 생각이 작동하는 방식이,\n마음이 움직이는 모습이 하라고 하면 하지않고,\n하지 말라고 하면 하는 이번 명상의 주인공인 청개구리와 같죠?\n우리의 삶에도 이러한 모순이 존재하지 않을까요?","duration":"15분","tags":"늘봄8회기,1회기","series":"늘봄명상"},{"id":"6a6e1d07","category":"멈춤","title":"멈춤명상","body":"앞에서 해보셨던 청개구리 명상처럼 여러분들이 가지고 있는 괴로움은 괴로움 그 자체보다 괴로움에서 떨어지지 않는 것입니다.\n그럼,\n이제 그 괴로움을 날씨에 비유해보겠습니다.\n\n이제 여러분은 자신에게 질문을 던집니다.\n지금 마음의 상태는 어떤가요?\n지금 당신의 마음에 괴로움이 있나요?\n그 괴로움을 날씨로 표현해보겠습니다.\n여러분의 마음날씨는 어떤가요?\n\n이제 그 날씨에 이름을 붙입니다.\n‘분노, 우울, 불안, 슬픔, 두려움, 수치심 등등.’\n\n특히 우울은 과거와 맞닿아있고 강박은 현재와 맞닿아있으며 불안은 미래와 맞닿아 있습니다.\n\n이제 여러분은 그 마음의 상태를 바라보면서 이렇게 말합니다.\n\n우울은 나에게 있다.\n강박은 나에게 있다.\n불안은 나에게 있다.\n..........\n.......... .....\n\n이렇게 3번 말합니다.\n\n그리고 그 단어에 자신을 인식시킵니다.\n그리고 이번에는 조금 큰 목소리로 말합니다.\n‘ 나는 멈출 수 있다’ 이렇게 10번을 외칩니다.\n\n다 하셨나요?\n이젠 다시 호흡을 가다듬고 큰 호흡을 10번 합니다.","duration":"5분","tags":"늘봄8회기,1회기","series":"늘봄명상"},{"id":"1327c2e5","category":"멈춤","title":"멈춤 선언","body":"​(앞에 방석을 3개 배치한다.)\n\n지금부터 앞에 보이는 방석에 3명씩 올라가 본인이 멈추고 싶은 내용을 외쳐서 보도록 하겠습니다.\n\n외치실 내용은 본인이 선택합니다.\n예를 들면 이렇습니다.\n\n나는 과거의 아팠던 기억을 멈출 수 있다.\n나는 미래에 대한 걱정을 멈출 수 있다.\n나는 부정적 감정을 멈출 수 있다.\n나는 지나친 욕구를 멈출 수 있다.\n나는 고장 난 생각을 멈출 수 있다.\n나는 나쁜 습관을 멈출 수 있다.\n나는 좋지 않은 행동을 멈출 수 있다.\n​나는 나쁜 말 하는 버릇을 멈출 수 있다.\n\n​이런 식으로 본인이 꼭 멈추고 싶거나,\n이번 기회를 통해서 바꾸고 싶은 습관이나 행동을,\n큰 소리로 외치면 되겠습니다.\n1가지만 3번 외쳐도 되고,\n3가지를 1번씩 외쳐도 좋습니다.\n\n첫 번째 3명 앞으로 나오셔서 방석 위에 서주세요.\n모두 3번 크게 외치면 되겠습니다.\n손도 같이 들면서 외쳐주세요.\n자, 시작합니다.\n\n나는 무엇 무엇을 멈출 수 있다.\n(3번) …\n\n네 고생하셨어요.\n다음 3명 방석에 올라서겠습니다.\n방법은 동일합니다. 자,\n시작합니다.\n\n나는 무엇 무엇을 멈출 수 있다.\n(3번) ...\n\n네, 모두 고생하셨습니다.\n의지가 좀 다져지셨나요.\n우리는 마음만 있으면 그 어떤 것도 멈출 수 있습니다.\n명상은 마음의 필라테스입니다.","duration":"5분","tags":"늘봄8회기,1회기","series":"늘봄명상"},{"id":"a512ffe4","category":"멈춤","title":"소리끝 명상","body":"모두 편안하게 누워주세요.\n천천히 눈을 감고,\n온몸에 힘을 뺍니다.\n양쪽 어깨에 힘이 들어가 있지는 않은지 미간이 찌푸려져 있지는 않은지 바라봅니다.\n\n자연스럽게 다섯 번 숨을 들이쉬고 내쉽니다.\n\n이제 명상발우 소리에 귀를 기울여 주십시오.\n(발우명상볼  땡~)\n\n명상발우 소리가 머리에서 들어와 발끝으로 빠져나간다는 느낌으로 소리를 받아드립니다.\n(3번 정도)\n\n명상발우 소리가 어느 지점에서 멈췄는지 바라보세요.\n반복하는 명상발우 소리에 계속 귀를 기울이면서 소리의 끝을 잡아 보세요.\n\n점점 작아지는 소리에 더욱 집중하면서 아주 미세한 소리까지 응시해 보세요.\n(땡~) 잘 집중이 되지 않고 다른 생각이 일어나면 그 생각은 그대로 소리에 실어서 흘려보냅니다.\n(땡~)\n\n그리고 다시 소리에 집중합니다.\n(10분 집중)\n\n(발우명상볼  때댕땡~) 자,\n이제 천천히 눈을 뜹니다.\n\n어떠셨나요?\n여러분은 청각이라는 감각에 집중을 해보셨습니다.\n집중이 잘 되던가요?\n\n지금까지 소리끝잡기 명상이었습니다.\n\n감사합니다.","duration":"10분","tags":"늘봄8회기,1회기","series":"늘봄명상"},{"id":"e421fed2","category":"관찰","title":"영상관법","body":"자리에 편안하게 앉습니다.\n부드럽게 눈을 감으세요.\n잠시 자신의 호흡을 바라봅니다.\n​ 눈앞에 마음으로 원을 그려봅니다.\n원의 크기는 15Cm 정도로 상상합니다.\n그 원 안에 들어있는 자기 자신의 모습을 떠올려 봅니다.\n원안의 자신의 모습을 보면서 ‘마음은 어디에 있지?’하며 천천히 찾아보겠습니다.\n지금부터 마칠 때까지 15센티 원안에 있는 자기 자신을 관찰합니다.\n\n호흡이 몸속으로 들어왔다가 바깥으로 나가는 것을 지켜봅니다.\n편안하게 이완한 채 몸 전체를 지켜봅니다.\n의자나 방바닥과 맞닿는 신체 부분에 집중합니다.\n몸의 느낌을 인위적으로 변화시키려 하지 말고 느껴지는 데로 느낍니다.\n\n이것이 바로 지금 이곳에 존재하는 것입니다.\n몸의 감각에 대하여 생각으로 알아차리는 것이 아니라 차면 찬대로,\n따뜻하면 따뜻한 대로,\n딱딱하면 딱딱한 대로,\n부드러우면 부드러운 대로 그 느낌을 그대로 느껴보는 것입니다.\n\n정수리에 의식을 집중하고 정수리를 통해 호흡이 들어오고 나간다고 느껴보십시오.\n\n그냥 이완한 채 정수리에서 느껴지는지 감각을 바라보세요.\n특별한 감각이 느껴지지 않는다면 그냥 오롯이 지켜보기만 합니다.\n\n감각이 느껴지지 않는 것에 대해 어떤 해석도 하지 않습니다.\n해석하려는 생각이 떠오른다면 내려놓고 다시 정수리로 주의를 되돌립니다.\n​ 정수리의 온도,\n공기와의 접촉감도 느껴보십시오.\n최대한 세밀하고 예민하게 감각을 느껴보십시오.\n감각이 생겼다가 사라지는 변화를 있는 그대로 지켜봅니다.\n\n깊은 호흡을 몇 번 하고 난 후 정수리에 이마 쪽으로 초점을 옮겨 가십시오.\n정수리에서 했던 감각 살피기를 이마에서부터 발끝까지 순서대로 그대로 하겠습니다.\n이마, 눈, 코, 입 목,\n어깨, 팔, 가슴, 복부,\n허리, 골반 허벅지, 무릎,\n종아리, 발목,\n발가락으로 이동하면서 감각 살피기를 집중이 잘 안될 때는 인내심을 갖고 초점을 두고 있는 신체 부위의 감각과 호흡을 다시 느껴보도록 하십시오.\n\n(이마, 왼쪽 눈썹,\n오른쪽 눈썹, 오른쪽 눈,\n왼쪽 눈으로 코, 왼쪽 뺨,\n오른쪽 뺨, 입과 턱, 목,\n어깨, 가슴 왼쪽팔, 왼손,\n왼쪽손가락 오른팔, 오른손,\n오른손가락 복부, 허리,\n골반 왼쪽허벅지, 왼쪽무릎,\n왼쪽종아리, 왼쪽발목, 왼발,\n왼쪽 발가락 오른쪽허벅지,\n오른쪽무릎, 오른쪽종아리,\n오른쪽발목, 오른발,\n오른쪽 발가락)\n\n모든 신체의 감각을 살펴보셨으면,\n계속 눈을 감은 채로 정수리에 문이 있어서 그 문으로 호흡이 들어와 아래로 몸 전체를 서서히 관통하여 두 발의 발바닥을 통해 몸 밖으로 나가게 하십시오.\n\n이번에는 반대로 발바닥으로 호흡을 들이마셔서 몸을 통과하여 정수리로 나가게 하십시오.\n하고 싶은 만큼 계속하십시오.\n\n그냥 고요히 그 순간의 침묵 속에서 편안히 쉬십시오.\n깊은 평화와 안정감을 한껏 느껴보십시오.\n\n(30초 후,\n명상발우) 깊은 호흡을 몇 번 하고 서서히 눈을 뜨세요.\n\n지금까지 15Cm 원안에 있는 자신의 몸을 감각과 호흡으로 살펴보았습니다.\n\n이 명상을 처음 경험하시는 분들 중에는 가끔 몸이 없는 것처럼 느껴지기도 합니다.\n그렇게 느껴져도 걱정하지 마십시오.\n꾸준히 계속하시면 몸과 마음이 한결 가벼워지는 것을 경험할 수 있습니다.","duration":"15분","tags":"늘봄8회기,2회기","series":"늘봄명상"},{"id":"0f83eb6e","category":"관찰","title":"원초음 명상","body":"(캥거루 케어)\n\n여러분, 안녕하세요.\n저와 함께할 이번 명상은 원초음 명상입니다.\n\n①심장소리 듣기 원초음 명상은 청진기를 사용하여 우리가 살아있음을 의미하는 가장 원초적인 소리인 우리 자신의 심장소리를 들어보는 명상입니다.\n살아가면서 특별한 경우를 제외하고는 자신의 심장소리를 들어볼 기회가 거의 없습니다.\n심장은 우리 몸의 가장 중요한 장기이면서 내가 살아 있다는 증거인데도 불구하고 한번도 자세하게 관심을 가져보지 못하는 것이 대부분입니다.\n오늘은 각자 청진기로 자신의 심장소리를 들어보는 시간을 갖도록 하겠습니다.\n\n모두에게 청진기를 하나씩 나누어 드리겠습니다.\n받으셨죠?\n청진기를 들어보세요.\n이 청진기의 각부 명칭은 ①청진판 ②고무관 ③분기관 ④귀꽂이 라고 합니다.\n이제 나의 심장소리를 들어보도록 하겠습니다.\n\n나의 심장소리를 듣는 방법은 먼저 귀꽂이를 양쪽 귀에 꽂은 다음 청진판을 나의 왼쪽가슴에 댑니다.\n청진판의 큰쪽을 나의 가슴에 대고,\n작은쪽 구멍은 손가락으로 막아주십시오.\n이제 조용히 귀꽂이에서 전해지는 소리에 집중합니다.\n\n여러분,\n잘 들리시지 않으시죠?\n저도 처음에 연습으로 들어 보았을 때 내 심장소리가 두근반 세근반 하고 크게 들릴 것으로 기대했는데 심장소리가 거의 들리지 않아서 저는 심장이 없는 줄 알았습니다.\n^^ 의사 선생님의 말씀으로는 청진기를 통해 들리는 심장소리는 lub-dub(럽-덥).\nlub-dub(럽-덥) … 이렇게 들린다고 합니다.\n\n그럼 지금부터 정식으로 각자 자신의 심장소리를 들어보겠습니다.\n자세를 바르게 하고 전신에 힘을 빼고 편안히 앉습니다.\n모두 귀꽂이를 자신의 귀에 꽂고,\n청진기를 들겠습니다.\n조용히 눈을 감고 청진기의 청진판을 가볍게 가슴에 대고 자신의 심장박동 소리에 귀를 기울입니다.\n청진판 뒤에 구멍을은 검지 손가락으로 막아주세요.\n나의 심장이 규칙적으로 잘 뛰는지 박동소리에 귀를 기울입니다.\n처음 듣는 나의 신장소리에 두려움이 몰려오기도 하고 거북하기도 해서 듣고 있기가 쉽지 않을 수도 있습니다.\n심장소리를 들으며 잠시도 쉬지 않고 열심히 뛰고있는 나의 심장에게 고마운 마음을 전해봅니다.\n따라해 주세요.\n\n“심장아 고마워~”\n“심장아 고마워~”\n“심장아 고마워~”(3회 이상)\n\n끊이지 않고 규칙적으로 뛰고 있는 심장소리를 들어봅니다.\n일정하게 뛰어주는 심장으로 인해 내가 살아 있음을 다시 한 번 느껴봅니다.\n조용히 심장소리를 들으며 엄마 뱃속에서의 나,\n태어났을 때의 나,\n그리고 현재의 나를 생각해 봅니다.\n그럼 지금부터 1분간 나의 심장소리에 귀를 기울이겠습니다.\n(1분후 명상발우 땡~)\n\n다음은 마음의 소리 듣기를 해보겠습니다.\n심장은 태어나서 단 한 번도 멈추지 않고 화날 때나 기쁠 때나 한순간도 멈춤이 없이 묵묵히 뛰고 있습니다.\n잠시 심장소리를 들으면서 심장에서부터 퍼져 나오는 사랑의 감정을 느껴봅니다.\n(1분 땡~)\n\n눈을 떠주세요.\n심장에서부터 나오는 사랑의 감정을 충분히 느꼈보았습니까?\n지금부터 청진기를 이용해서 우리 마음의 소리를 들어보도록 하겠습니다.\n(모두에게 미리 인형을 하나씩 나누어 준다.)\n\n조용히 눈을 감고 인형을 나라고 생각합니다.\n인형의 부드럽고 따뜻함을 느껴봅니다.\n인형의 가슴부위에 청진판을 대고 인형의 마음의 소리를 느낍니다.\n내가 된 인형에게 물어 봅니다.\n지금부터 인형을 바라보며 자신의 이름을 불러봅니다.\n\n“ㅇㅇ아~!”\n\n지금부터 각자의 부르며 적용하여 마음속으로 따라해주세요.\n\n“너는 지금까지 살아온 날들에 대한 너의 기분은 어떠니?”(5초) “너는 지금까지 살아온 날들이 답답했니?”(5초) “너는 지금까지 살아온 날들이 우울했니?”(5초) “너는 지금까지 살아온 날들이 그냥 덤덤했니?”(5초) “너는 지금까지 살아온 날들이 행복했니?”(5초) “너는 지금까지 살아온 날들이 기뻤니?”(5초)\n\n청진기를 거두고 조용히 앉아 호흡하며 마음속으로 나의 심장소리를 느껴봅니다 현재 인형의 심장에서 전해오는 감정을 느끼며,\n지금 나의 느낌은 어떤지 살펴보겠습니다.\n\n이렇게 엄마의 뱃속에서부터 지금까지 묵묵히 뛰고 있는 심장박동 소리에 귀를 기울이며 내가 살아있음을 느끼며 마음을 편안하게 가져보겠습니다.\n(본인 살펴보는 명상 2분)\n\n자 이제 눈을 뜨고 현실로 돌아옵니다.\n자 어떠했습니까?\n자신의 심장소리와 함께 마음의 소리를 느껴보셨나요?\n\n수고하셨습니다.","duration":"15분","tags":"늘봄8회기,2회기","series":"늘봄명상"},{"id":"092d0a5d","category":"관찰","title":"몸 반응 바라보기","body":"지금부터 몸 반응 바라보기 명상을 시작하겠습니다.\n안정되고 편안한 자세로 앉습니다.\n(명상발우 땡~)\n\n편안히 앉아 있어도 몸이 힘들어질 수 있습니다.\n힘들어지는 그 모든 것을 살펴봅니다.\n척추를 위에서 살짝 잡아당기는 느낌으로 허리를 펴서 자세를 바르게 합니다.\n눈과 얼굴의 긴장을 풀고,\n어깨와 손도 자연스러운 자세로 편안하게 둡니다.\n시원한 느낌, 어지러움,\n따끔거림, 가려움, 압박감,\n가슴과 배의 움직임을 느끼면서 호흡을 명상의 중심으로 삼습니다.\n\n따가움이나 가려움,\n무릎의 통증,\n어깨 결림 등 강렬한 감각이 느껴지면 그곳에 뜨겁거나 차가운 기운을 느끼게 됩니다.\n그런 기운이나 감각이 강해지면,\n호흡은 잠시 잊고,\n그 부위에 집중하면서 충분히 느껴보십시오.\n느낌을 거부하거나 싫어하지 말고 있는 그대로 느끼고 받아들입니다.\n\n이제부터 느낌에 이름을 붙여보겠습니다.\n'통증, 통증',\n'콕콕 쑤심, ‘콕콕 쑤심’ '뜨거움, 뜨거움',\n'가려움, 가려움', 따가움,\n따가움' 어떤 이름이라도 좋습니다. 최대한 집중해서 느껴보십시오.\n\n어떤 느낌이 드나요?\n편안한 마음으로 느낌이 변하는 것을 지켜봅니다.\n느낌이 사라지면 다시 호흡으로 돌아옵니다.\n다시 강한 느낌이 들면 그 느낌에 집중하다가 느낌이 사라지면 호흡으로 돌아오면 됩니다.\n이것이 그 순간의 명상입니다.\n\n길면 긴 대로,\n짧으면 짧은 대로,\n얕으면 얕은 대로,\n깊으면 깊은 대로 자연스럽게 숨을 쉬면서 관찰합니다.\n호흡의 시작과 중간,\n그리고 끝을 느껴봅니다.\n마음이 이리저리 방황할 때마다 호흡으로 돌아옵니다.\n\n뜨겁거나 가렵거나 고통스러운 어떤 강렬한 느낌이 들면 그 느낌을 느껴봅니다.\n거부하거나 싫어하지 말고,\n호흡에 집중하듯 그렇게 모든 느낌을 지켜보면서 이름을 붙입니다.\n\n마음이 이리저리 떠돌더라도 곧바로 알아차리고 호흡으로 돌아옵니다.\n지금 이 순간의 호흡에 집중합니다.\n\n5분 더 하겠습니다.\n지금 이 순간에 머물러 봅니다.\n\n(명상발우 땡~)\n\n깨어날 준비가 된 분들은 천천히 눈을 뜨고 몸을 가볍게 움직여줍니다.\n가볍게 고개를 움직이고 팔과 다리를 움직여줍니다.\n\n이상으로 몸 반응 바라보기 명상을 마치겠습니다.\n\n감사합니다.","duration":"10분","tags":"늘봄8회기,2회기","series":"늘봄명상"},{"id":"ff0c9001","category":"관찰","title":"마음 현상 바라보기","body":"마음을 바라본다에는 두 가지의 객체가 존재합니다.\n‘바라보는 자’,\n‘보이는 것’.\n\n일단,\n‘바라보는 자’를 ‘나’라고 하고,\n‘보이는 것’을 ‘마음’이라고 봅시다.\n바라보는 자도 ‘나’고,\n보이는 것은 ‘나의 마음’입니다.\n‘나의 마음’도 곧 ‘나’입니다.\n\n여기에서 문제가 생깁니다.\n내가 나를 바라보는 것이 가능한가?\n하는 것입니다.\n불교에서 사람은 오온(五蘊)의 집합체라고 합니다.\n좀 간략하게 설명하면 육체와 정신으로 나눌 수 있습니다.\n육체의 존재는 감각을 통해 알아차리게 되고 정신의 존재는 생각과 감정을 통해 알아차리게 됩니다.\n감각과 감정과 생각이 서로 얽히고 섥혀 여러 가지 마음을 만들어 냅니다.\n그 마음은 또다시 감정과 생각과 감각에 영향을 줍니다.\n이렇게 일어난 마음들이 우리들의 잠재의식이라는 내면에 혼재해 있습니다.\n그래서 그 감각과 감정과 생각중에 하나에 언제나 ‘나’라는 존재가 붙어 있습니다.\n그 ‘나’라는 존재를 감각,\n감정,\n생각과는 별개로 떨어뜨려야 마음을 볼 수 있습니다.\n\n이번 <마음 바라보기> 에서는 여러 가지로 불리는 마음 중에 감각,\n감정,\n생각의 일어남과 사라짐을 볼까 합니다.\n먼저 이번에는 호흡도 버리고 자세도 버립니다.\n편안한 자세로 자연호흡을 하시면 됩니다.\n일부러 숨을 크게 쉴 필요는 없습니다.\n마음 속에 밝은 빛을 형상화하십시오.\n그리고 마음 속에 있는 신성함을 빛에 투영하십시오.\n신성함이 어렵다면 그냥 빛을 이미지화하시면 됩니다.\n이제 여러분들의 가장 신성한 대상에 집중을 할 겁니다.\n계속 이미지를 형상화 하셔도 좋고 이름을 되뇌이셔도 좋습니다.\n지금부터 5분 동안 실시하겠습니다.\n(5분)\n\n어떠셨나요?\n집중이 잘 되던가요?\n집중하는 중간에 여러 가지 잡념이 떠오르지는 않았나요?\n그렇다면 정상입니다.\n그렇게 떠오르는 잡념을 보통 번뇌라고 합니다.\n여러 가지 마음중에 오늘 여러분들은 끊임없이 일어나는 번뇌를 경험하셨습니다.\n우리가 보통 마음이라고 하는 것은 어디에선가 끊임없이 일어나서 끊임없이 사라져갑니다.\n그렇게 강물처럼 흘러가는 마음에서 여러분 자신은 어디에 있나요?\n이 질문에 대한 답은 스스로 찾으시길 바랍니다.\n감사합니다.","duration":"10분","tags":"늘봄8회기,2회기","series":"늘봄명상"},{"id":"0d669dd2","category":"관찰","title":"온몸관찰","body":"(2명이서) 한사람은 편안하게 눕고,\n다른 사람은 머리쪽에 앉는다.\n정수리-이마-코-양볼-귀-턱-목-양어깨-오른팔뚝-손목-손바닥 왼어깨.......\n오른쪽 발바닥-왼쪽발바닥 뒤집기- ① 눈을 살며시 감습니다.\n② 몸을 관찰해 봅니다.\n긴장하지 마시고 편안하게 주의를 기울입니다.\n③ 왼쪽 발가락...,\n발목..., 종아리...,\n무릎..., 허벅지...,\n가만가만 살펴봅니다.\n④ 오른쪽 발가락...,\n발목..., 종아리...,\n무릎..., 허벅지...,\n살펴봅니다.\n⑤ 골반...허리-복부-등-가슴-목-오른쪽어깨-팔-손 살펴봅니다.\n⑥ 골반...허리-복부-등-가슴-목-왼쪽어깨-팔-손 살펴봅니다.\n⑦ 턱-입-코끝-볼-눈-이마-얼굴 전체를 살펴봅니다.\n⑧ 마지막으로 몸 전체를 살핍니다.\n⑨ 숨이 몸에 들어갔다 나오는 것을 살핍니다.\n⑩ ‘좋다/나쁘다’ 판단하지 않고 부드럽고 가볍게 살펴봅니다.\n주의가 흐트러지면 ‘잘했다/못했다’ 자책하지 않습니다.\n느낌이 있으면 있는 대로,\n느낌이 없으면 없는 대로,\n느낌을 억지로 만들어 내거나 애쓰지 않습니다.\n계속 몸을 충분히 세세하게 살펴봅니다.\n(...15분 후) ⑪ (명상발우을 치면서) 천천히 손 발을 가볍게 움직여 봅니다.\n서서히 눈을 뜹니다.\n그리고 천천히 일어나십시오.\n⑫ 온몸관찰은 몸의 감각을 깨워 신체 인지력을 높여주고 불안과 스트레스를 줄여 정서적 안정감과 집중력을 높이게 함을 일깨워줘 힘든 일상에 쉽게 적용할 수 있습니다.\n잠자리에 들기전 해보시는 것도 아주 좋습니다.","duration":"10분","tags":"늘봄8회기,2회기","series":"늘봄명상"},{"id":"12a786a1","category":"탈중심화","title":"빛명상","body":"지금부터 빛 명상을 시작하겠습니다.\n각자의 자리에서 편안하게 누워 눈을 감아주십시오.\n손바닥은 하늘을 향하게 하고,\n태양이 있다고 상상해주십시오.\n태양빛이 나의 손바닥을 비추고 있습니다.\n\n깊게 숨을 들이마시고 길게 내쉽니다.\n숨을 마시면서 코 안쪽부터 하복부에 이르기까지 몸속의 모든 구멍을 채우고 폐가 가득 찼다는 생각이 드는 순간 조금 더 숨을 들이쉬었다가 천천히 모든 공기가 배출될 때까지 길게 숨을 내쉽니다.\n천천히 호흡을하며 태양의 환한 빛을 느껴봅니다.\n고요하게 몸속의 미세한 움직임들도 느껴봅니다.\n\n대기 중의 태양 빛이 혈액 또는 몸 내부를 가득 채워 생기 넘치게 만들고 있다는 생각하며 집중합니다.\n하나부터 열까지 세면서 반복합니다.\n들이쉬고 내쉬면서 하나,\n들이쉬고 내쉬면서 둘,\n들이쉬고 내쉬면서 셋,\n들이쉬고 내쉬면서 넷,\n이렇게 열까지 셉니다.\n\n환한 태양빛이 나의 단전을 따뜻하게 비추고 있습니다.\n나의 단전이 아주 따뜻하고 편안합니다.\n\n그 빛이 서서히 명치로 움직입니다.\n빛이 나의 명치를 어루만져 줍니다.\n명치가 따뜻해집니다.\n뭉쳐있던 명치가 아주 편안해집니다.\n명치가 편안해졌습니다.\n\n그 빛이 서서히 심장으로 갑니다.\n빛이 쉬지않고 움직이는 나의 심장을 수고한다 위로하며 어루만져 줍니다.\n심장이 따뜻해집니다.\n나의 심장이 아주 편안해합니다.\n\n빛이 서서히 나의 얼굴로 움직입니다.\n그 빛이 찌푸려진 미간을 어루만져 펴줍니다.\n나의 미간이 따뜻해집니다.\n찌푸려졌던 미간이 펴지며 아주 편안합니다.\n\n빛이 서서히 정수리로 향합니다.\n빛이 나의 정수리를 어루만지며 비춥니다.\n정수리가 따뜻해집니다.\n무거웠던 나의 정수리가 가벼워지며 아주 편안해집니다.\n\n나를 어루만져줬던 그 빛이 서서히 나의 온 몸을 비춥니다.\n내 몸이 따뜻해집니다.\n나의 온 몸이 편안합니다.\n나의 몸과 마음이 편안합니다.\n가만히 그 편안함을 지켜봅니다.\n\n천천히 눈을 떠 봅니다.\n
