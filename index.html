<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>명상 스크립트 · 책</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--paper:#fffdf8;--ink:#2b2622;--soft:#6f665c;--line:#e4dccb;--accent:#8a7a5c;--accent2:#b7a887;--bodyfs:18.5px;--hh:120px}
body.dark{--bg:#17140f;--paper:#211d17;--ink:#e9e0d0;--soft:#a2978a;--line:#332e26;--accent:#cbb488;--accent2:#8a7a5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Serif KR',serif;line-height:1.9;font-size:18px;transition:background .2s,color .2s}
a{color:inherit;text-decoration:none}
#topbar{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.tb-top{display:flex;align-items:center;gap:12px;padding:12px 22px 8px}
.tb-brand{font-size:19px;font-weight:700;letter-spacing:.02em;white-space:nowrap;cursor:pointer}
.tb-brand:hover{color:var(--accent)}
.tb-sub{font-size:11.5px;color:var(--soft);white-space:nowrap}
.tb-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#search{width:210px;padding:9px 13px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;background:var(--bg);color:var(--ink)}
.cbtn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 11px;font-family:inherit;font-size:13px;cursor:pointer;transition:.12s;white-space:nowrap}
.cbtn:hover{border-color:var(--accent2)}
.addbtn{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
body.dark .addbtn{color:#17140f}
#catmenu{display:flex;gap:7px;padding:2px 22px 12px;overflow-x:auto;scrollbar-width:none}
#catmenu::-webkit-scrollbar{display:none}
.mi{white-space:nowrap;border:1px solid var(--line);background:var(--paper);color:var(--soft);border-radius:999px;padding:7px 15px;font-family:inherit;font-size:13.5px;cursor:pointer;transition:.12s}
.mi:hover{border-color:var(--accent2);color:var(--ink)}
.mi.on{background:var(--accent);color:#fff;border-color:var(--accent)}
body.dark .mi.on{color:#17140f}
.mi.fav.on{background:#e0a93b;border-color:#e0a93b;color:#fff}
.msep{flex:0 0 1px;width:1px;background:var(--line);margin:5px 3px}
#app{display:flex;align-items:flex-start}
#drawer{display:flex;position:sticky;top:var(--hh);height:calc(100vh - var(--hh))}
#seriescol{width:134px;flex:0 0 134px;background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column;padding:10px 0}
.scol-h{padding:6px 16px 8px;font-size:11px;letter-spacing:.12em;color:var(--soft)}
.si{display:block;width:100%;text-align:left;border:none;background:none;color:var(--ink);font-family:inherit;font-size:14px;padding:11px 15px;cursor:pointer;border-left:3px solid transparent;transition:.12s;white-space:nowrap}
.si:hover{background:rgba(138,122,92,.10)}
.si.on{color:var(--accent);font-weight:600;border-left-color:var(--accent);background:rgba(138,122,92,.14)}
#toc{width:290px;flex:0 0 290px;background:var(--paper);border-right:1px solid var(--line);overflow-y:auto}
.listhead{padding:16px 18px 6px;font-size:15px;font-weight:600;color:var(--accent)}
.listhead .c{font-size:12px;color:var(--soft);font-weight:400;margin-left:6px}
.grouplabel{padding:14px 18px 5px;font-size:12.5px;font-weight:600;color:var(--accent);border-top:1px solid var(--line);position:sticky;top:0;background:var(--paper)}
.items a{display:block;padding:8px 18px 8px 22px;font-size:14.5px;color:var(--ink);border-top:1px solid var(--line);transition:background .12s}
.items a:hover{background:rgba(138,122,92,.10)}
.items a.active{background:rgba(138,122,92,.20);color:var(--accent);font-weight:600}
.items a .meta{display:block;font-size:11.5px;color:var(--soft);margin-top:1px}
.items a .fav{color:#e0a93b;margin-right:4px;font-size:12px}
.empty{padding:34px 22px;color:var(--soft);font-size:14px;line-height:1.8;text-align:center}
#reader{flex:1;display:flex;flex-direction:column;align-items:center;padding:56px 24px 120px;min-height:calc(100vh - var(--hh))}
.page{max-width:640px;width:100%}
.crumbs{font-size:13px;color:var(--soft);letter-spacing:.06em;margin-bottom:14px}
.page h2{font-size:30px;line-height:1.4;margin:0 0 10px;letter-spacing:.01em;display:flex;align-items:flex-start;gap:6px}
.star{border:none;background:none;color:var(--soft);font-size:24px;line-height:1;cursor:pointer;padding:2px 4px;margin-top:2px}
.star.on{color:#e0a93b}
.actbar{display:flex;gap:8px;margin-bottom:26px}
.abtn{border:1px solid var(--line);background:var(--paper);color:var(--soft);border-radius:8px;padding:6px 12px;font-family:inherit;font-size:12.5px;cursor:pointer;transition:.12s}
.abtn:hover{border-color:var(--accent2);color:var(--ink)}
.abtn.del:hover{border-color:#c0665a;color:#c0665a}
.tagline{font-size:13px;color:var(--soft);margin-bottom:34px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{background:rgba(138,122,92,.14);border-radius:999px;padding:3px 11px;font-size:12px;color:var(--accent)}
.body{white-space:pre-wrap;word-break:keep-all;font-size:var(--bodyfs);line-height:2.05;color:var(--ink)}
hr.rule{border:none;border-top:1px solid var(--line);margin:40px 0}
details.notes{margin-top:38px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0 18px}
details.notes summary{cursor:pointer;padding:15px 0;color:var(--accent);font-size:14px;font-weight:600;list-style:none}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary:before{content:'▸ ';}
details.notes[open] summary:before{content:'▾ ';}
.notebody{font-size:15px;color:var(--soft);line-height:1.85;padding:16px 0 18px;border-top:1px solid var(--line);margin-top:0}
.nav{display:flex;justify-content:space-between;margin-top:52px;gap:12px}
.nav a{flex:1;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:13px;color:var(--soft);transition:.15s}
.nav a:hover{border-color:var(--accent2);color:var(--ink)}
.nav a.next{text-align:right}
.nav a .t{display:block;font-size:15px;color:var(--ink);margin-top:3px}
.cover{max-width:640px;text-align:center;padding-top:5vh}
.cover .k{font-size:15px;letter-spacing:.35em;color:var(--accent);margin-bottom:24px}
.cover h1{font-size:46px;margin:0 0 18px;letter-spacing:.02em}
.cover p{color:var(--soft);font-size:16px}
.cover .stat{margin-top:40px;display:inline-flex;gap:30px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--soft)}
.cover .stat b{display:block;font-size:26px;color:var(--accent);font-weight:700}
#menubtn{display:none}#backdrop{display:none}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
.modal.on{display:flex}
.modalbox{background:var(--paper);color:var(--ink);width:100%;max-width:620px;border-radius:16px;padding:26px 26px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modalbox h3{margin:0 0 18px;font-size:20px;color:var(--accent)}
.modalbox label{display:block;font-size:12.5px;color:var(--soft);margin:0 0 14px}
.modalbox input,.modalbox select,.modalbox textarea{width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:15px;background:var(--bg);color:var(--ink)}
.modalbox textarea{line-height:1.9;resize:vertical;white-space:pre-wrap}
.row2{display:flex;gap:12px}.row2>label{flex:1}
.mbtns{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.cbtn.save{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
body.dark .cbtn.save{color:#17140f}
.cbtn[disabled]{opacity:.5;cursor:default}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#2b2622;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:880px){
 .tb-sub{display:none}
 #search{width:150px}
 #drawer{position:fixed;left:0;top:0;height:100vh;width:300px;flex-direction:column;transform:translateX(-100%);transition:transform .25s;z-index:40;box-shadow:0 0 40px rgba(0,0,0,.15)}
 body.nav-open #drawer{transform:translateX(0)}
 body.nav-open #backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
 #seriescol{width:100%;flex:0 0 auto;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px 8px}
 .scol-h{display:none}
 .si{width:auto;border-left:none;border:1px solid var(--line);border-radius:999px;margin-right:6px;padding:7px 14px}
 .si.on{border-color:var(--accent);background:var(--accent);color:#fff}
 body.dark .si.on{color:#17140f}
 #toc{width:100%;flex:1}
 #menubtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:9px;background:var(--paper);border:1px solid var(--line);font-size:18px;color:var(--accent);cursor:pointer;flex:0 0 auto}
 #reader{padding:40px 18px 100px}.page h2{font-size:25px}.cover h1{font-size:34px}
}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
</style>
</head>
<body>
<div id="backdrop"></div>
<header id="topbar">
 <div class="tb-top">
  <div id="menubtn">☰</div>
  <div class="tb-brand" id="brand" title="홈으로">명상 스크립트</div>
  <span class="tb-sub" id="synced">동기화 확인 중…</span>
  <div class="tb-tools">
   <input id="search" placeholder="제목·본문 검색">
   <button id="addbtn" class="cbtn addbtn">➕ 새 스크립트</button>
   <button id="darkbtn" class="cbtn" title="다크모드">🌙</button>
   <button id="fsminus" class="cbtn">가－</button><button id="fsplus" class="cbtn">가＋</button>
  </div>
 </div>
 <nav id="catmenu"></nav>
</header>
<div id="app">
 <div id="drawer">
  <nav id="seriescol"></nav>
  <aside id="toc"><div id="toclist"></div></aside>
 </div>
 <main id="reader"></main>
</div>
<div id="modal" class="modal"><div class="modalbox">
<h3 id="mtitle">스크립트</h3>
<div class="row2"><label>카테고리<select id="f_cat"></select></label><label>시리즈<select id="f_ser"></select></label></div>
<label>제목<input id="f_title" placeholder="제목"></label>
<div class="row2"><label>시간<input id="f_dur" placeholder="예: 약 8분"></label><label>태그<input id="f_tags" placeholder="예: #가치명상 #삶의방향"></label></div>
<label>본문<textarea id="f_body" rows="15" placeholder="본문을 입력하세요. 줄바꿈은 그대로 보존됩니다."></textarea></label>
<div class="mbtns"><button id="mcancel" class="cbtn">취소</button><button id="msave" class="cbtn save">저장</button></div>
</div></div>
<div id="toast"></div>
<script>

var DATA = [{"id":"3a403c0f","category":"자비희사","title":"나는꽃","body":"(영상이 끝나고,\n여운이 남아 있을 때 조용히 시작)\n\n편안히 앉아,\n천천히 눈을 감습니다.\n\n숨을 길게 들이쉬고…… 천천히 내쉽니다.\n어깨의 힘이 함께 빠져나갑니다.\n\n한 번 더.\n들이쉬고…… 내쉬고.\n\n(5초)\n\n방금 본 그 민들레를,\n가만히 떠올려 봅니다.\n\n누가 심어 주지 않았습니다.\n누가 돌봐 주지도 않았습니다.\n바람에 실려 온 씨앗 하나가 스스로 그 자리에 뿌리를 내렸습니다.\n\n(5초)\n\n그리고 지금,\n당신도 여기까지 왔습니다.\n\n떠올려 봅니다.\n\n아무도 몰랐던 어느 밤,\n혼자 삼켰던 말 한마디.\n\n울고 싶었지만 아무렇지 않은 얼굴로 다시 문을 열고 나서던 아침.\n\n버티는 것 말고는 방법이 없던 계절들.\n\n(7초)\n\n그때마다 당신은 쓰러진 자리에서 다시 몸을 일으켰습니다.\n\n아무도 모르게.\n누가 알아주지 않아도.\n\n민들레가 그랬던 것처럼.\n\n(5초)\n\n민들레는 옆의 꽃과 자신을 비교하지 않습니다.\n더 크게 피려고 애쓰지도 않습니다.\n\n그저 자기 빛깔로,\n지금 피울 수 있는 만큼 피어 있을 뿐입니다.\n\n그런데도,\n충분히 아름답습니다.\n\n(5초)\n\n이제 가슴에 손을 얹고,\n마음속으로 가만히 말해 봅니다.\n\n'수없이 흔들리면서도, 여기까지 왔구나.'\n\n(5초)\n\n'완벽하지 않아도, 지금 이 모습 그대로 나는 이미 충분하구나.'\n\n(5초)\n\n'내 삶의 주인공은, 바로 나야.'\n\n(7초)\n\n울컥하는 마음이 올라와도 괜찮습니다.\n그토록 애써 온 나에게 처음 건네는 말일지도 모르니까요.\n\n(5초)\n\n민들레 홀씨가 바람에 닿는 자리마다 꽃을 피우듯,\n\n당신도 어디에 있든 당신만의 빛깔로 피어납니다.\n\n아니, 이미 피어나 있습니다.\n\n(5초)\n\n눈은 그대로 감은 채,\n노래 한 곡을 들어 봅니다.\n\n지금 이 순간,\n당신에게 건네는 노래입니다.\n\n♪ 「나는 꽃이야」\n\n(노래가 끝나고, 잠시 침묵)\n\n천천히 손끝과 발끝을 움직여 봅니다.\n길게 숨을 들이쉬었다가…… 편안하게 내쉽니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n───\n진행 메모\n\n- 영상 → 스크립트 연결: \"방금 본 그 민들레를\"이 두 . 영상이 끝나고 3~5초 침묵 후 시작하세요.\n- 가장 중요한 구간: \"아무도 몰랐던 어느 밤 / 혼자 삼켰던 말 한마디\" 부분입니다. 여기서 각자 자기 삶이 떠오릅니다. 평소보다 반 박자\n느리게, 목소리를 낮춰 읽고 뒤에 충분히 쉬어 주세요 니다.\n- 눈을 감은 채 노래로 넘어가는 구성이 핵심입니다. 눈을 뜨고 듣게 하면 감정이 끊깁니다.\n- 호칭: '당신' 대신 '우리'나 무주어로 바꿔도 됩니 면 '우리'가, 소수 대상이면 '당신'이 더 깊게닿습니다.\n- 노래 제목은 보내주신 링크 기준으로 「나는 꽃이야 레」로 진행하실 거면 그 부분만 바꾸시면 됩니다.\n\n더 짧게(2분 내외) 줄이거나, 낭독 타임코드를 정확히\n───\n나는 꽃\n\n편안한 자세로 앉습니다.\n허리는 부드럽게 세우고 ,\n두 손은 무릎 위에 가만히 올려놓습니다.\n\n준비가 되었다면,\n천천히 눈을 감아 봅니다.\n\n어깨에 힘이 남아 있어도 괜찮습니다.\n마음이 아직 분주해도 괜찮습니다.\n오늘도 그렇게,\n애쓰며 여기까지 왔으니까요.\n\n잠시,\n지나온 날들을 가만히 떠올려 봅니다.\n\n우리는 살아가면서,\n문득문득 스스로가\n부족하게 느껴지는 순간들을 만납니다.\n세상이 나에게만\n유독 가혹하게 느껴지는 날도 있습니다.\n\n그래서 더 애를 씁니다.\n좋은 부모가 되려고,\n믿음직한 사람이 되려고,\n누군가에게 따뜻한 사람이 되려고.\n그런 모습이 되어야\n내가 가치 있는 사람일 거라 믿으며,\n더 열심히,\n더 완벽하게 살아가려 합니다.\n\n그런데 완벽이라는 것은,\n참 이상합니다.\n한 파도를 힘겹게 넘고 나면,\n저 앞에서\n또 다른 파도가 밀려옵니다.\n다가갔다 싶으면\n또 저만치 멀어지는,\n사막의 신기루 같습니다.\n\n그렇게 파도를 넘는 동안,\n정작 나 자신을 돌아볼\n겨를이 없었습니다.\n\n그러니 오늘만큼은,\n그 모든 역할과 기대를\n잠시 내려놓아 봅니다.\n좋은 부모도,\n믿음직한 사람도 아닌,\n그저 나로,\n여기 앉아 봅니다.\n\n숨을 천천히 내쉬면서,\n어깨에 얹혀 있던 무게가\n스르르 흘러내리는 것을 느껴 보세요.\n\n한 번 더, 길게 내쉬어 보세요.\n이마와 미간이 부드럽게 풀립니다.\n\n숨은 일부러 애쓰지 않아도,\n저 혼자 들어오고 나갑니다.\n그 흐름을\n그저 지켜보기만 합니다.\n생각이 떠올라도 괜찮습니다.\n알아차렸다면,\n다시 숨으로 돌아오면 됩니다.\n\n이제 마음속으로,\n따뜻한 봄날의 들판 하나를 떠올려 보세요.\n\n연둣빛 풀이 낮게 깔린 들판입니다.\n햇살이 어깨 위에 이불처럼 내려앉아,\n등이 은은하게 따뜻해집니다.\n바람이 지나갈 때마다\n풀잎이 사락사락 흔들리고,\n코끝에는 풋풋한 풀 냄새가 스칩니다.\n\n그 들판에 천천히 앉아 보세요.\n손바닥 아래로\n보드라운 풀의 감촉이 느껴집니다.\n여기는 아무도\n나를 재촉하지 않는 곳입니다.\n여기서는 아무것도\n되지 않아도 됩니다.\n\n문득, 발 앞에\n작은 꽃 한 송이가 눈에 들어옵니다.\n노란 민들레입니다.\n\n누가 심어 주지 않았습니다.\n누가 돌봐 주지도 않았습니다.\n바람에 실려 온 씨앗 하나가,\n스스로 이 자리에\n뿌리를 내렸습니다.\n\n가까이 들여다보세요.\n작은 꽃잎들이 햇살을 향해\n한 장 한 장 펼쳐져 있습니다.\n\n이 꽃이 피기까지,\n순한 날만 있지는 않았을 것입니다.\n갓 돋은 여린 싹이던 시절,\n비바람에 수없이 흔들리고\n땅에 눕기도 했을 것입니다.\n그러나 그때마다,\n아무도 모르게 다시 몸을 일으켜,\n자기만의 속도로\n여기까지 자라 왔습니다.\n\n걸음마를 배우는 아기가\n수없이 넘어지고도\n다시 일어나 한 걸음을 떼듯이.\n\n그리고 보세요.\n이 꽃은 옆의 꽃과\n자신을 비교하지 않습니다.\n더 크게 피어나려고\n애쓰지도 않습니다.\n세상에 똑같은 꽃잎이 없듯,\n저마다 자기만의 빛깔과 향기로,\n지금 피울 수 있는 만큼\n피어 있을 뿐입니다.\n그런데도, 충분히 예쁩니다.\n\n그 꽃을 바라보는 동안,\n가슴 한가운데가\n조금씩 따뜻해지는 것을 느껴 보세요.\n햇살의 온기가 스며들 듯,\n잔잔한 온기가 은은하게 번져 갑니다.\n\n그 온기 속에서,\n마음속으로 가만히 말해 보세요.\n\n'나도, 이 꽃처럼 피어 있구나.'\n\n'수없이 흔들리면서도,\n여기까지 왔구나.'\n\n'완벽하지 않아도,\n지금 이 모습 그대로,\n이미 충분하구나.'\n\n울컥하는 마음이 올라와도 괜찮습니다.\n그토록 애써 온 나에게,\n처음 건네는 말일지도 모르니까요.\n\n이제 마지막으로,\n한마디만 더 건네 봅니다.\n\n'내 삶의 주인공은, 나야.\n그리고 나는,\n이미 충분히 잘하고 있어.'\n\n이 말이 잘 믿기지 않아도 괜찮습니다.\n마음 어딘가에\n씨앗 하나 내려앉은 것만으로,\n오늘은 충분합니다.\n\n숨을 들이쉴 때마다\n온기가 조금 더 차오르고,\n내쉴 때마다\n몸이 조금 더 편안해집니다.\n\n작은 민들레 씨앗 하나가\n바람에 실려 가 닿은 자리마다\n꽃을 피우듯,\n나 또한 세상 어디에 있든,\n나만의 빛깔로\n피어날 수 있습니다.\n아니, 이미\n피어나고 있습니다.","duration":"","tags":"","series":"숨비명상"},{"id":"2601af78","category":"관찰","title":"자화상","body":"편안한 자세로 앉습니다.\n\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 올려놓습니다.\n\n준비가 되었다면,\n천천히 눈을 감아 감습니다.\n\n편안한 마음으로 숨이 드나드는 것을 느껴 봅니다.\n숨을 내쉴 때마다,\n어깨가 조금씩 가라앉습니다.\n\n이제 마음의 눈으로,\n조금 전의 시간을 천천히 되짚어 봅니다.\n\n펜을 쥔 왼손이 가늘게 떨리던 느낌.\n마음처럼 그어지지 않던 선.\n그리고 그 사이사이,\n자꾸만 올라오던 마음.\n\n고치고 싶다. 바로잡고 싶다.\n이대로 두면 안 될 것 같다.\n\n그 마음을 탓하지 않고,\n가만히 바라봅니다.\n아주 오래된,\n낯익은 마음이니까요.\n\n이제 마음의 눈앞에 내가 그린 자화상을 떠올려 봅니다.\n\n삐뚤빼뚤한 얼굴선.\n짝짝이가 된 두 눈.\n어디론가 흘러간 콧대.\n비뚜름하게 웃고 있는 입.\n\n그런데,\n가만히 보고 있으면 이 그림,\n어딘가 낯익지 않으신가요.\n\n떨리는 선, 짝짝이 눈,\n서툴지만 정직한 얼굴.\n\n우리가 아주 어릴 적에 그리던 그림입니다.\n예닐곱 살 무렵,\n크레파스를 쥐고 그리던 바로 그 그림입니다.\n\n그때 우리는,\n이런 그림을 그려 놓고도 조금도 부끄러워하지 않았습니다.\n오히려 자랑스럽게 들고 달려가,\n봐 달라고 했습니다.\n그 삐뚤빼뚤한 그림이 냉장고에,\n벽에,\n자랑처럼 붙어 있었습니다.\n\n언제부터였을까요.\n우리가 자신의 그림을,\n자신의 모습을,\n부끄러워하게 된 것은.\n\n자라면서 우리는 어디선가 배웠습니다.\n잘해야 칭찬받는다고.\n잘해야 사랑받는다고.\n그날부터 우리는 스스로를 고치기 시작했고,\n서툰 나를 숨기기 시작했습니다.\n\n그림 속의 그 아이가,\n지금 나를 마주 보고 있습니다.\n\n살아온 날들에도,\n왼손 그림 같은 순간들이 있었습니다.\n말이 마음처럼 나오지 않아 어색하게 끝난 자리.\n잘하고 싶었는데 자꾸만 어긋나던 일.\n돌아보면 얼굴이 화끈거리는,\n서툴렀던 나의 장면들.\n\n우리는 그 장면들을 찢어 버리고 싶어 했습니다.\n\n오늘은, 다르게 해 봅니다.\n그 서툴렀던 장면 하나를 가만히 떠올려,\n액자에 담아,\n고치지 않은 채,\n마음의 벽에 걸어 봅니다.\n\n괜찮습니다.\n오늘 우리는 배웠으니까요.\n서툰 그림도 벽에 걸릴 수 있다는 것을.\n\n이제,\n오른손으로 왼손을 가만히 감싸 쥐어 보세요.\n\n오늘 처음으로 주인공이 되어 본 손입니다.\n\n이 손은 평생,\n칭찬받는 자리에 서 본 적이 없습니다.\n오른손이 글씨를 쓰는 동안 말없이 종이를 잡아 주었고,\n오른손이 박수를 받는 동안 조용히 곁에서 함께 쳤습니다.\n\n그리고 생각해 보면,\n아픈 밤 이마를 짚던 것도,\n답답한 날 가슴을 쓸어내리던 것도,\n흐르는 눈물을 닦아 주던 것도,\n언제나 이 손이었습니다.\n서툴다고 여겼던 이 손이,\n가장 힘든 순간마다 나를 만져 주고 있었습니다.\n\n그 손의 온기를 느끼며,\n마음속으로 말해 봅니다.\n\n'고마워. 잘하지 못해도, 늘 곁에 있어 줘서.'\n\n그리고 이제,\n그 고마움을 조금 더 넓혀 봅니다.\n\n이 왼손처럼,\n내 안에도 서툰 부분들이 있습니다.\n그런데 가만히 돌아보면,\n그 서툰 부분들이야말로 말없이 나를 도와 왔습니다.\n\n머뭇거리는 소심함은,\n나를 함부로 뛰어들지 않게 지켜 주었습니다.\n지나치게 예민한 마음은,\n남들이 놓치는 누군가의 아픔을 알아채게 해 주었습니다.\n쉽게 차오르는 눈물은,\n내가 여전히 따뜻한 사람이라는 증거가 되어 주었습니다.\n\n잘난 나만 나를 살게 한 것이 아니었습니다.\n서툰 나도,\n평생 이 왼손처럼,\n말없이 나를 받쳐 왔습니다.\n\n그리고,\n한 가지 더 떠올려 봅니다.\n\n지금까지 나를 아껴 준 사람들이 있습니다.\n나를 보고 웃어 준 사람,\n내 곁에 남아 준 사람.\n\n그 사람들은,\n완벽한 나를 사랑한 것이 아니었습니다.\n허둥대던 나,\n말실수하고 얼굴 붉히던 나,\n서툰 채로 웃던,\n그냥 나를 사랑했습니다.\n\n완벽해서 사랑받은 것이 아니라,\n나여서, 사랑받았습니다.\n\n이제 마지막으로,\n그림 속의 그 아이에게 돌아가 봅니다.\n\n크레파스를 쥐고 삐뚤빼뚤한 그림을 그리던,\n그리고 그것을 자랑스러워하던,\n어린 날의 나.\n\n그 아이는 단 한 번도,\n나에게 완벽해지라고 말한 적이 없습니다.\n그 아이가 바란 것은 어쩌면 하나뿐이었는지도 모릅니다.\n내가,\n나를 미워하지 않는 것.\n\n그 아이에게,\n마음속으로 가만히 말해 봅니다.\n\n'미안해. 그동안 너를 많이 다그쳤지.'\n\n'그리고, 고마워. 서툰 걸음으로, 여기까지 나를 데려와 줘서.'\n\n'이제부터는, 너를 덜 혼내고, 더 자주 안아 줄게.'\n\n울컥하는 마음이 올라와도 괜찮습니다.\n흐르는 눈물이 있다면,\n닦지 않고 그대로 두어도 괜찮습니다.\n그 아이는 이 말을,\n아주 오랫동안 기다려 왔을 테니까요.\n\n가슴 한가운데에 잔잔한 온기가 번져 가는 것을 느껴 봅니다.\n숨을 들이쉴 때마다 그 온기가 조금씩 차오르고,\n내쉴 때마다 오래 움켜쥐고 있던 것들이 조금씩 놓여 갑니다.\n이 느낌 속에,\n잠시 머물러 보세요.\n\n이제 그 따뜻함을 가슴에 담은 채,\n천천히 돌아올 준비를 합니다.\n\n감싸 쥐었던 왼손을 가만히 풀어,\n두 손을 무릎 위에 내려놓습니다.\n손가락 끝을 가볍게 움직여 보세요.\n발가락도 천천히 움직여 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서,\n지금 앉아 있는 이 자리의 감각을 느껴 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 보세요.\n\n눈을 뜨면,\n나의 자화상이 아까 두었던 그 자리에서,\n한 군데도 고쳐지지 않은 채 나를 기다리고 있습니다.\n\n이제 처음으로,\n그 그림을 두 손으로 가만히 집어 들어 보세요.\n\n이 그림을 집에 가져가,\n냉장고에 붙여 주세요.\n어릴 적 누군가 우리의 그림을 붙여 주었듯이.\n혹시 그때 아무도 붙여 주지 않았다면,\n그렇다면 더더욱,\n오늘은 내가,\n나의 그림을 붙여 줍니다.\n\n일곱 살의 나와,\n지금의 내가,\n그 냉장고 앞에서 처음으로 함께 웃을 것입니다.","duration":"","tags":"","series":"숨비명상"},{"id":"1610efd2","category":"멈춤","title":"마음쉼터","body":"편안한 자세로 앉아 봅니다.\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 올려놓습니다.\n준비가 되었다면,\n천천히 눈을 감습니다.\n\n어깨에 묵직함이 남아 있어도 괜찮습니다.\n여기서는 아무것도 잘하지 않아도 됩니다.\n지금부터는,\n애쓰지 않아도 되는 시간입니다.\n\n가만히 숨이 드나드는 것을 느껴 봅니다.\n일부러 바꾸지 않아도 됩니다.\n내쉴 때마다,\n어깨가 조금씩 가벼워집니다.\n\n이제 마음속에 따뜻한 방을 하나 떠올립니다.\n창문으로 따뜻한 오후의 햇살이 들어오고,\n조용하고 포근한 방입니다.\n그 방에,\n내가 아끼는 친구가 힘든 얼굴로 앉아 있다고 상상해 봅니다.\n어깨가 조금 처져 있고,\n눈빛에 지친 기색이 어려 있습니다.\n\n그 모습을 보는 순간,\n내 마음이 자동으로 움직입니다.\n천천히 다가가 곁에 앉고,\n친구의 손을 가만히 잡습니다.\n맞잡은 손으로,\n따뜻한 온기가 오갑니다.\n그리고 마음에서 우러나는 대로,\n조용히 속삭여 봅니다.\n\n‘친구야, 많이 힘들었지. 그런 일을 겪으면, 누구라도 아플 거야. 네 마음은, 하나도 이상하지 않아.’\n\n‘괜찮아. 잘 안 풀릴 수도 있지. 그게 네 탓은 아니야. 내가 여기 있을게. 내 곁에서, 잠시 쉬어.’\n\n이 말은 애써 지어낸 말이 아닙니다.\n내 안에는 이미 이렇게 따뜻한 말들이 가득 들어 있습니다.\n\n그런데 문득 이런 생각이 스칩니다.\n내 자신이 힘들었던 날,\n나는 나에게 어떤 말을 건네 왔을까요.\n‘왜 그것밖에 못 했어.’ ‘이 정도 가지고 힘들다고 하면 안 되지.’ ‘더 잘했어야지.’\n\n어쩌면 나는,\n친구에게라면 절대 하지 않을 말들을 나에게는 아무렇지 않게 해 왔는지도 모릅니다.\n친구의 아픔에는 그토록 다정하면서,\n내 아픔 앞에서는 가장 엄한 사람이 되어 있었습니다.\n\n그랬던 나를 탓할 필요는 없습니다.\n그저,\n오늘 처음으로 알아차렸을 뿐입니다.\n그리고 알아차린 지금부터,\n다르게 해 볼 수 있습니다.\n\n이제,\n친구가 앉았던 그 자리에 내가 앉아 봅니다.\n그리고 한 손을,\n가만히 가슴에 갖다 댑니다.\n손바닥의 온기가 가슴으로 스며듭니다.\n\n조금 전 내 마음에 도착했던 그 편지,\n그리고 내가 친구에게 건넸던 그 다정한 말을,\n이번에는 토씨 하나 바꾸지 않고 나에게 그대로 건넵니다.\n\n‘많이 힘들지. 그런 일을 겪으면, 누구라도 아플 거야. 네 마음은, 하나도 이상하지 않아.’\n\n‘괜찮아. 그게 네 탓은 아니야. 내가 여기 있을게. 여기서, 잠시 쉬어.’\n\n한 손으로 반대쪽 팔을 가만히 감싸고,\n아끼는 친구를 다독이듯 천천히 토닥여 봅니다.\n토닥, 토닥.\n\n친구에게 할 때는 쉬웠던 말이,\n나에게 하려니 어색하고 쑥스러울 수 있습니다.\n그래도 괜찮습니다.\n울컥하는 마음이 올라와도 괜찮습니다.\n오랫동안 기다려 온 말이 이제야 도착했을 뿐입니다.\n\n가슴에 얹은 손바닥 아래로,\n잔잔한 온기가 번져 갑니다.\n들이쉴 때마다 그 온기가 가슴 가득 차오르고,\n내쉴 때마다 무거웠던 마음이 조금씩 가벼워집니다.\n\n친구를 위로하던 그 따뜻함은,\n언제나 내 안에 있었습니다.\n이제 그 따뜻함을,\n나에게도 건넬 수 있습니다.\n나는,\n나에게도 좋은 친구가 되어 줄 수 있습니다.\n\n이제 그 따뜻함을 가슴 깊이 담은 채,\n천천히 돌아올 준비를 합니다.\n가슴에 얹었던 손을 무릎 위로 가만히 내려놓습니다.\n손가락 끝을 가볍게 움직여 봅니다.\n발가락도 천천히 움직여 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서,\n지금 앉아 있는 이 자리의 감각을 느껴 봅니다.\n준비가 되면,\n천천히 눈을 뜹니다.\n\n살아가다,\n나를 다그치는 목소리가 들려오면,\n잠시 멈추고 물어봐 주세요.\n‘내 친구가 이 일을 겪었다면, 나는 뭐라고 말해 줬을까.’ 그 말이 바로,\n지금 나에게 필요한 말입니다.\n\n—--------------\n\n편안한 자세로 앉아 봅니다.\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 올려놓습니다.\n\n준비가 되었다면,\n천천히 눈을 감습니다.\n\n오늘 하루의 무게가 아직 어깨에 남아 있어도 괜찮습니다.\n여기서는 아무것도 잘하지 않아도 됩니다.\n지금부터는,\n애쓰지 않아도 되는 시간입니다.\n\n숨이 드나드는 것을 느껴 봅니다.\n일부러 바꾸지 않아도 됩니다.\n숨을 내쉴 때마다,\n어깨가 조금씩 아래로 내려갑니다.\n\n이제 마음속으로,\n따뜻한 공간을 떠올려 봅니다.\n창으로 오후의 햇살이 부드럽게 들어오고,\n아무도 서두르지 않는,\n조용하고 포근한 방입니다.\n\n그 방에,\n내가 아끼는 친구가 힘든 얼굴로 앉아 있다고 상상해 봅니다.\n요즘 마음고생이 많았던,\n그 친구의 얼굴을 떠올려 보세요.\n어깨가 조금 처져 있고,\n눈빛에 지친 기색이 어려 있습니다.\n\n그 모습을 보는 순간,\n내 마음이 먼저 움직입니다.\n천천히 다가가 곁에 앉고,\n친구의 손을 가만히 잡아 봅니다.\n맞잡은 손으로,\n따뜻한 온기가 오갑니다.\n\n그리고 마음에서 우러나는 대로,\n조용히 속삭여 봅니다.\n\n'친구야, 많이 힘들었지. 그런 일을 겪으면, 누구라도 아플 거야. 네 마음은, 하나도 이상하지 않아.'\n\n'괜찮아. 잘 안 풀릴 수도 있지. 그게 네 탓은 아니야. 내가 여기 있을게. 내 곁에서, 잠시만 쉬어.'\n\n이 말들은,\n애써 지어낸 말이 아닙니다.\n아끼는 사람 앞에서 저절로 흘러나오는 말입니다.\n내 안에는 이미 이렇게 따뜻한 말들이 가득 들어 있습니다.\n\n그런데,\n문득 이런 생각이 스칩니다.\n\n내 자신이 힘들었던 날,\n나는 나에게 어떤 말을 건네 왔을까요.\n\n'왜 그것밖에 못 했어.' '이 정도로 힘들다고 하면 안 되지.' '더 잘했어야지.'\n\n어쩌면 나는,\n친구에게라면 절대 하지 않을 말들을 나에게는 아무렇지 않게 해 왔는지도 모릅니다.\n\n친구의 아픔에는 그토록 다정하면서,\n내 아픔 앞에서는 가장 엄한 사람이 되어 있었습니다.\n\n그랬던 나를 탓할 필요는 없습니다.\n그저,\n오늘 처음으로 알아차렸을 뿐입니다.\n그리고 알아차린 지금부터,\n다르게 해 볼 수 있습니다.\n\n이제,\n친구가 앉았던 그 자리에 내가 앉아 봅니다.\n그리고 한 손을,\n가슴 한가운데에 가만히 얹어 보세요.\n손바닥의 온기가 가슴으로 스며듭니다.\n\n조금 전 친구에게 건넸던 그 다정한 말을,\n이번에는 토씨 하나 바꾸지 않고 나에게 그대로 건네 봅니다.\n\n'많이 힘들었지. 그런 일을 겪으면, 누구라도 아플 거야. 네 마음은, 하나도 이상하지 않아.'\n\n'괜찮아. 잘 안 풀릴 수도 있지. 그게 네 탓은 아니야. 내가 여기 있을게. 여기서, 잠시만 쉬어.'\n\n한 손으로 반대쪽 팔을 가만히 감싸고,\n아끼는 친구를 다독이듯 천천히 토닥여 봅니다.\n토닥, 토닥.\n\n친구에게 할 때는 쉬웠던 말이,\n나에게 하려니 어색하고 쑥스러울 수 있습니다.\n그래도 괜찮습니다.\n울컥하는 마음이 올라와도 괜찮습니다.\n오랫동안 기다려 온 말이 이제야 도착했을 뿐입니다.\n\n가슴에 얹은 손바닥 아래로,\n잔잔한 온기가 번져 갑니다.\n숨을 들이쉴 때마다 그 온기가 가슴 가득 차오르고,\n내쉴 때마다 무거웠던 마음이 조금씩 가벼워집니다.\n\n친구를 위로하던 그 따뜻함은,\n언제나 내 안에 있었습니다.\n이제 그 따뜻함을,\n나에게도 건넬 수 있습니다.\n나는,\n나에게도 좋은 친구가 되어 줄 수 있습니다.\n\n이제 그 따뜻함을 가슴 깊이 담은 채,\n천천히 돌아올 준비를 합니다.\n\n가슴에 얹었던 손을 무릎 위로 가만히 내려놓습니다.\n손가락 끝을 가볍게 움직여 봅니다.\n발가락도 천천히 움직여 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서,\n지금 앉아 있는 이 자리의 감각을 느껴 봅니다.\n\n준비가 되면,\n천천히 눈을 뜹니다.\n\n살아가다,\n나를 다그치는 목소리가 들려오면,\n잠시 멈추고 물어봐 주세요.\n'내 친구가 이 일을 겪었다면, 나는 뭐라고 말해 줬을까.' 그 말이 바로,\n지금 나에게 필요한 말입니다.","duration":"","tags":"","series":"숨비명상"},{"id":"b9cd4e4a","category":"용서감사","title":"감사 명상","body":"감사 명상 (수면용)\n\n자세를 바르게 합니다.\n준비가 되었다면,\n천천히 눈을 감아 봅니다.\n\n숨이 드나드는 것을 느껴 봅니다.\n일부러 바꾸지 않아도 됩니다.\n다만 숨을 내쉴 때마다,\n어깨가 조금씩 아래로 내려앉는 것을 느껴 봅니다.\n\n—\n\n우리는 곁에 있는 것들을 당연하게 여기며 살아갑니다.\n가족의 얼굴, 매일 걷는 길,\n아침마다 눈이 떠지는 일까지도.\n\n가까운 것일수록 고맙다는 말은 자꾸만 뒤로 미뤄집니다.\n\n오늘은 그 미뤄 둔 인사를 전하는 시간입니다.\n먼저,\n가장 가까이에서 가장 오래 함께해 온 것.\n바로 내 몸에게 첫 인사를 건네 보겠습니다.\n\n—\n\n먼저 두 눈에 주의를 보냅니다.\n이 눈은 내가 태어나 처음으로 세상의 빛을 만난 창입니다.\n\n사랑하는 사람의 웃는 얼굴,\n해 질 녘 물드는 하늘을 보여 주고,\n울고 싶은 날에는 말없이 눈물을 흘려보내며 마음의 무게를 대신 덜어 주었습니다.\n\n그 눈에게 마음속으로 말해 봅니다.\n'눈아, 고마워. 네 덕분에 이 세상을 볼 수 있었어.'\n\n—\n\n이제 귀로 주의를 옮깁니다.\n\n내 이름을 부르는 목소리,\n좋아하는 노래,\n창밖의 빗소리를 하루도 빠짐없이 안으로 들여보내 주었습니다.\n\n세상과 나를 이어 준 귀에게,\n고마움을 전합니다.\n\n—\n\n이제 코로 주의를 가져갑니다.\n코는 내가 처음 울음을 터뜨린 그 순간부터 단 한 번도 쉬지 않고 숨을 이어 왔습니다.\n내가 잠든 밤에도,\n정신이 팔린 낮에도.\n\n숨을 한 번 천천히 들이쉬며,\n살아 있음을 느끼게 해 주는 코에게 고마움을 전합니다.\n\n—\n\n이제 입으로 주의를 가져옵니다.\n우리는 입을 통해 수많은 인사를 건네고,\n누군가를 웃게 한 농담과 누군가를 일으킨 위로를 세상에 내보냈습니다.\n그리고 매일,\n따뜻한 밥을 먹여 나를 살아 있게 해 주었습니다.\n\n오늘 하루의 말과 밥을 가능하게 해 준 입에게,\n고마움을 전합니다.\n\n—\n\n이제 가슴 한가운데,\n심장으로 주의를 가져갑니다.\n한 손을 가슴 위에 가만히 얹어 보세요.\n손바닥 아래에서 심장이 조용히 뛰고 있습니다.\n\n이 심장은 내가 태어나기 전,\n엄마의 뱃속에서부터 뛰기 시작해 오늘 이 순간까지 단 일 초도 쉬지 않았습니다.\n\n내가 심장을 까맣게 잊고 지낸 수많은 날에도,\n누가 알아주지 않아도,\n묵묵히 나를 위해 뛰어 왔습니다.\n\n그 리듬을 손바닥으로 느끼며,\n가만히 말해 봅니다.\n'심장아, 고마워. 네가 있어서 내가 여기까지 왔어.'\n\n—\n\n이제 팔과 손을 떠올려 봅니다.\n두 손의 무게와 온기를 느껴 보세요.\n\n아기였을 때 나를 안아 준 사람의 손가락을 고사리처럼 꼭 쥐던 그 작은 손이 자라나,\n이제는 지친 누군가의 등을 두드려 주고,\n사랑하는 사람을 끌어안아 온기를 전하는 손이 되었습니다.\n\n오늘 하루 나의 손이 닿았던 모든 순간에 고마움을 전합니다.\n\n—\n\n이제 다리와 발로 주의를 옮깁니다.\n두 발의 감각을 가만히 느껴 보세요.\n\n수없이 넘어지며 첫걸음마를 배운 그날부터,\n보고 싶은 사람에게 달려가던 길까지 그 모든 길을 나와 함께 걸었고,\n아무리 지친 날에도 어김없이 나를 집으로 데려다주었습니다.\n\n땅과 나를 이어 주는 다리와 발에게 고마움을 전합니다.\n\n—\n\n이제 몸 전체를 따뜻한 빛으로 감싸듯 느껴 봅니다.\n상처가 나면 말없이 아물게 하고,\n내가 모르는 사이에도 나를 돌보아 온,\n세상에서 가장 오래 나를 보살펴 온 것은 바로 이 몸이었습니다.\n\n머리끝에서 발끝까지,\n깊은 고마움을 전합니다.\n\n—\n\n이제 고마움을 조금씩 넓혀 보겠습니다.\n\n생각만 해도 미소가 지어지는 행복한 순간 하나를 떠올려 봅니다.\n사랑하는 사람의 얼굴일 수도,\n비 오는 날 창밖의 빗소리일 수도 있습니다.\n\n그 장면 속에서 입가가 저절로 부드러워지고,\n가슴에 잔잔한 온기가 번져 가는 것을 느껴 봅니다.\n\n그 온기 속에서 한 사람의 얼굴을 떠올려 봅니다.\n나를 위해 밥을 지어 준 사람,\n힘든 날 말없이 곁을 지켜 준 사람.\n\n그 얼굴을 마음에 품고 가만히 고마움을 전합니다.\n'당신이 있어서 여기까지 올 수 있었습니다. 감사합니다.'\n\n—\n\n이제 조금 더 멀리,\n마음을 넓혀 봅니다.\n\n오늘 아침의 밥 한 그릇에는 땀 흘려 농사지은 이의 수고가,\n지금 이 자리에는 벽돌을 쌓아 올린 이들의 손길이 담겨 있습니다.\n\n나는 혼자 살아온 것이 아닙니다.\n셀 수 없이 많은 고마움에 둘러싸여 여기까지 왔습니다.\n\n그 모든 존재들을 향해 마음속으로 인사를 전합니다.\n'당신들 덕분입니다. 감사합니다.'\n\n—\n\n그리고 마지막으로,\n오늘 처음 인사를 건넨 나의 몸과 마음에게 다시 한 번 전해 봅니다.\n'고맙습니다. 사랑합니다.'\n\n이제 그 고마움을 가만히 내려놓아도 좋습니다.\n\n애써 무언가를 느끼려 하지 않아도 됩니다.\n떠올렸던 얼굴도,\n전하고 싶던 말도,\n이제 천천히 흩어지도록 그냥 두세요.\n\n숨은 점점 느려지고,\n몸은 조금씩 더 무거워집니다.\n어깨도, 팔도,\n다리도 바닥에 포근히 잠겨 듭니다.\n\n내쉬는 숨마다 오늘 하루가 저 멀리 흘러갑니다.\n\n이제 아무것도 하지 않아도 됩니다.\n\n이 따뜻함 속에서,\n편안히 잠들어도 좋습니다.\n\n그저 숨이 나를 데려가는 곳으로,\n천천히, 가만히……\n\n—--------------------------------------\n\n감사 명상\n\n편안한 자세로 누워 봅니다.\n준비가 되었다면,\n천천히 눈을 감아 봅니다.\n\n숨이 드나드는 것을 느껴 봅니다.\n일부러 바꾸지 않아도 됩니다.\n다만 숨을 내쉴 때마다,\n어깨가 조금씩 아래로 내려앉습니다.\n\n—\n\n우리는 늘 곁에 있는 것들을 당연하게 여기며 살아갑니다.\n가족의 얼굴, 매일 걷는 길,\n아침마다 눈이 떠지는 일까지도.\n\n가까운 것일수록 고맙다는 말은 자꾸만 뒤로 미뤄집니다.\n\n오늘은 그 미뤄 둔 인사를 전하는 시간입니다.\n\n가장 가까이에서,\n가장 오래 나와 함께해 온 것.\n바로 내 몸에게 첫 인사를 건네 보겠습니다.\n\n—\n\n먼저 두 눈을 떠올려 봅니다.\n감은 눈꺼풀 안쪽의 고요한 어둠을 느껴 봅니다.\n\n이 눈은 내가 태어나 처음으로 세상의 빛을 만난 창이었습니다.\n\n그날부터 지금까지 사랑하는 사람의 웃는 얼굴을,\n좋아하는 책의 한 구절을,\n해 질 녘 하늘이 물드는 빛깔을 쉼 없이 보여 주었습니다.\n\n울고 싶은 날에는 말없이 눈물을 흘려보내며 마음의 무게를 대신 덜어 주었습니다.\n\n그 눈에게 마음속으로 말해 봅니다.\n\n'고마워. 네 덕분에 이 세상을 볼 수 있었어.'\n\n이제 귀로 주의를 옮깁니다.\n지금 이 목소리도 귀를 통해 나에게 닿고 있습니다.\n\n이 귀는 내 이름을 부르는 목소리를,\n좋아하는 노래의 첫 소절을,\n창밖의 빗소리와 누군가의 웃음소리를 하루도 빠짐없이 안으로 들여보내 주었습니다.\n\n세상과 나를 이어 준 귀에게,\n고마움을 전합니다.\n\n이제 코끝으로 주의를 가져갑니다.\n공기가 조용히 드나들고 있습니다.\n\n이 코는 내가 첫울음을 터뜨린 그 순간부터 단 한 번도 잊지 않고 숨을 쉬어 주었습니다.\n내가 잠든 밤에도,\n다른 일에 정신이 팔린 낮에도.\n\n봄이면 꽃내음을,\n비 온 뒤에는 흙냄새를,\n겨울 아침에는 차고 맑은 공기를 철마다 실어다 주었습니다.\n\n숨을 한 번 천천히 들이쉬며,\n살아 있음을 느끼게 해 주는 코에게 고마움을 전합니다.\n\n입을 떠올려 봅니다.\n\n이 입이 처음 배운 말은 아마 누군가를 부르는 다정한 이름이었을 것입니다.\n\n그날부터 이 입은 수많은 인사를 건네고,\n누군가를 웃게 한 농담과 누군가를 일으킨 위로를 세상에 내보냈습니다.\n\n그리고 매일매일 따뜻한 밥을 먹여 나를 살게 해 주었습니다.\n\n오늘 하루의 말과 밥을 가능하게 해 준 입에게,\n고마움을 전합니다.\n\n—\n\n이제 가슴 한가운데,\n심장으로 주의를 가져갑니다.\n\n한 손을 가슴 위에 가만히 얹어 보세요.\n\n손바닥 아래에서 심장이 조용히 뛰고 있습니다.\n\n이 심장은 내가 세상에 태어나기도 전,\n어머니의 배 속에서부터 뛰기 시작했습니다.\n\n그날부터 오늘 이 순간까지 단 일 초도 쉬지 않았습니다.\n\n내가 잠든 밤에도,\n내가 저를 까맣게 잊고 지낸 그 수많은 날에도,\n누가 알아주지 않아도,\n묵묵히, 성실하게,\n나를 위해 뛰어 왔습니다.\n\n그 리듬을 손바닥으로 느끼며,\n가만히 말해 봅니다.\n\n'고마워. 네가 있어서 내가 여기까지 왔어.'\n\n울컥하는 마음이 올라와도 괜찮습니다.\n평생을 함께하고도 처음 건네는 인사이니까요.\n\n팔과 손을 떠올려 봅니다.\n두 손의 무게와 온기를 느껴 보세요.\n\n이 손은 아기였을 때,\n나를 안아 준 사람의 손가락을 고사리처럼 꼭 쥐었습니다.\n\n그 작던 손이 자라나 이제는 문을 열고,\n밥을 뜨고,\n지친 누군가의 등을 두드려 주고,\n사랑하는 사람을 끌어안아 온기를 전하는 손이 되었습니다.\n\n오늘 하루 나의 손이 닿았던 모든 순간에 고마움을 전합니다.\n\n다리와 발로 주의를 옮깁니다.\n두 발의 감각을 가만히 느껴 보세요.\n\n이 다리와 발은 수없이 넘어지며 첫걸음마를 배운 그날부터,\n학교 가던 길,\n일하러 가던 길,\n보고 싶은 사람에게 달려가던 길,\n그 모든 길을 나와 함께 걸었습니다.\n\n그리고 아무리 지친 날에도 어김없이 나를 집으로 데려다주었습니다.\n\n땅과 나를 이어 주는 다리와 발에게 고마움을 전합니다.\n\n이제 몸 전체를 따뜻한 빛으로 감싸듯 느껴 봅니다.\n\n이 몸은 상처가 나면 말없이 아물게 하고,\n병이 들면 스스로 나를 회복시키며,\n내가 모르는 사이에도 쉼 없이 나를 돌보아 왔습니다.\n\n세상에서 가장 오래,\n가장 가까이에서 나를 보살펴 온 것은 바로 이 몸이었습니다.\n\n머리끝에서 발끝까지,\n깊은 고마움을 전합니다.\n\n—\n\n이제 그 고마움의 원을 조금씩 넓혀 보겠습니다.\n\n생각만 해도 미소가 지어지는 행복한 순간들을 떠올려 봅니다.\n\n사랑하는 가족과 친구의 얼굴일 수도,\n꼬리 치며 달려오는 반려동물일 수도,\n비 오는 날 창밖의 빗소리일 수도,\n잠들기 전 나누던 정다운 대화일 수도 있습니다.\n\n그중에서 가장 마음이 따뜻해지는 장면 하나를 골라,\n그 안에 가만히 머물러 보세요.\n\n그 장면 속에서 입가가 저절로 부드러워지고,\n가슴에 잔잔한 온기가 번져 가는 것을 느껴 봅니다.\n\n그 온기 속에서 한 사람의 얼굴을 떠올려 봅니다.\n\n나를 위해 밥을 지어 준 사람.\n내 이름을 다정하게 불러 준 사람.\n힘든 날,\n말없이 곁을 지켜 준 사람.\n\n그 사람은 알까요.\n자신의 그 작은 다정함이 나에게 얼마나 큰 힘이 되었는지.\n\n그 얼굴을 마음에 품고 가만히 인사를 전합니다.\n\n'당신이 있어서 여기까지 올 수 있었습니다. 감사합니다.'\n\n이제 조금 더 멀리,\n얼굴도 모르는 사람들에게로 마음을 넓혀 봅니다.\n\n오늘 아침의 밥 한 그릇에는 땀 흘려 농사지은 이의 수고가,\n지금 이 자리에는 벽돌 한 장 한 장 쌓아 올린 이들의 손길이 담겨 있습니다.\n\n나의 하루는 이렇게 보이지 않는 수많은 사람들의 정성 위에 가만히 놓여 있습니다.\n\n나는 혼자 살아온 것이 아니었습니다.\n셀 수 없이 많은 고마움에 둘러싸여 여기까지 왔습니다.\n\n그 모든 존재들을 향해 마음속으로 인사를 전합니다.\n\n'당신들 덕분입니다. 감사합니다.'\n\n—\n\n그리고 마지막으로,\n오늘 처음 인사를 건넨 나의 몸과 마음에게 다시 한 번 전해 봅니다.\n\n'고맙습니다. 사랑합니다.'\n\n가슴 가득 차오른 이 따뜻함을 담은 채,\n천천히 돌아올 준비를 합니다.\n\n가슴에 얹었던 손을 가만히 내려놓습니다.\n손가락 끝을 가볍게 움직여 보세요.\n발가락도 천천히 움직여 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서 지금 이 자리의 감각을 느껴 봅니다.\n\n준비가 되면 천천히 눈을 떠 보세요.\n\n눈을 뜨는 순간 보이는 이 세상은,\n방금 인사를 나눈 이 몸이 오늘도 나에게 건네는 선물입니다.\n\n오늘 하루,\n고마운 마음이 떠오르는 순간이 오면 미루지 말고 그 자리에서 전해 보세요.\n\n고맙다고.\n\n그 한마디가 나의 하루도,\n그 사람의 하루도 선물로 바꾸어 줍니다.\n\n—--------------------------------------\n\n감사명상\n\n편안한 자세로 누워주세요.\n준비가 되었다면,\n천천히 눈을 감아 보세요.\n\n숨이 드나드는 것을 느껴 봅니다.\n일부러 바꾸지 않아도 됩니다.\n숨을 내쉴 때마다,\n어깨가 조금씩 아래로 내려갑니다.\n\n—\n\n우리는 늘 곁에 있는 것들을,\n당연하게 여기며 살아갑니다.\n가족의 얼굴, 매일 걷는 길,\n아침마다 눈이 떠지는 일까지도.\n가까운 것일수록,\n고맙다는 말은 자꾸만 미뤄집니다.\n\n오늘은,\n그 미뤄 둔 인사를 전하는 시간입니다.\n가장 가까이에서,\n가장 오래 나와 함께해 온 것.\n바로 나의 몸에게부터,\n처음으로 인사를 건네 보겠습니다.\n\n먼저,\n두 눈을 떠올려 봅니다.\n감은 눈꺼풀 안쪽의 고요한 어둠을 느껴 보세요.\n\n이 눈은,\n내가 태어나 처음으로 세상의 빛을 만난 창이었습니다.\n그날부터 지금까지,\n사랑하는 사람의 웃는 얼굴을,\n좋아하는 책의 한 구절을,\n해 질 녘 하늘이 물드는 빛깔을 쉼 없이 나에게 보여 주었습니다.\n그리고 울고 싶은 날에는,\n말없이 눈물을 흘려보내며 마음의 무게를 대신 덜어 주었습니다.\n\n그 눈에게,\n마음속으로 말해 봅니다.\n'고마워. 네 덕분에, 이 세상을 볼 수 있었어.'\n\n이제 코로 주의를 옮깁니다.\n지금도 코끝으로 공기가 조용히 드나들고 있습니다.\n\n이 코는 내가 태어나 첫울음을 터뜨린 그 순간부터,\n단 한 번도 잊지 않고 숨을 쉬어 주었습니다.\n잠든 밤에도,\n내가 다른 일에 정신이 팔린 낮에도.\n봄이면 꽃내음을,\n비 온 뒤에는 흙냄새를,\n겨울 아침에는 차고 맑은 공기를 철마다 실어다 주었습니다.\n\n숨을 한 번 천천히 들이쉬며,\n살아 있음을 느끼게 하는 코에게 고마움을 전해 봅니다.\n\n입을 떠올려 봅니다.\n이 입이 처음 배운 말은,\n아마 누군가를 부르는 다정한 이름이었을 것입니다.\n그날부터 이 입은 수많은 인사를 건네고,\n누군가를 웃게 한 농담과 누군가를 일으킨 위로를 세상에 내보냈습니다.\n그리고 매일매일,\n따뜻한 밥을 먹여 나를 살게 해 주었습니다.\n\n오늘 하루의 말과 밥을 가능하게 한 입에게,\n고마움을 전합니다.\n\n이제 가슴 한가운데,\n심장으로 주의를 가져갑니다.\n한 손을 가슴 위에 가만히 얹어 보세요.\n\n손바닥 아래에서,\n심장이 조용히 뛰고 있습니다.\n\n이 심장은,\n내가 세상에 태어나기도 전,\n어머니의 배 속에서부터 뛰기 시작했습니다.\n그날부터 오늘 이 순간까지,\n단 일 초도 쉬지 않았습니다.\n내가 잠든 밤에도,\n내가 저를 까맣게 잊고 지낸 그 수많은 날에도,\n누가 알아주지 않아도,\n묵묵히, 성실하게,\n나를 위해 뛰어 왔습니다.\n\n그 심장의 리듬을 손바닥으로 느끼며,\n가만히 말해 봅니다.\n'고마워. 네가 있어서, 내가 여기까지 왔어.'\n\n울컥하는 마음이 올라와도 괜찮습니다.\n평생을 함께하고도,\n처음 건네는 인사이니까요.\n\n팔과 손을 떠올려 봅니다.\n무릎 위에 놓인 두 손의 무게와 온기를 느껴 보세요.\n\n이 손은 아기였을 때,\n나를 안아 준 사람의 손가락을 고사리처럼 꼭 쥐었습니다.\n그 작던 손이 자라나,\n이제는 문을 열고,\n밥을 뜨고,\n지친 누군가의 등을 두드려 주고,\n사랑하는 사람을 끌어안아 온기를 전하는 손이 되었습니다.\n\n오늘 하루 나의 손이 닿았던 모든 순간에,\n고마움을 전합니다.\n\n다리와 발로 주의를 옮깁니다.\n바닥에 닿아 있는 두 발의 감각을 느껴 보세요.\n\n이 다리와 발은 수없이 넘어지며 첫걸음마를 배운 그날부터,\n학교 가던 길,\n일하러 가던 길,\n보고 싶은 사람에게 달려가던 길,\n그 모든 길을 나와 함께 걸었습니다.\n그리고 아무리 지친 날에도,\n어김없이 나를 집으로 데려다주었습니다.\n\n땅과 나를 이어 주는 다리와 발에게,\n고마움을 전합니다.\n\n이제 몸 전체를 따뜻한 빛으로 감싸듯 느껴 봅니다.\n생각해 보면 이 몸은,\n상처가 나면 말없이 아물게 하고,\n병이 들면 스스로 나를 회복시키며,\n내가 모르는 사이에도 쉼 없이 나를 돌보아 왔습니다.\n세상에서 가장 오래,\n가장 가까이에서 나를 보살펴 온 것은,\n바로 이 몸이었습니다.\n\n머리끝에서 발끝까지,\n깊은 고마움을 전합니다.\n\n이번에는,\n그 고마움의 원을 조금씩 넓혀 보겠습니다.\n\n생각만 해도 미소가 지어지는 행복한 순간들을 떠올려 봅니다.\n사랑하는 가족과 친구의 얼굴일 수도,\n꼬리 치며 달려오는 반려동물일 수도,\n비 오는 날 창밖의 빗소리일 수도,\n잠들기 전 나누던 정다운 대화일 수도 있습니다.\n\n그중에서,\n가장 마음이 따뜻해지는 장면 하나를 골라,\n그 안에 가만히 머물러 보세요.\n\n그 장면 속에서,\n입가가 저절로 부드러워지고,\n가슴에 잔잔한 온기가 번져 가는 것을 느껴 봅니다.\n\n그리고 그 온기 속에서,\n한 사람의 얼굴을 떠올려 봅니다.\n나를 위해 밥을 지어 준 사람.\n내 이름을 다정하게 불러 준 사람.\n힘든 날,\n말없이 곁을 지켜 준 사람.\n\n그 사람은 알까요.\n자신의 그 작은 다정함이,\n나에게 얼마나 큰 힘이 되었는지.\n\n그 얼굴을 마음에 품고,\n가만히 인사를 전합니다.\n'당신이 있어서, 여기까지 올 수 있었습니다. 감사합니다.'\n\n그리고 조금 더 멀리,\n얼굴도 모르는 사람들에게로 마음을 넓혀 봅니다.\n\n오늘 아침의 밥 한 그릇에는 땀 흘려 농사지은 이의 수고가,\n지금 앉아 있는 이 방에는 벽돌 한 장 한 장 쌓아 올린 이들의 손길이 담겨 있습니다.\n나의 하루는,\n이렇게 보이지 않는 수많은 사람들의 정성 위에 가만히 놓여 있습니다.\n\n나는,\n혼자 살아온 것이 아니었습니다.\n셀 수 없이 많은 고마움에 둘러싸여,\n여기까지 왔습니다.\n\n그 모든 존재들을 향해,\n마음속으로 인사를 전합니다.\n\n'감사합니다. 고맙습니다. 사랑합니다.'\n\n그리고 마지막으로,\n오늘 처음 인사를 건넨 나의 몸과 마음에게도,\n다시 한 번 전해 봅니다.\n\n'고맙습니다. 감사합니다. 사랑합니다.'\n\n가슴 가득 차오른 이 따뜻함을 담은 채,\n천천히 돌아올 준비를 합니다.\n\n가슴에 얹었던 손을 무릎 위로 가만히 내려놓습니다.\n손가락 끝을 가볍게 움직여 보세요.\n발가락도 천천히 움직여 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서,\n지금 앉아 있는 이 자리의 감각을 느껴 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 보세요.\n\n눈을 뜨는 순간 보이는 이 세상은,\n방금 인사를 나눈 이 몸이 오늘도 나에게 건네는 선물입니다.\n오늘 하루,\n고마운 마음이 떠오르는 순간이 오면,\n미루지 말고 그 자리에서 전해 보세요.\n고맙다고. 그 한마디가,\n나의 하루도,\n그 사람의 하루도,\n선물로 바꾸어 줍니다.","duration":"","tags":"","series":"숨비명상"},{"id":"d46b7fcf","category":"수용","title":"마음 미술관","body":"편안한 자세로 앉아 보세요.\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 올려놓습니다.\n\n준비가 되었다면,\n천천히 눈을 감아 보세요.\n\n숨을 천천히 들이쉬고,\n길게 내쉽니다. 내쉴 때마다,\n어깨가 조금씩 아래로 내려갑니다.\n\n우리는 누구나 마음속에 몇 개의 장면들을 품고 살아갑니다.\n떠올리면 화가 나는 장면,\n생각만 해도 마음이 무거워지는 사람.\n그 장면들을 가슴에 안고 다니느라,\n그동안 참 무거웠습니다.\n\n오늘은 그 장면들을 지우려는 것이 아닙니다.\n하나씩 꺼내어,\n제자리를 마련해 주려는 것입니다.\n마음속에 미술관을 하나 지어,\n그림으로 걸어 두는 것입니다.\n\n이제 마음속으로,\n조용한 미술관 하나를 떠올려 봅니다..\n\n천장이 높고,\n부드러운 빛이 내려오는 곳입니다.\n긴 벽이 정갈하게 비어 있고,\n나무 바닥은 발소리마저 조용하게 감싸 줍니다.\n서두르는 사람은 아무도 없습니다.\n이 미술관의 주인도,\n오늘의 유일한 관람객도,\n바로 나입니다.\n\n천천히 안으로 걸어 들어가 봅니다.\n\n먼저,\n가장 행복했던 순간 하나를 떠올려 보세요.\n사랑하는 사람과 웃던 날,\n마음이 환해지던 어느 오후.\n그 장면이 한 폭의 그림이 되어,\n액자에 담깁니다.\n\n그 그림을 두 손으로 들어,\n빛이 가장 잘 드는 벽에,\n소중한 보석을 보석상자에 담아 두듯이,\n정성껏 걸어 봅니다.\n이 그림은 이제,\n언제든 꺼내어 볼 수 있는 나의 보물이 됩니다.\n한 걸음 물러나 바라보니,\n그림 속에서 따뜻한 빛이 배어 나옵니다.\n잠시,\n그 앞에 머물러 봅니다.\n\n이 미술관에는 이렇게,\n내 마음의 장면들이 그림이 되어 걸립니다.\n행복한 장면만이 아니라,\n어떤 장면이든 걸 수 있습니다.\n\n이번에는,\n화가 났던 순간들을 떠올려 봅니다.\n혼자 삭이며 화를 눌렀던 순간,\n누군가에게 화를 내고 돌아서서 후회했던 순간,\n화가 가라앉지 않아 잠 못 이루던 밤.\n\n그 장면들이 하나씩,\n그림이 되어 액자에 담깁니다.\n어떤 그림은 붉고 거친 붓질로,\n어떤 그림은 어두운 잿빛으로 그려져 있을 것입니다.\n괜찮습니다. 그렸던 그대로,\n벽에 나란히 걸어 봅니다.\n\n그리고 몇 걸음 물러나,\n편안한 자리에 서서 그 그림들을 바라봅니다.\n그림 속의 일은 그림 속에 있고,\n바라보는 나는 이렇게 그림 밖에 서 있습니다.\n호흡을 고르게 이어가며,\n잠시 말없이 감상해 봅니다.\n\n가슴속에 있을 때는 불쑥불쑥 나를 흔들던 장면들이,\n벽에 걸어 두고 보니 조금 다르게 보입니다.\n그날의 붉은색도,\n이만큼 떨어져서 보면 그림의 한 부분일 뿐입니다.\n\n이번에는,\n살아오면서 불편했던 사람,\n감정적으로 힘들었던 관계를 떠올려 봅니다.\n그 사람의 모습이 한 폭의 그림이 되어 담깁니다.\n\n그 그림을 벽에 걸며,\n조용히 이름을 붙여 봅니다.\n'그냥, 그림.'\n\n그 사람을 용서하라는 것도,\n잊으라는 것도 아닙니다.\n다만 오늘만큼은,\n가슴속이 아니라 저 벽에 걸어 두는 것입니다.\n'그냥 그림'이라고 부르는 순간,\n그림과 나 사이에 복도만큼의 거리가 생깁니다.\n그 거리에서,\n호흡이 한결 편안해집니다.\n\n떠오르는 장면이 더 있다면,\n같은 방식으로 하나씩 그림에 담아 벽에 걸어 봅니다.\n그 사람과의 불편했던 순간도,\n또 다른 갈등의 장면도.\n서두르지 않고, 한 점씩.\n그리고 그때마다 조용히 이름을 붙입니다.\n'그냥, 그림.'\n\n이제 미술관의 긴 벽에는 나의 여러 감정을 담은 그림들이 나란히 걸려 있습니다.\n복도 한가운데 서서,\n그 벽 전체를 천천히 둘러봅니다.\n\n환한 그림 곁에 붉은 그림이,\n잿빛 그림 곁에 따뜻한 그림이 나란히 걸려 있습니다.\n\n가만히 보니,\n그림마다 화풍도 제각각입니다.\n나에게 화를 내며 인상을 쓰던 사람은,\n이름 그대로 인상파 그림일지 모릅니다.\n조목조목 따지고 들던 사람은,\n현실을 훌쩍 벗어난 초현실주의 그림처럼 보입니다.\n도무지 속을 알 수 없던 사람은,\n알쏭달쏭한 추상화 같고,\n느긋하기만 해서 나를 답답하게 하던 사람은,\n구름처럼 유유히 흐르는 낭만파 풍경화처럼 보이기도 합니다.\n\n그렇게 화풍을 하나하나 헤아려 보는 사이,\n입가에 옅은 미소가 번집니다.\n가슴을 짓누르던 그 사람들이,\n어느새 한 발 떨어져 감상할 수 있는 작품이 되어 있습니다.\n\n마음에 드는 그림도 있고,\n마음에 들지 않는 그림도 있습니다.\n그런데 생각해 보면,\n우리는 미술관에서 마음에 들지 않는 그림을 만나도,\n그 그림에게 화를 내지는 않습니다.\n그저 잠시 바라보고,\n고개를 끄덕이고,\n다음 걸음을 옮길 뿐입니다.\n\n내 마음의 그림들도 그렇게 대해 봅니다.\n좋은 그림은 좋은 대로,\n불편한 그림은 불편한 대로,\n그저 벽에 걸린 그림으로 바라봅니다.\n잠시, 말없이.\n\n이 모든 그림들은 내가 살아온 날들의 기록이지만,\n그림이 곧 나는 아닙니다.\n나는 그림 속에 갇힌 사람이 아니라,\n이 복도를 자유롭게 걸어 다니는,\n관람객입니다.\n\n그 사실을 알아차리는 순간,\n가슴이 한 뼘 넓어지는 것을 느껴 보세요.\n\n이제,\n관람을 마치고 미술관을 나설 시간입니다.\n그림들을 떼어 갈 필요는 없습니다.\n그림들은 저 벽에,\n저마다의 자리에 잘 걸려 있을 것입니다.\n\n출구를 향해 천천히 걸어 나옵니다.\n문을 열고 나서니,\n바깥의 환한 햇살이 얼굴에 따뜻하게 쏟아집니다.\n숨을 크게 한 번 들이쉬어 봅니다.\n그림들을 벽에 걸어 두고 나온 어깨가,\n들어갈 때보다 한결 가볍습니다.\n\n그 가벼움을 느끼며,\n마음속으로 가만히 말해 봅니다.\n\n'감정은 걸어 둘 수 있다. 그리고 나는, 지나갈 수 있다.'\n\n이제 천천히 돌아올 준비를 합니다.\n이 미술관은 사라지지 않고,\n언제든 다시 들를 수 있는 자리에 그대로 있습니다.\n\n손가락 끝을 가볍게 움직여 보세요.\n발가락도 천천히 움직여 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서,\n지금 앉아 있는 이 자리의 감각을 느껴 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 보세요.\n\n살아가다,\n어떤 감정이 가슴에서 불쑥 올라오는 순간이 오면,\n마음속으로 조용히 이름을 붙여 보세요.\n'그냥, 그림.' 그 한마디와 함께,\n나는 언제든 미술관의 관람객으로 돌아올 수 있습니다.","duration":"","tags":"","series":"숨비명상"},{"id":"f828fe81","category":"수용","title":"나는화가","body":"편안한 자세로 앉아 보세요.\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 올려놓습니다.\n\n준비가 되었다면,\n천천히 눈을 감습니다.\n\n몸 어딘가에 긴장이 남아 있어도 괜찮습니다.\n생각이 오고 가도 괜찮습니다.\n지금은 무언가를 이루는 시간이 아니라,\n그저 머무는 시간입니다.\n\n숨이 드나드는 것을 느껴 보세요.\n일부러 바꾸지 않아도 됩니다.\n숨을 내쉴 때마다,\n어깨가 조금씩 아래로 내려가고,\n이마와 미간이 부드럽게 풀립니다.\n\n몇 번의 숨이 오가는 동안,\n몸이 의자에, 바닥에,\n조금 더 편안하게 내려앉습니다.\n\n이제 마음속으로,\n햇살이 잘 드는 작은 화실 하나를 떠올려 보세요.\n\n창으로 아침 햇살이 비스듬히 들어와,\n나무 바닥을 따뜻하게 데우고 있습니다.\n공기 중에는 은은한 물감 냄새가 떠 있습니다.\n조용하고, 아늑한 방입니다.\n이 화실의 주인은, 나입니다.\n\n방 한가운데에는 이젤 하나가 놓여 있고,\n그 위에 새하얀 도화지 한 장이 나를 기다리고 있습니다.\n그 앞의 의자에 천천히 앉아 보세요.\n\n오늘은 이 도화지 위에,\n지금 내 마음을 그려 보려 합니다.\n\n가슴에 가만히 물어봅니다.\n지금 내 마음은 어떤 빛깔인가요.\n무겁고 어두운 색일 수도 있고,\n어지럽게 뒤섞인 색일 수도 있습니다.\n잔잔한 색일 수도,\n뜻밖에 환한 색일 수도 있습니다.\n어떤 색이든, 괜찮습니다.\n\n붓을 들어,\n그 색을 듬뿍 묻혀 보세요.\n그리고 도화지 위에,\n마음 가는 대로 그어 봅니다.\n\n걱정이 있다면 걱정의 소용돌이를,\n답답함이 있다면 묵직한 덩어리를,\n설렘이 있다면 가볍게 튀는 점들을.\n잘 그리려 하지 않아도 됩니다.\n지금 마음에 있는 것을 있는 그대로 옮기기만 하면 됩니다.\n\n붓끝이 종이를 스치는 사각,\n사각, 하는 소리와 함께,\n마음속에 있던 것들이 하나씩 종이 위로 옮겨 가는 것을 느껴 보세요.\n무거운 것일수록,\n종이가 대신 받아 줍니다.\n\n이제,\n그림이 다 되었다면 붓을 가만히 내려놓습니다.\n\n그리고 그 그림을 두 손으로 조심스럽게 들어,\n햇살이 잘 드는 벽에 천천히 걸어 봅니다.\n그림이 벽에 걸리며, 달칵,\n하고 제자리를 잡는 소리가 납니다.\n\n이제부터가 오늘의 가장 중요한 시간입니다.\n서두르지 않겠습니다.\n\n그림 앞에서,\n뒤로 한 걸음 물러나 보세요.\n\n방금까지 코앞에 있던 그림이,\n조금 멀어집니다.\n그림의 전체 모습이 눈에 들어오기 시작합니다.\n\n다시,\n한 걸음 더 물러납니다.\n\n그림이 조금 더 작아지고,\n그림을 둘러싼 넓은 벽이 보입니다.\n그림은 벽의 한 부분일 뿐,\n벽 전체가 아닙니다.\n\n마지막으로, 한 걸음 더.\n이제 창가의 햇살 속에 서서,\n편안한 거리에서 그림을 바라봅니다.\n\n마치 전시회에 온 관람객처럼,\n그 그림을 천천히 감상해 보세요.\n어떤 색이 쓰였는지,\n선은 어디로 흐르는지,\n그저 바라보기만 합니다.\n\n가까이서 그릴 때는 그렇게 크고 무겁던 소용돌이가,\n이만큼 떨어져서 보니 하나의 무늬로 보입니다.\n어둡던 색도,\n햇살 아래에서는 깊이 있는 빛깔로 보입니다.\n\n그리고 여기서,\n아주 중요한 것 하나를 알아차려 보세요.\n\n저 그림 속에는 오늘의 걱정과 무거움이 담겨 있습니다.\n그런데 그것을 바라보는 나는,\n지금 그림 밖에,\n이렇게 서 있습니다.\n\n마음이 그림 속에 있는 동안에는 그것이 세상의 전부처럼 느껴졌지만,\n이렇게 걸어 두고 바라보니 그것은 내가 그린 한 장의 그림입니다.\n\n나는 그림이 아닙니다. 나는,\n그림을 그린 화가입니다.\n걱정은 그림 속에 있고,\n나는 그것을 바라볼 수 있는 사람입니다.\n\n그림을 없애려 하지 않아도 됩니다.\n그림은 저기,\n벽에 걸린 채로 있어도 괜찮습니다.\n다만 나는 이제,\n그림과 나 사이에 이만큼의 거리가 있다는 것을 압니다.\n그 거리만큼,\n숨 쉴 자리가 생깁니다.\n\n그 자리에 서서,\n숨을 한 번 깊게 들이쉬고,\n천천히 내쉬어 보세요.\n가슴이 한결 넓어진 것을 느껴 봅니다.\n\n그 넓어진 가슴으로,\n마음속으로 가만히 말해 보세요.\n\n'나는 그림보다 크다.'\n\n'어떤 그림을 그린 날에도, 나는 화가다. 내 삶의 주인은, 나다.'\n\n내일이면 또 새 도화지가 준비될 것입니다.\n오늘의 그림은 벽에 걸어 두고,\n화가는 언제든 새 종이 앞에 앉을 수 있습니다.\n그 자유가 가슴 한쪽에서 조용히 차오릅니다.\n\n이제 그 넉넉한 마음을 담은 채,\n천천히 돌아올 준비를 합니다.\n햇살 가득한 이 화실과 벽에 걸린 그림은,\n언제든 다시 올 수 있는 자리에 그대로 남아 있습니다.\n\n손가락 끝을 가볍게 움직여 보세요.\n발가락도 천천히 움직여 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서,\n지금 앉아 있는 이 자리의 감각을 느껴 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 보세요.\n\n살아가다,\n어떤 감정이 세상의 전부처럼 크게 느껴지는 순간이 오면,\n떠올려 보세요.\n그것은 지울 수 없는 낙인이 아니라,\n벽에 걸어 두고 세 걸음 물러나 바라볼 수 있는,\n한 장의 그림이라는 것을.\n그리고 그 그림을 바라보는 나는,\n언제나 그림보다 크다는 것을.","duration":"","tags":"","series":"숨비명상"},{"id":"2a211656","category":"수면·이완","title":"생명의 씨앗(수면)","body":"지금부터 편안하게 누워 봅니다.\n머리를 가볍게 내려놓고,\n어깨의 힘을 스르르 풀어줍니다.\n팔과 다리가 바닥으로 천천히 가라앉는다고 느껴 봅니다.\n\n숨을 천천히 들이쉬고,\n편안하게 내쉽니다.\n숨을 내쉴 때마다 몸이 조금씩 안정되고,\n조금씩 더 편안해집니다.\n\n이제부터는 아무것도 하지 않아도 됩니다.\n잘하려고 노력하지 않아도 됩니다.\n그저 들리는 목소리에 몸을 맡기고,\n물결처럼 흘러가기만 하면 됩니다.\n\n나는 지금,\n고요한 밤바다 위에 떠 있습니다.\n둥근 달빛만이 닿는,\n넓고 잔잔한 바다입니다.\n\n바닷물은 체온처럼 따뜻하고 부드럽습니다.\n바다가 등을 살며시 받쳐 주고,\n팔과 다리도 가만히 받쳐 줍니다.\n가라앉을 걱정은 조금도 없습니다.\n바다가,\n나를 꼭 안아주고 있습니다.\n\n하늘 한가운데에는 크고 둥근 달이 떠 있습니다.\n고개를 들지 않아도 그 빛이 느껴집니다.\n은은한 달빛이 물 위에 길게 내려앉아,\n포근한 담요처럼 온몸을 따뜻하게 덮어 줍니다.\n\n이 달빛 아래에서 나는 완전히 안전합니다.\n그 무엇도 나를 방해하지 않습니다.\n\n잔잔한 물결이 일렁일 때마다 몸이 아주 천천히,\n요람처럼 흔들립니다.\n그 흔들림에 온전히 몸을 맡겨 봅니다.\n\n하늘에서 지켜 주는 달.\n등 뒤에서 받쳐 주는 바다.\n이 바다는,\n나의 안식처입니다.\n\n잠시 먼 곳을 다녀와도,\n언제든 이곳으로 돌아올 수 있습니다.\n떠오르는 것이 무엇이든,\n편안하게 머무르면 됩니다.\n\n이제 물결에 몸을 맡긴 채,\n시간이 천천히 거꾸로 흐르기 시작합니다.\n\n먼저,\n어제의 내가 물결처럼 스쳐 갑니다.\n어제 아침의 햇살,\n어제 오갔던 길.\n애써 떠올리지 않아도 됩니다.\n모든 장면들이 저 혼자 흘러가게 둡니다.\n\n시간이 조금 더 거슬러 올라갑니다.\n지난겨울,\n찬바람을 맞으며 걸아가는 내가 보이고,\n작년 여름,\n뜨거운 햇살 아래 서있는 내가 보입니다.\n이 년 전의 나,\n삼 년 전의 나.\n떠오르는 장면이 있다면 그저 바라보기만 합니다.\n아무것도 하지 않아도,\n시간이 알아서 흘러갑니다.\n\n물결을 따라 조금 더 멀리 거슬러 올라갑니다.\n\n교복을 입은 학생 시절의 내가 지나가고,\n운동장을 뛰어다니던 꼬마였던 내가 지나갑니다.\n누군가의 손을 잡고 걷던,\n아주 작은 내가 보입니다.\n\n어린아이가 된 나를 만납니다.\n친구들과 어울려 놀다 터져 나오던 웃음소리.\n손바닥 위에서 사르르 녹던 첫눈.\n비가 갠 날,\n물웅덩이가 반짝이던 놀이터.\n모든 장면이 달빛처럼 은은하게 지나갑니다.\n\n그 어린 시절의 나는 몸은 작았지만,\n잠은 세상에서 가장 깊었습니다.\n그 깊은 잠이,\n지금 내 몸속 어딘가에 그대로 남아 있습니다.\n\n조금 더 거슬러 올라갑니다.\n\n바닥에 엎드려 고개를 들려고 애쓰는 아기가 보입니다.\n그 아기가, 바로 나입니다.\n아주 작고 통통한 손과 발.\n아직 마음대로 움직일 수 없지만,\n괜찮습니다.\n완전한 편안함이 그 아기를 감싸고 있습니다.\n\n이 아기에게는 아무 걱정이 없습니다.\n어제도, 내일도 없습니다.\n그저 숨 쉬고,\n그저 존재할 뿐입니다.\n\n이제 의식이 점점 한 점으로 모여듭니다.\n모여든 의식이 작고 환한 빛이 됩니다.\n그 빛이 점점 작아지며,\n따뜻하고 부드러운 어둠 속으로 스며듭니다.\n\n여기는,\n생명이 처음 시작된 자리입니다.\n따뜻한 물이 온몸을 감싸 안고 있습니다.\n아무 소리도,\n아무 걱정도 없는,\n완전한 편안함과 고요함.\n\n그때,\n저 멀리서 어떤 소리가 들려옵니다.\n쿵… 쿵… 쿵…\n\n낮고 다정한 심장 소리가 잔잔한 파동이 되어 온몸으로 전해집니다.\n이 소리를 들으며,\n나는 자라났습니다.\n생명이 시작된 그 처음부터 지금 이 순간까지,\n이 소리는 한 번도 나를 떠난 적이 없습니다.\n\n잠시,\n이 심장 소리에 가만히 귀를 기울여 봅니다.\n\n이제 다시,\n달빛 아래 바다 위로 돌아옵니다.\n\n들리시나요.\n달빛에서도 고요한 고동이 울려옵니다.\n쿵… 쿵…\n\n나를 감싸고 있는 이 바다는,\n생명이 시작되던 그 자리처럼 따뜻하고 편안합니다.\n나는 그때에도 안전했고,\n지금도 안전합니다.\n그러니 이제 마음 놓고 편안하게 머물러도 됩니다.\n\n이제 한 호흡마다,\n100에서부터 거꾸로 숫자를 셉니다.\n숫자가 하나씩 줄어들 때마다,\n몸은 조금씩 더 깊이 가라앉습니다.\n\n천천히 숨을 들이쉬고,\n편안하게 내쉬고… 100.\n\n다시 숨을 들이쉬고,\n편안하게 내쉬고… 99.\n\n다시 숨을 들이쉬고,\n편안하게 내쉬고… 98.\n\n이제부터는 마음속으로,\n혼자만의 속도로 이어 갑니다.\n숫자를 세다가 어디쯤인지 잊어버려도 괜찮습니다.\n잊어버린다는 것은,\n잠이 마중 나왔다는 뜻이니까요.\n\n그저 물결에 몸을 맡기듯,\n호흡에 숫자를 실어 보냅니다.\n\n하늘에서 달이 지켜보고 있습니다.\n바다가 받쳐 주고 있습니다.\n\n이대로,\n달빛 아래에서… 편안하게…\n\n───\n\n생명의 씨앗 명상\n\n편안하게 누워 봅니다.\n베개에 머리를 맡기고,\n어깨의 힘을\n스르르 내려놓습니다.\n팔과 다리가\n바닥으로 천천히\n가라앉는다고 느껴 봅니다.\n\n숨을 천천히 들이쉬고,\n편안하게 내쉽니다.\n숨을 내쉴 때마다\n몸이 조금씩 무거워지고,\n조금씩 더 편안해집니다.\n\n이제부터는\n아무것도 하지 않아도 됩니다.\n잘 따라오지 않아도 됩니다.\n그저 들리는 목소리에\n몸을 맡기고,\n물결처럼 흘러가기만 하면 됩니다.\n\n지금,\n나는 고요한 밤바다 위에\n떠 있습니다.\n달빛만이 닿는,\n넓고 잔잔한 바다입니다.\n\n바닷물은 체온처럼 따뜻하고\n부드럽습니다.\n등을 살며시 받쳐 주고,\n팔과 다리도\n가만히 받쳐 줍니다.\n가라앉을 걱정은\n조금도 없습니다.\n바다가, 나를 안고 있습니다.\n\n하늘 한가운데에는\n크고 둥근 달이 떠 있습니다.\n고개를 들지 않아도\n그 빛이 느껴집니다.\n은은한 달빛이\n물 위에 길게 내려앉아,\n포근한 담요처럼\n온몸을 덮어 줍니다.\n\n이 달빛 아래에서\n나는 완전히 안전합니다.\n아무것도\n나를 방해하지 않습니다.\n\n잔잔한 물결이 일렁일 때마다\n몸이 아주 천천히,\n요람처럼 흔들립니다.\n그 흔들림에\n온전히 몸을 맡겨 봅니다.\n\n하늘에서 지켜 주는 달.\n등 뒤에서 받쳐 주는 바다.\n이 바다는, 나의 자리입니다.\n이제 잠시\n먼 곳을 다녀와도,\n언제든 이곳으로\n돌아올 수 있습니다.\n떠오르는 것이 무엇이든,\n편안한 만큼만\n머무르면 됩니다.\n\n이제 물결에 몸을 맡긴 채,\n시간이 천천히\n거꾸로 흐르기 시작합니다.\n\n먼저, 어제의 내가\n물결처럼 스쳐 갑니다.\n어제 아침의 빛,\n어제 오갔던 길.\n애써 떠올리지 않아도 됩니다.\n장면들이 저 혼자\n흘러가게 둡니다.\n\n시간이 조금 더\n거슬러 흐릅니다.\n지난겨울,\n차가운 공기 속을 걷던 내가\n지나가고,\n작년 여름,\n뜨거운 햇살 아래의 내가\n지나갑니다.\n이 년 전의 나,\n삼 년 전의 나.\n떠오르는 장면이 있다면\n그저 바라보기만 합니다.\n아무것도 하지 않아도,\n시간이 알아서 흘러갑니다.\n\n물결을 따라\n조금 더 멀리\n거슬러 올라갑니다.\n\n교복을 입은\n학생 시절의 내가 지나가고,\n운동장을 뛰어다니던\n어린 날의 내가 지나갑니다.\n누군가의 손을 잡고 걷던,\n아주 작은 내가 보입니다.\n\n어린아이가 된 나를 만납니다.\n친구들과 어울려 놀다\n터져 나오던 웃음소리.\n손바닥 위에서\n사르르 녹던 첫눈.\n비 갠 날,\n물웅덩이가 반짝이던 놀이터.\n모든 장면이\n달빛처럼 은은하게\n지나갑니다.\n\n그 시절의 나는\n몸이 작았지만,\n잠은 세상에서\n가장 깊었습니다.\n그 깊은 잠이,\n지금 내 몸속 어딘가에\n그대로 남아 있습니다.\n\n조금 더\n거슬러 올라갑니다.\n\n바닥에 엎드려\n고개를 들려고 애쓰는\n아기가 보입니다.\n그 아기가, 나입니다.\n아주 작고 통통한\n손과 발.\n아직 마음대로\n움직일 수 없지만,\n괜찮습니다.\n완전한 편안함이\n아기를 감싸고 있습니다.\n\n이 아기에게는\n아무 걱정이 없습니다.\n어제도, 내일도 없습니다.\n그저 숨 쉬고,\n그저 존재할 뿐입니다.\n\n이제 의식이\n점점 한 점으로\n모여듭니다.\n모여든 의식이\n작고 환한\n빛이 됩니다.\n그 빛이 점점 작아지며,\n따뜻하고 부드러운\n어둠 속으로\n스며듭니다.\n\n여기는,\n생명이 처음 시작된\n자리입니다.\n따뜻한 물이\n온몸을 감싸 안고 있습니다.\n아무 소리도,\n아무 걱정도 없는,\n완전한 편안함과\n고요함.\n\n그때, 저 멀리서\n들려옵니다.\n\n쿵… 쿵… 쿵…\n\n낮고 다정한 심장 소리가\n잔잔한 파동이 되어\n온몸으로 전해집니다.\n이 소리를 들으며,\n나는 자라났습니다.\n생명이 시작된 그 처음부터\n지금 이 밤까지,\n이 고동은 한 번도\n나를 떠난 적이 없습니다.\n\n잠시, 이 심장 소리에\n가만히 귀를\n기울여 봅니다.\n\n이제 다시,\n달빛 아래\n바다 위로 돌아옵니다.\n\n들리시나요.\n달빛에서도\n고요한 고동이\n울려옵니다.\n쿵… 쿵…\n\n나를 감싸고 있는 이 바다는,\n생명이 시작되던\n그 자리처럼\n따뜻하고 편안합니다.\n나는 그때에도 안전했고,\n지금도 안전합니다.\n그러니 이제,\n마음 놓고\n잠들어도 됩니다.\n\n이제 한 호흡마다,\n100에서부터 거꾸로\n숫자를 셉니다.\n숫자가 하나씩 줄어들 때마다,\n몸은 조금씩 더 깊이\n가라앉습니다.\n\n천천히 숨을 들이쉬고,\n편안하게 내쉬고…\n100.\n\n다시 숨을 들이쉬고,\n편안하게 내쉬고…\n99.\n\n다시 숨을 들이쉬고,\n편안하게 내쉬고…\n98.\n\n이제부터는 마음속으로,\n혼자만의 속도로\n이어 갑니다.\n숫자를 세다가\n어디쯤인지 잊어버려도\n괜찮습니다.\n잊어버린다는 것은,\n잠이 마중 나왔다는\n뜻이니까요.\n\n그저 물결에 몸을 맡기듯,\n호흡에 숫자를\n실어 보냅니다.\n\n하늘에서 달이\n지켜보고 있습니다.\n바다가\n받쳐 주고 있습니다.\n\n이대로, 달빛 아래에서…\n편안하게…\n\n───","duration":"약 15분","tags":"","series":"숨비명상"},{"id":"0fce9ed4","category":"수용","title":"나무처럼 서기","body":"이번에는 앉는 대신,\n자리에서 천천히 일어나 보겠습니다.\n두 발을 어깨너비만큼 벌리고,\n편안하게 서 보세요.\n\n무릎은 뻣뻣하게 펴지 말고,\n아주 살짝만 부드럽게 풀어 둡니다.\n두 팔은 몸 옆에 자연스럽게 내려놓습니다.\n\n준비가 되었다면,\n천천히 눈을 감아 보세요.\n\n서서 눈을 감으면 몸이 조금 흔들릴 수 있습니다.\n괜찮습니다. 살아 있는 것은,\n원래 조금씩 흔들리는 법이니까요.\n\n우리는 흔들리지 않으려고 애쓰며 살아갑니다.\n흔들리는 모습을 보이면 약한 사람이 될까 봐,\n마음이 크게 출렁인 날에도 아무렇지 않은 척,\n단단한 척하며 하루를 버팁니다.\n오늘은 그 애씀을 잠시 내려놓아 봅니다.\n여기서는,\n흔들려도 괜찮습니다.\n\n이제 발바닥으로 주의를 가져가 보세요.\n발뒤꿈치, 발바닥의 넓은 면,\n그리고 발가락 끝.\n바닥이 두 발을 단단하게 받쳐 주고 있습니다.\n\n숨을 한 번 천천히 내쉬면서,\n몸의 무게를 발바닥에 가만히 맡겨 보세요.\n어깨의 힘이 스르르 아래로 흘러내립니다.\n\n숨은 일부러 조절하지 않아도 됩니다.\n들어오고 나가는 숨을 그저 지켜보기만 합니다.\n생각이 떠올라도 괜찮습니다.\n알아차렸다면,\n다시 발바닥으로 돌아오면 됩니다.\n\n이제 마음속으로,\n넓은 언덕 위에 서 있는 나무 한 그루를 떠올려 보세요.\n\n아주 오래된 나무입니다.\n줄기는 굵고 든든하며,\n초록 잎이 무성하게 하늘을 향해 펼쳐져 있습니다.\n따뜻한 오후의 햇살이 잎사귀 사이로 스며들고 있습니다.\n\n그 나무 곁으로 천천히 다가가,\n거친 줄기에 손을 가만히 대어 봅니다.\n햇살에 데워진 나무껍질이 손바닥에 따뜻하게 닿습니다.\n\n이 나무가 서 있던 세월을 가만히 헤아려 봅니다.\n이 자리에서 나무는,\n수백 번의 비바람을 만났을 것입니다.\n천둥이 치던 밤,\n어린 가지가 꺾여 나간 날도,\n잎을 모두 떨구고 빈 몸으로 견뎌야 했던 길고 추운 겨울도 있었을 것입니다.\n\n그러나 봄이 올 때마다,\n나무는 다시 새잎을 밀어 올렸습니다.\n꺾인 자리는 아물어 더 단단한 옹이가 되었고,\n흔들린 세월은 한 겹 한 겹,\n나이테가 되어 나무를 더 굵게 만들었습니다.\n\n이 나무가 이렇게 큰 것은,\n흔들리지 않아서가 아닙니다.\n수만 번 흔들리면서도,\n이 자리를 떠나지 않았기 때문입니다.\n\n이제,\n그 나무처럼 내가 서 본다고 상상해 보세요.\n발밑에서 흙냄새가 은은하게 올라옵니다.\n\n내 두 발이,\n나무의 뿌리가 됩니다.\n발바닥에서 뿌리가 자라나,\n땅속 깊이 천천히 내려갑니다.\n숨을 내쉴 때마다,\n뿌리가 한 뼘씩 더 깊어집니다.\n\n땅속은 서늘하고 고요합니다.\n뿌리가 깊어질수록,\n두 다리가 점점 더 든든해지는 것을 느껴 봅니다.\n\n허리와 등은 나무의 줄기입니다.\n곧게, 그러나 딱딱하지 않게,\n하늘을 향해 부드럽게 서 있습니다.\n정수리 위로는 따뜻한 햇살이 내려앉습니다.\n\n이때,\n바람이 한 줄기 불어옵니다.\n잎사귀들이 사락사락 소리를 내며 흔들립니다.\n뺨과 팔에도 부드러운 바람결이 스칩니다.\n\n가지와 잎은 바람에 흔들리지만,\n뿌리는 조금도 움직이지 않습니다.\n나무는 바람과 싸우지 않습니다.\n흔들릴 것은 흔들리게 두고,\n그저 제자리에 서 있을 뿐입니다.\n\n그렇게 서서,\n가만히 돌아봅니다.\n\n나의 지난날에도,\n수많은 바람이 불었습니다.\n가지가 꺾이는 것 같던 날도,\n잎을 다 떨군 채 빈 몸으로 견뎌야 했던 겨울 같은 시간도 있었습니다.\n\n그런데, 보세요. 나는 지금,\n여기 이렇게 서 있습니다.\n\n그 모든 바람이 지나가는 동안,\n나는 쓰러지지 않았습니다.\n흔들렸지만, 서 있었습니다.\n그 시간들은 사라지지 않고,\n나이테처럼 내 안에 쌓여,\n지금의 나를 이만큼 깊고 단단한 사람으로 만들어 주었습니다.\n\n울컥하는 마음이 올라와도 괜찮습니다.\n수없이 흔들리면서도 버텨 온 나를,\n오늘 처음으로 가만히 안아 주는 순간이니까요.\n\n그리고 한 가지 더,\n떠올려 보세요.\n이 나무는 서 있는 것만으로,\n지친 새들에게 쉴 가지가 되고,\n길 가던 이에게 서늘한 그늘이 되어 줍니다.\n\n나도 그랬을 것입니다.\n내가 모르는 사이에도,\n그저 내 자리를 지키고 서 있는 것만으로,\n나는 누군가에게 기댈 수 있는 나무가,\n쉬어 갈 수 있는 그늘이 되어 주었을 것입니다.\n\n그 든든함이 발바닥에서 다리를 타고,\n가슴까지 차오르는 것을 느껴 보세요.\n따뜻하고 묵직한 안정감이 몸 한가운데에 자리를 잡습니다.\n\n그 느낌 속에서,\n마음속으로 가만히 말해 봅니다.\n\n'흔들려도 괜찮다. 나는 흔들리면서도, 여기까지 서 있었다.'\n\n'그 어떤 바람 속에서도, 나는 쓰러지지 않았다. 그리고 앞으로도, 쓰러지지 않을 것이다.'\n\n잘 느껴지지 않아도 괜찮습니다.\n이렇게 서 있는 것만으로,\n몸은 이미 그 든든함을 배우고 있습니다.\n\n숨을 들이쉴 때마다 햇살의 온기가 스며들고,\n내쉴 때마다 뿌리가 조금 더 깊어집니다.\n이 느낌 속에 잠시 머물러 보세요.\n\n이제 그 든든함을 몸에 담은 채,\n천천히 돌아올 준비를 합니다.\n이 나무는 어디에도 가지 않고,\n언제든 다시 떠올릴 수 있는 자리에 그대로 서 있습니다.\n\n손가락 끝을 가볍게 움직여 보세요.\n발가락으로 바닥을 한 번 지그시 눌러 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서,\n지금 서 있는 이 자리의 감각을 느껴 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 보세요.\n\n살아가다,\n마음이 흔들리는 순간이 오면,\n두 발이 바닥에 닿아 있는 이 느낌을 떠올려 보세요.\n바람은 지나가고,\n뿌리는 여전히 그 자리에 있습니다.\n그리고 나는,\n생각보다 훨씬 깊이 뿌리내린 사람입니다.","duration":"","tags":"","series":"표현명상"},{"id":"30551ae7","category":"수용","title":"산명상","body":"편안한 자세로 앉아 보세요.\n어깨의 힘을 쭉 빼고,\n부드럽게 풀어 줍니다.\n두 손은 무릎 위에 가만히 올려놓습니다.\n\n준비가 되었다면,\n천천히 눈을 감아 보세요.\n\n숨은 조절하지 않아도 됩니다.\n저절로 들어오고 나가는 숨을,\n그저 편안하게 바라봅니다.\n숨을 내쉴 때마다,\n몸이 조금씩 바닥에 내려앉습니다.\n\n우리의 마음은,\n날씨를 닮았습니다.\n아침에는 맑았다가 오후에는 흐려지고,\n칭찬 한마디에 개었다가 싫은 소리 한마디에 폭풍이 몰아칩니다.\n그 변덕스러운 날씨 속에서,\n우리는 매일 흔들리며 살아갑니다.\n\n오늘은 그 날씨 아래에서,\n날씨보다 크고 날씨보다 오래된 것 하나를 만나 보려 합니다.\n\n이제 마음의 눈으로,\n아름다운 산 하나를 떠올려 보세요.\n언젠가 실제로 보았던 산도 좋고,\n마음속으로 그려 낸 산도 좋습니다.\n\n하늘을 배경으로 우뚝 솟아 있는 산입니다.\n크고 든든한 몸으로,\n대지 위에 깊이 뿌리내려 견고하게 자리 잡고 있습니다.\n정상에는 흰 눈이 쌓여 있고,\n부드러운 능선을 따라 나무들이 울창하게 자라 있습니다.\n멀리서 보아도 아름답고,\n가까이 보아도 아름답습니다.\n\n부드럽게 호흡하며,\n그 산을 천천히 바라봅니다.\n\n이제 산에게 조금씩 다가가 봅니다.\n산이 점점 가까워지더니,\n어느 순간,\n산과 내가 하나가 되는 것을 느껴 봅니다.\n\n나는 이제, 산입니다.\n\n머리는 하늘을 향해 솟은 봉우리가 됩니다.\n어깨와 팔은 부드럽게 흘러내리는 능선이 되고,\n엉덩이와 다리는 대지에 깊이 박힌 단단한 바위가 됩니다.\n\n산이 되어,\n숨을 쉬어 봅니다.\n숨을 쉴수록,\n산의 흔들리지 않는 고요함이 몸 깊은 곳까지 천천히 스며듭니다.\n\n산이 된 나에게,\n하루가 지나갑니다.\n태양이 떠올라 뜨겁게 비추다가,\n붉은 노을을 남기고 사라집니다.\n별과 달이 떠오르고,\n이윽고 깊은 어둠이 내려앉습니다.\n그리고 다시,\n아침이 밝아 옵니다.\n\n빛이 오고 가는 동안에도,\n산은 그 자리에,\n고요히 앉아 있습니다.\n\n계절도 지나갑니다.\n\n여름이 오면,\n울창한 초록이 온몸을 덮고,\n소나기가 등줄기를 타고 쏟아집니다.\n가을이 오면,\n노란 황금빛과 붉은 단풍으로 옷을 갈아입습니다.\n겨울이 오면,\n차가운 눈과 얼음이 하얀 담요처럼 온몸을 덮습니다.\n그리고 봄이 오면,\n얼음이 녹아 시냇물로 흐르고,\n새가 지저귀고,\n산등성이마다 꽃이 피어납니다.\n\n옷은 철마다 바뀌지만,\n산은 변하지 않습니다.\n그 모든 계절 아래에서,\n산은 한결같이,\n고요하고 평화롭게 앉아 있습니다.\n\n사람들도 다녀갑니다.\n\n맑은 날,\n사람들은 찾아와 아름답다고 감탄합니다.\n구름과 안개가 산을 가리면,\n같은 사람들이 날씨를 탓하며 불평을 쏟아 놓고 돌아섭니다.\n\n그러나 산이 된 나는,\n그 어느 쪽에도 흔들리지 않습니다.\n칭찬이 산을 더 높이지 못하고,\n불평이 산을 깎아내리지 못합니다.\n사람들이 오건 가건,\n나를 좋아하건 싫어하건,\n나는 변함없이,\n장엄하고 평온하게 앉아 있습니다.\n\n숨을 쉬며,\n그 흔들림 없는 평온함에 잠시 머물러 봅니다.\n\n이제, 가만히 돌아봅니다.\n\n나의 지난날에도,\n수많은 날씨가 지나갔습니다.\n폭풍우 치던 시절이 있었고,\n뼛속까지 시리던 겨울 같은 시간도 있었습니다.\n누군가의 말 한마디에 무너질 것 같던 날도,\n따스한 봄날처럼 환하게 웃던 날도 있었습니다.\n\n그런데,\n여기서 한 가지를 알아차려 봅니다.\n\n그 모든 계절이 왔다가 사라지는 동안,\n그것을 처음부터 끝까지 지켜본 이가 있었습니다.\n폭풍 속에서도 사라지지 않고,\n겨울에도 얼어붙지 않고,\n묵묵히 그 모든 날씨를 바라보고 있던 존재.\n\n그것이 바로,\n내 안의 산입니다.\n산은 밖에 있는 것이 아니라,\n처음부터 내 안에 있었습니다.\n\n기쁨도 슬픔도,\n칭찬도 비난도,\n산 위를 지나가는 날씨일 뿐입니다.\n날씨는 산을 적시고 흔들어도,\n산을 옮기지는 못합니다.\n\n그 든든함 속에서,\n마음속으로 가만히 말해 봅니다.\n\n'날씨는, 지나간다. 산은, 남는다.'\n\n'그 모든 폭풍을 지켜본 고요한 산이, 내 안에 있다. 나는, 산이다.'\n\n숨을 쉴 때마다 그 고요함이 조금 더 깊어집니다.\n이 느낌 속에,\n잠시 머물러 보세요.\n\n이제 그 산의 평온함을 가슴 깊이 담은 채,\n천천히 돌아올 준비를 합니다.\n이 산은 어디로도 가지 않고,\n언제나 내 안,\n같은 자리에 있습니다.\n\n손가락 끝을 가볍게 움직여 보세요.\n발가락도 천천히 움직여 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서,\n지금 앉아 있는 이 자리의 감각을 느껴 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 보세요.\n\n살아가다,\n마음에 폭풍이 몰아치는 날이 오면,\n가만히 떠올려 보세요.\n'이것은, 지나가는 날씨다.' 비바람은 산을 지나가고,\n산은 언제나처럼,\n그 자리에서 고요히 기다리고 있습니다.","duration":"","tags":"","series":"표현명상"},{"id":"9eb21845","category":"수용","title":"나는 꽃(원)","body":"삶을 살아가다 보면 우리는 종종 스스로에게 만족하지 못하고,\n내가 부족하다고 느끼는 순간들이 찾아옵니다.\n세상이 나에게만 유독 가혹하고,\n상처를 준다고 생각하기도 합니다.\n\n하지만 사실,\n세상이 나를 아프게 하는 것이 아니라,\n내가 '상처'라고 이름 붙이며 세상을 오해하고 있을 뿐입니다.\n\n우리는 다른 사람들의 인정과 기대를 채우기 위해,\n완벽한 사람이 되려 애씁니다.\n좋은 부모, 유능한 직장인,\n타인을 돕는 따뜻한 사람,\n훌륭한 인격자… 이런 모습이 나를 가치 있게 만들어 줄 거라 믿으며,\n더 열심히,\n더 완벽히 살아가려 합니다.\n\n그런데,\n이런 노력 속에서 정작 나 자신을 돌아볼 여유를 잃고,\n진짜 '나'를 잊어버린 채 살아갑니다.\n완벽한 사람은 늘 너무 멀리 있고,\n끝없이 밀려오는 파도처럼 느껴집니다.\n한 파도를 넘어도,\n또 다른 거센 파도가 기다리고 있을 뿐입니다.\n\n어쩌면 완벽한 사람이란,\n우리의 행복과는 먼,\n사막의 신기루 같은 허상일지도 모릅니다.\n\n갓난아기가 처음 걸음마를 배울 때,\n수없이 넘어지고 다시 일어서기를 반복하듯,\n우리도 삶 속에서 넘어지고 좌절합니다.\n중요한 건 포기하지 않고,\n나만의 속도로 다시 일어나 한 걸음씩 나아가는 것입니다.\n\n우리는 각자 고유한 속도와 방식으로 성장합니다.\n세상에 똑같은 꽃잎이 없듯,\n저마다 독특한 색과 향기를 지닌 소중한 존재입니다.\n\n지금,\n세상의 모든 시선을 내려놓고 온전히 나 자신을 바라보세요.\n있는 그대로의 나는 이미 충분히 가치 있고,\n더없이 소중한 존재입니다.\n\n남과 비교하며 스스로를 괴롭힐 필요는 없습니다.\n나를 있는 그대로 사랑하고 존중하는 것,\n그것이 진정한 나를 찾아가는 첫걸음입니다.\n\n행복은 멀리 있는 것이 아닙니다.\n과거나 미래가 아니라,\n바로 지금,\n이 순간에 있습니다.\n내 삶의 주인공은 나입니다.\n그리고 나는 이미 충분히 잘하고 있습니다.\n\n작은 민들레 씨앗 하나로도 어디든 뿌리내리며 피어나는 꽃처럼,\n나 또한 세상 어디서든 가장 아름다운 꽃으로 피어날 수 있습니다.","duration":"","tags":"","series":"숨비명상"},{"id":"b36fdb97","category":"탈중심화","title":"마음 해우소(원)","body":"지금 이 순간,\n나는 어디에 있을까요?\n내가 있는 이곳, 바로 지금,\n내 마음의 무게를 따뜻하게 안아주고 스스로를 부드럽게 위로하는 시간입니다.\n\n때로 혼자라는 생각에 마음이 무거울 때,\n말없이 곁에 앉아 손을 잡아주는 친구가 떠오릅니다.\n특별한 말은 필요 없습니다.\n그저 따뜻한 온기를 전해주는 누군가의 존재만으로도 우리는 다시 일어설 용기와 희망을 찾습니다.\n\n주변에 마음이 힘든 친구가 있나요?\n그 친구에게 나는 어떤 존재가 되고 싶을까요?\n잠시 눈을 감고,\n그 친구의 모습을 마음에 그려봅니다.\n\n마음으로 그 친구 곁에 조용히 앉아,\n다정히 손을 잡고 이렇게 속삭입니다.\n\n“친구야, 많이 힘들었지. 그런 일을 겪으면 누구나 아픔을 느낄 거야. 네가 느끼는 그 감정, 정말 당연한 거야. 내가 여기 있을게. 내 곁에서 잠시 쉬어. 괜찮아질 거야.”\n\n이제 내 마음을 들여다봅니다.\n내 안에도 무겁거나 힘든 부분이 있나요?\n조금의 공감과 위로가 필요한가요?\n그렇다면,\n친구에게 했던 것처럼 내 마음을 따뜻하게 안아줍니다.\n\n“요즘 힘들지? 괜찮아, 힘들다고 느끼는 건 자연스러운 거야. 이렇게 내 곁에서 잠시 쉬어. 토닥, 토닥.”\n\n그리고 이렇게 말해줍니다.\n“그런데 있잖아, 너 알아? 네 안에는 이미 이겨낼 힘이 있어. 시간이 지나면, 한 뼘 더 단단해진 너를 만날 거야. 나는 믿어. 너를 늘 지켜봐 온 내가 있잖아. 네 안에는 더 크고 지혜로운 너, 따뜻한 가슴과 넓은 품을 가진 멋진 너가 있어.”\n\n내 안의 나는 언제나 나를 돌보고,\n나를 지지하며 곁에 있어줍니다.\n그러니 힘들 때는 먼저 내 안의 나를 바라봅니다.\n이 세상에서 나를 가장 깊이 이해하고 사랑하는 건 바로 나 자신이기 때문입니다.\n\n마음의 상처를 외면하거나 억지로 지우려 하면,\n언젠가 더 큰 아픔으로 돌아올 수 있습니다.\n하지만 지금처럼 다정히 위로하고 공감한다면,\n마음에 새 힘이 자라는 것을 느낄 것입니다.\n\n이 위로를 받으며 어떤 느낌이 드는지,\n내 기분이 어떻게 변하는지 조용히 알아차려 봅니다.\n\n내 마음은 맑은 도화지입니다.\n그 도화지 위에 그려지는 그림이 곧 내 세상이 됩니다.\n하루하루 그린 그림이 모여 내 인생이 됩니다.\n행복한 그림, 슬픈 그림,\n따뜻한 그림— 어떤 그림을 그릴지는 나에게 달렸습니다.\n\n나는 내 인생의 화가입니다.\n내 삶의 주인은 바로 나입니다.\n오늘,\n내 마음에 어떤 그림을 그리고 싶나요?","duration":"","tags":"","series":"숨비명상"},{"id":"3b2590a1","category":"용서감사","title":"감사명상(원)","body":"우리는 일상에서 늘 함께하는 가족,\n친구,\n그리고 소소한 순간들을 당연하게 여기며  감사함을 잊곤 합니다.\n특히 가까운 사람일수록 고마움을 표현하는 일을 미루기 쉽죠.\n하지만 일상 속 감사함을 알아차리고,\n그것을 마음으로 느끼고 표현할 때,\n우리의 삶이 이미 충분히 아름답고 완전하다는 것을 깨닫게 됩니다.\n\n지금부터 잠시 멈추고,\n나의 몸과 마음,\n그리고 나를 행복하게 하는 모든 것에 감사하는 시간을 가져보겠습니다.\n\n먼저,\n나의 몸과 마음을 바라봅니다.\n가장 소중한 나의 몸과 마음에게 고마움을 전해봅니다.\n\n눈을 떠올립니다.\n눈은 사랑하는 사람의 얼굴,\n좋아하는 책의 한 구절,\n아름다운 자연의 풍경을 볼 수 있게 해줍니다.\n이 소중한 순간들을 선물해 주는 눈에게 감사합니다.\n\n이제 코로 주의를 옮깁니다.\n코는 숨을 쉬게 하고,\n향기로운 꽃내음이나 맛있는 음식의 냄새를 느끼게 해줍니다.\n살아있음을 느끼게 하는 코에게 고마움을 전합니다.\n\n입을 생각해봅니다.\n입은 우리 몸에 영양을 주고,\n사랑하는 사람들과 이야기를 나누게 합니다.\n오늘의 대화와 음식을 가능케 한 입에게 감사합니다.\n\n심장으로 주의를 가져갑니다.\n조용히,\n그러나 끊임없이 뛰며 산소를 온몸에 전하는 심장.\n지금 이 순간도 나를 위해 일하는 심장에게 고마움을 전합니다.\n\n팔과 손을 떠올립니다.\n팔과 손 덕분에 버스 손잡이를 잡고,\n키보드를 두드리고,\n사랑하는 사람을 안으며 온기를 나눌 수 있었습니다.\n오늘 하루 나의 손이 닿았던 모든 순간에 감사합니다.\n\n다리와 발로 주의를 옮깁니다.\n다리와 발은 나를 원하는 곳으로 데려가고,\n나를 단단히 지탱해줍니다.\n땅과 나를 이어주는 다리와 발에게 고마움을 전합니다.\n\n이제 몸 전체를 느낍니다.\n내 몸이 나를 위해 매일 해주는 모든 일에 감사하며,\n따뜻한 마음을 전합니다.\n\n이제 행복한 순간들을 떠올려봅니다.\n생각만으로도 미소가 지어지는 사람,\n물건, 장소,\n시간을 마음에 그려봅니다.\n- 사랑하는 가족과 친구들.\n- 나를 웃게 하는 반려동물.\n- 해질녘의 따뜻한 풍경.\n- 비 오는 날 창밖의 빗소리.\n- 비 갠 뒤 맑은 하늘에 뜬 무지개.\n- 잠들기 전 가족과 나누는 정다운 대화.\n- 자연 속으로 떠나는 주말 여행.\n\n이 순간들을 떠올리며,\n내 안에서 일어나는 감정을 느껴봅니다.\n- 내 표정은 어떤 모습인가요?\n- 눈과 입은 어떻게 움직이나요?\n- 가슴에서는 어떤 따뜻함이 느껴지나요?\n- 손과 발에서는 어떤 감각이 일어나나요?\n- 마음에는 어떤 감정이 샘솟나요?\n- 누군가에게 전하고 싶은 말은 무엇인가요?\n\n이 고마운 감정을 있는 그대로 바라보고,\n따뜻하게 품어봅니다.\n\n우리는 감사함을 선물해 주는 사람들과 함께 살아갑니다.\n나를 위해 애써주는 사람들,\n나를 사랑해주는 존재들이 세상에 있다는 것을 떠올립니다.\n그들 덕분에 내가 얼마나 소중한 사람인지 느낍니다.\n\n그들에게 마음을 전합니다.\n감사합니다. 고맙습니다.\n사랑합니다.\n\n나의 몸과 마음에도 다시 한 번 고마움을 전합니다.\n고맙습니다. 감사합니다.\n사랑합니다.","duration":"","tags":"","series":"숨비명상"},{"id":"c25a5d3a","category":"수면·이완","title":"생명의 씨앗(원)","body":"편안하게 누워봅니다.\n천천히 눈을 감고 부드럽게 호흡합니다.\n내 몸이 바닥과 닿아 있는 느낌을 알아차립니다.\n\n숨을 크게 들이쉬고 길게 내쉽니다.\n다시한번 크게 들이 쉬면서 배꼽 깊은 곳에서부터 따뜻한 빛이 온 몸으로 퍼져나가고 길게 내쉬면서 내 몸의 무거운 것들이 눈이 녹듯이 사라집니다.\n한 번 더 들이쉬면서 따뜻한 빛이 내 몸을 가득 채우고,\n내쉬며서 머릿속 잡념들이 강물처럼 흘러 나갑니다.\n\n지금부터 머리부터 발끝까지 천천히 살펴보며 힘을 뺍니다.\n먼저 이마를 살펴봅니다.\n그리고 힘을 뺍니다.\n계속해서 눈, 코, 입,\n양볼, 목… 어깨, 양팔,\n손과 손가락. 가슴, 배,\n등 허리. 골반, 허벅지,\n무릎. 마지막으로 종아리,\n발과 발가락을 살펴보며 힘을 뺍니다.\n\n이제 당신은 솜이불처럼 포근한 파도 위에 누워있습니다.\n밤하늘의 별빛이 물결에 반짝이고,\n포근한 달빛이 이마를 따뜻하게 비추어 줍니다.\n솜털처럼 가볍게 몸이 둥둥 떠오르는 것을 느껴봅니다.\n\n파도 소리가 요람을 흔드는 리듬이 되고,\n살랑살랑 부는 바람이 '너는 안전하다'고 속삭입니다.\n내 몸은 투명한 물방울이 되어 달빛에 녹아들어갑니다.\n모든 소리가 점점 작아지고,\n당신의 숨 소리만 남아있습니다.\n\n이제 과거로 돌아가는 문이 열립니다.\n어제 마셨던 따뜻한 커피의 향기,\n지난 겨울 어깨에 첫눈이 내려앉던 순간,\n초등학교 운동장에서 미끄럼틀의 차가운 쇠를 움켜쥐던 손… 그때의 웃음소리가 가슴에 울려퍼지며 몸에서 따뜻한 물결이 일어납니다.\n\n더욱 깊이,\n더욱 오래전으로 들어갑니다.\n우유 빛깔의 따뜻한 엄마 품속,\n아빠의 두툼한 손가락을 꼭 잡았을 때의 안전함,\n첫 목욕 때 물장구치며 웃었던 포근함이 세포 하나하나를 스쳐갑니다.\n\n이제 당신은 아주아주 작은 씨앗이 되었습니다.\n어둠 속에서 엄마의 심장 소리가 들립니다.\n그 진동이 배꼽에서 척추를 타고 올라와 머리 끝까지 따뜻한 빛으로 퍼집니다.\n주변에 반짝이는 수많은 별들이 ‘여기는 영원히 안전하다’고 속삭입니다.\n\n이제 천천히 호흡합니다.\n호흡에 맞추어 100부터 거꾸로 숫자를 세어봅니다.\n들숨, 날숨 100… 들숨,\n날숨 99… 계속해서 1까지 셉니다.\n숫자가 내려갈수록 내 몸은 더욱 빛나고,\n마음은 고요한 바닥으로 천천히 가라앉습니다.\n...\n\n이제 가슴에 손을 올려봅니다.\n그곳에 영원히 빛나는 생명의 씨앗을 느끼며 “나는 지금도, 언제나, 생명 그 자체로 충분하다”고 속삭여봅니다.\n자금 당신은 생명의 씨앗으로 빛나고 있습니다.\n숨이 평온해질 때까지 시간을 가집니다.\n\n손가락과 발가락을 살짝 움직이며 주변의 공기를 느껴봅니다.\n부드럽게 눈을 뜨고 천천히 현실로 돌아옵니다.","duration":"","tags":"","series":"숨비명상"},{"id":"b5069469","category":"수용","title":"탑쌓기 명상","body":"호흡을 넣으면서 원본에 없던 새 뼈대를 하나 세웠어요.\n사실 이 다섯 도형 — 네모,\n동그라미, 세모, 반달,\n구슬 — 을 아래부터 차례로 쌓으면 그대로 오륜탑이 됩니다.\n실제로 오륜탑이 이 다섯 모양으로 만들어진 탑이거든요.\n그래서 \"숨 한 번에 한 층씩, 내 몸으로 탑을 쌓는 명상\"으로 변형했습니다.\n호흡 규칙은 딱 하나예요.\n들이쉬며 다음 모양으로 옮겨가고,\n내쉬며 그 자리에 머문다.\n이거 하나면 동작과 숨이 저절로 맞물립니다.\n\n───\n\n숨으로 쌓는 탑 — 오륜호흡명상\n\n안녕하세요.\n오늘은 숨으로 탑을 하나 쌓아보려고 합니다.\n\n돌도 필요 없고, 흙도 필요 없어요.\n내 두 손과 숨만 있으면 됩니다.\n\n네모, 동그라미, 세모, 반달, 구슬.\n이 다섯 모양을 아래부터 차례로 쌓으면\n오륜탑이라는 탑이 됩니다.\n땅, 물, 불, 바람, 허공 —\n내 몸을 이루고 있는 다섯 가지이지요.\n\n오늘 우리는 숨 한 번에 한 층씩,\n내 몸 위에 그 탑을 올립니다.\n\n호흡 약속은 딱 하나입니다.\n들이쉬면서 다음 모양으로 올라가고,\n내쉬면서 그 모양에 가만히 머뭅니다.\n숨을 억지로 길게 쉬려고 하지 마세요.\n지금 내 숨의 속도가 정답입니다.\n\n자, 편안하게 앉아\n양손을 무릎에 올립니다.\n여기가 탑을 세울 터입니다.\n\n첫 층 — 네모, 땅\n\n먼저 숨을 한 번 크게 내쉬며\n몸의 무게를 방석에 내려놓습니다.\n후우 —\n손은 무릎 위, 팔과 다리는 네모.\n탑의 기단이 놓였습니다.\n\n내쉬는 숨마다\n엉덩이가 조금 더 무거워지고\n바닥이 조금 더 든든해집니다.\n\"땅이 나를 받치고 있구나.\"\n한 호흡, 여기 머뭅니다.\n\n둘째 층 — 동그라미, 물\n\n들이쉬며 —\n두 손을 배 앞으로 모아 겹치고\n엄지를 맞대 동그라미를 만듭니다.\n\n내쉬며 —\n손안에 고인 물을 바라봅니다.\n찰랑이던 물도 가만히 두면 고요해지지요.\n숨이 드나들 때마다\n아랫배가 물결처럼\n천천히 불렀다가, 꺼집니다.\n한 호흡, 여기 머뭅니다.\n\n셋째 층 — 세모, 불\n\n들이쉬며 —\n손을 가슴 앞으로 올려 합장합니다.\n두 팔이 지붕처럼 세모를 이룹니다.\n\n내쉬며 —\n맞닿은 손바닥 사이,\n작은 온도가 느껴지시나요.\n숨을 내쉴 때마다\n그 자리가 조금씩 데워집니다.\n겨울날 두 손을 비벼 쥐던 것처럼요.\n한 호흡, 여기 머뭅니다.\n\n넷째 층 — 반달, 바람\n\n들이쉬며 —\n합장한 손을 얼굴로 가져와\n엄지 끝을 콧대에 살짝 댑니다.\n검지는 저절로 이마에 닿고,\n옆에서 보면 반달이 뜹니다.\n\n이제 숨이 가장 잘 보이는 자리입니다.\n들이쉴 때 코끝을 스치는 서늘한 바람,\n내쉴 때 손끝에 닿는 미지근한 바람.\n들어오는 숨, 나가는 숨.\n바람이 나를 살리고 있습니다.\n두 호흡쯤, 넉넉히 머뭅니다.\n\n다섯째 층 — 구슬, 허공\n\n들이쉬며 —\n손을 머리 위로 올리고\n손안에 공기를 살짝 품어\n물방울 모양의 구슬을 만듭니다.\n정수리 위, 탑의 꼭대기에\n구슬이 얹혔습니다.\n\n내쉬며 —\n숨을 따라 구슬이\n살짝 떠올랐다가, 내려앉습니다.\n들이쉬면 두웅 — 떠오르고\n내쉬면 사뿐 — 내려앉고.\n탑이 숨을 쉬고 있습니다.\n내가 숨을 쉬고 있습니다.\n한 호흡, 여기 머뭅니다.\n\n회향 — 모든 것은 변한다\n\n탑이 다 세워졌습니다.\n그런데 이 탑의 마지막 한 층은\n쌓는 것이 아니라, 내려놓는 것입니다.\n\n숨을 깊이 들이쉬고 —\n내쉬면서 두 팔로 크게 원을 그리며\n탑을 하늘에 풀어놓습니다.\n그리고 가슴 앞에 합장하며\n마음속으로 말합니다.\n\n\"모든 것은 변한다.\"\n\n정성껏 쌓은 탑도 언젠가 허물어지고,\n힘들었던 마음도 언젠가 지나갑니다.\n그래서 우리는 오늘도\n가볍게 쌓고, 가볍게 놓습니다.\n\n손을 무릎으로 돌려놓습니다.\n터만 남았습니다.\n다음 숨에, 또 쌓으면 됩니다.\n\n이어서 해봅니다\n\n이제 처음부터 이어서,\n숨과 함께 세 번 쌓아보겠습니다.\n제가 층 이름을 불러드릴게요.\n들이쉬며 올라가고, 내쉬며 머뭅니다.\n\n> (들이쉬고) 네모 — (내쉬며 머묾)\n> (들이쉬고) 동그라미 —\n> (들이쉬고) 세모 —\n> (들이쉬고) 반달 —\n> (들이쉬고) 구슬 —\n> (내쉬며) 모든 것은 변한다 ~ 합장.\n\n익숙해지면 정식 이름으로 —\n지륜정방, 수륜원, 화륜삼각, 풍륜반월, 공륜보주.\n\n마지막 한 번은 눈을 감고,\n소리 없이,\n숨이 손을 데려가는 대로 쌓아봅니다.\n\n(1분 후, 명상발우 땡)\n\n눈을 뜨셨을 때\n마음이 조금 가지런해져 있다면\n탑이 잘 세워진 것입니다.\n\n수고하셨습니다.\n\n───\n\n호흡을 붙인 방식을 정리하면 이렇습니다. 첫째, \"들숨 = 이동, 날숨 = 머묾\"이라는 단일 규칙이라 외울 게 없습니다. 동작 다섯 개에 호흡법 다섯 개를 따로 붙이면 다시 어려워지니까요. 둘째, 각 층마다 그 원소에 맞는 숨의 관찰 포인트를 하나씩만 심었습니다 — 땅은 날숨의 무게, 물은 배의 물결, 불은 손바닥 온도, 바람은 코끝 감각, 허공은 구슬의 오르내림. 결국 오대 이론을 강의가 아니라 몸의 감각으로 배우게 되는 구조예요. 셋째, \"쌓고 허무는\" 서사가 마지막 문장 '모든 것은 변한다'의 의미를 말로 설명하지 않고도 몸으로 전하게 해줍니다.\n\n걷기 명상도 이 틀로 잇고 싶으시면 \"한 걸음마다 탑돌이\" 버전으로 만들 수 있어요 — 필요하시면 말씀해 주세요.","duration":"","tags":"","series":"숨비명상"},{"id":"b6b0b01a","category":"멈춤","title":"간이역 명상","body":"늘봄명상 · 멈춤 단계\n예상 낭독 시간 : 약 11분\n\n───\n\n편안한 자세로 앉아 보세요.\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 올려놓습니다.\n\n준비가 되었다면,\n천천히 눈을 감아 보세요.\n\n우리는 아침에 눈을 뜨는 순간부터,\n달리기 시작합니다.\n밥을 먹으면서 오늘 할 일을 헤아리고,\n길을 걸으면서 어제 일을 되감고,\n잠자리에 누워서도\n내일 걱정을 미리 당겨 옵니다.\n몸은 여기 있는데,\n마음은 늘 어딘가로\n달려가고 있습니다.\n\n그렇게 달려온 마음은,\n기차를 닮았습니다.\n한번 속도가 붙은 생각의 기차는,\n세우려 한다고 서지 않습니다.\n멈추라고 다그칠수록,\n오히려 더 빨라질 뿐입니다.\n\n그런데, 한 가지\n할 수 있는 일이 있습니다.\n기차를 세우는 것이 아니라,\n내가, 내리는 것입니다.\n\n이제 마음속으로,\n달리는 기차 안에\n앉아 있는 나를 떠올려 보세요.\n\n기차는 빠르게 달리고 있습니다.\n창밖의 풍경은\n알아볼 수 없을 만큼\n흐릿하게 스쳐 지나갑니다.\n저 밖에 무엇이 있는지,\n지금이 어느 계절인지도 모른 채,\n기차는 그저 달립니다.\n어쩌면 우리의 많은 날들이,\n이렇게 지나갔는지도 모릅니다.\n\n그때, 기차가\n천천히 속도를 늦춥니다.\n작은 간이역 하나가\n가까워지고 있습니다.\n\n기차가 멈추고,\n문이 스르르 열립니다.\n\n서두르지 않아도 됩니다.\n천천히 자리에서 일어나,\n문 앞으로 걸어갑니다.\n그리고 한 발,\n플랫폼 위로 내려섭니다.\n\n발바닥이 땅에 닿는\n단단한 감각을 느껴 보세요.\n두 발이, 오랜만에\n멈춰 있는 땅을 딛고 섰습니다.\n\n등 뒤에서 문이 닫히고,\n기차가 다시 움직이기 시작합니다.\n기적 소리를 길게 울리며,\n기차는 점점 작아지다가,\n이윽고 산모퉁이 너머로 사라집니다.\n\n기차는 저렇게,\n계속 달리게 두어도 됩니다.\n생각은 원래 달리는 것이니까요.\n다만 이제,\n그 기차에 내가 타고 있지 않을 뿐입니다.\n\n기차 소리가 사라진 자리에,\n처음 듣는 것 같은\n고요가 내려앉습니다.\n\n그 고요 속에서,\n하나씩 들려오기 시작합니다.\n어디선가 지저귀는 새소리.\n플랫폼 곁 나무의\n잎사귀를 스치는 바람 소리.\n그리고,\n나의 숨소리.\n\n숨이 코끝으로 들어와,\n가슴을 지나,\n천천히 다시 나갑니다.\n달리는 동안에는\n한 번도 느끼지 못했던 숨입니다.\n숨은 언제나 여기 있었는데,\n내가 여기 없었을 뿐입니다.\n\n그리고 천천히,\n고개를 들어\n주위를 둘러봅니다.\n\n햇살이 플랫폼 위에\n따뜻하게 내려앉아 있습니다.\n철길 옆으로는\n이름 모를 들꽃들이 피어 있고,\n바람에는 옅은 꽃향기가\n실려 옵니다.\n\n달리는 동안에는, 몰랐습니다.\n창밖이 이렇게\n환한 봄이었다는 것을.\n\n봄은 어디 먼 곳에 있다가\n오는 것이 아니었습니다.\n내가 달리기를 멈추고\n내려서기만 하면,\n봄은 언제나\n이 자리에서 기다리고 있었습니다.\n멈추면, 늘, 봄입니다.\n\n플랫폼의 작은 나무 벤치에\n천천히 앉아 봅니다.\n햇살에 데워진 나무의 온기가\n등으로 전해집니다.\n\n이 벤치에 앉아,\n조금 전까지 나를 태우고 달리던 것들을\n가만히 떠올려 봅니다.\n그리고 하나씩,\n이름을 붙여 봅니다.\n\n나를 재촉하던 것은, '조바심'.\n가슴을 짓누르던 것은, '걱정'.\n자꾸만 뒤를 돌아보게 하던 것은, '후회'.\n\n이름을 붙이는 순간,\n그것들은 나를 태우고 달리던 기차에서,\n저만치 바라볼 수 있는\n승객이 됩니다.\n\n그리고 마음속으로,\n천천히, 한 글자씩,\n말해 봅니다.\n\n'나는, 멈출 수 있다.'\n\n한 번 더,\n가슴 깊은 곳에서.\n\n'나는, 언제든,\n멈출 수 있다.'\n\n이 말이 아직\n실감 나지 않아도 괜찮습니다.\n오늘 이렇게\n한 번 내려 본 것만으로,\n내 안에는 이미\n간이역 하나가 지어졌습니다.\n\n햇살 아래 벤치에서,\n봄바람을 느끼며,\n잠시 머물러 봅니다.\n아무것도 하지 않아도 되는,\n어디로도 가지 않아도 되는,\n온전한 멈춤의 시간입니다.\n\n이제 천천히,\n돌아올 준비를 합니다.\n살다 보면 나는 또,\n기차에 오르게 될 것입니다.\n그래도 괜찮습니다.\n이제 나는 알고 있으니까요.\n어느 역에서든,\n다시 내릴 수 있다는 것을.\n그리고 내리는 곳마다,\n봄이 기다리고 있다는 것을.\n\n손가락 끝을 가볍게 움직여 보세요.\n발가락도 천천히 움직여 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서,\n지금 앉아 있는 이 자리의 감각을\n느껴 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 보세요.\n\n오늘 하루,\n마음이 어딘가로 질주하고 있다고\n느껴지는 순간이 오면,\n그 자리에서 숨을 한 번,\n천천히 쉬어 보세요.\n그 숨 한 번이,\n나의 간이역입니다.\n\n───\n\n낭독 팁 : 기차가 달리는 도입부는 조금 빠른 호흡으로, 플랫폼에 내려서는 순간부터는 속도를 절반으로 뚝 떨어뜨려 낭독의 속도 변화 자체가 멈춤을 느끼게 하고, '나는, 멈출 수 있다'는 한 글자씩 또박또박 눌러 읽어 주세요.","duration":"","tags":"","series":"숨비명상"},{"id":"58403960","category":"멈춤","title":"멈춤 걷기 — 내가 나의 종이 되는 시간","body":"준비물 : 싱잉볼 1개(여운 긴 것) · 걷기 공간 · 음악 없음 — 이 세션의 음악은 종소리다 목소리 : 1라운드는 약간 빠르게(바쁜 공기),\n2라운드부터 낮고 느리게 대형 : 공간에 자유롭게 흩어져 서기 · 동선이 겹치지 않게 미리 넓힌다\n\n0:00 · 1분 · 열기\n\n지금부터 우리는,\n평생 해 온 일을 해 보겠습니다.\n바로, 걷는 일입니다.\n\n우리는 매일 수천 걸음을 걷지만,\n걸음을 기억하지는 못합니다.\n걷는 동안 마음은 늘 다른 곳에 가 있었으니까요.\n오늘은 그 걸음 속에서,\n멈추는 법을 배워 보겠습니다.\n\n종소리가 들리면,\n그 자리에서 동작을 멈추면 됩니다.\n그것이 전부입니다.\n\n▸ 거동이 불편한 참가자는 여기서 미리 안내 — 앉은 자리에서 물건을 집으려다 멈추는 동작으로 대체.\n원리는 동일하다.\n\n1:00 · 3분 · 1라운드 — 달리는 마음 발견하기\n\n이제 평소처럼 걸어 보세요.\n산책이 아니라,\n바쁜 날의 걸음으로.\n약속에 늦은 사람처럼,\n할 일을 헤아리면서.\n오늘 끝내야 할 일들을 머릿속에 하나씩 떠올리며 걸으세요.\n\n▸ 이 '바쁜 걸음' 유도가 세션의 성패를 가른다.\n명상하러 온 사람들은 처음부터 느리게 걷는다 — \"지하철 환승하듯이\",\n\"회의에 5분 늦었습니다\" 같은 상황 부여로 속도를 끌어올린다.\n자동조종이 만들어져야 멈춤의 대비가 선명해진다.\n\n— — — — —　걷기 30초~1분 · 말하지 않는다 → 종　— — — — —\n\n멈추세요. 그대로,\n조각상처럼.\n\n몸이 앞으로 쏠리는 것이 느껴지나요.\n그것이 관성입니다.\n그리고 지금,\n머릿속을 들여다보세요.\n몸은 멈췄는데,\n생각은 아직도 서너 걸음 앞서 걷고 있지 않나요.\n\n괜찮습니다.\n그것을 알아차린 것만으로,\n멈춤은 이미 시작되었습니다.\n\n▸ 걷기 — 종 — 멈춤을 1~2회 더 반복.\n조각상 멈춤에서 웃음이 터지면 그대로 허용한다 — 웃음이 어색함을 먼저 데려간다.\n▸ 종은 소리의 끝자락까지 듣게 둔다.\n여운이 사라진 뒤에 말을 시작한다.\n\n4:00 · 4분 · 2라운드 — 멈춤은 도착이다\n\n이번에도 걷다가 종소리에 멈춥니다.\n다만 멈춘 뒤에,\n세 가지를 순서대로 해 보겠습니다.\n\n첫째, 발바닥.\n땅에 닿아 있는 두 발의 감각을 느낍니다.\n둘째, 숨. 숨을 한 번,\n천천히 쉽니다. 셋째, 눈.\n고개를 들어,\n지금 눈앞에 있는 것 하나를 처음 보는 것처럼 바라봅니다.\n\n발바닥, 숨, 눈.\n이 세 걸음이,\n달리던 마음을 지금 여기로 데려오는 착지법입니다.\n\n— — — — —　걷기 — 종 — 멈춤·착지 2~3회 반복　— — — — —\n\n▸ 멈출 때마다 낮은 목소리로 \"발바닥… 숨… 눈…\"만 짚어 준다.\n그 외에는 말하지 않는다.\n\n(마지막 멈춤에서)\n\n방금, 무엇이 보였나요.\n창으로 들어온 빛 한 줄기,\n곁에 선 이의 얼굴.\n늘 지나치던 것들입니다.\n멈추기 전에는,\n보이지 않던 것들입니다.\n\n멈춤은 무언가를 그만두는 일이 아닙니다.\n멈춤은,\n지금 이 순간에 도착하는 일입니다.\n\n8:00 · 4분 · 3라운드 — 내가 나의 종이 되기 ★핵심\n\n이제, 마지막 라운드입니다.\n이번에는 종을 치지 않겠습니다.\n\n걷다가, 멈추고 싶은 순간에,\n스스로 멈추세요.\n언제 멈출지는 오직 나만이 정합니다.\n멈춘 자리에서 발바닥, 숨,\n눈.\n그리고 다시 걷고 싶어지면,\n걸으면 됩니다.\n\n옆 사람과 달라도 됩니다.\n나의 종은,\n나에게만 들립니다.\n\n— — — — —　자유 걷기·멈춤 3분 · 침묵을 넉넉히　— — — — —\n\n▸ 진행자도 함께 걷고,\n눈에 띄게 한 번 멈춘다 — 첫 멈춤의 물꼬를 진행자가 터 주면 눈치 보기가 사라진다.\n▸ 중간에 한 번만,\n조용히 :\n\n지금까지는 종이 나를 멈춰 주었습니다.\n지금은,\n내가 나를 멈추고 있습니다.\n\n*(마지막에,\n모두가 멈춘 상태에서)*\n\n이대로,\n잠시 서 있어 보세요.\n\n살면서 우리를 멈춰 주는 종은 아무도 쳐 주지 않습니다.\n그래서 우리는 달렸습니다.\n멈춰도 된다는 것을,\n아무도 말해 주지 않았으니까요.\n\n오늘,\n여러분은 자신의 종이 되는 법을 배웠습니다.\n걸음을 스스로 멈출 수 있는 사람은,\n마음도 스스로 멈출 수 있습니다.\n\n12:00 · 2분 · 닫기 — 한 걸음,\n한 호흡\n\n이제 각자의 자리로 돌아가겠습니다.\n다만 마지막 걸음들은,\n한 걸음에 한 호흡씩,\n세상에서 가장 느린 걸음으로.\n\n숨을 들이쉬며 한 발,\n내쉬며 한 발.\n이 몇 걸음이,\n오늘 이 시간이 우리에게 주는 작별 인사입니다.\n\n14:00 · 1분 · 일상으로 잇는 다리\n\n집으로 돌아가시면,\n종은 없습니다.\n그런데 가만히 보면,\n세상은 이미 우리에게 종을 쳐 주고 있습니다.\n\n빨간 신호등,\n열리지 않는 엘리베이터,\n길게 늘어선 줄.\n지금까지는 나를 가로막는 짜증이었던 것들이,\n오늘부터는 나를 멈춰 주는 종소리가 될 수 있습니다.\n\n빨간불 앞에 서면 — 발바닥,\n숨, 눈. 그 삼십 초가,\n하루 한가운데 놓인 나의 간이역입니다.\n\n수고하셨습니다.\n\n▸ 감정 나눔으로 이어갈 경우의 첫 질문 — \"스스로 멈춘 순간, 무엇이 달랐나요?\"\n\n자주 터지는 지점\n\n*1라운드에서 바쁜 걸음이 안 나온다 명상 프로그램에 온 참가자는 시키지 않아도 느리게 걷는다.\n\"회의에 5분 늦었습니다\" 식의 구체적 상황을 입혀 속도를 만든다.\n여기서 대비를 못 만들면 멈춤의 체감이 절반으로 준다.\n\n**3라운드에서 아무도 먼저 멈추지 않는다** 서로 눈치를 보며 남을 따라 멈춘다.\n진행자가 먼저 한 번 멈추어 물꼬를 트고,\n시작 전에 \"옆 사람과 달라도 됩니다\"를 반드시 넣는다.\n\n*공간이 좁아 동선이 엉킨다 부딪힘이 잦으면 주의가 밖으로 샌다.\n시작 전에 걷는 방향을 한 방향(시계 반대)으로 정해 주면 해결된다.\n\n*조각상 멈춤에서 웃음이 터진다 문제가 아니라 재료다.\n억누르지 말고 한 박자 웃게 둔 뒤 \"웃음도 멈춰 보세요\" 하면 오히려 집중이 깊어진다.\n\n절대 금지\n\n3라운드에서 종을 다시 치지 않는다 — 참가자들이 우왕좌왕해 보여도 기다린다.\n주도권이 종에서 나에게로 넘어오는 것이 이 기법의 심장이다.\n\"잘 멈추셨네요\" — 멈춤을 평가하는 순간,\n참가자는 멈춤조차 잘하려고 애쓰기 시작한다.\n특정 참가자를 지목해 시범으로 세우지 않는다.","duration":"약 15분","tags":"#멈춤걷기 #멈춤 #걷기명상","series":"숨비명상"},{"id":"c4737864","category":"멈춤","title":"늘봄 꽃이 피었습니다.","body":"늘봄 꽃이 피었습니다\n\n늘봄명상 · 멈춤 단계 — 놀이형 기법 부제 : 멈춘 자리마다 꽃이 핍니다 소요 시간 : 약 15분 (움직일 공간 필요,\n도구 없음)\n\n───\n\n기법의 원리\n\n'무궁화 꽃이 피었습니다'는 한국 사람이라면 누구나 몸으로 기억하는 멈춤의 놀이다. 술래가 돌아보는 순간 세상이 통째로 정지하는 그 짜릿한 정적을, 우리는 일곱 살 때 이미 놀이로 즐겼다. 즉, 멈춤은 우리가 배워야 할 낯선 기술이 아니라, 한때 가장 잘하던 놀이였다. 이 기법은 그 몸의 기억을 깨워, 웃음 속에서 멈춤을 되찾게 한다.\n\n놀이의 구호를 '늘봄 꽃이 피었습니다'로 바꾸는 순간, 이 오래된 놀이는 프로그램의 철학을 품게 된다. 구호가 끝나는 순간이 곧 멈추는 순간이고, 멈추는 순간이 곧 꽃이 피는 순간이다. 멈춘 자리마다 꽃이 핀다 — 멈추면 늘 봄이라는 늘봄명상의 핵심이, 놀이의 규칙 속에 그대로 들어 있다.\n\n첫 주의 별칭 짓기가 참가자를 일곱 살 이전으로 데려가듯, 이 놀이는 몸을 일곱 살로 데려간다. 웃음으로 경계가 허물어진 몸은 명상을 훈련이 아니라 기쁨으로 받아들인다. 세 라운드에 걸쳐 놀이는 점점 느려지고 고요해지며, 마지막에는 웃음이 자연스럽게 정적으로, 놀이가 명상으로 건너간다.\n\n───\n\n진행 절차와 멘트\n\n열기 (2분)\n\n혹시 기억하시나요.\n\"무궁화 꽃이 피었습니다.\"\n\n담벼락에 이마를 대고 외치던 술래,\n그 등 뒤에서 살금살금 다가가다,\n술래가 홱 돌아보면\n숨도 쉬지 않고 얼어붙던 순간.\n\n그때 우리는,\n하루에도 수십 번씩 멈췄습니다.\n누가 가르쳐 주지 않아도,\n멈춤을 놀이로 즐길 줄 알았습니다.\n오늘은 그 놀이를,\n다시 해 보겠습니다.\n딱 하나, 구호만 바꾸어서.\n\n\"늘봄 꽃이 피었습니다.\"\n\n1라운드 — 일곱 살로 돌아가기 (4분)\n\n*(진행자 또는 지원자가 술래가 되어 벽을 보고 선다. 규칙은 어릴 적 그대로. 단, 움직이다 들킨 사람은 탈락하는 대신 그 자리에서 두 팔로 꽃봉오리 자세를 3초 하고 다시 놀이에 합류한다. 아무도 놀이 밖으로 밀려나지 않는다.)*\n\n규칙은 아시는 그대로입니다.\n제가 \"늘봄 꽃이 피었습니다\"를 외치는 동안\n저에게 다가오시고,\n제가 돌아보는 순간, 멈추시면 됩니다.\n\n움직이다 들키셔도 괜찮습니다.\n들킨 분은 그 자리에서\n꽃봉오리처럼 두 팔을 모아\n꽃 한 송이 피우고 오시면 됩니다.\n이 놀이에서는, 들켜도 꽃이 핍니다.\n\n*(빠른 템포로 서너 판 진행한다. 웃음이 터지도록 술래는 예고 없이 빨리 돌아보기도, 뜸을 들이기도 한다. 참가자가 술래 등을 짚으면 술래를 교대한다.)*\n\n2라운드 — 느린 꽃 (4분)\n\n이번에는 규칙이 하나 늘어납니다.\n구호가 두 배로 느려집니다.\n\"느을보옴 꼬옻이 피이었습니다아.\"\n그리고 여러분도,\n달리는 대신\n세상에서 가장 느린 달리기로\n다가오셔야 합니다.\n\n*(구호를 길게 늘여 외친다. 슬로모션으로 움직이는 몸들에서 웃음이 나온다. 멈춤도 길어진다. 돌아본 채로 5~10초씩 머물며, 얼어붙은 참가자들에게 조용히 말한다.)*\n\n멈춘 그대로, 느껴 보세요.\n방금까지 뛰던 심장이\n가슴에서 두근거리고 있습니다.\n숨이 저 혼자\n들어오고 나가고 있습니다.\n흔들려도 괜찮습니다.\n꽃도, 바람에 흔들리면서 핍니다.\n\n*(두세 판 반복한다. 판이 거듭될수록 구호는 더 느리게, 멈춤은 더 길게.)*\n\n3라운드 — 눈 감은 꽃 (4분)\n\n마지막 판입니다.\n이번에는 술래가 없습니다.\n아니, 술래가 제 목소리입니다.\n\n제가 아주 천천히\n\"늘봄 꽃이 피었습니다\"를 외치는 동안,\n여러분은 이 공간을\n자유롭게 걸어 다니세요.\n그리고 구호가 끝나는 순간,\n그 자리에 멈추어\n가만히 눈을 감으시면 됩니다.\n\n*(한 번 연습한 뒤, 마지막 판. 가장 느린 구호 후 전원이 멈추어 눈을 감으면, 20~30초의 정적 속에서 낮은 목소리로 말한다.)*\n\n이대로, 잠시.\n\n조금 전까지\n이 방에는 웃음소리가 가득했습니다.\n지금은,\n숨소리만 남았습니다.\n움직임에서 멈춤까지,\n웃음에서 고요까지,\n우리는 방금 놀이처럼 건너왔습니다.\n\n어릴 적 그 골목에서도 그랬습니다.\n술래가 돌아보는 순간,\n우리는 완벽하게 멈출 줄 알았습니다.\n멈춤은 새로 배우는 것이 아니라,\n이미 내 몸이 기억하고 있는 것입니다.\n우리는 모두,\n멈춤의 명수였습니다.\n\n그리고 이 구호의 비밀을\n이제 아시겠지요.\n구호가 끝나는 순간 우리는 멈추고,\n멈추는 바로 그 순간,\n꽃이 핍니다.\n멈춘 자리마다, 꽃이 핍니다.\n멈추면, 늘, 봄입니다.\n\n자, 이제 천천히\n눈을 떠 보세요.\n\n봄입니다.\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n이 놀이는 혼자서도 할 수 있습니다.\n술래도 필요 없고, 골목도 필요 없습니다.\n\n하루 중 마음이 바빠질 때,\n속으로 딱 한 번,\n아주 천천히 외워 보세요.\n'늘봄 꽃이 피었습니다.'\n그리고 그 구호가 끝나면,\n하던 것을 잠시 멈추는 겁니다.\n\n이 열 글자를 천천히 외우는\n삼 초의 시간이,\n나만 아는 멈춤의 놀이가 됩니다.\n설거지를 하다가도,\n답장을 쓰다가도,\n화가 목까지 차오르다가도.\n구호가 끝나는 자리에,\n꽃 한 송이 피워 보세요.\n\n───\n\n진행 팁\n\n- 1라운드는 명상이 아니라 순수한 놀이여야 한다. 진행자가 먼저 크게 웃고 장난스럽게 술래를 맡을수록, 3라운드의 정적이 깊어진다. 웃음의 진폭이 곧 고요의 진폭이다.\n- '들키면 꽃봉오리 자세 후 복귀' 규칙은 반드시 지킨다. 탈락이 없어야 몸이 굳은 어르신도, 동작이 느린 분도 끝까지 놀이 안에 머문다.\n- 2라운드의 슬로모션은 셋째 주 늘보 걷기의 예고편이 된다. \"이 느린 걸음, 셋째 주에 다시 만납니다\" 한마디를 얹어도 좋다.\n- 3라운드의 마지막 정적에서 멘트를 서두르지 않는다. 웃음의 잔열이 가라앉고 숨소리가 들릴 때까지 기다렸다가 말문을 연다.\n- 감정 나눔 질문: \"마지막에 눈을 감고 멈춰 섰을 때, 몸과 마음에서 무엇이 느껴졌나요?\" / \"어릴 적 이 놀이를 하던 나에게, 지금 한마디를 건넨다면?\"\n- 공간이 좁거나 거동이 어려운 참가자가 많은 경우, 제자리에 앉아 두 팔만 자유롭게 움직이다 구호 끝에 멈추는 좌식 판으로 대체할 수 있다.","duration":"","tags":"놀이형","series":"숨비명상"},{"id":"31c7d823","category":"멈춤","title":"비눗방울 명상","body":"늘봄명상 · 멈춤~흘려보내기 — 놀이형 기법 부제 : 잡으려 하면 터지고,\n바라보면 무지개빛 소요 시간 : 약 15분 (1인 1개 비눗방울 통,\n실내는 바닥 수건 준비 또는 야외 진행)\n\n───\n\n기법의 원리\n\n첫째 주의 목표는 생각을 누르는 헛된 싸움을 멈추고, 흘려보내는 법의 첫 단추를 끼우는 것이다. 비눗방울은 이 원리를 통째로 담고 있는 물건이다. 비눗방울은 잡으려 하면 터진다. 그러나 가만히 바라보면, 무지개빛으로 반짝이며 저 혼자 떠오르다, 저 혼자 사라진다. 생각과 감정을 다루는 법이 이 한 문장에 다 들어 있다. 움켜쥐려는 순간 우리를 괴롭히고, 바라보며 놓아두면 저절로 지나간다.\n\n이 기법에는 숨은 장치가 하나 더 있다. 큰 비눗방울을 만들려면 세게 불면 안 된다. 길고, 가늘고, 부드럽게 내쉬어야 한다. 즉, 큰 방울 만들기 놀이에 열중하는 동안 참가자는 자기도 모르게 가장 깊은 이완의 날숨을 훈련하게 된다. \"천천히 내쉬세요\"라는 지시 없이, 놀이의 규칙이 호흡을 가르치는 것이다.\n\n그리고 마지막에, 방울이 사라지는 끝자락을 바라보는 일은 소리끝 잡기의 시각판이 된다. 모든 것은 일어났다 사라진다는 무상의 이치가, 무지개빛으로 반짝이다 톡 터지는 방울 하나에 담겨 눈앞에서 증명된다.\n\n───\n\n진행 절차와 멘트\n\n열기 (2분)\n\n*(참가자 한 사람 한 사람에게 비눗방울 통을 나눠 준다. 받는 순간 대부분 웃는다. 그 웃음이 이미 시작이다.)*\n\n손에 쥐신 것, 참 오랜만이지요.\n마지막으로 비눗방울을 불어 본 게\n언제였는지, 기억나시나요.\n\n어릴 적 우리는 알고 있었습니다.\n비눗방울은 잡으려 하면\n터진다는 것을.\n그래서 잡는 대신,\n날아가는 것을 바라보며\n좋아했습니다.\n\n오늘은 그 오래된 지혜를,\n다시 꺼내 보겠습니다.\n\n1라운드 — 마음껏 불기 (3분)\n\n먼저, 아무 규칙 없이\n마음껏 불어 보세요.\n크게, 작게, 많이.\n쫓아가서 터뜨리셔도 좋습니다.\n일곱 살처럼.\n\n*(공간이 방울과 웃음으로 가득 차게 둔다. 진행자도 함께 분다. 충분히 논 뒤에.)*\n\n지금 이 방의 공기가,\n조금 전과 다르지요.\n놀이는 이렇게,\n마음의 문을 먼저 엽니다.\n\n2라운드 — 큰 방울의 비밀 (4분)\n\n이번에는 시합입니다.\n가장 크고, 가장 오래가는\n방울을 만들어 보세요.\n\n*(잠시 시도하게 둔다. 세게 불다 터뜨리는 사람들이 나온다.)*\n\n세게 불면, 터지지요.\n큰 방울의 비밀은 힘이 아닙니다.\n숨을 길게, 가늘게,\n부드럽게 내쉬는 것입니다.\n급할수록 터지고,\n느릴수록 커집니다.\n\n다시 한 번 해 보세요.\n이번에는 세상에서\n가장 느린 숨으로.\n\n*(큰 방울이 떠오르면 함께 감탄한다. 그리고 조용히 짚어 준다.)*\n\n방금 여러분은,\n자신도 모르는 사이에\n가장 깊은 이완의 호흡을\n하고 계셨습니다.\n몸에서 힘을 빼고,\n길고 부드럽게 내쉬는 숨.\n비눗방울이,\n호흡 선생님이었던 셈입니다.\n\n3라운드 — 마음 띄워 보내기 (4분)\n\n이제, 이 놀이의\n가장 깊은 자리로 가 보겠습니다.\n\n잠시 눈을 감고,\n요즘 마음을 무겁게 하는 것\n하나를 떠올려 보세요.\n걱정 하나, 서운함 하나,\n누구에게도 말 못 한 마음 하나.\n\n떠올랐다면, 눈을 뜨고,\n이번 숨에 그 마음을 실어,\n방울 하나에 담아 불어 보세요.\n길고, 부드럽게.\n\n*(방울들이 떠오른다. 낮은 목소리로.)*\n\n이제, 잡지 마세요.\n그저 바라보기만 합니다.\n\n무겁던 마음이 담긴 방울인데,\n보세요.\n햇빛 아래에서\n무지개빛으로 반짝이며\n떠가고 있습니다.\n잡으려 하면 터지지만,\n바라보면, 무지개빛입니다.\n우리의 생각과 감정도\n꼭 그렇습니다.\n\n그리고 방울은,\n누가 터뜨리지 않아도\n저 혼자, 톡, 사라집니다.\n아무리 무거운 마음을 담아도,\n방울은 영원히 떠 있지 않습니다.\n어떤 감정도, 그렇습니다.\n\n보내고 싶은 마음이 더 있다면,\n몇 번이고 숨에 실어\n띄워 보내세요.\n\n*(충분히 보내게 한 뒤.)*\n\n마지막 방울은,\n무거운 마음 대신\n고마운 마음을 담아 보겠습니다.\n떠오르는 얼굴 하나에게\n잘 지내라는 인사를 실어,\n가장 곱게, 띄워 보내세요.\n\n닫기 — 사라진 자리 (2분)\n\n*(마지막 방울들이 사라질 때까지 침묵으로 기다린다. 그리고.)*\n\n방울이 사라진 자리를\n잠시 바라보세요.\n아무것도 남지 않았습니다.\n그토록 반짝이던 것이\n흔적 없이 사라졌는데,\n이상하지요.\n슬프지 않습니다.\n\n어릴 적 우리는,\n터질 것을 알면서도 불었습니다.\n사라질 것을 알기에,\n방울은 더 반짝였습니다.\n우리의 하루하루도\n그런 것인지 모릅니다.\n\n지나갈 것을 알기에,\n지금 이 순간이 반짝입니다.\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n집에는 비눗방울이 없어도 됩니다.\n우리에게는 이미\n방울을 만드는 숨이 있으니까요.\n\n살다가, 한숨이 나오는 순간이 있지요.\n이제부터 그 한숨을\n비눗방울이라고 생각해 보세요.\n무거운 마음 하나를 숨에 실어,\n방울을 불듯\n길고 부드럽게 내쉬는 겁니다.\n\n한숨은 실패의 숨이 아닙니다.\n몸이 저 스스로 알고 있는,\n흘려보내기입니다.\n오늘부터 한숨 한 번이,\n비눗방울 하나입니다.\n\n───\n\n진행 팁\n\n- 실내 진행 시 바닥이 미끄러워질 수 있으니 수건을 깔거나, 가능하면 야외(마당, 잔디밭)에서 진행한다. 야외의 햇빛은 방울의 무지개빛을 살려 3라운드의 감동을 크게 키운다.\n- 2라운드의 시합은 승패를 가리지 않는다. 큰 방울이 뜰 때마다 다 함께 감탄하는 것으로 충분하다. 감탄 자체가 지금-여기로의 주의 집중이다.\n- 3라운드에서 눈물을 보이는 참가자가 있을 수 있다. 자연스러운 일이므로 개입하지 않고, \"올라오는 마음도 방울에 실어 보내셔도 됩니다\" 한마디면 족하다.\n- 마지막 '고마운 마음 방울'은 다섯째 주 자비 명상의 씨앗이 된다. \"이 방울, 다섯째 주에 다시 만납니다\"라고 예고해도 좋다.\n- 호흡기가 약한 참가자는 불기 대신, 다른 사람이 띄운 방울을 바라보고 사라지는 끝자락을 좇는 역할로 함께한다. 바라보기만으로도 이 명상의 핵심은 온전히 경험된다.\n- 감정 나눔 질문: \"마음을 담은 방울이 터지는 순간, 어떤 느낌이 들었나요?\" / \"잡고 싶었던 방울이 있었나요?\"\n\n───\n\n수정하고 싶은 대목이 있으면 말씀해 주세요.","duration":"","tags":"놀이형","series":"숨비명상"},{"id":"78adc9ef","category":"관찰","title":"마음 일기예보","body":"늘봄명상 · 관찰 단계 — 놀이형 기법 부제 : 일기예보는 비를 탓하지 않습니다 소요 시간 : 약 20분 (도구 없음,\n장난감 마이크가 있으면 재미가 커진다)\n\n───\n\n기법의 원리\n\n관찰의 핵심은 판단하지 않고 바라보는 것이다. 그러나 \"판단하지 마세요\"라는 지시는 그 자체로 또 하나의 판단을 부른다. 이 기법은 지시 대신 형식을 준다. 일기예보라는 형식이다.\n\n일기예보는 세상에서 가장 완벽한 관찰의 언어다. 예보관은 비를 나쁘다고 하지 않고, 맑음을 착하다고 하지 않는다. 흐림을 부끄러워하지도, 숨기지도 않는다. 그저 관측하고, 알려 줄 뿐이다. 참가자가 자기 마음을 일기예보의 언어로 옮기는 순간, 판단 없는 관찰이 규칙으로서 저절로 작동한다.\n\n여기에 두 겹의 거리가 장착된다. 하나는 별칭에 의한 삼인칭이다. \"나는 우울하다\"가 아니라 \"나비 지방에 안개가 끼어 있습니다\"라고 말할 때, 셋째 주 강 건너 불구경의 탈중심화가 일어난다. 다른 하나는 날씨라는 은유다. 감정을 날씨로 옮기는 순간, 무상의 이치가 딸려 온다. 어떤 감정도 기후가 아니라 날씨이며, 날씨는 반드시 지나간다.\n\n마지막으로 이 기법은 방송이라는 놀이로 진행된다. 아나운서 말투가 웃음을 부르고, 그 웃음이 무거운 마음을 말할 용기를 만든다. 그리고 서로의 예보를 듣는 순간, 이 기법의 가장 깊은 감동이 온다. 맑기만 한 지방은, 한 곳도 없다는 발견이다.\n\n───\n\n진행 절차와 멘트\n\n열기 — 시범 방송 (3분)\n\n*(진행자가 장난감 마이크를 들고, 진짜 기상 캐스터처럼 자신의 마음 일기예보를 먼저 방송한다. 진행자의 자기 개방이 안전한 분위기를 만든다.)*\n\n안녕하십니까,\n늘봄 기상센터입니다.\n현재 저의 마음 지방은\n대체로 맑은 가운데,\n아침 출근길에\n조바심 돌풍이 잠시 불었습니다.\n지금은 바람이 잦아들었으나,\n어깨 부근에\n긴장 구름이 조금 남아 있습니다.\n마음 기온은 따뜻한 편입니다.\n이상, 마음 일기예보였습니다.\n\n*(웃음이 나면 성공이다.)*\n\n방금 들으신 것이,\n오늘 우리가 배울\n관찰의 언어입니다.\n일기예보는 비를 탓하지 않습니다.\n흐림을 숨기지도 않습니다.\n그저, 하늘을 보고,\n본 대로 알려 줄 뿐입니다.\n오늘 우리는 모두,\n자기 마음의 예보관이 되어 봅니다.\n\n1단계 — 하늘 살피기 (4분)\n\n*(전원 눈을 감게 한다.)*\n\n예보관의 첫 일은,\n하늘을 살피는 것입니다.\n눈을 감고,\n지금 내 마음의 하늘을\n천천히 올려다보세요.\n\n지금 하늘은 어떤가요.\n맑은가요, 흐린가요.\n안개가 끼어 있나요,\n바람이 부나요.\n\n오늘 하루 지나간 날씨도\n돌아봅니다.\n오전에 소나기가 있었나요.\n언제쯤 볕이 들었나요.\n\n마음의 기온도 재어 봅니다.\n따뜻한가요, 서늘한가요.\n\n그리고 예보관답게,\n관측 장비인 몸도 확인합니다.\n그 날씨가 몸 어디에서\n느껴지고 있나요.\n가슴인가요, 어깨인가요,\n배 언저리인가요.\n\n좋은 날씨도, 궂은 날씨도\n없습니다.\n지금은 그저,\n관측하는 시간입니다.\n\n2단계 — 예보 작성 (3분)\n\n이제 눈을 뜨고,\n관측한 것을\n예보 문장으로 만들어 봅니다.\n형식은 이렇습니다.\n\n\"현재 (별칭) 지방은, (하늘 상태)입니다.\n오늘 (지나간 날씨)가 있었고,\n마음 기온은 (따뜻함/서늘함)입니다.\n몸의 (부위)에서 (감각)이\n관측되고 있습니다.\"\n\n한 가지 규칙만 있습니다.\n예보에는 판단이 들어가지 않습니다.\n'짜증 나 죽겠다'가 아니라\n'짜증 소나기가 지나가는 중이다',\n'내가 왜 이럴까'가 아니라\n'안개가 짙어 시야가 흐리다'.\n예보관은 하늘을 혼내지 않습니다.\n\n3단계 — 방송 (6분)\n\n*(둘씩 짝을 짓는다. 마이크를 주고받으며 서로에게 방송한다. 인원이 적으면 전체 앞에서 한 사람씩 해도 좋다. 아나운서 말투를 장려한다. 웃음이 나는 것이 정상이며, 웃음 속에서 뜻밖에 진솔한 예보들이 나온다.)*\n\n자, 이제 생방송입니다.\n짝에게 마이크를 넘겨받으면,\n최대한 진지한\n아나운서의 목소리로\n자기 지방의 일기예보를\n방송해 주세요.\n\n듣는 분의 역할도 있습니다.\n평가하지 않고, 조언하지 않고,\n끝까지 들은 뒤\n이렇게만 답해 주세요.\n\"제보 감사합니다.\n(별칭) 지방의 하늘을,\n잘 들었습니다.\"\n\n닫기 — 모든 하늘에는 구름이 있다 (4분)\n\n*(방송이 모두 끝난 뒤, 잠시 정적을 두고.)*\n\n오늘 이 방의\n일기예보를 다 들어 보니,\n한 가지가 분명해졌습니다.\n\n맑기만 한 지방은,\n단 한 곳도 없었습니다.\n\n누구의 하늘에나\n구름이 있었습니다.\n소나기가 지나간 지방도,\n안개가 짙은 지방도,\n찬 바람이 부는 지방도 있었습니다.\n내 하늘만 흐린 줄 알았는데,\n아니었습니다.\n우리는 모두,\n저마다의 날씨를 살아 내고 있는\n중이었습니다.\n\n그리고 예보관은\n한 가지를 더 알고 있습니다.\n날씨는, 반드시 지나간다는 것.\n아무리 긴 장마도\n끝나지 않은 적이 없고,\n아무리 짙은 안개도\n걷히지 않은 적이 없습니다.\n지금 어느 지방에\n폭풍이 지나가고 있더라도,\n그 하늘 위에는\n변함없는 파란 하늘이\n기다리고 있습니다.\n\n우리가 오늘 배운 관찰이란,\n날씨와 싸우는 일이 아니라,\n그 파란 하늘의 자리에서\n날씨를 바라보는 일입니다.\n\n───\n\n일상으로 잇는 다리 (마무리 멘트)\n\n오늘부터 하루에 한 번,\n잠들기 전 삼십 초만\n나에게 일기예보를 해 보세요.\n\"오늘 내 지방은 어떤 하늘이었나.\"\n쓰지 않아도 됩니다.\n속으로 방송하면 됩니다.\n\n그리고 한 걸음 더 나아가고 싶다면,\n저녁 식탁에서 가족에게\n이렇게 물어보세요.\n\"오늘 당신의 하늘은 어땠어요?\"\n\n\"오늘 어땠어?\"라는 물음에는\n\"그냥 뭐\"라고 답하던 사람도,\n하늘을 물으면\n날씨를 이야기하기 시작합니다.\n아이의 소나기를,\n배우자의 안개를,\n우리는 그렇게 처음으로\n듣게 될지도 모릅니다.\n\n───\n\n진행 팁\n\n- 진행자의 시범 방송이 이 기법의 절반이다. 진행자가 자신의 흐린 날씨를 유머와 함께 먼저 열어 보일수록, 참가자들의 예보가 솔직해진다.\n- 판단어가 섞인 예보가 나오면 지적하지 말고, \"그것을 날씨로 옮기면 어떻게 될까요?\" 하고 되물어 스스로 관측어를 찾게 한다. (예: \"짜증 나 미치겠어요\" → \"짜증 태풍이 상륙 중이군요. 풍속은 어느 정도인가요?\")\n- 폭풍이나 한파처럼 무거운 예보가 나오더라도 놀라지 않고 같은 형식으로 받는다. \"제보 감사합니다. 지금 그 폭풍이 몸의 어디에서 관측되나요?\" 형식이 유지되는 한, 무거운 감정도 안전하게 다뤄진다.\n- 이 기법은 산 명상과 한 쌍이다. 일기예보가 날씨를 바라보는 연습이라면, 산 명상은 그 날씨 아래 흔들리지 않는 자리의 체험이다. \"이 날씨들을 맞으며 서 있는 산을, 다음에 만나러 갑니다\"로 예고하면 좋다.\n- 감정 나눔 질문: \"내 마음을 날씨로 말해 보니, 무엇이 달랐나요?\" / \"다른 지방의 예보를 들으며 어떤 마음이 들었나요?\"","duration":"","tags":"놀이형","series":"숨비명상"},{"id":"32ef1efb","category":"관찰","title":"마음 유리병― 가라앉으면, 보인다","body":"(진행자는 색색의 모래가 가라앉은 유리병을 들어 보인다)\n\n여기,\n유리병이 하나 있습니다.\n\n안에는 맑은 물이 담겨 있고,\n바닥에는 색색의 모래가 가라앉아 있습니다.\n\n오늘은 이 병이,\n우리의 마음이 되어 줄 것입니다.\n\n이 물이 마음이라면,\n이 모래알들은 마음속에 떠오르는 생각과 감정들입니다.\n\n노란 모래는 신나는 마음,\n파란 모래는 슬픈 마음,\n빨간 모래는 화나는 마음.\n\n오늘 아침 눈을 떴을 때,\n여러분 마음에는 무슨 색이 있었나요.\n\n마음속으로,\n그 색을 하나 골라 보세요.\n\n자,\n이제 이 병을 흔들어 보겠습니다.\n\n(유리병을 세게 흔들어 눈높이로 든다)\n\n색색의 모래가 정신없이 소용돌이칩니다.\n\n이것이 바로, 너무 바쁠 때,\n화가 났을 때,\n마음이 언짢을 때의 우리 속마음입니다.\n\n지금,\n이 물속이 들여다보이나요.\n\n무엇이 어디에 있는지,\n하나도 보이지 않지요.\n\n마음이 소용돌이치는 날,\n우리 속도 꼭 이렇습니다.\n\n이제 종소리가 울리면,\n숨을 크게 한 번 들이쉬고,\n천천히 내쉬면서,\n\n모래가 가라앉는 모습을 말없이 지켜보겠습니다.\n\n*(종을 울리고,\n병을 가만히 내려놓는다)*\n\n숨을 들이쉬고,\n\n내쉬고.\n\n서두르는 모래는 하나도 없습니다.\n\n큰 알갱이가 먼저,\n작은 알갱이는 천천히,\n\n빙글빙글 돌면서,\n바닥으로 내려앉습니다.\n\n우리는 아무것도 하지 않았습니다.\n\n그저 숨을 쉬며,\n지켜보았을 뿐입니다.\n\n(모래가 다 가라앉을 때까지 기다린다)\n\n자,\n이제 물이 어떻게 보이나요.\n\n맑아졌습니다.\n\n그런데, 잘 보세요.\n\n모래는, 사라지지 않았습니다.\n\n바닥에, 그대로 있습니다.\n\n생각과 감정도 없어진 것이 아닙니다.\n그저, 가라앉았을 뿐입니다.\n\n그런데도 물은 이렇게 맑고,\n\n우리는 이제 병 속을 훤히 들여다볼 수 있습니다.\n\n생각과 감정을 없애지 않고도,\n마음을 선명하게 볼 수 있다는 것.\n\n이것이 명상이 우리 마음에서 하는 일입니다.\n\n한 가지만 더,\n기억해 주세요.\n\n흐린 물은,\n휘저어서 맑아지지 않습니다.\n\n가만히 두면,\n저절로 맑아집니다.\n\n마음도 같습니다.\n\n마음이 소용돌이치는 날,\n소용돌이와 싸우지 말고,\n숨으로 돌아와 가만히 기다려 주세요.\n\n그 한 번의 숨이,\n종소리가 되어 줍니다.\n\n그러면 언제 어디서든,\n지금 내 마음속에서 무슨 일이 일어나고 있는지,\n\n맑은 물 너머로,\n또렷이 보게 될 것입니다.","duration":"","tags":"#마음유리병 #관찰 #가라앉히기","series":"숨비명상"},{"id":"a895597d","category":"관찰","title":"소리 지도","body":"늘봄명상 · 관찰 단계 — 감각형 기법 부제 : 같은 방에서,\n우리는 서로 다른 세계를 듣는다 소요 시간 : 약 20분 준비물 : 1인당 종이 1장과 펜(색연필이 있으면 좋다),\n마무리용 종 또는 싱잉볼\n\n───\n\n기법의 원리\n\n소리는 관찰을 배우기에 가장 좋은 대상이다. 붙잡을 수도, 멈출 수도, 미리 정할 수도 없기 때문이다. 소리는 저 혼자 일어나 저 혼자 사라진다. 그러니 소리 앞에서 우리가 할 수 있는 일은 하나뿐이다. 오는 것을 맞이하고, 가는 것을 보내는 것. 그것이 곧 개방적 관찰의 태도다.\n\n이 기법은 그 관찰에 두 가지를 더한다. 하나는 지도 그리기라는 행동이다. 들은 소리를 종이 위에 방향과 거리로 옮기는 순간, 흘러가던 관찰이 눈에 보이는 기록이 된다. 다른 하나는 비교라는 재미다. 같은 방에 앉아 같은 시간을 보냈는데, 완성된 지도는 저마다 다르다. 이 발견이 이 기법의 심장이다. 우리는 같은 세계에 사는 것이 아니라, 각자가 관찰한 세계에 산다. 내 지도에 없는 소리가 옆 사람의 지도에 있다는 사소한 사실이, 타인 이해의 문을 여는 큰 통찰이 된다.\n\n그리고 지도의 중심에서 마지막 감동이 기다린다. 모든 소리 지도의 한가운데에는 나의 숨소리가 있다. 가장 가까운 소리를 가장 오래 잊고 살았다는 것 — 둘째 주 원초음 명상으로 건너가는 다리다.\n\n───\n\n진행 절차와 멘트\n\n열기 — 소리 세어 보기 (2분)\n\n질문 하나로 시작하겠습니다.\n지금 이 방에는,\n소리가 몇 개나 있을까요.\n\n*(참가자들이 두어 개를 꼽는다.)*\n\n두 개, 세 개.\n정말 그럴까요.\n지금부터 오 분 동안,\n직접 세어 보겠습니다.\n아마, 놀라실 겁니다.\n\n1단계 — 귀 열기 (5분)\n\n*(전원 눈을 감게 한다.)*\n\n눈을 감으면,\n귀가 열립니다.\n\n한 가지만 기억해 주세요.\n소리를 찾아\n마중 나가지 마세요.\n가만히 앉아,\n도착하는 소리를\n맞이하기만 하면 됩니다.\n\n먼저, 가까운 소리부터.\n이 방 안에서 나는 소리들을\n하나씩 맞이해 봅니다.\n옷깃이 스치는 소리,\n누군가의 숨소리,\n바닥이 미세하게 우는 소리.\n\n이제 조금 멀리.\n방 밖에서, 건물 어딘가에서\n들려오는 소리들.\n\n더 멀리 가 봅니다.\n지금 들리는 소리 중에서,\n가장 먼 소리를 찾아보세요.\n찻길일 수도, 바람일 수도,\n새 한 마리일 수도 있습니다.\n내 귀가 닿는\n세계의 끝까지 가 봅니다.\n\n이번에는 반대로,\n가장 작은 소리를 찾아보세요.\n귀를 기울여야 겨우 들리는,\n숨어 있는 소리.\n\n좋은 소리, 싫은 소리를\n나누지 않습니다.\n지도를 만드는 사람은\n길을 탓하지 않듯,\n우리는 그저\n들리는 것을 모을 뿐입니다.\n\n마지막으로,\n소리와 소리 사이를\n들어 보세요.\n소리가 잠시 멎는 틈,\n그 짧은 고요도,\n지도에 담길 자리입니다.\n\n2단계 — 지도 그리기 (5분)\n\n이제 눈을 뜨고,\n종이 한가운데에\n작은 동그라미를 그려 주세요.\n그것이 나입니다.\n별칭을 적어 넣어도 좋습니다.\n\n그리고 방금 맞이한 소리들을\n지도에 옮겨 봅니다.\n오른쪽에서 온 소리는 오른쪽에,\n멀리서 온 소리는 멀리,\n가까운 소리는 가까이.\n글자로 적어도, 그림으로 그려도,\n꼬불꼬불한 선으로 표현해도\n좋습니다.\n큰 소리는 크게,\n작은 소리는 작게.\n\n잘 그린 지도, 못 그린 지도는\n없습니다.\n내가 들은 세계는,\n나만 그릴 수 있으니까요.\n\n3단계 — 지도 비교 (4분)\n\n*(둘씩, 또는 서너 명씩 지도를 펼쳐 놓고 비교하게 한다.)*\n\n이제 옆 사람과\n지도를 나란히 놓아 보세요.\n그리고 찾아보세요.\n내 지도에는 없는데,\n저 지도에는 있는 소리를.\n\n*(웅성거림과 웃음이 인다. \"이 소리 들으셨어요?\", \"이건 뭐예요?\" 하는 대화가 오간다. 충분히 나누게 둔 뒤.)*\n\n닫기 — 지도의 한가운데 (4분)\n\n우리는 방금,\n세 가지를 발견했습니다.\n\n첫째.\n이 방에는 두세 개가 아니라,\n수십 개의 소리가 있었습니다.\n그 소리들은 오늘 처음\n생긴 것이 아닙니다.\n늘 여기 있었습니다.\n소리가 없었던 것이 아니라,\n듣는 내가 없었던 것입니다.\n\n둘째.\n같은 방에서, 같은 시간을 보냈는데,\n우리의 지도는 모두 달랐습니다.\n우리는 같은 세계에 사는 것이 아니라,\n저마다 자기가 들은 세계에\n살고 있었던 것입니다.\n가족이, 친구가 나와 다르게\n말하고 다르게 느끼는 것은,\n어쩌면 당연한 일이었습니다.\n그들은 나와 다른 지도를 들고,\n같은 집에 살고 있으니까요.\n상대의 지도를 궁금해하는 것,\n그것이 이해의 시작인지도 모릅니다.\n\n그리고 셋째.\n모든 지도의 한가운데에는\n무엇이 있었나요.\n나였습니다.\n그렇다면 세상에서\n나와 가장 가까운 소리는\n무엇일까요.\n\n눈을 감고,\n마지막으로 그 소리를\n들어 보세요.\n나의 숨소리입니다.\n그리고 그 아래,\n쉼 없이 뛰고 있는\n심장 소리입니다.\n가장 가까운 소리를,\n우리는 가장 오래\n잊고 살았습니다.\n그 소리는, 다음 시간에\n가만히 만나러 가겠습니다.\n\n*(종을 한 번 친다.)*\n\n이 소리가\n사라지는 끝자락까지,\n따라가 보세요.\n\n*(여운이 완전히 사라질 때까지 침묵. 그리고.)*\n\n지도는 끝났지만,\n세계는 계속\n소리를 내고 있습니다.\n\n일상으로 잇는 다리 (마무리 멘트)\n\n오늘부터 하루에 한 번,\n어디서든 잠시 멈추어\n'새로운 소리 셋'을 찾아보세요.\n버스 안에서든, 부엌에서든,\n처음 알아차리는 소리\n세 개를 모으는 겁니다.\n종이도 펜도 필요 없습니다.\n귀가 지도를 그립니다.\n그 삼십 초가,\n하루 한가운데의\n관찰 명상입니다.\n\n잠들기 전, 침대에 누워\n밤의 소리 지도를 그려 보는 것도\n좋습니다.\n낮에는 들리지 않던 소리들이,\n밤의 지도에는 나타납니다.\n\n그리고 언젠가,\n아끼는 사람과 나란히 걸으며\n서로의 소리 지도를\n비교해 보세요.\n같은 길을 걸었는데\n서로 다른 것을 들었다는 걸\n알게 되는 순간,\n그 사람이 조금 더\n궁금해질 것입니다.\n\n───\n\n진행 팁\n\n- 완벽히 조용한 방보다, 적당히 생활 소음이 스며드는 공간이 오히려 좋다. 소리가 많아야 지도가 풍성해진다. 야외(마당, 숲)에서 진행하면 가장 깊은 판이 된다.\n- 1단계에서 '가까운 → 먼 → 가장 먼 → 가장 작은 → 소리 사이의 고요' 순서를 지킨다. 주의가 동심원처럼 넓어졌다가 섬세해지는 이 순서가 개방적 관찰의 훈련 그 자체다.\n- 짜증 나는 소음(공사음, 기침 소리)에 대한 불평이 나오면 좋은 재료로 삼는다. \"그 소리도 지도에 넣어 주세요. 지도는 길을 탓하지 않습니다.\" 소음과 소리를 나누는 것은 귀가 아니라 마음이라는 것을, 지도가 가르치게 한다.\n- 청각이 약한 참가자는 손바닥을 바닥이나 무릎에 대고 진동과 몸의 감각으로 '느낌 지도'를 그리게 한다. 관찰의 원리는 동일하게 경험된다.\n- 닫기의 종소리는 소리끝 잡기와 자연스럽게 이어지고, 숨소리·심장 대목은 둘째 주 원초음 명상의 예고편이 된다. 프로그램의 앞뒤를 이 기법이 잇는 셈이다.\n- 감정 나눔 질문: \"오늘 처음 들은 소리는 무엇이었나요?\" / \"옆 사람의 지도에서 무엇을 발견했나요?\" / \"소리를 판단 없이 모으는 동안, 마음은 어떤 상태였나요?\"","duration":"","tags":"감각형","series":"숨비명상"},{"id":"e8728d71","category":"수용","title":"벽에 기대기 명상","body":"늘봄명상 · 수용 단계 — 행동형 기법 부제 : 벽은 그대로였습니다,\n달라진 것은 나의 자세뿐 소요 시간 : 약 15분 (튼튼한 벽이 있는 공간,\n도구 없음)\n\n───\n\n기법의 원리\n\n수용전념치료의 핵심 통찰은, 고통의 대부분이 상처 자체가 아니라 그것을 밀어내려는 저항에서 비롯된다는 것이다. 그러나 저항의 비용은 눈에 보이지 않는다. 우리는 자신이 얼마나 힘껏 무언가를 밀며 살아가는지 알지 못한 채 그저 지쳐 갈 뿐이다. 이 기법은 그 보이지 않는 저항을, 벽 밀기라는 동작으로 보이게 만든다.\n\n벽은 바꿀 수 없는 현실이다. 이미 지나간 일, 이미 일어난 이별과 병, 내 뜻대로 되지 않는 타인의 마음. 벽을 아무리 밀어도 벽은 밀리지 않고, 나의 팔만 떨리고 숨만 가빠진다. 고통의 대부분은 벽이 아니라, 벽을 미느라 지친 팔에서 온다는 것을 참가자는 삼십 초 만에 몸으로 안다.\n\n그리고 이 기법의 심장인 반전이 온다. 밀기를 멈추고 돌아서서, 같은 벽에 등을 기대는 것이다. 조금 전까지 적이던 벽이, 이제 나를 받쳐 준다. 벽은 조금도 달라지지 않았다. 달라진 것은 벽을 대하는 나의 자세뿐이다. 받아들임이 체념이나 패배가 아니라, 싸움에 쓰던 힘을 되찾아 오는 가장 적극적인 전환임을, 등으로 전해지는 벽의 단단함이 증명한다. 늪에서 허우적거림을 멈추면 몸이 떠오르고, 물에 뜬 공에서 손을 떼면 싸움이 끝나듯이.\n\n마지막 발견이 하나 더 있다. 벽을 밀 때 우리 눈에는 벽밖에 보이지 않는다. 그러나 벽에 기대는 순간, 우리는 생애 처음으로 벽의 반대편, 곧 앞을 바라보게 된다. 받아들임이 왜 새로운 삶의 시작인지가, 시선의 방향으로 증명되는 것이다.\n\n───\n\n진행 절차와 멘트\n\n열기 — 바꿀 수 없는 것 (2분)\n\n*(참가자들을 벽을 마주 보고 서게 한다.)*\n\n시작하기 전에,\n마음속으로 하나만\n떠올려 보겠습니다.\n\n살면서 아무리 애써도\n바꿀 수 없었던 것.\n이미 지나가 버린 그 일,\n내 뜻대로 되지 않던 그 사람,\n되돌릴 수 없는 그 시간.\n\n떠올리기만 하면 됩니다.\n그것을 지금부터,\n이 벽이라고 하겠습니다.\n\n1단계 — 벽 밀기 (4분)\n\n이제 두 손을 벽에 대고,\n힘껏 밀어 보세요.\n방금 떠올린 그 일을\n밀어내듯이.\n있는 힘껏.\n\n*(30초간 밀게 한다. 끙끙대는 소리와 웃음이 함께 나온다.)*\n\n자, 잠깐.\
