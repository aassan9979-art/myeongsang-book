n—\n\n우리는 늘 곁에 있는 것들을 당연하게 여기며 살아갑니다.\n가족의 얼굴, 매일 걷는 길,\n아침마다 눈이 떠지는 일까지도.\n\n가까운 것일수록 고맙다는 말은 자꾸만 뒤로 미뤄집니다.\n\n오늘은 그 미뤄 둔 인사를 전하는 시간입니다.\n\n가장 가까이에서,\n가장 오래 나와 함께해 온 것.\n바로 내 몸에게 첫 인사를 건네 보겠습니다.\n\n—\n\n먼저 두 눈을 떠올려 봅니다.\n감은 눈꺼풀 안쪽의 고요한 어둠을 느껴 봅니다.\n\n이 눈은 내가 태어나 처음으로 세상의 빛을 만난 창이었습니다.\n\n그날부터 지금까지 사랑하는 사람의 웃는 얼굴을,\n좋아하는 책의 한 구절을,\n해 질 녘 하늘이 물드는 빛깔을 쉼 없이 보여 주었습니다.\n\n울고 싶은 날에는 말없이 눈물을 흘려보내며 마음의 무게를 대신 덜어 주었습니다.\n\n그 눈에게 마음속으로 말해 봅니다.\n\n'고마워. 네 덕분에 이 세상을 볼 수 있었어.'\n\n이제 귀로 주의를 옮깁니다.\n지금 이 목소리도 귀를 통해 나에게 닿고 있습니다.\n\n이 귀는 내 이름을 부르는 목소리를,\n좋아하는 노래의 첫 소절을,\n창밖의 빗소리와 누군가의 웃음소리를 하루도 빠짐없이 안으로 들여보내 주었습니다.\n\n세상과 나를 이어 준 귀에게,\n고마움을 전합니다.\n\n이제 코끝으로 주의를 가져갑니다.\n공기가 조용히 드나들고 있습니다.\n\n이 코는 내가 첫울음을 터뜨린 그 순간부터 단 한 번도 잊지 않고 숨을 쉬어 주었습니다.\n내가 잠든 밤에도,\n다른 일에 정신이 팔린 낮에도.\n\n봄이면 꽃내음을,\n비 온 뒤에는 흙냄새를,\n겨울 아침에는 차고 맑은 공기를 철마다 실어다 주었습니다.\n\n숨을 한 번 천천히 들이쉬며,\n살아 있음을 느끼게 해 주는 코에게 고마움을 전합니다.\n\n입을 떠올려 봅니다.\n\n이 입이 처음 배운 말은 아마 누군가를 부르는 다정한 이름이었을 것입니다.\n\n그날부터 이 입은 수많은 인사를 건네고,\n누군가를 웃게 한 농담과 누군가를 일으킨 위로를 세상에 내보냈습니다.\n\n그리고 매일매일 따뜻한 밥을 먹여 나를 살게 해 주었습니다.\n\n오늘 하루의 말과 밥을 가능하게 해 준 입에게,\n고마움을 전합니다.\n\n—\n\n이제 가슴 한가운데,\n심장으로 주의를 가져갑니다.\n\n한 손을 가슴 위에 가만히 얹어 보세요.\n\n손바닥 아래에서 심장이 조용히 뛰고 있습니다.\n\n이 심장은 내가 세상에 태어나기도 전,\n어머니의 배 속에서부터 뛰기 시작했습니다.\n\n그날부터 오늘 이 순간까지 단 일 초도 쉬지 않았습니다.\n\n내가 잠든 밤에도,\n내가 저를 까맣게 잊고 지낸 그 수많은 날에도,\n누가 알아주지 않아도,\n묵묵히, 성실하게,\n나를 위해 뛰어 왔습니다.\n\n그 리듬을 손바닥으로 느끼며,\n가만히 말해 봅니다.\n\n'고마워. 네가 있어서 내가 여기까지 왔어.'\n\n울컥하는 마음이 올라와도 괜찮습니다.\n평생을 함께하고도 처음 건네는 인사이니까요.\n\n팔과 손을 떠올려 봅니다.\n두 손의 무게와 온기를 느껴 보세요.\n\n이 손은 아기였을 때,\n나를 안아 준 사람의 손가락을 고사리처럼 꼭 쥐었습니다.\n\n그 작던 손이 자라나 이제는 문을 열고,\n밥을 뜨고,\n지친 누군가의 등을 두드려 주고,\n사랑하는 사람을 끌어안아 온기를 전하는 손이 되었습니다.\n\n오늘 하루 나의 손이 닿았던 모든 순간에 고마움을 전합니다.\n\n다리와 발로 주의를 옮깁니다.\n두 발의 감각을 가만히 느껴 보세요.\n\n이 다리와 발은 수없이 넘어지며 첫걸음마를 배운 그날부터,\n학교 가던 길,\n일하러 가던 길,\n보고 싶은 사람에게 달려가던 길,\n그 모든 길을 나와 함께 걸었습니다.\n\n그리고 아무리 지친 날에도 어김없이 나를 집으로 데려다주었습니다.\n\n땅과 나를 이어 주는 다리와 발에게 고마움을 전합니다.\n\n이제 몸 전체를 따뜻한 빛으로 감싸듯 느껴 봅니다.\n\n이 몸은 상처가 나면 말없이 아물게 하고,\n병이 들면 스스로 나를 회복시키며,\n내가 모르는 사이에도 쉼 없이 나를 돌보아 왔습니다.\n\n세상에서 가장 오래,\n가장 가까이에서 나를 보살펴 온 것은 바로 이 몸이었습니다.\n\n머리끝에서 발끝까지,\n깊은 고마움을 전합니다.\n\n—\n\n이제 그 고마움의 원을 조금씩 넓혀 보겠습니다.\n\n생각만 해도 미소가 지어지는 행복한 순간들을 떠올려 봅니다.\n\n사랑하는 가족과 친구의 얼굴일 수도,\n꼬리 치며 달려오는 반려동물일 수도,\n비 오는 날 창밖의 빗소리일 수도,\n잠들기 전 나누던 정다운 대화일 수도 있습니다.\n\n그중에서 가장 마음이 따뜻해지는 장면 하나를 골라,\n그 안에 가만히 머물러 보세요.\n\n그 장면 속에서 입가가 저절로 부드러워지고,\n가슴에 잔잔한 온기가 번져 가는 것을 느껴 봅니다.\n\n그 온기 속에서 한 사람의 얼굴을 떠올려 봅니다.\n\n나를 위해 밥을 지어 준 사람.\n내 이름을 다정하게 불러 준 사람.\n힘든 날,\n말없이 곁을 지켜 준 사람.\n\n그 사람은 알까요.\n자신의 그 작은 다정함이 나에게 얼마나 큰 힘이 되었는지.\n\n그 얼굴을 마음에 품고 가만히 인사를 전합니다.\n\n'당신이 있어서 여기까지 올 수 있었습니다. 감사합니다.'\n\n이제 조금 더 멀리,\n얼굴도 모르는 사람들에게로 마음을 넓혀 봅니다.\n\n오늘 아침의 밥 한 그릇에는 땀 흘려 농사지은 이의 수고가,\n지금 이 자리에는 벽돌 한 장 한 장 쌓아 올린 이들의 손길이 담겨 있습니다.\n\n나의 하루는 이렇게 보이지 않는 수많은 사람들의 정성 위에 가만히 놓여 있습니다.\n\n나는 혼자 살아온 것이 아니었습니다.\n셀 수 없이 많은 고마움에 둘러싸여 여기까지 왔습니다.\n\n그 모든 존재들을 향해 마음속으로 인사를 전합니다.\n\n'당신들 덕분입니다. 감사합니다.'\n\n—\n\n그리고 마지막으로,\n오늘 처음 인사를 건넨 나의 몸과 마음에게 다시 한 번 전해 봅니다.\n\n'고맙습니다. 사랑합니다.'\n\n가슴 가득 차오른 이 따뜻함을 담은 채,\n천천히 돌아올 준비를 합니다.\n\n가슴에 얹었던 손을 가만히 내려놓습니다.\n손가락 끝을 가볍게 움직여 보세요.\n발가락도 천천히 움직여 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서 지금 이 자리의 감각을 느껴 봅니다.\n\n준비가 되면 천천히 눈을 떠 보세요.\n\n눈을 뜨는 순간 보이는 이 세상은,\n방금 인사를 나눈 이 몸이 오늘도 나에게 건네는 선물입니다.\n\n오늘 하루,\n고마운 마음이 떠오르는 순간이 오면 미루지 말고 그 자리에서 전해 보세요.\n\n고맙다고.\n\n그 한마디가 나의 하루도,\n그 사람의 하루도 선물로 바꾸어 줍니다.\n\n—--------------------------------------\n\n감사명상\n\n\n편안한 자세로 누워주세요.\n준비가 되었다면,\n천천히 눈을 감아 보세요.\n\n숨이 드나드는 것을 느껴 봅니다.\n일부러 바꾸지 않아도 됩니다.\n숨을 내쉴 때마다,\n어깨가 조금씩 아래로 내려갑니다.\n\n—\n\n우리는 늘 곁에 있는 것들을,\n당연하게 여기며 살아갑니다.\n가족의 얼굴, 매일 걷는 길,\n아침마다 눈이 떠지는 일까지도.\n가까운 것일수록,\n고맙다는 말은 자꾸만 미뤄집니다.\n\n오늘은,\n그 미뤄 둔 인사를 전하는 시간입니다.\n가장 가까이에서,\n가장 오래 나와 함께해 온 것.\n바로 나의 몸에게부터,\n처음으로 인사를 건네 보겠습니다.\n\n먼저,\n두 눈을 떠올려 봅니다.\n감은 눈꺼풀 안쪽의 고요한 어둠을 느껴 보세요.\n\n이 눈은,\n내가 태어나 처음으로 세상의 빛을 만난 창이었습니다.\n그날부터 지금까지,\n사랑하는 사람의 웃는 얼굴을,\n좋아하는 책의 한 구절을,\n해 질 녘 하늘이 물드는 빛깔을 쉼 없이 나에게 보여 주었습니다.\n그리고 울고 싶은 날에는,\n말없이 눈물을 흘려보내며 마음의 무게를 대신 덜어 주었습니다.\n\n그 눈에게,\n마음속으로 말해 봅니다.\n'고마워. 네 덕분에, 이 세상을 볼 수 있었어.'\n\n이제 코로 주의를 옮깁니다.\n지금도 코끝으로 공기가 조용히 드나들고 있습니다.\n\n이 코는 내가 태어나 첫울음을 터뜨린 그 순간부터,\n단 한 번도 잊지 않고 숨을 쉬어 주었습니다.\n잠든 밤에도,\n내가 다른 일에 정신이 팔린 낮에도.\n봄이면 꽃내음을,\n비 온 뒤에는 흙냄새를,\n겨울 아침에는 차고 맑은 공기를 철마다 실어다 주었습니다.\n\n숨을 한 번 천천히 들이쉬며,\n살아 있음을 느끼게 하는 코에게 고마움을 전해 봅니다.\n\n입을 떠올려 봅니다.\n이 입이 처음 배운 말은,\n아마 누군가를 부르는 다정한 이름이었을 것입니다.\n그날부터 이 입은 수많은 인사를 건네고,\n누군가를 웃게 한 농담과 누군가를 일으킨 위로를 세상에 내보냈습니다.\n그리고 매일매일,\n따뜻한 밥을 먹여 나를 살게 해 주었습니다.\n\n오늘 하루의 말과 밥을 가능하게 한 입에게,\n고마움을 전합니다.\n\n이제 가슴 한가운데,\n심장으로 주의를 가져갑니다.\n한 손을 가슴 위에 가만히 얹어 보세요.\n\n손바닥 아래에서,\n심장이 조용히 뛰고 있습니다.\n\n이 심장은,\n내가 세상에 태어나기도 전,\n어머니의 배 속에서부터 뛰기 시작했습니다.\n그날부터 오늘 이 순간까지,\n단 일 초도 쉬지 않았습니다.\n내가 잠든 밤에도,\n내가 저를 까맣게 잊고 지낸 그 수많은 날에도,\n누가 알아주지 않아도,\n묵묵히, 성실하게,\n나를 위해 뛰어 왔습니다.\n\n그 심장의 리듬을 손바닥으로 느끼며,\n가만히 말해 봅니다.\n'고마워. 네가 있어서, 내가 여기까지 왔어.'\n\n울컥하는 마음이 올라와도 괜찮습니다.\n평생을 함께하고도,\n처음 건네는 인사이니까요.\n\n팔과 손을 떠올려 봅니다.\n무릎 위에 놓인 두 손의 무게와 온기를 느껴 보세요.\n\n이 손은 아기였을 때,\n나를 안아 준 사람의 손가락을 고사리처럼 꼭 쥐었습니다.\n그 작던 손이 자라나,\n이제는 문을 열고,\n밥을 뜨고,\n지친 누군가의 등을 두드려 주고,\n사랑하는 사람을 끌어안아 온기를 전하는 손이 되었습니다.\n\n오늘 하루 나의 손이 닿았던 모든 순간에,\n고마움을 전합니다.\n\n다리와 발로 주의를 옮깁니다.\n바닥에 닿아 있는 두 발의 감각을 느껴 보세요.\n\n이 다리와 발은 수없이 넘어지며 첫걸음마를 배운 그날부터,\n학교 가던 길,\n일하러 가던 길,\n보고 싶은 사람에게 달려가던 길,\n그 모든 길을 나와 함께 걸었습니다.\n그리고 아무리 지친 날에도,\n어김없이 나를 집으로 데려다주었습니다.\n\n땅과 나를 이어 주는 다리와 발에게,\n고마움을 전합니다.\n\n이제 몸 전체를 따뜻한 빛으로 감싸듯 느껴 봅니다.\n생각해 보면 이 몸은,\n상처가 나면 말없이 아물게 하고,\n병이 들면 스스로 나를 회복시키며,\n내가 모르는 사이에도 쉼 없이 나를 돌보아 왔습니다.\n세상에서 가장 오래,\n가장 가까이에서 나를 보살펴 온 것은,\n바로 이 몸이었습니다.\n\n머리끝에서 발끝까지,\n깊은 고마움을 전합니다.\n\n이번에는,\n그 고마움의 원을 조금씩 넓혀 보겠습니다.\n\n생각만 해도 미소가 지어지는 행복한 순간들을 떠올려 봅니다.\n사랑하는 가족과 친구의 얼굴일 수도,\n꼬리 치며 달려오는 반려동물일 수도,\n비 오는 날 창밖의 빗소리일 수도,\n잠들기 전 나누던 정다운 대화일 수도 있습니다.\n\n그중에서,\n가장 마음이 따뜻해지는 장면 하나를 골라,\n그 안에 가만히 머물러 보세요.\n\n그 장면 속에서,\n입가가 저절로 부드러워지고,\n가슴에 잔잔한 온기가 번져 가는 것을 느껴 봅니다.\n\n그리고 그 온기 속에서,\n한 사람의 얼굴을 떠올려 봅니다.\n나를 위해 밥을 지어 준 사람.\n내 이름을 다정하게 불러 준 사람.\n힘든 날,\n말없이 곁을 지켜 준 사람.\n\n그 사람은 알까요.\n자신의 그 작은 다정함이,\n나에게 얼마나 큰 힘이 되었는지.\n\n그 얼굴을 마음에 품고,\n가만히 인사를 전합니다.\n'당신이 있어서, 여기까지 올 수 있었습니다. 감사합니다.'\n\n그리고 조금 더 멀리,\n얼굴도 모르는 사람들에게로 마음을 넓혀 봅니다.\n\n오늘 아침의 밥 한 그릇에는 땀 흘려 농사지은 이의 수고가,\n지금 앉아 있는 이 방에는 벽돌 한 장 한 장 쌓아 올린 이들의 손길이 담겨 있습니다.\n나의 하루는,\n이렇게 보이지 않는 수많은 사람들의 정성 위에 가만히 놓여 있습니다.\n\n나는,\n혼자 살아온 것이 아니었습니다.\n셀 수 없이 많은 고마움에 둘러싸여,\n여기까지 왔습니다.\n\n그 모든 존재들을 향해,\n마음속으로 인사를 전합니다.\n\n'감사합니다. 고맙습니다. 사랑합니다.'\n\n그리고 마지막으로,\n오늘 처음 인사를 건넨 나의 몸과 마음에게도,\n다시 한 번 전해 봅니다.\n\n'고맙습니다. 감사합니다. 사랑합니다.'\n\n가슴 가득 차오른 이 따뜻함을 담은 채,\n천천히 돌아올 준비를 합니다.\n\n가슴에 얹었던 손을 무릎 위로 가만히 내려놓습니다.\n손가락 끝을 가볍게 움직여 보세요.\n발가락도 천천히 움직여 봅니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉬면서,\n지금 앉아 있는 이 자리의 감각을 느껴 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 보세요.\n\n눈을 뜨는 순간 보이는 이 세상은,\n방금 인사를 나눈 이 몸이 오늘도 나에게 건네는 선물입니다.\n오늘 하루,\n고마운 마음이 떠오르는 순간이 오면,\n미루지 말고 그 자리에서 전해 보세요.\n고맙다고. 그 한마디가,\n나의 하루도,\n그 사람의 하루도,\n선물로 바꾸어 줍니다.","duration":"약 15분","tags":"감사 바디스캔","series":"숨비명상"},{"id":"95ad5528","category":"수용","title":"빗장을 푸는 말","body":"오래된 집 대문 안쪽에는 굵은 나무 빗장이 하나 걸려 있었습니다.\n\n밖에서 아무리 밀고 두드려도 안에서 빗장이 걸려 있으면 문은 꼼짝도 하지 않습니다.\n\n그 빗장을 건 사람도,\n풀 수 있는 사람도 문 안쪽에 있는 사람입니다.\n\n오늘은 그 빗장 이야기를 함께 해 보려 합니다.\n\n편안한 자리에 앉거나 누워 보세요.\n\n의자에 앉으셨다면 두 발을 바닥에 나란히 내려놓습니다.\n\n바닥이 발바닥을 받치고 있는 느낌을 잠시 그대로 느껴 봅니다.\n\n준비가 되셨으면 눈을 천천히 감아 봅니다.\n\n눈을 감는 것이 아직 불편하시면 시선을 아래로 낮추고 한 곳에 부드럽게 두어도 괜찮습니다.\n\n어깨에 힘이 남아 있어도 괜찮습니다.\n\n지금 여기 앉아 있는 것만으로 이미 충분합니다.\n\n이제 숨이 들어오고 나가는 것을 가만히 지켜봅니다.\n\n숨을 고치려 하지 않아도 됩니다.\n\n들어오면 들어오는 대로,\n나가면 나가는 대로.\n\n들어오는 숨은 조금 시원하고,\n나가는 숨은 조금 따뜻합니다.\n\n그 차이를 코끝에서 느껴 봅니다.\n\n느껴지지 않아도 괜찮습니다.\n\n느껴지지 않는다는 것을 알아차리는 것도 똑같이 잘하고 있는 것입니다.\n\n숨을 내쉴 때마다 어깨가 한 뼘씩 내려앉습니다.\n\n턱에 물려 있던 힘도 스르르 풀립니다.\n\n이마가 조금 넓어집니다.\n\n배가 부드러워집니다.\n\n몸이 조금씩 바닥에 자기 무게를 맡깁니다.\n\n이제 마음속에 오래된 집 한 채를 그려 봅니다.\n\n마당이 있고,\n그 앞에 나무 대문이 하나 있습니다.\n\n문 안쪽에는 손때 묻은 나무 빗장이 가로질러 걸려 있습니다.\n\n당신은 지금 그 문 안쪽에 서 있습니다.\n\n문 밖에서 무언가 자꾸 문을 두드립니다.\n\n그것은 사람일 수도 있고,\n어떤 말일 수도 있고,\n지나간 어떤 일일 수도 있습니다.\n\n오늘 하루 마음에 턱 걸렸던 것 가운데 가장 가벼운 것 하나만 떠올려 봅니다.\n\n가장 아픈 것은 오늘 꺼내지 않아도 됩니다.\n\n그것은 나중에,\n훨씬 나중에 다루어도 늦지 않습니다.\n\n작은 것 하나면 충분합니다.\n\n그 일을 떠올리면 마음속에서 어떤 말이 먼저 올라오나요.\n\n'그럴 수 없어.'\n\n'어떻게 그럴 수가 있어.'\n\n그 말이 올라올 때 몸이 어떻게 되는지 살펴봅니다.\n\n가슴 한가운데가 조금 단단해집니다.\n\n숨이 짧아집니다.\n\n턱이 다시 물립니다.\n\n주먹에 힘이 들어갑니다.\n\n그것이 빗장이 걸리는 소리입니다.\n\n나무가 홈에 끼워지며 탁,\n하고 잠기는 소리.\n\n문을 두드리는 것은 저쪽인데 아파지는 것은 이쪽입니다.\n\n빗장은 밖을 막는 동시에 나를 그 안에 가둡니다.\n\n그것을 탓하지 않습니다.\n\n우리는 좋은 것은 붙잡고 싫은 것은 밀어내며 살아왔습니다.\n\n빗장을 건 마음도 나를 지키려던 마음이었습니다.\n\n그 마음에게 먼저 수고했다고 말해 줍니다.\n\n이제 손을 봅니다.\n\n한쪽 손을 가만히 쥐어 봅니다.\n\n세게 쥐지 않아도 됩니다.\n\n그저 살며시,\n빗장을 붙들듯이.\n\n그 손을 가슴 가까이 가져옵니다.\n\n숨을 한 번 들이쉬고\n\n내쉬면서\n\n손가락을 아주 천천히 펴 봅니다.\n\n빗장이 홈에서 조금 밀려납니다.\n\n그리고 마음속으로 이렇게 말해 봅니다.\n\n'그럴 수도 있지.'\n\n다시 한 번, 쥐었다가\n\n펴면서\n\n'그럴 수도 있지.'\n\n이 말은 그 일이 옳다고 인정하는 말이 아닙니다.\n\n아팠던 것을 없던 일로 하자는 말도 아닙니다.\n\n그저,\n그런 일이 이 세상에 일어나기도 한다고 문을 조금 여는 말입니다.\n\n그러니 억지로 좋아하려 애쓰지 않아도 됩니다.\n\n말이 겉돌아도 괜찮습니다.\n\n마음이 아직 '그럴 수 없어'라고 해도 괜찮습니다.\n\n그저 그 말을 염불하듯 조용히 되뇌어 봅니다.\n\n'그럴 수도 있지.'\n\n숨을 내쉴 때마다 한 번씩.\n\n'그럴 수도 있지.'\n\n혹시 지금 마음이 너무 힘들어지면 언제든 멈추어도 됩니다.\n\n눈을 뜨고,\n방 안의 소리를 들으면 됩니다.\n\n그것은 물러섬이 아니라 지혜입니다.\n\n계속하실 수 있다면 다시 숨으로 돌아옵니다.\n\n빗장이 조금씩 밀려납니다.\n\n나무와 나무가 스치는 낮고 부드러운 소리가 납니다.\n\n이윽고 빗장이 끝까지 밀려나고,\n\n문이 저 혼자 아주 조금 열립니다.\n\n문틈으로 바람이 들어옵니다.\n\n이마에 닿는 서늘한 바람.\n\n그 바람에는 마당의 흙냄새와 어디선가 마른 풀 냄새가 섞여 있습니다.\n\n빛이 한 줄기 발등 위로 길게 들어옵니다.\n\n발등이 따뜻해집니다.\n\n가슴 한가운데 단단하던 자리가 조금 말랑해집니다.\n\n숨이 다시 길어집니다.\n\n문 하나를 사이에 두고 안과 밖이 있었는데,\n\n문이 열리자 안의 공기와 밖의 공기가 서로 섞입니다.\n\n어디까지가 안이고 어디부터가 밖인지 이제 알 수 없습니다.\n\n이쪽과 저쪽이 나뉘어 있을 때는 그렇게 힘들었는데,\n\n문이 열리자 그저 하나의 공기가 되었습니다.\n\n옛 글은 이렇게 말합니다.\n\n그가 나를 욕했다,\n그가 나를 이겼다,\n그가 내 것을 빼앗았다.\n\n그런 생각을 품고 사는 사람에게서는 미움이 사라지지 않고,\n\n그런 생각을 품지 않는 사람에게서는 미움이 스스로 사라진다고.\n\n빗장을 푸는 일은 저쪽을 위한 일이 아니었습니다.\n\n이쪽이 숨을 쉬기 위한 일이었습니다.\n\n문 안쪽에 서서 잠시 그 바람을 맞아 봅니다.\n\n들어오는 바람과 나가는 숨.\n\n아무것도 하지 않아도 됩니다.\n\n이 문은 오늘 다 열리지 않아도 괜찮습니다.\n\n손가락 하나 들어갈 만큼만 열려도 바람은 들어옵니다.\n\n내일 다시 조금,\n모레 또 조금.\n\n빗장은 그렇게 풀립니다.\n\n이제 천천히 돌아올 준비를 합니다.\n\n이 바람의 느낌을 가슴 한가운데 담아 둡니다.\n\n손가락을 조금씩 움직여 봅니다.\n\n손끝에 감각이 돌아옵니다.\n\n발가락도 가만히 움직여 봅니다.\n\n발바닥이 바닥에 닿아 있는 것을 다시 느껴 봅니다.\n\n어깨를 한 번 천천히 돌리고,\n\n숨을 조금 깊게 들이쉬었다가\n\n길게 내쉽니다.\n\n오늘 하루,\n마음이 턱 걸리는 순간이 오면\n\n쥐고 있던 손을 살며시 펴면서 속으로 한 번만 말해 보세요.\n\n'그럴 수도 있지.'\n\n그 짧은 말 한마디가 당신 안의 빗장을 조금씩 밀어낼 것입니다.\n\n준비가 되셨으면 천천히 눈을 떠 봅니다.","duration":"약 15분","tags":"#수용 #그럴수도있지 #마음의빗장","series":"숨비명상"},{"id":"6ae353a6","category":"탈중심화","title":"빛을 돌리면","body":"깜깜한 밤길을 걸어 본 적이 있으신가요.\n손에 작은 불빛 하나를 들고 걷습니다.\n그 빛은 언제나 앞을 비춥니다.\n\n발밑의 돌,\n저만치 앞의 나무,\n맞은편에서 오는 사람.\n모든 것이 환하게 보입니다.\n\n그런데 딱 한 곳,\n빛이 닿지 않는 자리가 있습니다.\n바로 그 빛을 들고 있는 내 얼굴입니다.\n\n오늘은 그 빛을 잠시 나에게로 돌려 보려 합니다.\n\n편안한 자리에 앉아 봅니다.\n엉덩이가 바닥에 닿는 느낌,\n등이 세워지는 느낌을 잠시 그대로 둡니다.\n\n준비가 되셨으면 눈을 천천히 감아 봅니다.\n감는 것이 불편하시면 시선을 아래로 낮추어도 괜찮습니다.\n\n머릿속이 아직 시끄러워도 괜찮습니다.\n방금 전까지 무언가를 하다 왔으니 당연한 일입니다.\n\n숨이 들어오고 나가는 것을 가만히 지켜봅니다.\n숨을 바꾸려 하지 않아도 됩니다.\n지금 쉬어지는 대로 그대로 둡니다.\n\n들어오고, 나가고.\n내쉬는 숨이 조금 길어집니다.\n\n숨을 내쉴 때마다 어깨가 한 뼘씩 내려앉습니다.\n눈 뒤쪽이 부드러워집니다.\n미간에 잡혀 있던 힘이 풀립니다.\n턱이 느슨해집니다.\n손이 무릎 위에서 스르르 무거워집니다.\n몸이 자기 무게를 바닥에 맡깁니다.\n\n이제 마음속에서 그 밤길을 다시 걸어 봅니다.\n\n손에는 작은 불빛이 하나 들려 있습니다.\n손잡이가 손바닥에 닿는 감촉,\n그 무게가 느껴집니다.\n빛은 지금 앞을 비추고 있습니다.\n\n오늘 하루,\n그 빛이 어디를 향했었는지 떠올려 봅니다.\n누군가의 표정을 비추었을 수도 있고,\n누군가의 말투를 비추었을 수도 있습니다.\n'저 사람은 왜 저럴까.' '참 고집이 세네.' 그렇게 생각했던 순간이 하나쯤 있을지도 모릅니다.\n\n떠오르지 않으면 떠오르지 않는 대로 괜찮습니다.\n억지로 찾지 않아도 됩니다.\n혹시 하나가 떠올랐다면 그 장면을 잠시 그대로 둡니다.\n빛은 여전히 저쪽을 향해 있습니다.\n\n이제,\n아주 천천히 손목을 돌려 그 빛을 나에게로 향해 봅니다.\n손바닥을 가슴 쪽으로 돌리듯,\n아주 부드럽게.\n\n빛이 이쪽으로 돌아옵니다.\n처음에는 조금 눈이 부십니다.\n그럴 수 있습니다.\n늘 밖만 비추던 빛이니까요.\n\n이 빛은 나를 캐묻는 빛이 아닙니다.\n잘못을 찾아내려는 빛이 아닙니다.\n그저,\n지금 여기 있는 나를 있는 그대로 비추어 주는 따뜻한 빛입니다.\n\n그 빛 아래에서 조용히 세 가지를 물어봅니다.\n\n먼저,\n지금 나는 무슨 생각을 하고 있나요.\n대답하려 애쓰지 않아도 됩니다.\n그저 물어 놓고 가만히 기다려 봅니다.\n\n다음,\n오늘 나는 어떤 말을 했나요.\n내가 한 말 가운데 하나가 슬며시 떠오를 수도 있습니다.\n떠오르면 떠오르는 대로 봅니다.\n\n그리고,\n오늘 나는 어떻게 행동했나요.\n손이 무엇을 했고,\n발이 어디로 갔는지.\n천천히 살펴봅니다.\n\n살피는 동안 마음이 다시 밖으로 달아날 수도 있습니다.\n'그런데 그 사람이…' 하고 빛이 저절로 돌아설 수도 있습니다.\n\n괜찮습니다.\n달아났다는 것을 알아차린 바로 그 순간이,\n빛이 이미 돌아온 순간입니다.\n그 알아차림이 오늘 연습의 전부입니다.\n\n이제 빛 아래에서 한 자리가 눈에 들어올지 모릅니다.\n조금 아픈 자리.\n내 말이 누군가를 스치고 지나간 자리,\n혹은 내가 나에게 모질었던 자리.\n\n그 자리를 보아도 자신을 나무라지 않습니다.\n자책은 성찰이 아닙니다.\n자책은 빛을 꺼 버리지만,\n성찰은 빛을 켜 둔 채 바라보는 일입니다.\n\n마음속으로 조용히 말해 봅니다.\n'미안합니다.' '몰랐습니다.' '다음에는 조금 더 살펴보겠습니다.'\n\n그 한마디면 충분합니다.\n지금 마음이 너무 무거워지면 언제든 멈추어도 됩니다.\n눈을 뜨고 방 안의 소리를 들으면 됩니다.\n그것은 물러섬이 아니라 지혜입니다.\n\n계속하실 수 있다면 다시 숨으로 돌아옵니다.\n들어오고, 나가고.\n\n이제 고개를 조금 들어 밤길 저편을 바라봅니다.\n거기에도 사람들이 걸어가고 있습니다.\n저마다 손에 작은 불빛을 하나씩 들고서.\n\n그런데 자세히 보니 그 빛들도 모두 앞만 비추고 있습니다.\n그 사람들도 자기 얼굴은 보지 못한 채 어두운 길을 걷고 있습니다.\n\n낮에 나를 아프게 했던 그 사람도 그 밤길 어딘가를 걷고 있습니다.\n그 모습을 보면 마음속에서 이런 말이 저절로 올라옵니다.\n'사람이니, 그럴 수도 있지.'\n\n내 얼굴을 한 번 비추어 본 사람만이 그 말을 할 수 있습니다.\n옛 글은 이렇게 말합니다.\n백 년을 살아도 자기를 살피지 못한 삶보다,\n자기를 돌아본 단 하루의 삶이 더 낫다고.\n\n거창한 일이 아닙니다.\n빛을 한 번 돌려 내 얼굴을 비추어 보는 것.\n그 짧은 순간이 바로 그 하루입니다.\n\n이제 그 빛을 가슴 앞으로 가져와 봅니다.\n가슴 한가운데가 조금 따뜻해집니다.\n\n이 빛은 밖에서 얻어 온 것이 아니라 처음부터 내가 들고 있던 것입니다.\n먼지가 앉아 조금 흐려졌을 뿐,\n꺼진 적은 없었습니다.\n\n살피고, 미안해하고,\n다시 살아가는 동안 빛은 조금씩 맑아집니다.\n\n이제 천천히 돌아올 준비를 합니다.\n이 따뜻함을 가슴에 그대로 담아 둡니다.\n\n손가락을 조금씩 움직여 봅니다.\n손끝에 감각이 돌아옵니다.\n발가락도 가만히 움직여 봅니다.\n\n발바닥이 바닥에 닿아 있는 것을 다시 느껴 봅니다.\n어깨를 한 번 천천히 돌리고,\n숨을 조금 깊게 들이쉬었다가 길게 내쉽니다.\n\n오늘 하루,\n누군가를 향해 마음이 뾰족해지는 순간이 오면 손바닥을 가만히 가슴 쪽으로 돌리며 속으로 한 번만 물어보세요.\n\n'지금 나는 무엇을 하고 있나.' 그 물음 하나가 빛을 돌려세울 것입니다.\n\n준비가 되셨으면 천천히 눈을 떠 봅니다.","duration":"약 16분","tags":"#성찰 #회광반조 #하루돌아보기","series":"숨비명상"},{"id":"e0625c14","category":"수용","title":"손안의 씨앗","body":"씨앗 한 알을 흙에 묻고 돌아설 때,\n겉으로는 아무 일도 일어나지 않은 것 같습니다.\n흙은 그대로고,\n손에는 흙만 조금 묻어 있습니다.\n그런데 며칠 뒤,\n아무도 보지 않는 사이에 흙이 살짝 갈라져 있습니다.\n오늘은 그 씨앗 이야기를 함께 해 보려 합니다.\n\n편안한 자리에 앉아 봅니다.\n두 손을 무릎 위에 가만히 올려놓습니다.\n손바닥이 위를 향하도록 살며시 펴 둡니다.\n준비가 되셨으면 눈을 천천히 감아 봅니다.\n감는 것이 불편하시면 시선을 아래로 낮추어도 괜찮습니다.\n오늘 하루가 아직 마음속에서 움직이고 있어도 괜찮습니다.\n\n그대로 두고 숨부터 봅니다.\n들어오고, 나가고.\n숨을 고치려 하지 않습니다.\n지금 쉬어지는 대로 그저 지켜봅니다.\n내쉬는 숨이 조금씩 길어집니다.\n\n내쉴 때마다 어깨가 한 뼘 내려앉습니다.\n이마가 넓어집니다.\n턱이 느슨해집니다.\n손바닥의 힘이 풀리면서 손가락이 자연스럽게 조금 오므라듭니다.\n몸이 자기 무게를 바닥에 맡깁니다.\n\n이제 마음속에 작은 흙 한 뙈기를 그려 봅니다.\n크지 않아도 됩니다.\n두 손으로 감쌀 만한 작은 자리면 충분합니다.\n봄볕이 그 흙 위에 가만히 내려앉아 있습니다.\n\n가까이 다가가 앉아 봅니다.\n손끝으로 흙을 만져 봅니다.\n부슬부슬하고, 조금 서늘하고,\n밑으로 갈수록 따뜻합니다.\n비 온 다음 날 같은 흙냄새가 올라옵니다.\n\n이 흙은 당신의 마음입니다.\n여기에는 이미 심어 둔 것들이 있습니다.\n잠시 둘러봅니다.\n\n지난 어느 날,\n누군가에게 건넨 작은 것 하나가 떠오를지도 모릅니다.\n문을 잡아 준 일.\n안부를 물어본 일.\n아무 말 없이 곁에 앉아 있어 준 일.\n그때 가슴 한가운데가 잠깐 따뜻해졌던 것을 기억하시나요.\n그것이 보람입니다.\n\n크지 않아도 됩니다.\n대단한 일이 아니어도 됩니다.\n떠오르지 않아도 괜찮습니다.\n기억하지 못할 뿐,\n심지 않은 것은 아닙니다.\n흙은 기억하고 있습니다.\n\n혹시 이 흙에서 심고 싶지 않았던 것이 보이더라도 그 자리를 파헤치지 않습니다.\n이미 뿌린 씨앗을 도로 주울 수는 없지만,\n오늘 새 씨앗을 심을 수는 있습니다.\n그것이 이 흙의 가장 다정한 점입니다.\n\n이제 손바닥을 다시 펴 봅니다.\n그 위에 씨앗 네 알이 놓여 있습니다.\n작고 단단하고,\n조금 서늘합니다.\n\n첫 번째 씨앗은 바로 보는 눈입니다.\n판단이 올라오기 전에 한 번 더 바라보는 마음.\n그 씨앗을 손끝으로 집어 흙에 살며시 묻습니다.\n\n두 번째 씨앗은 바른 말입니다.\n내가 하려는 말이 누군가를 살리는 말인지,\n한 번 머금었다가 꺼내는 마음.\n그 씨앗도 흙에 묻습니다.\n\n세 번째 씨앗은 바른 행동입니다.\n마음으로만 생각하지 않고 몸을 한 번 움직이는 것.\n전화를 한 통 거는 일,\n한 걸음 다가가는 일.\n그 씨앗을 묻습니다.\n\n옛 글은 이렇게 말합니다.\n빛깔은 곱고 예쁜데 향기가 없는 꽃이 있다고.\n아무리 아름다운 말도 몸으로 하지 않으면 그와 같다고.\n그러니 오늘 심을 것은 말이 아니라 몸입니다.\n\n네 번째 씨앗은 꾸준함입니다.\n오늘 한 번으로 끝내지 않고 내일 또 한 알.\n그 씨앗을 가장 깊이 묻습니다.\n\n이제 손으로 흙을 덮어 줍니다.\n손바닥으로 가만히 두어 번 다독입니다.\n토닥, 토닥.\n흙이 손바닥에 닿는 그 느낌을 잠시 그대로 둡니다.\n다 심었습니다.\n\n씨앗을 심는 일에서 우리가 할 수 있는 것은 여기까지입니다.\n자라는 것은 씨앗이 하는 일입니다.\n싹이 언제 나올지,\n얼마나 클지,\n그것은 우리 손에 있지 않습니다.\n\n그러니 매일 흙을 파 보며 확인하지 않아도 됩니다.\n아무도 알아주지 않아도 괜찮습니다.\n심은 손이 알고,\n흙이 압니다.\n\n그런데 참 신기한 것이 하나 있습니다.\n열매는 아직 멀었는데,\n씨앗을 묻고 손을 털어 낸 바로 지금,\n가슴 한가운데가 이미 조금 따뜻합니다.\n\n그 따뜻함을 잠시 그대로 느껴 봅니다.\n숨을 들이쉬면 그 자리가 조금 넓어지고,\n내쉬면 그 자리가 조금 부드러워집니다.\n\n거친 마음으로 한 말과 행동에는 괴로움이 그림자처럼 따라오고,\n맑은 마음으로 한 말과 행동에는 이 따뜻함이 그림자처럼 따라옵니다.\n애써 붙잡지 않아도 저절로 따라옵니다.\n그것이 보람입니다.\n\n그리고 잊지 마세요.\n이 흙에는 남을 위한 자리만 있는 것이 아닙니다.\n나에게 심는 씨앗도 똑같은 씨앗입니다.\n오늘 나를 조금 쉬게 해 주는 것,\n나에게 조금 다정하게 말해 주는 것.\n그것도 이 흙에서 똑같이 자랍니다.\n남을 위해 애쓰다 지쳐 있었다면 오늘은 그 씨앗을 먼저 심어도 됩니다.\n\n이제 천천히 돌아올 준비를 합니다.\n이 흙의 감촉과 가슴의 따뜻함을 그대로 담아 둡니다.\n손가락을 조금씩 움직여 봅니다.\n손끝에 감각이 돌아옵니다.\n발가락도 가만히 움직여 봅니다.\n발바닥이 바닥에 닿아 있는 것을 다시 느껴 봅니다.\n어깨를 한 번 천천히 돌리고,\n숨을 조금 깊게 들이쉬었다가 길게 내쉽니다.\n\n눈을 뜨기 전에 오늘 심을 씨앗 한 알만 마음속으로 정해 봅니다.\n아주 작은 것 하나면 됩니다.\n정하셨으면 손을 가볍게 오므렸다가,\n무릎 위에 내려놓듯 살며시 펴 봅니다.\n방금 하나를 심었습니다.\n준비가 되셨으면 천천히 눈을 떠 봅니다.","duration":"예상 낭독 시간 : 약 15분","tags":"#보람 #씨앗심기 #작은실천","series":"숨비명상"},{"id":"9c1ed4c5","category":"수용","title":"작은 오뚝이","body":"어릴 적 오뚝이를 만져 본 적이 있으신가요.\n손가락으로 툭 밀면 넘어질 듯 기울었다가 천천히 되돌아옵니다.\n좌우로 몇 번 흔들리다 어느새 가운데에 가만히 서 있습니다.\n그 안에는 무거운 추가 하나 들어 있습니다.\n아래쪽에, 조용히.\n오늘은 그 오뚝이 이야기를 함께 해 보려 합니다.\n\n편안한 자리에 앉아 봅니다.\n등을 억지로 곧게 세우지 않아도 됩니다.\n몸이 편안하게 설 수 있는 자리를 스스로 찾도록 잠시 맡겨 둡니다.\n준비가 되셨으면 눈을 천천히 감아 봅니다.\n감는 것이 불편하시면 시선을 아래로 낮추어도 괜찮습니다.\n지금 마음이 이미 한쪽으로 기울어 있어도 괜찮습니다.\n그 상태로 시작합니다.\n\n숨이 들어오고 나가는 것을 가만히 지켜봅니다.\n숨을 고치려 하지 않습니다.\n지금 쉬어지는 대로 그대로 둡니다.\n들어오고, 나가고.\n내쉬는 숨이 조금씩 길어집니다.\n\n내쉴 때마다 어깨가 한 뼘 내려앉습니다.\n눈 뒤쪽이 부드러워집니다.\n턱이 느슨해집니다.\n가슴께에 몰려 있던 힘이 조금씩 아래로 내려갑니다.\n윗몸은 가벼워지고 아랫배는 묵직해집니다.\n\n이제 한 손을 배꼽 아래에 가만히 얹어 봅니다.\n손바닥의 온기가 옷을 지나 배에 닿습니다.\n숨을 들이쉬면 손이 조금 올라가고,\n내쉬면 손이 조금 내려갑니다.\n그 오르내림을 잠시 그대로 느껴 봅니다.\n\n여기가 당신의 추가 있는 자리입니다.\n오뚝이가 넘어지지 않는 것은 윗부분이 단단해서가 아니라 아래에 무게가 있기 때문입니다.\n지금 손이 닿아 있는 그 자리입니다.\n\n이제 오늘 하루를 잠시 떠올려 봅니다.\n마음이 한쪽으로 확 기울었던 순간이 있었을 겁니다.\n누군가의 말 한마디에 가슴이 툭 내려앉았거나,\n뜻밖의 소식에 마음이 붕 떠올랐거나.\n그 순간 하나를 가만히 데려와 봅니다.\n\n이제 그 일을 자세히 들여다보는 대신,\n그때 내 마음이 어느 쪽으로 기울었는지만 봅니다.\n서운함 쪽이었나요.\n억울함 쪽이었나요.\n설렘 쪽이었나요.\n그저 이름을 하나 붙여 봅니다.\n'아, 이건 서운함이구나.' 그 한마디면 충분합니다.\n\n이름을 붙이는 순간 무언가 조금 달라집니다.\n그 감정 안에 들어가 있던 내가 반 발짝쯤 밖으로 나와 그것을 바라보게 됩니다.\n아주 작은 거리지만,\n그 거리가 전부입니다.\n\n기울어진 오뚝이를 멈춰 세우려 손으로 붙잡지 않습니다.\n흔들리는 것은 오뚝이가 하는 일입니다.\n흔들리지 않는 오뚝이는 오뚝이가 아닙니다.\n슬픔이 오면 슬퍼도 되고,\n기쁨이 오면 기뻐도 됩니다.\n\n다만 한 가지만 기억합니다.\n지금 기울어 있는 이 마음이 나의 전부는 아니라는 것.\n흔들림은 지나가고,\n오뚝이는 남습니다.\n서운함이 지나가도 당신은 그대로 있습니다.\n\n싫은 쪽으로만 기우는 것이 아닙니다.\n좋은 쪽으로 세게 밀린 오뚝이도 그만큼 크게 흔들립니다.\n좋아하는 것을 붙잡으려 애쓸수록 마음은 더 오래 흔들립니다.\n그러니 기쁨이 왔을 때도 잠시 배에 얹은 손을 느껴 봅니다.\n기쁨을 밀어내라는 말이 아닙니다.\n기쁨에 매달리지 않아도 기쁨은 충분히 기쁘다는 말입니다.\n\n혹시 지금 감정이 너무 크게 올라오면 언제든 멈추어도 됩니다.\n눈을 뜨고 방 안의 소리를 들으면 됩니다.\n그것은 물러섬이 아니라 지혜입니다.\n계속하실 수 있다면 다시 숨으로 돌아옵니다.\n\n들어오고, 나가고.\n손 아래에서 배가 부풀었다 꺼집니다.\n흔들림은 여전히 남아 있을지 모르지만 그 폭이 조금씩 줄어듭니다.\n좌우로, 조금 더 좁게,\n조금 더 천천히.\n\n그리고 어느 순간,\n오뚝이가 가운데에 섭니다.\n아무 일도 일어나지 않은 것처럼 그냥 서 있습니다.\n그 자리에는 좋고 싫음이 없습니다.\n이겨 낸 것도 아니고 참아 낸 것도 아닙니다.\n그저 제자리로 돌아온 것뿐입니다.\n\n이 고요는 텅 빈 고요가 아닙니다.\n아무것도 느끼지 않는 무덤덤함도 아닙니다.\n느낄 것은 다 느끼면서도 휩쓸려 가지 않는,\n깨어 있는 고요입니다.\n\n옛 글은 이렇게 말합니다.\n세상일에 부딪혀도 마음이 흔들려 넘어지지 않고,\n걱정에 물들지 않고 고요한 것.\n그보다 더한 기쁨은 없다고.\n그 기쁨은 멀리 있지 않습니다.\n지금 손 아래 조용히 오르내리는 그 자리에 있습니다.\n\n오늘 하루 중에 알아차리지 못하고 한참을 기운 채로 지냈더라도 괜찮습니다.\n오뚝이는 늦게라도 돌아옵니다.\n저녁에 알아차렸다면 저녁에 돌아오면 됩니다.\n돌아올 수 있다는 것,\n그것이 우리 안에 추가 있다는 증거입니다.\n\n이제 천천히 돌아올 준비를 합니다.\n배에 얹은 손의 온기를 한 번 더 느껴 봅니다.\n손가락을 조금씩 움직여 봅니다.\n손끝에 감각이 돌아옵니다.\n발가락도 가만히 움직여 봅니다.\n발바닥이 바닥에 닿아 있는 것을 다시 느껴 봅니다.\n어깨를 한 번 천천히 돌리고,\n숨을 조금 깊게 들이쉬었다가 길게 내쉽니다.\n\n오늘 마음이 한쪽으로 확 기우는 순간이 오면 하던 말을 잠시 멈추고 손을 배 위에 살며시 얹어 보세요.\n그리고 숨을 한 번 길게 내쉬어 봅니다.\n그 한 번의 숨이 당신 안의 추를 다시 아래로 내려놓을 것입니다.\n준비가 되셨으면 천천히 눈을 떠 봅니다.","duration":"약 15분","tags":"#중용 #감정알아차림 #무게중심","series":"숨비명상"},{"id":"2afe5811","category":"수용","title":"맞잡은 손","body":"어릴 적,\n큰길을 건널 때를 기억하시나요.\n누군가 손을 내밀어 내 손을 잡아 주었습니다.\n그 손을 잡고 있으면 차가 아무리 많아도 그렇게 무섭지 않았습니다.\n그 사람이 특별히 힘이 세서가 아니었습니다.\n잡고 있다는 것,\n그 하나 때문이었습니다.\n오늘은 그 손 이야기를 함께 해 보려 합니다.\n\n편안한 자리에 앉아 봅니다.\n두 손을 무릎 위에 가만히 내려놓습니다.\n준비가 되셨으면 눈을 천천히 감아 봅니다.\n감는 것이 불편하시면 시선을 아래로 낮추어도 괜찮습니다.\n마음이 아직 분주해도 괜찮습니다.\n분주한 채로 시작하면 됩니다.\n\n숨이 들어오고 나가는 것을 가만히 지켜봅니다.\n숨을 바꾸려 하지 않습니다.\n지금 쉬어지는 대로 그대로 둡니다.\n들어오고, 나가고.\n내쉬는 숨이 조금씩 길어집니다.\n\n내쉴 때마다 어깨가 한 뼘 내려앉습니다.\n이마가 넓어집니다.\n턱이 느슨해집니다.\n등이 의자에,\n발이 바닥에 닿아 있는 것을 잠시 느껴 봅니다.\n지금 당신은 아무것도 붙잡고 있지 않아도 떨어지지 않습니다.\n바닥이 이미 받치고 있습니다.\n\n이제 손으로 주의를 옮겨 봅니다.\n손끝이 조금 저릿한가요.\n손바닥이 따뜻한가요.\n아니면 아직 서늘한가요.\n느껴지지 않아도 괜찮습니다.\n느껴지지 않는다는 것을 아는 것도 똑같이 잘하고 있는 것입니다.\n\n먼저 잡혔던 손을 떠올려 봅니다.\n살아오는 동안 누군가 나를 믿어 준 순간이 한 번쯤 있었을 겁니다.\n아주 작은 것이어도 됩니다.\n내 말을 끝까지 들어 준 사람.\n'네가 하면 되지' 하고 그냥 맡겨 준 사람.\n아무 말 없이 기다려 준 사람.\n\n그 사람의 얼굴이 떠오르면 잠시 그대로 바라봅니다.\n그때 내 마음이 어땠는지 가만히 느껴 봅니다.\n가슴이 조금 펴지고,\n등이 조금 곧아졌을 겁니다.\n누군가 나를 믿어 줄 때 우리는 그만큼 자랍니다.\n그것이 서로를 살리는 일입니다.\n\n떠오르지 않아도 괜찮습니다.\n기억이 나지 않을 뿐,\n없었던 것은 아닙니다.\n그리고 지금 이 순간에도 당신은 혼자 앉아 있지 않습니다.\n바닥이 몸을 받치고,\n공기가 숨을 내어 주고 있습니다.\n그것도 오래된 믿음입니다.\n\n이제 한 손으로 다른 손을 가만히 감싸 쥐어 봅니다.\n꽉 쥐지 않습니다.\n손이 손을 덮어 주듯,\n그저 부드럽게.\n손바닥의 온기가 다른 손등으로 옮겨 갑니다.\n\n이 손은 지금 나 자신을 잡아 주고 있습니다.\n조용히 물어봅니다.\n'나는 나를 얼마나 믿고 있나.' 대답하려 애쓰지 않아도 됩니다.\n물음만 놓아두고 가만히 기다립니다.\n\n잘 믿어지지 않는다는 대답이 올라와도 괜찮습니다.\n믿음은 억지로 만들어 내는 것이 아닙니다.\n겪으면서 조금씩 자라는 것입니다.\n지금 믿기 어렵다면 '아직 믿기 어렵구나' 하고 그것을 아는 것으로 충분합니다.\n\n혹시 믿었다가 크게 아팠던 기억이 있다면,\n손을 다시 내미는 일이 두려울 수 있습니다.\n당연한 일입니다.\n오늘 억지로 내밀지 않아도 됩니다.\n지금은 내 손을 내가 잡아 주는 것만으로 충분합니다.\n\n계속하실 수 있다면 한 사람을 떠올려 봅니다.\n요즘 마음이 조금 쓰이는 사람.\n가장 어려운 사람은 오늘 꺼내지 않아도 됩니다.\n그저 스치듯 마음에 걸리는 사람 한 명이면 됩니다.\n\n그 사람을 바라보며 속으로 이렇게 말해 봅니다.\n'저 사람도 나처럼 힘든 날이 있구나.' '저 사람도 나처럼 편안해지고 싶어 하는구나.' 그 말을 하는 동안 그 사람의 모습이 조금 달라 보일지도 모릅니다.\n달라 보이지 않아도 괜찮습니다.\n그 말을 해 본 것만으로 이미 손이 조금 움직였습니다.\n\n이제 그 사람에게 마음속으로 손을 내밀어 봅니다.\n잡아끌지 않습니다.\n그저 펴서 내밀어 둡니다.\n잡고 안 잡고는 그 사람의 몫입니다.\n\n여기서 한 가지를 살펴봅니다.\n같은 손이라도 꽉 움켜쥔 손은 믿음이 아닙니다.\n'내 말대로 해야 해',\n'꼭 이래야만 해' 하는 마음은 믿음이 아니라 붙잡음입니다.\n붙잡힌 손은 아프고,\n아프면 빠져나가려 합니다.\n\n믿음은 느슨하게 맞잡은 손입니다.\n언제든 놓을 수 있게 두었는데도 서로 놓지 않는 손.\n어느 한쪽이 끌지 않고 어느 한쪽이 끌려가지 않는 손.\n그래서 오래 잡고 걸을 수 있습니다.\n\n옛 글은 이렇게 말합니다.\n믿음은 좋은 것들이 자라나는 어머니 같은 것이라고.\n큰 물을 건너야 할 때 처음 발을 딛는 자리가 된다고.\n그 첫 자리는 멀리 있지 않습니다.\n지금 손이 손을 덮고 있는 이 온기입니다.\n\n잠시 그대로 있어 봅니다.\n손과 손 사이,\n따뜻한 자리 하나.\n숨을 들이쉬면 그 온기가 팔을 타고 가슴으로 올라오고,\n내쉬면 온몸으로 퍼집니다.\n\n이제 천천히 돌아올 준비를 합니다.\n감싸 쥔 손을 조금씩 풀어 봅니다.\n손가락을 움직여 봅니다.\n손끝에 감각이 돌아옵니다.\n발가락도 가만히 움직여 봅니다.\n발바닥이 바닥에 닿아 있는 것을 다시 느껴 봅니다.\n어깨를 한 번 천천히 돌리고,\n숨을 조금 깊게 들이쉬었다가 길게 내쉽니다.\n\n오늘 하루,\n마음이 불안해지거나 누군가를 의심하게 되는 순간이 오면 한 손으로 다른 손을 가만히 감싸 쥐어 보세요.\n그리고 속으로 한마디만 건네 봅니다.\n'괜찮아, 잡고 있어.' 그 짧은 온기가 당신을 다시 세울 것입니다.\n준비가 되셨으면 천천히 눈을 떠 봅니다.","duration":"","tags":"#믿음 #자기신뢰 #맞잡은손","series":"숨비명상"},{"id":"0996c6f0","category":"탈중심화","title":"재 속의 불씨","body":"밤새 불이 꺼진 줄 알았던 아궁이가 있습니다.\n아침에 가 보면 하얀 재만 소복하게 쌓여 있습니다.\n차갑게 식은 것 같습니다.\n그런데 부지깽이로 그 재를 조심스레 헤쳐 보면 안쪽에 붉은 것이 하나 아직 살아 있습니다.\n거기에 입김을 후 불어 주면 붉은 자리가 조금 넓어집니다.\n오늘은 그 불씨 이야기를 함께 해 보려 합니다.\n\n편안한 자리에 앉아 봅니다.\n두 손을 무릎 위에 가만히 내려놓습니다.\n준비가 되셨으면 눈을 천천히 감아 봅니다.\n감는 것이 불편하시면 시선을 아래로 낮추어도 괜찮습니다.\n오늘 몸이 무겁고 마음이 지쳐 있어도 괜찮습니다.\n그런 날에 더 필요한 시간입니다.\n\n숨이 들어오고 나가는 것을 가만히 지켜봅니다.\n숨을 고치려 하지 않습니다.\n지금 쉬어지는 대로 그대로 둡니다.\n들어오고, 나가고.\n내쉬는 숨이 조금씩 길어집니다.\n\n내쉴 때마다 어깨가 한 뼘 내려앉습니다.\n이마가 넓어집니다.\n턱이 느슨해집니다.\n몸이 자기 무게를 바닥에 맡깁니다.\n숨은 바람입니다.\n지금 이 순간에도 숨은 몸 안 어딘가를 조용히 지나며 무언가를 살리고 있습니다.\n\n이제 가슴 한가운데로 주의를 옮겨 봅니다.\n거기에 작은 아궁이가 하나 있다고 생각해 봅니다.\n오래 쓴 아궁이입니다.\n그을음이 앉아 있고,\n가장자리는 반들반들합니다.\n\n지금 그 안을 들여다봅니다.\n불이 어떤 모습인가요.\n활활 타고 있을 수도 있고,\n잔잔하게 붉을 수도 있고,\n재만 소복하게 쌓여 아무것도 없어 보일 수도 있습니다.\n어느 쪽이어도 괜찮습니다.\n잘못된 상태라는 것은 없습니다.\n지금의 불을 보는 것,\n그것이 오늘 할 일의 전부입니다.\n\n아무것도 보이지 않는다면 잠시 그 재를 헤쳐 봅니다.\n언젠가 시간 가는 줄 모르고 무언가에 빠져 있던 날을 떠올려 봅니다.\n아주 오래전이어도 됩니다.\n대단한 일이 아니어도 됩니다.\n밤늦게까지 뭔가를 만들던 날,\n누군가를 위해 서툰 손으로 무엇을 준비하던 날.\n\n그날의 몸을 기억해 봅니다.\n피곤한데 이상하게 개운했던 느낌.\n가슴 안쪽이 조금 뜨거웠던 느낌.\n그 온도가 불씨입니다.\n그것은 어디로 사라진 것이 아니라 재 밑에 덮여 있을 뿐입니다.\n\n떠오르지 않아도 괜찮습니다.\n불씨가 보이지 않는다고 없는 것은 아닙니다.\n지금 이 자리에 앉아 숨을 지켜보고 있는 그 마음이 이미 불씨입니다.\n\n이제 숨으로 그 불씨를 살펴봅니다.\n숨을 천천히 들이쉬고,\n내쉬면서 마음속으로 불씨에 바람을 보냅니다.\n후, 하고 불어 주듯이.\n붉은 자리가 조금 넓어집니다.\n\n다시 한 번, 들이쉬고,\n내쉬면서 후.\n아주 작은 불꽃이 재 위로 올라옵니다.\n서두르지 않습니다.\n불은 몰아친다고 빨리 붙지 않습니다.\n\n이제 그 불에 장작을 하나 얹어 봅니다.\n요즘 나를 힘들게 하는 것 하나를 가만히 떠올려 봅니다.\n사람일 수도 있고,\n풀리지 않는 일일 수도 있습니다.\n가장 아픈 것은 오늘 꺼내지 않아도 됩니다.\n\n그것을 마음속에서 불 위에 조용히 얹습니다.\n젖은 장작이라 처음에는 연기부터 납니다.\n눈이 맵고,\n기침이 날 수도 있습니다.\n그것이 당연합니다.\n\n괴로움이 좋은 것이라는 말이 아닙니다.\n아픈 일은 아픈 일입니다.\n다만 이미 내 앞에 와 버린 것이라면 그것을 그냥 안고 떨고 있는 대신 땔감으로 쓸 수는 있다는 말입니다.\n나를 흔든 그 일이 나를 일어서게 한 날이 살면서 한 번쯤 있었을 겁니다.\n\n연기가 걷히고 젖은 장작에도 불이 옮겨붙습니다.\n탁,\n하고 작게 튀는 소리가 납니다.\n아궁이 앞이 따뜻해집니다.\n무릎이 먼저 데워지고,\n손등이 데워지고,\n얼굴이 발그레해집니다.\n\n이제 그 불 위에 솥을 하나 올려 둡니다.\n안에는 물과 얼마 안 되는 재료가 들어 있습니다.\n좋은 재료를 가지고 있어도 불이 없으면 그저 차가운 그릇일 뿐입니다.\n불이 있어야 비로소 음식이 됩니다.\n\n솥이 천천히 데워집니다.\n바닥에서 작은 기포가 하나둘 올라오고,\n이윽고 김이 오릅니다.\n구수한 냄새가 아궁이 앞을 채웁니다.\n그 냄새를 한 번 깊이 들이마셔 봅니다.\n\n여기서 한 가지를 봅니다.\n불을 세게 한다고 음식이 빨리 되지는 않습니다.\n너무 센 불은 겉을 태우고 속을 설익힙니다.\n그리고 금세 제풀에 사그라듭니다.\n좋은 음식을 만드는 것은 활활 타는 불이 아니라 은근하게 오래 가는 불입니다.\n\n그러니 오늘 불을 크게 만들지 않아도 됩니다.\n꺼지지 않게 지키는 것만으로 충분합니다.\n불을 지키는 사람은 불을 손으로 붙잡지 않습니다.\n장작을 알맞게 얹어 두고 한 발짝 물러나 불이 스스로 타도록 둡니다.\n애쓰되 움켜쥐지 않는 것.\n그것이 오래 가는 힘입니다.\n\n그리고 이 불은 자기를 위해서만 타지 않습니다.\n이 불 위에서 익은 것을 누군가 먹게 됩니다.\n당신이 오늘 지켜 낸 작은 불이 어딘가에서 한 사람의 저녁이 됩니다.\n그 생각을 하면 가슴 안쪽이 조금 더 따뜻해집니다.\n\n옛 글은 이렇게 말합니다.\n아무도 걸어 본 적 없는 길을 끝내 걸어간 사람이 있었다고.\n그를 걷게 한 것은 남다른 재주가 아니라 끝까지 꺼뜨리지 않은 불 하나였다고.\n그 불은 특별한 사람에게만 주어진 것이 아닙니다.\n지금 당신 가슴에도 같은 것이 들어 있습니다.\n\n잠시 그대로 앉아 그 온기를 느껴 봅니다.\n들이쉬면 불이 조금 밝아지고,\n내쉬면 온기가 온몸으로 퍼집니다.\n서두를 것도,\n증명할 것도 없습니다.\n그저 따뜻합니다.\n\n이제 천천히 돌아올 준비를 합니다.\n이 온기를 가슴 안쪽에 그대로 담아 둡니다.\n손가락을 조금씩 움직여 봅니다.\n손끝에 감각이 돌아옵니다.\n발가락도 가만히 움직여 봅니다.\n발바닥이 바닥에 닿아 있는 것을 다시 느껴 봅니다.\n어깨를 한 번 천천히 돌리고,\n숨을 조금 깊게 들이쉬었다가 길게 내쉽니다.\n\n오늘 하루,\n아무것도 하기 싫어지는 순간이 오면 입으로 짧게 한 번 후,\n하고 숨을 불어 보세요.\n불씨 하나를 살리듯이.\n그 한 번의 숨이 오늘 하루를 데우기에 충분합니다.\n준비가 되셨으면 천천히 눈을 떠 봅니다.","duration":"","tags":"#열정 #불씨살리기 #은근한힘","series":"숨비명상"},{"id":"2da96d32","category":"탈중심화","title":"마루의 윤","body":"오래된 집에 가면 마루가 반질반질한 것을 봅니다.\n아무것도 칠하지 않았는데 나뭇결이 은은하게 살아 있고,\n손을 대면 미끄럽도록 매끈합니다.\n누군가 오랫동안 매일 그 마루를 닦아 온 것입니다.\n그런데 그 사람도 하루하루는 몰랐을 겁니다.\n오늘 닦은 것이 표가 나지 않으니까요.\n오늘은 그 마루 이야기를 함께 해 보려 합니다.\n\n편안한 자리에 앉아 봅니다.\n지금 앉아 있는 그 바닥이 오래 닦아 온 마루라고 생각해 봅니다.\n준비가 되셨으면 눈을 천천히 감아 봅니다.\n감는 것이 불편하시면 시선을 아래로 낮추어도 괜찮습니다.\n오늘 아무것도 해내지 못한 것 같아도 괜찮습니다.\n그 마음까지 데리고 앉습니다.\n\n숨이 들어오고 나가는 것을 가만히 지켜봅니다.\n숨을 고치려 하지 않습니다.\n지금 쉬어지는 대로 그대로 둡니다.\n들어오고, 나가고.\n내쉬는 숨이 조금씩 길어집니다.\n\n내쉴 때마다 어깨가 한 뼘 내려앉습니다.\n이마가 넓어집니다.\n턱이 느슨해집니다.\n숨은 오늘도 누가 시키지 않았는데 같은 일을 되풀이하고 있습니다.\n들어오고, 나가고.\n그 한결같음이 지금까지 당신을 살려 왔습니다.\n\n이제 마음속에서 그 마루 위에 앉아 봅니다.\n아침 공기가 서늘합니다.\n곁에는 물에 적셔 꼭 짠 무명 걸레가 하나 놓여 있습니다.\n손으로 집어 봅니다.\n축축하고 서늘합니다.\n물기가 손끝을 타고 손목까지 내려옵니다.\n\n무릎을 꿇고 걸레를 마루에 얹습니다.\n그리고 천천히 밀어 봅니다.\n나뭇결을 따라 앞으로,\n한 뼘.\n결을 따라 밀면 걸레가 부드럽게 나갑니다.\n결을 거슬러 밀면 자꾸 걸립니다.\n\n성실이란 그런 것입니다.\n이를 악물고 밀어붙이는 것이 아니라 결을 찾아 그 위를 지나가는 일입니다.\n그러니 오늘도 힘껏 애쓰지 않아도 됩니다.\n결을 따라 한 뼘이면 됩니다.\n\n닦다 보면 마루가 눈에 들어옵니다.\n어떤 자리는 유난히 닳아 있습니다.\n사람이 자주 지나다닌 자리입니다.\n문지방 앞, 창가 쪽,\n늘 앉던 그 자리.\n\n이제 잠시 손을 멈추고 그 닳은 자리를 바라봅니다.\n오늘 하루,\n내 마음이 자주 지나간 자리는 어디였을까요.\n어떤 생각을 몇 번이고 되풀이했는지.\n어떤 말을 자주 꺼냈는지.\n어떤 몸짓을 나도 모르게 반복했는지.\n\n찾아내려고 애쓰지 않습니다.\n마루를 살피듯 그저 눈으로 훑어봅니다.\n'아, 여기가 많이 닳았구나.' 그 한마디면 충분합니다.\n자주 지나간 자리는 자기도 모르는 사이에 생깁니다.\n그래서 가끔 이렇게 멈추어 보아야 합니다.\n\n닳은 자리 가운데 나를 아프게 하는 길이 하나 보인다면,\n그것을 지워 없애려 하지 않습니다.\n그저 내일,\n한 번쯤 다른 데를 밟아 보면 됩니다.\n자주 다니지 않으면 길은 저절로 옅어집니다.\n\n닦다 보면 얼룩도 눈에 띕니다.\n지난 일이 남긴 자국들.\n그 자리를 세게 문지르지 않습니다.\n힘주어 문지르면 얼룩보다 결이 먼저 상합니다.\n얼룩은 오늘 지우는 것이 아니라 매일 지나가는 손 아래에서 조금씩 옅어지는 것입니다.\n\n다시 걸레를 밀어 봅니다.\n앞으로, 한 뼘.\n그리고 또 한 뼘.\n같은 동작을 되풀이하는 동안 어깨의 힘이 빠지고 마음이 조용해집니다.\n반복은 지루한 것이 아니라 마음을 가라앉히는 일이기도 합니다.\n\n그러다 문득 이런 생각이 들지도 모릅니다.\n'이걸 매일 한다고 뭐가 달라지나.' 그 생각이 들어도 괜찮습니다.\n마루를 닦는 사람은 오늘의 변화를 보고 닦는 것이 아닙니다.\n그저 오늘 몫을 닦을 뿐입니다.\n\n며칠,\n몇 달을 걸렀더라도 괜찮습니다.\n그동안 못 닦은 날들을 따져 물을 필요는 없습니다.\n다시 걸레를 든 오늘이 바로 닦는 날입니다.\n성실은 한 번도 빠지지 않는 것이 아니라 번번이 다시 돌아오는 것입니다.\n\n정성을 들이는 마음,\n지나치지 않게 멈추는 마음,\n느려도 기다리는 마음,\n가진 것을 조금 나누는 마음.\n마루를 닦는 손이 매일 하고 있는 일이 그 넷입니다.\n거창한 이름이 붙어 있을 뿐,\n사실은 오늘 한 뼘을 미는 일입니다.\n\n이제 손을 멈추고 마루를 한번 바라봅니다.\n몇 해가 지났다고 생각해 봅니다.\n아침 햇살이 창을 넘어와 마루 위에 길게 눕습니다.\n빛이 닿은 자리에 은은한 윤이 흐릅니다.\n\n그 윤은 어느 하루가 만든 것이 아닙니다.\n표가 나지 않던 모든 날들이 겹치고 겹쳐 만들어진 것입니다.\n아무도 알아주지 않던 아침들,\n하기 싫었는데 그냥 했던 저녁들.\n그 날들이 지금 빛나고 있습니다.\n\n당신의 생각과 말과 행동도 그렇게 윤이 납니다.\n어느 날 사람들이 말할 것입니다.\n저 사람은 원래 그런 사람이라고.\n원래 그런 사람은 없습니다.\n매일 한 뼘씩 닦아 온 사람이 있을 뿐입니다.\n\n옛 글은 이렇게 말합니다.\n모든 것은 언젠가 스러진다고.\n그러니 오늘 하루를 미루지 말라고.\n서둘러 살라는 말이 아닙니다.\n오늘 몫의 한 뼘을 오늘 닦으라는 말입니다.\n\n손바닥을 마루에 얹어 봅니다.\n매끈하고 서늘하고,\n조금 따뜻합니다.\n그 감촉을 잠시 그대로 느껴 봅니다.\n\n이제 천천히 돌아올 준비를 합니다.\n이 감촉을 손바닥에 담아 둡니다.\n손가락을 조금씩 움직여 봅니다.\n손끝에 감각이 돌아옵니다.\n발가락도 가만히 움직여 봅니다.\n발바닥이 바닥에 닿아 있는 것을 다시 느껴 봅니다.\n어깨를 한 번 천천히 돌리고,\n숨을 조금 깊게 들이쉬었다가 길게 내쉽니다.\n\n오늘 하루,\n'이걸 해서 뭐 하나' 싶은 순간이 오면 손바닥으로 무릎이나 책상을 한 번 천천히 쓸어 보세요.\n마루를 닦듯이.\n그리고 속으로 말해 봅니다.\n'오늘 한 뼘.' 그거면 충분한 하루입니다.\n준비가 되셨으면 천천히 눈을 떠 봅니다.","duration":"약 15분","tags":"#성실 #매일한뼘 #반복의힘","series":"숨비명상"},{"id":"c6ff7e7d","category":"수용","title":"발목까지만","body":"한여름 계곡에 가 본 적이 있으신가요.\n물은 맑은데 보기만 해도 차가워 보입니다.\n사람들은 물가에 서서 한참을 망설입니다.\n발끝을 살짝 담갔다가 \"아이, 차가워\" 하며 얼른 뺍니다.\n그때 옆에 있던 누군가가 말합니다.\n\"발목까지만 들어가 봐.\" 오늘은 그 물가 이야기를 함께 해 보려 합니다.\n\n편안한 자리에 앉아 봅니다.\n두 발을 바닥에 나란히 내려놓습니다.\n발바닥이 바닥에 닿아 있는 느낌을 잠시 그대로 느껴 봅니다.\n준비가 되셨으면 눈을 천천히 감아 봅니다.\n감는 것이 불편하시면 시선을 아래로 낮추어도 괜찮습니다.\n지금 마음이 겁먹고 있어도 괜찮습니다.\n겁먹은 채로 시작하면 됩니다.\n\n숨이 들어오고 나가는 것을 가만히 지켜봅니다.\n숨을 고치려 하지 않습니다.\n지금 쉬어지는 대로 그대로 둡니다.\n들어오고, 나가고.\n내쉬는 숨이 조금씩 길어집니다.\n\n내쉴 때마다 어깨가 한 뼘 내려앉습니다.\n이마가 넓어집니다.\n턱이 느슨해집니다.\n오늘 아침,\n당신은 눈을 떴습니다.\n그것이 오늘 이미 일어난 가장 큰 일입니다.\n누군가에게는 오늘이 끝내 오지 않았습니다.\n지금 쉬고 있는 이 숨은 당연한 것이 아니라 받은 것입니다.\n\n이제 마음속으로 그 계곡의 물가에 서 봅니다.\n발밑에는 둥근 돌들이 있습니다.\n햇볕에 데워져 따끈합니다.\n물소리가 들립니다.\n높은 소리와 낮은 소리가 섞여 쉬지 않고 흐릅니다.\n바람에 나뭇잎이 흔들리고,\n물 위에 반짝이는 빛이 어른거립니다.\n\n물 건너편을 한번 바라봅니다.\n그리 멀지 않습니다.\n그런데 거기에 오래 미뤄 둔 일이 하나 있습니다.\n\n무엇이 떠오르나요.\n아주 대단한 일이 아니어도 됩니다.\n오래 미뤄 온 전화 한 통.\n꺼내지 못한 말 한마디.\n해 보고 싶었지만 '나는 안 될 것 같아' 하고 접어 두었던 일.\n가장 무거운 것은 오늘 꺼내지 않아도 됩니다.\n작은 것 하나면 충분합니다.\n\n그것이 저쪽에 놓여 있습니다.\n그리고 당신은 이쪽에 서 있습니다.\n그 사이에 물이 흐릅니다.\n\n이제 발을 들여다봅니다.\n발이 움직이지 않습니다.\n무엇이 발을 붙잡고 있나요.\n물일까요. 아닙니다.\n아직 물에 닿지도 않았습니다.\n발을 붙잡고 있는 것은 '차가울 거야'라는 생각입니다.\n\n늘 그랬습니다.\n상상 속의 물이 실제 물보다 훨씬 차갑습니다.\n망설이는 시간이 길어질수록 물은 점점 더 차가워집니다.\n그 사이 우리는 물가에 서서 한 해를 보내기도 합니다.\n\n이제 발끝을 물에 살짝 대 봅니다.\n차갑습니다.\n발가락이 오그라들고 숨이 훅 들어옵니다.\n괜찮습니다.\n그 정도면 오늘 이미 절반은 했습니다.\n\n이번에는 발목까지만 들어가 봅니다.\n딱 발목까지입니다.\n그 이상은 오늘 하지 않아도 됩니다.\n물이 복사뼈를 감쌉니다.\n시립니다.\n종아리에 소름이 돋고 숨이 짧아집니다.\n\n그 자리에 그대로 서서 숨을 쉽니다.\n들이쉬고, 내쉬고. 하나,\n둘, 셋. 그리고 조금 더.\n\n그러다 문득 알아차립니다.\n아까보다 덜 차갑습니다.\n물이 따뜻해진 것이 아닙니다.\n발이 물을 알게 된 것입니다.\n견딜 수 없을 것 같던 것도 잠시 그 안에 서 있으면 견딜 만한 것이 됩니다.\n\n이제 발목이 편안해지면 무릎까지 들어가 봅니다.\n물살이 종아리를 스치고 지나갑니다.\n밀었다가 놓아주고,\n다시 밀었다가 놓아줍니다.\n발밑의 돌이 미끄럽지만 발가락이 저절로 자리를 잡습니다.\n몸은 생각보다 훨씬 잘 압니다.\n\n그리고 어느 순간,\n숨을 한 번 크게 들이쉬고 어깨까지 물에 담가 봅니다.\n처음의 그 차가움이 이제는 시원함이 되어 있습니다.\n물이 몸을 안아 줍니다.\n몸이 가벼워집니다.\n발끝이 바닥에서 살짝 뜹니다.\n\n그 자리에서 물가에 서 있던 조금 전의 나를 돌아봅니다.\n그렇게 오래 망설이던 사람이 지금 물속에 있습니다.\n'뭐야, 들어와 보니 별것 아니네.' 그 마음이 바로 '까짓것'이라는 말의 뜻입니다.\n\n혹시 오늘 발목까지밖에 들어가지 못했더라도 괜찮습니다.\n그것은 물러선 것이 아닙니다.\n발목만큼 들어간 것입니다.\n어제는 물가에 서 있지도 않았습니다.\n물은 내일도 거기 있습니다.\n내일 다시 와서 무릎까지 들어가면 됩니다.\n\n옛 글은 이렇게 말합니다.\n뜻대로 되지 않는다고 지나치게 근심하지 말고,\n오래 무사했다고 너무 믿지도 말라고.\n처음 만나는 어려움을 꺼리지 말라고.\n첫 고비만 넘으면 그다음은 오히려 쉬워지는 법이라고.\n\n가장 어려운 것은 언제나 첫 발목입니다.\n그다음은 물이 알아서 데려갑니다.\n\n이제 천천히 물에서 나올 준비를 합니다.\n몸이 물 밖으로 나오면 바람이 살갗에 닿습니다.\n햇볕에 데워진 돌 위에 다시 발을 딛습니다.\n따끈합니다.\n젖은 몸에 그 온기가 천천히 스며듭니다.\n\n손가락을 조금씩 움직여 봅니다.\n손끝에 감각이 돌아옵니다.\n발가락도 가만히 움직여 봅니다.\n발바닥이 지금 이 자리의 바닥에 닿아 있는 것을 다시 느껴 봅니다.\n어깨를 한 번 천천히 돌리고,\n숨을 조금 깊게 들이쉬었다가 길게 내쉽니다.\n\n눈을 뜨기 전에 아까 물 건너편에 두고 온 그 일을 다시 떠올려 봅니다.\n오늘 그것의 '발목'은 무엇일까요.\n전화를 거는 것이 어렵다면 번호를 찾아 두는 것.\n시작이 어렵다면 연필을 꺼내 두는 것.\n그 정도면 됩니다.\n\n정하셨으면 한쪽 발을 반 뼘만 앞으로 살며시 내밀어 봅니다.\n그리고 속으로 한마디.\n'까짓것.' 방금 발목까지 들어갔습니다.\n준비가 되셨으면 천천히 눈을 떠 봅니다.","duration":"약 15분","tags":"#도전 #첫걸음 #까짓것","series":"숨비명상"},{"id":"1dddfc54","category":"수용","title":"넓어지는 품","body":"우는 아이를 달래 본 적이 있으신가요.\n그치라고 해도 울고,\n왜 우냐고 물어도 울고,\n사탕을 쥐여 줘도 웁니다.\n어떻게든 그치게 하려고 애쓸수록 아이는 더 크게 웁니다.\n그러다 지친 어른이 말없이 그냥 안아 버립니다.\n등을 두어 번 토닥입니다.\n그러면 신기하게도 울음이 딸꾹질로 바뀌고,\n어느새 잦아듭니다.\n아이를 그치게 한 것은 말이 아니라 품이었습니다.\n오늘은 그 품 이야기를 함께 해 보려 합니다.\n\n편안한 자리에 앉아 봅니다.\n두 손을 무릎 위에 가만히 내려놓습니다.\n준비가 되셨으면 눈을 천천히 감아 봅니다.\n감는 것이 불편하시면 시선을 아래로 낮추어도 괜찮습니다.\n지금 마음이 어수선해도 괜찮습니다.\n어수선한 그대로 데리고 앉습니다.\n\n숨이 들어오고 나가는 것을 가만히 지켜봅니다.\n숨을 고치려 하지 않습니다.\n지금 쉬어지는 대로 그대로 둡니다.\n들어오고, 나가고.\n내쉬는 숨이 조금씩 길어집니다.\n\n내쉴 때마다 어깨가 한 뼘 내려앉습니다.\n이마가 넓어집니다.\n턱이 느슨해집니다.\n가슴께가 조금 부드러워집니다.\n지금 이 몸은 당신이 무엇을 하든 말없이 당신을 데리고 다녔습니다.\n그것도 하나의 품입니다.\n\n이제 마음속을 조용히 들여다봅니다.\n요즘 그 안에서 울고 있는 것이 하나 있을지도 모릅니다.\n잘 풀리지 않는 일일 수도 있고,\n자꾸 떠오르는 장면일 수도 있고,\n이름 붙이기 어려운 답답함일 수도 있습니다.\n\n그것을 그동안 어떻게 대했는지 잠시 떠올려 봅니다.\n빨리 없애려고 애쓰지 않았나요.\n'이러면 안 되는데' 하고 자꾸 밀어내지 않았나요.\n생각하지 않으려 할수록 더 크게 떠오르지 않았나요.\n\n괴로움은 하나였는데,\n그것을 밀어내려는 마음이 괴로움을 하나 더 만듭니다.\n그리고 그 위에 '왜 나는 이것 하나 못 다스릴까' 하는 마음이 또 하나를 얹습니다.\n우리를 정말 지치게 하는 것은 처음의 그것이 아니라 그 위에 쌓인 것들입니다.\n\n그러니 오늘은 아무것도 하지 않아 보려 합니다.\n없애지도 않고,\n고치지도 않고,\n이유를 캐묻지도 않습니다.\n\n두 팔을 들어 가슴 앞에서 교차해 봅니다.\n한 손은 반대편 어깨 위에,\n다른 손은 그 아래 팔 위에 가만히 얹습니다.\n자기 몸을 안듯이.\n팔의 무게가 가슴에 얹히는 느낌을 잠시 그대로 느껴 봅니다.\n\n이 안에 울고 있는 그것이 있습니다.\n흔들어 달래지 않습니다.\n그저 안고 있습니다.\n그리고 아주 천천히 어깨를 두어 번 토닥여 봅니다.\n토닥, 토닥.\n\n울음이 그치지 않아도 괜찮습니다.\n그치게 하려고 안는 것이 아닙니다.\n혼자 두지 않으려고 안는 것입니다.\n그것 하나면 충분합니다.\n\n숨을 들이쉬면 품이 조금 넓어지고,\n내쉬면 품이 조금 부드러워집니다.\n안고 있는 동안 아무 일도 일어나지 않는 것 같습니다.\n그런데 조금 있으면 안쪽의 무언가가 아주 조금 헐거워집니다.\n밀어낼 때는 꿈쩍도 않던 것이,\n안아 주니 스스로 몸을 풉니다.\n\n이제 그 품을 조금 더 넓혀 봅니다.\n살아오면서 내가 아프게 한 사람이 한 명쯤 떠오를지도 모릅니다.\n이상하게도 가까운 사람일수록 말이 더 날카로웠습니다.\n편하다는 이유로,\n받아 줄 거라는 이유로.\n\n그 사람의 얼굴이 떠오르면 잠시 그대로 바라봅니다.\n변명하지 않습니다.\n설명하지 않습니다.\n지금은 어떤 말도 필요 없는 시간입니다.\n그저 마음속에서 그 사람을 가만히 안아 봅니다.\n\n혹시 떠오른 사람이 나를 아프게 한 사람이라면,\n오늘 그 사람을 안지 않아도 됩니다.\n아직 안을 수 없는 사람을 안는 것은 포용이 아니라 억지입니다.\n그럴 때는 팔을 돌려 다시 나를 안습니다.\n그것이 오늘의 순서입니다.\n\n그리고 마지막으로 한 사람이 더 남아 있습니다.\n그 일이 있은 뒤로 자신을 오래 미워한 사람.\n바로 당신입니다.\n\n미안한 마음과 자신을 미워하는 마음은 다른 것입니다.\n미안한 마음은 앞으로 걸어가게 하지만 미워하는 마음은 그 자리에 묶어 둡니다.\n그러니 그 사람도 함께 안아 줍니다.\n'그때는 그것밖에 몰랐구나.' '이제는 조금 알겠구나.' 그 한마디면 충분합니다.\n\n이제 품이 조금씩 넓어집니다.\n가슴을 넘어, 방을 넘어,\n땅처럼 넓어집니다.\n땅을 생각해 봅니다.\n땅 위에는 온갖 것이 떨어집니다.\n고운 것도 떨어지고 더러운 것도 떨어집니다.\n그런데 땅은 어느 것도 밀어내지 않습니다.\n말없이 다 받습니다.\n그리고 얼마 뒤,\n바로 그 자리에서 풀이 올라옵니다.\n\n버려진 것이 거름이 되는 데에는 특별한 재주가 필요하지 않았습니다.\n밀어내지 않고 품고 있었을 뿐입니다.\n당신 안의 그 울음도 언젠가 그렇게 될 것입니다.\n\n옛 글은 이렇게 말합니다.\n땅처럼 너그럽고,\n흙탕이 가라앉은 호수처럼 맑은 사람은 마음이 잔잔하고 말과 행동도 고요하다고.\n그 고요는 참아서 얻은 것이 아닙니다.\n품이 넓어지면 저절로 따라오는 것입니다.\n\n잠시 그대로 안고 있어 봅니다.\n팔의 무게, 손바닥의 온기,\n가슴이 오르내리는 움직임.\n안는 사람과 안기는 사람이 사실은 하나입니다.\n\n이제 천천히 돌아올 준비를 합니다.\n교차한 팔을 아주 천천히 풀어 무릎 위에 내려놓습니다.\n가슴에 남은 온기는 그대로 둡니다.\n손가락을 조금씩 움직여 봅니다.\n손끝에 감각이 돌아옵니다.\n발가락도 가만히 움직여 봅니다.\n발바닥이 바닥에 닿아 있는 것을 다시 느껴 봅니다.\n어깨를 한 번 천천히 돌리고,\n숨을 조금 깊게 들이쉬었다가 길게 내쉽니다.\n\n오늘 하루,\n마음속에서 무언가 울기 시작하면 없애려 하지 말고 두 팔로 어깨를 감싸 세 번만 토닥여 보세요.\n그리고 속으로 말해 줍니다.\n'여기 있어.' 그 말이 당신의 품을 조금씩 넓힐 것입니다.\n준비가 되셨으면 천천히 눈을 떠 봅니다.","duration":"약 16분","tags":"#포용 #자기위로 #괴로움과함께","series":"숨비명상"},{"id":"f4c49eb1","category":"수용","title":"벗어 둔 외투","body":"봄이 왔는데도 겨울 외투를 그대로 입고 다니는 날이 있습니다.\n아침에 늘 입던 것을 집어 들고 나섰을 뿐입니다.\n그러다 계단을 오르다가 등에 땀이 배어서야 알아차립니다.\n'아, 내가 아직 이걸 입고 있었구나.' 누가 입힌 것도 아니고 벗지 말라고 한 사람도 없었습니다.\n그저 겨울 내내 입던 것이라 익숙했을 뿐입니다.\n오늘은 그 외투 이야기를 함께 해 보려 합니다.\n\n편안한 자리에 앉아 봅니다.\n두 손을 무릎 위에 가만히 내려놓습니다.\n준비가 되셨으면 눈을 천천히 감아 봅니다.\n감는 것이 불편하시면 시선을 아래로 낮추어도 괜찮습니다.\n지금 몸이 무겁고 답답해도 괜찮습니다.\n그것을 알아차리는 것부터 시작합니다.\n\n숨이 들어오고 나가는 것을 가만히 지켜봅니다.\n숨을 고치려 하지 않습니다.\n지금 쉬어지는 대로 그대로 둡니다.\n들어오고, 나가고.\n내쉬는 숨이 조금씩 길어집니다.\n\n내쉴 때마다 어깨가 한 뼘 내려앉습니다.\n이마가 넓어집니다.\n턱이 느슨해집니다.\n그런데 아무리 힘을 빼도 어깨 어딘가가 계속 눌려 있는 것 같습니다.\n\n이제 그 어깨를 느껴 봅니다.\n지금 당신은 두꺼운 외투를 하나 입고 있습니다.\n어깨에 얹힌 묵직한 무게.\n소매의 뻣뻣함.\n목덜미를 감싼 깃의 답답함.\n안쪽은 조금 덥고,\n등에는 땀이 배어 있습니다.\n\n언제부터 입고 있었는지 잘 기억나지 않습니다.\n너무 오래 입어서 이제는 이것이 내 몸인 줄 알았습니다.\n\n이 외투에는 주머니가 있습니다.\n한 손을 넣어 봅니다.\n무언가 만져집니다.\n꺼내서 손바닥 위에 올려놓아 봅니다.\n\n첫 번째 것은 남들이 나를 어떻게 볼까 하는 마음입니다.\n그것을 손바닥에 올려놓고 잠시 바라봅니다.\n없애려 하지 않습니다.\n'아, 이걸 넣고 다녔구나.' 그 한마디면 충분합니다.\n\n다시 주머니에 손을 넣어 봅니다.\n두 번째 것이 만져집니다.\n'나는 원래 이런 사람이야'라는 생각입니다.\n나는 원래 소심해서,\n나는 원래 못해서,\n나는 원래 그런 사람이라서.\n그 말을 언제부터 했는지 기억나지 않을 만큼 오래되었습니다.\n그것도 꺼내어 손바닥에 올려 둡니다.\n\n한 번 더 손을 넣어 봅니다.\n세 번째 것은 조금 단단하고 묵직합니다.\n'내가 옳다'는 마음입니다.\n그 마음이 있을 때 우리는 참 힘이 나지만,\n동시에 아무것도 들어오지 못합니다.\n그것도 꺼내어 가만히 바라봅니다.\n\n주머니에 무엇이 더 있는지 서둘러 다 꺼내지 않아도 됩니다.\n오늘은 세 개면 충분합니다.\n아무것도 잡히지 않는다면 그것도 괜찮습니다.\n주머니에 손을 넣어 본 것만으로 이미 알아차림이 시작되었습니다.\n\n이제 손바닥 위의 것들을 봅니다.\n이것들이 나를 가둔 것일까요.\n가만히 보면 누구도 나를 가두지 않았습니다.\n그저 내가 계속 걸치고 있었을 뿐입니다.\n\n그렇다고 이 외투를 미워하지 않습니다.\n지난겨울,\n이것이 나를 지켜 주었습니다.\n남의 눈을 살피던 마음이 나를 조심스럽게 만들었고,\n'나는 원래 이렇다'는 말이 더 다치지 않게 해 주었습니다.\n그때는 그것이 필요했습니다.\n\n그러니 벗기 전에 한마디 건네 봅니다.\n'그동안 고마웠어.' 미워하며 벗어 던진 것은 얼마 못 가 다시 입게 됩니다.\n고맙다고 하고 벗은 것만 가벼워집니다.\n\n이제 천천히 단추를 풀어 봅니다.\n맨 위 단추부터.\n숨을 들이쉬고,\n내쉬면서 하나.\n\n목덜미가 서늘해집니다.\n공기가 목 안쪽으로 들어옵니다.\n\n들이쉬고,\n내쉬면서 두 번째 단추.\n\n가슴이 조금 넓어집니다.\n숨이 아까보다 깊이 들어옵니다.\n\n들이쉬고,\n내쉬면서 세 번째 단추.\n\n배가 편안해집니다.\n\n단추를 다 풀지 못해도 괜찮습니다.\n하나만 풀어도 바람은 들어옵니다.\n\n이제 한쪽 어깨를 천천히 뒤로 빼 봅니다.\n소매에서 팔이 빠져나옵니다.\n팔이 갑자기 가벼워집니다.\n다른 쪽 어깨도 뒤로 빼 봅니다.\n소매가 손목을 지나 손끝을 빠져나갑니다.\n\n외투가 등 뒤로 흘러내립니다.\n그것을 옆자리에 가만히 내려놓습니다.\n버리는 것이 아니라 내려놓는 것입니다.\n\n어깨를 한 번 들었다가 툭 떨어뜨려 봅니다.\n가볍습니다.\n이렇게 가벼웠나 싶을 만큼.\n등에 바람이 닿습니다.\n셔츠 한 장 사이로 서늘한 공기가 지나갑니다.\n팔을 들어 올려 봅니다.\n어디에도 걸리지 않습니다.\n\n숨을 크게 들이쉬어 봅니다.\n가슴이 끝까지 벌어집니다.\n아무것도 얻지 않았는데 이렇게 가벼워졌습니다.\n자유는 무언가를 더 가져서 오는 것이 아니라 걸치고 있던 것을 알아차릴 때 저절로 오는 것이었습니다.\n\n옛 글은 이렇게 말합니다.\n마음이 맑은 사람은 마음에 매이지 않고,\n참으로 아는 사람은 자기가 아는 것에도 매이지 않는다고.\n내가 옳다는 것마저 가만히 내려놓을 수 있을 때 비로소 걸림이 없다고.\n\n잠시 그대로 앉아 가벼워진 어깨를 느껴 봅니다.\n들어오는 숨과 나가는 숨 사이,\n아무것도 붙잡고 있지 않은 이 순간.\n지금 여기,\n당신은 자유롭습니다.\n\n날이 다시 추워지면 그 외투를 또 입게 될지도 모릅니다.\n그래도 괜찮습니다.\n다만 이제는 입고 있다는 것을 알면서 입게 됩니다.\n모르고 입은 옷은 나를 가두지만,\n알고 입은 옷은 언제든 벗을 수 있습니다.\n그 차이가 전부입니다.\n\n이제 천천히 돌아올 준비를 합니다.\n어깨의 가벼움을 그대로 담아 둡니다.\n손가락을 조금씩 움직여 봅니다.\n손끝에 감각이 돌아옵니다.\n발가락도 가만히 움직여 봅니다.\n발바닥이 바닥에 닿아 있는 것을 다시 느껴 봅니다.\n목을 한 번 천천히 돌리고,\n숨을 조금 깊게 들이쉬었다가 길게 내쉽니다.\n\n오늘 하루,\n마음이 답답하고 꽉 막힌 것 같으면 어깨를 한 번 으쓱 올렸다가 툭 떨어뜨려 보세요.\n그리고 속으로 물어봅니다.\n'지금 나는 무엇을 걸치고 있지?' 그 물음 하나가 단추 하나를 풀어 줄 것입니다.\n준비가 되셨으면 천천히 눈을 떠 봅니다.","duration":"약 16분","tags":"#자유 #묵은습 #내려놓기","series":"숨비명상"},{"id":"8faf6c24","category":"관찰","title":"파도를 바라보며","body":"파도는 멀리서 밀려옵니다.\n크게 부풀어 올랐다가,\n모래에 닿으면 스르르 풀어집니다.\n아무리 높은 파도도 그 자리에 오래 머물지 않습니다.\n\n오늘은 마음에 이는 감정의 파도를,\n가만히 바라보는 시간을 가져 봅니다.\n\n편안한 자리에 앉거나 누워 봅니다.\n몸을 억지로 바르게 하지 않아도 됩니다.\n지금 그 자세 그대로,\n어깨의 힘을 살며시 내려놓습니다.\n\n준비가 되면 천천히 눈을 감아 봅니다.\n눈을 감아도 마음이 소란하다면,\n그래도 괜찮습니다.\n바다에 나가기 전,\n파도 소리를 먼저 듣는 것뿐입니다.\n\n이제 숨을 천천히 들이마셔 봅니다.\n그리고 길게 내쉽니다.\n내쉬는 숨에,\n하루 동안 꼭 쥐고 있던 것들이 조금 풀려납니다.\n\n한 번 더, 들이마시고.\n내쉬며,\n발끝까지 힘을 내려놓습니다.\n숨이 잘 느껴지지 않아도 괜찮습니다.\n그저 숨이 드나든다는 것만 알아차리면 됩니다.\n\n이제 마음을 넓은 바닷가로 데려가 봅니다.\n당신은 파도가 닿지 않는 자리에 앉아 있습니다.\n발밑에는 따뜻한 모래가 있고,\n멀리서 파도가 하나둘 밀려옵니다.\n\n파도가 밀려올 때,\n잠시 오늘 하루를 떠올려 봅니다.\n누군가의 말에 서운했던 순간.\n뜻대로 되지 않아 화가 났던 순간.\n무언가가 자꾸 밉게만 보이던 순간.\n\n그 감정이 밀려올 때는,\n마치 그것이 나인 것처럼 느껴집니다.\n화가 곧 나이고,\n서운함이 곧 나인 것처럼요.\n하지만 가만히,\n가만히 바라보세요.\n그것은 내가 아니라,\n지나가는 하나의 파도입니다.\n\n감정이 일어날 때,\n크게 심호흡을 한 번 해 봅니다.\n들이마시고. 내쉬며,\n그 파도를 바라봅니다.\n밀어내지 않아도 됩니다.\n붙잡지 않아도 됩니다.\n파도가 높으면 높은 대로,\n그저 일어나는 것을 지켜봅니다.\n\n보세요. 방금 그 감정이,\n조금씩 낮아지고 있습니다.\n밀려왔던 파도가 모래에 닿아 스르르 풀어지듯이.\n\n이렇게 바라보는 이 시간이,\n바로 인내의 시간입니다.\n인내란 이를 악물고 참는 것이 아닙니다.\n일어난 감정을 묵묵히 알아차리고,\n지나가도록 지켜보는 마음입니다.\n\n옛 글은 이렇게 말합니다.\n강한 사람의 무례한 말은 두려워서 참기 쉽고,\n나와 비슷한 이의 무례함은 다툼이 싫어 참기 쉽지만,\n나보다 약한 이의 무례함까지 조용히 견디는 것,\n그것이야말로 진정한 인내라고요.\n\n그 인내는 억누름에서 오지 않습니다.\n파도를 바라보듯,\n감정을 바라보는 힘에서 옵니다.\n\n다시 숨을 들이마시고,\n길게 내쉬어 봅니다.\n바라보는 이 마음 안에서는,\n어떤 파도도 나를 삼키지 못합니다.\n파도는 왔다가 가고,\n당신은 그 자리에 그대로 있습니다.\n이 알아차림이,\n당신의 하루를 조금 더 지혜롭게,\n조금 더 따뜻하게 만들어 줄 것입니다.\n\n이제 천천히 바닷가에서 돌아옵니다.\n파도 소리가 조금씩 멀어집니다.\n손끝을 가볍게 움직여 봅니다.\n발끝도 천천히 움직여 봅니다.\n\n오늘 하루,\n마음에 파도가 일거든 기억해 보세요.\n'잠깐 멈춤.' 크게 숨 한 번 쉬고,\n그 파도를 가만히 바라보는 것.\n그 짧은 멈춤이,\n당신을 지켜 줄 것입니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 9분","tags":"#인내명상 #감정알아차림 #마음챙김","series":"숨비명상"},{"id":"9ae74d1b","category":"관찰","title":"거울 앞에서","body":"거울 앞에 서 본 적 있나요.\n가만히 내 얼굴을 바라보면,\n어딘가 조금 낯섭니다.\n그런데 빙그레 웃어 보면,\n거울 속의 나도 따라 웃습니다.\n\n오늘은 그 거울을 마음에 들여와,\n나와 세상이 어울리는 시간을 가져 봅니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 살며시 내려놓습니다.\n눈은 부드럽게 감아도 좋고,\n반쯤 떠 두어도 괜찮습니다.\n\n숨을 천천히 들이마시고,\n길게 내쉬어 봅니다.\n내쉬는 숨마다,\n누군가와 부딪혀 생긴 마음이 조금씩 가라앉습니다.\n\n이제 마음속에 맑은 거울 하나를 떠올려 봅니다.\n그 거울 앞에 내가 서 있습니다.\n거울 속의 나를 가만히 바라봅니다.\n\n조금 낯설어도 괜찮습니다.\n환하게 웃는 얼굴이 아니어도 괜찮습니다.\n그저 있는 그대로의 나를 바라봅니다.\n\n이제 입가를 아주 조금,\n'싱긋' 올려 봅니다.\n어색해도 괜찮습니다.\n거울 속의 나도,\n가만히 따라 웃습니다.\n\n내가 먼저 웃으니,\n거울 속의 나도 웃습니다.\n이것이 어울림의 법칙입니다.\n좋은 생각, 좋은 말,\n좋은 행동으로 어울림의 문은 먼저 열립니다.\n\n이제 그 거울 자리에,\n오늘 만날 누군가의 얼굴을 떠올려 봅니다.\n가족일 수도,\n이웃일 수도 있습니다.\n그 사람에게도 마음속으로,\n싱긋 미소를 건네 봅니다.\n\n옛 글은 말합니다.\n참된 행복은 서로 어우러짐에 있다고요.\n마음이 맞닿아 함께 어울릴 때,\n그 자리에 조용히 꽃이 피어납니다.\n\n타인의 눈에 비친 나는,\n처음의 낯선 얼굴이 아니라,\n지금 미소 짓는 이 얼굴입니다.\n너와 나 사이에도,\n그렇게 꽃 한 송이가 피어납니다.\n\n이제 거울을 천천히 내려놓습니다.\n그 미소만 마음에 남겨 둡니다.\n손끝을 가볍게 움직여 보고,\n천천히 숨을 고릅니다.\n\n오늘 누군가와 마주치거든,\n거울을 대하듯 먼저 '싱긋' 웃어 보세요.\n그 작은 미소 하나가,\n너와 나의 관계에 꽃을 피울 것입니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#어울림명상 #관계명상 #미소명상","series":"숨비명상"},{"id":"38a9504c","category":"탈중심화","title":"두 손으로 받들다","body":"아주 귀한 것을 건넬 때,\n우리는 두 손으로 받쳐 듭니다.\n저절로 손길이 느려지고,\n마음이 조심스러워집니다.\n\n오늘은 그 두 손의 마음으로,\n나와 곁의 사람을 대하는 시간을 가져 봅니다.\n\n편안한 자리에 앉아 봅니다.\n두 손을 무릎 위에 가만히 포개어 놓습니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n한 번 더, 들이쉬고,\n내쉬며 어깨의 힘을 내려놓습니다.\n\n먼저,\n나 자신을 떠올려 봅니다.\n존중은 나와 남을 나누지 않습니다.\n내가 나를 귀하게 여길 때,\n비로소 남도 귀하게 대할 수 있습니다.\n\n그동안 애써 온 나를,\n가만히 두 손으로 받들듯 바라봅니다.\n부족한 점이 떠올라도 괜찮습니다.\n있는 그대로의 나를,\n'참 귀한 사람이구나' 하고 인정해 봅니다.\n\n이제 마음의 창을 열어,\n함께 살아가는 인연들을 떠올려 봅니다.\n부모님, 곁의 사람, 형제,\n나를 이끌어 준 스승,\n아이들,\n길을 함께 걷는 벗들.\n\n그중 한 사람을 마음에 모셔 봅니다.\n그 사람을 두 손으로 받들듯,\n가만히 바라봅니다.\n그리고 다짐해 봅니다.\n오늘 그에게 건넬 존중의 말 한마디,\n따뜻한 행동 하나를.\n\n마음속에만 담아 둔 존중은,\n아직 전해지지 않았습니다.\n생각이 말이 되고,\n말이 행동이 되어 닿을 때,\n그제야 상대도 존중받음을 느낍니다.\n\n내가 먼저 귀하게 여기면,\n나 또한 누군가에게 귀하게 여겨집니다.\n옛 글은 말합니다.\n존중하고 겸손하며,\n만족하고 감사하는 것,\n그것이 으뜸가는 행복이라고요.\n\n이제 떠올린 얼굴들을,\n마음 깊은 곳에 고이 내려놓습니다.\n포갠 두 손의 온기를 느껴 봅니다.\n손끝을 가볍게 움직여 봅니다.\n\n오늘 하루,\n누군가를 마주하거든 기억해 보세요.\n귀한 것을 두 손으로 받들듯,\n그 마음을 말과 행동으로 건네는 것.\n그 한 번의 표현이,\n존중의 길을 엽니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#존중명상 #자기존중 #관계명상","series":"숨비명상"},{"id":"29ff9c32","category":"자비희사","title":"촛불 나누기","body":"어두운 방에 촛불 하나가 켜져 있습니다.\n그 불로 다른 초에 불을 옮겨도,\n처음의 촛불은 사라지지 않습니다.\n오히려 두 불빛이 함께,\n방을 더 환하게 밝힙니다.\n\n오늘은 그 촛불의 마음으로,\n너와 나 함께 밝아지는 시간을 가져 봅니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 살며시 내려놓습니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n숨이 드나드는 것을,\n가만히 따라가 봅니다.\n\n이제 내 가슴 한가운데,\n작은 촛불 하나를 떠올려 봅니다.\n그 불빛이 따뜻하게,\n나를 먼저 감싸 안습니다.\n\n그 온기를 담아,\n마음속으로 가만히 읊조려 봅니다.\n'나는 내가 행복하기를 바랍니다.' '나는 내가 고통에서 벗어나기를 바랍니다.' '나는 내가 진정으로 행복하기를 바랍니다.'\n\n잘 느껴지지 않아도 괜찮습니다.\n말이 겉도는 것 같아도 괜찮습니다.\n그저 그 문장을 마음에 심으면 됩니다.\n\n이제 내 앞에,\n또 하나의 초를 떠올려 봅니다.\n오늘 마음에 걸리는 사람도,\n고마운 사람도 좋습니다.\n내 촛불을 그 초에 살며시 옮깁니다.\n\n불빛이 번지는 것을 바라보며,\n다시 가만히 읊조려 봅니다.\n'나는 나와 당신이 행복하기를 바랍니다.' '나는 나와 당신이 고통에서 벗어나기를 바랍니다.' '나는 나와 당신이 진정으로 행복하기를 바랍니다.'\n\n보세요.\n불을 나누어 주었는데도,\n내 촛불은 조금도 줄지 않았습니다.\n오히려 두 불빛이 만나,\n어둠이 한결 물러갑니다.\n\n이것이 상생입니다.\n나 혼자만의 행복이 아니라,\n너와 나가 함께 밝아지는 길입니다.\n옛 글은 말합니다.\n부드럽게 말을 건네고,\n이롭게 행동하고,\n함께 걸어가라고요.\n그러면 서로가 서로의 편이 됩니다.\n\n이제 두 촛불을,\n마음 안에 나란히 밝혀 둡니다.\n그 따뜻함을 기억하며,\n손끝을 가볍게 움직여 봅니다.\n\n오늘 누군가를 만나거든,\n촛불을 나누듯 건네 보세요.\n부드러운 말 한마디,\n이로운 행동 하나.\n내 불은 줄지 않고,\n세상은 조금 더 환해집니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#상생명상 #자비명상 #자애명상","series":"숨비명상"},{"id":"6e29887a","category":"자비희사","title":"품 안에서","body":"누군가 나를 가만히 안아 준 적,\n있으신가요. 그 품 안에서는,\n들뜬 숨도 잦아들고,\n불안한 마음도 천천히 가라앉습니다.\n\n오늘은 그 따뜻한 품을,\n주고받는 시간을 가져 봅니다.\n\n우리는 누구도 홀로 살지 않습니다.\n서로 기대고, 서로 품으며,\n그렇게 함께 살아갑니다.\n나만을 위한 마음만으로는,\n끝내 행복해지기 어렵습니다.\n\n편안한 자리에 앉거나 누워 봅니다.\n어깨를 살며시 내려놓습니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n한 번 더, 들이쉬고,\n내쉬며 몸의 긴장을 풀어 봅니다.\n\n이제 상상해 봅니다.\n엄마가 아이를 안아 주듯,\n누군가 나를 따뜻이 안아 줍니다.\n그 품은 넓고,\n조금도 서두르지 않습니다.\n\n그 품에 가만히 기대어 봅니다.\n등을 토닥이는 온기,\n나를 감싸는 팔의 무게.\n'참 애썼다'는 말이,\n소리 없이 전해집니다.\n\n아무 느낌이 없어도 괜찮습니다.\n안기는 것이 어색해도 괜찮습니다.\n그저 안겨 있다고,\n떠올리는 것만으로 충분합니다.\n\n들떴던 숨이 차분해지고,\n불안하던 마음이 평안해집니다.\n한없이 위로받는 그 느낌으로,\n마음이 가득 채워집니다.\n\n이제 천천히 그 품에서 나와,\n두 팔을 살며시 벌려 봅니다.\n내가 누군가를 안아 줍니다.\n가족일 수도, 벗일 수도,\n평소 미웠던 사람일 수도 있습니다.\n\n그를 품에 안고,\n온 마음으로 빌어 줍니다.\n고통에서 벗어나 행복하기를,\n외로움에서 벗어나 평안하기를.\n\n옛 글은 말합니다.\n대지가 만물을 안아 기르듯,\n서로를 성숙시켜 주는 벗이 되라고요.\n나를 안아 준 그 품처럼,\n나도 누군가에게 대지 같은 품이 됩니다.\n\n품에 안았던 그 사람을,\n마음속에 고이 내려놓습니다.\n두 팔의 온기를 기억하며,\n손끝을 가볍게 움직여 봅니다.\n\n오늘 하루,\n곁에 있는 누군가에게 다가가,\n말없이 한 번 안아 보세요.\n서로의 심장이 포개지는 그 순간,\n행복의 씨앗 하나가 심어집니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#포옹명상 #자비명상 #위로명상","series":"숨비명상"},{"id":"13555498","category":"호흡명상","title":"숨으로 돌아오다","body":"하루에도 수없이,\n우리는 지금을 놓칩니다.\n숨이 드나드는 것도,\n내가 살아 있다는 것도,\n잊은 채 흘러갑니다.\n\n오늘은 흐트러진 마음을,\n숨으로 데려와 보는 시간을 가져 봅니다.\n\n편안한 자리에 앉아 봅니다.\n허리를 부드럽게 세우고,\n천천히 눈을 감아 봅니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n애써 숨을 고치지 않아도 됩니다.\n그저 오는 대로,\n가는 대로 둡니다.\n\n이제 코끝으로,\n가만히 주의를 옮겨 봅니다.\n들이쉴 때 서늘하게 들어오는 공기,\n내쉴 때 따뜻하게 나가는 숨.\n그 작은 감각에 머물러 봅니다.\n\n숨이 들어오는 이 순간,\n나는 지금 여기 살아 있습니다.\n숨이 나가는 이 순간에도,\n나는 분명히 존재합니다.\n숨 하나하나가,\n살아 있음의 증거입니다.\n\n가만히 있다 보면,\n마음은 어느새 딴 곳으로 갑니다.\n지난 일로, 다가올 일로.\n그래도 괜찮습니다.\n떠났음을 알아차린 그 순간이,\n바로 돌아온 순간입니다.\n\n알아차렸다면,\n다시 코끝의 숨으로 돌아옵니다.\n몇 번을 떠나든 상관없습니다.\n다시 돌아오는 이 힘,\n이것이 통찰입니다.\n\n이제 숨을 바라보는,\n그 마음을 살며시 돌아봅니다.\n숨을 알아차리는 이는 누구일까요.\n바로 지금 이 순간을,\n살아 있는 나 자신입니다.\n\n바라봄과 머무름은,\n서로 떨어져 있지 않습니다.\n옛 글은 말합니다.\n꿰뚫어 봄이 없으면 머무름도 없고,\n머무름이 없으면 꿰뚫어 봄도 없다고요.\n숨에 머물기에 보이고,\n보기에 다시 숨에 머뭅니다.\n\n이제 숨을 자연스럽게 두고,\n몸 전체로 주의를 넓혀 봅니다.\n지금 이 자리의 고요를,\n가만히 느껴 봅니다.\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n마음이 어지러워지거든,\n잠시 코끝의 숨 세 번을 느껴 보세요.\n그 세 번의 숨이,\n당신을 지금 이 순간으로,\n다시 데려다줄 것입니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#통찰명상 #호흡명상 #알아차림","series":"숨비명상"},{"id":"2d40ccff","category":"탈중심화","title":"나에게 절하다","body":"아주 귀한 것 앞에서,\n우리는 저절로 고개를 숙입니다.\n몸을 낮추는 그 순간,\n마음도 함께 부드러워집니다.\n\n오늘은 그 절하는 마음을,\n나 자신에게서부터 시작해 봅니다.\n\n존경은 멀리 있지 않습니다.\n남의 생각과 말과 행동을,\n함부로 여기지 않고 받아들이는 마음입니다.\n세상 모든 존재는,\n있는 그대로 소중하니까요.\n\n편안한 자리에 앉아 봅니다.\n공간이 허락한다면,\n앞에 방석을 하나 놓아도 좋습니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n어깨의 힘을 내려놓습니다.\n\n이제 첫 번째 절을 올려 봅니다.\n내 안의 가장 밝고 맑은 마음,\n본래 부처라 불러 온 그 마음을 향해,\n상체를 천천히 숙였다 일으킵니다.\n몸이 어려우면,\n마음으로 고개를 숙여도 됩니다.\n\n두 번째 절을 올립니다.\n바르게 살아 보려,\n날마다 애쓰는 나 자신을 향해,\n다시 정성스레 숙였다 일으킵니다.\n\n세 번째 절을 올립니다.\n지금 이 순간,\n내 삶의 주인공으로 사는 나를 향해,\n마지막 절을 올립니다.\n\n어색해도 괜찮습니다.\n나에게 절하는 것이,\n낯설게 느껴져도 괜찮습니다.\n가만히 그 느낌을 바라봅니다.\n가슴 어딘가가,\n조금 뭉클해질지도 모릅니다.\n\n이제 그 절하는 마음 그대로,\n한 사람을 떠올려 봅니다.\n그를 향해 마음으로,\n정성스레 고개를 숙여 봅니다.\n그의 생각도, 말도, 행동도,\n있는 그대로 받아들여 봅니다.\n\n내가 소중하고 존중받아야 하듯,\n그 사람도 똑같이 소중합니다.\n옛 글은 말합니다.\n존경하고 받들며 배우는 마음이,\n삶을 오래도록 아름답고,\n건강하게 한다고요.\n\n떠올린 그 사람을,\n마음속에 고이 내려놓습니다.\n숙였던 마음의 온기를 느끼며,\n손끝을 가볍게 움직여 봅니다.\n\n오늘 하루,\n누군가를 마주하거든,\n마음으로 조용히 고개 한 번 숙여 보세요.\n나에게 절하던 그 마음이,\n그대로 존경이 되고,\n자비가 됩니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#존경명상 #자기존중 #절명상","series":"숨비명상"},{"id":"cfac9d0d","category":"자비희사","title":"손을 맞잡다","body":"누군가의 손을 잡아 본 적 있나요.\n내가 그 손을 잡는 순간,\n내 손도 함께 잡힙니다.\n따뜻함이 건너가고,\n그만큼 따뜻함이 돌아옵니다.\n\n오늘은 그 맞잡은 손의 마음으로,\n사랑을 들여다보는 시간을 가져 봅니다.\n\n사랑은 말로 다 설명할 수 없습니다.\n그래도 우리는,\n날마다 사랑을 주고받으며 삽니다.\n지금 이렇게 살아 있기에,\n사랑할 수 있습니다.\n\n편안한 자리에 앉아 봅니다.\n두 손을 가만히 맞잡아 봅니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n맞잡은 두 손의 온기를,\n가만히 느껴 봅니다.\n\n그 손안에서,\n가늘게 뛰는 맥을 느껴 봅니다.\n내가 살아 있다는 신호입니다.\n살아 있기에 나는,\n사랑할 수 있는 사람입니다.\n그런 나를,\n'참 고맙다' 하고 안아 줍니다.\n\n이제 사랑하는 한 사람을,\n마음속에 떠올려 봅니다.\n그 사람의 손을 살며시 잡아 봅니다.\n내 온기가 건너가고,\n그의 온기가 내게 스며듭니다.\n어느새 누구의 온기인지,\n가늠할 수 없습니다.\n\n너와 나는,\n둘이 아니었습니다.\n그의 기쁨이 내 기쁨이 되고,\n그의 아픔이 내 아픔이 됩니다.\n먼저 건넨 사랑이,\n내 안을 가득 채웁니다.\n\n이제 조금 어려운 사람을,\n가만히 떠올려 봅니다.\n미움이 남아 있다면,\n그것도 괜찮습니다.\n꼭 오늘 손잡지 않아도 됩니다.\n할 수 있는 만큼만,\n그를 이해해 보려 합니다.\n\n옛 글은 말합니다.\n가까운 이든 멀리 있는 이든,\n늘 아끼고 사랑하라고요.\n시샘과 미움 대신,\n온화한 얼굴로 대하라고요.\n부모의 사랑이 영원에 닿듯,\n참된 사랑은 그 영원마저 넘어선다고요.\n\n사랑은 마음에만 담겨 있으면,\n아직 빛나지 않습니다.\n말이 되고 손길이 되어,\n밖으로 건네질 때,\n비로소 환하게 빛납니다.\n\n맞잡았던 손을,\n천천히 풀어 봅니다.\n손바닥에 남은 온기를 느끼며,\n손끝을 가볍게 움직여 봅니다.\n\n오늘 하루,\n'어떤 마음으로 상대를 대할까' 물어보세요.\n그리고 한 사람에게,\n사랑을 말로,\n행동으로 건네 보세요.\n먼저 건넨 그 사랑이,\n당신을 먼저 채울 것입니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#사랑명상 #자비명상 #자타불이","series":"숨비명상"},{"id":"d88a4680","category":"자비희사","title":"매듭을 풀다","body":"엉킨 실을 떠올려 봅니다.\n급히 잡아당기면,\n매듭은 더 단단히 조여듭니다.\n하지만 따뜻한 손끝으로,\n가만가만 어루만지면,\n스르르 풀려납니다.\n\n친절이 꼭 그렇습니다.\n오늘은 그 부드러운 손길로,\n얽힌 마음을 풀어 보는 시간을 가져 봅니다.\n\n친절은 멀리서 오지 않습니다.\n모든 존재를,\n자비로운 눈으로 바라볼 때,\n그 마음에서 저절로 피어납니다.\n그리고 친절로 가는 길은,\n생각보다 아주 쉽습니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 살며시 내려놓습니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n내쉬는 숨을 타고,\n몸의 힘이 풀려납니다.\n\n오늘 내 안에,\n단단히 얽힌 곳은 없는지 살펴봅니다.\n풀리지 않는 걱정일 수도,\n누군가를 향한 차가운 마음일 수도 있습니다.\n잡아당기지 말고,\n그저 가만히 바라봅니다.\n\n그 매듭에,\n따뜻한 숨을 불어넣듯,\n천천히 호흡을 보냅니다.\n오늘 다 풀리지 않아도 괜찮습니다.\n아주 조금 느슨해지는 것만으로,\n충분합니다.\n\n이제 입가에,\n살짝 미소를 지어 봅니다.\n그 작은 미소를 따라,\n얼굴의 매듭이,\n가슴의 매듭이,\n한결 부드러워집니다.\n\n이제 곁에 있는 한 사람을,\n마음에 떠올려 봅니다.\n그의 얼굴에도,\n보이지 않는 매듭이 있을지 모릅니다.\n그에게 미소를 건네고,\n손을 따뜻하게 잡아 준다고 상상해 봅니다.\n그 손길을 따라,\n그의 매듭도 조금 풀립니다.\n\n거창하지 않아도 됩니다.\n지금 내 자리에서,\n내가 할 수 있는 작은 일 하나.\n그것을 기꺼이 하는 것,\n그것이 바로 친절입니다.\n\n옛 글은 말합니다.\n말솜씨나 잘난 모습으로,\n친절과 존경을 받는 것이 아니라고요.\n시기와 인색과 교활을 내려놓은 자리에서,\n비로소 참된 친절이 나온다고요.\n세상에 절이 많아도,\n가장 좋은 절은 '친절'입니다.\n\n풀어낸 마음의 매듭들을,\n가만히 느껴 봅니다.\n한결 가벼워진 가슴으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n누군가를 만나거든,\n미소 하나,\n따뜻한 손길 하나,\n할 수 있는 작은 도움 하나를 건네 보세요.\n그 순간 두 사람 사이에,\n친절이라는 꽃이 피어납니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#친절명상 #자비명상 #마음챙김","series":"숨비명상"},{"id":"aaed5c21","category":"수용","title":"한 그루 나무","body":"숲의 커다란 나무도,\n처음엔 작디작은 씨앗이었습니다.\n손톱보다 작던 그것이,\n어느새 하늘을 향해 자랐습니다.\n\n오늘은 나를 한 그루 나무처럼,\n가만히 바라보는 시간을 가져 봅니다.\n\n성장은 나 혼자만의 일이 아닙니다.\n내 몸과 마음이 자라는 만큼,\n곁의 사람도 함께 살아납니다.\n지혜로운 성장은,\n나와 남을 함께 살리는 길입니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n\n가만히 물어봅니다.\n'나는 어디에서 왔을까.' 어릴 적 나를 떠올려 봅니다.\n작디작던 그 아이가,\n바로 이 나무의 씨앗이었습니다.\n\n그 작은 씨앗이,\n어느새 이만큼 자랐습니다.\n키가 자란 만큼,\n마음도 함께 자랐습니다.\n기쁨과 슬픔의 계절을 지나며,\n한 해 한 해 나이테가 쌓였습니다.\n\n뿌리는 늘 고운 흙만,\n만난 것이 아닙니다.\n돌밭을 지나고,\n메마른 가뭄을 견디며,\n더 깊이 내려갔습니다.\n힘든 일을 겪을 때마다,\n고집을 조금씩 내려놓고,\n이해하는 법을 배웠습니다.\n\n이제 이 나무를,\n가만히 올려다봅니다.\n얼마나 자랐는지,\n어느 가지가 아직 여린지,\n판단 없이 바라봅니다.\n부족한 곳이 보여도 괜찮습니다.\n자라는 중이라는 증거니까요.\n\n잘 자란 나무는,\n곁에 그늘을 드리웁니다.\n지친 이가 그 아래 쉬고,\n열매를 나누어 먹습니다.\n내가 자란 만큼,\n누군가도 내 곁에서 숨을 고릅니다.\n\n그 큰 나무는,\n처음 그 작은 씨앗 안에,\n이미 통째로 들어 있었습니다.\n옛 글은 말합니다.\n모든 존재가 이미,\n넓고 큰 지혜를 품고 있건만,\n스스로 그것을 보지 못할 뿐이라고요.\n\n가지 끝까지 차오른 숨을,\n가만히 느껴 봅니다.\n뿌리부터 잎끝까지,\n살아 있는 나무의 온기를 느끼며,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n눈앞의 상황을 있는 그대로 받아들이고,\n욕심 하나를 내려놓아 보세요.\n그 작은 내려놓음이,\n당신을 한 뼘 더 자라게 하고,\n곁의 사람도 함께 살립니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#성장명상 #알아차림 #자기성찰","series":"숨비명상"},{"id":"80b68c1f","category":"관찰","title":"숲을 벗어나","body":"빽빽한 숲 한가운데 서 있으면,\n여기가 어디인지,\n어디로 가야 하는지,\n좀처럼 알 수 없습니다.\n나무에 가려,\n길이 보이지 않기 때문입니다.\n\n오늘은 그 숲에서 한 걸음 물러나,\n변화를 바라보는 시간을 가져 봅니다.\n\n세상에 변하지 않는 것은 없습니다.\n붙잡아 두려 애쓸수록,\n마음엔 상처만 남습니다.\n'아, 변하고 있구나' 하고 받아들이면,\n그만큼 마음이 편안해집니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n\n지금 내 마음이,\n빽빽한 숲처럼 느껴질 때가 있습니다.\n늘 하던 생각,\n무심코 되풀이한 말과 행동이,\n우거져 길을 가립니다.\n\n그 숲 한가운데서,\n가만히 물어봅니다.\n'나는 무엇을 고집하고 있는가.' '나는 무엇에 집착하고 있는가.' '그 고집 때문에, 받아들이지 못하는 것은 무엇인가.'\n\n답이 바로 떠오르지 않아도 괜찮습니다.\n물음을 던져 둔 채,\n가만히 숨을 쉬어 봅니다.\n\n이제 그 생각의 숲에서,\n한 걸음 물러나 봅니다.\n가까운 언덕에 올라,\n숲 전체를 내려다봅니다.\n빽빽하던 나무들이,\n하나의 풍경으로 펼쳐집니다.\n\n여기서 보니 알겠습니다.\n숲은 늘 변하고 있었습니다.\n봄과 겨울이 지나며,\n잎이 나고 또 졌습니다.\n그리고 내가 가야 할 방향이,\n저만치 보이기 시작합니다.\n\n낡은 틀 하나를,\n살며시 내려놓아 봅니다.\n그 자리에,\n한결 가벼워진 나,\n멋지게 변화하는 나를 그려 봅니다.\n\n옛 글은 말합니다.\n나를 그르치게도,\n자유롭게도 하는 것,\n그 모든 모습을 짓는 것은,\n결국 마음이라고요.\n그러니 마음을 살피고 청소하는 데서,\n진정한 변화가 시작됩니다.\n\n언덕 위의 트인 시야를,\n가슴에 담아 둡니다.\n한결 가벼워진 마음으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n무언가를 꼭 붙잡고 있거든,\n'아, 이것도 변하는구나' 하고,\n살며시 손을 펴 보세요.\n놓는 그 순간,\n새로운 길이 열립니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#변화명상 #무상 #알아차림","series":"숨비명상"},{"id":"4ff31d97","category":"용서감사","title":"안경을 닦다","body":"같은 풍경도,\n뿌옇게 김 서린 안경으로 보면,\n온통 흐릿하고 답답합니다.\n그런데 안경을 슥 닦아 내면,\n같은 자리에서,\n빛깔이 되살아납니다.\n\n오늘은 내 마음의 안경을 닦으며,\n기쁨을 찾는 시간을 가져 봅니다.\n\n기쁨은 밖에서 주어지지 않습니다.\n만족은 남이 채워 주는 것이 아니라,\n내 안에서 스스로 찾는 것입니다.\n세상은 이미 정해진 것이 아니라,\n내가 쓴 안경에 따라 달라집니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n\n오늘 나는,\n어떤 안경을 쓰고 있었을까요.\n남과 나를 견주는 마음,\n'왜 나만' 하는 불만으로,\n렌즈가 흐려져 있지는 않았나요.\n\n가만히 물어봅니다.\n'나는 나를 어떻게 바라보고 있는가.' '나는 내 상황을 어떻게 바라보고 있는가.' '나는 남을 어떻게 대하고 있는가.'\n\n답이 흐릿해도 괜찮습니다.\n탓하지 않고,\n그저 바라보기만 하면 됩니다.\n\n이제 그 안경을,\n감사로 천천히 닦아 봅니다.\n먼저,\n나에게 감사한 것 하나.\n오늘도 숨 쉬고 있는 이 몸,\n여기까지 걸어온 나.\n아주 작은 것이어도 좋습니다.\n\n다음은,\n남에게 감사한 것 하나.\n곁에서 함께해 준 누군가,\n나를 스치듯 도와준 얼굴.\n그 얼굴을 떠올리며,\n렌즈가 조금 더 맑아집니다.\n\n마지막으로,\n지금 이 상황에서,\n감사한 것 하나를 찾아봅니다.\n당연하게 여겨 온 것들 속에,\n숨어 있던 고마움 하나.\n\n이제 맑아진 안경으로,\n다시 지금 이 자리를 바라봅니다.\n자리는 그대로인데,\n어딘가 따뜻하고,\n가슴 밑에서 기쁨이 솟아납니다.\n나는 지금,\n내 삶의 주인공으로 여기 있습니다.\n\n이 기쁨은,\n나와 남을 함께 살리는 마음입니다.\n옛 글은 말합니다.\n참된 기쁨을 얻고자 한다면,\n살아 있는 것을 아프게 하지 말고,\n그 아픔을 덜어 주고 살리는 일을,\n기꺼이 즐겨 하라고요.\n\n맑아진 그 시선을,\n가슴에 담아 둡니다.\n따뜻해진 마음으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n마음이 흐려지고 답답해지거든,\n잠시 멈춰 감사 하나를 찾아,\n안경을 슥 닦아 보세요.\n그 한 번의 닦음이,\n기쁨을 다시 불러옵니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#기쁨명상 #감사명상 #마음챙김","series":"숨비명상"},{"id":"41ea8cc4","category":"관찰","title":"물이 맑아지다","body":"흙탕물이 담긴 컵을,\n맑게 하려고 자꾸 저으면,\n물은 더 뿌예집니다.\n하지만 손을 떼고,\n가만히 내려놓아 두면,\n흙은 스스로 가라앉습니다.\n\n오늘은 그 물처럼,\n마음이 저절로 맑아지는 시간을 가져 봅니다.\n\n순수는 섞인 것이 없는 맑음입니다.\n내 것, 내 고집,\n내 욕심을,\n살며시 내려놓을 때,\n마음은 비로소 맑게 빛납니다.\n바꾸려 하지 않고,\n있는 그대로 받아들이는 것,\n그것이 순수입니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n\n지금 내 마음속에,\n물 한 컵이 있다고 떠올려 봅니다.\n오늘 하루의 생각들,\n크고 작은 욕심과 걱정으로,\n물은 흐릿하게 일렁이고 있습니다.\n\n이제 그 컵을,\n가만히 내려놓습니다.\n맑게 만들려 애쓰지 않습니다.\n흐린 것을 없애려 하지도 않습니다.\n그저 손을 떼고,\n바라보기만 합니다.\n\n생각이 떠오르면,\n떠오르는구나, 하고 봅니다.\n붙잡지도,\n밀어내지도 않습니다.\n어떤 결과를 바라지 않고,\n지금 이 순간에 머뭅니다.\n\n자꾸 저으려는 손이,\n슬며시 올라올지 모릅니다.\n그래도 괜찮습니다.\n'아, 또 저으려 했구나' 알아차리고,\n다시 손을 가만히 내려놓으면 됩니다.\n\n보세요. 흐리던 물이,\n아주 천천히 가라앉습니다.\n무거운 것은 바닥으로 내려앉고,\n물은 위에서부터 맑아집니다.\n'나'라는 흙탕이 가라앉은 자리,\n마음이 바닥까지 비쳐 보입니다.\n\n그 맑은 물 위로,\n오늘 나의 마음을 비춰 봅니다.\n옛 글은 말합니다.\n모든 일은 마음이 그렇게 만든다고요.\n맑고 순수한 마음으로 말하고 행동하면,\n즐거움이 그림자처럼,\n그를 따른다고요.\n\n바닥까지 맑아진 그 고요를,\n가슴에 담아 둡니다.\n잔잔해진 마음으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n마음이 흙탕처럼 흐려지거든,\n서둘러 젓지 마세요.\n잠시 손을 떼고,\n가라앉기를 기다려 보세요.\n물은 언제나,\n스스로 맑아집니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#순수명상 #무아 #알아차림","series":"숨비명상"},{"id":"b9b30903","category":"탈중심화","title":"하늘이 되다","body":"넓은 하늘을 올려다봅니다.\n흰 구름도, 잿빛 구름도,\n그 위를 천천히 흘러갑니다.\n하늘은 어느 구름도,\n붙잡지 않고 밀어내지 않습니다.\n그저 열린 채,\n모두를 지나 보냅니다.\n\n오늘은 그 하늘 같은 마음으로,\n가볍게 풀려나는 시간을 가져 봅니다.\n\n해탈은 멀리 있는 말 같지만,\n'나'라고 하는 고집을 놓는 자리에서 시작됩니다.\n움켜쥔 것을 내려놓을 때,\n무엇이든 품는 하늘 같은 마음이 됩니다.\n하루아침에 되지 않아도,\n바른 하루가 쌓이면 됩니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n\n이제 나를 둘러싼 좁은 벽을,\n가만히 지워 봅니다.\n내 마음이 끝없이 열린,\n넓은 하늘이라고 여겨 봅니다.\n위로도, 사방으로도,\n가없이 트여 있습니다.\n\n그 하늘 위로,\n오늘 하루의 일들이 흘러갑니다.\n기쁜 일은 환한 구름으로,\n속상한 일은 어두운 구름으로,\n피어올랐다 이내 흘러갑니다.\n\n낮이 오고 또 밤이 오듯,\n기쁨과 슬픔도 번갈아 옵니다.\n옛 노래는 이렇게 읊조립니다.\n그것은 잠시 맡은 배역일 뿐이라고요.\n슬픈 표정 짓는다고 달라지지 않고,\n기쁜 표정 짓는다고 다 기쁜 것도 아니라고요.\n\n이제 그 구름들을,\n'내 것'이라 움켜쥐던 손을 펴 봅니다.\n'나, 나' 하던 고집을,\n살며시 내려놓습니다.\n붙잡을 것이 사라지자,\n하늘이 한결 더 넓어집니다.\n\n구름이 자꾸 몰려와,\n하늘을 가려도 괜찮습니다.\n구름이 아무리 두꺼워도,\n그 뒤의 하늘은,\n언제나 그대로 열려 있습니다.\n\n하늘은 폭풍도, 노을도,\n어느 것 하나 가리지 않고 품습니다.\n옛 글은 말합니다.\n여러 강물도 바다에 들면,\n모두 한 가지 짠맛이 되듯,\n쌓아 온 선함이 모두에게 돌아가면,\n해탈의 한 맛이 된다고요.\n\n가없이 트인 그 하늘을,\n가슴 가득 담아 둡니다.\n바람처럼 가벼워진 마음으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n힘든 일이 밀려오거든,\n'아, 구름이구나. 지나가겠구나' 하고,\n가만히 하늘로 남아 보세요.\n그렇게 맞이한 하루의 해탈이 모여,\n일생의 해탈이 됩니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#해탈명상 #내려놓음 #마음챙김","series":"숨비명상"},{"id":"5ed44562","category":"용서감사","title":"마음의 정원","body":"우리는 자꾸,\n담장 너머 남의 뜰을 기웃거립니다.\n저 집 꽃이 더 크고,\n저 집 나무가 더 푸르러 보입니다.\n그러는 사이,\n내 뜰은 돌보지 못한 채 시들어 갑니다.\n\n오늘은 그 시선을 안으로 돌려,\n내 마음의 정원을 가꾸는 시간을 가져 봅니다.\n\n행복은 먼 미래에도,\n담장 밖에도 있지 않습니다.\n지금 이 순간,\n내게 있는 것에 만족하는 마음입니다.\n내 삶의 주인이 되어,\n스스로 흐뭇해지는 것,\n그것이 행복입니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n\n늘 바깥을 향하던 마음을,\n가만히 안으로 돌려 봅니다.\n내 안에,\n작은 정원 하나가 있습니다.\n그동안 잘 들여다보지 못했던,\n나만의 뜰입니다.\n\n그 뜰을 천천히 둘러봅니다.\n이미 피어 있는 것들이 보입니다.\n오늘 아침 나를 깨운 숨,\n여기까지 데려다준 몸,\n곁을 지켜 준 얼굴,\n따뜻한 밥 한 그릇.\n당연히 여겨 온 것들이,\n실은 한 송이 꽃이었습니다.\n\n그 하나하나에,\n'고맙다'는 물을 부어 줍니다.\n시든 듯 보이던 것도,\n그 말 한마디에,\n다시 고개를 듭니다.\n\n자꾸 담장 너머를 보려는 마음,\n하나 더 가지려는 욕심이,\n잡초처럼 돋아날지 모릅니다.\n그래도 괜찮습니다.\n'아, 또 돋았구나' 알아차리고,\n가만히 뽑아 주면 됩니다.\n\n이 정원의 주인은 나입니다.\n남의 뜰과 크기를 견주지 않습니다.\n작으면 작은 대로,\n내 뜰이 가장 아늑합니다.\n지금, 여기, 이것으로,\n충분합니다.\n\n잘 가꾼 정원은,\n혼자만 두지 않습니다.\n꽃 한 송이,\n씨앗 하나를 이웃에게 건넵니다.\n더 가지려 할 때보다,\n나눌 때,\n정원은 더 환해집니다.\n\n옛 글은 말합니다.\n분수에 맞게 살고,\n만족할 줄 알고 감사하며,\n겸손히 배우는 것,\n그것이 더없는 행복이라고요.\n\n가꾼 정원의 향기를,\n가슴 가득 담아 둡니다.\n흐뭇해진 마음으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n마음이 자꾸 바깥을 기웃대거든,\n시선을 안으로 돌려 보세요.\n그리고 내 뜰의 꽃 하나에,\n'고맙다' 하고 말해 보세요.\n그 한마디에서,\n행복이 피어납니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#행복명상 #감사명상 #자족","series":"숨비명상"},{"id":"279793bd","category":"수용","title":"고삐를 쥐다","body":"힘 좋은 말 한 마리가,\n사방으로 내달리려 합니다.\n채찍을 휘두르며 다그치면,\n말은 더 놀라 날뜁니다.\n하지만 좋은 말지기는,\n고삐를 부드럽게 쥐고,\n나직이 말을 건넵니다.\n그러면 말은 이내,\n숨을 고르며 함께 걸어갑니다.\n\n오늘은 그 말지기가 되어,\n내 마음이라는 말을 다루는 시간을 가져 봅니다.\n\n절제는 억누름이 아닙니다.\n날뛰는 욕심과 감정을,\n지혜롭게 다잡아,\n좋은 길로 이끄는 것입니다.\n그 고삐를 쥔 주인은,\n바로 나입니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n\n지금 내 마음이라는 말은,\n어디로 달려갈지 모릅니다.\n수백 수천 갈래 생각으로 내닫고,\n좋다 싫다 하는 감정으로,\n쉴 새 없이 날뜁니다.\n\n하지만 가만히 보세요.\n그 날뛰는 것이,\n곧 나는 아닙니다.\n나는 그 말을 바라보는 사람,\n고삐를 쥔 말지기입니다.\n성난 짐승 같은 욕망은,\n나의 진짜 모습이 아닙니다.\n\n채찍을 내려놓습니다.\n대신 고삐를 부드럽게 잡습니다.\n그 고삐는,\n바로 나의 호흡입니다.\n숨을 천천히 따라가면,\n말도 조금씩 속도를 늦춥니다.\n\n말이 또 저만치 내달려도,\n괜찮습니다.\n'아, 또 달렸구나' 알아차리고,\n다시 고삐를 잡으면 됩니다.\n몇 번이고,\n다시 잡으면 됩니다.\n\n말이 한결 진정되면,\n이제 방향을 잡아 봅니다.\n감정에 못 이겨 내뱉을 뻔한 말,\n욕심으로 향하던 걸음을,\n지혜롭고 따뜻한 길로,\n부드럽게 돌려세웁니다.\n\n고삐를 쥔 그 순간,\n나는 끌려다니는 사람이 아니라,\n내 삶의 주인이 됩니다.\n날뛰는 마음을 다잡는,\n그 하나하나가,\n바로 나를 만들어 갑니다.\n\n옛 글은 말합니다.\n지혜로운 이가 먼저 할 일은,\n감각을 지키고,\n만족할 줄 알며,\n스스로를 절제하고,\n맑고 부지런한 벗과 사귀는 것이라고요.\n\n차분히 함께 걷는,\n말과 말지기의 호흡을 느껴 봅니다.\n고요해진 마음으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n마음이 갑자기 확 내달리거든,\n채찍을 들지 마세요.\n대신 숨이라는 고삐를,\n한 번 가만히 잡아 보세요.\n그 한 번의 다잡음이,\n당신을 주인으로 세웁니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#절제명상 #감정조절 #알아차림","series":"숨비명상"},{"id":"62725d05","category":"탈중심화","title":"여백","body":"천장까지 짐이 가득 찬 방을,\n떠올려 봅니다.\n몸을 돌리기도 어렵고,\n볕 한 줄기 들 자리가 없습니다.\n그런데 짐을 조금 덜어내면,\n그 빈자리로,\n바람과 볕이 스며듭니다.\n\n그 빈자리, 여백이,\n비로소 우리를 숨 쉬게 합니다.\n오늘은 마음에 여백을 내는,\n여유의 시간을 가져 봅니다.\n\n여유는 누가 주는 것이 아닙니다.\n내가 스스로 비워,\n만들어 가는 것입니다.\n비워야 채워지고,\n넉넉한 자리가 있어야,\n나를 바로 보고 남과도 나눌 수 있습니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨을 크게 들이쉬고,\n길게 내쉬며,\n지금 이 순간에 머물러 봅니다.\n\n가만히 마음 안을 들여다봅니다.\n어떤 목소리가 들려오나요.\n이렇게 앉아 있는 짧은 순간에도,\n할 일과 걱정이,\n불안과 초조로 올라옵니다.\n\n이제 가만히 손을 들어,\n자신의 심장에 얹어 봅니다.\n손바닥에 전해지는,\n따뜻한 박동을 느껴 봅니다.\n그 박동에 대고,\n가만히 말해 줍니다.\n'그래도 괜찮아.'\n\n불안이 올라와도 괜찮습니다.\n우리는 살아 있기에,\n움직이고, 생각하고,\n감정에 이리저리 흔들립니다.\n그것이 살아 있다는 증거입니다.\n\n이제 마음의 방에서,\n짐 하나를 살며시 내려놓아 봅니다.\n오늘 꼭 붙들지 않아도 될,\n걱정 하나면 충분합니다.\n그 자리에,\n작은 여백이 생겨납니다.\n\n비운 그 자리로,\n숨이 들어오고 볕이 듭니다.\n꽉 조여 있던 가슴이,\n한 뼘 트입니다. 비운 만큼,\n마음이 오히려 채워집니다.\n\n여백이 생긴 마음에는,\n남이 앉을 자리도 생깁니다.\n넉넉해진 사람이,\n비로소 곁을 살피고,\n따뜻함을 나눌 수 있습니다.\n\n옛 글은 말합니다.\n욕심을 덜어내는 사람은,\n마음이 평안하여,\n걱정도 두려움도 없고,\n하는 일에 늘 여유가 있어,\n모자람이 없다고요.\n\n한결 트인 그 자리를,\n가만히 느껴 봅니다.\n느긋해진 마음으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n마음이 꽉 차 조여 오거든,\n잠시 손을 심장에 얹고,\n'그래도 괜찮아' 말해 주세요.\n그리고 짐 하나를 내려놓아,\n숨 쉴 여백을 만들어 보세요.\n쉬어야,\n멀리 갈 수 있습니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#여유명상 #비움 #쉼명상","series":"숨비명상"},{"id":"f081a65f","category":"용서감사","title":"봄날","body":"이른 봄, 휑한 언덕에,\n손톱만 한 들꽃 하나가 피어 있습니다.\n너무 작아,\n그냥 지나치기 쉽습니다.\n그런데 봄이 무르익으면,\n그 한 송이가 번지고 번져,\n온 언덕이 꽃으로 뒤덮입니다.\n\n작은 선의도 꼭 그렇습니다.\n오늘은 그 작은 꽃씨 하나를,\n마음에 심는 시간을 가져 봅니다.\n\n선의는 거창하지 않습니다.\n바라는 것도, 조건도 없이,\n무심한 듯 건넬 때,\n가장 환하게 빛납니다.\n그 작은 마음이,\n나와 남을 함께 살립니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n\n이제 어제 하루를,\n가만히 떠올려 봅니다.\n그 안에서 감사했던 일,\n세 가지를 찾아봅니다.\n아주 작고 사소한 것도 좋습니다.\n'ㅇㅇ가 고맙습니다.' 하나씩,\n마음속으로 말해 봅니다.\n\n잘 떠오르지 않아도 괜찮습니다.\n따뜻한 밥 한 그릇,\n나를 비춘 아침 볕,\n그 하나면 충분합니다.\n\n감사를 떠올리는,\n지금 이 순간,\n마음이 어떤가요.\n안쪽이 조금 밝아지고,\n그 온기가 가슴 밖으로,\n슬며시 번져 갑니다.\n\n감사한 마음은,\n저절로 무언가 나누고 싶어집니다.\n바로 그 마음이,\n선의라는 작은 꽃씨입니다.\n\n오늘 뿌릴 씨앗 하나를,\n그려 봅니다.\n무심한 듯 건네는 인사,\n따뜻한 말 한마디,\n슬며시 양보하는 자리 하나.\n티 내지 않고,\n바라는 것 없이 건넵니다.\n\n그 작은 꽃 하나가,\n받은 사람에게로 번지고,\n또 다른 사람에게로 번져 갑니다.\n어느새 온 들이,\n꽃으로 뒤덮입니다.\n그렇게 당신의 하루하루가,\n봄날이 되어 갑니다.\n\n누군가 이렇게 말했습니다.\n연민이란,\n남의 안녕을 걱정하는 마음이라고요.\n남이 내게 온기를 건넬 때 내가 기쁘듯,\n내가 온기를 건네면,\n그 사람도 똑같이 기뻐한다고요.\n\n가슴에 번지는,\n봄의 온기를 느껴 봅니다.\n따뜻해진 마음으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n아주 작은 선의 하나를,\n무심한 듯 심어 보세요.\n그 손톱만 한 꽃 한 송이가,\n언젠가 당신의 하루를,\n온통 봄으로 물들일 것입니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"선의명상 #감사명상 #자비명상","series":"숨비명상"},{"id":"695b27bd","category":"자비희사","title":"길동무","body":"먼 길을 홀로 걸으면,\n작은 언덕도 유난히 가파르고,\n어두운 길은 더 길게 느껴집니다.\n그런데 곁에 좋은 길동무가 있으면,\n같은 길도 한결 가벼워집니다.\n짐을 나눠 지고,\n'이쪽이야' 길을 일러 주며,\n어느새 먼 길을 함께 건너옵니다.\n\n오늘은 그 길동무를 떠올리며,\n감사와 자비를 보내는 시간을 가져 봅니다.\n\n삶을 하나의 긴 공부라 한다면,\n도반은 그 길을 함께 걷는 사람입니다.\n힘들 때 손 내밀어 주고,\n내 일을 제 일처럼 챙겨 주고,\n때로는 스승이 되어,\n나를 따끔하게 일깨워 주는 인연입니다.\n\n하던 일을 잠시 멈추고,\n편안히 앉아 봅니다.\n천천히 눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n지금 귀에 들려오는 소리,\n몸에 전해지는 느낌을,\n가만히 알아차려 봅니다.\n\n우리는 수많은 사람과,\n만나고 또 헤어지며 살아왔습니다.\n즐거운 만남,\n슬프고 아픈 만남을 지나,\n여기까지 걸어왔습니다.\n\n그 길 위에서,\n나를 북돋아 주고,\n지혜를 건네준 한 사람을,\n가만히 떠올려 봅니다.\n내가 주저앉았을 때,\n말없이 손 내밀어 준 그 얼굴을.\n\n그에게,\n감사와 자비의 마음을 보냅니다.\n'나의 길동무여, 당신이 행복하시기를.' '진정 고통에서 벗어나, 행복하시기를.'\n\n지금 곁에 도반이 없다고,\n느껴져도 괜찮습니다.\n스쳐 간 한 사람,\n책 속의 한 마디도 도반이 됩니다.\n아직 만나지 못했다면,\n숲을 가는 코끼리처럼,\n의젓하게 홀로 걸어도 좋습니다.\n\n도반을 내 뜻대로,\n바꾸려 하지 않습니다.\n부족한 점까지,\n있는 그대로 끌어안습니다.\n그가 원하는 것을 먼저 헤아리고,\n가만히 응원을 보냅니다.\n\n그리고 다짐해 봅니다.\n나 또한 누군가에게,\n그런 길동무가 되기를.\n그러기 위해 오늘도,\n한 걸음씩 나아가 봅니다.\n\n옛 글은 말합니다.\n지혜로운 길동무를 만났거든,\n어떤 어려움이 있어도,\n마음 놓고 기꺼이,\n함께 걸어가라고요.\n\n함께 걷는 그 온기를,\n가슴에 담아 둡니다.\n든든해진 마음으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n나의 도반 한 사람에게,\n감사의 말 한마디,\n응원 한 줄을 건네 보세요.\n그리고 곁에서 힘들어하는 이가 있거든,\n먼저 손을 내밀어 보세요.\n그 순간 당신도,\n누군가의 길동무가 됩니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#도반명상 #자비명상 #감사명상","series":"숨비명상"},{"id":"bba7c61a","category":"관찰","title":"발자국","body":"아무도 밟지 않은,\n새하얀 눈밭을 떠올려 봅니다.\n한 걸음 내디디면,\n또렷한 발자국 하나가 찍힙니다.\n걸음마다, 자국이 남습니다.\n뒤돌아보면,\n내가 걸어온 길이 그대로 보입니다.\n\n그 발자국은,\n오직 내 발로만 찍을 수 있습니다.\n오늘은 내가 남기는 발자국을,\n가만히 바라보는 시간을 가져 봅니다.\n\n자존은 어려운 말이 아닙니다.\n지금 이 순간,\n살아 있는 나 자신입니다.\n내 삶을 걷는 주인은 나이고,\n누구도 내 걸음을,\n대신 디뎌 줄 수 없습니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨이 들어오고,\n나가는 것을 느껴 봅니다.\n\n지금 이 순간,\n숨 쉬고 있는 내가 느껴지나요.\n여기 분명히,\n존재하고 있는 내가 보이나요.\n살아 있기에 나는, 생각하고,\n말하고, 걸을 수 있습니다.\n\n내가 내딛는 걸음 하나하나가,\n세상에 발자국을 남깁니다.\n오늘 품은 생각 하나,\n건넨 말 한마디,\n행한 일 하나가,\n모두 하나의 발자국입니다.\n\n가만히 물어봅니다.\n나는 내 마음의 주인이 되어,\n이 걸음을 딛고 있는가.\n남에게 떠밀려,\n비틀거린 자국은 아닌가.\n지금 이 걸음의 주인은,\n바로 나입니다.\n\n지나온 발자국 가운데,\n비뚤어진 것이 보여도 괜찮습니다.\n이미 찍힌 자국은,\n지울 수 없지만,\n다음 한 걸음은,\n언제나 새로 디딜 수 있습니다.\n\n잠시 멈추어,\n뒤를 돌아봅니다.\n나는 어떤 발자국을 남기며,\n여기까지 걸어왔을까요.\n탓하지 않고,\n그저 가만히 바라봅니다.\n\n옛 글은 말합니다.\n마음이 모든 일의 주인이 되어,\n말과 행동을 이끄니,\n마음이 곧고 따뜻하면,\n즐거움이 그 뒤를 따른다고요.\n수레를 따라오는,\n바퀴 자국처럼요.\n\n발바닥이 땅에 닿는,\n그 든든한 감각을 느껴 봅니다.\n지금 여기 서 있는 나를,\n가만히 느끼며,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n한 걸음 한 걸음을,\n깨어서 디뎌 보세요.\n훗날 뒤돌아보았을 때,\n흐뭇하게 바라볼 수 있는,\n그런 발자국을 남겨 보세요.\n그 걸음의 주인은,\n언제나 당신입니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#자존명상 #존재감 #알아차림","series":"숨비명상"},{"id":"717c0be8","category":"관찰","title":"차창 밖","body":"달리는 기차의 창가에 앉으면,\n바깥 풍경이 쉼 없이 흘러갑니다.\n들판이 지나가고,\n어두운 터널이 지나가고,\n강물과 마을이 스쳐 갑니다.\n나는 가만히 앉아 있는데,\n세상이 흘러갑니다.\n\n같은 길을 가도,\n사람마다 다른 여행이 됩니다.\n오늘은 인생이라는 기차에서,\n내 마음의 여행을 바라보는 시간을 가져 봅니다.\n\n세상에서 가장 좋은 여행은,\n비싸고 화려한 여행이 아닙니다.\n나를 알아차리는 여행,\n바로 수행이라는 여행입니다.\n우리는 모두,\n부처가 되어 가는 여정 중입니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n들숨과 날숨을,\n가만히 바라봅니다.\n\n지금 나는,\n인생이라는 기차의,\n창가에 앉아 있습니다.\n창밖으로 오늘 하루의 풍경이,\n천천히 흘러갑니다.\n\n때로는 예상치 못한,\n어두운 터널을 지납니다.\n때로는 뜻밖의,\n환한 들판이 펼쳐집니다.\n어느 풍경도 붙잡을 수 없고,\n모두 지나갑니다. 나는 그저,\n바라보는 여행자입니다.\n\n어두운 터널이,\n유난히 길게 느껴져도 괜찮습니다.\n터널도 반드시 지나가고,\n이내 다시,\n환한 빛이 들어옵니다.\n\n흘러가는 풍경을 보며,\n가만히 물어봅니다.\n'지금 나는, 어떤 마음의 여행을 하고 있는가.' '그 여행에서, 어떤 깨우침을 얻고 있는가.'\n\n이 창가에 앉은 것은,\n나 혼자가 아닙니다.\n같은 칸에 함께 오른 사람들,\n인생 여행길의 도반들이 있습니다.\n혼자가 아니기에,\n우리는 힘을 얻습니다.\n\n옛 글은 말합니다.\n어리석은 이와의 동행은,\n지루하고 힘들지만,\n지혜로운 이와의 동행은,\n좋은 벗을 만난 듯 즐겁다고요.\n좋은 도반과 함께라면,\n어떤 여정도 벗이 됩니다.\n\n이 모든 여행은,\n우리가 살아 숨 쉬기에,\n지금 이 여정 위에 있기에,\n가능한 것입니다.\n\n흘러가는 창밖 풍경과,\n그것을 바라보는 나를,\n가만히 느껴 봅니다.\n편안해진 마음으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n힘든 일이 밀려오거든,\n'이것도 지나가는 창밖 풍경이구나' 하고,\n가만히 바라보세요.\n당신은 부처가 되어 가는,\n한 사람의 여행자입니다.\n오늘도 당신의 여행을,\n마음 다해 응원합니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#여행명상 #수행 #알아차림","series":"숨비명상"},{"id":"d8a90bc7","category":"수용","title":"바다","body":"바다는 모든 파도를 받아들입니다.\n잔잔한 물결도,\n사납게 몰아치는 파도도,\n어느 하나 밀어내지 않습니다.\n다 받아 주기에,\n'바다'라고 부릅니다.\n그럴 수 있는 것은,\n파도와 바다가,\n본래 하나이기 때문입니다.\n\n오늘은 그 바다 같은 마음으로,\n신뢰를 들여다보는 시간을 가져 봅니다.\n\n신뢰는 굳게 믿고 의지하는 것입니다.\n그러려면 내 고집,\n내 틀을 먼저 내려놓아야 합니다.\n있는 그대로 이해하고,\n받아들이려 할 때,\n신뢰가 조용히 싹틉니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n\n이제 내 마음을,\n드넓은 바다로 여겨 봅니다.\n표면에는 오늘 하루의 파도가,\n이리저리 일렁입니다.\n하지만 그 아래는,\n깊고 고요합니다.\n\n누군가의 서운한 말,\n뜻대로 되지 않은 일이,\n파도처럼 밀려옵니다.\n바다는 그 파도를,\n탓하지 않습니다.\n그 파도 또한,\n바다의 일부이기 때문입니다.\n\n가만히 되뇌어 봅니다.\n'나와 똑같이, 저 사람도 그러하구나.' 너와 나를 가르지 않을 때,\n받아들임은 한결 쉬워집니다.\n그 사람의 서툰 파도도,\n내 바다가 가만히 품습니다.\n\n도무지 받아들이기 힘든,\n파도가 있어도 괜찮습니다.\n오늘 다 품지 못해도,\n바다는 하루하루,\n조금씩 더 깊어집니다.\n\n내 신뢰의 바다는,\n얼마나 깊은지 바라봅니다.\n얕으면 작은 물결에도 흔들리고,\n깊으면 큰 파도도,\n고요히 받아 냅니다.\n탓하지 않고,\n그저 그 깊이를 바라봅니다.\n\n가만히 물어봅니다.\n내 마음속에,\n신뢰하는 사람이 있는지.\n그리고 나는,\n누군가에게 신뢰받는 사람인지.\n내 말과 행동이 믿음을 주는지,\n고집으로 상처를 주지는 않았는지.\n\n옛 글은 말합니다.\n건강이 가장 큰 이득이요,\n만족이 가장 큰 재물이며,\n신뢰받는 사람이,\n가장 가까운 친족이라고요.\n\n깊고 고요한,\n그 바다를 가슴에 담아 둡니다.\n잔잔해진 마음으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n파도 같은 일이 밀려오거든,\n'나도 저럴 때가 있지' 하고,\n바다처럼 한 번,\n가만히 받아 보세요.\n받아 주는 그만큼,\n당신의 바다는 깊어집니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#신뢰명상 #수용 #자비명상","series":"숨비명상"},{"id":"3b108bcc","category":"관찰","title":"뿌리","body":"바람 부는 날,\n나무의 우듬지를 보면,\n잎들이 정신없이 나부끼고,\n가지도 이리저리 흔들립니다.\n그런데 눈을 아래로 내리면,\n줄기는 거의 움직이지 않고,\n땅속 깊은 뿌리는,\n조금도 흔들리지 않습니다.\n꼭대기의 폭풍은,\n뿌리까지 닿지 못합니다.\n\n오늘은 그 흔들리지 않는 뿌리,\n나의 본성을 찾아 내려가 보는 시간을 가져 봅니다.\n\n본성은,\n흔들리는 것들 아래에 있습니다.\n태어나고 늙고 병들고 죽는 몸의 흐름,\n기쁘고 성나고 슬프고 즐거운 감정,\n그 모든 흔들림에도,\n끄떡없는 존재의 뿌리입니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n\n이제 한 그루 나무를,\n가만히 떠올려 봅니다.\n그 나무가,\n바로 나 자신입니다.\n\n바람에 흔들리는 잎에서,\n가느다란 가지로 내려갑니다.\n가지에서 굵은 줄기로,\n줄기에서 단단한 기둥으로,\n기둥에서 깊은 뿌리로,\n천천히 내려갑니다.\n\n흔들리는 그 잎과 가지는,\n나의 감정이고, 생각이고,\n분별입니다.\n오늘의 기쁨과 속상함,\n이런저런 판단들이,\n바람에 나부끼는 잎입니다.\n잎이 아무리 흔들려도,\n뿌리는 흔들리지 않습니다.\n\n이제 그 깊은 뿌리 자리에서,\n가만히 물어봅니다.\n'나는 누구인가.' '나는 무엇인가.'\n\n답이 떠오르지 않아도 괜찮습니다.\n답을 찾으려는 마음조차,\n잎에서 나온 생각일 뿐입니다.\n그저 물음만 던지고,\n그 물음 속에,\n가만히 머물러 봅니다.\n\n잎이 아무리 나부껴도,\n나는 이 뿌리에 있습니다.\n흔들림을 바라보는,\n흔들리지 않는 자리입니다.\n\n모든 나무의 뿌리가,\n같은 땅에 닿아 있듯,\n사람마다 생김새와 생각은 달라도,\n우리를 이루는 그 힘은,\n하나의 뿌리에서 옵니다.\n\n옛 글은 말합니다.\n이 몸도 이 마음도 본래 비어,\n고정된 '나'라 할 것이 없고,\n그래서 기쁨도 괴로움도,\n붙잡을 실체가 없다고요.\n그 텅 빔이 곧,\n무엇에도 매이지 않는 자유입니다.\n\n깊은 뿌리의 고요를,\n가슴에 담아 둡니다.\n흔들림 아래 단단한 나를 느끼며,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n마음이 심하게 흔들리거든,\n잠시 잎에서 뿌리로 내려가,\n'나는 누구인가' 하고,\n가만히 물어보세요.\n그 물음이,\n당신을 뿌리에 데려다줍니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#본성명상 #나는누구인가 #자기탐구","series":"숨비명상"},{"id":"e754152a","category":"탈중심화","title":"북극성","body":"아주 먼 옛날,\n바다와 사막을 건너던 이들은,\n움직이지 않는 별 하나로,\n길을 찾았습니다.\n아무리 헤매어도,\n고개를 들어 그 별을 찾으면,\n어느 쪽으로 가야 할지,\n알 수 있었습니다.\n\n오늘은 내 삶의 별,\n나의 가치를 확인하는 시간을 가져 봅니다.\n\n가치란,\n내가 중요하게 여기는 것입니다.\n내가 어디를 향해 가는지를 보면,\n무엇을 소중히 여기는지 알 수 있습니다.\n'나는 무엇을 향해 가고 있는가.' 그 답이 곧,\n내가 따르는 별입니다.\n\n편안한 자리에 앉아 봅니다.\n어깨를 내려놓습니다.\n천천히 눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉬어 봅니다.\n\n지금 내 삶이라는,\n밤하늘을 올려다봅니다.\n나는 지금, 어느 별을 향해,\n걸어가고 있을까요.\n\n오늘 하루,\n내 시간과 마음은,\n무엇을 가장 많이 향했나요.\n그것이 지금,\n내가 따르고 있는 별입니다.\n'내가 중요하게 여기는 가치는 무엇인가.' '나는 어느 방향으로 가고 있는가.'\n\n누군가의 별은 가족이고,\n누군가는 사랑, 배움, 정직,\n혹은 자비입니다.\n사람마다 별은 다릅니다.\n옳고 그름을 재지 말고,\n나만의 별을 가만히 확인합니다.\n\n그동안 엉뚱한 불빛을,\n별인 줄 알고 따라왔더라도,\n괜찮습니다. 알아차린 지금,\n다시 진짜 별을 찾으면 됩니다.\n\n마음속에만 담아 두었던,\n나의 가치,\n나의 발원을 또렷이 세워 봅니다.\n삶의 나침반을,\n그 별에 가만히 맞춥니다.\n\n별을 정하는 것만으로는,\n아직 닿지 못합니다.\n그 별을 향해 오늘 내디딜,\n한 생각, 한 마디,\n한 행동을 다짐해 봅니다.\n\n옛 글은 말합니다.\n아무리 고와도,\n향기 없는 꽃은 가치가 없고,\n아무리 그럴듯해도,\n실천 없는 말은 죽은 말이라고요.\n가치는, 걸음으로 피어납니다.\n\n또렷이 빛나는,\n나의 별을 가슴에 담아 둡니다.\n방향이 선 마음으로,\n손끝을 천천히 움직여 봅니다.\n\n오늘 하루,\n길을 잃은 듯 막막해지거든,\n잠시 멈추어 올려다보세요.\n'나는 무엇을 향해 가는가.' 그 별을 다시 찾는 순간,\n발걸음의 방향이,\n바로 섭니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.","duration":"약 8분","tags":"#가치명상 #삶의방향 #발원","series":"숨비명상"},{"id":"a2decf25","category":"탈중심화","title":"나침반","body":"편안한 자리에 앉습니다.\n\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 내려놓습니다.\n\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n어깨에 힘이 남아 있어도 괜찮습니다.\n마음이 아직 바쁘게 돌아가고 있어도 괜찮습니다.\n오늘도 애쓰며 여기까지 온 나를,\n그대로 데리고 앉습니다.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n내쉬는 숨을 따라,\n어깨가 한 뼘 내려앉습니다.\n\n한 번 더,\n들이쉬고…… 내쉽니다.\n\n숨은 애쓰지 않아도 저 혼자 들고 납니다.\n그 흐름을 가만히 지켜보기만 합니다.\n\n이제,\n마음속에 이런 장면을 떠올려 봅니다.\n\n낯선 길 위에 서 있습니다.\n옅은 안개가 깔려 있어,\n어느 쪽으로 가야 할지 길이 잘 보이지 않습니다.\n\n살다 보면 이렇게 방향을 잃은 것 같은 날이 있습니다.\n바쁘게 걷고는 있는데,\n정작 어디로 가는지 모르겠는 날.\n\n그럴 때 정말 필요한 것은 더 빠른 걸음이 아니라,\n방향을 알려 주는 작은 나침반 하나입니다.\n\n이제,\n가슴 한가운데에 손바닥을 가만히 얹어 봅니다.\n\n그 손 아래에 오래된 나침반 하나가 놓여 있다고 상상해 봅니다.\n\n처음에는 바늘이 이리저리 흔들립니다.\n급한 일들, 남의 시선,\n해야 할 것 같은 일들 사이에서 바늘은 쉽게 방향을 잡지 못합니다.\n\n괜찮습니다.\n흔들리는 바늘을 탓하지 않고,\n그저 바라봅니다.\n\n숨을 한 번 더 내쉬며,\n그 바늘이 천천히 제자리를 찾아가도록 가만히 기다려 줍니다.\n\n이제,\n마음속으로 조용히 물어봅니다.\n\n나는,\n무엇을 향해 가고 있는가.\n\n서둘러 답하지 않아도 됩니다.\n\n\n내가 정말 소중히 여기는 것은 무엇인가.\n\n\n떠오르는 것을 애써 고르려 하지 않아도 됩니다.\n가장 먼저 마음에 차오르는 것,\n그것이 지금 내 나침반이 가리키는 곳입니다.\n\n누군가에게는 곁에 있는 사람의 얼굴이 떠오릅니다.\n누군가에게는 정직함이,\n따뜻함이,\n조금씩 자라 가는 나 자신이 떠오릅니다.\n\n무엇이 떠올라도 괜찮습니다.\n옳고 그른 답은 없습니다.\n그저 나라는 사람이 어디를 향하는지,\n말없이 알려 줄 뿐입니다.\n\n가슴 위의 나침반이,\n이제 한 방향을 가만히 가리키고 있습니다.\n\n그 방향을 바라보며,\n스스로에게 조용히 건네 봅니다.\n\n나는 이곳을 향해 걸어가고 있구나.\n\n\n옛 글은 이렇게 말합니다.\n빛깔이 아무리 고운 꽃도 향기가 없으면 오래 남지 않고,\n아무리 좋은 말도 살아 내지 않으면 곧 흩어지고 만다고.\n\n그러니 마음속 나침반이 가리키는 그곳으로,\n오늘 단 한 걸음이라도 실제로 옮겨 봅니다.\n\n그 한 걸음이,\n흔들리던 하루에 방향을 되찾아 줄 것입니다.\n\n가만히 떠올려 봅니다.\n그 방향으로 가기 위해 오늘 내가 건넬 수 있는 따뜻한 말 한마디,\n작은 행동 하나를.\n\n\n거창하지 않아도 됩니다.\n지금 이 자리에서 할 수 있는 아주 작은 것 하나면 충분합니다.\n\n이제,\n가슴에 얹은 손의 온기를 다시 한번 느껴 봅니다.\n\n방향을 가리키던 그 나침반은,\n눈을 뜬 뒤에도 내 안에 그대로 남아 있습니다.\n\n길을 잃은 것 같은 날이 오면,\n언제든 이렇게 손을 얹고 가만히 물어보면 됩니다.\n나는,\n무엇을 향해 가고 있는가.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n손끝과 발끝을 가볍게 움직여 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n───\n진행 메모\n\n낭독 팁 : 화두 질문(\"나는, 무엇을 향해 가고 있는가\", \"내가 정말 소중히 여기는 것은 무엇인가\") 뒤에는 15~20초씩 넉넉히 침묵을 둡니다. 나침반 바늘이 제자리를 찾아가는 대목부터는 반 박자 더 느리고 낮은 목소리로 읽고, 마지막 눈뜨기 안내는 아주 천천히 읽습니다.","duration":"약 8분","tags":"#가치명상 #삶의방향 #나침반","series":"숨비명상"},{"id":"c27a16a1","category":"탈중심화","title":"가벼운 걸음","body":"편안한 자리에 앉습니다.\n\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 내려놓습니다.\n\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n어깨에 힘이 남아 있어도 괜찮습니다.\n마음이 여러 생각으로 가득 차 있어도 괜찮습니다.\n그 마음까지 그대로,\n여기 데리고 앉습니다.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n내쉬는 숨을 따라,\n몸이 조금씩 아래로 가라앉습니다.\n\n한 번 더,\n들이쉬고…… 내쉽니다.\n\n숨은 애쓰지 않아도 저 혼자 들고 납니다.\n그저 그 흐름에 몸을 맡깁니다.\n\n이제,\n마음속에 이런 장면을 떠올려 봅니다.\n\n넓은 들판을 걷고 있습니다.\n그런데 어쩐지 걸음이 자꾸만 무겁습니다.\n\n발밑을 내려다보니,\n땅이 촉촉한 진흙입니다.\n한 걸음 옮길 때마다 발이 쑥 잠기고,\n좀처럼 빠지지 않습니다.\n\n가만히 살펴보면,\n나는 두 손 가득 무언가를 움켜쥐고 있습니다.\n주머니마다 크고 작은 돌들이 가득 들어 있습니다.\n\n그 돌 하나하나에는 이름이 붙어 있습니다.\n이건 꼭 내 것이어야 해.\n이건 절대 놓칠 수 없어.\n이건 이렇게 되어야만 해.\n\n무거운 줄도 모르고 오래도록 지고 다녔습니다.\n그 무게에 발이 빠지는 줄도 모른 채.\n\n괜찮습니다.\n누구나 그렇게 걷습니다.\n지금 그 무게를 알아차린 것,\n그것이 이미 첫걸음입니다.\n\n이제,\n그 자리에 잠시 멈춰 섭니다.\n\n숨을 한 번 내쉬며,\n마음속으로 조용히 물어봅니다.\n\n나는,\n무엇을 이토록 놓지 못하고 있는가.\n\n서둘러 답하지 않아도 됩니다.\n\n\n나는, 어디에 매여 있는가.\n\n\n떠오르는 것이 있다면,\n그저 가만히 바라봅니다.\n아무것도 떠오르지 않아도 괜찮습니다.\n바라보려 한 그 마음이면 충분합니다.\n\n이제,\n주머니 속 돌을 하나 꺼내 손바닥 위에 올려놓습니다.\n\n가만히 들여다보며,\n스스로에게 조용히 일러 줍니다.\n\n이 세상에 변하지 않는 것은 없다.\n이것도 잠시 내게 머물렀다,\n갈 뿐이다.\n\n그리고,\n그 돌을 길가에 살며시 내려놓습니다.\n\n버리는 것이 아닙니다.\n꼭 쥐고 있던 손을 잠시 펴 보는 것뿐입니다.\n\n돌 하나를 내려놓자,\n발이 진흙에서 한 뼘 가벼워집니다.\n\n또 하나를 꺼냅니다.\n이렇게 되어야만 한다던 오래된 돌 하나.\n\n그것도 가만히 내려놓습니다.\n또 한 걸음이 가벼워집니다.\n\n무겁게 붙들수록 발은 더 깊이 빠지고,\n가만히 놓을수록 땅은 다시 단단해집니다.\n\n이제 발밑을 느껴 봅니다.\n어느새 진흙이 물러가고,\n발바닥 아래 마른 땅이 닿아 있습니다.\n\n두 손도,\n주머니도 한결 가볍습니다.\n\n들판 위로 서늘한 바람이 지나갑니다.\n가벼워진 몸에 그 바람이 가만히 스밉니다.\n\n내려놓는다는 것은 소중한 것을 잃는 일이 아니라,\n움켜쥐느라 아팠던 손을 잠시 쉬게 해 주는 일입니다.\n\n가만히 떠올려 봅니다.\n오늘 하루,\n내가 살며시 내려놓아도 좋을 작은 돌 하나를.\n\n거창하지 않아도 됩니다.\n아주 작은 것 하나면 충분합니다.\n\n이제,\n가벼워진 두 손을 무릎 위에 편안히 내려놓습니다.\n\n진흙을 빠져나와 마른 땅에 선 이 가벼움은,\n눈을 뜬 뒤에도 내 안에 그대로 남아 있습니다.\n\n마음이 다시 무거워지는 날이 오면,\n가만히 숨을 내쉬며 이렇게 물어보면 됩니다.\n나는 지금,\n무엇을 쥐고 있는가.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n손끝과 발끝을 가볍게 움직여 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n───\n진행 메모\n\n낭독 팁 : 두 물음(\"무엇을 놓지 못하고 있는가\", \"어디에 매여 있는가\") 뒤에는 15~20초씩 침묵을 둡니다. 돌을 하나씩 내려놓는 대목은 실제로 손을 펴 놓듯 천천히, 반 박자 느리게 읽습니다. '마른 땅이 닿는' 부분부터 목소리를 한 톤 가볍게 올리고, 마지막 눈뜨기 안내는 아주 천천히 읽습니다.","duration":"약 8분","tags":"#내려놓음 #집착내려놓기 #가벼움","series":"숨비명상"},{"id":"b257364c","category":"자비희사","title":"건네는 온기","body":"편안한 자리에 앉습니다.\n\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 내려놓습니다.\n\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n오늘 하루도 누군가를 만나고,\n스치고, 함께했습니다.\n그 모든 마음을 안고 여기 잠시 앉습니다.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n내쉬는 숨에,\n어깨가 부드럽게 풀립니다.\n\n한 번 더,\n들이쉬고…… 내쉽니다.\n\n이제,\n가슴 한가운데를 가만히 느껴 봅니다.\n\n그 안에 작은 온기 하나가 있습니다.\n따뜻한 화로처럼,\n은은하게 데워져 있습니다.\n\n이 온기는 아무리 나누어 주어도 줄어들지 않습니다.\n오히려 건넬수록 더 환하게 타오릅니다.\n\n떠올려 봅니다.\n지치고 추웠던 어느 날,\n누군가 건넨 따뜻한 말 한마디,\n말없이 보내 준 다정한 눈길 하나에 마음이 스르르 녹았던 순간을.\n\n\n그 사람은 대단한 것을 준 것이 아닙니다.\n그저 자기 안의 온기를 잠시 나에게 건넸을 뿐입니다.\n\n나에게도 그 온기가 있습니다.\n\n이제,\n그 온기를 하나씩 바깥으로 흘려보내 봅니다.\n\n먼저,\n환한 얼굴을 떠올립니다.\n찡그림을 풀고,\n입가를 아주 조금 올린 편안한 얼굴.\n그 얼굴 하나만으로도 곁의 사람은 마음을 놓습니다.\n\n이제,\n따뜻한 말 한마디를 떠올립니다.\n수고했어요. 괜찮아요.\n고마워요.\n돈이 들지 않아도 사람을 살리는 말들입니다.\n\n이제,\n다정한 눈길을 떠올립니다.\n바쁘게 스치는 눈이 아니라,\n잠시 머무는 눈.\n그 눈길에 담긴,\n나는 당신을 보고 있어요,\n하는 마음.\n\n이제,\n기꺼이 내미는 손길을 떠올립니다.\n무거운 것을 함께 들고,\n문을 잡아 주고,\n자리를 살며시 내어 주는 일.\n\n그리고,\n상대의 속마음을 가만히 헤아리는 마음.\n말 뒤에 숨은 피로와 외로움을 알아차려 주는 일.\n\n이 모든 것은 가진 것이 없어도 지금 당장 건넬 수 있습니다.\n\n가만히 그려 봅니다.\n내가 이렇게 온기를 건넬 때,\n사람들이 내 곁에서 마음을 놓고 쉬어 가는 모습을.\n\n어디를 가든 함께 있고 싶은 사람,\n곁에 있으면 따뜻해지는 사람.\n그것은 많이 가진 사람이 아니라,\n기꺼이 나누는 사람입니다.\n\n옛 글은 이렇게 말합니다.\n가진 것이 적어도 나누는 사람은,\n험한 여행길의 좋은 벗과 같아서,\n그 마음은 쉽게 스러지지 않는다고.\n\n많아서 나누는 것이 아니라,\n적어도 나누는 그 마음이,\n천 배로 빛나는 것입니다.\n\n이제,\n그 온기를 나 자신에게도 건네 봅니다.\n오늘도 애쓴 나에게,\n너도 참 따뜻한 사람이야,\n하고.\n\n가슴의 화로가 조금 더 환해집니다.\n\n떠올려 봅니다.\n내일 만날 누군가에게 내가 건넬 수 있는 작은 온기 하나를.\n환한 얼굴일 수도,\n따뜻한 말 한마디일 수도 있습니다.\n\n거창하지 않아도 됩니다.\n아주 작은 것 하나면 충분합니다.\n\n이제,\n그 온기를 가슴에 품은 채 숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n손끝과 발끝을 가볍게 움직여 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n───\n진행 메모\n\n낭독 팁 : 온기를 하나씩(얼굴·말·눈길·손길·헤아림) 안내하는 구간은 각 사이에 3~5초씩 쉬어, 듣는 사람이 실제로 그 얼굴과 그 말을 떠올릴 시간을 줍니다. 지친 날의 기억을 떠올리는 대목과 \"너도 참 따뜻한 사람이야\" 부분은 목소리를 낮추고 반 박자 느리게 읽습니다.","duration":"약 8분","tags":"#나눔명상 #무재칠시 #따뜻한사람","series":"숨비명상"},{"id":"d8ec0d7c","category":"관찰","title":"길이 나다","body":"편안한 자리에 앉습니다.\n\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 내려놓습니다.\n\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n오늘도 각자의 자리에서 애쓰며 하루를 지나왔습니다.\n누군가의 부모로, 자식으로,\n어느 자리의 한 사람으로.\n\n그 애쓴 마음을 안고 여기 잠시 쉬어 갑니다.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n한 번 더,\n들이쉬고…… 내쉽니다.\n\n이제,\n마음속에 이런 장면을 떠올려 봅니다.\n\n이른 아침,\n이슬 맺힌 풀밭 앞에 서 있습니다.\n풀이 무릎까지 자라 있어,\n어디로도 길이 보이지 않습니다.\n\n건너편으로 가려고 첫걸음을 내딛습니다.\n풀은 발에 엉키고,\n걸음은 자꾸 미끄러집니다.\n처음은 늘 이렇게 어렵습니다.\n\n괜찮습니다.\n처음이 서툰 것은 내가 부족해서가 아니라,\n아직 길이 나지 않았기 때문입니다.\n\n다음 날에도,\n같은 자리를 다시 걷습니다.\n어제 밟은 풀 위로 오늘 한 번 더 걸음을 포갭니다.\n\n또 다음 날,\n다시 그 위를 걷습니다.\n\n조금씩, 조금씩.\n그리고 거듭, 거듭.\n\n어느 날 문득 내려다보니,\n발밑에 희미한 오솔길 하나가 나 있습니다.\n\n엉키던 풀은 눕고,\n땅은 단단해지고,\n걸음은 한결 부드러워졌습니다.\n\n처음에는 그토록 어렵던 길이,\n이제는 눈을 감고도 걸을 만큼 익숙해졌습니다.\n\n이것이 거듭의 힘입니다.\n한 번의 걸음이 아니라,\n포개고 또 포갠 걸음이,\n없던 길을 냅니다.\n\n가만히 자신에게 물어봅니다.\n나는 지금,\n어떤 길을 내고 있는가.\n\n서둘러 답하지 않아도 됩니다.\n\n\n그리고,\n조금 더 깊이 물어봅니다.\n나는 무엇을 위해 이 걸음을 거듭하고 있는가.\n\n\n떠오르는 것이 있다면,\n그저 가만히 바라봅니다.\n그 답 속에,\n내가 나아가고 싶은 자리가 조용히 담겨 있습니다.\n\n향하는 곳이 따뜻하고 바를 때,\n날마다 포개는 그 걸음은 그 자체로 이미 좋은 길이 됩니다.\n\n옛 글은 이렇게 말합니다.\n조금씩,\n거듭거듭 닦아 가다 보면,\n가려져 있던 본래의 빛이 저절로 드러난다고.\n\n오늘의 한 걸음이 당장 큰 결실이 되지 않아도 괜찮습니다.\n그 걸음은 사라지지 않고,\n길 아래 고요히 쌓이고 있습니다.\n\n떠올려 봅니다.\n내가 내고 싶은 그 길 위에,\n오늘 포갤 수 있는 작은 걸음 하나를.\n\n거창하지 않아도 됩니다.\n오늘 한 걸음이면 충분합니다.\n\n이제,\n그 마음을 품은 채 숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n손끝과 발끝을 가볍게 움직여 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n───\n진행 메모\n\n낭독 팁 : \"조금씩, 조금씩 / 거듭, 거듭\" 구간은 실제로 천천히, 한 박자씩 쉬며 반복의 느낌을 살립니다. 두 물음(\"어떤 길을 내고 있는가\", \"무엇을 위해 거듭하는가\") 뒤에는 15~20초 침묵을 둡니다. 오솔길이 나 있는 것을 발견하는 대목은 목소리를 조금 밝게 올립니다.","duration":"약 8분","tags":"#노력 #꾸준함 #거듭의힘","series":"숨비명상"},{"id":"11df24a5","category":"수용","title":"존재만으로","body":"편안한 자리에 앉습니다.\n\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 내려놓습니다.\n\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n오늘 하루,\n잘한 일도 있었고 아쉬운 일도 있었을 것입니다.\n그 모든 것을 잠시 내려놓고,\n아무것도 증명하지 않아도 되는 이 자리에 앉습니다.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n한 번 더,\n들이쉬고…… 내쉽니다.\n\n이제,\n아주 먼 옛날로 가만히 거슬러 올라가 봅니다.\n\n내가 이 세상에 처음 태어나던 그 순간입니다.\n\n그때 나는 아무것도 이룬 것이 없었습니다.\n가진 것도, 자랑할 것도,\n잘한 것도 없었습니다.\n\n그저 작은 숨을 쉬며 거기 있었을 뿐입니다.\n\n그런데도,\n나를 처음 안아 든 손길은 따뜻했습니다.\n아무 조건 없이,\n있는 그대로의 나를 반겨 주었습니다.\n\n그때 나는 이미 더없이 귀한 존재였습니다.\n무엇을 해내서가 아니라,\n그저 여기 존재한다는 것만으로.\n\n가만히 느껴 봅니다.\n태어나던 그날의 그 귀함은,\n지금 이 순간까지 한 번도 나를 떠난 적이 없습니다.\n\n살아오는 동안 성공이 그 귀함을 더 키운 것도,\n실패가 그것을 깎아낸 것도 아니었습니다.\n\n칭찬을 받든 못 받든,\n잘 해내든 서툴든,\n나라는 존재의 귀함은 처음 그대로,\n조금도 줄지 않았습니다.\n\n이제,\n가슴에 손을 얹고 그 존재를 향해 가만히 속삭여 봅니다.\n\n나는 나 자신을 이해합니다.\n\n\n나는 나 자신을 인정합니다.\n\n\n나는 나 자신을 사랑합니다.\n\n\n나는,\n있는 그대로 존귀합니다.\n\n\n이 말이 아직 낯설고 쑥스러워도 괜찮습니다.\n오래 잊고 지낸 말을 처음 건네는 것이니까요.\n\n이제,\n그 마음을 조금 더 넓혀 봅니다.\n\n내 곁의 사람들,\n스치듯 만나는 이들,\n그리고 멀리 있는 누군가까지.\n\n그들도 나와 똑같이,\n태어난 그 순간부터 존귀한 존재였습니다.\n\n마음속으로 가만히 건네 봅니다.\n나와 똑같이,\n그대도 존귀합니다.\n\n내가 나를 귀하게 여길 때,\n비로소 다른 이의 귀함도 자연스레 보이기 시작합니다.\n\n옛 글은 이렇게 말합니다.\n해는 낮에 빛나고 달은 밤에 빛나며,\n저마다 제자리에서 빛난다고.\n\n나도, 그대도,\n저마다의 자리에서 존재하는 것만으로 빛납니다.\n\n떠올려 봅니다.\n존귀한 나로서 오늘 나는 어떤 말과 눈빛을 나 자신과 이웃에게 건넬 수 있을지.\n\n거창하지 않아도 됩니다.\n따뜻한 한마디면 충분합니다.\n\n이제,\n그 귀함을 가슴에 품은 채 숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n손끝과 발끝을 가볍게 움직여 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n───\n진행 메모\n\n낭독 팁 : 자기 긍정 문장(이해합니다·인정합니다·사랑합니다·존귀합니다)은 한 문장씩 또박또박, 사이에 10초 안팎의 침묵을 두어 마음으로 따라 말할 시간을 줍니다. 태어나던 순간을 떠올리는 대목과 \"그대도 존귀합니다\" 부분은 목소리를 낮추고 아주 천천히 읽습니다.","duration":"약 8분","tags":"#존귀 #자기긍정 #존재만으로","series":"숨비명상"},{"id":"deaf439f","category":"자비희사","title":"한 지붕 아래","body":"편안한 자리에 앉습니다.\n\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 내려놓습니다.\n\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n한 번 더,\n들이쉬고…… 내쉽니다.\n\n어깨에 남은 하루의 무게가 숨을 따라 조금씩 흘러내립니다.\n\n이제,\n마음속에 익숙한 공간 하나를 떠올려 봅니다.\n\n내가 가족과 함께 지내는 곳.\n같은 지붕 아래,\n같은 방의 공기를 날마다 나누어 마시는 자리입니다.\n\n그 방에는 눈에 보이지 않는 온도가 있습니다.\n누군가의 따뜻한 말 한마디에 방 안이 훈훈해지고,\n날 선 말 한마디에 공기가 서늘해지기도 합니다.\n\n그리고 나 역시,\n그 방의 온도를 만드는 한 사람입니다.\n\n가만히 떠올려 봅니다.\n요즘 내가 그 방에 들어설 때,\n나는 어떤 공기를 함께 들여놓고 있었는지.\n\n가족에게 무엇을 바라고 있었는지가 아니라,\n내가 그들에게 어떤 말과 표정과 마음을 건네고 있었는지를.\n\n떠오르는 장면이 있어도 탓하지 않습니다.\n지금 그것을 가만히 바라보는 것만으로 이미 충분합니다.\n\n이제,\n가족 한 사람을 마음 앞에 가만히 모셔 옵니다.\n\n가장 먼저 떠오르는 그 한 사람이면 됩니다.\n가까이 있는 사람도,\n멀리 있는 사람도 좋습니다.\n혹시 떠올리기 버거운 사이라면,\n오늘은 마음이 가는 한 사람만 떠올려도 됩니다.\n\n그 얼굴을 가만히 바라봅니다.\n\n그 사람도 기쁨과 슬픔,\n지침과 외로움을 안고 저마다의 하루를 살아 냅니다.\n가장 가까이 있어서 오히려 자주 잊고 지낸 사실입니다.\n\n그 사람이야말로 나에게 사랑을 연습하게 해 주는,\n가장 가까운 스승이자 길벗인지도 모릅니다.\n\n이제,\n그 사람에게 마음속으로 세 마디를 건네 봅니다.\n\n미안합니다.\n\n\n고맙습니다.\n\n\n사랑합니다.\n\n\n쑥스러워도 괜찮습니다.\n소리 내지 않아도 됩니다.\n그 마음을 떠올린 것만으로 방 안의 공기가 한결 따뜻해집니다.\n\n떠오르는 가족이 더 있다면,\n한 사람씩 같은 말을 건네 보아도 좋습니다.\n\n이 따뜻함은 먼 곳에 있지 않습니다.\n바로 오늘,\n같은 밥상 앞에서,\n지나치는 복도에서,\n짧은 통화 한 번에서 건넬 수 있는 것들입니다.\n\n떠올려 봅니다.\n오늘 집으로 돌아가 내가 먼저 건넬 수 있는 따뜻한 말 한마디,\n작은 행동 하나를.\n\n거창하지 않아도 됩니다.\n눈을 맞추며 건네는 한마디면 충분합니다.\n\n이제,\n그 마음을 품은 채 숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n손끝과 발끝을 가볍게 움직여 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n───\n진행 메모\n\n낭독 팁 : \"미안합니다 / 고맙습니다 / 사랑합니다\"는 한 마디씩 또박또박, 사이에 10초 안팎 침묵을 둡니다. 가족을 떠올리는 대목과 \"가장 가까운 스승\" 부분은 목소리를 낮추고 천천히. 힘든 가족을 억지로 떠올리지 않도록 안내 문장을 그대로 살려 읽습니다.","duration":"약 8분","tags":"#가족명상 #자비실천 #돌아봄","series":"숨비명상"},{"id":"be441328","category":"탈중심화","title":"마음의 저울","body":"편안한 자리에 앉습니다.\n\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 내려놓습니다.\n\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n한 번 더,\n들이쉬고…… 내쉽니다.\n\n이제,\n마음속에 오래된 양팔 저울 하나를 떠올려 봅니다.\n\n가운데 기둥이 하나 서 있고,\n그 위에 저울대가 좌우로 길게 뻗어 있습니다.\n양쪽 끝에는 빈 접시가 하나씩 매달려 있습니다.\n\n이 저울은 바로 내 마음입니다.\n\n살다 보면 저울은 자주 한쪽으로 기울어집니다.\n이건 좋고 저건 싫다,\n이게 맞고 저건 틀렸다.\n한쪽 접시에 마음이 쏠릴 때마다,\n저울대는 기우뚱 무거워집니다.\n\n한쪽으로 기운 저울은 힘이 듭니다.\n기운 쪽을 붙들려 애쓰고,\n반대쪽을 밀어내느라 마음이 팽팽해집니다.\n\n지금 이 순간,\n내 저울은 어느 쪽으로 기울어 있는지 가만히 바라봅니다.\n\n무엇이 그 접시를 무겁게 누르고 있는지.\n\n애써 바로잡으려 하지 않아도 됩니다.\n기울어 있다는 것을 알아차리는 것,\n그것이 이미 시작입니다.\n\n이제,\n마음의 자리를 옮겨 봅니다.\n\n지금까지 나는 저울의 양쪽 끝 접시 위에 올라타 있었습니다.\n좋다는 접시,\n싫다는 접시 위에서 함께 기울며 흔들렸습니다.\n\n이제 그 접시에서 내려와,\n저울의 한가운데,\n기둥의 꼭대기로 조용히 올라서 봅니다.\n\n그 자리에서는 양쪽이 모두 보입니다.\n어느 한쪽을 밀어내지 않고,\n어느 한쪽을 붙들지도 않고,\n그저 저울이 기우는 모습을 가만히 내려다봅니다.\n\n기울면 기우는 대로,\n돌아오면 돌아오는 대로.\n\n마음이 이쪽으로 쏠리는구나.\n이제는 저쪽으로 가는구나.\n그 움직임을 좋다 싫다 하지 않고 그저 바라봅니다.\n\n신기하게도,\n가만히 바라보기만 하면 팽팽하던 저울대의 힘이 조금씩 풀립니다.\n\n붙들지 않으니 무겁지 않고,\n밀어내지 않으니 싸울 일이 없습니다.\n\n옛 글은 이렇게 말합니다.\n엉킨 생각을 한쪽으로 잡아당길수록 마음의 불길은 더 거세어지고,\n그 불을 즐길수록 얽매임은 더 단단해진다고.\n\n그러니 오늘은 어느 쪽으로도 잡아당기지 않고,\n가운데 서서 바라보는 힘을 길러 봅니다.\n\n이 자리는 방관하거나 도망치는 자리가 아닙니다.\n양쪽을 모두 끌어안은 채 가장 맑게 깨어 바라보는,\n가장 책임 있는 자리입니다.\n\n가만히 느껴 봅니다.\n한가운데 선 이 고요를.\n어느 쪽으로도 기울지 않은 이 편안한 균형을.\n\n떠올려 봅니다.\n오늘 마음이 한쪽으로 확 쏠릴 때,\n잠시 숨을 고르고 저울의 한가운데로 돌아오는 나의 모습을.\n\n거창하지 않아도 됩니다.\n한 번 알아차리고 가운데로 돌아오면,\n그것으로 충분합니다.\n\n이제,\n그 고요한 균형을 품은 채 숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n손끝과 발끝을 가볍게 움직여 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n───\n진행 메모\n\n낭독 팁 : 저울이 기우는 것을 바라보는 대목은 서두르지 않고 아주 천천히, 관찰하듯 읽습니다. \"이쪽으로 쏠리는구나 / 저쪽으로 가는구나\"는 담담하게 읽습니다. 가운데로 올라서는 장면과 마지막 \"고요한 균형\"은 목소리를 한 톤 낮추고 여백을 넉넉히 둡니다.","duration":"약 8분","tags":"#균형 #중도 #바라보는힘","series":"숨비명상"},{"id":"155c901c","category":"자비희사","title":"나란히 걷다","body":"편안한 자리에 앉습니다.\n\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 내려놓습니다.\n\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n한 번 더,\n들이쉬고…… 내쉽니다.\n\n이제,\n마음속에 긴 길 하나를 떠올려 봅니다.\n\n내가 태어나 지금까지 걸어온,\n그리고 앞으로 걸어갈 인생이라는 길입니다.\n\n그 길을 나는 혼자 걷지 않았습니다.\n돌아보면 늘,\n누군가가 곁에서 함께 걷고 있었습니다.\n\n이제,\n그 길 위에서 지금 내 곁을 걷고 있는 한 사람을 떠올려 봅니다.\n\n가족일 수도, 벗일 수도,\n날마다 얼굴을 마주하는 누군가일 수도 있습니다.\n\n그 사람과 나란히 서서 같은 방향을 바라봅니다.\n\n어떤 동행은 발걸음이 잘 맞아 함께 걷는 것만으로 든든합니다.\n어떤 동행은 자꾸 어긋나고 부딪혀,\n같이 걷는 일이 버겁게 느껴지기도 합니다.\n\n지금 그 사람과의 걸음이 편안해도 괜찮고,\n조금 힘겨워도 괜찮습니다.\n어느 쪽이든,\n그 사람은 지금 나와 같은 길을 걷고 있는 소중한 길벗입니다.\n\n가만히 바라봅니다.\n그 사람이 내 곁에 있음으로써,\n나는 무엇을 배우고 있는지.\n\n잘 맞는 동행은 나에게 기쁨과 안심을 가르치고,\n어긋나는 동행은 나에게 인내와 이해를,\n그리고 미처 몰랐던 나 자신의 모습을 비춰 줍니다.\n\n그렇게 보면 내 곁의 그 사람은 그저 함께 걷는 사람이 아니라,\n나에게 삶을 가르쳐 주는 가장 가까운 스승인지도 모릅니다.\n\n떠올려 봅니다.\n나는 어떤 인연으로 이 사람과 같은 길에서 만났는지.\n그리고 이 만남에서 무엇을 배우고,\n무엇을 나눌 수 있을지.\n\n이제,\n그 동행에게 마음속으로 가만히 건네 봅니다.\n\n미안합니다.\n\n\n고맙습니다.\n\n\n사랑합니다.\n\n\n이 길을 함께 걸어 주어 고맙다고.\n당신 덕분에 내가 조금 더 나은 사람이 되어 간다고.\n\n옛 글은 이렇게 말합니다.\n마음이 어긋난 이와의 길은 적과 함께 가듯 고단하지만,\n서로를 아끼는 이와의 동행은 오랜 벗을 만난 것처럼 즐겁다고.\n\n그 즐거운 동행은 멀리서 찾아오는 것이 아니라,\n내가 먼저 곁의 사람을 벗으로,\n스승으로 바라볼 때 비로소 시작됩니다.\n\n떠올려 봅니다.\n오늘 내 곁의 동행에게 내가 먼저 건넬 수 있는 따뜻한 말 한마디,\n작은 배려 하나를.\n\n거창하지 않아도 됩니다.\n눈을 맞추며 건네는 한마디면 충분합니다.\n\n이제,\n그 마음을 품은 채 숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n손끝과 발끝을 가볍게 움직여 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n───\n진행 메모\n\n낭독 팁 : \"미안합니다 / 고맙습니다 / 사랑합니다\"는 한 마디씩 또박또박, 사이에 10초 안팎 침묵을 둡니다. 어긋나는 동행을 이야기하는 대목은 담담하고 따뜻하게, 억지 화해를 강요하지 않는 톤으로 읽습니다. \"가장 가까운 스승\" 부분은 목소리를 낮추고 천천히.","duration":"약 8분","tags":"#동행 #도반 #선지식","series":"숨비명상"},{"id":"49c16be0","category":"수용","title":"내 삶의 주인공","body":"편안한 자리에 앉습니다.\n\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 내려놓습니다.\n\n준비가
