있어 줍니다.\n\n이제 편안하게,\n호흡과 마음 사이를 오가 봅니다.\n숨을 바라보다가,\n어떤 감정이 찾아오면 이름을 불러 주고,\n다시 숨으로 돌아옵니다.\n\n생각이 떠올라도 괜찮습니다.\n그것도 하나의 손님일 뿐입니다.\n\n감정이 너무 크게 느껴진다면,\n편안해질 때까지 숨에만 머물러도 됩니다.\n숨은 언제나,\n돌아올 수 있는 자리입니다.\n\n잠시,\n그 고요 속에 머물러 봅니다.\n\n내 마음의 이름을 알아봐 주는 것.\n그것만으로도 나는 나에게 다정한 사람이 되어 주고 있습니다.\n\n이제 천천히,\n돌아올 준비를 합니다.\n손끝을 가볍게 움직여 보세요.\n발끝도 살짝 움직여 봅니다.\n\n가슴에 남아 있는 온기를 그대로 간직한 채,\n숨을 한 번 깊게 들이쉬고,\n내쉬면서,\n부드럽게 눈을 뜹니다.","duration":"약 10~12분","tags":"감정이름붙이기,마음관찰,자기다정","series":"숨비명상"},{"id":"5ffa8876","category":"움직임명상","title":"풍선 머리","body":"자리에서 일어나 두 발을 어깨보다 넓게 벌려 보세요.\n발바닥이 바닥을 단단히 붙잡고 있습니다.\n\n무릎은 살짝 풀어 두고,\n두 팔은 편안하게 늘어뜨립니다.\n\n오늘은 눈을 감지 않습니다.\n대신,\n평생 맨 꼭대기에 모셔 두기만 했던 머리와 한바탕 놀아 볼 것입니다.\n\n먼저,\n고개를 앞으로 깊이 숙여 보세요.\n머리의 무게가 아래로 툭,\n떨어지는 것을 느껴 봅니다.\n\n생각보다 무겁지요.\n괜찮습니다.\n오늘은 그 무게를 그대로 쓸 것입니다.\n\n이제 그 무게를 실어,\n그릴 수 있는 가장 큰 원을 그리며 천천히 돌려 봅니다.\n\n오른쪽 어깨를 지나,\n뒤로 넘어갔다가,\n왼쪽 어깨를 지나,\n다시 앞으로.\n\n원이 작아도 괜찮습니다.\n어지러우면 잠시 멈추어도 됩니다.\n우리는 한 번도 제 머리를 이렇게 크게 돌려 본 적이 없으니까요.\n\n발을 조금 더 넓게 디뎌 지지대를 튼튼히 세우고,\n원을 조금씩,\n조금씩 키워 보세요.\n\n머리가 그리는 원이 점점 커집니다.\n\n이제 반대 방향으로도 돌려 봅니다.\n\n머릿속에 고여 있던 것들이 원을 따라 함께 도는 것을 가만히 느껴 보세요.\n\n자, 여기서부터가 놀이입니다.\n\n머리를,\n바람 가득 넣은 풍선이라고 상상해 보세요.\n가볍고, 팽팽하고,\n금방이라도 날아갈 것 같은 풍선입니다.\n\n크게 한 바퀴 돌리다가,\n그 힘을 그대로 실어,\n\"슝!\" 하고 허공에 던져 버립니다.\n\n정말 소리 내어 보세요.\n\n슝!\n\n머리가 풍선처럼 저 멀리 날아갑니다.\n\n이번에는 반대로 돌려서,\n반대편으로도 던져 봅니다.\n\n슝!\n\n신기한 일이 벌어집니다.\n붙들고 돌리기만 할 때는 몸 안에서 맴돌던 어지러움이,\n\n던지는 순간,\n머리와 함께 몸 밖으로 빠져나갑니다.\n\n붙들면 어지럽고,\n놓아 버리면 시원합니다.\n\n몇 번이든,\n마음껏 던져 보세요.\n\n슝. 슝.\n\n이제 두 사람이 마주 섭니다.\n\n한 사람이 머리를 돌려 던지면,\n상대는 그것을 받아서,\n다시 돌려 되던집니다.\n\n이쪽에서 슝, 하고 보내면,\n저쪽에서 받아 슝,\n하고 돌려보냅니다.\n\n처음에는 어색해도 괜찮습니다.\n웃음이 나면 그대로 웃으세요.\n웃음도 함께 날아갑니다.\n\n템포가 맞기 시작하면,\n머리 하나가 탕, 또르르,\n탕, 또르르,\n공처럼 오고 갑니다.\n\n평생 애지중지 떠받들던 머리가,\n지금은 만만한 공이 되었습니다.\n\n실컷 주고받아 보세요.\n\n이제 마지막 놀이입니다.\n\n한 사람이 손바닥을 내밉니다.\n상대는 자기 머리가 그 손바닥에 자석처럼 붙었다고 상상합니다.\n\n손이 오르면 머리도 오르고,\n손이 바닥 가까이 내려가면 척추를 굽혀 따라 내려갑니다.\n\n손이 앞으로 나아가면 머리부터 끌려갑니다.\n\n점프도 하고,\n웅크리기도 하고, 올라갔다,\n내려갔다.\n\n평생 몸에게 명령만 내리던 머리가,\n오늘 처음으로 남의 손바닥에 이끌려 다닙니다.\n\n실컷 끌려다녔다면,\n역할을 바꿉니다.\n\n자,\n이제 제자리에 가만히 서 보세요.\n\n두 발을 딛고,\n목 위에 얹힌 머리의 무게를 다시 느껴 봅니다.\n\n어떤가요.\n\n아까보다 한결 가벼워지지 않았나요.\n\n그토록 무겁던 머리가 실은 바람 넣은 풍선 하나였다는 것을,\n\n생각이 아니라,\n몸이 먼저 알았습니다.\n\n그 가벼움을 목 위에 살짝 얹은 채,\n숨을 한 번 깊게 들이쉬고,\n내쉬며,\n\n오늘의 놀이를 마칩니다.","duration":"약 15분 (활동 포함)","tags":"표현명상,머리비우기,몸놀이","series":"표현명상"},{"id":"f6b4026a","category":"관찰","title":"파도의 아","body":"편안한 자세로 앉아 보세요.\n허리는 가볍게 세우고,\n어깨는 살며시 내려놓습니다.\n\n준비가 되면,\n천천히 눈을 감아 보세요.\n\n몸 어딘가에 힘이 남아 있어도 괜찮습니다.\n지금은 잘하려고 애쓰지 않아도 됩니다.\n그저 여기,\n이렇게 앉아 있는 것만으로 충분합니다.\n\n이제 숨이 드나드는 것을 느껴 보세요.\n들이쉬는 숨에 가슴이 조금 부풀고,\n내쉬는 숨에 몸이 조금 가라앉습니다.\n\n숨을 바꾸려 하지 않아도 됩니다.\n그저 지켜보기만 해도,\n숨은 저절로 깊어집니다.\n\n내쉴 때마다 이마의 힘이 풀리고,\n턱이 느슨해지고,\n가슴이 조금씩 열립니다.\n\n이제 마음속에 넓은 바닷가 하나를 떠올려 보세요.\n\n맨발 아래로 따뜻한 모래가 느껴집니다.\n발가락 사이로 스며드는 보드랍고 포근한 감촉입니다.\n\n어깨 위에는 한낮의 햇살이 내려앉아 있습니다.\n포근한 이불을 덮은 듯,\n등이 서서히 따뜻해집니다.\n\n바람이 불어옵니다.\n바람 끝에 묻어 있는 짭조름한 바다 냄새를 맡아 보세요.\n\n그리고 저 앞에서,\n파도 소리가 들려옵니다.\n\n쏴아 — 하고 밀려왔다가,\n스르르 물러갑니다.\n\n밀려오고, 물러가고.\n파도는 쉬지 않고 같은 숨을 쉬고 있습니다.\n\n잠시,\n그 소리에 몸을 맡겨 보세요.\n\n이제 가만히 가슴에 손을 얹어 보세요.\n\n그 안에 말하지 못한 것들이 쌓여 있을지도 모릅니다.\n답답함일 수도 있고,\n서러움일 수도 있고,\n이름 붙일 수 없는 무엇일 수도 있습니다.\n\n무엇이든 괜찮습니다.\n오늘은 그것을 소리에 실어 파도에게 건네 보려 합니다.\n\n숨을 깊이 들이쉬어 보세요.\n\n그리고 내쉬는 숨에,\n\"아 —\" 하고 소리를 내어 봅니다.\n\n아 —\n\n소리가 작아도 괜찮습니다.\n떨려도 괜찮고,\n갈라져도 괜찮습니다.\n지금 나오는 그 소리가,\n지금의 내 소리입니다.\n\n다시 한 번, 숨을 들이쉬고,\n\n아 —\n\n이번에는 소리가 가슴에서 시작해,\n목을 지나,\n머리끝까지 올라가는 길을 따라가 보세요.\n\n몸은 하나의 커다란 울림통입니다.\n소리를 낼 때마다 통 전체가 은은하게 울립니다.\n\n그 울림을 타고,\n안에 고여 있던 것들이 조금씩 떠오릅니다.\n\n다시, 숨을 가득 들이쉬고,\n\n아 —\n\n이번에는 저 파도를 향해,\n파도 소리보다 조금 더 크게 보내 봅니다.\n\n소리가 터지듯 나와도 괜찮습니다.\n목이 메어도 괜찮습니다.\n눈물이 차오르면,\n그대로 흐르게 두세요.\n그것도 파도가 데려가 줄 것입니다.\n\n소리가 끝난 자리에,\n고요가 남습니다.\n\n그 고요 속에서 가슴이 어떤지 느껴 보세요.\n\n조금 넓어진 것 같기도 하고,\n조금 가벼워진 것 같기도 합니다.\n\n시원한 바람이 그 빈자리를 지나갑니다.\n\n후련함과, 안도감과,\n지금껏 애쓰며 버텨 온 나에 대한 고마움 같은 것이 가슴에 은은하게 차오릅니다.\n\n파도는 여전히 밀려오고,\n물러갑니다.\n내가 어떤 소리를 내어도,\n바다는 다 받아 주었습니다.\n\n그 든든함을 가슴 한켠에 담아 두세요.\n\n이제 천천히 돌아올 시간입니다.\n\n바닷가의 따뜻함을 간직한 채,\n숨을 한 번 깊게 들이쉬고,\n내쉽니다.\n\n손가락 끝을 조금씩 움직여 보세요.\n발가락도 가볍게 움직여 봅니다.\n\n목을 부드럽게 좌우로 돌려 보고,\n\n준비가 되면,\n천천히 눈을 떠 보세요.\n\n가슴이 조금 더 넓어진 지금 여기로,\n잘 돌아오셨습니다.","duration":"약 12분","tags":"소리명상,파도명상,감정해소","series":"숨비명상"},{"id":"06b913e4","category":"움직임명상","title":"흑흑, 하하","body":"편안한 자세로 앉아 보세요.\n눈은 감아도 좋고,\n살짝 내리떠도 좋습니다.\n\n오늘은 조금 특별한 것을 해 봅니다.\n슬픈 일을 떠올리지 않아도,\n웃긴 일을 떠올리지 않아도 됩니다.\n\n감정을 만들려고 애쓰지 마세요.\n오늘은 호흡이 그 일을 대신해 줄 것입니다.\n\n우리가 울 때,\n숨은 늘 같은 모양이 됩니다.\n흑, 흑,\n하고 들숨이 끊어지며 들어오는 그 숨입니다.\n\n웃을 때는 반대입니다. 하,\n하, 하,\n숨이 바깥으로만 나갑니다.\n\n표정과 호흡을 먼저 만들면,\n감정은 뒤따라옵니다.\n오늘은 그 길을 거꾸로 걸어 볼 것입니다.\n\n먼저, 우는 호흡입니다.\n\n숨을 들이쉴 때,\n일부러 두세 번 끊어서, 흑,\n흑, 하고 들이쉬어 보세요.\n\n흑, 흑 —\n\n어깨가 조금 들썩여도 좋습니다.\n입꼬리가 내려가도 좋습니다.\n지금은 가짜여도 괜찮습니다.\n\n흑, 흑, 흑 —\n\n가짜 호흡을 따라가다 보면,\n몸이 먼저 기억해 냅니다.\n언젠가 이렇게 울었던 날들을.\n\n가슴 어딘가가 뻐근해질 수 있습니다.\n목이 메어 올 수도 있습니다.\n그대로 두세요.\n\n눈물이 차오르면, 참지 말고,\n뚝, 떨어지게 두세요.\n\n눈물이 나지 않아도 전혀 괜찮습니다.\n호흡만으로도,\n안에 있던 것은 이미 움직이고 있습니다.\n\n흑, 흑 —\n\n조금만 더 머물러 봅니다.\n\n이제 천천히,\n끊어졌던 숨을 하나로 길게 이어 봅니다.\n\n깊이 들이쉬고,\n길게 내쉽니다.\n\n비가 그친 뒤처럼,\n가슴이 고요합니다.\n\n씻겨 나간 자리를 잠시 느껴 보세요.\n\n이제, 웃는 호흡입니다.\n\n이번에는 내쉬는 숨을 잘게 끊어 봅니다.\n\n하, 하, 하 —\n\n한 호흡에 다섯 번,\n하하하하하 —\n\n숨이 나가기만 하고,\n들어오지를 못하지요.\n웃음이 이렇게 숨이 찬 일입니다.\n\n우습지 않아도 괜찮습니다.\n가짜 웃음으로 시작하세요.\n\n하하하하하 —\n\n몸이 웃는 모양을 만들면,\n마음이 슬그머니 따라옵니다.\n옆에서 웃음소리가 들려오면,\n그냥 같이 터져도 좋습니다.\n\n어지러우면 언제든 멈추고,\n숨을 고르세요.\n\n실컷 웃었다면,\n이제 숨을 깊이 들이쉽니다.\n\n들어오는 숨이 달게 느껴집니다.\n\n가만히 앉아서,\n방금 지나간 두 개의 호흡을 떠올려 보세요.\n\n흑흑, 우는 숨과, 하하,\n웃는 숨.\n\n둘 다 처음부터 내 몸에 있던 숨입니다.\n\n울어도 복이 오고,\n웃어도 복이 옵니다.\n\n막힌 것은 눈물로 흘려보내고,\n비워진 자리는 웃음으로 채우면 됩니다.\n\n숨을 한 번 깊게 들이쉬고,\n내쉬며,\n\n천천히 눈을 떠 보세요.\n\n울 줄도 알고 웃을 줄도 아는 몸으로,\n잘 돌아오셨습니다.","duration":"약 12분","tags":"울음명상,웃음명상,호흡명상","series":"표현명상"},{"id":"38a0ced9","category":"움직임명상","title":"물방울 걷기","body":"자리에서 일어나,\n공간에 넓게 흩어져 보세요.\n\n그리고 그냥,\n평소처럼 걸어 봅니다.\n\n빠르지도, 느리지도 않게.\n어디로 가도 좋습니다.\n\n조금 심심하지요. 괜찮습니다.\n이제 딱 한마디만 얹을 것입니다.\n\n지금부터, 나는 물방울입니다.\n\n둥글고, 말갛고,\n햇빛이 닿으면 반짝이는,\n물방울 하나.\n\n걸음이 어떻게 달라지는지 느껴 보세요.\n\n발이 조금 가벼워지고,\n몸이 또르르,\n구르듯 움직입니다.\n\n표면이 찰랑찰랑,\n걸을 때마다 흔들립니다.\n\n방향을 바꿀 때는, 또르르,\n굴러서 바꿉니다.\n\n이제 고개를 들어 보세요.\n공간 가득,\n물방울들이 굴러다니고 있습니다.\n\n물방울 두 개가 만나면,\n어떻게 될까요.\n\n그렇습니다. 합쳐져서,\n더 큰 물방울이 됩니다.\n\n누군가와 마주치면,\n스르르 피해 굴러가도 좋고,\n\n와장창 부딪혀서,\n둘이 한 방울이 되어도 좋습니다.\n\n합쳐진 물방울은 어깨를 나란히 하고,\n함께 굴러갑니다.\n\n웃음이 나면 웃으세요.\n물방울은 원래 잘 흔들리니까요.\n\n큰 물방울끼리 또 만나면,\n더, 더 큰 물방울이 됩니다.\n\n둘이 한 방울,\n다섯이 한 방울.\n\n이 방에 있는 우리 모두가 커다란 물방울 하나가 될 때까지.\n\n자, 다 모였다면,\n\n그 커다란 한 방울인 채로,\n잠시 멈추어 봅니다.\n\n찰랑,\n하고 잔물결이 가라앉습니다.\n\n숨소리가 들립니다.\n옆 사람의 온기가 느껴집니다.\n\n방금 전까지 어디에 있었든,\n우리는 지금,\n여기에 도착했습니다.\n\n숨을 한 번 깊게 들이쉬고,\n내쉬며,\n\n물방울 놀이를 마칩니다.","duration":"약 10분","tags":"#물방울걷기 #멈춤놀이 #지금여기","series":"표현명상"},{"id":"28e2c1b8","category":"수면·이완","title":"눈 이불","body":"편안하게 누워 보세요.\n베개에 머리를 맡기고,\n이불을 턱 밑까지 끌어올립니다.\n\n몸을 조금 뒤척여 가장 편한 자리를 찾아보세요.\n찾았다면,\n거기 그대로 머뭅니다.\n\n오늘 하루,\n애 많이 쓰셨습니다.\n이제부터는 아무것도 하지 않아도 됩니다.\n\n눈을 감아 보세요.\n\n숨이 드나드는 것을 가만히 느껴 봅니다.\n\n일부러 길게 쉬지 않아도 됩니다.\n지금 쉬는 그 숨이면 충분합니다.\n\n내쉴 때마다,\n몸이 침대에 조금씩 더 깊이 가라앉습니다.\n\n어깨가 가라앉고,\n\n허리가 가라앉고,\n\n다리가 가라앉습니다.\n\n침대가 그 무게를 다 받아 주고 있습니다.\n\n이제 마음속에,\n겨울밤 창문 하나를 떠올려 보세요.\n\n방 안은 따뜻하고,\n이불 속은 포근합니다.\n\n창밖에는,\n눈이 내리고 있습니다.\n\n소리도 없이,\n서두르지도 않고,\n\n큼직한 눈송이들이 천천히,\n천천히 내려앉고 있습니다.\n\n가로등 불빛 아래로 눈송이 하나가 떨어지는 것을 가만히 바라보세요.\n\n팔랑,\n\n팔랑,\n\n바닥에 닿을 때까지 한참이 걸립니다.\n\n눈이 쌓일수록,\n세상의 소리가 멀어집니다.\n\n차 소리도, 바람 소리도,\n눈 속에 파묻혀 둥글고 작아집니다.\n\n세상이 점점 조용해집니다.\n\n이불 속은 점점 따뜻해집니다.\n\n이제,\n오늘 하루를 떠올려 보세요.\n애썼던 일, 마음 쓰였던 일,\n아직 끝내지 못한 일.\n\n무엇이 떠올라도 괜찮습니다.\n\n떠오르는 것마다,\n그 위에 눈이 내려앉게 두세요.\n\n한 송이,\n\n또 한 송이,\n\n걱정 위에도 눈이 쌓이고,\n\n서운함 위에도 눈이 쌓여,\n\n모든 것이 하얗고, 둥글고,\n조용해집니다.\n\n내일 할 일은 내일의 내가 할 것입니다.\n오늘 밤에는,\n눈이 다 덮어 줍니다.\n\n숨이 눈 내리는 속도를 닮아 갑니다.\n\n느리게,\n\n고요하게,\n\n팔랑,\n\n팔랑.\n\n그리고 한 가지만 기억해 두세요.\n\n저 눈 밑에서는,\n봄이 조용히 기다리고 있습니다.\n\n푹 쉬고 나면,\n덮여 있던 자리마다 새순이 돋을 것입니다.\n\n그러니 안심하고,\n이불 속으로 조금 더 깊이 들어가세요.\n\n눈은 밤새 내릴 것입니다.\n\n세상은 점점 하얘지고,\n\n몸은 점점 무거워지고,\n\n생각은 점점 멀어집니다.\n\n이대로 잠들어도 좋습니다.\n\n잘 자요.\n\n푹 쉬어요.\n\n내일은, 봄처럼 올 것입니다.","duration":"약 15분","tags":"#수면명상 #이완명상 #눈이불","series":"숨비명상"},{"id":"1cdeebc4","category":"호흡명상","title":"호흡명상 — 측정과 맥박 동조","body":"준비물 : 음악(비트 없는 앰비언트) · 무음 타이머 목소리 : 평소보다 반 톤 낮게,\n속도 70% 대형 : 의자,\n발바닥 전체 바닥에\n\n0:00 · 40초 · 도입\n\n▸ 음악 시작 — 끝까지 끊지 않는다.\n볼륨은 목소리보다 확실히 낮게.\n\n오늘은 명상을 느껴보는 게 아니라,\n측정해보겠습니다.\n숫자가 하나씩 나올 겁니다.\n아무도 볼 수 없고,\n저도 묻지 않겠습니다.\n오직 여러분 자신하고만 비교할 겁니다.\n\n발바닥 전체가 바닥에 닿게.\n어깨 한 번 올렸다가… 툭,\n내려놓으세요.\n눈은 감으셔도 되고,\n바닥 1미터 앞을 보셔도 됩니다.\n\n0:40 · 1분 · 1차 측정\n\n지금부터 1분입니다.\n호흡을 바꾸려고 하지 마세요.\n연습이 아니라 검사입니다.\n잘하려는 순간,\n숫자가 거짓말을 합니다.\n\n숨을 들이쉬기 시작할 때마다 손가락을 하나씩 접으세요.\n열 개를 다 접으면 다시 펴고,\n몇 번 접었다 폈는지만 기억하세요.\n\n시작합니다. 평소처럼.\n\n— — — — —　침묵 60초 · 말하지 않는다　— — — — —\n\n…네, 멈추세요.\n숫자를 기억하세요.\n\n1:40 · 40초 · 공개\n\n손가락으로 들어주세요.\n열 개가 넘으면 두 손 다 펴시고요.\n옆을 보실 필요는 없습니다.\n자기 손만 보세요.\n\n▸ 3초 두고 분포 파악 — 진행자만 본다.\n\n손가락 다섯 개인 분도,\n열 개가 넘는 분도 계십니다.\n어느 쪽도 잘하거나 못한 게 아닙니다.\n출발점이 다를 뿐입니다.\n\n성인이 편히 쉴 때 1분에 12번에서 20번.\n명상 상태로 들어가면 6번에서 8번.\n\n이제 이 숫자를 바꿔보겠습니다.\n그 전에,\n왜 이게 되는지부터 보여드릴게요.\n\n2:20 · 1분 30초 · 맥박 동조 ★핵심\n\n오른손 검지와 중지를,\n왼쪽 손목 안쪽 엄지 쪽 가장자리에 대세요.\n한가운데가 아니라 엄지 방향 끝입니다.\n힘을 주지 말고 살짝 얹으세요.\n못 찾으신 분은 손가락을 아주 조금씩 옮겨보세요.\n톡, 톡,\n하는 게 느껴질 겁니다.\n\n▸ 여기서 20~30초 여유.\n20~30%는 못 찾는다 → \"목 옆, 턱 아래를 살짝 눌러보세요.\" 그래도 안 되면 바로 넘어간다 — \"괜찮습니다, 다음 순서는 다 하실 수 있습니다.\"\n\n깊게,\n천천히 들이쉬세요… 계속… 계속… 맥박이 어떻습니까.\n조금 빨라지지 않았나요?\n\n이제 길게 내쉬세요… 천천히… 끝까지… 더… 느려집니다.\n\n▸ 2~3회 반복.\n표정이 바뀌는 지점 — 서두르지 않는다.\n\n지금 느끼신 건 착각이 아닙니다.\n호흡성 동성 부정맥,\n모든 사람에게 있는 생리 현상입니다.\n들이쉬면 심장이 빨라지고,\n내쉬면 느려집니다.\n\n숨을 길게 내쉬는 것만으로,\n여러분은 자기 심박수를 직접 내릴 수 있습니다.\n약도, 앱도,\n전문가도 필요 없습니다.\n방금 하셨잖아요.\n\n오늘 나머지 시간은 이것 하나만 연습합니다.\n날숨을 들숨보다 길게.\n\n3:50 · 3분 · 페이싱\n\n손 내려놓으세요.\n눈 감으셔도 좋습니다.\n이제 숫자를 세지 마세요.\n제 목소리만 따라오시면 됩니다.\n\n4초 들이쉬고,\n6초 내쉽니다.\n1분에 여섯 번입니다.\n배가 먼저 나오고 가슴이 따라오면,\n잘 하고 계신 겁니다.\n\n들이쉬고… 둘… 셋… 넷…\n내쉬고… 둘… 셋… 넷… 다섯… 여섯…\n\n0:00–1:00: 매 사이클 또박또박 카운트 1:00–2:00: \"들이쉬고 …… 내쉬고 ……\" 숫자는 뺀다 2:00–3:00: 거의 침묵.\n30초마다 \"내쉬는 쪽을 길게\"만\n\n▸ 시작 직후 1회 — \"6초가 힘들면 3초 들이쉬고 5초 내쉬세요. 비율만 지키면 됩니다.\" ▸ 중간 1회 삽입 — \"숨이 답답하면 언제든 평소 호흡으로 돌아가세요. 참는 게 아닙니다.\" ▸ 진행자 목소리가 곧 페이서다.\n말끝을 서두르면 참가자도 급해진다.\n\n6:50 · 1분 · 2차 측정\n\n그대로 계세요.\n페이싱은 멈춥니다.\n다시 1분입니다.\n또 바꾸려 하지 마세요.\n\n몸이 알아서 쉬는 대로,\n들숨 시작할 때마다 손가락을 접으세요.\n시작합니다.\n\n— — — — —　침묵 60초 · 완전한 침묵　— — — — —\n\n네, 멈추세요.\n\n7:50 · 40초 · 클로징\n\n두 숫자를 비교해보세요.\n처음 것과, 지금 것.\n\n줄어든 분 — 여러분은 방금 8분 만에 자기 자율신경계를 직접 조절했습니다.\n그 차이가 증거입니다.\n그대로거나 늘어난 분 — 실패가 아닙니다.\n몸이 아직 긴장 신호를 붙들고 있다는 정보를 얻으신 겁니다.\n\n오늘 가져가실 건 딱 하나입니다.\n날숨을 들숨보다 길게.\n\n지하철에서도,\n회의 들어가기 직전에도,\n잠 안 오는 새벽에도 됩니다.\n손목에 손가락 얹고 확인해보세요.\n심장이 따라옵니다.\n\n수고하셨습니다.","duration":"10분","tags":"#호흡명상 #맥박동조 #날숨길게","series":"숨비명상"},{"id":"283d6f5d","category":"용서감사","title":"손안의 돌― 세 번의 용서","body":"편안한 자세로 앉아,\n부드럽게 눈을 감습니다.\n\n숨이 들어오고, 나가는 것을,\n잠시 지켜봅니다.\n\n서두를 것 없습니다.\n오늘은 마음이 아주 오래된 방 하나를 여는 날이라,\n천천히 가야 합니다.\n\n가슴에 가만히 물어봅니다.\n\n내 안에,\n아직 용서하지 못한 것이 있는가.\n\n누군가를 향한 것일 수도 있고,\n나 자신을 향한 것일 수도 있습니다.\n\n그것은,\n오래 쥐고 있던 돌과 같습니다.\n\n던지려고 쥐었는데,\n세월이 지나고 보니,\n무거운 것은 내 손이었습니다.\n\n오늘 우리는 그 돌을,\n세 번에 걸쳐 내려놓아 보려 합니다.\n\n첫 번째는,\n내가 던진 돌입니다.\n\n살아오면서 우리는,\n알게 모르게 누군가를 아프게 했습니다.\n\n말로, 행동으로,\n때로는 아무것도 하지 않음으로.\n\n그중 한 장면을 떠올려 봅니다.\n지금 다룰 수 있을 만한 것으로,\n하나면 됩니다.\n\n그때의 나를,\n가만히 바라보세요.\n\n그때 나는, 왜 그랬을까요.\n\n들여다보면,\n그 밑에는 나의 두려움이 있었고,\n나의 상처가 있었고,\n나의 혼란이 있었습니다.\n\n아프게 하고 싶어서 아프게 한 사람은,\n거의 없습니다.\n\n그 사람을 마음 앞에 모시고,\n조용히 말해 봅니다.\n\n나의 두려움과, 상처와,\n혼란 때문에,\n알게 모르게 당신을 아프게 했습니다.\n\n용서를 구합니다.\n\n나를 용서해 주세요.\n\n한 번 더, 천천히.\n\n나를 용서해 주세요.\n\n용서를 구하는 이 마음이,\n돌 하나를 내려놓게 합니다.\n\n두 번째는,\n나에게 던진 돌입니다.\n\n우리는 남에게만 상처를 준 것이 아닙니다.\n\n스스로를 다그치고,\n모진 말을 하고,\n지쳐 있는 나를 저버리기도 했습니다.\n\n세상 누구에게도 하지 않을 말을,\n나에게는 매일 했습니다.\n\n그 흔적이,\n지금도 가슴 어딘가에 남아 있습니다.\n\n원한다면,\n한 손을 가슴에 얹어 보세요.\n\n그리고 조용히 말해 봅니다.\n\n나는 두렵고, 아프고,\n서툴러서,\n나에게도 상처를 주었다.\n\n이제, 나는 나를 용서한다.\n\n나는 나를 용서한다.\n\n이 말이 낯설어도 괜찮습니다.\n낯설다는 것은,\n그동안 한 번도 해 주지 않았다는 뜻이니까요.\n\n한 번 더.\n\n나는 나를 용서한다.\n\n용서가,\n따뜻한 물처럼 가슴에서부터 온몸 구석구석 스며듭니다.\n\n돌 하나가 또, 내려집니다.\n\n세 번째는,\n가장 무거운 돌입니다.\n\n나에게 상처를 준, 그 사람.\n\n시작하기 전에,\n꼭 기억할 것이 있습니다.\n\n오늘,\n용서하지 않아도 됩니다.\n\n용서는 숙제가 아니고,\n마감이 없습니다.\n\n이 돌은 쥔 지 오래되어,\n손에 붙어 있을 수도 있습니다.\n천천히 떼어 내면 됩니다.\n\n그 사람을,\n견딜 수 있을 만큼의 거리에 떠올려 봅니다.\n\n분노가 올라오면,\n분노부터 맞아 주세요.\n\n눈물이 나면,\n눈물부터 흘려보내세요.\n\n그것도,\n용서로 가는 길입니다.\n\n준비가 되는 만큼만,\n마음속으로 말해 봅니다.\n\n당신이 나에게 준 상처를,\n나는 기억합니다.\n\n그리고 이제는 압니다.\n당신도 당신의 두려움과 고통 때문에 그랬다는 것을.\n\n나는 이 아픔을,\n충분히 오래 들고 있었습니다.\n\n이제, 당신을 놓아줍니다.\n\n용서한다고 해서,\n그 일이 괜찮아지는 것은 아닙니다.\n눈감아 주는 것도 아닙니다.\n\n다만 나는,\n그 일에 묶여 있던 나를 풀어 주는 것입니다.\n\n당신을 놓아주고, 나는,\n앞으로 나아갑니다.\n\n말이 끝까지 나오지 않아도 괜찮습니다.\n오늘 여기까지 온 것만으로,\n돌은 이미 조금 가벼워졌습니다.\n\n이제 두 손을,\n가만히 펴 보세요.\n\n오래 쥐느라 굳어 있던 손바닥에,\n바람이 지나갑니다.\n\n빈손이, 이렇게 가볍습니다.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉽니다.\n\n손끝과 발끝을 가볍게 움직여 보고,\n\n준비가 되면,\n천천히 눈을 뜹니다.\n\n조금 가벼워진 손으로,\n잘 돌아오셨습니다.","duration":"약 20분","tags":"#용서명상 #자기용서 #내려놓기","series":"숨비명상"},{"id":"c7ae0304","category":"관찰","title":"토독, 토독 ― 하트명상","body":"* \"토독, 토독\"은 실제 심장 박동의 빠르기로 나직하게 읽고,\n\"한 번도 나를 포기하지 않았다는 뜻입니다\"\n\n편안하게 앉아,\n천천히 눈을 감습니다.\n\n오늘은,\n평생 나와 함께 있었지만 한 번도 제대로 만나 본 적 없는 친구를 만나러 갑니다.\n\n왼쪽 가슴에,\n한 손을 가만히 얹어 보세요.\n\n잠시 기다리면,\n손바닥 아래에서 작은 기척이 느껴집니다.\n\n토독,\n\n토독.\n\n심장입니다.\n\n숨을 들이쉬면서,\n그 기척을 느껴 보세요.\n\n숨을 내쉬면서,\n심장을 편안하게 해 줍니다.\n\n들이쉬며, 느끼고,\n\n내쉬며, 쉬게 하고.\n\n토독, 토독.\n\n이 심장은,\n내가 '나'라는 말을 배우기도 전부터 뛰기 시작했습니다.\n\n엄마의 배 속,\n아직 손가락도 생기기 전,\n콩알만 한 몸에서 가장 먼저 움직인 것이 이 심장이었습니다.\n\n그날부터 오늘까지,\n단 한 번도 쉬지 않았습니다.\n\n내가 잠든 밤에도 혼자 깨어 일했고,\n\n내가 나를 미워하던 날에도,\n심장은 묵묵히 나를 살리고 있었습니다.\n\n한 번도 쉬지 않았다는 것은,\n한 번도 나를 포기하지 않았다는 뜻입니다.\n\n숨을 들이쉬면서,\n심장에게 사랑을 보내 보세요.\n\n숨을 내쉬면서,\n심장에게 미소를 지어 줍니다.\n\n고마워.\n\n애썼어.\n\n손바닥의 온기가 가슴으로 스며듭니다.\n\n그리고 가만히 느껴 보세요.\n\n심장도,\n나를 사랑하고 있다는 것을.\n\n토독,\n토독 — 그 소리는 사실,\n평생 나에게 보내온 응원이었습니다.\n\n숨을 내쉴 때마다,\n심장이 조금씩 더 편안해집니다.\n\n심장의 세포 하나하나가 기지개를 켜며 미소 짓습니다.\n\n이 착한 친구가 편히 일할 수 있도록,\n나도 나를 잘 돌보고 싶어집니다.\n\n그 마음이 들면,\n그대로 느껴 보세요.\n\n이제 그 따뜻함을,\n심장에서 온몸으로 넓혀 갑니다.\n\n숨을 들이쉬면서,\n지금 앉아 있는 내 몸 전체를 느껴 보세요.\n\n숨을 내쉬면서,\n몸 전체에게 미소를 지어 줍니다.\n\n들이쉬며,\n온몸에게 사랑을 보내고,\n\n내쉬며,\n온몸이 느긋해지는 것을 즐겨 봅니다.\n\n발끝부터 정수리까지,\n모든 세포가 기쁘게 미소 짓습니다.\n\n이 몸으로 살아온 모든 날들에게,\n고마운 마음이 차오릅니다.\n\n이제,\n배가 천천히 부풀었다 가라앉는 것을 느껴 봅니다.\n\n천천히,\n기지개를 한 번 켜고,\n\n준비가 되면, 눈을 뜹니다.\n\n가슴에 얹었던 손은 내려놓아도,\n\n토독, 토독,\n\n그 친구는 여전히,\n나와 함께 갑니다.","duration":"약 12분","tags":"#하트명상 #감사명상 #자비희사","series":"숨비명상"},{"id":"1311cf97","category":"용서감사","title":"밥 한 그릇― 우린 모두 연결되어 있어","body":"편안하게 앉아,\n가만히 눈을 감습니다.\n\n오늘은 멀리 가지 않습니다.\n밥 한 그릇이면 됩니다.\n\n마음속에,\n김이 모락모락 오르는 따뜻한 밥 한 그릇을 떠올려 보세요.\n\n하얀 김이 피어오르고,\n구수한 냄새가 코끝에 스칩니다.\n\n늘 먹던, 당연한 밥입니다.\n\n오늘은 이 한 그릇이 어디에서 왔는지,\n강을 거슬러 오르듯 천천히 따라가 보겠습니다.\n\n밥알 하나를 가만히 들여다봅니다.\n\n이 밥알은 지난봄,\n어느 논에서 초록 벼로 서 있었습니다.\n\n그 벼를 키운 것은 무엇이었을까요.\n\n아침마다 논을 데워 준 햇살이 있었습니다.\n\n목마를 때마다 내려 준 비가 있었습니다.\n\n뿌리를 붙잡아 준 검고 부드러운 흙과,\n\n벼 사이를 지나다니던 바람이 있었습니다.\n\n이 밥알 하나에,\n햇빛과 비와 흙과 바람이 다 들어 있습니다.\n\n그리고, 사람들이 있습니다.\n\n새벽 논에 나가 허리 숙여 모를 심던 손.\n\n땀 흘려 거두고, 말리고,\n찧던 손.\n\n포대에 담아 트럭에 싣던 손,\n가게 선반에 올려놓던 손,\n그리고 밥을 안치던 누군가의 손.\n\n얼굴도 이름도 모르지만,\n그 많은 손들이 이 한 그릇을 나에게 건네주었습니다.\n\n숨을 한 번,\n깊게 쉬어 봅니다.\n\n밥 한 그릇에,\n온 세상이 들어 있습니다.\n\n하늘과 땅이 들어 있고,\n수많은 사람의 하루가 들어 있습니다.\n\n나는 오늘도 그 세상을 먹고,\n그 세상의 힘으로 살아갑니다.\n\n혼자 크는 사람은,\n아무도 없습니다.\n\n옷도, 신발도,\n손에 쥔 전화기도,\n가만 보면 다 누군가의 손을 거쳐 나에게 온 것들입니다.\n\n나와, 사람들과, 세상과,\n지구는 이렇게 한 상 위에 이어져 있습니다.\n\n그리고,\n이어져 있다는 것은 돌아간다는 뜻이기도 합니다.\n\n내가 쓰고 버린 것들,\n내가 한 일들도,\n강물처럼 흘러 다시 자연으로 돌아갑니다.\n\n받기만 하는 것이 아니라,\n나도 무언가를 세상에 건네며 살고 있는 것입니다.\n\n그렇다면,\n이렇게 생각해 보면 어떨까요.\n\n우리는 이 지구에 잠깐 들렀다 가는 손님이라고.\n\n초대받은 손님은,\n집을 어지르지 않고,\n고맙다는 인사를 남기고 갑니다.\n\n거창한 일이 아니어도 됩니다.\n\n컵 하나를 다시 쓰는 일,\n불 하나를 끄는 일,\n음식을 남기지 않는 일.\n\n작은 일은, 작지 않습니다.\n그것도 세상으로 흘러가,\n누군가에게 닿으니까요.\n\n지금 마음속에 그런 작은 일 하나가 떠오른다면,\n가만히 품어 보세요.\n\n떠오르지 않아도 괜찮습니다.\n오늘 이 고마움을 느낀 것만으로,\n이미 시작되었습니다.\n\n이제 마음속 밥 한 그릇에서 따뜻한 김이 한 번 더 피어오릅니다.\n\n그 온기를 가슴에 담고,\n\n숨을 깊게 들이쉬고,\n길게 내쉬며,\n\n천천히 눈을 떠 보세요.\n\n그리고 다음 식사 때,\n첫술을 뜨기 전에 잠깐만 멈춰 보세요.\n\n그 한 숟갈에,\n온 세상이 담겨 있습니다.","duration":"약 12분","tags":"#밥한그릇 #연결명상 #감사명상","series":"숨비명상"},{"id":"7afc8074","category":"관찰","title":"차 한 잔― 오감을 깨우는 차명상","body":"따뜻한 차 한 잔을 앞에 두고,\n편안하게 앉습니다.\n\n오늘은 이 한 잔을,\n아주 천천히 마셔 볼 것입니다.\n\n아마,\n태어나서 가장 느리게 마시는 차가 될 겁니다.\n\n먼저,\n두 손으로 찻잔을 가만히 감싸 보세요.\n\n손바닥 가득,\n따뜻한 기운이 차오릅니다.\n\n매끄러운 잔의 감촉,\n은은한 온기.\n\n그 온기가 손에서 팔을 타고,\n가슴까지 번져 가는 것을 느껴 봅니다.\n\n마음도 함께, 따뜻해집니다.\n\n이제 눈으로,\n찻잔을 바라봅니다.\n\n늘 쓰던 잔이어도,\n오늘은 태어나서 처음 보는 것처럼.\n\n잔의 모양, 잔의 빛깔,\n\n그 안에 담긴 찻물의 색.\n\n숨결에 따라 수면이 잘게 흔들리는 것도 보입니다.\n\n좋다, 나쁘다 말하지 않고,\n그냥 봅니다.\n\n이제 잔을 천천히,\n코 가까이 가져갑니다.\n\n팔이 움직이는 것도 하나하나 느끼면서.\n\n숨을 깊게 들이쉬며,\n차의 향을 맡아 봅니다.\n\n내쉬는 숨에는,\n코끝에 남은 잔향이 스칩니다.\n\n향이 좋을 수도 있고,\n낯설 수도 있습니다.\n어느 쪽이든 괜찮습니다.\n\n있는 그대로,\n처음 맡는 향처럼 음미합니다.\n\n이번에는,\n조금 낯선 일을 해 봅니다.\n\n찻잔을 천천히,\n귀 가까이 가져가 보세요.\n\n그리고 가만히, 들어 봅니다.\n\n'찻잔에서 무슨 소리가 나?' 하는 생각이 들지요.\n\n그 생각도,\n가만히 알아차립니다.\n\n소리가 들리면 들리는 대로,\n\n들리지 않으면 들리지 않는 대로.\n\n지금 이 순간 일어나는 일을,\n판단 없이 만나는 연습입니다.\n\n이제 잔을,\n입술 가까이 가져갑니다.\n\n그리고 마시기 전에,\n잠깐 멈춥니다.\n\n입안을 살펴보세요.\n\n신기한 일이 벌어지고 있을 겁니다.\n\n침이 고이고,\n혀가 슬며시 움직입니다.\n\n아직 한 모금도 마시지 않았는데,\n\n마시려는 마음만으로,\n몸은 벌써 준비를 시작한 것입니다.\n\n마음이 몸을 움직이는 순간을,\n지금, 목격하고 있습니다.\n\n이제, 한 모금.\n\n입술을 적시며,\n찻물을 입안으로 가만히 흘려 넣습니다.\n\n바로 삼키지 말고,\n잠시 머금어 보세요.\n\n혀끝에서, 혀 안쪽에서,\n맛이 조금씩 달라지는 것을 느낍니다.\n\n준비가 되면,\n천천히 삼킵니다.\n\n목을 타고 따뜻하게 내려가는 길,\n\n가슴 어딘가에 퍼지는 온기,\n\n입안에 남은 은은한 잔향까지.\n\n한 모금이, 이렇게 깁니다.\n\n남은 차는,\n각자의 속도로 천천히 마셔 봅니다.\n\n한 모금마다, 처음처럼.\n\n차 한 잔을 마시는 데,\n십 분이 걸렸습니다.\n\n그 십 분 사이,\n손과 눈과 코와 귀와 혀가 모두 깨어났습니다.\n\n늘 마시던 차가,\n이렇게 깊었습니다.\n\n당연하던 것을 처음처럼 만나는 것.\n\n그것이 오늘 우리가 한 명상입니다.\n\n찻잔을 가만히 내려놓으며,\n이 고요를,\n잠시 더 누려 봅니다.","duration":"약 12분","tags":"#차명상 #오감깨우기 #관찰","series":"숨비명상"},{"id":"af8a628c","category":"수용","title":"한 그루 나무― 나무명상","body":"자세를 바르게 하고 앉습니다.\n허리를 펴고,\n가슴을 활짝 열어 줍니다.\n\n눈을 살며시 감고,\n숨을 크게 들이쉬고,\n천천히 내쉽니다.\n\n맑은 공기가 코를 지나,\n가슴을 지나,\n배까지 내려왔다가,\n\n다시 천천히 밖으로 나가는 길을 따라가 봅니다.\n\n들이쉬고,\n\n내쉬고.\n\n이제,\n나무가 되어 보겠습니다.\n\n먼저, 뿌리입니다.\n\n바닥에 닿아 있는 두 다리와 엉덩이에서,\n뿌리가 자라 내려간다고 상상해 보세요.\n\n땅을 뚫고, 돌 틈을 지나,\n깊이, 더 깊이.\n\n땅속은 서늘하고, 고요하고,\n단단합니다.\n\n뿌리 끝에,\n촉촉한 물기가 닿습니다.\n\n그 물을 천천히 빨아올려 보세요.\n\n시원한 기운이 다리를 타고,\n몸통까지 차오릅니다.\n\n이제, 가지입니다.\n\n원한다면,\n두 팔을 천천히 하늘로 뻗어 보세요.\n\n손끝이 잔가지가 되어 하늘에 닿습니다.\n\n잎사귀 하나하나에 따스한 햇살이 내려앉습니다.\n\n그 볕을,\n가만히 받아들입니다.\n\n팔이 내려오고 싶어지면,\n가지가 바람에 눕듯,\n천천히 내려놓아도 좋습니다.\n\n나는, 한 그루의 나무입니다.\n\n바람이 불어와 볼을 스치고,\n\n잎사귀들이 가볍게 몸을 흔듭니다.\n\n어디선가 새소리가 들리고,\n새 한 마리가 가지에 앉았다 떠납니다.\n\n나무는,\n어디로 가지 않습니다.\n\n그런데 신기하게도,\n필요한 것은 모두 나무에게로 옵니다.\n\n물은 땅에서 오고,\n볕은 하늘에서 오고,\n바람은 저절로 불어옵니다.\n\n나무는,\n자라려고 애쓰지 않습니다.\n\n뿌리 내리고 가만히 서 있으면,\n자람은 저절로 옵니다.\n\n그렇게 나는,\n조금씩 더 큰 나무가 되어 갑니다.\n\n혹시 오늘,\n품고 온 고민이나 무거운 마음이 있다면,\n\n나뭇가지에,\n잠시 걸어 두세요.\n\n나무는 무엇이든 걸어 둘 자리를 내어 줍니다.\n\n바람이 그것을,\n말려 줄 것입니다.\n\n이제,\n천천히 눈을 떠 보세요.\n\n나무의 눈으로,\n주위를 새롭게 바라봅니다.\n\n초록의 빛깔,\n흙과 잎의 냄새,\n살갗에 닿는 공기.\n\n온몸의 감각을 활짝 열고,\n지금 여기,\n숲과 만나 봅니다.\n\n한동안, 말없이,\n나무들 곁에 나무로 머물러 보세요.","duration":"약 10분","tags":"#나무명상 #숲명상 #지금여기","series":"숨비명상"},{"id":"7cd01518","category":"탈중심화","title":"네 걸음 뒤로― 거리두기 명상","body":"편안하게 앉아,\n지그시 눈을 감습니다.\n\n허리는 세우고,\n어깨는 내려놓고,\n숨을 한 번 깊게 들이쉬고,\n길게 내쉽니다.\n\n이제,\n요즘 마음을 무겁게 하는 일 하나를 떠올려 봅니다.\n\n가장 크고 아픈 것 말고,\n지금 다룰 수 있을 만한 것으로,\n하나.\n\n지금 그 일은,\n너무 가까이 있습니다.\n\n영화관 맨 앞줄에 앉은 것처럼.\n\n화면이 얼굴을 덮어서,\n일그러져 보이고,\n목이 아프고,\n정작 이야기는 보이지 않습니다.\n\n오늘 우리는 그 일과 싸우지 않습니다.\n지우려고 하지도 않습니다.\n\n다만,\n네 걸음만 뒤로 물러나 보겠습니다.\n\n첫 걸음은,\n마음의 거리입니다.\n\n스스로에게 조용히 물어봅니다.\n\n지금, 어떤 생각이 있는가.\n\n지금, 어떤 감정이 있는가.\n\n몸의 어디에서,\n그것이 느껴지는가.\n\n떠오르는 것에 가만히 이름을 붙여 봅니다.\n\n아, 걱정이 와 있구나.\n\n아, 속상함이 와 있구나.\n\n그리고 이번에는,\n나의 이름을 넣어서,\n남의 일처럼 말해 봅니다.\n\n'○○는 지금, 이 일을 걱정하고 있구나.'\n\n묻고, 이름 붙이는 순간,\n나는 감정 속에 있던 사람에서,\n감정을 바라보는 사람으로 자리를 옮깁니다.\n\n한 걸음, 뒤로.\n\n화면이, 조금 작아졌습니다.\n\n둘째 걸음은,\n시간의 거리입니다.\n\n숨을 한 번 깊게 쉬고,\n시간이 흐르게 둡니다.\n\n한 달이 지나고,\n한 해가 지나고,\n\n십 년이 흘렀습니다.\n\n십 년 뒤의 내가,\n지금 여기 앉아 있습니다.\n\n더 많은 일을 겪었고,\n그래서 더 넓어진 사람.\n\n그 사람의 눈으로,\n오늘의 이 일을 바라봅니다.\n\n그리고 물어봅니다.\n\n십 년 뒤에도,\n이 일은 이만큼 클까요.\n\n그때의 나에게,\n뭐라고 말해 주고 싶은가요.\n\n같은 일도 멀리 있을 때는 설레다가,\n코앞에 오면 두려워집니다.\n\n두려움의 크기는 사건의 크기가 아니라,\n사건과의 거리가 정합니다.\n\n한 걸음, 뒤로.\n\n화면이, 더 작아졌습니다.\n\n셋째 걸음은,\n공간의 거리입니다.\n\n이번에는 마음이 산책을 나갑니다.\n\n지금 앉아 있는 이 방에서,\n천천히 위로 떠오릅니다.\n\n지붕을 지나, 동네가 보이고,\n\n더 올라가,\n도시 전체가 보이고,\n\n더 올라가면,\n구름 위의 고요.\n\n아래에는, 푸른 곡선 하나.\n\n여기서 보면,\n오늘의 그 일은 아주 작은 점입니다.\n\n사라진 것이 아니라,\n제 크기를 되찾은 것입니다.\n\n이 넓은 시야를 담고,\n천천히 내려와,\n다시 이 방에 앉습니다.\n\n몸이 자리를 옮기면,\n마음도 자리를 옮깁니다.\n\n한 걸음, 뒤로.\n\n화면이 이제,\n손바닥만 합니다.\n\n마지막 걸음은,\n사람의 거리입니다.\n\n그 일 속에,\n나를 흔드는 사람이 있다면,\n그 사람을 앞에 떠올려 봅니다.\n\n미워하지도,\n밀어내지도 않은 채,\n\n두 걸음만, 뒤로 물러납니다.\n\n그 사이에 생긴 공간으로,\n바람이 지나갑니다.\n\n당신은 당신의 자리에,\n나는 나의 자리에.\n\n이 거리는 관계를 끊는 거리가 아니라,\n서로가 숨 쉴 수 있는 거리입니다.\n\n얽힌 사람이 없다면,\n문제 그 자체에서 두 걸음 물러나도 좋습니다.\n\n한 걸음, 뒤로.\n\n자,\n이제 네 걸음 물러난 자리에서,\n그 일을 다시 바라봅니다.\n\n영화관 뒷줄에서 보듯,\n이제야 이야기 전체가 보입니다.\n\n문제는 아직 거기 있습니다.\n하지만 이제 그것은,\n벽이 아니라 화면입니다.\n\n그리고 관객에게는,\n언제나 자리를 고를 자유가 있습니다.\n\n자극과 반응 사이에,\n오늘 우리는 네 걸음만큼의 틈을 만들었습니다.\n\n이 틈이 있어야,\n선택이 생깁니다.\n\n숨을 깊게 들이쉬고,\n길게 내쉽니다.\n\n손끝과 발끝을 가볍게 움직여 보고,\n\n준비가 되면,\n천천히 눈을 뜹니다.\n\n물러설 줄 아는 사람으로,\n잘 돌아오셨습니다.","duration":"약 12분","tags":"#거리두기 #네걸음뒤로 #관점전환","series":"숨비명상"},{"id":"3309a5ef","category":"관찰","title":"사탕 두 알― 맛이 있는 곳에, 내가 있다","body":"오늘은 준비물이 있습니다.\n사탕 두 알입니다.\n\n아직 까지 마세요.\n한 알만 손바닥에 올려놓습니다.\n\n먼저 이 사탕을,\n태어나서 처음 보는 물건처럼 살펴볼 거예요.\n\n무슨 색인가요. 동그란가요,\n납작한가요.\n불빛에 비추면 반짝이는 데가 있나요.\n\n이제 포장을 천천히 벗겨 보세요.\n\n바스락 — 그 소리도 들어 봅니다.\n\n코앞에 가져가서,\n냄새도 한 번 맡아 보고요.\n\n자, 이제 입에 넣습니다.\n단, 약속 하나.\n\n씹지 않기.\n\n혀 위에서 데굴데굴 굴려 보세요.\n\n이쪽 볼로, 저쪽 볼로.\n\n단맛이 어디에서 제일 진하게 느껴지나요.\n혀끝인가요, 혀 안쪽인가요.\n\n사탕이 조금씩 작아지는 것도 느껴집니다.\n\n다 녹을 때까지, 천천히,\n맛만 생각하면서 먹습니다.\n\n맛이 어땠는지,\n마음속에만 담아 두세요.\n\n이제, 두 번째 사탕입니다.\n\n그런데 이번에는 좀 이상한 부탁을 하나 할게요.\n\n사탕을 먹기 전에,\n요즘 나를 속상하게 했던 일을 하나 떠올려 보세요.\n\n친구랑 다퉈서 속상했던 일,\n꾸중을 들어서 시무룩했던 일,\n거울을 보다가 한숨이 나왔던 일.\n\n떠올랐나요.\n\n이제 그 생각을 꼭 붙든 채로,\n두 번째 사탕을 입에 넣습니다.\n\n먹는 동안,\n그 속상한 일을 계속,\n일부러, 생각하는 겁니다.\n\n그 일이 왜 일어났는지,\n그때 뭐라고 말할 걸 그랬는지,\n곱씹으면서 드세요.\n\n자, 이제 물어볼게요.\n\n첫 번째 사탕과,\n두 번째 사탕.\n\n어느 쪽 맛이 더 진했나요.\n\n신기하지요.\n두 번째 사탕은 맛이 잘 안 났을 거예요.\n\n그런데 이상합니다.\n두 사탕은 같은 봉지에서 나온,\n똑같은 사탕이거든요.\n\n변한 것은, 사탕이 아닙니다.\n\n변한 것은,\n내가 있던 곳입니다.\n\n첫 번째 사탕을 먹을 때,\n나는 지금,\n여기에 있었습니다. 혀 위에,\n단맛 곁에.\n\n두 번째 사탕을 먹을 때,\n몸은 여기 있었지만,\n\n마음은 그 속상한 일이 있던 그때,\n그곳에 가 있었습니다.\n\n마음이 딴 데 가 있으면,\n입안의 단맛도 느끼지 못합니다.\n\n그러니까 맛은,\n내 마음이 지금 어디에 있는지 알려 주는 신호이기도 합니다.\n\n앞으로 밥이 맛없게 느껴지는 날,\n가만히 물어보세요.\n\n'지금 내 마음은, 어디에 가 있지?'\n\n돌아오고 싶으면,\n방법은 간단합니다.\n\n지금 입안의 맛에게 돌아오면 됩니다.\n\n맛이 있는 곳에,\n내가 있습니다.","duration":"약 10분","tags":"#사탕명상 #지금여기 #청소년명상","series":"숨비명상"},{"id":"d6534ddd","category":"관찰","title":"건포도 한 알― 마음챙김의 첫 수업","body":"손바닥 위에,\n건포도 한 알을 올려놓습니다.\n\n오늘 우리는 이 작은 한 알을,\n아마 태어나서 가장 오래 먹게 될 것입니다.\n\n이렇게 상상해 보세요.\n\n나는 방금 지구에 도착했고,\n이런 물건은 처음 봅니다.\n\n먼저, 눈으로.\n\n쭈글쭈글한 주름,\n빛을 받아 반짝이는 굴곡,\n짙은 갈색 속에 숨은 보랏빛.\n\n주름 하나하나가 다 다르게 생겼습니다.\n\n이 작은 알갱이도,\n한때는 물이 가득한 포도 한 알이었습니다.\n\n햇볕에 마르는 동안,\n단맛만 남아 꼭꼭 응축된 것입니다.\n\n이제, 손끝으로.\n\n두 손가락으로 살짝 굴려 봅니다.\n\n말랑한가요, 단단한가요.\n끈적임은 어떤가요.\n\n귀 가까이 가져가서,\n굴려 보세요.\n\n아주 작은 소리가 날 수도 있습니다.\n\n들리면 들리는 대로,\n안 들리면 안 들리는 대로.\n\n코앞에서,\n냄새를 맡아 봅니다.\n\n달큰한 향이 희미하게 올라옵니다.\n\n입안에 벌써 침이 고이는지도 살펴보세요.\n\n이제, 입에 넣습니다.\n아직 씹지 않습니다.\n\n혀로 이리저리 굴리며,\n질감을 느껴 봅니다.\n\n주름이 혀에 닿는 느낌,\n조금씩 부드러워지는 변화.\n\n준비가 되면,\n딱 한 번만 깨물어 봅니다.\n\n터집니다.\n\n겉의 쫄깃함과,\n속에서 번지는 진한 단맛이 서로 다릅니다.\n\n이제 아주 천천히,\n씹어 봅니다.\n\n씹을 때마다 맛이 어떻게 변하는지,\n단맛이 어디로 퍼지는지.\n\n삼키고 싶은 마음이 들면,\n그 마음도 알아차리고,\n\n천천히 삼키며,\n목을 타고 내려가는 길을 따라가 봅니다.\n\n입안에 남은 여운까지.\n\n건포도 한 알에,\n이렇게 많은 맛이 들어 있었습니다.\n\n평소 우리는 이 맛들을 느끼기도 전에 삼켜 버립니다.\n\n건포도가 심심한 것이 아니라,\n우리가 바빴던 것입니다.\n\n천천히 먹으면,\n맛이 깨어나고,\n\n맛이 깨어나면,\n몸의 소리도 들리기 시작합니다.\n\n'이제 충분해' 하는 포만의 신호까지도.\n\n그러니 오늘부터,\n한 가지만 해 보세요.\n\n식사의 첫 한 입만,\n건포도처럼.\n\n첫 입을 천천히 먹으면,\n그 식사 전체가 달라집니다.\n\n한 알을 제대로 만나는 것.\n\n그것이 마음챙김의 전부이자,\n시작입니다.","duration":"약 10분","tags":"#건포도명상 #먹기명상 #관찰","series":"숨비명상"},{"id":"9f5cd1be","category":"관찰","title":"몸이라는 집― 바디스캔 명상","body":"편안하게 눕습니다. 의자라면,\n등을 기대고 두 발을 바닥에 내려놓아도 좋습니다.\n\n눈을 감고,\n숨이 드나드는 것을 잠시 느껴 봅니다.\n\n들어오고,\n\n나가고.\n\n오늘 우리는,\n몸이라는 집을 찬찬히 둘러볼 것입니다.\n\n평생 이 집에 살았지만,\n방마다 돌아본 적은 별로 없었습니다.\n\n따뜻한 등불 하나를 들고,\n방마다 불을 켜 주듯,\n천천히 다녀 보겠습니다.\n\n고칠 것은 없습니다.\n그저 들여다보고,\n불을 켜 주면 됩니다.\n\n먼저, 가장 아래층.\n\n발가락입니다.\n\n열 개의 발가락에 가만히 등불을 비춥니다.\n\n따뜻한가요, 서늘한가요.\n양말의 감촉이 느껴지나요.\n\n아무 느낌이 없어도 괜찮습니다.\n오래 불이 꺼져 있던 방은 원래 그렇습니다.\n'느껴지지 않는구나' 하고 알아차리면,\n그것으로 충분합니다.\n\n발바닥으로 옮겨 갑니다.\n\n하루 종일 온몸을 떠받치던 자리.\n바닥에 닿은 면적과 그 온기를 느껴 봅니다.\n\n발등과 발목을 지나,\n\n종아리와 정강이.\n\n단단한가요, 무거운가요.\n그 느낌 그대로 둡니다.\n\n무릎을 지나,\n\n허벅지.\n\n다리 전체가 바닥에 실려 있는 무게를 느껴 봅니다.\n\n엉덩이와 골반.\n\n몸의 한가운데,\n나를 받쳐 온 큰 방입니다.\n바닥과 닿은 넓은 면을 가만히 느낍니다.\n\n이제 배로 올라갑니다.\n\n숨이 들어올 때마다 배가 살며시 부풀고,\n나갈 때마다 가라앉습니다.\n\n그 안쪽,\n보이지 않는 곳에서 쉬지 않고 일하는 것들에게도 등불을 한 번 비춰 줍니다.\n\n가슴.\n\n숨이 드나드는 길목,\n그 안의 작은 기척.\n\n따뜻한지, 답답한지,\n평온한지. 무엇이 느껴지든,\n느껴지는 그대로 둡니다.\n\n등과 허리.\n\n바닥에 닿아 있는 등의 면적을 느껴 봅니다.\n\n하루의 무게를 지고 다니느라 뭉친 곳이 있다면,\n풀려고 애쓰지 말고,\n'여기가 뭉쳐 있구나' 하고 불만 켜 둡니다.\n\n신기하게도,\n알아봐 주는 것만으로 느슨해지는 방들이 있습니다.\n\n이제 손끝으로 갑니다.\n\n열 개의 손가락,\n\n손바닥,\n\n손목과 팔을 타고,\n\n어깨까지.\n\n어깨는 많은 사람들의 집에서 가장 굳게 잠긴 방입니다.\n등불을 오래, 머물러 줍니다.\n\n목을 지나,\n\n턱.\n\n윗니와 아랫니가 꽉 물려 있다면,\n살짝 떨어뜨려 봅니다.\n\n눈과 미간.\n\n찌푸림이 남아 있다면 그것도 알아차리고,\n\n이마를 지나, 정수리까지.\n\n집의 꼭대기에 불이 켜졌습니다.\n\n혹시 둘러보는 동안 딴생각이 다녀갔나요.\n\n괜찮습니다.\n생각이 오면 '왔구나' 하고,\n가게 두고,\n다시 몸으로 돌아오면 됩니다.\n\n백 번 달아나면,\n백 번 돌아오면 됩니다.\n\n'내가 잘하고 있나' 하는 생각이 들었다면,\n그 생각도 손님입니다.\n바디스캔에는 잘하고 못하고가 없습니다.\n둘러보는 것이 전부니까요.\n\n이제 마지막으로,\n\n발끝에서 정수리까지,\n몸 전체를 한 번에 느껴 봅니다.\n\n방마다 불이 켜진 집을 멀리서 바라보듯,\n\n통째로, 한눈에.\n\n숨이 들어올 때 온몸이 살며시 차오르고,\n나갈 때 온몸이 가라앉습니다.\n\n몸을 다 돌고 나니,\n마음도 어느새 고요해져 있습니다.\n\n몸과 마음은 한집에 사는 식구라서,\n\n한쪽을 돌봐 주면,\n다른 쪽도 함께 쉽니다.\n\n이제 손가락과 발가락을 가볍게 움직여 봅니다.\n\n기지개를 한 번 켜고,\n\n준비가 되면,\n천천히 눈을 뜹니다.\n\n방마다 불이 켜진,\n따뜻한 집으로 잘 돌아오셨습니다.","duration":"약 20분","tags":"#바디스캔 #몸이라는집 #관찰","series":"숨비명상"},{"id":"ae1d202a","category":"자비희사","title":"괜찮지 않아도― 위로명상","body":"편안하게 앉거나 누워,\n가만히 눈을 감습니다.\n\n숨을 천천히 들이쉬고,\n\n내쉴 때는,\n몸에 고여 있던 무거운 것들이 숨과 함께 빠져나간다고 느껴 봅니다.\n\n들이쉬고,\n\n내쉬고.\n\n한 번 더.\n\n이제 호흡은,\n평소의 리듬에 맡겨 둡니다.\n\n오늘은,\n아무에게도 하지 못했던 말을 제가 대신 해 드리려 합니다.\n\n그저 들으면서,\n내 이야기다 싶은 대목에서는 마음으로만 고개를 끄덕여 주세요.\n\n사실 나는, 많이 지쳤습니다.\n\n하루하루가 너무 힘이 듭니다.\n\n괜찮아, 힘내,\n그런 말은 이제 위로가 되지 않습니다.\n\n그런데 여기서 멈추면,\n주저앉으면,\n다시는 못 일어날 것 같아서.\n\n나만 뒤처질 것 같아서.\n\n그래서 오늘도 괜찮은 척,\n아무렇지 않은 척,\n버티고 있습니다.\n\n누가 이 마음을 알아줬으면 좋겠는데,\n\n약한 모습 그대로 기댈 수 있는 사람이 없습니다.\n\n그래서 가끔은,\n세상에 혼자인 것 같습니다.\n\n여기까지가,\n우리가 말하지 못했던 속마음입니다.\n\n오늘,\n이 마음에게 처음으로 허락을 내려 주려 합니다.\n\n괜찮지 않다고,\n말해도 괜찮습니다.\n\n힘들다고, 말해도 괜찮습니다.\n\n울고 싶으면,\n울어도 괜찮습니다.\n\n화가 나면,\n화가 난다고 해도 괜찮습니다.\n\n잠시 쉬어 가도, 괜찮습니다.\n\n애써 괜찮은 척하지 않아도,\n괜찮습니다.\n\n어떤 모습이어도, 괜찮습니다.\n\n참았던 것이 올라오면,\n막지 말고, 흐르게 두세요.\n\n외면하지 않고 있는 그대로 허용할 때,\n마음은 비로소 위로를 받기 시작합니다.\n\n이제,\n가슴에 한 손을 가만히 얹어 보세요.\n\n그리고 가슴이 하는 말을 들어 줍니다.\n\n힘들다고, 지친다고,\n답답하다고.\n\n말하게 두세요.\n\n그 가슴 깊은 곳에는,\n마르지 않는 작은 샘이 하나 있습니다.\n\n내가 나를 아끼는 마음이 고여 있는 샘입니다.\n\n그 샘에서 따뜻한 기운이 흘러나와,\n\n지친 마음을 가만히 감싸는 것을 느껴 봅니다.\n\n그리고 그 온기 속에서,\n내 안의 가장 다정한 목소리가 말을 건넵니다.\n\n많이 힘들었지.\n\n살아남으려고,\n뒤처지지 않으려고,\n힘들어도 괜찮은 척하면서,\n여기까지 오느라 정말 고생 많았어.\n\n쉬면 못 일어날까 봐,\n쉬지도 못했지.\n\n이제는,\n힘들면 힘들다고 해도 돼.\n\n지치면 쉬었다 가도 돼.\n\n주저앉아 울어도 돼.\n\n약한 모습 보여도 돼.\n\n괜찮지 않아도, 괜찮아.\n\n그 말을,\n가슴으로 받아 봅니다.\n\n정말 강한 것은 약한 데가 없는 것이 아니라,\n\n나의 가장 여린 곳을 숨기지 않고 품어 주는 것입니다.\n\n약한 나를 안아 줄 때,\n나는 진짜로 단단해집니다.\n\n그리고 기억해 주세요.\n\n나를 가장 깊이 이해할 수 있는 사람도,\n\n나를 가장 잘 위로할 수 있는 사람도,\n\n바로 나 자신이라는 것을.\n\n이 샘은 언제나 그 자리에 있습니다.\n\n힘든 날에는 언제든,\n가슴에 손을 얹고 찾아오면 됩니다.\n\n이제 숨을 한 번 깊게 들이쉬고,\n길게 내쉽니다.\n\n가슴의 손을 천천히 내려놓고,\n\n손끝,\n발끝을 가볍게 움직여 보고,\n\n준비가 되면, 눈을 뜹니다.\n\n오늘도 버텨 준 나와 함께,\n잘 돌아오셨습니다.","duration":"약 15분","tags":"#위로명상 #수용 #자기위로","series":"숨비명상"},{"id":"cdd292a4","category":"탈중심화","title":"그동안 고마웠어― 비움 명상","body":"편안하게 앉아,\n눈을 감습니다.\n\n숨을 두어 번,\n깊게 쉬어 봅니다.\n\n오늘은 청소 도구가 필요 없는 정리를 해 보려 합니다.\n\n마음속으로,\n내 방에 가 봅니다.\n\n그리고 그 방에서 가장 오래 닫혀 있던 곳.\n\n서랍이어도 좋고,\n옷장 구석이어도 좋고,\n침대 밑 상자여도 좋습니다.\n\n그 앞에 앉아,\n천천히 열어 봅니다.\n\n익숙한 냄새가 훅,\n올라옵니다.\n\n그 안에서,\n물건 하나를 꺼내 보세요.\n\n오래 자리만 지키던 물건도 좋고,\n버리지도 쓰지도 못하던 추억의 물건이어도 좋습니다.\n\n어릴 적 받은 상장,\n누군가 준 선물,\n언젠가 쓰겠지 하던 그것.\n\n두 손에 올려놓고,\n가만히 바라봅니다.\n\n이제 이 물건에게,\n네 가지를 물어보겠습니다.\n\n첫째.\n\n지금의 나에게, 쓰이고 있니?\n\n둘째.\n\n지금도 너에게, 마음이 가니?\n\n예전에는 좋아서 들였지만,\n지금은 어떤가요.\n\n셋째.\n\n네가 하려던 일은,\n아직 남아 있니?\n\n이유가 있어서 온 물건인데,\n그 일이 이미 끝났을 수도 있습니다.\n\n넷째. 마지막 질문입니다.\n\n너를 안고 있으면,\n내 마음이 환해지니?\n\n물건을 가슴에 살짝 대어 보세요.\n\n설레는지, 따뜻해지는지,\n\n아니면 무겁고 미안하기만 한지.\n\n몸은 이미,\n답을 알고 있습니다.\n\n마음이 환해졌다면,\n이 물건은 아직 내 사람입니다.\n\n제자리에 소중히 돌려놓아 주세요.\n\n무겁기만 했다면,\n이제 보내 줄 시간입니다.\n\n추억의 물건이라 망설여진다면,\n이렇게 해 보세요.\n\n물건은,\n추억을 담아 두었던 그릇일 뿐입니다.\n\n그릇을 가만히 기울여,\n추억만 가슴으로 옮겨 담습니다.\n\n그날의 장면, 그날의 웃음,\n그날의 마음.\n\n추억은 물건 속이 아니라,\n내 안에 삽니다.\n\n다 옮겨 담았다면,\n\n빈 그릇이 된 물건에게 마지막 인사를 건넵니다.\n\n그동안, 고마웠어.\n\n나를 즐겁게 해 줘서,\n그날을 지켜 줘서,\n여기까지 함께 와 줘서.\n\n고마웠어.\n\n잘 가.\n\n버리는 것이 아닙니다.\n고맙다고 인사하며,\n보내 주는 것입니다.\n\n물건이 떠난 자리를 바라봅니다.\n\n텅 빈 자리가 허전하지 않고,\n오히려 시원합니다.\n\n닫혀 있던 서랍에,\n바람이 지나갑니다.\n\n비워진 만큼,\n방이 숨을 쉽니다.\n\n방이 숨을 쉬면,\n나도 숨이 쉬어집니다.\n\n물건을 정리하는 일은,\n결국 마음을 정리하는 일이었습니다.\n\n이제 숨을 깊게 들이쉬고,\n길게 내쉬며,\n\n천천히 눈을 뜹니다.\n\n그리고 오늘 집에 돌아가면,\n마음속으로 골랐던 그 물건을,\n정말로 두 손에 올려 보세요.\n\n네 가지 질문과,\n한마디 인사면 됩니다.\n\n그동안, 고마웠어.","duration":"약 12분","tags":"#비움명상 #정리 #내려놓기","series":"숨비명상"},{"id":"3b38f145","category":"관찰","title":"나는 바다― 생각을 흘려보내는 명상","body":"허리를 곧게 펴고 앉습니다.\n\n시작하기 전에,\n몸을 조금 깨워 줍니다.\n\n고개를 좌우로 천천히 갸웃갸웃,\n\n어깨를 앞뒤로 크게 돌려 주고,\n\n몸통도 오른쪽,\n왼쪽으로 부드럽게 비틀어 줍니다.\n\n지금 움직이는 동작 하나하나를,\n남의 몸 보듯 가만히 지켜보면서.\n\n이제 정면으로 돌아와,\n허리를 세우고,\n엉덩이 양쪽이 바닥에 고르게 닿는 것을 느낍니다.\n\n손은 무릎 위에,\n가장 편한 모양으로 내려놓고,\n\n눈을 부드럽게 감습니다.\n\n코로 숨을 들이쉬고,\n코로 내쉽니다.\n\n들이쉴 때는,\n맑은 공기가 가슴 가득 차오르고,\n\n내쉴 때는,\n하루 종일 고여 있던 묵은 숨이 빠져나갑니다.\n\n한 번 더, 들이쉬고,\n길게 내쉽니다.\n\n이제 마음속에,\n넓은 바다를 떠올려 봅니다.\n\n물결이 해안으로 밀려와,\n하얗게 부서지고,\n\n스르르,\n다시 먼바다로 돌아갑니다.\n\n밀려오고, 부서지고,\n돌아가고.\n\n파도는 그렇게 쉬지 않고 오가지만,\n\n바다는 한 번도 파도에 휩쓸려 가지 않습니다.\n\n우리의 생각도,\n이 파도와 같습니다.\n\n부르지 않아도 밀려오고,\n어떤 날은 한꺼번에 몰아치기도 합니다.\n\n그래도 괜찮습니다.\n파도 없는 바다가 없듯,\n생각이 떠오르는 것은 자연스러운 일입니다.\n\n중요한 것은 하나입니다.\n\n파도는,\n반드시 돌아간다는 것.\n\n지금,\n머릿속에 있는 생각 하나를 꺼내 봅니다.\n\n걱정이어도 좋고,\n후회여도 좋고,\n밀린 할 일이어도 좋습니다.\n\n그 생각을 물결 위에 가만히 올려놓고,\n\n숨을 크게 들이쉬었다가,\n\n후 — 내쉬면서,\n\n먼바다로 흘려보냅니다.\n\n생각이 물결을 타고 유유히 멀어지는 것을,\n해변에 서서 바라봅니다.\n\n또 하나가 떠오르면,\n또 물결에 올리고,\n\n내쉬는 숨에, 흘려보냅니다.\n\n붙잡지 않으면,\n파도는 알아서 돌아갑니다.\n\n억지로 생각을 안 하려고 하면,\n생각은 오히려 더 자주 찾아옵니다.\n\n그러니 막지 말고,\n그저 흘려보내기만 하세요.\n\n이제부터 잠시,\n안내 없이 고요히 머물겠습니다.\n\n무엇이 떠오르든,\n날숨에 실어, 먼바다로.\n\n*(3분, 침묵)*\n\n이제,\n의식을 지금 여기로 가져옵니다.\n\n손가락과 발가락에 가볍게 힘을 주어 움직여 봅니다.\n\n두 손을 모아,\n빠르게 비벼 봅니다.\n\n쓱쓱, 쓱쓱.\n\n따뜻해진 손으로, 머리,\n어깨, 가슴,\n다리까지 쓸어내리며 온기를 전해 줍니다.\n\n한 번 더 손을 비벼,\n\n이번에는 두 눈 위에 가만히 얹습니다.\n\n어둡고 따뜻한 손바닥 안에서,\n눈이 쉽니다.\n\n손을 천천히 떼면서,\n눈을 뜹니다.\n\n시야가, 바다처럼 넓어집니다.\n\n입가에 미소를 한 번 지어 보세요.\n\n그리고 기억해 주세요.\n\n생각이 파도라면,\n나는 바다입니다.\n\n파도는 오고 가지만,\n바다는 언제나 그 자리에 있습니다.\n\n오늘 하루,\n어떤 파도가 밀려와도,\n\n당신은, 바다입니다.","duration":"약 15분","tags":"#생각명상 #나는바다 #관찰","series":"숨비명상"},{"id":"1c8f2eba","category":"호흡명상","title":"하나, 숨― 열숨명상","body":"편안한 자세로 앉습니다.\n\n의자여도 좋고,\n바닥이어도 좋고,\n지금 있는 그대로도 좋습니다.\n\n시작하기 전에,\n한 가지만 알아 두세요.\n\n마음은 한없이 넓지만,\n마음의 무대는 아주 작습니다.\n\n한 번에 하나만 올라설 수 있는,\n작은 무대입니다.\n\n걱정이 무대를 차지하면 온통 걱정만 보이고,\n\n불안이 올라서면 온통 불안입니다.\n\n그런데 반대로,\n그 무대를 다른 것으로 채우면,\n\n걱정은 스스로 무대에서 내려갑니다.\n\n억지로 끌어내리는 것이 아니라,\n설 자리가 없어서 내려가는 것입니다.\n\n오늘 무대에 올릴 것은,\n숨입니다.\n\n한 손을 가슴에,\n한 손을 배에 가만히 얹어 보세요.\n\n손바닥 아래에서 숨이 오르내리는 것이 느껴집니다.\n\n이제,\n열 번의 숨을 세어 보겠습니다.\n\n숨이 들어올 때,\n마음속으로 '하나'.\n\n숨이 나갈 때, '숨'.\n\n하나 —\n\n숨 —\n\n들어올 때 '둘',\n나갈 때 '숨'.\n\n둘 —\n\n숨 —\n\n그렇게 열까지 갑니다.\n\n중간에 숫자를 잊어버리면,\n빙긋 웃으며 하나부터 다시 시작하면 됩니다.\n잊는 것도 명상의 일부입니다.\n\n한 가지 약속이 있습니다.\n\n숨을 바꾸려 하지 마세요.\n\n숨이 짧으면 짧은 대로,\n길면 긴 대로,\n얕으면 얕은 대로.\n\n몸이 그렇게 쉬는 데는,\n그럴 만한 이유가 있을 것입니다.\n\n여러분은 다만,\n그 숨의 감각을 음미하면 됩니다.\n\n좋은 차를 음미하듯이.\n\n콧끝의 서늘함,\n가슴의 오르내림,\n배의 부풂을.\n\n셋 —\n\n숨 —\n\n넷 —\n\n숨 —\n\n이제 남은 숨은,\n각자의 속도로 열까지 이어 가 보세요.\n\n열 번의 숨이 끝났습니다.\n\n방금 그 시간 동안,\n마음의 무대 위에는 숨이 서 있었습니다.\n\n걱정과 생각들은,\n잠시 객석에 앉아 있었고요.\n\n지금 여기란,\n멀리 있는 것이 아닙니다.\n\n생각에서 나와 감각으로 오면,\n\n그곳이 바로,\n지금 여기입니다.\n\n마지막으로,\n하나만 더 드리겠습니다.\n\n살다 보면 아픈 일은 화살처럼 날아옵니다.\n\n첫 번째 화살은,\n누구도 피할 수 없습니다.\n\n하지만 그 일을 밤새 곱씹으며 나에게 다시 쏘는 두 번째 화살은,\n\n내가, 안 쏠 수 있습니다.\n\n화살이 날아온 날,\n가슴과 배에 손을 얹고,\n\n하나 —\n\n숨 —\n\n이 열 번의 숨이,\n두 번째 화살의 활을 내려놓는 시간입니다.\n\n익숙해지면 손을 얹지 않아도 되고,\n숫자를 세지 않아도 됩니다.\n\n전철에서도,\n회의 들어가기 전에도,\n설거지를 하다가도.\n\n숨은 언제나,\n여러분 곁에 있으니까요.","duration":"약 8분","tags":"#열숨명상 #호흡명상 #지금여기","series":"숨비명상"},{"id":"eb9f42c7","category":"관찰","title":"마음 샤워― 화와 짜증을 씻어 내리는 감정명상","body":"방해받지 않을 자리를 찾아,\n편안하게 자리합니다.\n\n앉아도, 누워도,\n서 있어도 좋습니다.\n\n눈을 감습니다.\n\n오늘 호흡은,\n조금 다르게 합니다.\n\n코로 들이쉬고,\n입으로 내쉽니다.\n\n들이쉬고,\n\n입으로, 후 —\n\n내쉬는 숨을 조금 더 적극적으로.\n감정은 날숨에 실려 나가니까요.\n\n한 번 더.\n\n후 —\n\n이제,\n씻어 내기 전에 먼저 할 일이 있습니다.\n\n지금 내 안에 무엇이 와 있는지,\n알아봐 주는 일입니다.\n\n가슴이나 명치,\n목덜미 어딘가에서 욱신거리는 것.\n\n그것에게,\n가만히 이름을 붙여 봅니다.\n\n아, 화가 와 있구나.\n\n아, 짜증이 와 있구나.\n\n아, 서러움이 와 있구나.\n\n밀어내지도,\n혼내지도 않습니다.\n\n오랜만에 온 손님을 알아보듯,\n그저 알아봐 줍니다.\n\n알아봐 주는 것.\n여기까지가 절반입니다.\n\n이제,\n따뜻한 샤워실로 갑니다.\n\n머리 위에 샤워기가 하나 있습니다.\n\n손잡이를 돌리면,\n\n쏴아 —\n\n따뜻한 물이 쏟아지기 시작합니다.\n\n정수리에 닿는 물줄기의 무게,\n피어오르는 김,\n몸을 감싸는 온기.\n\n이 물은,\n감정을 씻어 주는 물입니다.\n\n감정이 나빠서 씻는 것이 아닙니다.\n\n하루 종일 애쓰느라 묻은 것이니까,\n이제 씻어 주는 것입니다.\n\n숨을 코로 깊게 들이쉬고,\n\n입으로 내쉬면서,\n\n후 —\n\n정수리의 화가,\n물줄기를 타고 얼굴을 지나,\n어깨를 지나, 흘러내립니다.\n\n한 번 더.\n\n후 —\n\n가슴의 짜증이,\n그 뜨거운 열기가,\n물에 씻겨 배를 지나,\n다리를 타고,\n\n발밑으로 흘러내려 갑니다.\n\n한 번 더.\n\n후 —\n\n발밑에 고인 물이 빙그르르 돌며 빠져나갑니다.\n\n씻겨 나간 감정도,\n그 물과 함께 멀리 흘러갑니다.\n\n필요하면 몇 번이든 더.\n\n들이쉬고,\n\n후 —\n\n몸의 열기가 한 김,\n식었습니다.\n\n다 씻기지 않아도 괜찮습니다.\n조금 옅어진 것만으로,\n오늘은 충분합니다.\n\n이제 샤워기를 잠그고,\n따뜻하고 보송한 수건으로 몸을 감쌉니다.\n\n가볍습니다.\n\n하나, 둘,\n셋 하면 눈을 뜨겠습니다.\n\n하나,\n\n둘,\n\n셋.\n\n눈을 뜨면,\n한결 개운한 내가 여기 있습니다.\n\n이 샤워실은,\n언제나 열려 있습니다.\n\n화가 치밀었던 회의 뒤에도,\n잠들기 전에도, 눈만 감으면,\n오 분이면 됩니다.\n\n그리고 오늘 밤 진짜 샤워를 하게 되면,\n\n물줄기에게 몸의 먼지와 함께,\n마음의 먼지도 슬쩍 맡겨 보세요.\n\n후 —","duration":"약 7분","tags":"#감정명상 #마음샤워 #화다스리기","series":"숨비명상"},{"id":"12a62097","category":"탈중심화","title":"그 사람의 하루― 가족을 위한 명상","body":"편안하게 앉아,\n지그시 눈을 감습니다.\n\n숨을 깊게 들이쉬고,\n길게 내쉽니다.\n\n두어 번 더,\n숨이 마음을 가라앉히게 둡니다.\n\n이제,\n한 사람을 떠올려 봅니다.\n\n남편일 수도, 아내일 수도,\n부모님이나 자식일 수도 있습니다.\n\n오래 함께 살았고,\n오래 부딪쳐 온 가족 중 한 사람.\n\n그리고 그 사람의,\n그 단점 하나.\n\n십 년, 이십 년,\n바뀌었으면 했지만 끝내 바뀌지 않은,\n그것.\n\n한 가지만 미리 말해 두겠습니다.\n\n몸과 마음을 크게 다치게 한 일은 오늘의 자리가 아닙니다.\n그런 일은 허용이 아니라 보호가 먼저입니다.\n\n오늘 떠올릴 것은,\n사소하지만 질긴,\n일상의 그 단점 하나입니다.\n\n떠올렸다면,\n가만히 바라봅니다.\n\n그리고 솔직하게 인정해 봅니다.\n\n그렇게 오래 말했는데도 바뀌지 않았다면,\n\n그것이, 현실입니다.\n\n그 사람도 참 굳건하지만,\n\n안 바뀌는 사람을 앞에 두고 \"바뀌어야 해\"라는 마음을 십 년,\n이십 년 놓지 못한 나의 마음도,\n\n똑같이 오래,\n굳어 있었습니다.\n\n그래서 오늘은,\n방향을 바꿔 보겠습니다.\n\n그 사람을 바꾸는 대신,\n\n태어나서 처음으로,\n그 사람이 되어 보는 것입니다.\n\n아침입니다.\n\n그 사람의 몸으로,\n눈을 뜹니다.\n\n그 사람의 나이,\n그 사람의 무릎,\n그 사람의 묵은 피로가 내 것이 됩니다.\n\n그 사람의 신발을 신고,\n문을 나섭니다.\n\n이제,\n내가 본 적 없는 그 사람의 낮이 흐릅니다.\n\n허리 숙였을 시간들,\n\n삼켰을 말들,\n\n전화기 너머로 참았을 순간들,\n\n집에는 한 번도 가져오지 않았던 무거운 것들.\n\n그 하루를,\n그 사람의 어깨로 지고 걸어 봅니다.\n\n저녁이 됩니다.\n\n집으로 돌아오는 그 사람의 발걸음.\n\n현관문 앞에서,\n숨을 한 번 고르는 그 사람.\n\n그리고 문을 열면,\n\n집 안에, 내가 서 있습니다.\n\n그 사람의 눈으로,\n나를 바라봅니다.\n\n그 사람에게 나는,\n어떤 얼굴이었을까요.\n\n바라보고 있으면,\n천천히 알게 되는 것이 있습니다.\n\n이 사람도,\n사랑받고 싶었구나.\n\n이 사람도,\n이 사람의 자리에서,\n애쓰고 있었구나.\n\n무엇이 올라오든,\n그대로 두세요.\n\n눈물이 나면, 흐르게 두세요.\n\n이제 천천히,\n다시 내 몸으로 돌아옵니다.\n\n숨을 한 번 깊게 쉬고,\n\n아까 그 단점을 다시 바라봅니다.\n\n단점은,\n여전히 거기 있습니다.\n\n그런데 조금,\n다르게 보입니다.\n\n완벽한 가족은 어디에도 없습니다.\n\n부족한 데가 있어서,\n우리는 서로에게 배울 것이 있는 사람이 됩니다.\n\n어쩌면 그 단점이,\n나를 여기까지,\n이 마음공부까지 데려온 것인지도 모릅니다.\n\n그렇다면 그 사람은,\n나를 자라게 한 귀한 인연입니다.\n\n이제 마지막으로,\n\n\"당신이 바뀌어야 해\"라는 그 오래된 짐을,\n\n오늘은 내가,\n가만히 내려놓아 봅니다.\n\n그 사람을 위해서가 아니라,\n\n이십 년 그 짐을 지고 온,\n나를 위해서.\n\n숨을 깊게 들이쉬고,\n길게 내쉬며,\n\n내려놓은 자리의 가벼움을 느껴 봅니다.\n\n준비가 되면,\n천천히 눈을 뜹니다.\n\n그리고 오늘,\n그 사람을 만나면,\n\n말하지 않아도 좋습니다.\n마음속으로,\n한마디만 건네 보세요.\n\n당신도, 애쓰고 있구나.\n\n신기한 일이 일어납니다.\n\n내가 변하면,\n집의 공기가 먼저 변합니다.","duration":"약 15분","tags":"#가족명상 #그사람의하루 #허용","series":"숨비명상"},{"id":"a9427d36","category":"멈춤","title":"웃음 뒤의 나― 감정노동자를 위한 자기연민 명상","body":"오늘도, 많이 웃으셨지요.\n\n웃고 싶어서 웃은 웃음도 있었겠지만,\n웃어야 해서 웃은 웃음도 있었을 것입니다.\n\n지금 이 시간만큼은,\n웃지 않아도 됩니다.\n\n유니폼을 벗듯, 명찰을 떼듯,\n표정도 잠시 내려놓아 보세요.\n\n편안한 자세를 찾고,\n눈을 감거나,\n반쯤 내리떠도 좋습니다.\n\n숨을 천천히 깊게 들이쉬고,\n\n길게 내쉽니다.\n\n숨이 들어오고 나가는 것을,\n밀물과 썰물처럼,\n잠시 지켜봅니다.\n\n생각이 떠돌면,\n그런 줄 알아차리고,\n다시 숨으로 돌아오면 됩니다.\n\n이제,\n최근의 한 장면을 떠올려 봅니다.\n\n속은 상했는데,\n얼굴은 웃어야 했던 순간.\n\n무리한 요구 앞에서,\n날 선 말 앞에서,\n꾹 삼키고 미소를 지어야 했던,\n그때.\n\n너무 아픈 기억 말고,\n지금 다룰 수 있을 만한 것으로,\n하나면 됩니다.\n\n그 장면을 떠올릴 때,\n몸 어딘가가 불편해지는지 살펴보세요.\n\n명치가 묵직한지,\n목이 조이는지,\n어깨가 굳는지.\n\n찾았다면,\n그곳에 가만히 숨을 보내 줍니다.\n\n그리고,\n세 마디를 차례로 건네 보겠습니다.\n\n첫 번째 마디.\n\n지금, 힘들구나.\n\n괜찮은 척을 걷어 내고,\n사실을 사실대로 알아봐 주는 말입니다.\n\n이것이, 힘듦이구나.\n\n두 번째 마디.\n\n나만 그런 게 아니구나.\n\n지금 이 순간에도,\n어느 계산대 앞에서,\n어느 전화기 너머에서,\n어느 카운터 뒤에서,\n\n누군가가 나와 똑같이 속을 삼키며 웃고 있습니다.\n\n이 힘듦은 내가 약해서 겪는 것이 아니라,\n사람을 상대하며 사는 우리 모두가 겪는 일입니다.\n\n혼자가 아닙니다.\n\n세 번째 마디를 건네기 전에,\n\n한 손을 가슴 위에 가만히 얹어 보세요.\n\n손의 온기와 부드러운 무게를 느껴 봅니다.\n\n힘든 친구의 어깨에 손을 얹어 주듯,\n\n오늘은 그 손을,\n나에게 얹어 주는 것입니다.\n\n그리고 세 번째 마디.\n\n내가, 나에게 친절하기를.\n\n이어서,\n천천히 따라 말해 봅니다.\n\n내가 행복하기를.\n\n내가 평화롭기를.\n\n내가 건강하기를.\n\n내가 편안하기를.\n\n내가 안전하기를.\n\n마음에 남는 문구가 있다면,\n그 한 줄만 몇 번이고 반복해도 좋습니다.\n\n그리고 한 가지,\n꼭 말해 주고 싶은 것이 있습니다.\n\n그때 지은 그 미소는,\n거짓이 아니었습니다.\n\n속이 상해도 웃어 준 것은,\n져서가 아니라,\n\n내 자리를 지키며 내 일을 해낸 것입니다.\n\n하루 종일 애쓴 얼굴의 근육들에게,\n\n삼키느라 수고한 목구멍에게,\n\n버텨 준 마음에게,\n\n수고했다고, 말해 줍니다.\n\n정말, 수고했어.\n\n숨을 한 번 깊게 들이쉬고,\n길게 내쉽니다.\n\n가슴의 손을 천천히 내려놓고,\n\n준비가 되면,\n부드럽게 눈을 뜹니다.\n\n내가 먼저 따뜻해져야,\n그 온기가 바깥으로도 나갈 수 있습니다.\n\n그러니 일하다가 숨이 턱 막히는 순간이 오면,\n\n잠깐 자리를 벗어나 삼십 초만 내어 보세요.\n\n가슴에 손을 얹고,\n세 마디면 됩니다.\n\n지금, 힘들구나.\n\n나만 그런 게 아니구나.\n\n내가, 나에게 친절하기를.","duration":"약 12분","tags":"#자기연민 #감정노동 #자기친절","series":"숨비명상"},{"id":"6f440c5a","category":"수용","title":"숲이 되어― 숲명상","body":"숲에 오신 것을, 환영합니다.\n\n바로 시작하지 않겠습니다.\n\n잠시 그 자리에 서서,\n숲이 먼저 우리에게 인사하게 두겠습니다.\n\n나뭇잎 사이로 내려온 햇살이 어깨에 닿고,\n\n바람이 볼을 스치고 지나갑니다.\n\n이 숲에 태어나서 처음 온 것처럼,\n잠시 고요히 느껴 봅니다.\n\n이제 허리를 펴고,\n가슴을 활짝 엽니다.\n\n눈을 살며시 감고,\n숲의 공기를 크게 들이마십니다.\n\n맑은 기운이 코를 지나,\n가슴을 지나,\n배까지 내려왔다가,\n\n천천히 되돌아 나갑니다.\n\n도시의 공기와는 다르지요.\n\n몇 번 더, 깊이 마시고,\n길게 내쉽니다.\n\n이제 눈을 뜨고,\n온몸의 감각을 활짝 열어 숲과 만나 보겠습니다.\n\n먼저, 눈.\n\n고개를 천천히 돌려,\n주위의 나무와 풀과 꽃을 바라봅니다.\n\n같은 초록이 하나도 없습니다.\n연둣빛, 짙은 초록,\n햇살을 받아 반짝이는 잎과 그늘에 잠긴 잎.\n\n다음은, 코.\n\n숨을 깊이 들이쉬며,\n숲의 향기를 맡아 봅니다.\n\n나무 냄새, 흙냄새,\n비 지나간 자리의 냄새.\n\n그리고, 귀.\n\n가만히 있으면,\n소리들이 찾아옵니다.\n\n새소리,\n잎이 서로 몸을 비비는 소리,\n어디선가 흐르는 물소리.\n\n가장 먼 소리 하나를 찾아,\n잠시 따라가 봅니다.\n\n이제,\n천천히 걸어 보겠습니다.\n\n원한다면 신발을 벗어도 좋습니다.\n\n신발을 벗는 것은,\n도시를 벗는 일입니다.\n\n한 발, 한 발,\n발바닥이 땅에 닿는 자리에 마음을 두고 걷습니다.\n\n흙의 서늘함, 풀의 간지러움,\n잔가지의 톡톡함.\n\n걷다가 예쁜 꽃이나 잎을 만나면,\n잠시 멈추어 인사하고 가도 좋습니다.\n\n소리가 들려오면,\n소리에 머물며 걸어도 좋습니다.\n\n서두를 곳이, 없습니다.\n\n이제,\n기대고 싶은 든든한 나무 하나를 찾아보세요.\n\n찾았다면,\n등을 나무에 가만히 맡깁니다.\n\n눈을 감습니다.\n\n단단한 줄기가 등을 받쳐 줍니다.\n\n발바닥에서, 다리에서,\n가슴에서,\n\n몸의 작은 반응들이 어떻게 잦아드는지 지켜봅니다.\n\n나무에 기댄 몸이,\n서서히 고요해집니다.\n\n이제,\n오늘의 가장 깊은 자리로 들어가 보겠습니다.\n\n우리는 평생,\n숲에게 받기만 했습니다.\n\n그늘을 받고, 공기를 받고,\n위로를 받았습니다.\n\n오늘은 처음으로,\n내어 주는 쪽이 되어 보겠습니다.\n\n눈을 감은 채,\n내가 숲이 됩니다.\n\n두 발은 대지 깊이 뿌리내리고,\n\n두 다리와 두 팔은 크고 작은 아름드리나무들이 됩니다.\n\n머리는 산마루의 너럭바위,\n\n숨은 골짜기를 오르내리는 바람이 됩니다.\n\n깊이 들이쉬고,\n\n길게 내쉽니다.\n\n숲이 된 나에게,\n손님들이 찾아옵니다.\n\n새 한 마리가 날아와 내 가지에 앉아 깃을 고르고,\n\n구름이 내 마루 위에서 잠시 쉬었다 갑니다.\n\n저 아래로,\n알록달록한 옷을 입은 사람들이 올라옵니다.\n\n웃으며 이야기 나누는 이들,\n벤치에 앉아 쉬는 이들,\n땀 흘리며 걷는 이들.\n\n저마다 지친 것을 하나씩 안고 와서,\n\n내 그늘에서 내려놓고 갑니다.\n\n나는 아무것도 하지 않습니다.\n\n그저 여기 서서,\n자리를 내어 줄 뿐입니다.\n\n그런데 모두가,\n내가 있어서 좋다고 합니다.\n\n그 마음을,\n잠시 누려 봅니다.\n\n가만히 있어 주는 것만으로도,\n누군가에게 쉼이 될 수 있다는 것.\n\n이제 천천히,\n숲에서 다시 나로 돌아옵니다.\n\n발바닥이 내 발이 되고,\n팔이 내 팔이 되고,\n\n숨이 내 숨으로 돌아옵니다.\n\n편안하게 호흡하며,\n천천히 눈을 뜹니다.\n\n여전히, 햇살은 따스합니다.\n\n떠나기 전에,\n나무들을 한 번 더 바라봅니다.\n\n나무는 지나간 계절을 슬퍼하지 않고,\n\n오지 않은 봄을 조르지 않으며,\n\n오늘 내리는 볕으로 살아갑니다.\n\n그래서 숲의 낯빛은,\n늘 맑습니다.\n\n우리도 가끔,\n혼자라는 생각에 지치는 날이 있습니다.\n\n그런 날에는,\n이 숲을 떠올려 주세요.\n\n숲은,\n예약이 필요 없는 친구입니다.\n\n언제 와도 같은 자리에서,\n같은 그늘을 내어 줍니다.\n\n자주, 만나러 오시기를.","duration":"약 20분","tags":"#숲명상 #오감깨우기 #숲이되어","series":"숨비명상"},{"id":"327d5127","category":"수용","title":"나라는 친구― 청소년을 위한 자기연민 명상","body":"시작하기 전에,\n한 가지만 말해 둘게요.\n\n교실을 둘러보면,\n다들 괜찮아 보이지요.\n\n웃고, 떠들고,\n아무 걱정 없어 보이고.\n\n그런데 사실은,\n그렇지 않답니다.\n\n다들 저마다의 무게를 가방처럼 메고 다녀요.\n보이지 않을 뿐이에요.\n\n그러니까,\n나만 그런 게 아닙니다.\n\n오늘은 그 무게를,\n누구에게 말하지 않고도 스스로 다독이는 법을 배워 보겠습니다.\n\n나에게,\n'나'라는 친구를 만들어 주는 시간입니다.\n\n편하게 앉아서,\n눈을 감아도 좋고,\n살짝 내리떠도 좋아요.\n\n먼저,\n나에게 맞는 위로의 손길부터 찾아보겠습니다.\n\n한 손을,\n가슴 위에 올려 보세요.\n\n이번에는, 한 손은 배에,\n한 손은 가슴에.\n\n두 손으로 양 볼을 감싸도 보고,\n\n머리를 천천히 쓰다듬어도 봅니다.\n\n주먹을 쥐어 가슴에 올리고,\n다른 손으로 그 주먹을 포근히 감싸 보기도 하고,\n\n두 팔을 교차해서 나를 꼭 안아도 봅니다.\n\n하나씩 해 보면서,\n느낌이 어떤지 비교해 보세요.\n\n강아지나 고양이를 쓰다듬으면 기분이 좋아지지요.\n신기하게도,\n내가 나를 다독여도 몸은 똑같이 안심한답니다.\n\n그중에서 가장 마음이 놓이는 손길 하나를 골라 보세요.\n\n그것이 오늘부터,\n나만의 위로 버튼입니다.\n\n이제 손은 잠시 내려놓고,\n최근에 힘들었던 일 하나를 떠올려 보겠습니다.\n\n누군가의 말이 화살처럼 꽂혔던 순간,\n\n무리에서 혼자 겉도는 것 같았던 순간,\n\n애썼는데도 성적이 그대로였던 순간.\n\n너무 큰 상처 말고,\n지금 다룰 수 있을 만한 것으로,\n하나면 됩니다.\n\n그 장면 속에서 힘들어하고 있는 나를,\n마음의 눈으로 바라봅니다.\n\n그리고 그 아이에게,\n부드럽게 말을 건넵니다.\n\n참, 힘들었구나.\n\n많이 아팠겠다.\n\n이런 일은,\n정말 원하지 않았지.\n\n숨기지 않고,\n있는 그대로 인정해 줍니다.\n\n할 수 있다면,\n그 감정에 이름표를 붙여 보세요.\n\n이것이, 슬픔이구나.\n\n이것이, 억울함이구나.\n\n이것이, 외로움이구나.\n\n이름을 붙이는 순간,\n나와 감정 사이에 작은 틈이 생깁니다.\n숨 쉴 자리가 생겨요.\n\n이제 발끝에서 머리끝까지 몸을 쭉 훑어보면서,\n\n그 감정이 몸의 어디에서 가장 잘 느껴지는지 찾아봅니다.\n\n찾았다면,\n아까 골라 둔 나만의 손길로,\n\n그 자리를 부드럽게 다독여 주세요.\n\n다독이면서,\n이 말을 건넵니다.\n\n지금 이 감정은,\n누구나 느끼는 자연스러운 감정이야.\n\n지금 내 몸과 마음은 아주 빠르게 자라는 중이라서,\n감정도 남들보다 크게 느껴질 수 있어.\n\n내가 유별나서가 아니야.\n예민해서가 아니야.\n\n나만 그런 게 아니야.\n\n나 혼자가 아니야.\n\n위로의 말이 잘 떠오르지 않는다면,\n이렇게 해 보세요.\n\n나랑 제일 친한 친구가 지금 나와 똑같은 일을 겪고 있다면,\n\n나는 그 친구에게 뭐라고 말해 줄까.\n\n그 말을,\n그대로 나에게 들려주는 것입니다.\n\n어색해도 괜찮아요.\n처음이라 그래요.\n\n천천히,\n마음속으로 들려줍니다.\n\n내가 너를, 사랑해.\n\n나는 언제나 네 편이야.\n\n네 안에 뭐가 들어 있는지,\n나는 알고 있어.\n\n내가 늘, 너와 함께할게.\n\n이 중에 마음에 남는 한마디가 있다면,\n그 말만 몇 번이고 반복해도 좋습니다.\n\n한 가지,\n꼭 알아 둘 것이 있어요.\n\n이 명상은 안 좋은 기분을 없애려고 하는 것이 아닙니다.\n\n마음이 아프니까,\n하는 것입니다.\n\n아픔을 모른 척하면 언젠가 더 크게 덧나지만,\n\n아플 때 이렇게 다정하게 위로해 주면,\n\n마음에는 힘이 자랍니다.\n\n이제 마무리하겠습니다.\n\n깊게 숨을 들이쉬고,\n길게 내쉽니다.\n\n한 번 더.\n\n준비가 되면,\n부드럽게 눈을 뜹니다.\n\n지금 기분이 아까와 조금이라도 달라졌는지,\n가만히 살펴보세요.\n\n그리고 기억해 주세요.\n\n시험을 망친 날에도,\n단톡방의 말에 상처받은 밤에도,\n\n이불 속에서 나만의 손길로 나를 안고,\n한마디면 됩니다.\n\n나는 언제나, 네 편이야.\n\n세상 어디를 가도 나와 함께 가는 친구는,\n나 하나뿐이니까요.\n\n그 친구와,\n가장 친하게 지내시길.","duration":"약 12분","tags":"#자기연민 #청소년명상 #나라는친구","series":"숨비명상"},{"id":"084b0d35","category":"관찰","title":"깊은 바다― 텅 빈 충만 명상","body":"자세를 바르게 하고,\n편안하게 앉아,\n눈을 지그시 감습니다.\n\n심호흡을 세 번 하며,\n긴장을 풀어 주겠습니다.\n\n코로 깊이 들이쉬고,\n길게 내쉽니다.\n\n들이쉬고,\n\n내쉬고.\n\n한 번 더.\n\n이제 호흡은 편안하게 두고,\n\n숨을 몸 구석구석으로 보내며 풀어 주겠습니다.\n\n들숨이 머리로 들어와,\n날숨에 빠져나가며,\n머리가 느슨해집니다.\n\n얼굴이,\n호흡과 함께 풀어집니다.\n\n무거운 양어깨가,\n숨을 따라 내려앉습니다.\n\n숨이 팔을 타고 들어와 손끝으로 빠져나가며,\n팔이 가벼워집니다.\n\n답답하던 가슴이 열리고,\n\n굳어 있던 배가 풀리고,\n\n숨이 다리를 지나 발끝으로 흘러 나가며,\n다리가 가벼워집니다.\n\n이제 가볍게 이완된 몸으로,\n지금부터 할 일은 단 하나입니다.\n\n일어나는 모든 것을,\n판단 없이,\n있는 그대로 지켜보는 것.\n\n*(싱잉볼을 한 번 울린다)*\n\n먼저, 소리입니다.\n\n싱잉볼 소리가 태어나고,\n\n넓어지다가,\n\n가늘어지고,\n\n사라지는 끝자락까지,\n\n가만히 따라가 봅니다.\n\n소리가 완전히 사라진 자리의 고요도,\n잠시 들어 봅니다.\n\n이제 의식을 호흡으로 가져옵니다.\n\n코끝이 편하면 코끝에,\n배가 편하면 배에,\n닻을 내립니다.\n\n바람이 스치는 감각,\n배가 부풀고 꺼지는 움직임.\n\n힘주어 붙잡지 않습니다.\n그저 힘을 풀고,\n편안하게 지켜보기만 합니다.\n\n지켜보고 있으면,\n의식의 공간 안에 무언가가 떠오를 것입니다.\n\n물방울처럼, 뽕, 뽕, 뽕.\n\n생각이 떠오르면,\n'생각'이라고 이름표를 붙이고 지켜봅니다.\n\n감정이 올라오면,\n'감정'이라 붙이고 지켜봅니다.\n\n몸이 근질거리면,\n'감각'이라 붙이고 지켜봅니다.\n\n무엇이 떠올라도,\n쫓아내지 않고,\n따라가지도 않고,\n\n한 걸음 물러나,\n남의 일 보듯 바라봅니다.\n\n지나간 일의 판단이 일어나면,\n그 판단을 지켜보고,\n\n판단을 지켜보는 나를 또 알아차리고,\n\n의식이 달아나면,\n호흡의 닻으로 돌아옵니다.\n\n어떤 것이 일어나도,\n모두 괜찮습니다.\n\n저항하지 않고 그대로 두면,\n\n떠올랐던 것들은 물거품처럼,\n저절로 사라집니다.\n\n이제,\n조금 더 깊이 내려가 보겠습니다.\n\n가만히,\n마음속으로 따라 해 봅니다.\n\n나는, 이 몸이 아닙니다.\n몸을 지켜보고 있으니까요.\n\n나는, 이 생각이 아닙니다.\n생각을 지켜보고 있으니까요.\n\n나는, 이 감정이 아닙니다.\n감정을 지켜보고 있으니까요.\n\n나는,\n이 모든 것을 지켜보는 자리입니다.\n\n수면에는 파도가 몰아쳐도,\n\n깊은 바다는 언제나 고요합니다.\n\n생각과 감정은 수면의 물결이고,\n\n지켜보는 나는,\n그 아래의 깊은 바다입니다.\n\n이제 천천히, 파도 밑으로,\n\n물결이 닿지 않는 깊은 곳으로 내려갑니다.\n\n내려갈수록,\n\n조용해지고,\n\n고요해지고,\n\n텅 비어 갑니다.\n\n그런데 이상하지요.\n\n텅 비었는데,\n허전하지 않습니다.\n\n비어 있어서,\n무엇이든 담을 수 있고,\n\n고요해서,\n모든 것이 선명합니다.\n\n비어 있는데, 가득합니다.\n\n이 텅 빈 고요 속에,\n잠시 머물러 보세요.\n\n안내는, 여기까지입니다.\n\n더 머물고 싶은 분은 이대로 명상을 이어 가시고,\n\n마치실 분은 호흡을 고르며,\n천천히 눈을 뜨시면 됩니다.\n\n수면으로 올라와도,\n\n깊은 바다는 언제나,\n그 자리에 있습니다.","duration":"약 18분","tags":"#관찰명상 #텅빈충만 #깊은바다","series":"숨비명상"},{"id":"fa7b5cab","category":"수용","title":"뿌리내리기― 흔들리는 날의 접지 명상","body":"등을 곧게 펴고 앉아,\n두 손은 다리 위에 가만히 내려놓습니다.\n\n눈을 감고, 깊게 호흡합니다.\n\n숨을 내쉴 때마다,\n몸이 느긋하게 가라앉는 것을 느껴 봅니다.\n\n오늘은 특별히,\n내쉬는 숨을 따라가 보겠습니다.\n\n숨이 나에게서 떠나가는 것을 지켜봅니다.\n\n부드럽게, 끝까지.\n\n숨이 다 나가고,\n다음 숨이 들어오기 전,\n\n아주 잠깐의 고요한 멈춤이 있습니다.\n\n그 멈춤도, 알아차려 봅니다.\n\n억지로 쉬지 않아도,\n숨은 저절로 들어오고 나갑니다.\n\n이제,\n커다란 나무 한 그루에 등을 기대고 앉아 있다고 상상해 보세요.\n\n곁에 진짜 나무가 있다면,\n정말로 기대어도 좋습니다.\n\n등 뒤로,\n나무껍질의 감촉이 느껴집니다.\n\n거칠거칠한 결,\n그 사이의 서늘함,\n은은한 나무 냄새.\n\n등의 힘을 조금 더 풀어 봅니다.\n\n나무가 다 받아 줍니다.\n\n아주 튼튼하고, 굳건합니다.\n\n기대고 있으면,\n신기한 일이 일어납니다.\n\n내 등과 나무의 몸통이,\n어디서부터 나무이고 어디까지가 나인지,\n경계가 흐려집니다.\n\n나의 등뼈가,\n나무의 줄기가 됩니다.\n\n나를 곧게 세워 주는 그 굳건함을 느껴 봅니다.\n\n이제, 아래를 봅니다.\n\n내 하체에서 뿌리가 자라 내려갑니다.\n\n땅속 깊이, 점점 더 깊이,\n\n그리고 옆으로,\n점점 더 넓게.\n\n뿌리가 지구를 단단히 붙듭니다.\n\n그리고 느껴 보세요.\n\n지구도,\n나를 붙잡고 있습니다.\n\n내가 붙들고,\n지구가 붙잡아 주고.\n\n몸이 무겁게\n바닥에 실리는 이 느낌 —\n\n중력이란,\n지구가 나를 안고 있는 힘입니다.\n\n나는 지금, 붙들려 있습니다.\n\n떨어지지 않습니다.\n\n이번에는,\n두 손을 흙 속에 담근다고 상상해 보세요.\n\n따뜻하고 촉촉한 흙이 손가락 사이로 스며듭니다.\n\n그 땅의 든든한 기운을,\n\n숨을 들이쉬듯,\n뿌리로 천천히 끌어올립니다.\n\n뿌리에서 줄기로,\n\n줄기에서 가지로,\n\n가지 끝 잎사귀 하나하나까지,\n\n땅의 양분이 차오릅니다.\n\n원한다면,\n두 팔을 가지처럼 천천히 들어 올려 보세요.\n\n손끝 잎사귀에 햇볕이 내려앉아,\n따뜻하게 데워 줍니다.\n\n팔이 무거워지면,\n바람에 눕는 가지처럼 내려놓습니다.\n\n이제 가만히 느껴 봅니다.\n\n아래에서는,\n땅이 나를 받쳐 주고,\n\n위에서는,\n볕이 나를 돌봐 줍니다.\n\n나는 지금,\n하늘과 땅 사이에 안전하게 자리 잡고 있습니다.\n\n바람이 불면 가지는 흔들리겠지만,\n\n흔들리는 것과 뽑히는 것은 다릅니다.\n\n뿌리가 있는 한,\n나는 흔들려도,\n쓰러지지 않습니다.\n\n이 든든함 속에,\n잠시 머물러 보세요.\n\n이제 다시,\n호흡으로 돌아옵니다.\n\n내쉬는 숨이 서서히 멀어져 가는 것을 알아차리고,\n\n나의 리듬대로 천천히,\n깊게 몇 번 호흡합니다.\n\n준비가 되면,\n지금 있는 공간으로 의식을 되돌리고,\n\n부드럽게 눈을 뜹니다.\n\n그리고 살아가다가,\n마음이 붕 떠서 흔들리는 날이 오면,\n\n두 발바닥으로 땅을 지그시 딛고,\n기억해 주세요.\n\n지금 이 순간에도,\n\n지구가 나를,\n붙잡고 있다는 것을.","duration":"약 15분","tags":"#뿌리내리기 #접지명상 #안정","series":"숨비명상"},{"id":"1b6df824","category":"관찰","title":"걸어집니다― 걷기명상(경행)","body":"공간에 여유 있게 자리를 잡고 서 봅니다.\n\n시선은 두세 걸음 앞,\n바닥에 가만히 내려놓습니다.\n\n손은 배 앞에 포개어도 좋고,\n자연스럽게 두어도 좋습니다.\n\n오늘 우리는,\n평생 해 온 걷기를 처음 해 보는 것처럼 걸어 볼 것입니다.\n\n연습이니까,\n평소보다 조금만 천천히.\n\n다만,\n명상하는 사람처럼 근엄하게 걸을 필요는 없습니다.\n나는 나의 걸음으로 걸으면 됩니다.\n\n자, 첫걸음을 떼어 봅니다.\n\n마음은 발바닥에 둡니다.\n\n발바닥이 땅에서 떨어질 때의 느낌.\n\n허공을 건너,\n\n다시 땅에 닿을 때의 느낌.\n\n뒤꿈치가 먼저 닿고,\n발바닥이 구르고,\n앞꿈치가 밀어 줍니다.\n\n닿을 때의 압력,\n발바닥의 온기.\n\n한 발, 또 한 발.\n\n걷다 보면 생각이 끼어들 것입니다.\n\n'내가 지금 잘하고 있나.' '옆 사람은 어떻게 걷지.' '이게 뭐 하는 건가.'\n\n그 생각이 온 것을 알아차리고,\n\n다시 발바닥으로 돌아오면 됩니다.\n\n빠르게 걷는 사람도,\n느리게 걷는 사람도,\n저마다 자기 걸음일 뿐입니다.\n\n이제,\n발바닥에서 몸 전체로 넓힙니다.\n\n한 발이 나갈 때 몸의 무게가 이쪽에서 저쪽으로 건너가는 것,\n\n허벅지의 묵직함,\n\n팔이 저 혼자 가볍게 흔들리는 것.\n\n온몸이 함께 휘적휘적,\n길을 가고 있습니다.\n\n여기서, 힘을 빼 보세요.\n\n하나하나 놓치지 않고 관찰하겠다고 애쓸 필요가 없습니다.\n\n애쓰지 않아도, 느껴집니다.\n\n가만히 보면,\n신기한 일이 벌어지고 있습니다.\n\n나는 다음 발을 어디에 놓을지 계산한 적이 없습니다.\n\n그런데 다리는 저 혼자,\n걷는 법을 알고 있습니다.\n\n균형을 잡고, 속도를 맞추고,\n다음 발을 내딛습니다.\n\n걷는 것이 아니라,\n걸어집니다.\n\n눈도 그렇습니다.\n보려고 애쓰지 않아도,\n보입니다.\n\n귀도 그렇습니다.\n들으려고 애쓰지 않아도,\n들립니다.\n\n애쓰는 일을 몸에게 다 맡기고,\n\n나는 그저,\n이 걸음에 함께 있어 주면 됩니다.\n\n이제, 활짝 열어 봅니다.\n\n발의 감촉과 함께,\n\n살갗에 닿는 공기,\n\n어디선가 오는 소리,\n\n빛과 그림자,\n\n이 모든 것이 걸음 속으로 함께 들어옵니다.\n\n이 순간에는, 과거도 없고,\n미래도 없고,\n\n해야 할 일도, 나이도,\n직함도 없습니다.\n\n그저,\n한 발을 내딛는 이것뿐입니다.\n\n한 걸음 속에,\n지금의 전부가 들어 있습니다.\n\n그리고 한 가지,\n이 걷기의 비밀이 있습니다.\n\n이 걸음은,\n아무 데도 가지 않습니다.\n\n도착할 곳이 없습니다.\n얻을 것도 없습니다.\n\n그냥 걷는, 심심하고,\n평범하고,\n아무 맛도 없는 걸음.\n\n그런데 그 심심함이,\n이상하게 평화롭습니다.\n\n무엇이 되려는 마음 없이 그냥 걷는 이 시간이,\n얼마 만인가요.\n\n심심한 그대로,\n몇 걸음 더 걸어 봅니다.\n\n이제,\n그 자리에 가만히 멈춰 섭니다.\n\n우리는 평생,\n걷기를 어딘가에 도착하기 위한 도구로만 썼습니다.\n\n오늘 처음,\n걷기 그 자체를 살아 보았습니다.\n\n이 몇 분의 걸음이 낯설고도 좋았다면,\n\n내일부터는 따로 시간을 내지 않아도 됩니다.\n\n출근길의 몇 걸음,\n주차장에서 현관까지,\n화장실 다녀오는 복도에서,\n\n문득,\n발바닥으로 돌아오기만 하면 됩니다.\n\n걸으려 애쓰지 않아도,\n걸음은 언제나 걸어지고 있으니까요.","duration":"약 15분","tags":"#걷기명상 #경행 #저절로","series":"숨비명상"},{"id":"829d5f8a","category":"멈춤","title":"조약돌 명상― 꽃, 산, 물, 공간","body":"오늘은 준비물이 있습니다.\n\n작은 조약돌 네 개와,\n네 칸으로 나눈 종이 한 장.\n\n이 네 개의 돌이,\n오늘 우리의 네 명의 선생님이 되어 줄 것입니다.\n\n편안하게 앉아,\n조약돌 네 개를 왼쪽 바닥에 내려놓습니다.\n\n첫 번째는, 꽃입니다.\n\n종이의 첫 칸에,\n그리고 싶은 꽃을 천천히 그려 봅니다.\n\n선 하나하나를 그리는 줄 알면서 그립니다.\n\n꽃은, 새로움입니다.\n\n꽃은 저녁에 시들어도,\n아침이면 다시 핍니다.\n\n우리도 그렇습니다.\n지치고 시든 날에도,\n숨을 깊이 들이쉬면,\n다시 피어날 수 있습니다.\n\n이제 조약돌 하나를 집어,\n새로 보는 눈으로 바라봅니다.\n\n이 돌은 지금부터, 꽃입니다.\n\n왼쪽 손바닥에 올리고,\n오른손으로 왼손을 받쳐 줍니다.\n\n숨을 들이쉬며,\n나는 꽃이 됩니다.\n\n숨을 내쉬며,\n나는 새로워집니다.\n\n꽃,\n\n새로움.\n\n이렇게 세 번,\n숨을 쉬어 봅니다.\n\n숨을 들이쉬면, 언제나 다시,\n봄입니다.\n\n조약돌에게 미소를 보내고,\n오른쪽에 가만히 내려놓습니다.\n\n두 번째는, 산입니다.\n\n두 번째 칸에 산을 그려 봅니다.\n\n산은, 단단함입니다.\n\n계절이 바뀌고 비바람이 몰아쳐도,\n산은 그 자리에 그대로 있습니다.\n\n우리 안에도 그런 산이 있습니다.\n고요히 앉을 때마다,\n알아차리며 걸을 때마다,\n그 산은 조금씩 자랍니다.\n\n두 번째 조약돌을 집어 바라봅니다.\n\n이 돌은 지금부터, 산입니다.\n\n왼손에 올리고,\n오른손으로 받칩니다.\n\n숨을 들이쉬며,\n나는 산이 됩니다.\n\n숨을 내쉬며,\n나는 단단해집니다.\n\n산,\n\n단단함.\n\n세 번, 숨을 쉬어 봅니다.\n\n흔들리는 날에도,\n내 안의 산은 무너지지 않습니다.\n\n미소를 보내고, 내려놓습니다.\n\n세 번째는, 고요한 물입니다.\n\n세 번째 칸에 잔잔한 호수를 그려 봅니다.\n\n고요한 물은, 비춤입니다.\n\n물이 고요하면, 하늘도,\n구름도, 산도,\n일그러뜨리지 않고 있는 그대로 비춥니다.\n\n마음도 같습니다.\n숨과 함께 고요해지면,\n세상을 내 마음대로 구기지 않고,\n있는 그대로 보게 됩니다.\n\n세 번째 조약돌을 집어 바라봅니다.\n\n이 돌은 지금부터,\n고요한 물입니다.\n\n왼손에 올리고,\n오른손으로 받칩니다.\n\n숨을 들이쉬며,\n나는 고요한 물이 됩니다.\n\n숨을 내쉬며,\n있는 그대로를 비춥니다.\n\n물,\n\n비춤.\n\n세 번, 숨을 쉬어 봅니다.\n\n물결이 가라앉으면,\n비로소 바닥까지 보입니다.\n\n미소를 보내고, 내려놓습니다.\n\n마지막은, 공간입니다.\n\n네 번째 칸에는,\n넓은 하늘을 그려도 좋고,\n탁 트인 들판이나,\n날고 있는 새 한 마리를 그려도 좋습니다.\n\n공간은, 자유입니다.\n\n방에 빈자리가 있어야 사람이 살 수 있고,\n\n하늘에 빈자리가 있어야 새가 날 수 있듯이,\n\n마음에도 빈자리가 있어야 웃음이 들어오고,\n사람이 들어옵니다.\n\n네 번째 조약돌을 집어,\n미소 지으며 바라봅니다.\n\n이 돌은 지금부터,\n공간입니다.\n\n왼손에 올리고,\n오른손으로 받칩니다.\n\n숨을 들이쉬며,\n나는 공간이 됩니다.\n\n숨을 내쉬며,\n나는 자유로워집니다.\n\n공간,\n\n자유.\n\n세 번, 숨을 쉬어 봅니다.\n\n내 안이 넓어지면,\n사랑하는 사람들이 들어와 쉴 자리도 함께 넓어집니다.\n\n미소를 보내고,\n마지막 조약돌을 내려놓습니다.\n\n네 개의 돌과 함께,\n우리는 열두 번의 숨을 쉬었습니다.\n\n그 열두 번의 숨 동안,\n\n꽃처럼 새로워지고,\n산처럼 단단해지고,\n물처럼 맑아지고,\n하늘처럼 넓어졌습니다.\n\n이 힘들은 어디서 빌려 온 것이 아니라,\n처음부터 우리 안에 있던 것들입니다.\n\n조약돌은 다만,\n그것을 기억하게 도와주었을 뿐입니다.\n\n이제 네 개의 조약돌을 주머니에 넣어 가세요.\n\n주머니 속의 작은 명상실입니다.\n\n새로움이 필요한 날엔 꽃의 돌을,\n흔들리는 날엔 산의 돌을,\n마음이 어지러운 날엔 물의 돌을,\n답답한 날엔 공간의 돌을,\n\n손에 쥐고 세 번만 숨 쉬면 됩니다.\n\n미소와 함께,\n조약돌 명상을 마칩니다.","duration":"약 15분","tags":"#조약돌명상 #꽃산물공간 #주머니명상실","series":"숨비명상"},{"id":"5a3c8e88","category":"멈춤","title":"나이테― 폭풍을 지나온 나무의 명상","body":"몸과 마음이 편히 쉴 자리에,\n바르게 앉습니다.\n\n잠시, 호흡에 집중합니다.\n\n여덟을 세며 들이쉬고,\n여덟을 세며 내쉽니다.\n\n숫자가 길게 느껴지면,\n넷까지만 세어도 좋습니다.\n\n한 번 더, 길게 들이쉬고,\n길게 내쉽니다.\n\n이제 마음속에,\n작은 언덕 하나가 떠오릅니다.\n\n언덕 아래로는 연보랏빛 라벤더 밭이 바람에 살랑이고,\n\n작은 새들과 나비들이 그 위를 오갑니다.\n\n그리고 언덕 위,\n그 한가운데에,\n\n나는,\n한 그루의 나무로 서 있습니다.\n\n오랜 세월을 지나며 제법 굵어진 줄기.\n\n뿌리를 느껴 봅니다.\n\n굵고 단단한 뿌리 몇 갈래가 땅속 깊은 곳,\n물과 양분이 넉넉한 곳까지 깊게,\n더 깊게 내려가 있고,\n\n거기서 갈라진 수많은 잔뿌리들이 나를 더 단단히 붙들어 줍니다.\n\n위로는, 파랗고 청량한 하늘.\n\n땅에서는 물이 오르고,\n하늘에서는 볕이 내려와,\n\n내 안에서 만납니다.\n\n그 힘으로 나는 해마다 가지를 늘리고,\n잎을 넓혀 왔습니다.\n\n새와 나비가 가지에 앉았다 가고,\n\n숲의 작은 동물들이 내 그늘에서 쉬었다 갑니다.\n\n그렇게 나는,\n점점 더 커다란 나무로 자라는 중입니다.\n\n그런데,\n나무의 삶에는 맑은 날만 있지 않습니다.\n\n하늘이 금세 흐려지고,\n\n강한 바람이 몰아쳐 잔가지들을 부러뜨립니다.\n\n폭우가 세차게 내리쳐 잎사귀들을 떨굽니다.\n\n우지끈, 소리를 내며,\n아끼던 가지 하나가 꺾여 나갑니다.\n\n그래도 나는,\n같은 자리에 서 있습니다.\n\n가지는 잃어도,\n뿌리는 잃지 않습니다.\n\n바람이 아무리 사나워도,\n땅속까지는 들어오지 못하니까요.\n\n이윽고, 비가 그칩니다.\n\n젖은 잎에서 물방울이 뚝,\n뚝 떨어지고,\n하늘이 다시 갭니다.\n\n그리고 시간이 지나면,\n\n부러진 자리에서 새 가지가 돋고,\n\n떨어진 자리에서 새 잎이 납니다.\n\n언제 그랬냐는 듯이.\n\n아니,\n그냥 제자리가 아닙니다.\n\n폭풍을 지난 몸통은 한결 더 견고해졌고,\n\n뿌리는 그사이 더 깊이 내려갔습니다.\n\n나무는 시련을,\n상처로 남기지 않습니다.\n\n나이테로 새깁니다.\n\n한 해의 폭풍이,\n한 겹의 단단한 무늬가 됩니다.\n\n이제 잠시,\n나의 폭풍들을 떠올려 봅니다.\n\n살아오며 만났던 사나운 계절들.\n\n그때 부러졌던 것들,\n그때 떨어뜨렸던 것들.\n\n그런데, 보세요.\n\n나는 지금,\n여기 서 있습니다.\n\n부러진 자리에서 새로 돋아난 것들과 함께.\n\n그 계절을 지나온 나는,\n그 전의 나보다 깊은 사람입니다.\n\n쓰러지지 않고 여기까지 와 준 나의 뿌리에게,\n\n고맙다고, 말해 줍니다.\n\n숨을 깊게 들이쉬고,\n길게 내쉽니다.\n\n뿌리가 땅을 지그시 움켜쥐는 감각을 한 번 더 느끼고,\n\n준비가 되면,\n천천히 눈을 뜹니다.\n\n나는 오늘도, 평온하고,\n단단합니다.\n\n이 단단함은 타고난 것이 아니라,\n\n지나온 폭풍들이 길러 준 것입니다.","duration":"약 15분","tags":"#나이테 #회복탄력성 #나무명상","series":"숨비명상"},{"id":"839ad788","category":"관찰","title":"보임― 보기 명상","body":"우리 몸의 문 가운데 가장 바쁜 문은,\n눈입니다.\n\n아침에 뜨는 순간부터 잠들 때까지,\n쉼 없이 무언가를 받아들이고 있지요.\n\n그런데 이상합니다.\n\n하루 종일 그렇게 보고도,\n오늘 무엇을 보았는지 떠올려 보면,\n남아 있는 것이 별로 없습니다.\n\n보긴 봤는데,\n본 적이 없는 것입니다.\n\n오늘은,\n'본다'는 것을 처음처럼 해 보겠습니다.\n\n먼저,\n바라볼 대상 하나를 고릅니다.\n\n꽃이 있다면 꽃이 좋고,\n\n없다면 눈앞의 무엇이든 — 책상 위의 컵,\n창밖의 나무 한 그루,\n하늘의 구름 한 점.\n\n움직임이 적고 형태가 또렷한 것이면 무엇이든 됩니다.\n\n정했다면,\n편안한 자세를 잡고,\n시선을 그 대상에 가만히 내려놓습니다.\n\n시작하기 전에,\n아랫배로 숨을 서너 번 쉬어 봅니다.\n\n들이쉴 때 배가 부풀고,\n내쉴 때 가라앉는 것을 느끼면서.\n\n이제, 바라봅니다.\n\n전체의 모양은 어떤가요.\n\n색은 어떤가요.\n한 가지 색인 줄 알았는데,\n자세히 보면 여러 색이 섞여 있지 않나요.\n\n빛이 닿은 자리와 그늘진 자리.\n\n가장자리의 선.\n\n나에게서 얼마나 떨어져 있나요.\n\n그 곁에는 무엇이 함께 있나요.\n\n좋다, 싫다, 예쁘다,\n별로다 — 그런 말은 붙이지 않습니다.\n\n거울은 자기 앞에 온 것을 고르지 않고 그대로 비춥니다.\n\n오늘 나의 눈도,\n거울이 됩니다.\n\n그리고 여기서,\n한 가지 비밀을 알려드리겠습니다.\n\n지금 나는 보려고 애쓰고 있나요?\n\n아닙니다.\n\n눈을 뜨고 있으면,\n그냥 보입니다.\n\n내가 보는 것이 아니라,\n보이는 것입니다.\n\n그러니 마음속으로 가만히 이름 붙여 봅니다.\n\n보임.\n\n보임.\n\n애씀이 빠져나간 자리에서,\n바라보는 일이 문득 편안해집니다.\n\n이름 붙이기가 오히려 번거로우면,\n붙이지 않아도 됩니다.\n\n바라보는 사이,\n딴생각이 끼어들 것입니다.\n\n소리에 귀가 끌려가기도 하고,\n'이걸 왜 하고 있지' 싶기도 할 것입니다.\n\n괜찮습니다.\n그런 줄 알아차리고,\n조용히 다시 대상으로 돌아오면 됩니다.\n\n그리고 혹시,\n바라보는 동안 마음에 무언가 피어나지 않았나요.\n\n문득 떠오른 사람,\n이걸 보여 주고 싶은 누군가,\n알 수 없는 뭉클함.\n\n그 마음도 쫓아내지 말고,\n\n'마음이 움직였구나' 하고 알아봐 준 뒤에,\n\n다시 대상으로 돌아옵니다.\n\n조금만 더,\n말없이 바라봅니다.\n\n이제, 시선을 거두고,\n\n천천히 몸을 움직이며 명상을 마칩니다.\n\n방금 바라본 그것이,\n십 분 전과 조금 다르게 보이지 않나요.\n\n대상이 변한 것이 아니라,\n보는 눈이 깨어난 것입니다.\n\n이 명상의 좋은 점은,\n세상에서 가장 티가 안 난다는 것입니다.\n\n회의가 길어질 때 탁자 위의 컵 하나,\n\n버스를 기다리며 가로수 한 그루,\n\n대기실에서 창밖의 구름 한 점.\n\n아무도 모르게, 눈만으로,\n언제 어디서든.\n\n보려고 애쓰지 마세요.\n\n눈을 맡겨 두면,\n\n보입니다.","duration":"약 10분","tags":"#보기명상 #보임 #관찰","series":"숨비명상"},{"id":"14943706","category":"관찰","title":"나의 색― 360도 보기 명상","body":"우리는 하루 종일 앞만 보고 삽니다.\n\n눈이 볼 수 있는 세계의 절반도 쓰지 않고 사는 셈이지요.\n\n오늘은,\n지금 내가 있는 이곳을,\n처음으로 빙 둘러 다 보겠습니다.\n\n편안히 앉아,\n시선을 눈높이에 두고,\n정면을 바라봅니다.\n\n무엇이 보이나요.\n사람일 수도, 창문일 수도,\n벽일 수도 있습니다.\n\n보이는 것을,\n그저 알아봅니다.\n\n이제 시선을 아주 천천히,\n왼쪽으로 옮겨 갑니다.\n\n눈높이의 것들,\n가까이 있는 것,\n그 너머 멀리 있는 것.\n\n조금 위도 보고,\n조금 아래도 봅니다.\n\n색과, 질감과,\n빛이 닿은 자리와 그늘진 자리.\n\n하나하나, 서두르지 않고.\n\n왼쪽 어깨에 닿으면,\n몸을 살짝 틀어 어깨 너머,\n뒤쪽까지 봅니다.\n\n필요하면 손으로 바닥이나 의자를 짚고,\n목이 편한 만큼만.\n\n내 등 뒤에도 세계가 있었습니다.\n\n이제 아주 천천히,\n시선을 되돌려 가운데로 돌아옵니다.\n\n이번에는 오른쪽입니다.\n\n같은 속도로, 사물의 형태,\n직선과 곡선,\n윤곽의 선들을 보며,\n\n오른쪽 어깨를 지나,\n몸을 틀어 뒤쪽까지.\n\n그리고 천천히,\n다시 가운데로.\n\n한 바퀴를 다 보았습니다.\n\n숨을 코로 깊게 들이마셔 배까지 내렸다가,\n가슴으로, 목으로 올려,\n천천히 내쉽니다.\n\n자,\n이제 같은 길을 한 번 더 돌겠습니다.\n\n다만 이번에는,\n열쇠를 하나 쥐고 갑니다.\n\n색깔 하나를 골라 보세요.\n\n초록도 좋고, 갈색도,\n흰색도,\n무슨 색이든 좋습니다.\n\n정하셨나요.\n\n지금부터 그것이,\n나의 색입니다.\n\n정면을 보고,\n\n천천히 왼쪽으로 돌며,\n\n나의 색이 전체든 일부든 들어 있는 것들을 찾아봅니다.\n\n가까이에서, 멀리서,\n조금 위에서.\n\n아까는 지나쳤던 곳에서 나의 색이 불쑥 나타납니다.\n\n잘 보이지 않으면,\n조금 더 자세히 보세요.\n\n그 색은 그늘 속에 숨어 있기도 하고,\n\n다른 물건에 비친 빛 속에 들어 있기도 합니다.\n\n어깨 너머 뒤쪽까지 보고,\n\n천천히 가운데로,\n\n이어서 오른쪽으로,\n\n나의 색을 찾으며 끝까지 돌아봅니다.\n\n그리고 다시,\n가운데로 돌아옵니다.\n\n어떤가요.\n\n방금 이 공간이,\n온통 나의 색으로 가득하지 않았나요.\n\n여기서, 신기한 사실 하나.\n\n이 방은,\n아까와 똑같은 방입니다.\n\n색이 늘어난 것이 아닙니다.\n\n바뀐 것은 단 하나,\n나의 주의입니다.\n\n우리는 세상을 있는 대로 보는 것이 아니라,\n\n찾는 것을 봅니다.\n\n걱정을 찾는 눈에는 온 세상이 걱정거리로 보이고,\n\n고마운 것을 찾는 눈에는 온 세상에서 고마운 것이 나타납니다.\n\n방이 바뀌기를 기다릴 필요가 없습니다.\n\n찾는 것을 바꾸면,\n같은 방이 다른 방이 됩니다.\n\n숨을 코로 깊이 들이마셔 배까지 내렸다가,\n가슴으로, 목으로 올려,\n서서히 내쉽니다.\n\n편히 쉽니다.\n\n그리고 내일 아침,\n집을 나서기 전에 하루의 색을 하나 정해 보세요.\n\n어떤 날은 노랑을,\n어떤 날은 '고마운 것'을 나의 색으로 삼아도 좋습니다.\n\n정하고 나가면,\n\n신기하게도,\n\n하루 종일 그것이 보일 것입니다.","duration":"약 12분","tags":"#보기명상 #나의색 #주의훈련","series":"숨비명상"},{"id":"63f7680b","category":"관찰","title":"선택합니다 ― '해야 한다'를 내려놓는 명상","body":"편안하게 앉아,\n지그시 눈을 감습니다.\n\n숨을 깊게 들이쉬고,\n길게 내쉽니다.\n\n시작하며,\n한 문장을 건네 드립니다.\n\n죽음이 한순간이지,\n인생은 매일매일입니다.\n\n오늘도 그 매일 중의 하루입니다.\n\n그 매일을 우리는 어떻게 살고 있을까요.\n\n아침에 눈을 뜨는 순간부터,\n머릿속에 자막이 흐릅니다.\n\n해야 한다.\n\n밥을 차려야 한다.\n출근해야 한다. 참아야 한다.\n웃어야 한다. 버텨야 한다.\n\n그 자막들 가운데,\n오늘 가장 자주 흐르는 문장 하나를 붙잡아 보세요.\n\n하나면 됩니다.\n\n붙잡았다면,\n마음속으로 또박또박 말해 봅니다.\n\n나는, ○○해야 한다.\n\n그리고 몸을 살펴보세요.\n\n이 문장을 말할 때,\n몸 어디가 무거워지나요.\n\n어깨인가요, 명치인가요,\n미간인가요.\n\n'해야 한다'는 숙제의 언어라서,\n말하는 것만으로도 몸 어딘가가 짓눌립니다.\n\n그 무게를,\n잠시 그대로 느껴 봅니다.\n\n이제,\n그 일의 밑바닥으로 내려가 보겠습니다.\n\n조용히 물어봅니다.\n\n나는 이 일을,\n무엇 때문에 하고 있는가.\n\n처음에는 '어쩔 수 없으니까'라는 답이 나올 것입니다.\n\n한 번 더 내려가 봅니다.\n\n그 밑에, 무엇이 있나요.\n\n아이가 건강하게 하루를 살기를 바라는 마음.\n\n가족을 지키고 싶은 마음.\n\n더 나은 내가 되고 싶은 마음.\n\n의무의 맨 밑바닥에는,\n대개 소망이 살고 있습니다.\n\n찾았다면,\n이제 문장을 바꿔 보겠습니다.\n\n나는, ○○해야 한다,\n대신에,\n\n나는 ○○을 바라기 때문에,\n○○하기를, 선택한다.\n\n마음속으로,\n천천히 말해 봅니다.\n\n나는 아이가 건강하기를 바라기 때문에,\n아침을 차리기를 선택한다.\n\n나는 더 풍요롭게 살고 싶기 때문에,\n사람을 만나기를 선택한다.\n\n이제 다시, 몸을 살펴보세요.\n\n같은 일인데,\n무게가 조금 달라지지 않았나요.\n\n일은 그대로인데,\n그 일을 지고 가는 사람이 끌려가는 사람에서,\n걸어가는 사람으로 바뀌었기 때문입니다.\n\n그런데 혹시,\n문장을 바꿔 보아도 밑바닥에서 아무 소망도 찾아지지 않는 일이 있다면,\n\n그것도 귀한 발견입니다.\n\n그 일은 어쩌면,\n처음부터 내 것이 아니었는지도 모릅니다.\n\n그런 일은,\n내려놓기를 선택할 수도 있습니다.\n\n내려놓은 자리에는 빈 공간이 생기고,\n\n그 공간에 비로소,\n내가 정말 원하는 것이 들어올 수 있습니다.\n\n한 가지만 더,\n확인하고 가겠습니다.\n\n혹시 이런 걱정이 올라오나요.\n\n'내가 나를 챙기면, 사랑하는 사람들이 서운해하지 않을까.'\n\n가만히 뒤집어 생각해 보세요.\n\n내가 사랑하는 사람이 자기를 다 지우고 견디기만 하며 산다면,\n\n나는 그것을 바랄까요.\n\n아닐 것입니다.\n\n나를 사랑하는 사람들도 똑같습니다.\n\n그들이 기다리는 것은 나의 희생이 아니라,\n\n내가 나로,\n편안하게 살아가는 모습입니다.\n\n우리가 의무를 다하느라 애쓰는 동안,\n\n사랑하는 이는 어쩌면,\n전혀 다른 것을 기다리고 있는지도 모릅니다.\n\n숨을 깊게 들이쉬고,\n길게 내쉽니다.\n\n오늘 바꾼 문장 하나를,\n가슴에 품습니다.\n\n나는, 선택한다.\n\n준비가 되면,\n천천히 눈을 뜹니다.\n\n그리고 오늘 하루,\n두 가지만 해 보세요.\n\n하나.\n'해야 한다'는 자막이 흐를 때마다,\n한 번씩만 바꿔 말해 보기.\n\n'나는, 선택한다.'\n\n둘.\n내가 원하는 것 한 가지를,\n사랑하는 사람에게 말로 부탁해 보기.\n\n등이 가려우면,\n등을 긁어 달라고.\n\n그 사람은 어쩌면,\n내가 말해 주기를 오래 기다렸는지도 모릅니다.\n\n인생은, 매일매일입니다.\n\n그리고 오늘을 내 뜻으로 살아 본 만큼,\n\n삶은, 덜 아쉬워집니다.","duration":"약 12분","tags":"#선택명상 #해야한다내려놓기 #주체적삶","series":"숨비명상"},{"id":"d169aec9","category":"수용","title":"첫 잔― 하루의 첫 잔으로 하는 3분 차명상","body":"거창한 준비물은 필요 없습니다.\n\n믹스커피 한 잔이어도 좋고,\n티백 하나 담근 녹차여도 좋고,\n그냥 시원한 물 한 잔이어도 괜찮습니다.\n\n오늘 마시는 첫 잔이면,\n충분합니다.\n\n다만 한 가지,\n마음가짐 하나만 가져가겠습니다.\n\n지금 눈앞의 이 잔이,\n내 생의 마지막 잔이라면.\n\n그렇게 생각하는 순간,\n믹스커피 한 잔도 귀해집니다.\n\n잔을 앞에 두고,\n편안하게 앉습니다.\n\n눈을 감고,\n부드러운 숨을 두어 번 쉬면서,\n\n마음을 함께 가라앉힙니다.\n\n이제 눈을 뜨고,\n아직 손은 뻗지 말고,\n\n잔을 바라봅니다.\n\n무슨 빛깔인가요.\n어떤 모양인가요.\n\n매일 쓰던 잔이어도,\n오늘 처음 보는 것처럼.\n\n호기심 많은 아이가 된 듯,\n고개를 기울여 이쪽에서도,\n저쪽에서도 바라봅니다.\n\n이제 손을 뻗어,\n잔을 잡습니다.\n\n아,\n이 잔의 촉감이 이랬구나.\n\n온도는 이 정도였구나.\n\n딴생각이 끼어들면,\n알아차리고 흘려보내고,\n다시 손끝의 느낌으로 돌아옵니다.\n\n원한다면 잔을 귀에 대 보아도 좋습니다.\n무슨 소리가 나는지.\n지금 우리는 아이니까요.\n\n이번에는, 향입니다.\n\n코 가까이 가져와 천천히 맡아 봅니다.\n\n왼쪽 콧김에 실리는 향과 오른쪽에 실리는 향이,\n다른가요?\n\n이제 잔을 입술로 가져갑니다.\n\n아직 마시지 않습니다.\n\n입술과 잔이 닿는 그 자리의 느낌.\n\n윗입술과 아랫입술,\n닿는 온기.\n\n자,\n한 모금을 입안에 넣습니다.\n\n삼키지 말고,\n잠시 머금습니다.\n\n입안에서 무슨 일이 벌어지고 있나요.\n\n혀는 지금 무엇을 하고 있나요.\n\n맛은 어디에서 가장 진한가요.\n혀끝인가요, 안쪽인가요.\n\n왼쪽과 오른쪽의 온도는 같은가요.\n\n이제 천천히, 삼킵니다.\n\n목을 타고 내려가는 길,\n\n가슴 어디쯤을 지나가는 온기,\n\n그 길의 끝까지 따라가 봅니다.\n\n잔을 내려놓고,\n부드럽게 눈을 감습니다.\n\n한 모금이,\n이렇게 길고 이렇게 컸습니다.\n\n그리고 잠시,\n이 한 모금이 어디서 왔는지 떠올려 봅니다.\n\n어느 밭의 볕과 어느 하늘의 비가,\n얼마나 많은 손을 거쳐,\n\n오늘 아침 내 책상 위까지 왔을까요.\n\n마지막 잔처럼 마시면,\n한 모금 안에서 이렇게 많은 것이 보입니다.\n\n숨을 세 번, 깊이 쉬고,\n\n부드럽게 눈을 뜹니다.\n\n이제 남은 차는 편하게 드세요.\n\n그리고 살다가,\n이 살아 있는 느낌으로 돌아오고 싶어지면,\n\n방법은 간단합니다.\n\n그날의 첫 잔을,\n마지막 잔처럼,\n\n정성스럽게 한 모금.","duration":"약 7분","tags":"#첫잔 #차명상 #일상명상","series":"숨비명상"},{"id":"14cd1b7e","category":"용서감사","title":"자애명상-KJS","body":"지금부터 자애명상으로 들어가는 준비 과정으로 용서의 마음을 먼저 일으켜보겠습니다.\n\n용서의 마음은 지금까지 내가 살아오면서 남들에게 잘못한 일이 있다면 용서를 구하고,\n또 다른 사람들이 나에게 잘못한 일이 있다면 용서를 해주는 두 가지 방향으로 용서의 마음을 일으킵니다.\n\n특별한 대상을 생각하지 마시고 내가 알게 모르게 지은 잘못이나,\n또 남들이 나에게 알게 모르게 지은 잘못을 용서를 해준다는 마음으로 일으킵니다.\n\n용서의 마음을 먼저 일으키는 이유는 명상에 들어가기 위한 준비 과정이면서 명상을 잘 하기 위한 예비적인 수련이라고 이해하시면 됩니다.\n\n제가 말씀드리는 용서의 문구를 들으시면서 그 의미를 음미하면서 용서의 마음을 일으켜보십시오.\n\n\"만일 내가 다른 사람에게 몸으로 입으로 생각으로 잘못을 행했다면 내가 평화롭고 행복하게 살 수 있도록 용서받기를 원합니다.\"\n\n\"또한 누군가가 나에게 몸으로 입으로 생각으로 잘못을 행했다면, 그들이 평화롭고 행복하게 살 수 있도록 나는 용서합니다.\"\n\n짧게는 다음과 같이 할 수도 있습니다.\n\"내가 남에게 한 잘못의 용서를 구합니다.\" \"남들이 나에게 한 잘못을 용서합니다.\"\n\n이렇게 매번 명상을 하기 전에 용서의 마음을 일으키는 것은 명상이 보다 더 안정적인 토대에 위에서 진행되도록 돕는 일을 합니다.\n용서는 한 번에 끝나는 일이 아니라 나 자신을 위해서,\n내 자신이 스스로 자책감과 적개심,\n증오심에서 벗어나도록 도와주는 나를 위한 선택이다라고 이해하고 용서의 마음을 일으켜 봅니다.\n\n다음에는 나 자신을 향한 자애의 마음을 일으켜봅니다.\n명상은 나를 돌보는 일입니다.\n그중에 자애명상은 내 안에 분노와 적개심을 가라앉히고 기쁨과 행복과 안정을 불러일으키고 타인과의 관계를 향상시켜주는 효과들이 있습니다.\n\n그러기 위해서 먼저 내가 나를 위해서 일으키는 따뜻하고 친절한 마음으로서 자신을 향한 자애명상을 먼저 합니다.\n\n잠시 생각을 해 봅니다.\n이 세상에서 과연 나에게 가장 소중하고 사랑스러운 존재가 있다면 누구인가?\n부모님이 될 수도 있고,\n자녀분이 될 수도 있고,\n또 아주 친한 친구가 될 수도 있겠지만 깊이 생각해 보면 그들이 소중하고 사랑스러운 그 바탕에는 내 자신이 나에게 소중하고 사랑스럽다는 피할 수 없는 그러한 진실이 있습니다.\n내가 나에게 소중하고 사랑스러운 존재라는 것을 깊이 생각을 해 보시고 정말 그렇다면은 그 소중하고 사랑스러운 나를 위해서 내가 할 수 있는 가장 큰 선물을 나에게 주겠다는 마음으로 자신을 향한 자애의 마음을 일으킵니다.\n자애명상은 자애 문구를 도구로 해서 마음 속에서 자애심을 길러내는 명상이라고 이해하시면서 제가 말씀드리는 문구를 들으시면서 마음 속으로 반복해 봅니다.\n\n내 자신이 행복하고 평화롭기를\n안전하고 자유롭기를\n괴로움과 슬픔에서 벗어나기를\n\n문구가 좀 길어서 혼동이 되시면,\n짧게 줄여 하셔도 좋습니다.\n\n행복하고 평화롭기를\n괴로움과 슬픔에서 벗어나기를\n\n주문은 나 자신을 붙여서\n마음속으로 자애 문구를 음미하면서 반복합니다\n\n내 자신이 행복하고 평화롭기를\n괴로움과 슬픔에서 벗어나기를\n\n자신을 향한 자애명상은 짧으면 2-3분,\n길면 5분 10분 할 수 있습니다.\n일상에서도 자주 하실 수도 있고 언제든지 할 수 있습니다.\n우리가 좌선하면서 하는 자애명상으로 자기를 향한 자연명상을 할 때는 시간을 어느 정도 정해서 2-3분에서 5-10분 그렇게 해 주시고 그 다음 단계로는 대상을 선정해서 하는 자애명상으로 들어갑니다.\n\n그 첫 번째 대상은 고맙거나 존경하는 분을 향한 자애명상입니다.\n마음속으로 내 인생에서 정말 고마웠던 분,\n존경하는 분,\n또 큰 은혜를 베풀어주신 은인을 떠올려봅니다.\n\n살아 있는 것이 확실한 분을 떠올립니다.\n돌아가셨다거나,\n생사가 불분명한 분들은 제외하시고 분명히 살아 있음이 확인될 수 있는 그런 분을 선택을 합니다.\n\n이성으로 생각되는 대상은 선택하지 않습니다.\n이성을 향한 자애명상이 애욕을 이를 불러일으킬 수 있는 함정이 있기 때문에 조심한다고 이해하시고 이성으로 생각되는 대상은 제외하고 시도해 보십시오.\n\n먼저 고맙거나 존경하는 분을 선택해 봅니다.\n그분이 나에게 해줬던 그 고마운 일 또는 존경스러운 면을 마음으로 깊이 떠올려보고 상기해 봅니다.\n그리고 그분을 향해서 조건없고 한결없는 자애의 마음을 일으킵니다.\n얼굴 모습이 잘 떠오르지 않으면 문구만 가지고 하셔도 좋고 자연스럽게 얼굴 모습이 떠오르면 얼굴 모습을 마주하고 하셔도 좋습니다.\n\n일부러 이미지를 떠올리려고 애쓰지 마십시오.\n이제 저는 스승님을 예를 들어 문구를 말씀드릴 테니까 각자 선택한 분의 호칭이나 명칭을 주어로 문구를 통해서 자애심을 일으켜봅니다.\n\n스승님께서 행복하고 평화롭기를\n괴로움과 슬픔에서 벗어나기를\n스승님께서 행복하고 평화롭기를\n괴로움과 슬픔에서 벗어나기를\n\n여기에 두 문구를 더 넣어서 다음과 같이 할 수도 있습니다.\n\n스승님께서 행복하고 평화롭기를\n안전하고 자유롭기를\n괴로움과 슬픔에서 벗어나기를\n\n이 문구를 마음속으로 그 의미를 깊이 음미하면서 정말로 고마운 분,\n존경하는 분들이 행복해지기를 바라는 마음,\n고통이 없기를 바라는 마음을 담아서 계속 반복해서 일으켜봅니다.\n이렇게 해도 별로 느낌이 없으면 다음과 같이 강조하는 부사나 동사를 넣어서 완성시켜서 문장으로 해도 좋습니다.\n\n스승님께서 진정으로 행복하고 평화롭기를 안전하고 자유롭기를 괴로움과 슬픔에서 벗어나기를 바랍니다.\n\n도중에 다른 생각이 떠오르면 빨리 알아차리고 다시 자애의 문구로 그 생각을 대체해 가면서 자애를 일으킵니다.\n처음에는 익숙하지 않지만 점점 이 문구를 통해서 자애심을 일으켜나가면 자애에 좋은 느낌들이 일어납니다.\n몸에서 전율이 느껴지거나 안정감이 생기거나,\n기쁘거나,\n행복감들이 생깁니다.\n그러면 자애명상을 잘하고 있는 것입니다.\n그 대상을 향해 계속 최소한 5분-10분간 계속 문구를 통한 자애심을 일으켜 나갑니다.\n\n5분 - 10분 동안 열심히 했는데 아무런 느낌이 없다면 다시 한 번 내가 선택한 분의 고마운 면,\n존경하는 면을 떠올리고 난 다음 똑같은 방식으로 한 번 더 5분을 더 해 줍니다.\n\n스승님께서 행복하고 평화롭기를\n안전하고 자유롭기를\n괴로움과 슬픔에서 벗어나기를\n\n이렇게 한 대상을 향해 10분 - 20분 지속적으로 합니다.\n이제 공부 마치시고 각자 처소로 돌아가시면 이 연습을 매일 매일 최소한 한 20 - 30분씩 해보시기 바랍니다.\n이렇게 한정된 대상을 향한 자애영상을 최소한 10분 - 20분 한 다음에 그 다음에 모든 살아있는 생명을 향한 자애의 마음을 일으켜 봅니다.\n\n대상을 한정시키지 않는 것입니다.\n눈에 보이거나 보이지 않거나,\n멀리 있거나 가까이 있거나,\n작거나 크거나 온 우주에 존재하는 모든 생명들을 향해 불교식으로 얘기하면 육도에 윤회하는 모든 중생들을 향해서 지역에서 유정천,\n저 천상의 꼭대기에 이르기까지의 모든 존재들을 향해서 한량 없는 조건 없는 자애마음을 일으켜 봅니다.\n\n그들도 나처럼 자신에게 소중하고 사랑스러운 존재들이다.\n그들도 자신의 행복을 바라고 고통이 없기를 바란다고 생각한 다음에 내 가슴에서 조건 없이 그들을 위한 자의 마음을 일으켜보리라고 하면서 연습을 합니다.\n자애문구는 다음과 같이 모든 존재를 주어로 해봅니다.\n\n모든 존재들이 행복하고 평화롭기를\n괴로움과 슬픔에서 벗어나기를\n\n문구를 좀 더 넣어가지고 다음과 같이 할 수도 있습니다.\n\n모든 존재들이 행복하고 평화롭기를\n안전하고 자유롭기를\n괴로움과 슬픔에서 벗어나기를\n\n또는 강조하는 문구를 넣고 동사를 넣어서 다음과 같이 할 수도 있습니다.\n문구는 자유롭게 선택하셔도 좋습니다.\n\n모든 존재들이 진정으로 행복하고 평화롭기를 안전하고 자유롭기를 바랍니다 괴로움과 슬픔에서 벗어나기를 바랍니다.","duration":"","tags":"자애명상, 연민, 용서","series":"숨비명상"},{"id":"c89720ca","category":"관찰","title":"들고, 놓고― 걷기 명상 기초 연습","body":"먼저,\n스무 걸음이나 서른 걸음쯤 곧게 걸을 수 있는 자리를 하나 정합니다.\n\n복도여도 좋고, 거실이어도,\n마당이어도 좋습니다.\n\n오늘은 이 한 자리에서만 왔다 갔다 할 것입니다.\n자리를 자주 바꾸면,\n마음도 따라 흩어지니까요.\n\n그리고 미리 말해 두겠습니다.\n\n오늘의 걷기는 평소보다 훨씬 느릴 것입니다.\n\n일상에서 늘 이렇게 걷자는 것이 아닙니다.\n\n평생 자동으로 해 온 걸음에,\n오늘 하루 현미경을 대 보는 연습입니다.\n\n자,\n걷기는 서 있기에서 시작합니다.\n\n출발점에 가만히 서 보세요.\n\n시선은 약간 아래로,\n두 팔은 편안하게 늘어뜨리고,\n발은 어깨너비쯤.\n\n발바닥과 바닥이 닿아 있는 면을 느껴 봅니다.\n\n신발을 신었든 벗었든,\n땅과 맞닿은 그 접촉을.\n\n서 있는 몸 전체도 한번 훑어봅니다.\n\n옷이 어깨를 스치는 느낌,\n다리에 은근히 들어가 있는 힘,\n바깥이라면 스쳐 가는 바람까지.\n\n서 있는 것만으로도,\n이렇게 많은 일이 일어나고 있었습니다.\n\n이제,\n걷기 전에 무게부터 옮겨 보겠습니다.\n\n몸무게를 아주 천천히,\n왼발 쪽으로 옮겨 보세요.\n\n왼쪽 다리는 힘이 들어가며 무거워지고,\n\n오른쪽 다리는 가벼워지면서 무릎이 살짝 구부러지려 합니다.\n\n오른발 뒤꿈치를 바닥에서 살며시 떼어 봅니다.\n\n이번에는 반대로,\n무게를 오른쪽으로.\n\n몸은 평생 이 정교한 일을 해 왔는데,\n\n우리는 오늘,\n처음 구경하고 있습니다.\n\n자, 첫걸음입니다.\n\n멀리 갈 것 없습니다.\n왼발을 앞으로, 한 뼘만.\n\n발이 들리는 것,\n\n허공을 건너는 것,\n\n바닥에 놓이는 것.\n\n마음속으로 이름을 붙여도 좋습니다.\n\n들고,\n\n놓고.\n\n이제 오른발.\n\n들고,\n\n놓고.\n\n무게가 발에서 발로 건너가는 것을 느끼며,\n\n느린 춤을 추듯, 한 걸음,\n한 걸음.\n\n들고,\n\n놓고.\n\n걷는 동안 마음은 자꾸 딴 데로 갈 것입니다.\n\n생각에 빠져 몇 걸음을 그냥 지나쳤다면,\n\n알아차린 그 자리에서,\n다시 발로 돌아오면 됩니다.\n\n들고,\n\n놓고.\n\n스무 걸음쯤 가서 끝에 닿으면,\n\n멈추어 서서,\n다시 중심을 잡습니다.\n\n돌아설 때도 서두르지 않습니다.\n\n돌아서는 발도, 들고, 놓고.\n\n그리고 반대 방향으로,\n같은 걸음을 이어 갑니다.\n\n걷다가 문득 보고 싶은 것이 눈에 들어오면,\n\n멈추어 서서 보아도 됩니다.\n\n다만 그때도,\n'본다, 본다' 하고 알아차리면서.\n\n다 보았으면,\n다시 발로 돌아옵니다.\n\n속도는 정답이 없습니다.\n\n너무 느려서 졸음이 오면 조금 빠르게,\n\n마음이 흩어지면 조금 느리게.\n\n지금의 내가 가장 잘 지켜볼 수 있는 나의 속도면 됩니다.\n\n몇 차례 더,\n말없이 왕복해 봅니다.\n\n들고,\n\n놓고.\n\n이제 제자리에 멈추어 섭니다.\n\n가만히 보면,\n오늘 우리는 스무 걸음을 갔다가,\n다시 제자리로 돌아오기만 했습니다.\n\n어디에도 도착하지 않았습니다.\n\n그런데도 이 시간이 헛되지 않은 이유는,\n\n걷기의 목적이 어디로 가는 것이 아니라,\n\n지금 있는 자리에 온전히 있는 것이었기 때문입니다.\n\n그것이,\n이 왕복이 가르쳐 주는 명상의 본질입니다.\n\n이 연습은 마음이 유난히 산만한 날,\n의욕이 넘쳐 붕 뜨는 날에 특히 좋습니다.\n\n그런 날에는,\n복도 스무 걸음이면 충분합니다.\n\n들고,\n\n놓고.\n\n발이 기억하고 있을 것입니다.","duration":"약 15분","tags":"#걷기명상 #들고놓고 #기초연습","series":"숨비명상"},{"id":"427e7e56","category":"관찰","title":"늘보명상-느리게 걷기","body":"늘보명상을 시작합니다.\n평소에 1분이면 걸을 수 있는 거리를 염두에 두고 출발선에 섭니다.\n지금부터 10분 동안 10걸음만 걷겠습니다.\n\n서 있는 상태로 크게 쉼 호흡하며 날숨이 발까지 내려간다고 상상합니다.\n발과 손끝으로 작용하는 중력을 느껴봅니다.\n\n발의 묵직한 느낌,\n손끝에서 느껴지는 미세한 감각,\n그대로 머물고 싶은 마음 있는 그대로 느낌을 알아차려 봅니다.\n\n두 손은 뒷짐을 지거나 앞에 모은 채 어떤 발을 먼저 뗄 지 마음으로 정합니다.\n그리고 실제로 발을 뗄 때까지 일어나는 모든 몸,\n마음의 작용을 세심하게 관찰해 봅니다.\n\n무게중심이 바뀌며 왼쪽 오른쪽 다리와 몸에서 느껴지는 변화 발걸음을 뗄 때 일어나는 마음,\n기꺼이 나아가고 싶은지,\n머물고 싶은 저항이 있는지,\n모든 것을 낱낱이 알아차려 봅니다.\n\n발끝이 땅에서 떨어질 때 일어나는 느낌 발을 밀어 나아갈 때 일어나는 몸의 변화 발이 처음 땅에 닿을 때의 감각,\n발이 완전히 안정적으로 닿을 때까지 일어나는 몸 마음의 느낌을 세세하게 관찰해 봅니다.\n\n다시 반대편 발을 떼면서 섬세한 느낌들을 있는 그대로 느끼며 걸음을 옮겨 봅니다.\n미세한 감각을 모두 알아차리며 할 수 있는 한 느리게 걸어 보겠습니다.\n마음으로 달팽이의 움직임을 떠올리며 걸어도 좋습니다.\n느리게 걸을 때도 몸에 힘을 빼고 미소를 짓고 걷습니다.\n\n이제 가슴의 호흡으로 주의를 옮겨 옵니다.\n들숨과 날숨,\n한 호흡에 한 발자국을 옮겨 봅니다.\n들숨에 발을 들고 날숨에 내려 놓습니다.\n날숨에 발이 바닥에 닿을 때 속으로 말합니다.\n도착했다.\n그리고 나의 의식을 온전히 지금 여기로 가져옵니다.\n의식이 백퍼센트 지금 여기로 도착할 때 까지 걸음을 떼지 않고 호흡을 반복합니다.\n\n온전히 지금 여기에 도착했다고 느껴질 때 다시 들숨에 발을 들고 날숨에 내려놓습니다.\n날숨에 발이 바닥에 닿을 때 속으로 말합니다.\n집에 왔다.\n\n한 호흡에 한 걸음과 의식이 지금 여기로 완전히 도착하면 옮기는 걸음을 이어가 보겠습니다.\n\n바쁘고 조급해서 정신을 못 차릴 때 빨리 한꺼번에 많이 하려는 생각이 잘못된 방향임을 자각합니다.\n멈추어 서서 이 순간에 의식이 따라오도록 기다릴 때 상황이 단순해진다는 것을 기억합니다.\n나의 의식이 지금 여기로 온전히 도착할 때 다음 행위를 하는 새로운 습관을 바로 지금부터 시작하겠다고 마음으로 선언해 봅니다.\n\n오직 지금 이 순간에 머물 때만이 진정으로 살아있는 순간임을 기억합니다.","duration":"약 12분","tags":"느리게걷기,늘보명상","series":"숨비명상"},{"id":"037a71fd","category":"용서감사","title":"감사의 온기","body":"지금부터 잠시,\n하루의 걸음을 멈추고 나에게 고마움을 전하는 시간을 가져 보겠습니다.\n편안한 자리에 앉거나,\n원한다면 그대로 누워도 좋습니다.\n어깨의 힘을 살며시 내려놓고,\n준비가 되면 천천히 눈을 감아 보세요.\n\n몸 어딘가에 아직 긴장이 남아 있어도 괜찮습니다.\n마음이 조금 분주해도 괜찮습니다.\n지금 이 모습 그대로,\n우리는 시작할 수 있습니다.\n\n이제 코로 천천히 숨을 들이쉬어 보세요.\n신선한 공기가 가슴을 지나 배 깊은 곳까지 내려오는 것을 느껴 봅니다.\n그리고 입으로 길게 내쉬면서,\n오늘 하루 어깨에 얹혀 있던 무게를 조금씩 내려놓습니다.\n\n한 번 더 들이쉬고,\n길게 내쉽니다.\n숨을 내쉴 때마다 몸이 조금씩 무거워지고,\n바닥이 나를 든든하게 받쳐 주는 것이 느껴집니다.\n이제는 애쓰지 않아도 됩니다.\n숨은 저 혼자서도 잘 드나들고 있습니다.\n\n그 숨결을 따라,\n가슴 한가운데로 주의를 옮겨 봅니다.\n그곳에서 심장이 조용히 뛰고 있습니다.\n손을 가슴 위에 살며시 얹어 보아도 좋습니다.\n손바닥 아래에서 토닥, 토닥,\n작은 울림이 전해집니다.\n\n이 심장은 내가 잠든 밤에도,\n내가 잊고 지낸 모든 순간에도,\n단 한 번 쉬지 않고 나를 위해 뛰어 왔습니다.\n아무런 대가도 바라지 않고,\n오늘도 이렇게 성실하게 일하고 있습니다.\n그 고요한 성실함을 가만히 느껴 봅니다.\n\n마음속으로 조용히 말을 건네 봅니다.\n고마워. 오늘도 애써 줘서,\n고마워.\n\n이제 두 손으로 주의를 옮깁니다.\n손바닥과 손가락 끝의 감각을 하나하나 느껴 봅니다.\n따뜻한지, 서늘한지,\n조금 저릿한지.\n어떤 느낌이든 그대로 좋습니다.\n\n이 손은 오늘 하루에도 많은 일을 해냈습니다.\n아침에 이불을 걷고,\n문을 열고, 밥을 뜨고,\n누군가에게 인사를 건넸습니다.\n너무 당연해서 한 번도 고맙다고 말해 본 적 없는 일들입니다.\n\n그 손에게도 마음을 전해 봅니다.\n고마워.\n오늘도 나를 도와줘서,\n고마워.\n어쩌면 손끝이 조금 따뜻해지는 것을 느낄지도 모릅니다.\n느껴지지 않아도 괜찮습니다.\n\n이제 그 손을 무릎 위에 편안히 내려놓고,\n마음속에 한 장면을 초대해 봅니다.\n누군가 나를 위해 마음을 내어 주었던 순간입니다.\n\n어쩌면 비 오는 날,\n내 어깨가 젖지 않도록 내 쪽으로 기울어 있던 우산일 수도 있습니다.\n어쩌면 지친 저녁,\n나를 위해 차려진 따뜻한 밥 한 그릇일 수도 있습니다.\n떠오르는 장면이 있다면,\n그 하나에 천천히 머물러 봅니다.\n\n그 장면 속으로 조금 더 가까이 들어가 봅니다.\n그때 들리던 소리가 있나요.\n토닥토닥 내리던 빗소리,\n달그락거리던 그릇 소리,\n나를 부르던 목소리.\n그때의 온도는 어땠나요.\n우산 속의 아늑함,\n김이 모락모락 오르던 밥의 온기.\n\n그 순간,\n나는 혼자가 아니었습니다.\n누군가 나를 생각하고 있었습니다.\n그 마음이 지금,\n가슴 한가운데에 작은 온기로 다시 피어납니다.\n\n그 온기가 숨을 쉴 때마다 조금씩 번져 갑니다.\n가슴에서 어깨로,\n팔을 지나 손끝까지.\n배를 지나 다리로, 발끝까지.\n따뜻한 물에 몸을 담근 듯,\n온몸이 은은한 고마움으로 채워집니다.\n\n그 사람의 얼굴을 떠올리며,\n마음속으로 인사를 전합니다.\n고맙습니다. 그때,\n정말 고마웠습니다.\n\n그리고 이 말을 조용히 덧붙여 봅니다.\n당신도 나처럼,\n따뜻한 하루를 보내기를.\n\n이렇게 고마움을 건네고 나면,\n신기하게도 내 마음이 먼저 넉넉해집니다.\n나는 받을 줄도 알고,\n건넬 줄도 아는 사람입니다.\n그 넉넉한 마음을 가슴에 가만히 담아 둡니다.\n\n이제 이 온기를 간직한 채,\n천천히 돌아올 준비를 합니다.\n코끝을 지나는 숨의 감촉을 다시 느껴 봅니다.\n몸이 닿아 있는 바닥의 든든함도 느껴 봅니다.\n\n손가락과 발가락을 꼼지락꼼지락 움직여 봅니다.\n어깨를 살짝 들썩여 보고,\n목도 부드럽게 돌려 봅니다.\n준비가 되면,\n아주 천천히 눈을 떠 보세요.\n\n가슴에 남은 이 온기는 사라지지 않습니다.\n언제든 잠시 멈추어 숨을 고르면,\n오늘처럼 다시 만날 수 있습니다.\n이 따뜻함과 함께,\n남은 하루도 편안하시기를 바랍니다.","duration":"약 10분","tags":"#감사명상 #유도명상 #따뜻한위로","series":"숨비명상"},{"id":"78b9bd4e","category":"용서감사","title":"하루의 선물","body":"오늘 하루,\n마음속에 무거운 생각이 많이 지나갔을지도 모릅니다.\n불안한 생각, 서운한 생각,\n나를 탓하는 생각.\n그랬어도 괜찮습니다.\n누구의 마음이나 그렇습니다.\n\n지금부터는 그 생각들을 잠시 내려놓고,\n오늘 하루에 숨어 있던 작은 선물들을 찾아보는 시간을 가져 보겠습니다.\n\n편안한 자리에 앉거나 누워 보세요.\n이불 속이라면 그대로도 좋습니다.\n몸을 한 번 뒤척여 가장 편안한 자세를 찾아봅니다.\n준비가 되면 살며시 눈을 감습니다.\n\n코로 천천히 숨을 들이쉽니다.\n서늘하고 신선한 공기가 가슴 가득 들어옵니다.\n그리고 길게 내쉬면서,\n하루 동안 붙들고 있던 생각들을 숨결에 실어 내보냅니다.\n\n한 번 더 들이쉬고,\n길게 내쉽니다.\n내쉴 때마다 이불이 조금 더 포근해지고,\n몸이 조금 더 가라앉습니다.\n\n이제 마음속에 오늘 하루를 담은 사진첩이 있다고 상상해 봅니다.\n표지를 천천히 넘기면,\n오늘 아침부터의 장면들이 한 장씩 나타납니다.\n\n서두르지 않고, 한 장,\n한 장 넘겨 봅니다.\n바쁘게 지나쳐서 미처 보지 못했던 장면들이 이제야 눈에 들어옵니다.\n\n그중에서 작지만 고마웠던 순간 하나를 찾아봅니다.\n어쩌면 아침에 마신 따뜻한 커피 한 잔일지도 모릅니다.\n두 손을 감싸던 잔의 온기,\n코끝에 번지던 향.\n그 순간에 잠시 머물러 봅니다.\n\n한 장을 더 넘겨 봅니다.\n또 하나의 고마운 장면을 찾아봅니다.\n문득 올려다본 맑은 하늘,\n길가에 피어 있던 꽃 한 송이,\n누군가 건넨 짧은 인사.\n아주 작아도 좋습니다.\n그 장면에도 잠시 머물러 봅니다.\n\n찾기 어려워도 괜찮습니다.\n지금 이렇게 숨 쉬고 있는 것,\n오늘 하루를 지나 여기까지 온 것.\n그것만으로도 충분한 한 장입니다.\n\n이제 사진첩의 마지막 장을 넘깁니다.\n그곳에는 오늘 하루를 살아 낸 내가 있습니다.\n잘한 일도 있고,\n아쉬운 일도 있었을 것입니다.\n그래도 포기하지 않고 하루를 끝까지 걸어온 사람입니다.\n\n그런 나에게 마음속으로 말을 건네 봅니다.\n오늘도 애썼어. 고마워.\n\n그 말이 가슴에 닿으면,\n가슴 한가운데가 조금 따뜻해지는 것을 느낄지도 모릅니다.\n그 온기가 숨을 쉴 때마다 온몸으로 은은하게 번져 갑니다.\n\n신기하게도,\n고마운 것을 하나씩 찾다 보면 내 하루가 생각보다 많은 선물로 채워져 있었다는 것을 알게 됩니다.\n무거운 생각들 사이에서도 선물은 언제나 그 자리에 있었습니다.\n\n이 따뜻한 마음을 안고,\n천천히 돌아올 준비를 합니다.\n손끝과 발끝의 감각을 느껴 봅니다.\n몸을 감싸고 있는 이불의 포근함도 느껴 봅니다.\n\n이대로 잠들어도 좋습니다.\n혹시 눈을 뜬다면,\n머리맡의 다이어리에 오늘 찾은 선물들을 한 줄씩 적어 보아도 좋습니다.\n글로 적는 순간,\n그 고마움은 더 오래 내 곁에 머물러 줍니다.\n\n오늘 밤,\n감사한 마음과 함께 깊고 편안한 잠에 들기를 바랍니다.","duration":"약 8분","tags":"#감사일기 #잠들기전명상 #유도명상","series":"숨비명상"},{"id":"5081f529","category":"관찰","title":"가만히 보기","body":"오늘은 아주 간단한 것을 해 보려 합니다.\n눈앞의 물건 하나를 가만히 바라보는 일입니다.\n\n식탁이나 책상 앞에 편안히 앉아 보세요.\n그리고 앞에 작은 물건을 하나 놓습니다.\n늘 쓰던 머그잔도 좋고,\n유리잔이나 소금통도 좋습니다.\n손에 익어서 한 번도 자세히 본 적 없는 물건이면 더 좋습니다.\n\n자세를 편안하게 하고,\n어깨의 힘을 살며시 내려놓습니다.\n이번에는 눈을 뜬 채로 시작합니다.\n\n이제 앞에 놓인 물건을 처음 보는 것처럼 바라봅니다.\n만지지 않고,\n자리를 옮기지도 않고,\n다만 눈으로만 천천히 살펴봅니다.\n\n색은 어떤가요.\n한 가지 색인 것 같아도,\n빛을 받는 곳과 그늘진 곳의 색이 조금씩 다를 것입니다.\n\n윤곽을 따라 시선을 천천히 옮겨 봅니다.\n둥근 곡선, 반짝이는 부분,\n작은 흠집이나 무늬. 좋다,\n나쁘다 판단하지 않고,\n보이는 그대로 바라봅니다.\n\n바라보는 동안 다른 생각이 떠오를 수 있습니다.\n할 일이 생각나고,\n아까의 대화가 떠오를 수 있습니다.\n괜찮습니다. 생각이 왔구나,\n하고 알아차린 뒤,\n다시 눈앞의 물건으로 시선을 데려오면 됩니다.\n\n이렇게 한 가지를 가만히 보고 있으면,\n분주하던 마음이 조금씩 한자리에 모입니다.\n\n이제 천천히 눈을 감습니다.\n시선이 하던 일을 이번에는 몸의 감각이 이어받습니다.\n\n옷이 피부에 닿아 있는 느낌을 찾아봅니다.\n어깨에 얹힌 옷의 무게,\n소매가 팔에 스치는 감촉.\n\n이번에는 아래쪽으로 내려가,\n의자에 닿아 있는 몸의 무게를 느껴 봅니다.\n바닥을 딛고 있는 발바닥도 느껴 봅니다.\n내 몸이 지금 여기에 든든히 앉아 있습니다.\n\n이제 귀를 열어 봅니다.\n들리는 소리에 잠시 마음을 기울입니다.\n나의 숨소리,\n멀리서 들리는 자동차 소리,\n어딘가의 말소리.\n어떤 소리든 좋습니다.\n쫓아가지 않고,\n찾아오는 소리를 그저 맞이합니다.\n\n소리는 저절로 왔다가 저절로 사라집니다.\n그 오고 감을 가만히 지켜봅니다.\n\n이제 지금의 마음을 한 번 살펴봅니다.\n방금 전보다 조금 고요해졌을 수도 있고,\n그대로일 수도 있습니다.\n어느 쪽이든 괜찮습니다.\n잠시 멈추어 보고, 느끼고,\n들었다는 것만으로 마음은 이미 짧은 휴식을 다녀왔습니다.\n\n준비가 되면 천천히 눈을 뜹니다.\n눈앞의 물건이 아까와 조금 다르게 보일지도 모릅니다.\n\n이 짧은 쉼은 언제 어디서나 꺼내 쓸 수 있습니다.\n마음이 복잡해질 때,\n눈앞의 작은 물건 하나를 가만히 바라보는 것.\n그것으로 충분합니다.","duration":"약 7분","tags":"#마음챙김 #관찰명상 #오감명상","series":"숨비명상"},{"id":"6fa34020","category":"자비희사","title":"당신은 나의 부처님 — 발을 씻어 주는 시간","body":"프로그램 가운데 참가자들이 가장 오래 기억하는 활동이 하나 있다.\n이름은 '당신은 나의 부처님'.\n거창하게 들리지만 하는 일은 단순하다.\n마주 앉아 서로의 발을 씻어 주는 것이다.\n대야에 따뜻한 물을 받아 오고,\n상대의 발을 무릎 위로 가만히 올려 씻긴 뒤,\n수건으로 물기를 닦아 준다.\n그것이 전부다.\n\n이 활동을 처음 안내하면 방 안의 공기가 순식간에 굳는다.\n특히 사춘기 아이들과 부모가 함께한 자리에서는 더 그렇다.\n아이들은 몸을 뒤로 빼며 얼굴을 찌푸린다.\n징그럽다, 어색하다,\n왜 이런 걸 하느냐는 표정이 역력하다.\n부모들도 어쩔 줄 몰라 한다.\n남 앞에서 발을 내놓는 것도,\n자식 앞에서 발을 내미는 것도 살면서 해 본 적이 없는 일이다.\n발은 우리 몸에서 가장 낮은 곳,\n가장 감추어 두는 곳이다.\n그 발을 서로 꺼내 보이라니,\n마음이 움츠러드는 것이 오히려 자연스럽다.\n\n그런데 신기한 일이 벌어진다.\n이 활동을 딱 한 번 하고 나면 방 안의 분위기가 확 달라진다.\n굳어 있던 얼굴이 풀리고,\n웃음이 터지고,\n어떤 자리에서는 조용한 울음이 번진다.\n어색함이 사라진 자리에 무언가 따뜻한 것이 들어와 앉는다.\n이 변화는 매번 놀랍고,\n매번 같다.\n\n왜 그럴까.\n발을 씻어 주는 아이의 손이 멈추는 순간을 보면 답이 보인다.\n아이는 아빠의 발을 처음으로 자세히 본다.\n생각해 보면 당연하다.\n우리는 가족의 얼굴은 매일 보지만,\n발을 유심히 들여다보거나 만져 본 기억은 거의 없다.\n그렇게 처음 마주한 아빠의 발은 예상보다 훨씬 거칠다.\n뒤꿈치는 갈라져 있고,\n발가락은 굽어 있고,\n어딘가에는 굳은살이 박여 있다.\n아이는 그 못생긴 발을 손바닥으로 감싼 채 잠시 말을 잃는다.\n\n그 발이 왜 그렇게 되었는지,\n아이는 그 순간에 안다.\n누가 설명해 주지 않아도 손끝으로 안다.\n가족을 먹이고 입히느라 이리 뛰고 저리 뛰며 살아온 시간이 그 발에 고스란히 새겨져 있기 때문이다.\n아빠는 한 번도 그 이야기를 입 밖에 낸 적이 없다.\n그러나 발은 말없이 그 모든 세월을 증언한다.\n아이의 손이 그 거친 발을 쓰다듬는 동안,\n아이의 마음에서 오래 닫혀 있던 문이 조용히 열리기 시작한다.\n말로는 좀처럼 열리지 않던 문이,\n물 한 대야와 손바닥의 온기로 열린다.\n\n이 활동의 이름이 '당신은 나의 부처님'인 까닭도 여기 있다.\n부처님이라는 말에 종교적 무게를 실을 필요는 없다.\n그것은 다만,\n지금 내 앞에 앉은 이 사람이 나에게 가장 귀한 존재라는 뜻이다.\n그 귀한 사람의 가장 낮은 곳을 두 손으로 받쳐 든다는 뜻이다.\n우리는 소중한 사람을 우러러본다고 말하지만,\n정작 그 사람의 발밑을 들여다본 적은 없다.\n발을 씻어 주는 일은 시선을 가장 낮은 곳으로 내리는 일이다.\n그리고 그렇게 시선을 낮추었을 때,\n비로소 상대가 걸어온 길이 보인다.\n\n돌이켜 보면 이 활동에는 늘봄명상이 내내 이야기해 온 것들이 다 들어 있다.\n판단을 내려놓고 지금 손에 닿는 감각에 머무는 것.\n익숙해서 보이지 않던 것을 처음 보듯 바라보는 것.\n그리고 그 바라봄 끝에 저절로 차오르는 고마움.\n아이들은 마음챙김이 무엇인지 배우지 않았지만,\n아빠의 발을 씻는 십 분 동안 그것을 몸으로 겪는다.\n배운 것은 잊히지만 겪은 것은 남는다.\n그래서 이 활동을 한 아이들은 몇 해가 지나도 그날의 물 온도와 발의 감촉을 기억한다.\n\n집에서도 할 수 있다.\n특별한 준비는 필요 없다.\n따뜻한 물 한 대야와 수건 한 장,\n그리고 어색함을 견딜 아주 약간의 용기면 된다.\n처음에는 서로 웃음이 나고 몸이 뒤로 빠질 것이다.\n괜찮다.\n그 어색함까지가 이 시간의 일부다.\n발을 무릎에 올리고,\n물을 끼얹고,\n천천히 씻기다 보면 어느 순간 손이 멈추는 때가 온다.\n그때 굳이 무슨 말을 하지 않아도 된다.\n손이 이미 다 말하고 있다.","duration":"20분","tags":"세족식,관계","series":"표현명상"},{"id":"244772a9","category":"자비희사","title":"나비의 두드림","body":"오늘은 두 손으로 나를 안아 주는 시간을 가져 보겠습니다.\n어깨를 토닥이며 마음에 안전한 자리를 하나 만들어 두는 연습입니다.\n\n편안하게 앉아 주세요.\n등을 등받이에 살며시 기대어도 좋고,\n바르게 세워도 좋습니다.\n두 발은 바닥에 가만히 내려놓습니다.\n준비가 되면 눈을 감거나,\n시선을 무릎 아래로 부드럽게 내립니다.\n\n먼저 숨을 한 번 살펴봅니다.\n코로 천천히 들이쉬고,\n입으로 길게 내쉽니다.\n내쉬는 숨이 들이쉬는 숨보다 조금 더 길도록 해 봅니다.\n한 번 더 들이쉬고,\n길게 내쉽니다.\n\n이제 두 팔을 가슴 앞에서 교차합니다.\n오른손은 왼쪽 어깨 아래에,\n왼손은 오른쪽 어깨 아래에 얹습니다.\n마치 나비가 날개를 접듯,\n두 손이 가슴 위에 포개어집니다.\n\n이제 두 손으로 번갈아 가며 가볍게 토닥입니다.\n오른손, 왼손, 오른손,\n왼손.\n세게 두드리지 않습니다.\n아기를 재우듯,\n빗방울이 창을 두드리듯,\n느리고 부드럽게.\n\n토닥이는 리듬을 잠시 그대로 이어 갑니다.\n손바닥에서 전해 오는 온기,\n어깨에 닿는 작은 울림을 느껴 봅니다.\n왼쪽, 오른쪽, 왼쪽,\n오른쪽.\n\n이 두드림은 몸에게 이렇게 말해 주는 것과 같습니다.\n지금은 괜찮아.\n지금 이 자리는 안전해.\n\n이제 토닥이는 손은 그대로 두고,\n마음속에 한 장소를 떠올려 봅니다.\n내가 가장 편안하고 가장 안전하다고 느끼는 곳입니다.\n\n실제로 가 본 곳이어도 좋고,\n마음속으로 지어낸 곳이어도 좋습니다.\n햇살이 드는 창가,\n파도 소리가 들리는 바닷가,\n어릴 적 할머니 집의 따뜻한 아랫목.\n지금 떠오르는 그 한 곳으로 천천히 걸어 들어갑니다.\n\n그곳에서 무엇이 보이나요.\n빛은 어떤 색인가요.\n주위에는 어떤 것들이 있나요.\n왼쪽, 오른쪽,\n손은 계속 부드럽게 토닥입니다.\n\n그곳에서 어떤 소리가 들리나요.\n바람 소리, 물소리,\n혹은 아무 소리도 없는 고요.\n그 소리에 잠시 귀를 기울입니다.\n\n피부에는 어떤 온도가 닿아 있나요.\n따뜻한 햇살, 선선한 바람.\n발밑에는 무엇이 닿아 있나요.\n모래, 풀, 나무 바닥.\n그 감촉을 느껴 봅니다.\n\n이제 그곳에서 가슴이 어떻게 느껴지는지 살펴봅니다.\n조금 넓어졌을 수도 있고,\n숨이 조금 깊어졌을 수도 있습니다.\n어깨의 힘이 조금 빠졌을 수도 있습니다.\n어떤 변화든 좋고,\n아직 변화가 없어도 괜찮습니다.\n\n이 장소에 이름을 하나 붙여 봅니다.\n한 단어면 충분합니다. 바다.\n창가. 아랫목.\n마음속으로 그 이름을 조용히 불러 봅니다.\n\n이름을 부르면서, 왼쪽,\n오른쪽, 왼쪽, 오른쪽.\n편안한 느낌과 그 이름과 이 두드림이 하나로 이어지도록,\n잠시 그대로 머뭅니다.\n\n이제 이 안전한 자리를 마음속 잘 보이는 곳에 두고 옵니다.\n언제든 다시 올 수 있는 곳입니다.\n힘든 순간에 두 팔을 가슴에 포개고 이 이름을 부르면,\n이 자리는 다시 열립니다.\n\n천천히 손의 두드림을 멈춥니다.\n두 손을 그대로 어깨에 얹은 채,\n나를 안고 있는 이 느낌에 잠시 머뭅니다.\n고마운 사람을 안아 주듯,\n나를 한 번 지그시 안아 줍니다.\n\n이제 두 팔을 풀어 무릎 위에 편안히 내려놓습니다.\n숨을 한 번 깊게 들이쉬고,\n길게 내쉽니다.\n손가락과 발가락을 가볍게 움직여 봅니다.\n어깨를 한 번 돌려 봅니다.\n\n준비가 되면 천천히 눈을 떠 보세요.\n가슴 위에 남아 있는 온기가 오늘 하루 곁에 머물러 줄 것입니다.","duration":"약 10분","tags":"#나비포옹 #안전지대명상 #자기위로","series":"숨비명상"},{"id":"f1b5a938","category":"용서감사","title":"용서의 첫걸음","body":"오늘은 조금 용기가 필요한 시간입니다.\n마음 한구석에 오래 미뤄 두었던 말,\n미안하다는 말을 꺼내 보는 연습입니다.\n서두르지 않아도 됩니다.\n갈 수 있는 만큼만 가면 됩니다.\n\n먼저 편안한 자세로 앉아 보세요.\n등과 허리를 곧게 펴고,\n가슴을 활짝 열어 봅니다.\n눈은 감아도 좋고,\n뜨고 있다면 시선을 바닥의 편안한 한 지점에 내려놓습니다.\n\n이제 깊이 숨을 들이쉬고,\n천천히 내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n마지막으로 한 번 더,\n깊이 들이쉬고,\n길게 내쉽니다.\n\n이제 몸에 잠시 주의를 두고,\n긴장된 곳을 하나씩 풀어 줍니다.\n머리와 목, 어깨,\n팔을 지나 손가락 끝까지,\n힘을 살며시 내려놓습니다.\n\n가슴과 아랫배,\n등과 허리의 긴장도 내려놓습니다.\n엉덩이와 허벅지,\n무릎과 종아리,\n발목을 지나 발가락 끝까지,\n힘을 내려놓습니다.\n꼭 다물고 있던 어금니도 살짝 풀어 줍니다.\n\n다시 한 번 깊이 숨을 들이쉬고,\n내쉽니다.\n이제 호흡은 자연스러운 흐름에 맡기고,\n편안해진 몸으로 드나드는 숨을 잠시 지켜봅니다.\n\n이제 마음속으로 한 사람을 초대해 봅니다.\n살아오며 만난 사람 가운데,\n나의 크고 작은 잘못과 실수로 마음을 다친 사람.\n미안하다고 말하고 싶었지만,\n용기가 없어 끝내 말하지 못한 사람.\n\n한 사람이 떠올랐다면,\n그 사람의 얼굴을 가만히 바라봅니다.\n그리고 나의 어떤 말이,\n어떤 행동이 그 사람에게 상처가 되었는지 천천히 떠올려 봅니다.\n\n가슴이 조여 오거나 마음이 아파 올 수 있습니다.\n괜찮습니다.\n그 아픔은 내가 그 사람을 소중히 여긴다는 증거이기도 합니다.\n밀어내지 말고,\n그 느낌을 있는 그대로 잠시 안고 있어 봅니다.\n\n이제 깊이 숨을 들이쉬고,\n내쉬면서,\n그 사람을 향해 마음속으로 조용히 말을 건넵니다.\n\n내가 당신에게 몸으로, 말로,\n마음으로 준 상처에 용서를 구합니다.\n당신의 용서를 구합니다.\n\n한 번 더,\n호흡에 실어 건넵니다.\n\n내가 당신에게 몸으로, 말로,\n마음으로 준 상처에 용서를 구합니다.\n당신의 용서를 구합니다.\n\n원한다면 한 손을 가슴 위에 얹어도 좋습니다.\n손바닥의 온기를 느끼며,\n숨이 드나드는 리듬에 맞춰 이 말을 부드럽게 되뇌어 봅니다.\n나는 당신의 용서를 구합니다.\n나는 당신의 용서를 구합니다.\n\n되뇌는 동안 몸 어딘가가 뻐근해지거나,\n불편한 감정이 올라올 수 있습니다.\n잘못하고 있는 것이 아닙니다.\n오래 눌러 두었던 마음이 움직이기 시작한 것입니다.\n그 느낌을 그대로 받아들이고,\n다시 문장으로 돌아옵니다.\n나는 당신의 용서를 구합니다.\n\n이제 충분하다고 느껴지면,\n문장을 살며시 내려놓습니다.\n말은 멈추어도,\n전하려던 마음은 이미 길을 떠났습니다.\n\n깊이 숨을 들이쉬고,\n내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n마지막으로 한 번 더,\n깊이 들이쉬고,\n길게 내쉽니다.\n\n준비가 되었다면 천천히 눈을 뜹니다.\n\n기억해 주세요.\n용서는 단박에 이루어지지 않습니다.\n오늘 한 걸음을 내디뎠다면,\n그것으로 충분합니다.\n같은 자리에 다시 앉을 때마다,\n그 걸음은 조금씩 가벼워질 것입니다.","duration":"약 10분","tags":"#용서명상 #관계명상 #마음치유","series":"숨비명상"},{"id":"0b7c2123","category":"용서감사","title":"아침의 선물","body":"우리에겐 선물처럼 매일 새로운 아침이 주어집니다.\n지금부터 그 선물을 열어 보는 짧은 명상을 함께하겠습니다.\n\n침대 위여도 좋고,\n지하철이나 버스 안이어도 좋습니다.\n지금 있는 그 자리에서,\n평화로운 하루를 시작할 수 있습니다.\n\n편안한 자세를 찾아보세요.\n어깨를 살짝 늘어뜨리고,\n눈을 감습니다.\n눈을 감기 어려운 곳이라면,\n시선을 아래로 부드럽게 내려도 좋습니다.\n\n이제 가볍게 호흡합니다.\n들이쉬고, 내쉬고.\n코로 숨이 들어왔다 나가는 느낌을 가만히 따라가 봅니다.\n\n어떤 생각이 떠오르거나 잠시 주의가 흐트러져도 괜찮습니다.\n알아차리고,\n다시 숨으로 돌아오면 됩니다.\n\n들이쉬고, 내쉬고. 들이쉬고,\n내쉬고.\n몸과 마음이 편안해질 때까지,\n이 호흡에 잠시 머뭅니다.\n\n이제 마음을 여는 말들을 함께 따라 해 보겠습니다.\n소리 내어 말해도 좋고,\n소리 낼 수 없는 곳이라면 마음속으로만 따라 해도 충분합니다.\n한 문장, 한 문장,\n천천히 스며들게 합니다.\n\n나는 늘 건강하고 활기차며,\n언제나 감사하는 마음으로 식사를 합니다.\n\n나의 가족은 언제나 건강하고 활력이 넘치며,\n서로 믿고, 서로 사랑합니다.\n\n나는 즐겁게 일하며,\n내가 하는 일에 감사를 느낍니다.\n나는 나의 일에 자부심을 느끼고,\n함께하는 사람들을 신뢰하고 사랑합니다.\n\n나는 늘 풍요롭고,\n필요한 것은 필요한 만큼 채워집니다.\n\n나는 언제나 기쁘고 평화롭습니다.\n지금 어렵다고 느끼는 일도,\n결국은 좋은 열매가 될 것임을 나는 압니다.\n\n나는 매일 편안하게 잠들고,\n상쾌한 기분으로 일어납니다.\n\n나는 모든 이를 사랑하고,\n모든 것에 감사합니다.\n\n아, 감사합니다.\n내가 바라는 모든 것이 이미 이루어져 있음에 감사합니다.\n\n이 말들의 여운을 가슴에 잠시 담아 둡니다.\n말이 지나간 자리에 따뜻한 기운이 남아 있습니다.\n\n이제 깊이 숨을 들이쉬고,\n길게 내쉽니다.\n준비가 되면 천천히 눈을 뜹니다.\n\n오늘 아침의 이 잠깐이,\n하루 전체를 데워 주는 작은 불씨가 되어 줄 것입니다.\n선물처럼 받은 오늘 하루를,\n순수한 즐거움과 평화로 가득 채워 보세요.\n\n======\n\n\n아침 출근길 명상\n\n우리에겐 선물처럼 매일 새로운 아침이 주어집니다.\n지금부터 행복한 하루를 시작하는 명상을 해보겠습니다.\n\n침대에서,\n지하철이나 버스에서 어디서나 평화로운 하루를 시작할 수 있습니다.\n편안한 자세로 천천히 눈을 감습니다.\n\n어깨를 살짝 늘어뜨리며 가볍게 호흡합니다.\n들이쉬고~ 내쉬고~\n\n어떤 생각이 떠오르거나 잠시 주의가 흐트러져도 괜찮습니다.\n숨이 코로 숨이 들어왔다 나가는 느낌에 집중하면서 다시 로 돌아옵니다.\n들이쉬고~ 내쉬고~ 들이쉬고~ 내쉬고~ 들이쉬고~ 내쉬고~\n\n계속해서 몸과 마음이 편안해질 때까지 호흡을 계속합니다.(30초 후)\n\n이제 가이드를 따라해보겠습니다.\n소리 내어 말할 수 없을 경우는 조용히 속으로만 따라 해도 좋습니다.\n\n\"나는 늘 건강하고 활기차며, 언제나 감사하는 마음으로 식사를 한다.\n\n나의 가족은 \\ 언제나 건강하고 활력이 넘치며,\n서로 믿고,\n\\ 서로 사랑한다.\n\n나는 직장에서 즐겁게 일하며 내가 하는 일에 감사를 느낀다.\n\n나는 나의 일에 자부심을 느끼고,\n동료들을 신뢰하고 사랑한다.\n\n나는 늘 풍요롭고,\n부(富)는 필요한 만큼 생긴다.\n\n나는 언제나 기쁘고 평화롭다.\n\n지금 어렵다고 느끼는 일도 결국은 좋은 결과가 될 것임을 안다.\n\n나는 매일 편안하게 잠들며 상쾌한 기분으로 일어난다.\n\n나는 모든 이를 사랑하고 모든 것에 감사한다.\n\n아, 감사하다.\n\n내가 바라는 모든 것이 이미 이루어져 있는 것이 감사하다.\"\n\n(30초후)\n\n종소리와 함께 명상을 마무리합니다.\n오늘은 하루를 시작하는 명상을 같이 해보았습니다.\n\n아침에 잠깐 동안의 명상으로 하루를 행복과 기쁨으로 보낼 수 있습니다.\n여러분의 하루를 순수한 즐거움과 평화로 채워보세요.","duration":"약 7분","tags":"#아침명상 #확언명상 #하루의시작","series":"숨비명상"},{"id":"a545d922","category":"멈춤","title":"한 모금의 온기","body":"우리는 하루에도 몇 번씩 차를 마십니다.\n오늘은 그 익숙한 한 잔을,\n처음 만나는 것처럼 새롭게 마셔 보려 합니다.\n\n평소에 즐겨 마시는 차를 한 잔 준비해 보세요.\n커피도 좋고,\n보리차도 좋습니다.\n따뜻한 차라면 더 좋습니다.\n그리고 방해받지 않는 조용한 자리에 편안히 앉습니다.\n\n허리는 가볍게 세우고,\n어깨의 힘은 스르르 내려놓습니다.\n아직 몸 어딘가에 긴장이 남아 있어도 괜찮습니다.\n지금 이대로, 충분합니다.\n\n숨을 한 번 천천히 들이쉬고,\n내쉬어 보세요.\n내쉬는 숨을 따라 몸이 조금씩 부드러워지는 것을 느껴 봅니다.\n\n이제 찻잔을 테이블 위에 내려놓고,\n가만히 바라봅니다.\n지금 눈에 보이는 것을 그저 바라보기만 합니다.\n찻잔의 모양,\n그 안에 담긴 차의 빛깔.\n\n따뜻한 차라면 잔 위로 피어오르는 김이 보일지도 모릅니다.\n하얀 김이 천천히 올라와 공기 속으로 사라지는 모습을 지켜봅니다.\n서두를 것은 아무것도 없습니다.\n\n천천히 손을 뻗어 봅니다.\n손이 찻잔을 향해 나아가는 그 움직임을 알아차리며,\n잔을 감싸 쥡니다.\n\n손바닥에 닿는 감각을 느껴 보세요.\n따뜻한가요, 매끄러운가요.\n손끝으로 스며드는 온기가 있다면,\n잠시 그 느낌에 머물러 봅니다.\n겨울날 언 손을 이불 속에 넣었을 때처럼,\n온기가 손에서 팔로 번져 가는 것을 느껴 봅니다.\n\n이제 찻잔을 천천히 들어 올립니다.\n들어 올리는 동안,\n잔의 무게가 손에 전해집니다.\n\n잔을 입술 가까이 가져와 봅니다.\n잔이 입술에 닿는 순간의 느낌을 알아차립니다.\n따뜻한지, 매끄러운지.\n그리고 차의 향이 코끝에 먼저 도착합니다.\n그 향을 한 번 깊이 들이마셔 보세요.\n\n이제 차를 한 모금,\n아주 천천히 마십니다.\n바로 삼키지 않고,\n입안에 가만히 머금어 봅니다.\n\n차가 머물고 있는 입안을 느껴 봅니다.\n온도가 느껴지나요.\n혀 위에 얹힌 액체의 무게가 느껴지나요.\n맛은 어떤가요. 단맛, 쓴맛,\n고소함.\n이름을 붙이지 않아도 괜찮습니다.\n그저 느껴지는 대로 두면 됩니다.\n\n이제 천천히 삼킵니다.\n한 모금의 온기가 목을 지나,\n가슴을 지나,\n몸 안쪽으로 부드럽게 내려가는 것을 따라가 봅니다.\n따뜻한 물줄기가 몸 한가운데를 지나가는 것 같습니다.\n그 길을 끝까지 배웅하듯 느껴 봅니다.\n\n차를 다 삼킨 입안은 어떤가요.\n혀끝에 남은 맛이 있나요.\n입안에 고인 침, 촉촉함,\n산뜻함.\n그런 작은 느낌들이 하나씩 다가왔다가 지나갑니다.\n느낌을 애써 찾으려 하지 않아도 됩니다.\n마음을 가만히 입안에 두면,\n느낌이 저절로 찾아옵니다.\n\n이제 자유롭게,\n자신의 속도로 차를 마셔 봅니다.\n한 모금마다 손의 온기,\n입술의 감촉, 혀 위의 맛,\n목을 타고 내려가는 따뜻함을 함께합니다.\n\n도중에 다른 생각이 떠올라도 괜찮습니다.\n알아차렸다면,\n다시 부드럽게 찻잔으로 돌아오면 됩니다.\n\n찻잔을 내려놓고,\n살며시 눈을 감아 봅니다.\n지금 몸 안에 남아 있는 느낌에 머물러 봅니다.\n배 속 어딘가에 남은 온기,\n가슴에 번진 편안함.\n\n늘 곁에 있었지만 미처 몰랐던 한 잔의 차가,\n오늘은 나를 이렇게 따뜻하게 데워 주었습니다.\n그 고마움이 은은하게 차오르는 것을 느껴 봅니다.\n\n이제 천천히 돌아올 시간입니다.\n손끝을 가볍게 움직여 보고,\n발끝도 살짝 움직여 봅니다.\n숨을 한 번 깊이 들이쉬고,\n내쉬면서 살며시 눈을 뜹니다.\n한 모금의 온기를 몸 안에 간직한 채,\n지금 이 자리로 돌아옵니다.\n\n오늘 하루,\n차 한 잔을 앞에 두는 순간이 온다면,\n그때마다 이 따뜻함을 잠시 떠올려 보셔도 좋습니다.\n\n\n\n\n\n--------------\n차 마시기 명상\n\n우리는 일상에서 차를 자주 마십니다.\n오늘은 차에 대한 선입견이나 고정관념을 내려놓고,\n차를 새롭게 음미해보는 시간 가져보겠습니다.\n\n평소에 마시는 차를 준비합니다.\n커피도 좋고, 보이차도 좋고,\n차의 종류는 상관없습니다.\n가급적이면 따뜻한 차가 좋습니다.\n그리고 방해받지 않는 조용한 곳에 홀로 앉습니다.\n\n이제 종소리와 함께 명상을 시작합니다.\n\n차를 테이블이나 책상 위에 내려놓고 바라봅니다.\n현재 눈에 보여지는 것을 관찰합니다.\n찻잔의 모양,\n그 속에 들어있는 차의 색깔 길고 가느다란 빨대나 스틱 따뜻한 차라면 컵 위로 피어오르는 아지랑이 차가운 차라면 투명한 얼음 덩어리가 있습니다.\n\n천천히 손을 뻗습니다.\n뻗어나가는 손을 알아차리며 찻잔을 잡습니다.\n컵을 잡고 있는 손의 감각을 느낍니다.\n따뜻한지, 차가운지,\n축축한지, 딱딱한지,\n부드러운지,\n매끄러운지… 잠시 그 느낌에 머물러봅니다.\n\n천천히 찻잔을 들어올립니다.\n들어올리면서 찻잔의 무게를 느껴봅니다.\n차를 마시기 위해 찻잔을 입술에 가져다 댑니다.\n찻잔과 입술의 접촉면의 느낌을 관찰합니다.\n차가운지, 따뜻한지,\n매끄러운지…\n\n차를 한 모금 천천히 마시고 삼키지 않고 입안에 머금어봅니다.\n차가 머물러 있는 입안을 관찰합니다.\n온도가 느껴지나요?\n액체의 무게감이 느껴지나요?\n맛은 어떤가요? 단맛, 쓴맛,\n고소함…\n\n이제 천천히 차를 삼킵니다.\n차가 목으로 넘어가는 것을 느껴봅니다.\n차를 다 마신 입안을 관찰합니다.\n어떤 맛이 느껴지나요? 단맛,\n쓴맛, 신맛,\n단맛… 입안에 침이 고여 있지는 않은가요?\n\n입안에서 또 어떤 감촉이 느껴지나요?\n부드러움, 끈끈함,\n산뜻함… 혓바닥의 느낌은 어떤가요?\n촉촉한지, 건조한지...\n\n이제 자유롭게 차를 마시며 입안에서 느껴지는 느낌들을 관찰합니다.\n느낌을 찾으려 하지 말고 마음을 입안에 두고 자연스럽게 느껴봅니다.\n그리고 눈을 감고 그 기분이나 감정에 머물러봅니다.\n\n종소리와 함
