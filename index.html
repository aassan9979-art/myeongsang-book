n호흡을 따라 수면 쪽으로 올라오며,\n그 고요를 가슴에 품고 옵니다.\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n몸의 감각과 주위의 소리를 느끼며,\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n세상이 유난히 흔들리는 날,\n기억해 주세요.\n흔들리는 것은 깃발도 바람도 아니고,\n마음이라는 것을.\n그리고 그 마음의 깊은 곳에는,\n어떤 파도도 닿지 못하는 고요가 언제나 있다는 것을.\n숨 몇 번이면 내려갈 수 있는 곳입니다.\n그 물밑의 고요가,\n흔들리는 날들의 중심이 되어 줄 것입니다.","duration":"약 11분","tags":"#호흡명상 #내면의고요 #마음의중심","series":"숨비명상"},{"id":"6e22a373","category":"관찰","title":"처음의 맛","body":"오늘의 명상에는 준비물이 하나 필요합니다.\n건포도 한 알입니다.\n건포도가 없다면 작은 열매나 견과 하나여도 좋습니다.\n지금부터 우리는 이 작은 한 알을,\n태어나서 처음 보는 물건처럼 만나 볼 것입니다.\n건포도에 대해 알고 있는 모든 것,\n맛이 어떨 거라는 짐작까지 잠시 내려놓습니다.\n아는 것이 사라진 자리에서,\n처음이 시작됩니다.\n\n건포도 한 알을 집어 손바닥 위에 올려놓습니다.\n그리고 온 마음을 기울여 바라봅니다.\n구석구석, 천천히.\n빛을 받아 반짝이는 부분이 있고,\n움푹 들어가 어두운 골짜기가 있습니다.\n접히고 주름진 자리들이 저마다 다른 모양을 하고 있습니다.\n이 세상에 단 하나뿐인 지형입니다.\n\n이제 손가락으로 집어 질감을 만나 봅니다.\n촉감에 집중이 잘되도록 눈을 감아도 좋습니다.\n손가락 사이에서 이리저리 굴려 봅니다.\n부드러운가요, 딱딱한가요.\n말랑하게 눌리나요,\n끈적임이 있나요.\n작은 무게와 온도까지,\n손끝에 닿는 그대로 받아들입니다.\n\n이번에는 코 밑으로 가져가 봅니다.\n숨을 들이쉬며 무슨 일이 일어나는지 살펴봅니다.\n달콤한 냄새인가요,\n톡 쏘는 냄새인가요.\n아무 냄새가 없다면,\n없다는 것을 알아차립니다.\n그리고 향을 맡는 사이 입안과 뱃속에서 일어나는 일도 살펴봅니다.\n벌써 침이 고이는지도 모릅니다.\n\n조금 엉뚱하지만,\n귀에 대고 살짝 문질러 봅니다.\n작은 소리가 들릴 수도 있습니다.\n한 알에게 귀까지 기울여 본 것은 처음일 것입니다.\n\n이제 천천히 입으로 가져갑니다.\n손과 팔이 어떻게 움직이는지,\n입술이 어떻게 열리고,\n혀가 어떻게 마중 나오는지 살펴봅니다.\n입안에 살짝 넣되,\n아직 씹지 않습니다.\n혀로 이리저리 굴리면서,\n그 느낌에만 온 신경을 모읍니다.\n촉촉한가요, 건조한가요.\n혀 위의 무게는 어떤가요.\n서두르지 말고,\n충분히 머뭅니다.\n\n씹을 준비가 되었다면,\n건포도가 입안 어디에 자리 잡고 있는지 먼저 알아차립니다.\n그리고 의식적으로, 한 번,\n깨물어 봅니다.\n그 순간 무엇이 터져 나오나요.\n맛이 입안에 어떻게 번져 가나요.\n한 번 더 씹으며,\n맛이 순간순간 어떻게 변하는지,\n이 사이에서 느껴지는 질감은 어떤지 세세히 따라갑니다.\n\n천천히 여러 번 씹다 보면,\n삼키고 싶은 마음이 올라올 것입니다.\n바로 삼키지 말고,\n그 충동부터 온전히 느껴 봅니다.\n아, 삼키고 싶구나.\n그리고 삼키기로 했다면,\n혀가 무엇을 준비하는지 지켜보며,\n천천히 삼킵니다.\n목을 지나 내려가는 감각을 따라가 봅니다.\n가능하다면 뱃속에 닿는 느낌까지.\n\n다 삼킨 뒤,\n잠시 그대로 머뭅니다.\n입안에 남은 여운,\n혀에 감도는 맛,\n한 알이 지나간 뒤의 몸의 느낌을 다시 한 번 느껴 봅니다.\n\n건포도 한 알이었습니다.\n평소라면 한 줌씩 집어 무심코 삼켰을,\n그 작은 한 알.\n그런데 주의를 기울이자 전혀 다른 경험이 되었습니다.\n보고, 만지고, 맡고, 듣고,\n맛보는 기쁨이 이 한 알에 다 들어 있었습니다.\n\n그렇다면 우리는 얼마나 많은 것을 느끼지도 못한 채 흘려보내며 살고 있을까요.\n진정으로 살 수 있는 시간은 오직 지금 이 순간뿐인데,\n마음은 자주 지나간 날과 오지 않은 날에 가 있습니다.\n오늘 이 한 알의 경험을 기억해 주세요.\n주의를 기울이는 순간,\n익숙한 모든 것이 처음의 맛으로 살아납니다.","duration":"약 10분","tags":"#건포도명상 #마음챙김 #먹기명상","series":"숨비명상"},{"id":"2ee56edd","category":"움직임명상","title":"꿀벌의 걸음","body":"방석에 오래 앉아 있다 보면 다리가 아파 오고,\n번뇌가 끓고,\n졸음이 밀려오기도 합니다.\n\n몸을 움직이고 싶은 그때,\n좋은 소식이 있습니다.\n걷기도 명상이 된다는 것.\n걷기명상은 앉아서 하는 명상과 일상의 알아차림 사이를 이어 주는 다리입니다.\n\n오늘은 그중에서도 가장 느린 걸음,\n꿀벌이 꽃을 옮겨 다니듯 한 번에 하나의 감각에 온전히 머무는 걸음을 걸어 보겠습니다.\n\n먼저 남의 시선을 신경 쓰지 않고 오갈 수 있는 안전한 자리를 찾습니다.\n실내여도, 실외여도 좋습니다.\n실내라면 양말을 벗으면 훨씬 좋습니다.\n\n두 발을 어깨너비로 벌려 나란히 놓고,\n양발에 체중을 고르게 싣고 섭니다.\n두 팔은 옆으로 편안히 늘어뜨리고,\n눈은 자연스럽게 뜬 채 시선은 앞을 향합니다.\n부드럽게 서 있는 지금의 나를 알아차립니다.\n\n이제 정수리에서 발바닥까지,\n주의를 천천히 내려보냅니다.\n그리고 바닥에 닿아 있는 발바닥을 느껴 봅니다.\n바닥과 닿은 면의 압력,\n온도,\n체중이 어디에 실려 있는지,\n바닥의 단단함까지.\n이 작은 발 두 개가 몸 전체를 받치고 있습니다.\n자애롭고 감사한 마음으로,\n그저 알아차리기만 하면 됩니다.\n\n감각이 흐릿하다면 무릎을 부드럽게 살짝 굽혀 봅니다.\n몸을 천천히 앞뒤로 흔들어 보고,\n무릎으로 작은 원을 그려 봅니다.\n발바닥에 실리는 무게가 이리저리 옮겨 다니는 것이 또렷해집니다.\n\n이제 걷기 시작합니다.\n아주 천천히.\n먼저 체중을 왼쪽 다리로 완전히 옮깁니다.\n물을 이 잔에서 저 잔으로 따르듯이.\n가벼워진 오른발을 천천히 들어 올려,\n앞으로 뻗습니다.\n드는 동안 다리와 발의 감각이 어떻게 변하는지 지켜봅니다.\n\n오른발 뒤꿈치가 바닥에 닿는 순간에 주의를 모읍니다.\n발바닥 전체가 바닥에 내려앉으면,\n이번에는 왼발 뒤꿈치가 천천히 들리기 시작합니다.\n장딴지에 전해지는 팽팽한 감각을 느끼며,\n왼발을 들어 올리고,\n체중이 오른발로 온전히 옮겨 가는 것을 확인합니다.\n\n이렇게 계속 갑니다.\n들어 올리고, 뻗고, 딛고.\n들어 올리고, 뻗고, 딛고.\n한 발이 바닥을 떠날 때의 가벼움과,\n다른 발에 실리는 무게의 느낌을 번갈아 알아차립니다.\n\n걷다가 마음이 다른 곳을 떠돌면,\n알아차리고 다시 발로 돌아옵니다.\n마음을 몸에 두고,\n주의 깊게, 계속 걷습니다.\n\n밖에서 걷고 있다면,\n걸음 사이사이 찾아오는 선물들도 맞이해 봅니다.\n신선한 공기, 따스한 햇볕,\n살랑이는 나뭇잎, 새소리,\n발밑 흙의 감촉.\n즐겁고 아름다운 것을 만났다면,\n그 속으로 들어가 봅니다.\n원한다면 잠시 멈춰 나뭇잎의 결을 손끝으로 느껴 보아도 좋습니다.\n마치 그것이 이 세상에 존재하는 유일한 것인 듯,\n온전히 맡겨 봅니다.\n그리고 충분히 머물렀다면,\n한 꽃에서 꿀을 얻은 벌이 다음 꽃으로 날아가듯,\n가볍게 다음 걸음으로,\n다음 감각으로 옮겨 갑니다.\n\n이렇게 걷다 보면 놀라게 됩니다.\n한 걸음을 떼는 데 이토록 많은 감각이 함께 일하고 있었다니.\n발바닥과 발목,\n장딴지와 무릎,\n기울고 되돌아오는 균형까지.\n평생 무심코 걸어온 걸음이,\n사실은 이렇게 경이로운 일이었습니다.\n\n원하는 만큼 걸었다면 천천히 멈춰 서서,\n두 발로 서 있는 지금을 알아차리며 마칩니다.\n\n이 느린 걸음이 가르쳐 준 것을 가져가시기 바랍니다.\n한 번에 하나씩, 천천히,\n온전히.\n꿀벌의 걸음으로 걸을 줄 알면,\n설거지도, 청소도,\n어떤 움직임도 마음을 담아 할 수 있습니다.\n걸음이 곧 살아가는 법이 됩니다.","duration":"약 10분","tags":"#걷기명상 #느린걸음 #감각알아차림","series":"숨비명상"},{"id":"fe69bfeb","category":"자비희사","title":"다정한 이름표","body":"감정은 원래 나쁜 것이 아닙니다.\n두려움도, 분노도, 슬픔도,\n지금 내 안팎에서 무슨 일이 벌어지고 있는지 알려 주러 온 심부름꾼입니다.\n\n다만 감정은 없애려고 싸울수록 더 힘이 세지고,\n붙들고 늘어질수록 더 어두워집니다.\n오늘은 감정과 싸우지 않고 만나는 법,\n그중에서도 다정하게 이름을 불러 주는 법을 연습해 보겠습니다.\n\n한 가지 반가운 사실이 있습니다.\n감정은 마음에만 있는 것이 아니라 몸에도 있습니다.\n몸에 저마다의 주소가 있는 셈입니다.\n\n사람마다 다르지만,\n분노는 목의 긴장으로,\n슬픔은 가슴의 묵직함으로,\n두려움은 배 속의 서늘함으로,\n부끄러움은 머리의 공허함으로 찾아오곤 합니다.\n생각은 너무 빨라서 잡기 어렵지만,\n몸은 느립니다.\n그래서 몸은 감정을 만나러 가는 가장 좋은 문입니다.\n\n편안한 자리에 앉아 눈을 감습니다.\n느긋하게 숨을 들이쉬고,\n내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n마지막으로 들이쉬고,\n길게 내쉽니다.\n\n이제 요즘 나를 힘들게 하는 감정 하나를 떠올려 봅니다.\n가장 크고 무거운 것 말고,\n오늘 만나 볼 만한 것으로 하나면 됩니다.\n그 감정이 일어났던 상황을 잠시 떠올립니다.\n\n그리고 몸을 살펴봅니다.\n이 감정은 지금 내 몸 어디에 살고 있나요.\n목이 뻣뻣한가요.\n가슴이 눌리나요.\n배 속이 서늘한가요.\n머리가 텅 빈 듯한가요.\n천천히 몸을 훑다가,\n가장 또렷하게 느껴지는 한 곳에서 멈춥니다.\n찾았다면,\n그 자리가 오늘 감정의 주소입니다.\n\n그 자리의 감각을 없애려 하지 말고,\n그대로 둡니다.\n자연스럽게 호흡을 이어 가고,\n원한다면 한 손을 가슴 위에 얹습니다.\n부드럽고 고른 숨이 몸을 조금씩 고요하게 합니다.\n\n이제 그 감정에 이름표를 붙여 줍니다.\n외로움. 슬픔. 두려움.\n혼란.\n꼭 맞는 말이 아니어도 괜찮습니다.\n\n그런데 여기,\n가장 중요한 것이 있습니다.\n어떤 목소리로 부르느냐입니다.\n사무적으로,\n차갑게 부르는 것이 아니라,\n사랑하는 사람의 이름을 부르듯이.\n아픈 아이의 이름을 가만히 불러 주는 어머니처럼.\n따뜻하고, 이해하고,\n받아 주는 목소리로.\n\n아, 외로움이구나. 그래,\n슬픔이 와 있구나.\n두려움이었구나.\n\n다정하게 불러 주는 순간,\n신기한 일이 일어납니다.\n감정에 푹 빠져 있던 나와 감정 사이에,\n꼭 알맞은 만큼의 거리가 생깁니다.\n쫓아내는 거리가 아니라,\n마주 볼 수 있는 거리.\n나는 슬픔 그 자체가 아니라,\n슬픔을 겪고 있는 사람이었습니다.\n감정은 내가 아니라,\n나를 다녀가는 손님이었습니다.\n\n이름을 불러 주며,\n몸의 그 자리를 다시 느껴 봅니다.\n꽉 뭉쳐 있던 감각이 조금 풀렸을 수도 있고,\n그대로일 수도 있습니다.\n어느 쪽이든 좋습니다.\n느긋하고 편안하게.\n그것이 이 연습의 전부입니다.\n\n잠시 더,\n다정한 이름표와 함께 머물러 봅니다.\n\n이제 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n힘겨운 감정이 찾아오는 날,\n기억해 주세요.\n먼저 몸에서 그 감정의 주소를 찾고,\n그다음,\n세상에서 가장 다정한 목소리로 이름을 불러 주세요.\n아, 슬픔이구나.\n싸우지 않고 불러 준 그 한마디에,\n감정은 알아봐 주어서 고맙다는 듯,\n제 갈 길을 갈 것입니다.","duration":"","tags":"#감정명상 #꼬리표붙이기 #자기위로","series":"숨비명상"},{"id":"81360e8a","category":"관찰","title":"일곱 가지 마음","body":"명상이 깊어지는 데 필요한 것은 대단한 기술이 아니라 마음가짐입니다.\n오래 수행해 온 이들은 일곱 가지 마음을 꼽습니다.\n\n그리고 이 일곱은 서로 이어져 있어서,\n하나를 익히면 나머지가 저절로 따라옵니다.\n오늘은 앉은 채로,\n그 일곱 가지 마음을 하나씩 가슴에 놓아 보겠습니다.\n\n편안히 앉아 허리를 세우고,\n눈을 감습니다.\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n자연스러운 숨으로 돌아와,\n드나드는 호흡에 잠시 머뭅니다.\n\n첫 번째 마음은,\n판단하지 않기입니다.\n우리는 눈에 닿는 모든 것에 좋다,\n나쁘다,\n쉼 없이 도장을 찍으며 삽니다.\n앉아 있는 이 시간만큼은,\n그 저울을 내려놓습니다.\n생각이 지나가면 따라가서 따지지 말고,\n그저 알아차리고,\n조용히 호흡으로 돌아옵니다.\n숨과 함께,\n이 마음을 가슴에 놓습니다.\n\n두 번째 마음은, 인내입니다.\n번데기는 제 시간을 다 지나야 나비가 됩니다.\n서두른다고 날개가 빨리 돋지 않습니다.\n나의 변화에도 그만한 시간이 필요합니다.\n기다릴 줄 아는 마음이 곧 지혜가 자라는 과정입니다.\n숨과 함께,\n이 마음도 가슴에 놓습니다.\n\n세 번째 마음은,\n처음의 마음입니다.\n난생처음 무언가를 본 아이의 눈을 떠올려 봅니다.\n그 눈에는 낡은 생각의 필터가 없습니다.\n사실 모든 순간이 그렇게 처음입니다.\n지금 쉬고 있는 이 숨은,\n내 생애 단 한 번뿐인 숨입니다.\n처음처럼,\n이 숨을 느껴 봅니다.\n\n네 번째 마음은,\n나를 믿는 것입니다.\n스승의 말도, 책의 안내도,\n길을 가리키는 표지판일 뿐입니다.\n그 길을 걷는 것은 언제나 나 자신입니다.\n나를 이해하는 일에서만큼은,\n내가 나의 가장 좋은 안내자임을 믿어 봅니다.\n\n다섯 번째 마음은,\n애쓰지 않기입니다.\n무언가 되려고,\n어떤 상태에 이르려고 안달하지 않습니다.\n명상은 애써 얻는 일이 아니라,\n넉넉한 마음으로 그저 지켜보는 일입니다.\n지금 이렇게 앉아 있는 것으로,\n이미 충분합니다.\n어깨의 힘을 한 번 더 내려놓습니다.\n\n여섯 번째 마음은,\n수용입니다.\n수용은 모든 것을 좋아하라는 말도,\n체념하라는 말도 아닙니다.\n다만 일이 되어 가는 것을 있는 그대로 본다는 뜻입니다.\n지금의 내 몸,\n지금의 내 마음부터,\n고치려 들지 않고 있는 그대로 한번 바라봐 줍니다.\n\n일곱 번째 마음은,\n내려놓기입니다.\n가만히 보면 마음에는 두 개의 손이 있습니다.\n좋은 것은 움켜쥐려는 손,\n싫은 것은 밀쳐 내려는 손.\n그 손이 움직이는 순간을 알아차려 봅니다.\n쥐려 하는구나.\n밀치려 하는구나.\n그 충동에서 한 걸음 물러나,\n무슨 일이 일어나는지 그저 지켜봅니다.\n쥐지도 밀치지도 않을 때,\n경험은 제 모습 그대로 왔다가 갑니다.\n\n이제 일곱 가지 마음이 가슴에 놓였습니다.\n판단하지 않고, 기다리고,\n처음처럼 보고, 나를 믿고,\n애쓰지 않고, 받아들이고,\n내려놓는 마음.\n일곱이지만 사실은 한 마음의 일곱 얼굴입니다.\n어느 하나가 익으면,\n나머지는 저절로 따라옵니다.\n\n그 마음들과 함께,\n잠시 고요히 호흡에 머뭅니다.\n\n이제 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n마지막으로 이 말을 남깁니다.\n명상이란 어딘가 별다른 곳으로 가려는 것이 아닙니다.\n이미 내가 있는 이 자리에,\n온전히 존재하는 것입니다.\n오늘 가슴에 놓은 일곱 가지 마음이,\n앉을 때마다,\n그리고 살아갈 때마다,\n그 자리로 돌아오는 디딤돌이 되어 줄 것입니다.","duration":"","tags":"#마음챙김태도 #명상의기초 #일곱가지마음","series":"숨비명상"},{"id":"8dc15309","category":"자비희사","title":"마르지 않는 샘","body":"자애는 착한 마음을 억지로 만들어 내는 일이 아닙니다.\n우리 마음 깊은 곳에는 친절과 다정함의 샘이 이미 있습니다.\n한 번도 거기 없었던 적이 없는 샘입니다.\n다만 그 위에 분주함과 자책이 덮여 있었을 뿐입니다.\n오늘 우리가 할 일은 샘을 파는 것이 아니라,\n덮인 것을 살며시 걷어 물이 저절로 흘러넘치게 하는 것입니다.\n\n편안한 자리에 앉아 등을 곧게 세우고,\n몸의 긴장을 내려놓습니다.\n잠시,\n밖에서 나를 바라보듯 지금 앉아 있는 나의 자세를 가만히 알아차립니다.\n\n이제 세 차례,\n느리고 편안하게 가슴으로 숨을 쉽니다.\n들이쉬고, 내쉬고. 들이쉬고,\n내쉬고. 들이쉬고,\n길게 내쉬고.\n몸이 이완되고 마음이 편안해지는 것을 느껴 봅니다.\n잠시 호흡의 파도에 몸을 맡기고,\n그 오르내림 위에 안정된 자리를 잡습니다.\n\n원한다면 한 손을 가슴 위에,\n혹은 몸의 편안하고 위로가 되는 곳에 얹어 봅니다.\n지금부터 나 자신에게 사랑스러운 주의를 가져온다는,\n작은 표시입니다.\n\n이제 마음속으로 떠올려 봅니다.\n살아 있는 모든 존재가 평화롭고 행복하게 살고 싶어 한다는 것을.\n길가의 새도,\n스쳐 간 사람도,\n그리고 나도.\n이 사실을 떠올리는 순간,\n가슴 어딘가에서 따뜻한 것이 가만히 고개를 듭니다.\n만들어 낸 것이 아니라,\n원래 있던 것입니다.\n\n그 느낌 속으로 들어가 봅니다.\n어머니가 아이를 품에 안듯이,\n아무 판단 없이,\n있는 그대로의 나를 그 다정함으로 안아 봅니다.\n잘한 나도, 부족한 나도,\n품 안에서는 구별이 없습니다.\n애써 붙들지 않아도 이 느낌이 스스로 이어지도록,\n그저 푹 잠겨 봅니다.\n아주 조금만 맛보아도,\n이 온기는 마음 깊은 곳의 자책과 스스로를 미워하던 버릇에 좋은 약이 됩니다.\n\n이제 호흡은 배경으로 물러나게 두고,\n샘에서 길어 올린 물을 말에 담아 봅니다.\n바람이 속삭이듯,\n천천히 마음속으로 따라 해 봅니다.\n\n내가 안과 밖의 위험으로부터 보호받고 자유롭기를.\n내가 행복하고 만족하기를.\n내가 건강하고 온전하기를.\n내가 두려움과 고통에서 벗어나기를.\n내가 안전하기를,\n편안하게 살아가기를.\n\n같은 말을 두 번 더,\n갈수록 천천히 되뇌어 봅니다.\n그리고 그 말과 말에 담긴 뜻을 가슴 가까이 가져옵니다.\n\n되뇌는 사이 어떤 감정이 일어나도 괜찮습니다.\n알아차리고,\n그대로 이어 갑니다.\n그리고 한 가지,\n무엇을 느껴야 한다는 기대도 내려놓습니다.\n뭉클해야 하는 것도,\n눈물이 나야 하는 것도 아닙니다.\n샘물은 재촉하지 않아도 제 속도로 차오릅니다.\n주의가 떠돌면 부드러운 호흡의 리듬으로 돌아오면 됩니다.\n\n이 열린 가슴으로 보면,\n신기한 일이 보입니다.\n그토록 단단하던 분노도,\n슬픔도,\n이 다정한 알아차림 앞에서는 힘을 잃습니다.\n비누 거품을 건드리면 톡,\n하고 터지듯이.\n물 위에 쓴 글씨가 이내 사라지듯이.\n싸워서 이긴 것이 아니라,\n따뜻함 속에서 저절로 풀어진 것입니다.\n\n잠시 더,\n샘가에 머물러 봅니다.\n가슴에 번지는 온기,\n그것이 나의 본래 모습입니다.\n\n이제 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n기억해 주세요.\n이 샘은 마르지 않습니다.\n자책으로 뒤덮인 날에도,\n분노로 소란한 날에도,\n샘은 그 아래에서 변함없이 솟고 있습니다.\n가슴에 손 한 번 얹고,\n내가 편안하기를,\n한마디 길어 올리는 것으로 물길은 다시 열립니다.\n그리고 이 수련의 첫 번째 수혜자는,\n언제나 나 자신입니다.","duration":"약 11분","tags":"#자애명상 #자기연민 #내면의샘","series":"숨비명상"},{"id":"dc2cb1d1","category":"호흡명상","title":"모래시계","body":"슬픔이나 분노,\n불안이나 스트레스에 압도당하는 순간이 있습니다.\n호흡이 흐트러지고,\n마음이 정신없이 날뛰는 순간.\n그럴 때를 위한 응급 명상이 있습니다.\n단 3분, 세 단계면 됩니다.\n방법은 아주 간단하지만,\n정작 그 순간에 이것을 기억해 내는 것이 진짜 도전입니다.\n그러니 오늘 몸에 익혀 두어,\n필요한 순간 저절로 꺼내지도록 연습해 보겠습니다.\n\n시작하기 전에 그림 하나를 드립니다.\n모래시계를 떠올려 보세요.\n위는 넓고,\n가운데는 잘록하고,\n아래는 다시 넓습니다.\n지금부터 우리의 의식이 이 모래시계의 모양을 따라갈 것입니다.\n넓게 열고,\n한 점으로 모으고,\n다시 넓게 여는 것.\n\n편안하고 반듯하게 앉습니다.\n가능하다면 눈을 감습니다.\n\n첫 번째 단계,\n모래시계의 넓은 윗부분입니다.\n알아차리기.\n지금 내 몸과 마음에서 무슨 일이 일어나고 있나요.\n마음의 문을 활짝 열고,\n들어오는 것은 무엇이든 맞이합니다.\n어수선한 생각,\n울렁이는 감정,\n굳어 있는 몸.\n아무것도 바꾸려 하지 않습니다.\n생각이 일어나면,\n그것을 사실이 아니라 마음속을 지나가는 하나의 사건으로 봅니다.\n지금 느끼는 것이 무엇이든,\n있는 그대로 인정하고 받아들입니다.\n아, 지금 이렇구나.\n\n두 번째 단계,\n모래시계의 잘록한 목입니다.\n한곳으로 모으기.\n활짝 열었던 주의를 이제 아랫배 한 점으로 모읍니다.\n숨이 들어오면 배가 부풀고,\n숨이 나가면 배가 꺼집니다.\n그 오르내림을 처음부터 끝까지,\n놓치지 않고 따라갑니다.\n들숨, 날숨,\n그리고 그 사이의 짧은 멈춤까지.\n마음이 다시 날뛰면,\n부드럽게 배로 돌아옵니다.\n호흡은 지금 여기에 나를 붙잡아 주는 닻입니다.\n좁은 목을 지나는 모래처럼,\n한 숨, 한 숨.\n\n세 번째 단계,\n모래시계의 넓은 바닥입니다.\n넓히기.\n배 한 점에 모았던 주의를 이제 몸 전체로 넓혀 갑니다.\n머리끝에서 발끝까지,\n몸이 차지하고 있는 공간 전체를 느껴 봅니다.\n그리고 친절한 마음으로,\n마치 온몸이 숨을 쉬고 있는 것처럼 지켜봅니다.\n숨이 들어올 때 온몸이 부풀고,\n나갈 때 온몸이 가라앉습니다.\n\n몸 어딘가에 유난히 강한 느낌이 있다면,\n바꾸려 하지 말고 그대로 알아차립니다.\n원한다면 들이쉬는 숨을 그 부위로 흘려보내고,\n내쉬는 숨과 함께 그곳이 부드러워지게 해 봅니다.\n불편한 감각과도 이렇게 친해질 수 있습니다.\n\n이제 넓어진 의식으로 확인합니다.\n나는 지금 이 세상 안에 분명하게 자리 잡고 앉아 있습니다.\n흔들리던 그 순간에도,\n평화와 위엄과 온전함을 갖춘 이 몸과 이 마음이,\n나의 자리입니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n이 3분은 현실에서 도망치는 시간이 아닙니다.\n잠시 멈추어 관점을 새로 빚은 뒤,\n같은 현실로 다르게 돌아가는 시간입니다.\n감정이 몰려와 숨이 가빠지는 순간이 오면,\n기억해 주세요. 모래시계.\n활짝 열고,\n한 점으로 모으고,\n다시 활짝 여는 세 번의 1분이,\n날뛰던 마음 한가운데 당신의 자리를 되찾아 줄 것입니다.","duration":"약 7분","tags":"#3분호흡공간 #응급명상 #모래시계명상","series":"숨비명상"},{"id":"70b3fb78","category":"수용","title":"두 날개","body":"새는 한 날개로 날 수 없습니다.\n우리 마음에도 두 개의 날개가 있습니다.\n하나는 지금 일어나는 일을 또렷이 보는 날개,\n알아차림입니다.\n다른 하나는 그것을 따뜻이 감싸 안는 날개,\n자비입니다.\n또렷이 보기만 하면 차갑고,\n안아 주기만 하면 흐릿합니다.\n두 날개가 함께 퍼덕일 때,\n마음은 비로소 날아오릅니다.\n오늘은 이 두 날개를 하나씩 펴는 연습,\n일어나는 모든 것을 통제하지도,\n판단하지도,\n피하지도 않으면서 친절하게 바라보는 연습을 함께하겠습니다.\n\n의식을 또렷이 하고 편안히 앉습니다.\n등을 바로 펴고,\n몸의 긴장을 내려놓습니다.\n눈을 감고,\n머리끝에서 발끝까지 마음의 눈으로 부드럽게 한 번 살펴봅니다.\n\n심호흡을 두세 차례 합니다.\n깊이 들이쉬고,\n길게 내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n이제 자연스러운 호흡으로 돌아옵니다.\n숨이 가장 뚜렷하게 느껴지는 곳을 찾습니다.\n콧구멍이나 인중 근처,\n오르내리는 가슴,\n불렀다 꺼지는 배.\n그 한 곳에 주의를 내려놓습니다.\n\n먼저 첫 번째 날개,\n또렷이 보는 날개를 폅니다.\n호흡을 통제하지 말고,\n붙들지도 말고,\n자연스럽게 바라봅니다.\n편안하되 깨어 있는 의식으로,\n매 순간 변해 가는 숨의 감각을 알아차립니다.\n\n생각이 떠오를 것입니다.\n쫓아낼 필요 없습니다.\n떠오르는 순간 무심히 바라봅니다.\n그래도 계속 이어지면,\n이름을 붙여 줍니다. 생각,\n생각.\n여기서 중요한 것은 목소리입니다.\n심판하듯이 아니라,\n부드럽고 친절하게.\n그리고 아무 판단 없이,\n다시 호흡으로 돌아옵니다.\n\n이제 두 번째 날개,\n따뜻이 안는 날개를 펼 차례입니다.\n앉아 있다 보면 어떤 감각이 강해져서 자꾸 신경이 쓰일 때가 있습니다.\n따끔거림, 후끈거림,\n저림이나 결림.\n그럴 때는 호흡을 잠시 두고,\n그 감각을 바라보는 대상으로 삼아도 됩니다.\n부드럽고 열린 마음으로,\n그 감각을 있는 그대로 느끼고,\n그것이 어떻게 변해 가는지 지켜봅니다.\n\n감정도 마찬가지입니다.\n두려움이, 슬픔이,\n혹은 들뜬 흥분이 크게 올라온다면,\n매달리지도 말고 밀어내지도 말고,\n그것을 바라봅니다.\n그리고 여기에 두 번째 날개를 얹습니다.\n아이를 보듬는 어머니의 사랑처럼,\n그 아픔을 감싸 안으면서 봅니다.\n이 아픔과 싸우지 않겠다.\n이 아픔을 내치지 않겠다.\n다만 곁에 있어 주겠다.\n그렇게 안긴 감각과 감정은,\n저항 속에서보다 훨씬 순하게 제 길을 갑니다.\n누그러지면,\n다시 호흡으로 돌아옵니다.\n\n이제 두 날개가 함께 움직입니다.\n또렷이 보면서,\n따뜻이 안으면서.\n무엇이 일어나든 분명히 알아차리고,\n무엇이 일어나든 친절하게 맞이합니다.\n그렇게 나는 동안 언뜻 보이는 것이 있습니다.\n이 모든 것을 보고 있는 가장 깊은 자리는 언제나 깨어 있고,\n그 바탕은 끝없이 너그럽다는 것.\n\n잠시 더,\n두 날개 위에서 고요히 머뭅니다.\n\n이제 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n오늘 어떤 생각이 떠올랐고 어떤 감각이 지나갔는지는,\n사실 중요하지 않습니다.\n우리는 다만 씨앗을 심었을 뿐입니다.\n있는 그대로 보고,\n있는 그대로 안아 주는 두 날개의 씨앗을.\n이 연습이 쌓이면,\n방석 위에서만이 아니라 살아가며 만나는 모든 경험과,\n부드럽고도 명료하게 관계 맺을 수 있게 됩니다.\n변화하며 흘러가는 삶 그 자체를,\n소중히 안고 날 수 있게 됩니다.","duration":"약 11분","tags":"#근본적수용 #마음챙김과자비 #두날개","series":"숨비명상"},{"id":"8effb66f","category":"움직임명상","title":"주고받는 숨","body":"오늘 함께할 명상은 멀리 눈 덮인 고원에서 오래 전해 내려온 특별한 숨쉬기입니다.\n들숨에 세상의 괴로움을 받아들이고,\n날숨에 자애를 내보내는 수행,\n통렌입니다.\n평소의 마음과는 방향이 반대라 처음에는 낯설 것입니다.\n우리는 좋은 것을 들이쉬고 나쁜 것을 내쉬고 싶어 하니까요.\n그 방향을 뒤집는 데에 이 수행의 힘이 있습니다.\n\n시작 전에 꼭 전할 말이 있습니다.\n지금 깊은 상처나 무거운 우울로 힘든 시간을 보내고 있다면,\n이 수행은 혼자 하기보다 믿을 만한 전문가나 스승과 함께하는 것이 좋습니다.\n그리고 오늘 하는 분들도,\n무리하지 않아도 됩니다.\n갈 수 있는 만큼만 가면 됩니다.\n\n먼저 몸이 가장 안전하고 보호받는다고 느껴지는 자리를 찾습니다.\n몸과 마음의 긴장을 내려놓고,\n고요하되 깨어 있을 수 있는 편안한 자세를 잡습니다.\n눈을 감고,\n자연스럽게 드나드는 숨결을 잠시 느껴 봅니다.\n\n준비가 되었다고 느껴지면,\n마음속에 고통받고 있는 이들을 떠올려 봅니다.\n병으로 아파하는 사람,\n소중한 것을 잃고 슬퍼하는 사람,\n가난에 지친 사람,\n마음의 병으로 혼란스러운 사람.\n그들의 괴로움을 가만히 마주합니다.\n\n이제 숨을 들이쉬며,\n그들의 고통과 아픔이 어둡고 자욱한 연기 같은 빛이 되어 콧구멍을 통해 들어온다고 상상합니다.\n그 어둠은 가슴으로 내려와,\n심장의 빛 속에서 녹아 사라집니다.\n내가 한 숨 받아들일 때마다,\n그들의 고통은 그만큼 가벼워진다고 믿어 봅니다.\n들이쉴 때마다 온몸의 세포를 천천히 열어,\n기꺼이 맞이합니다.\n\n두렵다면,\n그 두려움에게 다정하게 말을 건네도 좋습니다.\n한 손을 가슴에 얹고,\n친구가 되자고 손짓하듯 가슴을 어루만져 줍니다.\n그래도 감정이 너무 세게 밀려온다면,\n언제든 멈추십시오.\n심호흡을 두세 번 하고,\n눈을 뜨고,\n주변의 소리에 귀를 기울이면 됩니다.\n그것은 물러섬이 아니라 지혜입니다.\n\n이제 숨을 내쉽니다.\n내쉬는 숨과 함께 몸의 긴장이 풀려나가고,\n숨결이 나를 둘러싼 열린 공간으로 흘러 들어갑니다.\n그리고 상상합니다.\n내가 살아오며 누린 모든 행복과 건강과 복이,\n순수하고 환한 빛이 되어 가슴에서 쏟아져 나갑니다.\n그 빛은 숨이 끝나기도 전에 고통받는 모든 이에게 가 닿아,\n그들 속으로 녹아들고,\n그들의 아픔을 씻어 줍니다.\n내쉴 때마다,\n가장 진실한 염원을 함께 실어 보냅니다.\n부디 편안하기를.\n부디 그 고통에서 벗어나기를.\n\n이제 이 리듬을 이어 갑니다.\n들숨에, 어둠을 받아들이고.\n날숨에, 빛을 내보내고.\n들숨에, 괴로움을. 날숨에,\n자애를.\n숨이 튼튼한 버팀목이 되어 줍니다.\n\n이어 가다 보면 문득 느껴집니다.\n내 마음이 생각보다 넓다는 것을.\n이 다정하게 확장된 가슴이 세상의 두려움을 품을 수 있다는 것을.\n그리고 모든 존재가 고통에서 벗어나 환한 기쁨으로 채워지는 모습을 그려 봅니다.\n그 그림이 마음에 흐를 때,\n남이 잘되기를 진심으로 바라고 있는 자신을 발견하게 됩니다.\n\n잠시 더,\n주고받는 숨과 함께 머뭅니다.\n\n이제 평소의 숨으로 돌아옵니다.\n깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n우리가 겪는 고통의 뿌리는 나와 남을 가르는 단단한 담에 있다고 옛사람들은 말했습니다.\n숨으로 자리를 바꿔 본 오늘의 연습은 그 담을 조금 낮추어 줍니다.\n그리고 신기하게도,\n남의 짐을 기꺼이 나눠 진 마음은 더 무거워지는 것이 아니라 더 밝고 고요해집니다.\n나보다 큰 존재가 되어 보는 이 수행의 진정한 수혜자는,\n결국 나 자신입니다.","duration":"약 12분","tags":"#통렌 #자비명상 #주고받는숨","series":"숨비명상"},{"id":"96e70a0a","category":"탈중심화","title":"휘어지는 힘","body":"불안은 고장이 아닙니다.\n아주 오래전부터 위험을 알려 온 몸의 경보기입니다.\n다만 이 경보기는 지나간 일과 오지 않은 일에도 울린다는 것이 문제입니다.\n불안한 생각이 몸을 굳게 하고,\n굳은 몸이 다시 불안을 키우는 악순환.\n오늘은 그 고리를 끊는 네 개의 계단을 함께 내려가 보겠습니다.\n\n먼저 강가의 갈대를 떠올려 봅니다.\n바람이 불면 갈대는 깊이 휘어집니다.\n그러나 꺾이지 않습니다.\n바람이 지나가면 다시 일어섭니다.\n우리가 배울 것은 바람을 없애는 법이 아니라,\n갈대처럼 휘어지는 법입니다.\n\n첫 번째 계단은 숨입니다.\n편안히 앉거나 서서,\n숨을 충분히 깊게 들이마십니다.\n그리고 아주 천천히,\n들이쉰 것보다 더 길게,\n내쉽니다.\n길게 내쉬는 숨은 몸에게 보내는 신호입니다.\n지금은 안전하다.\n경보를 꺼도 된다.\n한 번 더, 깊이 들이쉬고,\n아주 천천히 내쉽니다.\n한 번 더, 들이쉬고, 길게,\n끝까지 내쉽니다.\n날숨이 길어질수록 울리던 경보가 조금씩 잦아듭니다.\n\n두 번째 계단은 감각입니다.\n몸이 조금 가라앉았다면,\n이제 눈을 뜨고 지금 이 순간으로 닻을 내립니다.\n지금 눈앞에 무엇이 보이나요.\n탁자 위 물건의 모양,\n그것의 색깔과 결을 하나하나 살펴봅니다.\n지금 무엇이 들리나요.\n창밖의 소리,\n방 안의 작은 기척.\n지금 무엇이 닿아 있나요.\n의자에 실린 몸,\n바닥을 딛은 두 발. 하나씩,\n천천히.\n여기에 비밀이 있습니다.\n불안은 과거와 미래에 살지만,\n감각은 오직 지금에만 삽니다.\n보고, 듣고, 닿는 동안,\n불안이 앉을 자리가 줄어듭니다.\n\n세 번째 계단은 움직임입니다.\n가능하다면 자리에서 일어나 몇 걸음 걸어 봅니다.\n창가로 가서 하늘을 한번 보아도 좋고,\n나갈 수 있다면 나무가 있는 길을 잠시 걸으면 더 좋습니다.\n몸이 자리를 옮기면,\n마음도 자리를 옮깁니다.\n굳어 있던 생각이 걸음을 따라 조금씩 풀립니다.\n\n네 번째 계단은 상상입니다.\n불안은 늘 최악의 그림만 그립니다.\n이제 그 붓을 잠시 건네받아,\n다른 그림을 하나 그려 봅니다.\n걱정하던 그 일이 무사히 풀린 모습.\n그 순간의 내 표정,\n놓이는 어깨, 편안한 숨.\n꼭 그렇게 되리라는 장담이 아니라,\n좋은 쪽도 있을 수 있다는 마음의 여유를 되찾는 것입니다.\n\n네 계단을 내려온 지금의 몸과 마음을 느껴 봅니다.\n바람이 완전히 멎지 않았어도 괜찮습니다.\n갈대는 바람 속에서도 서 있을 수 있습니다.\n휘어지는 것은 지는 것이 아니라,\n뿌리가 있다는 증거입니다.\n\n숨을 한 번 깊이 들이쉬고,\n길게 내쉽니다.\n\n불안의 바람은 살다 보면 또 불어올 것입니다.\n그때 기억해 주세요.\n경보가 울리기 시작하는 바로 그 순간,\n긴 날숨 하나에서 시작하면 됩니다.\n숨, 감각, 움직임, 상상.\n이 네 계단을 오르내릴 때마다 타고난 회복의 힘이 되살아나고,\n당신은 점점,\n구부러지되 꺾이지 않는 사람이 되어 갈 것입니다.","duration":"약 9분","tags":"#불안완화 #그라운딩 #회복탄력성","series":"숨비명상"},{"id":"edf602eb","category":"관찰","title":"통증의 볼륨","body":"통증과 괴로움은 같은 말 같지만,\n사실 다릅니다.\n통증은 몸이 보내는 날것 그대로의 소식입니다.\n괴로움은 그 소식 위에 마음이 얹는 것들입니다.\n싫다, 없어져라,\n왜 하필 나에게.\n옛사람들은 이것을 간단한 공식으로 남겼습니다.\n괴로움은, 통증 곱하기 저항.\n통증이 그대로여도 저항이 줄면,\n괴로움은 줄어듭니다.\n오늘은 통증과 싸우는 대신 그 곁에 앉아 보는 연습,\n내 안의 볼륨 조절기를 되찾는 연습을 하겠습니다.\n물론 심한 통증은 치료가 먼저입니다.\n이 명상은 치료를 대신하는 것이 아니라,\n함께 가는 벗입니다.\n\n몸이 가장 편한 자세를 찾습니다.\n앉아도, 누워도 좋습니다.\n통증이 있는 몸에게 오늘은 자세부터 너그럽게 허락해 줍니다.\n눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n한 번 더 들이쉬고, 내쉬며,\n마음을 가라앉힙니다.\n\n이제 지금 몸에서 불편한 곳 하나를 고릅니다.\n뻐근한 어깨, 결리는 허리,\n오래 함께해 온 통증.\n너무 큰 것 말고,\n오늘 마주 앉을 만한 하나면 됩니다.\n\n먼저 살펴볼 것은 통증이 아니라,\n통증을 대하는 내 마음입니다.\n가만히 보면 그 부위를 마음이 밀어내고 있습니다.\n싫다. 빨리 없어져라.\n그리고 몸도 그 주위를 움츠리고 조이고 있습니다.\n이것이 저항입니다.\n통증 위에 덧입혀진 두 번째 켜.\n아,\n내가 지금 싸우고 있었구나.\n그것부터 알아차립니다.\n\n생각해 보면 이상한 일입니다.\n손가락을 베이면 우리는 싸우지 않습니다.\n씻고, 약을 바르고,\n붕대를 감아 줍니다.\n그것이 타고난 자기연민입니다.\n그런데 아픔이 몸 안에 있으면 갑자기 적처럼 대합니다.\n오늘은 그 싸움을 내려놓아 봅니다.\n통증은 적이 아니라,\n몸이 보내온 소식이니까요.\n\n이제 잔물결 하나 없는 맑은 웅덩이처럼,\n그 소식을 왜곡 없이 비추어 봅니다.\n통증은 정확히 어디에 있나요.\n생각보다 좁을 수도,\n넓을 수도 있습니다.\n어떤 모양인가요. 점인가요,\n띠인가요, 덩어리인가요.\n뜨거운가요, 서늘한가요.\n욱신거리나요, 뻐근한가요,\n찌르나요.\n한 덩어리인 줄 알았던 통증이,\n자세히 보면 여러 갈래의 감각이 묶여 있는 것임을 알게 됩니다.\n\n조금 더 지켜봅니다.\n통증은 가만히 있지 않습니다.\n세졌다가, 옅어졌다가,\n자리를 조금 옮기기도 합니다.\n물결처럼 커졌다 작아졌다 하는 것이 통증의 본래 모습입니다.\n돌덩이인 줄 알았던 것이,\n사실은 물결이었습니다.\n\n원한다면 숨을 그곳으로 보내 봅니다.\n들이쉬는 숨이 그 부위를 부드럽게 감싸고,\n내쉬는 숨과 함께 그 주위의 조임이 느슨해집니다.\n없애려는 숨이 아니라,\n곁에 있어 주는 숨입니다.\n\n이제 처음과 비교해 봅니다.\n통증이 그대로 있을 수도 있습니다.\n괜찮습니다.\n그런데 무언가 달라졌을 것입니다.\n밀어내느라 쓰던 힘,\n싸우느라 조이던 몸,\n왜 하필이냐던 원망.\n그 두 번째 켜가 얇아졌습니다.\n통증은 남아 있어도,\n괴로움의 부피가 줄어든 것입니다.\n볼륨 조절기가,\n내 손에 돌아왔습니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n살아가는 동안 아픔은 또 찾아올 것입니다.\n그때 기억해 주세요.\n괴로움은 통증 곱하기 저항이라는 것을.\n통증은 우리 마음대로 할 수 없어도,\n저항은 우리가 내려놓을 수 있습니다.\n아픔이 올 때 벽처럼 맞서는 대신,\n오늘처럼 곁에 앉아 가만히 들여다봐 주세요.\n있는 그대로 바라봐 준 아픔은,\n신기하게도 제 볼륨을 스스로 낮추기 시작합니다.","duration":"약 11분","tags":"#통증명상 #만성통증 #마음챙김","series":"숨비명상"},{"id":"134bc62e","category":"수면·이완","title":"불을 끄듯이","body":"잠자리에 들기 전,\n해야 할 일들을 모두 마쳐 주세요.\n화장실도 다녀오고,\n문단속도 하고, 불도 끄고.\n이제 남은 일은 잠드는 것뿐입니다.\n그리고 오늘의 명상은 끝까지 듣지 못해도 좋습니다.\n도중에 잠들어 버린다면,\n그것이 가장 잘한 것입니다.\n\n잠이 오지 않는 밤은 대개 마음의 밧줄이 너무 팽팽한 밤입니다.\n떠오르는 생각들과 줄다리기를 하는 대신,\n오늘은 그 밧줄을 조금 느슨하게 풀어 마음에 넓은 자리를 내어 주겠습니다.\n\n이불을 덮고 등을 대고 편안히 눕습니다.\n잠시 그대로 머물며,\n침대가 몸을 받쳐 주고 있는 느낌을 음미해 봅니다.\n몸이 조금씩 이불 속으로,\n침대 속으로 파묻혀 가는 느낌.\n오늘 하루 나를 지탱하던 힘을,\n이제 침대에게 맡깁니다.\n\n코로 깊이 들이쉬고,\n입으로 길게 내쉽니다.\n내쉬는 숨과 함께 오늘 하루의 생각들이 저 멀리 흩어진다고 상상해 봅니다.\n한 번 더 들이쉬고,\n내쉬면서,\n몸의 긴장이 따뜻한 물에 녹듯 풀려 나갑니다.\n한 번 더, 들이쉬고,\n길게 내쉽니다.\n\n이제 지금의 몸과 마음이 어떤지 살펴봅니다.\n무거운지, 가벼운지,\n분주한지, 고요한지.\n생각이 떠오르면 막지 말고 그냥 떠오르게 둡니다.\n머리끝에서 발끝까지,\n몸을 천천히 훑어 내려가 봅니다.\n다시 한 번,\n머리에서 발끝까지.\n그리고 숨을 따라 배가 부풀고 꺼지는 것을 가만히 느껴 봅니다.\n\n이제 오늘 하루를 되감기해 보겠습니다.\n아침에 눈을 뜬 그 순간부터,\n마음속 화면에 하루의 장면들을 무심히 재생해 봅니다.\n자세히 볼 필요 없습니다.\n알람을 끄던 손,\n세면대 앞의 나, 아침 식탁,\n집을 나서던 길,\n누군가와 나눈 인사,\n오후의 일들, 저녁의 시간들.\n빠르게 넘어가도 좋고,\n띄엄띄엄이어도 좋습니다.\n그 장면들을 극장 뒷자리에 앉은 사람처럼 무심히 지켜봅니다.\n좋았던 장면도,\n아쉬운 장면도,\n평가 없이 흘려보냅니다.\n하루가 그렇게 처음부터 끝까지 한 번 지나갑니다.\n오늘 하루는 이제 다 본 영화입니다.\n막이 내립니다.\n\n이제 다시 지금 이 순간,\n이불 속의 몸으로 돌아옵니다.\n지금부터는 하루 종일 켜져 있던 몸의 불을 하나씩 꺼 보겠습니다.\n\n가장 먼저,\n왼발 새끼발가락입니다.\n그 작은 곳에 주의를 두고,\n스위치를 끄듯 힘을 뺍니다.\n마음속으로 말해 주어도 좋습니다.\n이제 쉬자.\n새끼발가락의 불이 꺼지고,\n이어서 왼발 전체, 발목,\n종아리, 허벅지,\n엉덩이와 골반까지,\n불이 하나씩 꺼져 갑니다.\n\n이번에는 오른발 새끼발가락입니다.\n이제 쉬자. 오른발 전체,\n발목, 종아리, 허벅지,\n골반까지,\n차례차례 어두워집니다.\n\n허리의 불을 끕니다.\n가슴의 불을 끕니다.\n두 팔을 따라 내려가,\n손바닥,\n손가락 끝까지 꺼 줍니다.\n목구멍, 목, 얼굴,\n그리고 머리.\n마지막 불이 사르르 꺼집니다.\n\n이제 온 집이 고요하고 어둡습니다.\n긴장이 풀려 나간 자리,\n아무것도 붙잡지 않아도 되는 이 느낌을 그저 누립니다.\n이제부터는 마음이 이 생각 저 생각 떠돌아도 내버려 두세요.\n붙잡을 것도,\n돌아올 곳도 없습니다.\n오늘 밤 해야 할 일은 아무것도 남지 않았습니다.\n\n몸은 침대에게,\n하루는 어둠에게 맡기고,\n그렇게, 천천히, 잠 속으로,\n걸어 들어갑니다.\n\n편안한 밤 되세요.","duration":"약 15분","tags":"#수면명상 #잠들기전명상 #깊은잠","series":"숨비명상"},{"id":"da2a3efb","category":"호흡명상","title":"산처럼 앉기","body":"명상의 절반은 앉음새에 있습니다.\n몸이 안정되어야 마음이 내려앉고,\n자세가 바로 서야 호흡이 깊어집니다.\n오늘은 서두르지 않고,\n산처럼 앉는 법부터 차근차근 익힌 뒤,\n그 산 위에서 첫 집중을 훈련해 보겠습니다.\n\n먼저 자리를 잡습니다.\n바닥이라면 방석 위에 다리를 포개어 편안히 앉고,\n의자라면 두 발을 바닥에 가지런히 댑니다.\n\n척추를 폅니다.\n억지로 꼿꼿이 세우는 것이 아니라,\n정수리에 실 한 가닥이 하늘로 이어진 듯,\n자연스럽게 곧게.\n\n두 손은 허벅지 위에 가만히 올리고,\n팔과 어깨의 힘을 스르르 뺍니다.\n\n턱은 가볍게 당깁니다.\n눈은 힘을 빼고,\n시선은 눈앞 한 걸음 반쯤 되는 바닥에 부드럽게 내려놓습니다.\n감고 싶다면 감아도 좋습니다.\n\n얼굴의 긴장을 풀고,\n꽉 물린 턱도 풀고,\n혀의 긴장까지 풀어서,\n혀끝을 윗니 바로 뒤에 가볍게 대어 둡니다.\n\n이렇게 앉은 몸을 한번 느껴 봅니다.\n아래는 산자락처럼 넓고 든든하게 땅에 뿌리내렸고,\n척추는 산줄기처럼 하늘로 솟았으며,\n머리는 봉우리처럼 고요합니다.\n당신은 지금,\n산처럼 앉아 있습니다.\n\n이 산 위에서 호흡을 시작합니다.\n숨은 바다의 파도와 같아서,\n쉼 없이 드나들며 생명을 맑게 순환시킵니다.\n그 파도에 마음을 모읍니다.\n부드럽게, 그러나 단호하게.\n이 두 마디가 오늘의 요령입니다.\n다그치지 않되,\n흐지부지하지도 않게.\n\n집중해 보면 곧 알게 됩니다.\n마음이 뜻대로 되지 않는다는 것을.\n호흡에 두려 해도 마음은 제멋대로 내달립니다.\n길들지 않은 야생의 마음입니다.\n괜찮습니다.\n산은 허둥대지 않습니다.\n마음이 달아난 것을 알아차리면,\n부드럽게, 그러나 단호하게,\n다시 호흡으로 데려옵니다.\n한 번, 또 한 번.\n이 되풀이가 바로 마음을 길들이는 훈련입니다.\n\n그렇게 몇 번이고 데려오다 보면,\n들숨과 날숨이 고르고 안정된 흐름을 잡아 갑니다.\n호흡이 깊어지고,\n그 안정에서 생긴 힘과 여유가 온몸으로 퍼져 나가,\n몸 전체가 은은하게 깨어 있게 됩니다.\n\n앉아 있는 동안 온갖 생각이 지나갈 것입니다.\n여기서 하나 알아 둘 것이 있습니다.\n그 생각들은 명상이 만들어 낸 것이 아닙니다.\n원래 마음속에 살고 있던 것들이,\n고요해진 수면 위로 비로소 비쳐 보이는 것입니다.\n그래서 호흡은 마음을 들여다보는 거울이 됩니다.\n거울에 비친 것을 탓하지 말고,\n비추어 주는 것에 고마워하며,\n다시 숨으로 돌아옵니다.\n\n지나가는 생각들은 대개 두 방향입니다.\n지나간 일과, 오지 않은 일.\n돌아봄도,\n계획도 살아가는 데 필요한 일입니다.\n하지만 그 돌아봄도,\n그 계획도,\n오직 지금 여기에서만 할 수 있습니다.\n과거는 이미 지났고 미래는 아직 오지 않았으며,\n우리가 살 수 있는 곳은 언제나 현재뿐입니다.\n산이 언제나 지금 이 자리에 서 있듯이.\n\n잠시 더,\n산처럼 앉아 파도 같은 숨과 함께 머뭅니다.\n\n이제 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 시선을 들고 몸을 가볍게 풀어 줍니다.\n\n매일 같은 시간,\n같은 자리에 이렇게 앉아 보세요.\n앉을 때마다 산은 조금씩 단단해지고,\n마음의 야생마는 조금씩 순해집니다.\n그리고 산처럼 앉는 법을 아는 사람은,\n삶의 파도가 밀려와도 명료한 눈으로 그 파도를 끌어안을 수 있습니다.","duration":"약 11분","tags":"#명상자세 #좌선입문 #산처럼앉기","series":"숨비명상"},{"id":"1250ba96","category":"호흡명상","title":"생명의 호흡","body":"오늘 함께할 명상은 단순하지만 가장 보편적인 방법입니다.\n동양과 서양,\n여러 전통이 저마다의 이름으로 지켜 온 하나의 문,\n호흡과 하나 되기입니다.\n\n방석이나 의자에 편안하게 앉습니다.\n방석이라면 가부좌도 좋고,\n책상다리도 좋습니다.\n어떤 자세든 안정되게 앉는 것이 중요합니다.\n몸의 중심이 잡혀야 뒤척이지 않고 고요히 앉을 수 있고,\n몸이 안정되어야 마음이 고요해집니다.\n\n가부좌를 한다면 엉덩이 뒷부분을 조금 높여 무릎이 바닥을 향하게 합니다.\n방석을 접거나 겹쳐서,\n편안하고 안정될 때까지 높낮이를 조절해 보세요.\n\n자세가 잡혔으면 등을 자연스럽게 폅니다.\n너무 힘주지 말고,\n살짝 긴장을 풀어 숨이 부드럽게 몸을 지나가게 합니다.\n등이 구부러지면 졸음이 몰려오기 쉽습니다.\n그리고 정말 졸음이 쏟아진다면,\n억지로 버티기보다 잠깐 누워 자는 편이 낫습니다.\n잠은 잠대로 소중하고,\n명상은 깨어서 하는 다른 일이니까요.\n\n이제 두 눈을 편안하게 감습니다.\n그리고 지금 이 순간을 느껴 봅니다.\n무엇이 느껴지나요.\n\n몸부터 느껴 봅니다.\n어딘가 긴장하고 있나요.\n편안하게 풀려 있나요.\n주변에서 들려오는 소리에도 잠시 귀를 기울여 봅니다.\n그리고 마음의 움직임,\n이 순간의 감정과 생각,\n무언가를 기대하는 마음까지 느껴 봅니다.\n이것이 당신의 삶입니다.\n지금 느껴지는 감각과 감정과 생각이,\n바로 삶입니다.\n\n이제 그 삶의 한가운데서,\n숨 쉬고 있는 나를 느껴 봅니다.\n숨을 들이쉬고, 내쉬는,\n이 오래된 움직임을.\n\n들이쉴 때 공기가 코와 목을 시원하게 지나갑니다.\n가슴이 부드럽게 움직이고,\n배가 불렀다가 꺼집니다.\n호흡을 조절하거나 바꾸려 하지 말고,\n있는 그대로 느껴 봅니다.\n그냥 지켜봅니다.\n숨이 들어오고, 숨이 나가고.\n이것이 생명의 호흡입니다.\n\n잠시,\n숨이 들어오고 나가는 것을 그대로 느껴 봅니다.\n숨은 코에서 느껴지기도 하고,\n배에서 느껴지기도 하고,\n때로는 온몸이 함께 숨 쉬는 것처럼 느껴지기도 합니다.\n어디든 좋습니다.\n호흡이 스스로의 리듬대로 움직이게 두고,\n따라만 갑니다.\n\n마음은 곧 여기저기 떠돌 것입니다.\n생각과 계획과 기억이 떠오를 때마다,\n그 안으로 빠져들지 말고 다시 호흡으로 돌아옵니다.\n\n집중이 잘되지 않는다면,\n작은 도움을 써도 좋습니다.\n숨을 들이쉬며, 안으로.\n내쉬며, 밖으로.\n마음속으로 되뇝니다. 단,\n이 말에는 마음의 5%만 쓰고,\n나머지 95%는 지금 나를 살아 있게 하는 이 숨의 느낌에 둡니다.\n\n안으로, 밖으로.\n숨이 들어오고, 숨이 나가고.\n코와 목이 시원해지고,\n배가 불렀다가 꺼지고,\n온몸이 호흡을 따라 조용히 움직입니다.\n\n이제 마지막으로 잠시 동안,\n아무 안내 없이 호흡에만 온전히 집중해 봅니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n이 문은 언제나 열려 있습니다.\n수천 년 동안 수많은 사람이 저마다의 자리에서 이 문으로 들어가 고요를 만났습니다.\n당신의 숨이 있는 곳이면 어디든,\n그 문이 있습니다.","duration":"약 8분","tags":"#호흡명상 #호흡과하나되기 #생명의호흡","series":"숨비명상"},{"id":"99d16457","category":"관찰","title":"그 순간의 명상","body":"지난 시간,\n호흡과 하나 되는 법을 익혔습니다.\n그런데 앉아 보면 곧 알게 됩니다.\n편안히 앉아 있어도 몸은 이런저런 방식으로 힘들어진다는 것을.\n가렵고, 결리고, 저리고,\n쑤십니다.\n오늘은 그 모든 것이 방해가 아니라 명상의 재료가 되는 법을 배워 보겠습니다.\n\n안정되고 편안한 자세로 앉습니다.\n척추를 누군가 위에서 살짝 잡아당기는 느낌으로,\n허리를 바르게 폅니다.\n눈과 얼굴의 긴장을 풀고,\n어깨와 손은 자연스럽게 편안히 둡니다.\n\n이제 명상의 중심을 정합니다.\n숨이 가장 잘 느껴지는 한 곳이면 됩니다.\n배가 불렀다 꺼지는 느낌이어도 좋고,\n코로 숨이 지나가는 느낌이어도 좋습니다.\n그 한 곳을 오늘의 집으로 삼습니다.\n\n그 집에서 호흡을 지켜봅니다.\n길면 긴 대로,\n짧으면 짧은 대로,\n얕으면 얕은 대로,\n깊으면 깊은 대로,\n자연스럽게 숨 쉬면서 관찰합니다.\n한 호흡의 시작과 중간과 끝을 따라가 봅니다.\n\n앉아 있다 보면 어느 순간,\n강렬한 감각이 찾아올 것입니다.\n참기 힘든 가려움,\n무릎의 통증, 어깨의 결림,\n코끝에 파리가 앉은 듯한 간지러움.\n그 부위가 뜨겁거나 차갑게 느껴지기도 합니다.\n\n바로 그때가 중요한 순간입니다.\n그 감각이 아주 강해지면,\n호흡은 잠시 잊어버려도 됩니다.\n그리고 그 부위로 가서,\n충분히 느껴 봅니다.\n거부하지 말고,\n싫어하지 말고, 있는 그대로.\n\n그리고 이름을 붙여 봅니다.\n두 번씩, 가만히. 가려움,\n가려움. 뜨거움, 뜨거움.\n통증, 통증. 콕콕 쑤심,\n콕콕 쑤심.\n어떤 이름이라도 좋습니다.\n\n이름을 붙이고 최대한 집중해서 느껴 봅니다.\n어떤 느낌인가요.\n그리고 편안한 마음으로,\n그 느낌이 변해 가는 것을 지켜봅니다.\n아무리 강한 감각도 가만히 지켜보면 세졌다가,\n옅어졌다가,\n어느새 모습을 바꿉니다.\n\n느낌이 사라지면,\n다시 호흡의 집으로 돌아옵니다.\n또 강한 느낌이 오면,\n또 그리로 가서 느끼고,\n이름 붙이고,\n사라지면 돌아옵니다.\n이것이 그 순간의 명상입니다.\n\n여기서 오늘의 비밀이 드러납니다.\n명상의 중심은 못 박아 둔 한 곳이 아닙니다.\n지금 이 순간 가장 생생하게 살아 있는 것,\n그것이 그 순간의 중심입니다.\n호흡이 잔잔할 때는 호흡이 중심이고,\n가려움이 소리칠 때는 가려움이 중심입니다.\n방해인 줄 알았던 것들이,\n이렇게 하나씩 명상의 문이 됩니다.\n\n마음이 이리저리 떠돌더라도 곧바로 알아차리고,\n호흡으로 돌아옵니다.\n지금 이 순간의 호흡,\n지금 이 순간의 느낌.\n\n이제 마지막으로 잠시,\n안내 없이 지금 이 순간에 머물러 봅니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n오늘 배운 것을 가져가시기 바랍니다.\n앉아 있을 때만이 아니라 살아갈 때도 같습니다.\n지금 가장 크게 느껴지는 것,\n그것을 피하지 않고 마주 보고 이름 붙여 주는 것.\n삶의 매 순간이 그렇게,\n그 순간의 명상이 됩니다.","duration":"약 9분","tags":"#위빠사나 #감각알아차림 #그순간의명상","series":"숨비명상"},{"id":"d07b1a21","category":"관찰","title":"몸에 남은 하루","body":"하루는 그냥 사라지지 않습니다.\n몸에 남습니다.\n바빴던 오전은 어깨의 긴장으로,\n애썼던 오후는 굳은 턱과 얼굴로,\n마음 쓰였던 일들은 가슴의 답답함이나 가라앉은 기분으로.\n오늘은 그렇게 몸에 남은 하루를 가만히 읽고,\n풀어 주는 시간을 가져 보겠습니다.\n\n몸이 고요해지도록 편안하고 안정된 자세로 앉습니다.\n눈을 부드럽게 감고,\n허리를 바로 세우고,\n편안하게 호흡합니다.\n\n이제 지금의 몸에 집중합니다.\n무엇이 느껴지나요.\n뻣뻣함인가요, 피로인가요,\n의외의 가벼움인가요.\n지금 느껴지는 그것이,\n당신이 보낸 오늘 하루의 느낌입니다.\n몸은 하루를 기억하고 있습니다.\n\n읽었다면, 이제 풀어 줍니다.\n눈과 얼굴의 긴장을 풀고,\n턱에서 힘을 뺍니다.\n어깨의 긴장을 풀고,\n팔과 손을 자연스럽게 둡니다.\n가슴과 배의 긴장도 편안하게 풀어 버립니다.\n\n몸이 느슨해졌다면,\n이번에는 기분을 읽어 봅니다.\n지금 어떤 기분인가요.\n초조한가요, 졸린가요,\n평화로운가요. 기억해 주세요.\n좋은 기분도,\n나쁜 기분도 없습니다.\n판단하지 말고,\n그냥 느껴지는 대로 느낍니다.\n\n그리고 그 모든 것의 밑바닥에서,\n숨이 쉬어지고 있다는 사실을 자각합니다.\n어떤 감정이 있든,\n어떤 생각이 지나가든,\n이 숨은 쉬어지고 있습니다.\n생명의 호흡입니다.\n길면 긴 대로,\n짧으면 짧은 대로,\n있는 그대로 느끼면서,\n호흡 위에서 몸과 마음이 하나로 만나게 합니다.\n\n호흡에 머물다 보면,\n강한 것이 찾아올 것입니다.\n따갑거나 저린 몸의 감각일 수도 있고,\n이번에는 마음의 것일 수도 있습니다.\n문득 차오르는 슬픔,\n스치는 두려움, 잔잔한 기쁨.\n그럴 때는 호흡을 잠시 잊어버려도 됩니다.\n\n찾아온 그것에 마음을 열고,\n이름을 붙여 줍니다. 가려움.\n따가움. 슬픔. 기쁨.\n그리고 지켜봅니다.\n계속 느껴지나요.\n점점 세지나요.\n이제 옅어지나요. 그 느낌,\n그 감정과 함께 있어 줍니다.\n쫓아내지도, 붙들지도 않고,\n그것이 스스로 사라질 때까지.\n그런 다음,\n다시 호흡으로 돌아옵니다.\n\n마음이 공상에 빠지거나 지난 일을 맴돌 수도 있습니다.\n얼른 알아차리고,\n지금의 호흡이나 지금의 감각으로 돌아옵니다.\n\n이 순간을, 깊이 자각합니다.\n\n이제 잠시,\n안내 없이 이 순간에 머뭅니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n앉기 전의 몸과 지금의 몸을 비교해 보세요.\n읽어 주고 풀어 준 하루는,\n몸에 얹힌 채 잠자리까지 따라오지 않습니다.\n매일 저녁 잠깐,\n몸이라는 일기장을 이렇게 펼쳐 읽어 주세요.\n하루를 몸에서 내려놓은 사람만이,\n가벼운 몸으로 내일을 맞이합니다.","duration":"약 9분","tags":"#저녁좌선 #감정알아차림 #몸과마음","series":"숨비명상"},{"id":"1964ee14","category":"관찰","title":"안개가 걷히듯","body":"지난 시간들 동안 호흡에 머무는 법,\n강한 감각과 감정을 다루는 법을 익혔습니다.\n오늘은 마지막 손님,\n생각을 만납니다.\n생각은 손님 가운데 가장 힘이 셉니다.\n감각은 몸에 머물지만,\n생각은 우리를 통째로 과거와 미래로 데려가 버리니까요.\n하지만 생각에게는 약점이 하나 있습니다.\n알아차림의 햇살을 견디지 못한다는 것.\n오늘 그것을 직접 확인해 보겠습니다.\n\n편안하고 바른 자세로 앉습니다.\n호흡을 명상의 중심으로 삼고,\n한 호흡의 시작과 중간과 끝에 집중합니다.\n숨은 짧을 수도, 길 수도,\n아주 고요할 수도 있습니다.\n어떤 감각이 함께하는지 살펴봅니다.\n\n몸에서 강한 감각이 느껴지거나,\n소리가 들리거나,\n강렬한 기분이 들면,\n배운 대로 합니다.\n잠시 호흡을 잊고,\n그것에 집중하며 이름을 붙입니다.\n그리고 사라지면 돌아옵니다.\n\n이제 오늘의 연습입니다.\n호흡을 지켜보는 동안,\n어느 순간 어떤 생각이 강하게 떠올라 그 안에 빠져 있는 자신을 발견할 것입니다.\n눈앞에 그려지는 광경일 수도,\n맴도는 말일 수도,\n지난 기억일 수도,\n내일의 계획일 수도 있습니다.\n\n빠져 있음을 알아차린 그 순간,\n이름을 붙여 줍니다.\n간단하게. 생각, 생각.\n계획, 계획. 기억, 기억.\n\n그리고 지켜봅니다.\n신기한 일이 일어납니다.\n대개의 생각은 알아차려지는 순간,\n사라집니다.\n아침 햇살이 비치면 안개가 걷히듯이.\n그토록 자욱하던 것이,\n바라보는 빛 한 줄기에 스르르 흩어집니다.\n생각이 사라지면,\n다시 호흡으로 돌아갑니다.\n\n물론 끈질긴 생각도 있습니다.\n심각하고 강렬해서 한 번의 이름으로는 물러가지 않는 생각.\n그럴 때는 고요하게 지켜보면서,\n사라질 때까지 계속 불러 줍니다.\n생각, 생각, 생각. 기억,\n기억, 기억.\n아무리 짙은 안개도,\n햇살이 머무는 동안은 버티지 못합니다.\n\n그리고 어떤 날은 생각이 홍수처럼 밀려들기도 합니다.\n너무 복잡하거나 여러 생각이 한꺼번에 쏟아질 때는,\n하나하나 이름 붙이려 애쓰지 마십시오.\n그럴 때는 호흡에만 집중합니다.\n호흡은 언제나 돌아갈 수 있는 피난처입니다.\n\n이제 리듬이 보일 것입니다.\n잔잔할 때는, 호흡에 머물고.\n강한 것이 찾아오면,\n이름 붙여 지켜보고.\n사라지면, 다시 호흡으로.\n이 단순한 오감을 반복합니다.\n\n호흡에 귀 기울여 집중합니다.\n이 순간의 호흡을 느낍니다.\n지금 여기에 머뭅니다.\n아무것도 변화시키려 하지 말고,\n부드럽고 주의 깊게.\n\n잠시,\n안내 없이 머물러 봅니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n오늘 이후,\n생각과의 관계가 조금 달라질 것입니다.\n지금까지는 생각이 부르면 어디든 따라가는 하인이었다면,\n이제는 생각이 와도 이름을 불러 주고 지켜볼 수 있는 사람이 되었습니다.\n생각은 여전히 찾아오겠지만,\n기억해 주세요.\n알아차림의 햇살 아래서,\n안개는 오래 머물지 못합니다.","duration":"약 9분","tags":"#생각알아차림 #이름붙이기 #위빠사나","series":"숨비명상"},{"id":"af8645a9","category":"용서감사","title":"산들바람","body":"편안하게 자리를 잡고,\n눈을 부드럽게 감습니다.\n그리고 호흡을 바라봅니다.\n숨이 들어오고 나가는 것이,\n부드러운 산들바람 같습니다.\n강물 위를 고요히 스치는 바람처럼,\n호흡이 온몸을 지나갑니다.\n조절하지 말고,\n자연스럽고 편안하게.\n숨이 오갈 때 생겨나는 아주 작은 움직임까지,\n가만히 느껴 봅니다.\n\n이 고요함 속에서,\n오늘은 용서의 명상을 하려고 합니다.\n먼저 정직하게 말씀드리겠습니다.\n이 명상은 오늘 당장 도움이 될 수도 있고,\n그렇지 않을 수도 있습니다.\n하지만 시간이 흐를수록 그 가치가 드러나는 명상입니다.\n그러니 조급함 없이,\n산들바람의 속도로 가 보겠습니다.\n\n온몸과 마음으로 호흡을 느끼면서,\n가슴을 열고 부드럽게 숨 쉽니다.\n\n첫 번째 바람은 용서를 청하는 바람입니다.\n살아오며 생각으로, 말로,\n행동으로,\n일부러 혹은 모르고 누군가에게 상처를 주었던 일을 떠올려 봅니다.\n그리고 헤아려 봅니다.\n그때의 나는 왜 그랬을까.\n우리는 자신의 고통과 두려움 때문에 미숙하게 행동합니다.\n아프고 혼란스러운 사람이,\n저도 모르게 남을 아프게 합니다.\n그 사람을 향해,\n마음속으로 용서를 청합니다.\n미안합니다.\n나를 용서해 주세요.\n\n두 번째 바람은 가장 깊은 곳으로 붑니다.\n나 자신을 향해서입니다.\n가만히 돌아보면,\n우리는 누구보다 자기 자신에게 심하게 대했습니다.\n다그치고, 탓하고,\n두려움과 고통,\n알지 못함과 게으름 속에서 이 소중한 자신을 돌보지 않았습니다.\n\n이제 나를 용서할 시간입니다.\n용서란,\n가슴에 둘러친 벽을 허물고 자신을 가슴으로 끌어안는 것입니다.\n용서받는 장면을 떠올려 보세요.\n굳어 있던 내가 따뜻한 품에 안기는 장면을.\n마음을 최대한 부드럽게 합니다.\n그리고 들어 주세요.\n당신은 용서받을 자격이 있습니다.\n용서만이 당신의 마음을 열 수 있습니다.\n나를 용서합니다. 나를,\n용서합니다.\n\n세 번째 바람은 바깥을 향해 붑니다.\n이번에는 내가 다른 사람에게 받았던 상처와 슬픔을 떠올려 봅니다.\n그 상처를 대하느라 마음은 돌처럼 굳고,\n분노로 냉담해졌습니다.\n그런데 그들도 그랬던 것입니다.\n두려움과 고통과 혼란에 빠진 사람들이,\n알게 모르게 나에게 상처를 주었습니다.\n나와 같은 아픈 사람들이었습니다.\n\n상처 입고 분노했던 그 장소,\n그 일을 떠올려 봅니다.\n그리고 그 굳은 기억을,\n다정한 손길로 어루만지듯 용서해 봅니다.\n할 수 있는 만큼, 최대한.\n분노를 떠나보낼 때가 되었습니다.\n당신을 용서합니다.\n할 수 있는 만큼,\n당신을 용서합니다.\n\n세 갈래의 바람이 지나간 가슴을 느껴 봅니다.\n돌처럼 굳었던 자리가 조금 부드러워졌을지도 모릅니다.\n바로 지금, 나 자신도,\n내 곁의 사람들도,\n온 세상도,\n용서와 자비와 마음에서 우러난 사랑을 기다리고 있습니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n산들바람은 바위를 부수지 않습니다.\n다만 쉬지 않고 불어서,\n가장 단단한 것도 언젠가 부드럽게 어루만져 놓습니다.\n용서도 그렇습니다.\n오늘 다 되지 않아도,\n이 바람을 계속 불게 해 주세요.\n용서하고, 사랑하십시오.","duration":"약 10분","tags":"#용서명상 #자기용서 #산들바람","series":"숨비명상"},{"id":"731c2e42","category":"자비희사","title":"지구를 안고","body":"오늘은 사랑의 명상입니다.\n지금까지의 지켜보는 명상들을 보완해 주는 명상으로,\n좌선을 시작할 때나 마칠 때 하면 친절하고 다정한 기운이 자리에 감돕니다.\n오늘 우리는 이 가슴이 얼마나 커질 수 있는지 확인하게 될 것입니다.\n한 사람의 가슴이 지구를 품는 데까지.\n\n편안하게 앉아,\n부드럽게 눈을 감습니다.\n몸의 긴장을 풀면서 편안하게 호흡합니다.\n\n가슴에 집중합니다.\n가슴으로 호흡을 느껴 봅니다.\n숨이 가슴 한가운데로 들어오고 나가는 것을 느껴 봅니다.\n\n사랑의 명상은 언제나 나 자신에서 시작합니다.\n나의 어떤 점을 미워하고 받아들이지 못하는 한,\n다른 사람을 사랑하기도 어렵기 때문입니다.\n이제 들려드리는 말과 함께,\n사랑의 느낌을,\n사랑의 감각을 가슴에서 키워 봅니다.\n\n내 안에 사랑이 가득하기를 바랍니다.\n나의 가슴이 친절과 평화로 가득 차기를 바랍니다.\n\n당신은 그만한 가치가 있습니다.\n그리고 모든 존재 또한 그러합니다.\n\n나의 갈등과 슬픔에도 연민을 보내 봅니다.\n우리에게는 모두 나름의 고통과 슬픔이 있으니까요.\n마음을 열고,\n사랑과 연민으로 이 슬픔과 만나기를 바랍니다.\n\n기억해 주세요.\n당신도 한때는 아무것도 하지 않아도 무조건 사랑받던 아이였습니다.\n아이는 사랑받기 위해 존재합니다.\n지금의 나와,\n내 안의 그 아이를,\n사랑의 마음으로 껴안아 줍니다.\n몸의 모든 느낌,\n모든 감정과 생각까지,\n사랑으로 받아들입니다.\n내가 평화롭기를 바랍니다.\n\n이제 가슴이 조금 넓어졌습니다.\n사랑하는 사람들을 그 안으로 불러들입니다.\n얼굴을 하나하나 떠올리며,\n이 따뜻함을 함께 나눕니다.\n\n그들이 사랑으로 가득하기를 바랍니다.\n그들의 마음이 열리고 행복하기를 바랍니다.\n\n그들의 슬픔과 갈등도 함께 느껴 봅니다.\n그리고 내가 그들을 얼마나 사랑하는지도.\n사랑하는 다른 이들도 계속 불러들입니다.\n한 사람이 들어올 때마다,\n사랑의 마음이 점점 더 커집니다.\n\n가슴이 더 넓어져,\n이제 이 방을 가득 채웁니다.\n이곳이 사랑의 바다가 되어,\n세상의 모든 기쁨과 슬픔을 받아들이고,\n이해하고,\n사랑하게 되기를 바랍니다.\n\n그리고 이제,\n방보다 더 커집니다.\n사랑의 마음이 온 사방으로 퍼져 나가 지구를 가득 채웁니다.\n그러자 신기한 일이 일어납니다.\n지구가 작은 공처럼,\n내 가슴에 안겨 있습니다.\n\n그 작은 공 위의 모든 것을 느껴 봅니다.\n큰 바다와 넓은 대륙,\n커다란 고래와 작은 물고기들,\n새와 곤충, 풀과 나무,\n정글과 사막, 동물과 사람들.\n지구에 있는 모든 존재를,\n사랑과 연민으로 껴안습니다.\n\n세상의 모든 존재가 사랑을 느끼기를 바랍니다.\n갓 태어난 아기도,\n즐거워하는 사람도,\n슬픔에 괴로워하는 사람도,\n삶과 죽음의 경계에 서 있는 사람도,\n모든 존재가 사랑과 연민의 힘으로 고통에서 벗어나기를 바랍니다.\n우리 마음의 힘과 선함과 사랑으로,\n세상이 빛으로 가득하고,\n우리의 삶과 모든 존재가 자유로워지기를 바랍니다.\n\n잠시,\n지구를 품은 가슴으로 고요히 머뭅니다.\n\n이제 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n품었던 지구를 제자리에 살며시 내려놓고,\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n오늘 확인하셨듯이,\n가슴은 원래 이렇게 큽니다.\n평소에 작게 접혀 있었을 뿐입니다.\n앉을 때마다,\n시작하거나 마칠 때 잠깐이라도 이 사랑의 명상을 펼쳐 주세요.\n접혀 있던 가슴이 펴질 때마다,\n당신과 세상은 그만큼 따뜻해집니다.","duration":"약 11분","tags":"#사랑의명상 #자애명상 #지구를안고","series":"숨비명상"},{"id":"3c106fa6","category":"수면·이완","title":"아침의 선물","body":"우리에겐 선물처럼 매일 새로운 아침이 주어집니다.\n지금부터 그 선물을 열어 보는 짧은 명상을 함께하겠습니다.\n\n침대 위여도 좋고,\n지하철이나 버스 안이어도 좋습니다.\n지금 있는 그 자리에서,\n평화로운 하루를 시작할 수 있습니다.\n\n편안한 자세를 찾아보세요.\n어깨를 살짝 늘어뜨리고,\n눈을 감습니다.\n눈을 감기 어려운 곳이라면,\n시선을 아래로 부드럽게 내려도 좋습니다.\n\n이제 가볍게 호흡합니다.\n들이쉬고, 내쉬고.\n코로 숨이 들어왔다 나가는 느낌을 가만히 따라가 봅니다.\n\n어떤 생각이 떠오르거나 잠시 주의가 흐트러져도 괜찮습니다.\n알아차리고,\n다시 숨으로 돌아오면 됩니다.\n\n들이쉬고, 내쉬고. 들이쉬고,\n내쉬고.\n몸과 마음이 편안해질 때까지,\n이 호흡에 잠시 머뭅니다.\n\n이제 마음을 여는 말들을 함께 따라 해 보겠습니다.\n소리 내어 말해도 좋고,\n소리 낼 수 없는 곳이라면 마음속으로만 따라 해도 충분합니다.\n한 문장, 한 문장,\n천천히 스며들게 합니다.\n\n나는 늘 건강하고 활기차며,\n언제나 감사하는 마음으로 식사를 합니다.\n\n나의 가족은 언제나 건강하고 활력이 넘치며,\n서로 믿고, 서로 사랑합니다.\n\n나는 직장에서 즐겁게 일하며,\n내가 하는 일에 감사를 느낍니다.\n나는 나의 일에 자부심을 느끼고,\n동료들을 신뢰하고 사랑합니다.\n\n나는 늘 풍요롭고,\n부는 필요한 만큼 생깁니다.\n\n나는 언제나 기쁘고 평화롭습니다.\n지금 어렵다고 느끼는 일도,\n결국은 좋은 열매가 될 것임을 나는 압니다.\n\n나는 매일 편안하게 잠들고,\n상쾌한 기분으로 일어납니다.\n\n나는 모든 이를 사랑하고,\n모든 것에 감사합니다.\n\n아, 감사합니다.\n내가 바라는 모든 것이 이미 이루어져 있음에 감사합니다.\n\n이 말들의 여운을 가슴에 잠시 담아 둡니다.\n말이 지나간 자리에 따뜻한 기운이 남아 있습니다.\n\n이제 깊이 숨을 들이쉬고,\n길게 내쉽니다.\n준비가 되면 천천히 눈을 뜹니다.\n\n오늘 아침의 이 잠깐이,\n하루 전체를 데워 주는 작은 불씨가 되어 줄 것입니다.\n선물처럼 받은 오늘 하루를,\n순수한 즐거움과 평화로 가득 채워 보세요.","duration":"약 7분","tags":"#아침명상 #확언명상 #하루의시작","series":"숨비명상"},{"id":"d9af23ab","category":"관찰","title":"하루 세 번","body":"명상할 시간이 없다고 말하곤 하지만,\n사실 우리에게는 하루 세 번,\n명상 자리가 차려집니다.\n바로 식탁입니다. 천천히,\n알아차리며 먹는 것.\n그것만으로 식사는 몸을 살리는 시간이자 감사와 기쁨을 배우는 명상이 됩니다.\n오늘은 그 식탁 명상의 네 가지 열쇠를 전해 드리겠습니다.\n\n첫 번째 열쇠는,\n생각 라디오 끄기입니다.\n식사할 때 몸은 식탁 앞에 멈추어 있지만,\n머릿속 라디오는 쉬지 않고 방송 중입니다.\n지난 일을 곱씹는 채널,\n내일을 걱정하는 채널,\n화와 짜증이 흘러나오는 채널까지.\n그 소리에 붙들려 있으면 몸 따로,\n마음 따로인 채 밥이 넘어갑니다.\n\n숟가락을 들기 전,\n마음속 라디오의 스위치를 딸깍,\n꺼 봅니다.\n방송이 멎은 자리에 텅 빈 자유로움이 찾아옵니다.\n그 고요 속에서,\n지금 먹는 일에만 온전히 마음을 둡니다.\n\n두 번째 열쇠는,\n바라보고 먹기입니다.\n음식을 집어 입에 넣기 전에,\n잠시 시간을 들여 바라봅니다.\n빛깔과 모양, 피어오르는 김.\n그리고 입에 넣은 뒤에는,\n방금 눈으로 본 그것이 지금 내 입속에 있음을 알아차리며 천천히 씹습니다.\n밥 한 술이라면 밥알의 감촉과 씹을수록 번지는 은근한 단맛을 느껴 봅니다.\n이렇게 먹으면 속도는 저절로 느려지고,\n놀라운 사실을 알게 됩니다.\n한 입마다 즐기고 발견할 것이 이렇게나 많았다는 것을.\n\n세 번째 열쇠는,\n좋은 대화입니다.\n혼자가 아니라 누군가와 함께 먹는다면,\n말도 식탁 위에 오르는 반찬이 됩니다.\n어떤 말은 사람 사이를 갈라놓습니다.\n그 자리에 없는 사람의 흉을 보는 말,\n불평으로 가득한 말.\n아무리 좋은 음식도 그런 말 곁에서는 제 가치를 잃습니다.\n반대로 따뜻한 화제는 소박한 밥상도 잔칫상으로 만듭니다.\n오늘 함께 먹는 자리에서는,\n음식을 고르듯 말도 정성껏 골라 올려 봅니다.\n\n네 번째 열쇠는,\n식사 후의 감사입니다.\n우리는 대개 마지막 숟가락을 놓기 무섭게 다음 할 일을 향해 일어섭니다.\n오늘은 잠시만 앉아 있어 봅니다.\n그리고 알아차립니다.\n식사가 끝났다는 사실을.\n그릇이 비었다는 사실을.\n나의 허기가 채워졌다는 사실을.\n그 채워짐에 마음속으로 짧은 인사를 건넵니다.\n잘 먹었습니다. 고맙습니다.\n이 한 번의 인사가,\n평화롭고 행복한 삶을 위한 가장 쉽고 간단한 방법입니다.\n\n라디오를 끄고,\n바라보며 먹고,\n좋은 말을 나누고,\n빈 그릇에 감사하기.\n이 네 가지면 어떤 식탁도 명상 자리가 됩니다.\n\n다음 끼니부터 하나씩 해 보세요.\n방석도,\n조용한 방도 필요 없습니다.\n하루 세 번,\n명상의 자리는 이미 차려져 있습니다.","duration":"약 8분","tags":"#먹기명상 #식탁명상 #천천히먹기","series":"숨비명상"},{"id":"6107c498","category":"관찰","title":"죽음이라는 스승","body":"옛 수행자들의 명상 목록에는 현대인이 들으면 흠칫 놀랄 만한 것이 하나 있다.\n시체를 바라보는 명상,\n부정관(不淨觀)이다.\n남방불교의 수행 지침서인 『청정도론』은 시체가 부패해 가는 과정을 열 가지로 나누고,\n그 하나하나를 삼매에 이르는 집중 대상으로 삼는다.\n부풀어 오른 것,\n검푸르게 변한 것,\n문드러진 것, 끊어진 것,\n뜯어 먹힌 것, 흩어진 것,\n난도질당해 흩어진 것,\n피가 흐르는 것,\n벌레가 버글거리는 것,\n그리고 해골이 된 것.\n눈을 돌리고 싶은 이 목록 앞에서 물음이 생긴다.\n옛사람들은 왜 하필 이것을 바라보았을까.\n\n답은 우리가 몸에 거는 마음에 있다.\n우리는 몸을 가꾸고,\n몸에 반하고,\n몸 때문에 우쭐하거나 움츠러들며 산다.\n그 애착의 뿌리가 워낙 깊어서,\n말로 하는 가르침으로는 좀처럼 흔들리지 않는다.\n그래서 옛 수행자들은 가장 정직한 스승을 찾아갔다.\n어떤 몸이든 결국 도착하게 되는 그 모습을,\n눈으로 직접 보는 것이다.\n\n『청정도론』이 전하는 수행 절차는 뜻밖에도 세심하고 신중하다.\n먼저 수행자는 반드시 스승을 찾아가 이 명상 주제를 배우고 숙지해야 한다.\n공동묘지에 갈 때는 감각을 단속하고 마음챙김을 세운 채 혼자 가되,\n떠나기 전에 장로나 도반들에게 알려 위험한 일이 생기면 도움받을 수 있게 한다.\n가는 길의 특징과 좌우의 지형을 익혀 두고,\n시체 쪽에서 불어오는 바람을 안고 가지 않는다.\n악취에 어지럽거나 구역질이 나면 수행이 되지 않기 때문이다.\n관찰할 시체도 가려서 정한다.\n욕망을 일으킬 수 있는 이성의 시체가 아니라 동성의 시체를 택하고,\n서는 자리도 너무 가깝지도 멀지도 않게 한다.\n너무 가까우면 두려움이 일고,\n너무 멀면 부정함이 사무치지 않는다.\n\n자리를 잡으면 관찰이 시작된다.\n피부색으로, 나이로,\n그리고 머리와 목,\n손과 가슴, 복부와 배꼽,\n엉덩이에 이르는 부위의 모양으로 낱낱이 구분해 본다.\n그러면서 '이 몸에는 서른두 가지 더러움이 가득 차 있다'고 되새기며,\n마음에 새겨질 상(表相)을 취한다.\n그래도 상이 또렷해지지 않으면 더 찬찬히 본다.\n뼈의 관절들을 하나하나 주시하고,\n눈과 코와 입 같은 구멍들을,\n오목한 곳과 볼록한 곳을 살핀다.\n그러다 이를테면 부풀어 오른 모습이 가장 선명하게 다가오는 자리에서,\n'부푼 것, 부푼 것, 부푼 것' 하고 이름 붙이며 집중한다.\n눈을 뜨고 백 번 천 번 바라보고,\n눈을 감고 마음으로 다시 떠올리기를 거듭한다.\n눈을 감았을 때에도 뜨고 본 것과 다름없이 그 모습이 마음에 떠오르면,\n상을 잘 취한 것이다.\n\n상을 얻었으면 묘지에 머물지 않고 거처로 돌아온다.\n돌아오는 길에 사람들과 이야기를 나누다 애써 익힌 상을 잃어버렸더라도,\n다시 묘지로 갈 필요는 없다.\n오가며 익혀 둔 길과 주변의 특징들을 회상하는 것만으로 상은 되살아난다.\n그리고 수행이 무르익으면 놀라운 전환이 일어난다.\n『청정도론』은 이렇게 전한다.\n처음 익힌 상은 두렵고 섬뜩한 형상으로 나타나지만,\n수행이 깊어져 나타나는 닮은 상은 \"건장한 사람이 배불리 먹고 누워 있는 것처럼\" 나타난다고.\n같은 대상인데 두려움이 사라지고 고요만 남는 것이다.\n이 닮은 상이 나타나는 순간 마음은 근접삼매에 들고,\n다섯 가지 장애는 가라앉으며,\n수행을 지속하면 마침내 초선정에 이른다.\n\n이 수행의 결실은 선정만이 아니다.\n몸의 부정한 본성을 명료하게 본 마음은 탐욕과 애욕,\n집착과 자만에서 풀려나 열반 쪽으로 방향을 튼다.\n시체는 수행자에게 이렇게 말해 준 셈이다.\n네가 그토록 붙들고 있는 그 몸도 나와 다르지 않다고.\n그러니 붙드는 힘을 풀고,\n몸이 있는 동안 해야 할 일을 하라고.\n부정관은 몸을 미워하는 수행이 아니라,\n몸에 속지 않는 수행이다.\n\n다만 분명히 해 둘 것이 있다.\n이 수행은 처음부터 끝까지 스승의 지도와 안전장치를 전제로 설계되어 있다.\n혼자 가되 반드시 알리고 가라는 당부,\n거리와 바람의 방향까지 살피는 세심함이 그 증거다.\n죽음의 형상을 직접 마주하는 일은 마음을 크게 흔들 수 있어서,\n옛 문헌조차 이토록 조심스러웠던 것이다.\n그러므로 오늘의 우리가 이 수행을 그대로 따라 할 일은 아니다.\n그러나 그 정신만은 이어받을 수 있다.\n이 몸이 영원하지 않다는 사실을 외면하지 않고 살아가는 것.\n아침에 마주한 거울 속 얼굴이 어제와 조금 다르다는 것을 알아보고,\n언젠가 내려놓을 몸이기에 오늘 더 아껴 쓰고 덜 붙드는 것.\n죽음을 기억하는 사람만이,\n삶을 낭비하지 않는다.","duration":"","tags":"부정관 명상 이야기","series":"숨비명상"},{"id":"5de2ad8a","category":"멈춤","title":"일곱 번의 멈춤","body":"명상은 거창한 것만이 아닙니다.\n방석과 고요한 방이 없어도,\n하루 곳곳에는 잠깐 멈추어 마음을 챙길 자리들이 숨어 있습니다.\n시작 전에 한 가지만 기억해 주세요.\n우리가 이 연습을 하는 까닭은 결국 나를 온전히 긍정하기 위해서입니다.\n나를 사랑해야 하는 이유는 남보다 잘나서도,\n못나서도 아닙니다.\n내가 살아 있기 때문입니다.\n그리고 하다가 잡념이 일면 탓하지 말고 무심히 바라보면 됩니다.\n그럼 이제,\n소소하지만 확실한 행복을 주는 일곱 번의 멈춤을 소개하겠습니다.\n\n첫 번째 멈춤은,\n1분 그냥 있기입니다.\n하던 일을 잠시 멈춥니다.\n가만히 눈을 감고,\n그냥 그대로 있습니다.\n무언가를 하려 하지 않고,\n무언가를 알아차리려 애쓰지도 않고,\n아무것도 하지 않음에 나를 맡겨 버립니다.\n생각이 떠오르면 떠오르는 대로 지켜봅니다.\n단 1분,\n그냥 존재해 보는 것.\n그것만으로 하루의 결이 달라집니다.\n\n두 번째 멈춤은,\n스치는 이에게 보내는 자애입니다.\n하루 동안 우리는 이름 모를 많은 분들을 스쳐 갑니다.\n요금소의 직원,\n편의점의 점원, 버스 기사님,\n경비실의 어르신.\n그분들을 지나치는 그 몇 초 동안,\n마음속으로 자애를 보내 봅니다.\n명찰이 보인다면 이름을 넣어서.\n아무개 님이 오늘 하루도 건강하기를,\n편안하기를, 행복하기를.\n입가에 옅은 미소를 띠고,\n따스한 기운을 선물처럼 건넵니다.\n받은 줄도 모르는 선물이지만,\n건넨 내 가슴이 먼저 따뜻해집니다.\n\n세 번째 멈춤은,\n화장실 명상입니다.\n옛 절에서는 화장실을 해우소,\n근심을 내려놓는 곳이라 불렀습니다.\n우리는 매일 드나들면서도 무의식으로 다녀오지만,\n사실 그곳만큼 내 몸을 살피기 좋은 자리가 없습니다.\n갈 때의 몸의 신호,\n일을 볼 때의 감각,\n비워 낸 뒤의 개운함,\n손을 씻을 때 물의 온도,\n거울에 비친 내 얼굴까지.\n마음만 먹으면 화장실은 하루 몇 번씩 열리는 나만의 명상실이 됩니다.\n몸도 비우고,\n근심도 함께 내려놓고 나옵니다.\n\n네 번째 멈춤은,\n발가락 명상입니다.\n계단을 오르내릴 때 발가락에 주의를 두어 봅니다.\n어느 발가락부터 힘이 들어가는지,\n발바닥의 무게는 어떻게 옮겨 가는지,\n몸은 어떻게 균형을 잡는지.\n한 계단,\n한 계단 느끼며 오릅니다.\n그러다 보면 알게 됩니다.\n너무 당연해서 있는 줄도 몰랐던 이 작은 발가락들이,\n평생 나를 지탱해 온 고마운 존재라는 것을.\n\n다섯 번째 멈춤은,\n세 숟가락 명상입니다.\n한 끼 식사에서 딱 세 숟가락만,\n의도적으로 오래 씹으며 알아차리는 것입니다.\n백 번을 목표로,\n딴생각 없이 입안의 음식에만 온전히 머뭅니다.\n쉬워 보여도 배가 고프면 번번이 잊게 되는 연습입니다.\n괜찮습니다.\n다음 끼니에 또 세 숟가락이 있으니까요.\n누군가와 함께 먹는 자리에서도 표 나지 않게 할 수 있는,\n하루 세 번의 비밀 수련입니다.\n\n여섯 번째 멈춤은,\n가슴의 미소입니다.\n살다 보면 불편한 사람과 불편한 대화를 해야 하는 순간이 옵니다.\n그럴 때 세 글자를 기억해 주세요.\n멈추고, 미소 짓고,\n바라보기.\n자극이 오면 일단 멈춥니다.\n겉으로 웃을 수 없는 자리라면,\n마음으로 미소 짓습니다.\n가슴 한가운데 따뜻한 미소의 느낌을 일으켜,\n그 온기를 상대에게 조용히 흘려보냅니다.\n그리고 바라봅니다.\n신기하게도,\n분노가 올라오던 길이 그 온기에 막히고,\n그 자리에 연민이 스며듭니다.\n\n일곱 번째 멈춤은,\n가슴으로 감사하기입니다.\n두 손을 모아 가슴 위에 가볍게 올리고,\n살짝 미소 지으며,\n숨이 가슴 한가운데로 드나든다고 상상하며 호흡합니다.\n먼저,\n이렇게 온전히 존재하고 있는 나에게 감사를 보냅니다.\n가슴으로 들이쉬고,\n가슴으로 내쉬며. 다음으로,\n최근 나에게 친절을 베풀어 준 고마운 한 사람을 떠올리며,\n같은 숨으로 감사를 보냅니다.\n잠들기 전이라면 하루의 고마운 얼굴들을 한 사람씩 떠올리며 미소 짓고 호흡합니다.\n\n일곱 번의 멈춤. 그냥 있기,\n스치는 이에게 자애, 해우소,\n발가락, 세 숟가락,\n가슴의 미소, 가슴의 감사.\n하루에 다 하려 하지 말고,\n오늘은 하나만 골라 보세요.\n옛 글은 말합니다.\n언제나 깨어 있는 사람은 밤이나 낮이나 그 마음이 즐겁다고.\n소소한 멈춤들이 쌓여,\n확실한 행복이 됩니다.","duration":"약 11분","tags":"#소확행명상 #일상명상 #생활수행","series":"숨비명상"},{"id":"06e49dae","category":"수면·이완","title":"일터의 방석","body":"일터에서 우리의 마음은 쉴 틈이 없습니다.\n쏟아지는 이메일과 문자,\n꼬리를 무는 회의,\n울리는 전화, 다가오는 마감.\n정신없이 끌려다니다 보면 하루가 어떻게 갔는지도 모르게 저녁이 됩니다.\n그런데 기억해 주세요.\n삶의 의미는 무슨 일을 하느냐보다,\n그 일을 어떤 태도로 대하느냐에 따라 크게 달라집니다.\n끌려다니면 마음놓침의 하루,\n깨어서 선택하면 마음챙김의 하루입니다.\n오늘은 전쟁 같은 일터 곳곳에 보이지 않는 방석 일곱 개를 놓아 드리겠습니다.\n\n첫 번째 방석은,\n지금 하는 일에 주의 두기입니다.\n보고서를 쓸 때는 보고서 쓰는 일에 온 주의를 기울입니다.\n그것이 일터의 마음챙김입니다.\n마음이 딴 데로 가면,\n갔다는 것을 인정하고 하던 일로 다시 돌아옵니다.\n그리고 매일 업무를 시작하기 전,\n마음을 챙기는 시간을 미리 정해 두면 좋은 습관이 됩니다.\n\n두 번째 방석은,\n하루 한 호흡입니다.\n일터에서 30분을 따로 내기란 사실 어렵습니다.\n걱정하지 않아도 됩니다.\n마음챙김은 길이가 아니라 반복이 핵심입니다.\n온전히 음미한 한 번의 호흡이면 충분합니다.\n업무 시작 전 커피 한 잔의 시간,\n점심 전후의 몇 초.\n나만의 때를 정해,\n오늘부터 하루 한 호흡을 깊이 맛보는 습관을 만들어 보세요.\n\n세 번째 방석은,\n한 번에 한 가지입니다.\n우리는 여러 일을 동시에 한다고 믿지만,\n사실 마음은 두 가지 일에 동시에 집중하지 못합니다.\n그저 이 일과 저 일 사이를 바쁘게 오갈 뿐이고,\n그럴수록 실수는 늘고 집중은 얕아집니다.\n그러니 한 번에 하나만 합니다.\n밥 먹을 때는 밥맛에,\n대화할 때는 상대에게,\n일할 때는 그 일에만.\n한 가지에 온전히 몰입하는 힘,\n그것이 요즘 세상에서 가장 귀한 경쟁력입니다.\n\n네 번째 방석은,\n3초 멈춤입니다.\n익숙한 업무일수록 자동조종으로 흘러가고,\n무뎌진 주의력이 작은 실수를,\n때로 큰 사고를 부릅니다.\n그래서 깨우는 장치가 필요합니다.\n전화벨이 울릴 때,\n문자가 도착할 때,\n바로 받는 대신 딱 3초만 멈춥니다.\n숨 한 번 쉬고,\n그다음 응답합니다.\n더 차분해지고 더 현명해지는 데에,\n3초면 충분합니다.\n\n다섯 번째 방석은,\n스트레스와 친구 되기입니다.\n일터에서 스트레스는 피할 수 없는 동료 같은 존재입니다.\n비결은 맞서 싸우는 것이 아니라,\n판단 없이 알아차리는 것입니다.\n힘든 일이 닥치면,\n조여 오는 어깨,\n빨라지는 심장 같은 몸의 자연스러운 반응을 그저 자각해 봅니다.\n신기한 사실 하나.\n스트레스는 고통스럽지만,\n스트레스를 알아차리는 그 마음은 고통스럽지 않습니다.\n그 마음자리에서 평온이 시작됩니다.\n\n여섯 번째 방석은,\n나에게 먼저 친절하기입니다.\n일이 잘 풀리지 않을 때 우리는 자동으로 자신을 다그칩니다.\n나는 왜 이 모양일까.\n왜 나한테만 이럴까.\n하지만 손가락을 베이면 소독하고 밴드를 감아 주듯,\n마음이 다친 날에는 마음을 돌봐 주어야 합니다.\n자신에 대한 친절은 이기심이 아닙니다.\n나에게 친절한 사람이 동료에게도 진짜 친절할 수 있습니다.\n힘든 하루일수록,\n먼저 나에게 따뜻한 한마디를 건네 주세요.\n\n일곱 번째 방석은,\n자라는 눈입니다.\n능력은 정해져 있다고 믿는 사람과,\n노력과 배움으로 자랄 수 있다고 믿는 사람은 전혀 다른 길을 갑니다.\n마음챙김의 눈이 바로 그 자라는 눈입니다.\n나를 좁은 틀에 가두는 대신,\n내 안의 가능성을 믿고 지금 이 순간에 최선을 다하는 것.\n그때 신기한 일이 일어납니다.\n아무것도 바뀌지 않았는데,\n모든 것이 달라집니다.\n세상을 바라보는 방식이 바뀌었기 때문입니다.\n\n일곱 개의 방석을 놓아 드렸습니다.\n지금 하는 일에 주의 두기,\n하루 한 호흡,\n한 번에 한 가지,\n3초 멈춤,\n스트레스와 친구 되기,\n나에게 친절하기, 자라는 눈.\n이것은 머리로 배우는 지식이 아니라,\n몸으로 익히는 경험입니다.\n옛 글은 말합니다.\n모든 일은 마음이 근본이니,\n맑고 순수한 마음으로 말하고 행동하면 즐거움이 그를 따른다고,\n그림자가 주인을 따르듯이.\n내일 출근길,\n일곱 방석 가운데 하나만 골라 앉아 보세요.\n같은 일터가,\n다른 하루가 됩니다.","duration":"약 11분","tags":"#직장명상 #직장인마음챙김 #일터의방석","series":"숨비명상"},{"id":"7567246f","category":"수면·이완","title":"세 명의 도둑","body":"우리의 주의는 매일 도둑맞고 있습니다.\n그것도 아주 억센 세 명의 도둑에게.\n\n첫째는 주머니 속에서 쉴 새 없이 부르는 스마트폰,\n둘째는 대화 중에 슬그머니 끼어드는 딴마음,\n셋째는 순식간에 나를 통째로 훔쳐 가는 화입니다.\n\n옛 임금은 세숫대야에 \"나날이 새롭게 하라\"고 새겨 두고 매일 들여다보았다고 합니다.\n깨어 있는 하루는 그렇게 지키는 것입니다.\n오늘은 이 세 도둑을 잡는 법을 하나씩 익혀 보겠습니다.\n\n첫 번째 도둑,\n스마트폰입니다.\n편리한 도구이지만,\n어느새 우리는 주인이 아니라 붙들린 쪽이 되었습니다.\n손에 없으면 불안하고,\n보이면 저절로 손이 갑니다.\n\n잡는 법은 의외로 간단합니다.\n집중이 필요한 시간,\n30분에서 1시간만 스마트폰을 무음으로 하고,\n눈에 보이지 않는 곳에 치워 둡니다.\n보이지 않는 것,\n그것이 핵심입니다.\n\n처음에는 불안하고,\n자꾸 확인하고 싶은 충동이 일 것입니다.\n그때가 명상의 순간입니다.\n아,\n확인하고 싶은 마음이 일어나고 있구나.\n그렇게 알아차리고,\n침묵 속에서 그 충동을 가만히 지켜봅니다.\n지켜보고 있으면 그 마음도 변해 가고,\n어느새 잦아듭니다.\n도둑은 지켜보는 집에는 들지 못합니다.\n\n두 번째 도둑,\n대화 중의 딴마음입니다.\n우리는 상대의 말을 다 듣기도 전에 속으로 비판하고,\n분석하고, 반박을 준비합니다.\n몸은 마주 앉아 있어도 마음은 이미 자기 말 차례를 연습하고 있는 것이지요.\n\n잡는 법은 침묵입니다.\n상대가 말하는 동안,\n입의 소리만이 아니라 머릿속 목소리까지 꺼 봅니다.\n그리고 귀를 기울이는 것을 넘어,\n존중하는 마음으로 듣습니다.\n말의 내용만이 아니라,\n목소리의 결과 떨림,\n표정과 몸짓과 눈빛까지,\n가슴으로 받아들입니다.\n할 말을 미리 준비하지 않습니다.\n\n듣다가 불편해지고 화가 올라오는 순간이 온다면,\n말로 반응하기 전에 먼저 내 몸을 봅니다.\n열이 오르는지,\n가슴이 답답한지,\n어디가 가장 강한지 찾아,\n그 부위로 숨을 쉬어 봅니다.\n들숨이 그곳으로 들어가고,\n날숨이 그곳에서 빠져나간다고 상상하면서.\n이렇게 온 마음으로 들어 주는 것은,\n상대에게 줄 수 있는 가장 귀한 선물입니다.\n그리고 신기하게도,\n그렇게 들을 때 대화의 결과도 달라집니다.\n\n세 번째 도둑, 화입니다.\n가장 억센 도둑이라,\n잡는 절차도 꼼꼼하게 갑니다.\n\n화가 났다면 먼저,\n크기부터 재 봅니다.\n1에서 10까지,\n지금 몇인가. 작은 화인가,\n중간 화인가, 큰 화인가,\n아주 큰 화인가.\n숫자를 기억해 두고,\n천천히 눈을 감습니다.\n눈꺼풀 안의 어두운 공간을 잠시 보다가,\n눈의 힘을 풀고 쉽니다.\n\n코로 깊게 들이마시고,\n입으로 길게 내쉽니다.\n세 번 반복합니다.\n\n이제 몸을 살핍니다.\n지금 가장 두드러진 감각이 무엇인가요.\n열감인가, 긴장인가,\n떨림인가, 답답함인가.\n그것이 어디에서 느껴지는지 찾아,\n원한다면 그곳에 손을 얹습니다.\n그리고 그 느낌이 어떻게 변해 가는지 바라봅니다.\n다시 심호흡을 세 번 합니다.\n\n기억해 주세요.\n화는 내가 아닙니다.\n화는 내가 잠시 겪고 있는 것입니다.\n그 자리에서 스스로에게 물어봅니다.\n무엇 때문에 화가 일어났는가.\n그 밑바닥의 이유는 무엇인가.\n이 화를 내면,\n누가 가장 힘들어지는가.\n\n이제 다시 크기를 재 봅니다.\n1에서 10까지,\n지금 몇인가.\n처음의 숫자와 비교해 봅니다.\n아마 조금은,\n내려가 있을 것입니다.\n\n마지막으로,\n이렇게 애쓴 나를 위로해 줍니다.\n가슴에 손을 얹고,\n손의 온기와 무게를 느끼며,\n가볍게 미소 짓고,\n마음속으로 말해 줍니다.\n몸과 마음이 안정되기를.\n몸과 마음이 편안하기를.\n몸과 마음이 고요하기를.\n몸과 마음이 평화롭기를.\n천천히 하면 3분,\n급하면 1분이면 충분합니다.\n\n세 도둑을 잡는 법을 익혔습니다.\n스마트폰은 치우고 지켜보기,\n대화에서는 안팎으로 침묵하고 가슴으로 듣기,\n화가 나면 재고, 숨 쉬고,\n묻고, 위로하기.\n도둑들은 내일도 찾아올 것입니다.\n하지만 옛 글이 말하듯,\n흐트러진 채 사는 백 년보다 깨어 있는 하루가 더 값집니다.\n이제 당신은 빼앗기는 사람이 아니라,\n지키는 사람입니다.","duration":"약 11분","tags":"#디지털디톡스 #경청명상 #화다스리기","series":"숨비명상"},{"id":"3630b3f6","category":"용서감사","title":"이미 충분해","body":"지금 계신 자리에서 몸을 편안하게 두어 보세요.\n의자에 앉아 계셔도 좋고,\n누워 계셔도 좋습니다.\n목과 어깨에서 힘을 살며시 내려놓습니다.\n두 손은 무릎 위나 몸 옆에 편히 둡니다.\n그리고 눈을 지그시 감아 봅니다.\n\n아직 몸 어딘가에 긴장이 남아 있어도 괜찮습니다.\n무언가 마음에 걸리는 일이 떠올라도 괜찮습니다.\n지금은 아무것도 하지 않아도 되는 시간입니다.\n그저 이 자리에 이렇게 있어 보세요.\n\n이제 천천히 숨을 느껴 봅니다.\n코로 시원한 공기가 들어옵니다.\n그 숨이 가슴을 지나 배까지 천천히 내려갑니다.\n잠시 머물렀다가,\n다시 부드럽게 빠져나갑니다.\n숨을 애써 고르지 않아도 됩니다.\n그저 들어오고 나가는 것을 가만히 바라봅니다.\n\n숨을 따라 어깨가 조금씩 내려앉습니다.\n이마와 미간이 스르르 펴집니다.\n턱에 들어가 있던 힘도 살며시 풀립니다.\n온몸이 조금씩 무거워지고,\n조금씩 따뜻해집니다.\n\n이제 이른 아침을 떠올려 봅니다.\n창밖이 서서히 밝아 오는 시간입니다.\n지평선 너머로 해가 조용히 떠오릅니다.\n서두르는 법 없이,\n천천히 올라옵니다.\n\n그 첫 햇살이 창을 넘어 방 안으로 들어옵니다.\n빛이 조용히 다가와 어깨에 닿습니다.\n따뜻합니다.\n그 온기가 어깨에서 등으로,\n가슴으로 천천히 번져 갑니다.\n\n밝고 부드러운 햇살이 온몸을 감싸 줍니다.\n이불 속처럼 포근합니다.\n상쾌한 아침 공기가 코끝에 살짝 닿습니다.\n숨을 들이쉴 때마다 그 맑은 기운이 몸 안으로 퍼집니다.\n\n이 따뜻함 속에서 입꼬리를 아주 살짝 올려 봅니다.\n크게 웃지 않아도 됩니다.\n그저 옅은 미소 하나면 충분합니다.\n눈가도 부드럽게 풀어 봅니다.\n얼굴 전체가 아침 햇살처럼 은은하게 밝아 옵니다.\n\n이렇게 미소를 머금은 채로 가만히 느껴 봅니다.\n지금 이 순간,\n나는 아무것도 더 얻지 않았습니다.\n무언가를 이루지도 않았습니다.\n그런데도 이렇게 따뜻하고,\n이렇게 편안합니다.\n\n이 따뜻함은 밖에서 온 것이 아닙니다.\n원래 내 안에 있던 것입니다.\n햇살이 그저 그것을 살며시 비춰 주었을 뿐입니다.\n나는 이미 이대로 충분한 사람입니다.\n\n이 느낌 속에서 마음속으로 가만히 되뇌어 봅니다.\n오늘 나에게 주어진 이 하루,\n고맙습니다.\n이렇게 숨 쉬고 있음이,\n고맙습니다. 이대로의 내가,\n고맙습니다.\n\n한 번 더 천천히 되뇌어 봅니다.\n오늘 이 하루, 고맙습니다.\n이렇게 숨 쉬고 있음이,\n고맙습니다. 이대로의 내가,\n고맙습니다.\n\n가슴 한가운데가 은은하게 따뜻해집니다.\n그 따뜻함이 조용히 차오릅니다.\n넘치지도,\n모자라지도 않습니다.\n딱 알맞게, 가득합니다.\n이 고요한 충만함을 잠시 그대로 누려 봅니다.\n\n이제 이 따뜻함을 마음에 살며시 담아 둡니다.\n오늘 하루,\n이 느낌이 나와 함께할 것입니다.\n무엇을 더 쟁취하지 않아도,\n나는 이미 넉넉한 사람이라는 것을 기억합니다.\n\n천천히 손끝으로 주의를 옮겨 봅니다.\n손가락을 아주 조금씩 움직여 봅니다.\n발끝도 살며시 꼼지락거려 봅니다.\n몸 구석구석으로 감각이 돌아옵니다.\n\n어깨를 가볍게 한 번 으쓱해 봅니다.\n깊게 숨을 한 번 들이쉬고,\n편안하게 내쉽니다.\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n따뜻함을 품은 채로,\n지금 이 자리로 돌아왔습니다.\n오늘도, 이대로 충분합니다.","duration":"약 11분","tags":"#아침명상 #감사명상 #마음챙김","series":"숨비명상"},{"id":"59c21fbf","category":"수면·이완","title":"그릇을 씻으며","body":"지금 싱크대 앞에 편안히 서 보세요.\n급할 것 없습니다.\n쌓인 그릇을 한번 가만히 바라봅니다.\n오늘 하루가 저기 그대로 담겨 있습니다.\n서두르지 않아도 됩니다.\n하나씩, 천천히 하면 됩니다.\n\n먼저 물을 틀어 봅니다.\n손끝에 물이 닿습니다.\n차갑던 물이 조금씩 따뜻해집니다.\n그 따뜻함이 손바닥을 지나 손목까지 번져 옵니다.\n잠시 그대로,\n물의 온기를 느껴 봅니다.\n\n물소리에 가만히 귀를 기울여 봅니다.\n쫄쫄 흐르는 소리,\n그릇에 부딪히는 소리.\n그 소리 말고는 아무것도 필요하지 않습니다.\n오늘 많은 말을 했다면,\n이제 잠시 말을 내려놓습니다.\n마음이 시끄러웠다면,\n이 물소리에 맡겨 봅니다.\n\n이제 그릇 하나를 손에 듭니다.\n따뜻한 물을 그릇 위로 흘려보냅니다.\n손가락으로 그릇의 안쪽을 천천히 문지릅니다.\n말라붙은 밥풀이 조금씩 부드러워집니다.\n힘주어 서두르지 않아도,\n물이 알아서 풀어 줍니다.\n\n거품이 손끝에서 부드럽게 일어납니다.\n미끄러운 감촉이 손가락 사이로 지나갑니다.\n기름때가 스르르 녹아 흘러내립니다.\n그릇이 조금씩 맑아집니다.\n그 맑아지는 모습을 가만히 지켜봅니다.\n\n문득 이런 마음이 들지도 모릅니다.\n지금 내가 씻고 있는 것이 그릇만은 아니라는 것을.\n오늘 부대낀 마음도,\n아직 남아 있는 말들도,\n이 따뜻한 물에 함께 헹구어지고 있습니다.\n\n화가 났던 순간에도 나는 그릇을 깨뜨리지 않았습니다.\n버거운 하루에도 나는 여기까지 걸어왔습니다.\n그 마음을 이제 손에서 놓아 봅니다.\n흘러내리는 물과 함께,\n저 배수구로 천천히 떠나보냅니다.\n\n한 그릇을 다 헹구고,\n물기를 털어 제자리에 놓습니다.\n그리고 또 한 그릇을 듭니다.\n서두르지 않습니다.\n지금 이 하나의 그릇,\n지금 이 한 번의 손길.\n그거면 충분합니다.\n\n그릇이 하나씩 맑아질 때마다,\n내 안의 무언가도 함께 가벼워집니다.\n쌓여 있던 것이 줄어드는 만큼,\n마음의 자리도 조금씩 넓어집니다.\n\n이제 마지막 그릇까지 다 씻었다고 상상해 봅니다.\n물을 잠급니다.\n갑자기 찾아온 고요 속에 잠시 서 있어 봅니다.\n가지런히 반짝이는 그릇들을 바라봅니다.\n이 모양 저 모양으로 놓인 그릇들이 참 정갈합니다.\n\n그 그릇들에게 하듯,\n나 자신에게도 말을 건네 봅니다.\n오늘도 참 애썼다.\n말도 많고 마음도 부대꼈지만,\n잘 견뎌 주었다.\n이렇게 하루의 끝을 정갈히 씻어 주어 고맙다.\n\n젖은 손을 마른 수건에 가만히 닦습니다.\n따뜻한 온기가 아직 손끝에 남아 있습니다.\n그 온기를 잠시 그대로 느껴 봅니다.\n그릇을 씻은 이 손이,\n오늘 나를 돌본 손입니다.\n\n이제 천천히 어깨를 한 번 폅니다.\n깊게 숨을 들이쉬고,\n편안하게 내쉽니다.\n말끔해진 싱크대처럼,\n마음도 한결 개운합니다.\n이 가벼운 마음을 그대로 품고,\n다음 순간으로 걸어갑니다.\n\n가지런히 놓인 그릇들처럼,\n나의 삶도 이렇게 조금씩 정돈되어 갑니다.\n오늘도,\n나는 나를 잘 씻어 주었습니다.","duration":"약 12분","tags":"#설거지명상 #생활명상 #마음챙김","series":"숨비명상"},{"id":"3e970c90","category":"용서감사","title":"먼저 나에게","body":"지금 계신 자리에서 편안하게 앉아 봅니다.\n어깨의 힘을 살며시 내려놓습니다.\n두 손은 무릎 위에 편히 둡니다.\n그리고 눈을 지그시 감아 봅니다.\n\n천천히 숨을 들이마십니다.\n가슴과 배가 부드럽게 부풀어 오릅니다.\n그리고 길게 내쉽니다.\n숨이 나가면서 몸이 조금씩 가라앉습니다.\n몇 번,\n그저 이 숨을 따라가 봅니다.\n\n이제 마음속에 가족의 얼굴을 하나씩 떠올려 봅니다.\n가장 먼저 떠오르는 얼굴이 있을 겁니다.\n그 얼굴을 가만히 바라봅니다.\n반가운 마음이 올라와도 괜찮습니다.\n불편한 마음이 올라와도 괜찮습니다.\n\n그 얼굴을 보며 마음이 어떤지 살펴봅니다.\n사랑이 느껴진다면,\n그 사랑을 그대로 느껴 봅니다.\n미움이 느껴진다면,\n그 미움도 밀어내지 않고 바라봅니다.\n어떤 마음이든,\n지금 여기 있어도 됩니다.\n\n어쩌면 마음에 걸리는 한 장면이 떠오를지도 모릅니다.\n서운했던 말, 아팠던 순간.\n그 기억이 떠오르면,\n조용히 그 앞에 머물러 봅니다.\n아직도 그 자리에 서 있는 나를 가만히 바라봅니다.\n\n여기서 우리는 흔히 이렇게 생각합니다.\n'내가 저 사람을 용서해 주어야지.' 하지만 잠시,\n그 마음을 내려놓아 봅니다.\n용서는 거기서 시작되는 것이 아닙니다.\n\n먼저 떠올려 봅니다.\n가족의 모난 모습을 볼 때마다 지적하고,\n책망하고, 미워했던 나를.\n바꾸려 애쓰고, 실망하고,\n마음속으로 돌아섰던 나를.\n그 애쓰던 내 모습을 이제 가만히 안아 봅니다.\n\n그리고 나에게 먼저 말해 봅니다.\n'그동안 참 애썼다.' '미워하느라, 참느라, 너도 많이 힘들었지.' '그런 너를, 있는 그대로 이해한다.'\n\n이 말이 마음에 닿는 순간,\n가슴 한가운데가 조금 따뜻해집니다.\n얼어 있던 무언가가 천천히 녹아내립니다.\n내가 나를 용서하니,\n마음에 자리가 하나 생깁니다.\n\n바로 그 자리에서,\n비로소 가족의 얼굴이 다르게 보입니다.\n그 사람도 그 사람의 하루를 견디고 있었음을.\n그 사람도 서툴렀을 뿐임을.\n미움 대신 이해가 조용히 그 자리에 들어옵니다.\n\n내 마음이 편안해지면,\n온 세상이 편안해집니다.\n내 마음이 따뜻해지면,\n가족을 보는 눈길도 따뜻해집니다.\n용서는 밖에서 오는 것이 아니라,\n이렇게 내 안에서 먼저 피어나는 것입니다.\n\n이제 그 따뜻한 마음을 가족의 얼굴로 천천히 보내 봅니다.\n멀리 있어도,\n서로 소원했어도,\n가족은 가족입니다.\n말없이 마음속으로 세 마디를 건네 봅니다.\n'미안합니다.' '고맙습니다.' '사랑합니다.'\n\n한 번 더,\n천천히 되뇌어 봅니다.\n'미안합니다.' '고맙습니다.' '사랑합니다.' 이 말이 나를 지나,\n가족에게로 잔잔히 흘러갑니다.\n\n이제 그 마음을 가슴에 고이 담아 둡니다.\n오늘 하루,\n이 따뜻함이 나와 함께할 것입니다.\n\n천천히 손끝과 발끝으로 감각을 옮겨 봅니다.\n손가락을 조금씩 움직여 봅니다.\n깊게 숨을 한 번 들이쉬고,\n편안하게 내쉽니다.\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n가장 먼저 나를 용서한 이 마음으로,\n오늘,\n가족에게 따뜻한 말 한마디를 건네 보세요.\n바로 지금, 이 순간부터.","duration":"약 13분","tags":"#가족명상 #용서명상 #마음챙김","series":"숨비명상"},{"id":"958e8423","category":"호흡명상","title":"숨을 세며","body":"지금 계신 자리에서 몸을 편안하게 두어 봅니다.\n등은 자연스럽게 세우고,\n어깨의 힘은 내려놓습니다.\n두 손은 무릎이나 배 위에 편히 둡니다.\n그리고 눈을 지그시 감아 봅니다.\n\n무언가 마음이 복잡했다면,\n그대로 두어도 괜찮습니다.\n생각을 억지로 없애려 하지 않아도 됩니다.\n지금부터는 그저 숨을 따라가기만 하면 됩니다.\n숨은 언제나 나와 함께 있어 준 오랜 친구입니다.\n\n먼저,\n지금 쉬고 있는 숨을 가만히 느껴 봅니다.\n고치려 하지 않고,\n있는 그대로 바라봅니다.\n코로 들어오는 시원한 공기.\n그리고 부드럽게 빠져나가는 따뜻한 숨.\n\n이제 숨을 하나씩 세어 봅니다.\n어렵지 않습니다.\n숨을 내쉴 때마다 마음속으로 숫자를 붙이면 됩니다.\n숫자를 크게 소리 낼 필요도,\n애쓸 필요도 없습니다.\n\n천천히 들이쉬고,\n길게 내쉬면서 '하나'.\n다시 들이쉬고,\n내쉬면서 '둘'. 들이쉬고,\n내쉬면서 '셋'.\n숫자와 함께 마음이 조금씩 가라앉습니다.\n\n'넷'. '다섯'.\n숨을 내쉴 때마다 어깨가 한 뼘씩 내려앉습니다.\n'여섯'. '일곱'.\n가슴속 파도가 조금씩 잔잔해집니다.\n\n'여덟'. '아홉'. '열'.\n열까지 세었다면,\n다시 '하나'로 돌아옵니다.\n숫자를 놓쳐도 괜찮습니다.\n그저 다시 하나부터 시작하면 됩니다.\n\n혹시 생각이 떠올라 숫자를 잊었다면,\n그것을 알아차린 것만으로 충분합니다.\n잘못한 것이 아닙니다.\n조용히,\n다시 숨으로 돌아와 하나부터 세어 봅니다.\n\n숨을 세며,\n이 숨이 어떤 모습인지 그려 봅니다.\n들이쉬는 한 번의 숨에,\n꽃 한 송이가 피어납니다.\n내쉬는 한 번의 숨에,\n그 꽃이 고요히 집니다.\n피고 지는 그 모든 것이,\n이 숨 하나 안에 있습니다.\n\n들숨 한 번에 밀물이 밀려 들어옵니다.\n날숨 한 번에 썰물이 천천히 빠져나갑니다.\n들숨 한 번에 태양이 산 위로 떠오르고,\n날숨 한 번에 태양이 서산으로 저뭅니다.\n\n들고 나고, 피고 지고,\n떠오르고 기울고.\n이 세상 모든 것이 이렇게 숨을 쉬고 있습니다.\n서두르지 않고,\n멈추지도 않고, 제 리듬으로.\n지금 나의 숨도 그 커다란 리듬 안에 있습니다.\n\n문득 느껴 봅니다.\n이 땅의 모든 풀과 나무도 숨을 쉬고 있습니다.\n바다도, 이 지구도,\n저 넓은 하늘도 숨을 쉽니다.\n나의 작은 숨 하나가,\n그 모든 숨과 이어져 있습니다.\n\n그러니 지금 이 숨 안에서 나는 혼자가 아닙니다.\n숨을 쉬고 있다는 것,\n그 하나만으로 나는 살아 있습니다.\n살아 있다는 것,\n그 하나만으로 충분합니다.\n이 자리가 바로,\n내 마음이 돌아올 집입니다.\n\n이제 숫자를 조용히 내려놓습니다.\n그저 숨이 들고 나는 것만 가만히 느껴 봅니다.\n잔잔해진 수면처럼,\n마음이 고요합니다.\n이 고요함 속에 잠시 그대로 머물러 봅니다.\n\n이 차분한 마음을 가슴에 살며시 담아 둡니다.\n오늘 마음이 다시 요동칠 때면,\n언제든 숨을 세어 이 자리로 돌아올 수 있습니다.\n하나, 둘, 셋.\n그거면 됩니다.\n\n이제 천천히 손끝과 발끝을 움직여 봅니다.\n깊게 숨을 한 번 들이쉬고,\n편안하게 내쉽니다.\n준비가 되면,\n천천히 눈을 떠 봅니다.\n고요한 마음을 품은 채,\n지금 이 자리로 돌아왔습니다.","duration":"약 12분","tags":"#호흡명상 #수식관 #마음챙김","series":"숨비명상"},{"id":"dbeebbe1","category":"수용","title":"내가 먼저","body":"지금 계신 자리에서 편안하게 앉아 봅니다.\n어깨의 힘을 살며시 내려놓습니다.\n두 손은 무릎 위에 편히 둡니다.\n그리고 눈을 지그시 감아 봅니다.\n\n숨을 깊이 들이쉬어 봅니다.\n그리고 길게 내쉽니다.\n들어오는 숨에 마음이 열리고,\n나가는 숨에 긴장이 풀립니다.\n몇 번,\n그저 이 숨을 따라가 봅니다.\n\n이제 마음속에 커다란 거울 하나를 떠올려 봅니다.\n그 거울 앞으로 천천히 다가가 서 봅니다.\n거울 속에 내 모습이 비치고 있습니다.\n서두르지 말고,\n그 얼굴을 찬찬히 바라봅니다.\n\n거울 속의 나를 바라보는 지금,\n느낌이 어떤가요.\n어쩌면 조금 낯설지도 모릅니다.\n'내가 이런 얼굴이었구나' 싶기도 합니다.\n평소 안다고 여겼던 나와,\n지금 마주한 내가 다를 수 있습니다.\n\n그 얼굴을 밀어내지 않고 그대로 바라봅니다.\n피곤함이 배어 있어도 괜찮습니다.\n마음에 안 드는 구석이 보여도 괜찮습니다.\n감추거나 꾸미지 않은,\n있는 그대로의 내 모습입니다.\n\n이 얼굴로 나는 오늘 하루를 살아냈습니다.\n울고 싶은 순간도,\n화가 나던 순간도 견뎌 냈습니다.\n그 모든 시간을 지나 지금 여기 서 있습니다.\n그런 나에게,\n마음속으로 조용히 말을 건네 봅니다.\n'애썼어. 있는 그대로의 너, 참 괜찮아.'\n\n그 말이 마음에 닿으면,\n거울 속의 얼굴이 조금 부드러워집니다.\n나와 내가 비로소 편안하게 마주 봅니다.\n나 자신과 먼저 어울리는 이 순간을,\n가만히 느껴 봅니다.\n\n문득 알아차립니다.\n누군가와 어울리는 일도 이와 똑같다는 것을.\n거울을 마주 보듯,\n나와 상대가 서로를 바라보는 것.\n내가 먼저 마음을 열지 않으면,\n거울도 나를 향해 열리지 않습니다.\n\n이제 거울 속에 내가 아닌,\n한 사람의 얼굴을 떠올려 봅니다.\n요즘 어울리기 어려웠던 사람일 수도 있습니다.\n서로 상처를 주고받았던 사람일 수도 있습니다.\n그 얼굴을 밀어내지 않고,\n가만히 바라봅니다.\n\n그 사람도 그 사람의 하루를 견디고 있었을 겁니다.\n그 사람도 서툴렀을 뿐일지도 모릅니다.\n내가 나를 있는 그대로 바라본 그 눈으로,\n이제 그 사람도 있는 그대로 바라봅니다.\n\n그리고 상상해 봅니다.\n내가 먼저 그 사람을 향해 '싱긋' 웃어 봅니다.\n내가 먼저 따뜻한 말 한마디를 건네 봅니다.\n내가 먼저 손을 내밀어 봅니다.\n\n그 순간,\n굳어 있던 사이에 작은 꽃 한 송이가 피어납니다.\n어울림은 이렇게 시작됩니다.\n누가 먼저 해주기를 기다리는 것이 아니라,\n바로 내가 먼저 열어 보는 것입니다.\n\n그 따뜻한 마음을 가슴에 살며시 담아 둡니다.\n언제 어디에 있어도,\n나의 존재는 그대로 빛나고 있습니다.\n꾸미지 않아도,\n나는 이미 어울림의 열쇠를 쥐고 있습니다.\n\n이제 천천히 손끝과 발끝으로 감각을 옮겨 봅니다.\n손가락을 조금씩 움직여 봅니다.\n깊게 숨을 한 번 들이쉬고,\n편안하게 내쉽니다.\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n오늘 하루,\n내가 먼저 웃어 봅니다.\n내가 먼저 손을 잡고,\n내가 먼저 안아 봅니다.\n나와도, 그리고 세상과도.\n그렇게 함께인 나의 모습을 그려 봅니다.","duration":"약 12분","tags":"#어울림명상 #자기수용 #마음챙김","series":"숨비명상"},{"id":"49a0d40d","category":"자비희사","title":"얼굴에 미소","body":"지금 계신 자리에서 편안하게 앉아 봅니다.\n어깨의 힘을 살며시 내려놓습니다.\n두 손은 무릎 위에 편히 둡니다.\n그리고 눈을 지그시 감아 봅니다.\n\n먼저 천천히 숨을 들이쉬어 봅니다.\n그리고 길게 내쉽니다.\n들어오는 숨에 마음이 차분해지고,\n나가는 숨에 굳어 있던 것이 풀립니다.\n몇 번,\n그저 이 숨을 따라가 봅니다.\n\n이제 숨결에 맞춰 마음속으로 조용히 되뇌어 봅니다.\n숨을 들이쉬면서,\n'마음에 평화'.\n숨을 내쉬면서,\n'얼굴에 미소'.\n\n다시 한번, 숨을 들이쉬면서,\n'마음에 평화'.\n숨을 내쉬면서,\n'얼굴에 미소'.\n서두르지 말고,\n숨의 리듬에 말을 얹어 봅니다.\n\n'마음에 평화'.\n'얼굴에 미소'.\n이 말을 되뇌는 것만으로,\n마음 한쪽이 조금 부드러워집니다.\n\n이제 마음의 눈으로,\n내 얼굴을 가만히 떠올려 봅니다.\n지금 입꼬리를 아주 살짝,\n위로 올려 봅니다.\n크게 웃지 않아도 됩니다.\n소리 없이 빙긋,\n그 정도면 충분합니다.\n\n입꼬리가 올라가니,\n눈가도 따라 부드러워집니다.\n얼굴 전체에 옅은 온기가 번집니다.\n억지로 짓는 웃음이 아닙니다.\n숨을 따라 저절로 피어난 미소입니다.\n\n이 미소를 지으며,\n잠시 나에게 물어봅니다.\n그동안 나는 웃고 싶어서 웃었을까요.\n웃기 싫어도,\n웃어야 해서 웃은 날은 없었을까요.\n겉으로는 웃어도,\n속은 지쳐 있지 않았을까요.\n\n그런 날들이 떠올라도 괜찮습니다.\n쓴웃음을 지으며 마음을 아프게 했던 나를 탓하지 않습니다.\n그저 가만히 바라보고,\n이제 그 마음을 내려놓습니다.\n지금 이 미소는,\n누구에게 보이기 위한 것이 아닙니다.\n\n이 미소는,\n나 자신에게 먼저 보내는 미소입니다.\n마음속으로 나에게 조용히 말해 봅니다.\n'넌 괜찮아.' '그동안 참 잘해 왔어. 할 수 있어.'\n\n그 말에,\n가슴 한가운데가 따뜻해집니다.\n시들어 쪼그라들었던 마음이,\n방금 딴 레몬처럼 다시 상큼하게 살아납니다.\n나를 향한 이 다정한 미소가,\n내 안의 그림자를 밝힙니다.\n\n이렇게 나를 먼저 사랑하는 마음이 미소가 됩니다.\n그 미소가 곧,\n남을 너그럽게 바라보는 마음입니다.\n내가 나를 귀하게 여기니,\n남도 귀하게 보입니다.\n바로 이것이,\n내 안의 자비심이 피어나는 방법입니다.\n\n이제 그 따뜻한 미소를 마음에 담은 채,\n오늘 만날 사람들의 얼굴을 하나씩 떠올려 봅니다.\n그 얼굴들을 향해,\n내가 먼저 싱긋 웃어 봅니다.\n내 미소를 받은 그 얼굴에도,\n미소가 번져 갑니다.\n\n한 번 더,\n숨결에 말을 얹어 봅니다.\n숨을 들이쉬면서,\n'마음에 평화'.\n숨을 내쉬면서,\n'얼굴에 미소'.\n이 평화와 미소를,\n가슴에 고이 담아 둡니다.\n\n이제 천천히 손끝과 발끝으로 감각을 옮겨 봅니다.\n손가락을 조금씩 움직여 봅니다.\n깊게 숨을 한 번 들이쉬고,\n편안하게 내쉽니다.\n준비가 되면,\n미소를 머금은 채 천천히 눈을 떠 봅니다.\n\n오늘 하루,\n내가 먼저 웃어 봅니다.\n그 환한 미소 한 번이,\n만나는 모든 이에게 행복을 전합니다.\n지금 이 순간,\n내 인생의 주인공으로.\n마음에 평화,\n얼굴에 미소를 품고 살아갑니다.","duration":"약 12분","tags":"#미소명상 #자비명상 #마음챙김","series":"숨비명상"},{"id":"843285d6","category":"탈중심화","title":"다시 일어나","body":"지금 계신 자리에서 편안하게 앉아 봅니다.\n어깨의 힘을 살며시 내려놓습니다.\n두 손은 무릎 위에 편히 둡니다.\n그리고 눈을 지그시 감아 봅니다.\n\n천천히 숨을 들이쉬어 봅니다.\n그리고 길게 내쉽니다.\n들어오는 숨에 마음이 차분해지고,\n나가는 숨에 어깨가 조금씩 내려앉습니다.\n몇 번,\n그저 이 숨을 따라가 봅니다.\n\n이제 마음속으로 요즘의 나를 가만히 떠올려 봅니다.\n무언가 앞으로 나아가고 싶은 마음이 있습니다.\n그런데 그 앞에서 자꾸 멈춰 서게 됩니다.\n발을 떼려다가도,\n무언가가 나를 붙잡습니다.\n\n그 붙잡는 마음이 무엇인지 천천히 바라봅니다.\n두려움일 수도,\n불안일 수도 있습니다.\n'또 실패하면 어쩌지',\n'나는 안 될 거야'.\n그런 목소리가 마음 한쪽에서 올라옵니다.\n\n그 목소리를 밀어내려 애쓰지 않아도 됩니다.\n그저 '아, 내가 이런 두려움을 느끼고 있구나' 하고 알아차립니다.\n두려워하는 나를 나무라지 않습니다.\n그럴 만한 일들이 있었으니까요.\n\n이제 그 두려움을 조금 더 가까이 들여다봅니다.\n가만히 보면,\n그것은 지난 실패의 기억에서 왔습니다.\n넘어졌던 순간,\n아팠던 순간이 아직 마음에 남아 있습니다.\n그 기억이 나도 모르게 하나의 틀을 만들었습니다.\n\n그리고 나는 그 틀 안에 스스로 갇혀 있었던 겁니다.\n이 두려움은 밖에서 온 것이 아닙니다.\n내가 내 안에 만들어 둔 것입니다.\n그렇다면,\n그 문을 열 열쇠도 바로 내 안에 있습니다.\n\n여기서,\n상처받은 지난날의 나를 떠올려 봅니다.\n넘어지고, 좌절하고,\n혼자 울었던 그 시절의 나.\n그 어린 나를 밀어내지 말고,\n두 팔로 가만히 안아 봅니다.\n그리고 등을 토닥토닥 두드려 줍니다.\n\n마음속으로 그 시절의 나에게 말해 봅니다.\n'그동안 참 무서웠지. 애 많이 썼어.' '넘어진 건 네 잘못이 아니야.' '이제 내가 곁에 있을게. 함께 일어나자.'\n\n그 말에,\n얼어 있던 마음이 조금씩 녹습니다.\n과거의 나를 있는 그대로 안아 주니,\n오늘을 살아갈 힘이 바닥에서 천천히 올라옵니다.\n그 힘의 이름이 바로 용기입니다.\n\n용기는 두려움이 하나도 없는 마음이 아닙니다.\n두려우면서도,\n그 두려움을 안고 한 걸음 내딛는 마음입니다.\n지금 나에게는 그 한 걸음을 뗄 힘이 이미 있습니다.\n그 힘은 언제나 내 안에 있었습니다.\n\n이제 나를 응원해 주는 얼굴들을 떠올려 봅니다.\n나를 아끼는 가족,\n곁을 지켜 준 친구들.\n그들이 나를 향해 고개를 끄덕여 줍니다.\n'괜찮아, 넌 할 수 있어'라고 말해 줍니다.\n\n한 번도 넘어지지 않은 자전거보다,\n여러 번 넘어져 본 자전거가 더 똑바로 달립니다.\n나의 실패들은 흠이 아니라,\n나를 더 단단하게 밀어 올린 디딤돌이었습니다.\n\n이제 마음속으로 가만히 두 주먹을 쥐어 봅니다.\n가슴에 따뜻한 기운이 차오릅니다.\n'조금 실패해도 괜찮아. 다시 일어나면 돼.' 이 마음을 가슴 깊이 담아 둡니다.\n\n천천히 손끝과 발끝으로 감각을 옮겨 봅니다.\n손가락을 조금씩 움직여 봅니다.\n깊게 숨을 한 번 들이쉬고,\n편안하게 내쉽니다.\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n내 인생의 주인공은 바로 나입니다.\n두려움을 안은 채로,\n오늘 한 걸음을 내딛습니다.\n변화는 밖이 아니라,\n언제나 내 안에서 시작됩니다.\n지금, 이 순간부터.","duration":"약 13분","tags":"#용기명상 #자기치유 #마음챙김","series":"숨비명상"},{"id":"b79ece97","category":"자비희사","title":"희망의 씨앗","body":"지금 계신 자리에서 편안하게 앉아 봅니다.\n어깨의 힘을 살며시 내려놓습니다.\n두 손은 무릎 위에 편히 둡니다.\n그리고 눈을 지그시 감아 봅니다.\n\n천천히 숨을 들이쉬어 봅니다.\n그리고 길게 내쉽니다.\n들어오는 숨에 마음이 차분해지고,\n나가는 숨에 몸이 조금씩 가라앉습니다.\n몇 번,\n그저 이 숨을 따라가 봅니다.\n\n이제 마음속에 넓은 밭 하나를 떠올려 봅니다.\n햇살이 부드럽게 내려앉은 봄날의 밭입니다.\n흙에서는 촉촉하고 포근한 냄새가 올라옵니다.\n이 밭은 다른 누구의 것도 아닌,\n나의 마음밭입니다.\n\n그 흙을 손으로 가만히 만져 봅니다.\n따뜻하고 부드럽습니다.\n이 밭에 나는 오늘,\n씨앗 하나를 심으려 합니다.\n내가 요즘 가장 바라는 마음,\n나의 희망입니다.\n\n그 희망을 마음속에 조용히 떠올려 봅니다.\n이루고 싶은 일,\n되고 싶은 모습.\n그 바람을 작은 씨앗 하나에 담아 봅니다.\n그리고 그 씨앗을 손바닥 위에 가만히 올려놓습니다.\n\n씨앗을 심기 전에,\n잠시 그 씨앗을 들여다봅니다.\n이 바람 안에 어떤 마음이 담겨 있는지 살펴봅니다.\n'나만 잘되었으면',\n'내 것만 지켰으면' 하는 마음이 있어도 괜찮습니다.\n그런 마음이 보이면,\n그저 '아, 여기 있구나' 하고 알아차립니다.\n\n그리고 그 씨앗에 한 가지를 더 담아 봅니다.\n나를 넘어,\n곁에 있는 사람들을 향한 마음입니다.\n나도, 내 이웃도,\n함께 잘되기를 바라는 마음.\n이 따뜻한 마음이 더해질 때,\n씨앗은 비로소 튼실해집니다.\n\n이제 그 씨앗을 마음밭의 흙 속에 살며시 심습니다.\n손으로 흙을 부드럽게 덮어 줍니다.\n서두르지 않습니다.\n씨앗은 이제 어두운 흙 속에서 조용히 준비를 시작합니다.\n\n씨앗을 심었다고 저절로 열매가 맺히지는 않습니다.\n이제 정성으로 가꾸어야 합니다.\n먼저,\n따뜻한 햇살을 떠올려 봅니다.\n그 햇살로 나 자신을 먼저 비춰 줍니다.\n'그동안 참 애썼어. 너의 바람은 소중해.'\n\n이 다정한 햇살이 씨앗을 따뜻하게 감쌉니다.\n이제 맑은 물을 길어,\n씨앗에 부어 줍니다.\n그 물은 나와 내 이웃을 향한 사랑입니다.\n곁에 있는 이들의 얼굴을 하나씩 떠올리며 물을 줍니다.\n\n그리고 양분을 흙에 뿌려 줍니다.\n그 양분은 나와 상관없는 누군가,\n나아가 나를 힘들게 했던 그 사람까지 향한 마음입니다.\n'그 사람도 부디 평안하기를' 하고 조용히 바라 봅니다.\n\n그렇게 자비심으로 물과 햇살과 양분을 주니,\n흙 속 씨앗에서 여린 싹이 살며시 고개를 내밉니다.\n그 작은 초록빛 싹을 가만히 바라봅니다.\n이것이 나를 넘어 함께 자라는,\n진정한 희망의 싹입니다.\n\n이 싹은 하루아침에 열매가 되지 않습니다.\n매일 조금씩,\n마음을 담아 돌볼 때 자라납니다.\n오늘의 이 정성이,\n언젠가 튼실한 열매가 될 것입니다.\n그 사실을 믿으며,\n이 초록빛을 가슴에 담아 둡니다.\n\n이제 천천히 손끝과 발끝으로 감각을 옮겨 봅니다.\n손가락을 조금씩 움직여 봅니다.\n깊게 숨을 한 번 들이쉬고,\n편안하게 내쉽니다.\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n오늘 하루,\n나의 마음밭을 가꾸어 봅니다.\n나만을 위한 욕심이 아니라,\n나와 이웃을 함께 품는 마음으로.\n햇살과 물과 양분으로 정성껏 돌보는 하루.\n그 희망의 씨앗이 튼실한 열매로 맺기를 응원합니다.","duration":"약 12분","tags":"#희망명상 #자비명상 #마음챙김","series":"숨비명상"},{"id":"a685243c","category":"수용","title":"믿음의 다리","body":"지금 계신 자리에서 편안하게 앉아 봅니다.\n어깨의 힘을 살며시 내려놓습니다.\n두 손은 무릎 위에 편히 둡니다.\n그리고 눈을 지그시 감아 봅니다.\n\n천천히 숨을 들이쉬어 봅니다.\n그리고 길게 내쉽니다.\n들어오는 숨에 마음이 차분해지고,\n나가는 숨에 몸이 조금씩 가라앉습니다.\n몇 번,\n그저 이 숨을 따라가 봅니다.\n\n이제 마음을 조용히 안으로 돌려 봅니다.\n살아오는 동안 나는 많은 인연을 맺어 왔습니다.\n그 관계들 속에서 나는 얼마나 편안했을까요.\n누군가를 온전히 믿지 못해 마음 졸인 날은 없었을까요.\n\n그런 마음이 떠올라도 괜찮습니다.\n'저 사람은 믿을 수 없어' 하던 순간들.\n그 불신이 나를 지치게 했을지도 모릅니다.\n그 마음을 밀어내지 말고,\n가만히 바라봅니다.\n\n이제 스스로에게 조용히 물어봅니다.\n'나는 얼마나 사람을 믿고 있을까.' '혹시 내 생각을 지키려고, 마음의 문을 닫고 있지는 않았을까.' '상대 탓이라 여겼던 그 마음이, 사실 내 태도는 아니었을까.'\n\n이 물음 앞에서 문득 알아차립니다.\n믿음은 상대가 나에게 주는 것으로 정해지지 않는다는 것을.\n믿음은 내가 먼저 내는 마음이고,\n나의 태도에서 출발한다는 것을.\n그러니 그 열쇠는 언제나 내 안에 있었습니다.\n\n그렇다면 가장 먼저 물어야 할 것이 있습니다.\n나는 나 자신을 얼마나 믿고 있을까요.\n넘어질까 두려워 스스로를 의심하지는 않았을까요.\n그런 나에게,\n마음속으로 조용히 말해 봅니다.\n'괜찮아. 나는 나를 믿어. 너는 잘 해내고 있어.'\n\n그 말에,\n마음 한가운데가 든든해집니다.\n내가 나를 믿으니,\n세상을 보는 눈이 한결 부드러워집니다.\n불신의 안개가 걷히고,\n사람들이 다르게 보이기 시작합니다.\n믿음은 거울과 같아서,\n내가 낸 마음이 그대로 비칩니다.\n\n이제 마음속에 한 사람의 얼굴을 떠올려 봅니다.\n요즘 마음이 편치 않았던 사람일 수도 있습니다.\n그 사람을 가만히 바라보며 이렇게 생각해 봅니다.\n'저 사람도 나와 똑같이 힘들 때가 있구나.' '저 사람도 나처럼 행복을 찾고 있구나.'\n\n그 사람도 나와 똑같은 한 사람임을 느끼는 순간,\n우리 사이에 다리 하나가 놓입니다.\n마치 견우와 직녀가 건너던 오작교처럼.\n믿음이라는 그 다리 위를,\n마음 놓고 건너갈 수 있습니다.\n\n그 다리 위에서 나는 먼저 미소를 지어 봅니다.\n내가 먼저 웃으니,\n그 사람의 얼굴에도 웃음꽃이 핍니다.\n내가 먼저 손을 내미니,\n그 손을 마주 잡아 줍니다.\n믿음은 이렇게,\n내가 먼저 내딛는 한 걸음에서 시작됩니다.\n\n이 든든하고 따뜻한 마음을 가슴에 담아 둡니다.\n내가 일으키는 이 마음이,\n곧 나의 길이 됩니다.\n나를 믿고,\n함께 걷는 이를 믿으며,\n이 삶의 길을 편안하게 걸어갈 수 있습니다.\n\n이제 천천히 손끝과 발끝으로 감각을 옮겨 봅니다.\n손가락을 조금씩 움직여 봅니다.\n깊게 숨을 한 번 들이쉬고,\n편안하게 내쉽니다.\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n오늘 하루,\n나는 나를 얼마나 믿고 있는지 물어봅니다.\n그리고 그동안 표현하지 못했던 인연에게,\n내가 먼저 연락하고,\n내가 먼저 마음을 전해 봅니다.\n내가 먼저 웃을 때,\n너와 나 사이에 웃음꽃이 핍니다.","duration":"약 12분","tags":"#믿음명상 #자기신뢰 #마음챙김","series":"숨비명상"},{"id":"206068ea","category":"멈춤","title":"잠깐 멈춤","body":"지금 계신 자리에서 편안하게 앉아 봅니다.\n어깨의 힘을 살며시 내려놓습니다.\n두 손은 무릎 위에 편히 둡니다.\n그리고 눈을 지그시 감아 봅니다.\n\n천천히 숨을 들이쉬어 봅니다.\n그리고 길게 내쉽니다.\n들어오는 숨에 마음이 차분해지고,\n나가는 숨에 몸이 조금씩 가라앉습니다.\n몇 번,\n그저 이 숨을 따라가 봅니다.\n\n이제 마음을 조용히 안으로 돌려 봅니다.\n하루를 살다 보면 크고 작은 일들이 끊임없이 일어납니다.\n그때마다 마음에 파도가 일렁입니다.\n좋은 일에는 들뜨고,\n언짢은 일에는 마음이 요동칩니다.\n\n가만히 떠올려 봅니다.\n무언가 마음에 안 드는 일이 생겼을 때,\n나도 모르게 '이건 아니야' 하고 밀쳐낸 적은 없었을까요.\n습관처럼,\n상황을 어둡게 받아들인 순간은 없었을까요.\n\n그런 내 모습이 떠올라도 괜찮습니다.\n나무라지 말고,\n그저 가만히 바라봅니다.\n누구에게나 그런 순간이 있으니까요.\n지금은 그 모습을 조용히 알아차리기만 하면 됩니다.\n\n이제 한 장면을 떠올려 봅니다.\n오늘,\n혹은 요즘 마음을 언짢게 했던 일 하나.\n그 일이 다시 눈앞에서 벌어진다고 상상해 봅니다.\n가슴 어딘가에서 무언가 욱,\n하고 올라오는 것이 느껴집니다.\n\n바로 그 순간입니다.\n평소라면 곧바로 말이 튀어나오고,\n표정이 굳었을 겁니다.\n하지만 오늘은 여기서,\n잠깐 멈춰 봅니다.\n숨을 한 번,\n천천히 들이쉬고 내쉽니다.\n\n그리고 그 감정을 밖으로 쏟아내는 대신,\n안으로 바라봅니다.\n'지금 내 안에 어떤 마음이 올라오고 있지?' 화일까요,\n서운함일까요,\n아니면 불안일까요.\n그 감정에 조용히 이름을 붙여 봅니다.\n\n신기하게도,\n바라보는 순간 파도가 조금 잦아듭니다.\n감정에 휩쓸리던 내가,\n감정을 지켜보는 자리로 옮겨 옵니다.\n벌어진 일 자체는 내가 바꿀 수 없습니다.\n하지만 여기서 어떻게 반응할지는,\n온전히 나의 선택입니다.\n\n이제 내 앞에 두 개의 문이 있다고 상상해 봅니다.\n하나는 부정의 문,\n하나는 긍정의 문입니다.\n부정의 문은 태양을 등지고 그림자 속으로 들어가는 길입니다.\n긍정의 문은 태양을 당당히 마주하고 걸어가는 길입니다.\n\n어느 문을 열지,\n지금 내가 고를 수 있습니다.\n긍정의 문에 손을 얹고,\n마음속으로 조용히 속삭여 봅니다.\n'그럴 수도 있지.' '이만해서 다행이야.'\n\n그 한마디에,\n굳어 있던 마음이 스르르 풀립니다.\n문이 열리고,\n따뜻한 햇살이 얼굴로 쏟아집니다.\n그 빛을 온몸으로 받으며,\n나에게 말해 봅니다.\n'괜찮아. 나는 내 마음의 주인이야.'\n\n내 인생의 주인공은 바로 나입니다.\n상황이 나를 끌고 가는 것이 아니라,\n내가 내 생각과 감정을 고르며 걸어갑니다.\n이 잠깐의 멈춤이,\n나의 하루를,\n그리고 나의 앞날을 바꿉니다.\n\n이 든든하고 환한 마음을 가슴에 담아 둡니다.\n오늘 다시 마음에 파도가 일렁일 때면,\n언제든 잠깐 멈춰,\n그 감정을 바라볼 수 있습니다.\n그거면 충분합니다.\n\n이제 천천히 손끝과 발끝으로 감각을 옮겨 봅니다.\n손가락을 조금씩 움직여 봅니다.\n깊게 숨을 한 번 들이쉬고,\n편안하게 내쉽니다.\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n오늘 하루,\n감정이 욱 하고 올라올 때마다 잠깐 멈춰 봅니다.\n'그럴 수도 있지',\n'이만해서 다행이야' 하고 속삭이며,\n태양을 등지는 대신,\n태양을 당당히 맞이합니다.\n긍정으로 가득한,\n아름다운 나를 만나 봅니다.","duration":"약 12분","tags":"#긍정명상 #감정알아차림 #마음챙김","series":"숨비명상"},{"id":"acca56b1","category":"수면·이완","title":"믿고 맡기기","body":"편안한 곳에 앉아 봅니다.\n등을 기대고,\n두 손은 무릎 위에 가만히 내려놓습니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n아직 어깨에 힘이 남아 있어도 괜찮습니다.\n머릿속에 이런저런 생각이 오가도 괜찮습니다.\n지금은 아무것도 하지 않아도 되는 시간입니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n그리고 입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고,\n천천히 내쉽니다.\n내쉬는 숨과 함께,\n어깨가 아주 조금 아래로 내려갑니다.\n\n이제 몸의 무게를 느껴 봅니다.\n엉덩이가 바닥에 닿아 있는 느낌,\n두 발이 땅을 딛고 있는 느낌을 느껴 봅니다.\n의자가, 바닥이,\n나를 아래에서 받쳐 주고 있습니다.\n내가 힘을 주지 않아도,\n나를 그대로 받아 주고 있습니다.\n\n그 든든한 느낌에 몸을 살짝 더 맡겨 봅니다.\n기대어도 됩니다.\n무너지지 않습니다.\n\n이제 따뜻한 봄날 오후를 떠올려 봅니다.\n창가에 앉아 있고,\n햇살이 조용히 방 안으로 들어옵니다.\n그 햇살이 어깨 위에 살며시 내려앉습니다.\n따뜻한 손이 어깨를 가만히 감싸 주는 것 같습니다.\n그 온기가 어깨에서 등으로,\n천천히 번져 갑니다.\n\n멀리서 새소리가 들리고,\n바람이 부드럽게 스칩니다.\n공기에서 옅은 봄 냄새가 납니다.\n여기서는 아무 일도 일어나지 않습니다.\n서두를 것도,\n지켜야 할 것도 없습니다.\n그 따뜻한 햇살 속에서,\n나는 안전합니다.\n\n이 편안한 자리에,\n마음속으로 한 사람을 초대해 봅니다.\n떠올리면 마음이 조금 놓이는 사람.\n가족이든, 오랜 친구든,\n누구든 괜찮습니다.\n그 사람도 지금,\n나처럼 하루를 살아가고 있습니다.\n나처럼 웃기도 하고,\n나처럼 지치기도 합니다.\n그 사람도 나와 같은 마음으로,\n따뜻함을 바라고 있습니다.\n\n마음속으로 그 사람에게 조용히 인사를 건네 봅니다.\n편안하기를,\n오늘 하루 무탈하기를.\n그렇게 마음을 건네자,\n가슴 한가운데가 조금 따뜻해집니다.\n\n그 따뜻함은 원래 내 안에 있던 것입니다.\n내가 먼저 건넬 때,\n나에게도 그대로 돌아옵니다.\n이 온기를,\n잠시 그대로 느껴 봅니다.\n\n이제 이 따뜻한 느낌을 가슴에 담은 채,\n천천히 돌아올 준비를 합니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 한 번 크게 들이마시고,\n천천히 내쉬어 봅니다.\n\n준비가 되면,\n아주 천천히 눈을 떠 봅니다.\n따뜻함이 아직 어깨에 남아 있습니다.\n오늘 하루,\n이 느낌과 함께 편안하게 보내 봅니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #마음이완 #봄날의온기","series":"숨비명상"},{"id":"bf900477","category":"멈춤","title":"잠깐 멈춤","body":"편안한 곳에 앉아 봅니다.\n어깨의 힘을 살며시 풀어 봅니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n오늘 마음이 조금 복잡해도 괜찮습니다.\n아직 마음이 바쁘게 움직여도 괜찮습니다.\n지금은 그저 앉아 있기만 하면 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n가슴께가 조금 넓어지는 느낌입니다.\n\n이제 오늘 하루를 가만히 떠올려 봅니다.\n마음이 살짝 걸렸던 순간이 있었나요.\n누군가의 한마디,\n뜻대로 안 된 일.\n잘 떠오르지 않아도 괜찮습니다.\n\n그 순간,\n가슴이 조금 답답했을지 모릅니다.\n어깨가 살짝 굳었을 수도 있습니다.\n그 느낌을 밀어내지 말고 그대로 둡니다.\n그저 가만히 바라보기만 해 봅니다.\n\n바로 여기서,\n잠깐 멈춰 봅니다.\n숨을 한 번 천천히 쉬어 봅니다.\n올라온 마음에 가만히 이름을 붙여 봅니다.\n'답답했구나',\n'조금 서운했구나' 하고 말입니다.\n\n신기하게도,\n바라보는 순간 조금 옅어집니다.\n파도가 밀려왔다 스르르 빠져나가듯이.\n그 마음도 잠시 머물다 지나갑니다.\n\n이제 눈앞에 따뜻한 햇살을 떠올려 봅니다.\n창으로 봄볕이 부드럽게 들어옵니다.\n그 빛이 얼굴에 살포시 닿습니다.\n이마와 뺨이 조금씩 따뜻해집니다.\n\n그 온기 속에서 가만히 속삭여 봅니다.\n'그럴 수도 있지.' '이만하길 다행이야.' 마음 한구석이 스르르 풀립니다.\n\n어떤 일이 찾아와도 괜찮습니다.\n상황은 내가 고를 수 없지만,\n어떻게 바라볼지는 내가 고를 수 있습니다.\n\n이 따뜻하고 가벼운 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n오늘 마음이 걸리는 순간이 오면,\n살짝 멈추고,\n이 온기를 떠올려 봅니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #감정바라보기 #긍정한스푼","series":"숨비명상"},{"id":"200ff481","category":"용서감사","title":"내 안의 빛","body":"편안한 곳에 앉아 봅니다.\n등을 편하게 기대어 봅니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n마음이 아직 분주해도 괜찮습니다.\n오늘 기쁜 일이 없었어도 괜찮습니다.\n지금은 그저 편히 쉬어 가는 시간입니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 따뜻한 봄볕을 떠올려 봅니다.\n노란 햇살이 창으로 들어옵니다.\n그 빛이 얼굴과 어깨에 내려앉습니다.\n포근한 이불처럼 온몸을 감쌉니다.\n\n그 따뜻함이 가슴 한가운데로 모입니다.\n가슴 안에 작은 빛 하나가 켜집니다.\n숨을 쉴 때마다 조금씩 밝아집니다.\n\n이제 이 빛에 감사를 얹어 봅니다.\n오늘 고마웠던 일을 하나 떠올려 봅니다.\n아주 작은 것이어도 괜찮습니다.\n따뜻한 밥 한 끼,\n짧은 안부.\n떠올릴 때마다 빛이 조금 더 커집니다.\n\n나에게 고마운 점도 하나 찾아봅니다.\n잘 버텨 온 나, 애쓴 나.\n잘 떠오르지 않아도 괜찮습니다.\n그 마음만으로도 빛은 이미 밝습니다.\n\n이제 그 빛을 바라보며 속삭여 봅니다.\n'나는 지금의 나를 사랑합니다.' '나는 지금의 내 모습을 사랑합니다.' '나는 있는 그대로 괜찮습니다.'\n\n말이 조금 어색해도 괜찮습니다.\n그저 나를 가만히 안아 준다 여깁니다.\n가슴 속 빛이 환하게 차오릅니다.\n\n이제 그 빛이 몸 밖으로 퍼집니다.\n방 안이 은은하게 밝아지는 느낌입니다.\n그 따뜻함을 곁의 누군가에게 보냅니다.\n\n이 밝고 포근한 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n가슴 속 빛은 그대로 남아 있습니다.\n오늘 하루,\n그 빛을 환하게 켜고 지냅니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #자기사랑 #감사의빛","series":"숨비명상"},{"id":"5e5a4694","category":"수면·이완","title":"그래도 괜찮아","body":"편안한 곳에 앉아 봅니다.\n두 손을 무릎 위에 내려놓습니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n오늘 마음이 무거웠어도 괜찮습니다.\n마음이 이리저리 흔들려도 괜찮습니다.\n지금은 그저 앉아 쉬어 가면 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 몸이 편해집니다.\n\n이제 잔잔한 바다 위를 떠올려 봅니다.\n나는 작은 돛단배에 앉아 있습니다.\n배가 물결 따라 살며시 흔들립니다.\n햇살이 따뜻하게 등을 데워 줍니다.\n\n가끔 큰 물결이 밀려오기도 합니다.\n배가 출렁,\n마음도 함께 흔들립니다.\n그래도 배는 가라앉지 않습니다.\n나를 그대로 실은 채 떠 있습니다.\n\n물결이 밀려올 때마다 속삭여 봅니다.\n'그래도 괜찮아.' '그래도 이만해서 다행이야.' 말이 조금 어색해도 괜찮습니다.\n\n큰 물결도 잠시 뒤엔 잔잔해집니다.\n슬픔도, 화도,\n파도처럼 지나갑니다.\n나는 그저 배 위에서 바라봅니다.\n\n저 멀리 따뜻한 섬이 보입니다.\n노란 햇살이 모래밭을 밝히고 있습니다.\n배가 천천히 그 섬으로 다가갑니다.\n\n모래에 발을 딛자 따뜻함이 번집니다.\n바닷바람이 얼굴을 부드럽게 스칩니다.\n여기서는 서두를 것이 없습니다.\n\n이 섬에서 가만히 속삭여 봅니다.\n'그래도 살아 있어서 고마워.' '그래도 당신이 있어서 감사해.' 가슴이 조금 따뜻해집니다.\n\n이 따뜻한 느낌을 가슴에 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n마음이 흔들리는 날이 오면,\n'그래도 괜찮아' 하고 속삭여 봅니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #그래도괜찮아 #마음의파도","series":"숨비명상"},{"id":"e4c8db6f","category":"수면·이완","title":"짐 내려놓기","body":"편안한 곳에 앉아 봅니다.\n어깨를 한 번 으쓱 올렸다 내립니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n오늘 어깨가 무거웠어도 괜찮습니다.\n마음이 지쳐 있어도 괜찮습니다.\n지금은 아무것도 하지 않아도 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 어느 산길을 떠올려 봅니다.\n나는 무거운 배낭을 메고 걷고 있습니다.\n어깨끈이 파고들고 숨이 찹니다.\n그동안 참 열심히 걸어왔습니다.\n\n이제 걸음을 멈추고 배낭을 내려놓습니다.\n어깨에서 무게가 스르르 사라집니다.\n등이 가벼워지고 숨이 트입니다.\n날아갈 것처럼 몸이 가벼워집니다.\n\n그 배낭 안엔 무엇이 있었을까요.\n오래 담아 둔 걱정과 서운함.\n잠시 열어 가만히 바라봅니다.\n'많이 무거웠구나' 하고 토닥여 봅니다.\n\n이제 가벼운 걸음으로 천천히 내려갑니다.\n바쁠 땐 보이지 않던 것들이 보입니다.\n길가에 작은 풀꽃이 웃고 있습니다.\n잠자리 한 마리가 나뭇가지에 앉아 쉽니다.\n\n그 모습을 가만히 바라봅니다.\n쉬는 것도 참 좋은 일입니다.\n나도 이대로 잠시 쉬어도 괜찮습니다.\n\n문득 누군가의 얼굴이 떠오릅니다.\n그 사람도 나처럼 무거운 짐을 졌습니다.\n'당신도 많이 애썼구나' 하고 속삭입니다.\n마음이 조금 부드러워집니다.\n\n맑은 바람이 얼굴을 스치고 지나갑니다.\n숲 냄새가 코끝에 은은하게 남습니다.\n세상이 조금 더 맑아 보입니다.\n\n이 가볍고 편안한 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n어깨가 무거워지는 날이 오면,\n잠시 짐을 내려놓고 쉬어 봅니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #내려놓기 #쉼","series":"숨비명상"},{"id":"c23fa7e0","category":"멈춤","title":"바로 지금","body":"편안한 곳에 앉아 봅니다.\n허리를 반듯하게 펴 봅니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n머릿속에 내일 걱정이 떠올라도 괜찮습니다.\n지난 일이 자꾸 생각나도 괜찮습니다.\n지금은 그저 여기 앉아 있으면 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n지금 이 숨은 지금만의 숨입니다.\n\n이제 지금 이 순간에 머물러 봅니다.\n바닥에 닿은 몸의 무게를 느낍니다.\n가슴이 오르내리는 움직임을 느낍니다.\n멀리서 들리는 작은 소리도 들어 봅니다.\n\n과거도 아니고 미래도 아닙니다.\n바로 지금,\n나는 여기 있습니다.\n숨을 쉬고 있고,\n깨어 있습니다.\n\n이제 창밖이 서서히 밝아 온다 여깁니다.\n새 아침의 빛이 방으로 들어옵니다.\n마치 오늘이 첫날인 것처럼 환합니다.\n그 빛이 얼굴에 따뜻하게 닿습니다.\n\n어제는 이미 지나간 오늘이었습니다.\n내일은 아직 오지 않은 오늘입니다.\n그러니 지금 이 하루가 가장 귀합니다.\n\n가만히 마음속으로 속삭여 봅니다.\n'지금 이 순간이 가장 소중합니다.' '오늘 살아 있어 고맙습니다.' 가슴이 잔잔하게 따뜻해집니다.\n\n이제 곁에 있는 사람을 떠올려 봅니다.\n지금 내 옆의 그 사람이 소중합니다.\n마음속으로 따뜻한 인사를 건네 봅니다.\n\n이 맑고 산뜻한 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n마음이 어제나 내일로 달려갈 때면,\n숨을 한 번 쉬며 지금으로 돌아옵니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #지금이순간 #오늘하루","series":"숨비명상"},{"id":"e0f92283","category":"탈중심화","title":"쥔 손 펴기","body":"편안한 곳에 앉아 봅니다.\n두 손을 무릎 위에 올려 둡니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n마음이 무언가에 쫓기고 있어도 괜찮습니다.\n놓친 일이 자꾸 떠올라도 괜찮습니다.\n지금은 잠시 멈추어 쉬는 시간입니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 한 손을 가만히 쥐어 봅니다.\n주먹을 조금 더 꽉 쥐어 봅니다.\n손과 팔에 힘이 들어갑니다.\n무언가 붙잡으려 애쓸 때의 느낌입니다.\n\n이 손 안에 무엇이 있나요.\n놓친 것에 대한 아쉬움일지 모릅니다.\n더 가지려는 마음일지도 모릅니다.\n그 무게가 손끝까지 전해집니다.\n\n이제 그 손을 아주 천천히 펴 봅니다.\n손가락 사이로 힘이 빠져나갑니다.\n손바닥이 부드럽게 열립니다.\n팔과 어깨까지 스르르 편안해집니다.\n\n이제 펼친 손바닥을 가만히 바라봅니다.\n그 위에 이미 가진 것들이 놓입니다.\n따뜻한 밥 한 끼,\n편히 쉴 자리.\n오늘도 뛰어 준 나의 심장.\n\n작은 것 같아도 참 많습니다.\n하나를 놓쳐도 여전히 많이 남았습니다.\n그 사실에 마음이 놓입니다.\n\n가만히 마음속으로 속삭여 봅니다.\n'나는 이미 충분히 가졌습니다.' '오늘 이대로도 참 고맙습니다.' 가슴이 잔잔하게 따뜻해집니다.\n\n이 편안하고 넉넉한 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n무언가를 꽉 쥐게 되는 날이면,\n손을 펴 이미 가진 것을 봅니다.\n수고하셨습니다.","duration":"","tags":"#유도명상 #내려놓기 #이미충분해","series":"숨비명상"},{"id":"bfdbda76","category":"자비희사","title":"다정한 물결","body":"편안한 곳에 앉아 봅니다.\n두 손을 무릎 위에 내려놓습니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n오늘 미운 사람이 떠올라도 괜찮습니다.\n마음이 아직 뾰족해도 괜찮습니다.\n지금은 그저 편히 앉아 있으면 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 잔잔한 연못가를 떠올려 봅니다.\n물이 거울처럼 고요합니다.\n햇살이 수면 위에 반짝입니다.\n나는 그 곁에 편안히 앉아 있습니다.\n\n가슴 한가운데가 따뜻해지는 걸 느낍니다.\n그 온기가 물 위에 한 방울 떨어집니다.\n잔잔한 물결이 동그랗게 퍼져 나갑니다.\n\n첫 번째 물결을 나에게 보냅니다.\n'나도 편안하기를.' '오늘 하루 애쓴 나, 수고했어.' 가슴이 조금 더 따뜻해집니다.\n\n다음 물결에 사랑하는 사람을 담습니다.\n떠올리면 마음이 놓이는 얼굴입니다.\n'당신도 편안하기를.' '당신도 행복하기를.'\n\n이제 조금 어려운 사람을 떠올려 봅니다.\n나를 서운하게 했던 누군가입니다.\n그 사람도 나처럼 지치고 아팠습니다.\n그에게서도 나는 무언가를 배웁니다.\n\n가만히 그 사람에게도 물결을 보냅니다.\n'당신도 편안하기를.' 마음의 뾰족함이 조금 무뎌집니다.\n\n이제 물결이 연못 끝까지 퍼집니다.\n멀고 가까운 모든 이에게 닿습니다.\n'모두가 편안하기를.' '모두가 행복하기를.'\n\n이 따뜻하고 넉넉한 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n누군가가 미워지는 날이 오면,\n그에게 다정한 물결 하나 보내 봅니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #자애명상 #다정함","series":"숨비명상"},{"id":"5edb1cb7","category":"수용","title":"나는 꽃","body":"편안한 곳에 앉아 봅니다.\n어깨의 힘을 살며시 풀어 봅니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n오늘 마음이 시들해도 괜찮습니다.\n스스로가 초라하게 느껴져도 괜찮습니다.\n지금은 그저 편히 쉬어 가는 시간입니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 따뜻한 봄볕을 떠올려 봅니다.\n햇살이 부드럽게 온몸을 감쌉니다.\n그 빛 속에 작은 꽃봉오리가 있습니다.\n아직 오므리고 있는 한 송이입니다.\n\n이제 두 손바닥으로 얼굴을 감싸 봅니다.\n손바닥이 포근한 꽃받침이 되어 줍니다.\n그 위에 놓인 내 얼굴이 꽃입니다.\n입가에 옅은 미소를 지어 봅니다.\n\n따뜻한 손길에 봉오리가 스르르 벌어집니다.\n한 잎,\n두 잎 천천히 열립니다.\n나만의 빛깔과 향기가 피어납니다.\n누구와도 같지 않은 한 송이입니다.\n\n이 꽃은 원래부터 내 안에 있었습니다.\n누군가 내 이름을 다정히 불러 주었습니다.\n그때 나는 활짝 피어날 수 있었습니다.\n\n그 고마운 얼굴들을 하나둘 떠올려 봅니다.\n나를 믿어 주고 손 내밀어 준 사람들.\n마음속으로 가만히 인사를 건넵니다.\n'덕분에 내가 피었습니다, 고맙습니다.'\n\n이제 나 자신에게도 속삭여 봅니다.\n'나는 있는 그대로 한 송이 꽃입니다.' '나는 나만의 향기를 지녔습니다.' 가슴 가득 따뜻함이 차오릅니다.\n\n이 환하고 포근한 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n오늘 누군가를 만나면,\n꽃처럼 환하게 웃어 봅니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #자기사랑 #나는꽃","series":"숨비명상"},{"id":"68b42c83","category":"수용","title":"뿌리 깊은 나무","body":"편안한 곳에 앉아 봅니다.\n두 발을 바닥에 나란히 둡니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n오늘 내가 작게 느껴져도 괜찮습니다.\n내가 어디서 왔든 지금은 괜찮습니다.\n지금은 그저 편히 앉아 있으면 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 몸이 편해집니다.\n\n이제 한 그루 나무를 떠올려 봅니다.\n넓은 들판에 홀로 서 있습니다.\n그 나무가 바로 나 자신입니다.\n두 발은 땅에 뿌리내리고 있습니다.\n\n발바닥에서 뿌리가 뻗어 나갑니다.\n땅속 깊이,\n아래로 내려갑니다.\n그 뿌리가 나를 단단히 붙듭니다.\n바람이 불어도 흔들리지 않습니다.\n\n이 뿌리를 따라 아래로 내려가 봅니다.\n그 아래엔 나를 있게 한 이들이 있습니다.\n부모님,\n그리고 그 위의 어른들.\n저마다 고단한 하루를 살아냈습니다.\n\n거친 손으로 나를 키워 냈습니다.\n그 애씀이 지금의 나를 떠받칩니다.\n비록 시작은 소박했을지 모릅니다.\n그래도 부끄러운 뿌리는 없습니다.\n\n마음속으로 그분들께 인사를 건넵니다.\n'그 덕분에 제가 여기 있습니다.' '고맙습니다, 그리고 자랑스럽습니다.' 가슴이 뭉클하게 따뜻해집니다.\n\n이제 다시 위를 향해 자라 봅니다.\n줄기가 곧게 하늘로 뻗습니다.\n따뜻한 햇살이 잎마다 내려앉습니다.\n나는 있는 그대로 귀한 나무입니다.\n\n가만히 나 자신에게 속삭여 봅니다.\n'나는 축복받은 사람입니다.' '나는 이 자리에 당당히 섭니다.' 든든함이 온몸에 번집니다.\n\n이 단단하고 따뜻한 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n마음이 흔들리는 날이 오면,\n발밑의 깊은 뿌리를 떠올려 봅니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #자존감 #뿌리","series":"숨비명상"},{"id":"94d63367","category":"관찰","title":"고요한 등불","body":"편안한 곳에 앉아 봅니다.\n두 손을 무릎 위에 내려놓습니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n머릿속이 시끄러워도 괜찮습니다.\n생각이 자꾸 떠올라도 괜찮습니다.\n지금은 그저 조용히 앉아 있으면 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 주변의 소리에 가만히 귀 기울입니다.\n멀리서 들리던 소리가 잦아듭니다.\n말도,\n생각도 잠시 내려놓습니다.\n고요가 방 안에 조용히 내려앉습니다.\n\n이 고요 속에 작은 촛불 하나를 떠올립니다.\n가슴 한가운데에서 잔잔히 타오릅니다.\n마음이 바쁘면 불꽃이 흔들립니다.\n고요해질수록 불꽃은 곧고 환합니다.\n\n숨이 잔잔해질 때마다 더 밝아집니다.\n그 따뜻한 빛을 가만히 바라봅니다.\n서두르지 않아도 저절로 빛납니다.\n\n이 빛은 늘 내 안에 있었습니다.\n멀리서 찾을 필요가 없었습니다.\n바쁜 마음에 잠시 가려졌을 뿐입니다.\n고요해지자 비로소 드러납니다.\n\n이 빛이 곧 나의 보물입니다.\n누가 준 것도,\n사야 할 것도 아닙니다.\n처음부터 내가 지니고 있었습니다.\n\n가만히 나 자신에게 속삭여 봅니다.\n'나는 이미 충분히 가졌습니다.' '내 안에 따뜻한 빛이 있습니다.' 가슴이 잔잔하게 따뜻해집니다.\n\n이 고요하고 환한 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n마음이 소란해지는 날이 오면,\n잠시 고요 속 등불을 떠올려 봅니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #고요 #내안의보물","series":"숨비명상"},{"id":"3e38e9ed","category":"관찰","title":"차 한잔","body":"편안한 곳에 앉아 봅니다.\n두 손을 무릎 위에 내려놓습니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n오늘 할 일이 많아 바빴어도 괜찮습니다.\n마음이 아직 분주해도 괜찮습니다.\n지금은 잠시 멈추어 쉬는 시간입니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 손안에 따뜻한 찻잔을 떠올려 봅니다.\n두 손으로 잔을 가만히 감쌉니다.\n손바닥으로 따뜻한 온기가 스며듭니다.\n그 온기가 팔을 타고 번집니다.\n\n찻잔에서 김이 천천히 피어오릅니다.\n그 위로 은은한 향이 올라옵니다.\n가만히 코로 그 향을 맡아 봅니다.\n마음이 조금 느긋해집니다.\n\n이제 한 모금 천천히 마셔 봅니다.\n따뜻함이 목을 타고 내려갑니다.\n가슴속까지 그 온기가 퍼집니다.\n지금은 그저 이 한 모금뿐입니다.\n\n여기서는 아무것도 하지 않아도 됩니다.\n서두를 것도,\n풀 숙제도 없습니다.\n그저 차 한잔을 마실 뿐입니다.\n\n흐렸던 마음도 이 잔처럼 잔잔해집니다.\n비 온 뒤 흙탕물이 가라앉아 맑아지듯이.\n가만히 두면 저절로 맑아집니다.\n\n이 평범한 한 모금이 참 귀합니다.\n가만히 마음속으로 속삭여 봅니다.\n'이 순간으로 충분합니다.' '그저 쉬어도 괜찮습니다.'\n\n이 따뜻하고 고요한 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n마음이 바빠지는 날이 오면,\n따뜻한 차 한잔을 천천히 마셔 봅니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #차명상 #쉼","series":"숨비명상"},{"id":"a2b0afa1","category":"관찰","title":"높이서 보면","body":"편안한 곳에 앉아 봅니다.\n두 손을 무릎 위에 내려놓습니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n오늘 머리가 복잡했어도 괜찮습니다.\n걱정이 뒤엉켜 있어도 괜찮습니다.\n지금은 잠시 내려놓고 쉬면 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 복잡한 도시 한복판을 떠올려 봅니다.\n높은 건물들이 사방을 막고 섰습니다.\n길은 뒤엉키고 마음도 답답합니다.\n요즘 내 마음과 조금 닮았습니다.\n\n이제 그곳을 벗어나 산길을 오릅니다.\n한 걸음,\n한 걸음 위로 올라갑니다.\n숨이 조금 차지만 바람이 시원합니다.\n오를수록 시야가 점점 넓어집니다.\n\n이윽고 산마루에 올라섭니다.\n발아래로 도시 전체가 펼쳐집니다.\n높기만 하던 건물이 나지막해 보입니다.\n얽혀 있던 길도 단순해 보입니다.\n\n조금 전 나를 짓누르던 걱정도,\n여기서 내려다보니 작게 느껴집니다.\n그저 풍경의 한 부분일 뿐입니다.\n\n넓은 하늘 아래 크게 숨을 쉽니다.\n들이쉬며 가슴을 활짝 채웁니다.\n내쉬며 묵은 답답함을 비웁니다.\n마음에 시원한 빈자리가 생깁니다.\n\n그 빈자리에 맑은 하늘이 담깁니다.\n멀리 산과 바람도 함께 담깁니다.\n비우니 오히려 넉넉해집니다.\n\n가만히 마음속으로 속삭여 봅니다.\n'멀리서 보면 다 지나갑니다.' '비운 만큼 편안해집니다.' 가슴이 한결 가벼워집니다.\n\n이 넓고 시원한 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n마음이 뒤엉켜 답답한 날이 오면,\n잠시 높은 곳에서 내려다본다 여깁니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #관점바꾸기 #비움","series":"숨비명상"},{"id":"07f9076c","category":"움직임명상","title":"내 걸음으로","body":"편안한 곳에 앉아 봅니다.\n두 발을 바닥에 나란히 둡니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n오늘 남과 자꾸 비교했어도 괜찮습니다.\n내가 뒤처진 것 같아도 괜찮습니다.\n지금은 잠시 쉬어 가는 시간입니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 길게 뻗은 들길을 떠올려 봅니다.\n나는 그 길의 출발선에 서 있습니다.\n누군가는 나를 앞질러 달려갑니다.\n저만치 빠르게 사라져 갑니다.\n\n그 모습에 마음이 조급해집니다.\n그래도 괜찮습니다,\n조급함도 지나갑니다.\n숨을 한 번 고르고 걸음을 뗍니다.\n\n한 발,\n또 한 발 내딛습니다.\n발바닥이 땅에 닿는 느낌을 느낍니다.\n서두르지 않고 내 속도로 걷습니다.\n느려도 나는 앞으로 나아갑니다.\n\n길가에 작은 풀꽃이 눈에 들어옵니다.\n'저건 뭘까' 하고 가만히 바라봅니다.\n천천히 걸으니 더 많이 보입니다.\n걷는 길이 조금씩 즐거워집니다.\n\n다리가 무거워지면 잠시 멈춥니다.\n쉬어도 길이 사라지지 않습니다.\n숨을 고르고 다시 걸으면 됩니다.\n\n문득 내 손에 작은 등불이 있습니다.\n남이 아닌 내 발밑을 비춥니다.\n그 빛만 있으면 길을 잃지 않습니다.\n\n가만히 마음속으로 속삭여 봅니다.\n'내 속도로 가도 괜찮습니다.' '나는 나를 믿고 걷습니다.' 마음에 잔잔한 힘이 차오릅니다.\n\n이 단단하고 편안한 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n남과 비교되어 조급한 날이 오면,\n내 걸음으로 한 발만 내딛어 봅니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #나의속도 #자기신뢰","series":"숨비명상"},{"id":"3a2449a0","category":"수용","title":"다시 일어서기","body":"편안한 곳에 앉아 봅니다.\n두 손을 무릎 위에 내려놓습니다.\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n요즘 마음이 주저앉아 있어도 괜찮습니다.\n힘이 하나도 없어도 괜찮습니다.\n지금은 그저 가만히 쉬어도 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n한 번 더,\n천천히 들이마시고 내쉽니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n이제 오래 걸어온 나를 떠올려 봅니다.\n지쳐서 길바닥에 주저앉아 있습니다.\n다리가 무겁고 일어설 힘이 없습니다.\n아무도 나를 일으켜 주지 않습니다.\n\n그래도 괜찮습니다,\n잠시 쉬어 갑니다.\n주저앉은 그 마음을 탓하지 않습니다.\n그저 가만히 숨을 쉬어 봅니다.\n\n그런데 숨은 저절로 이어지고 있습니다.\n심장도 스스로 뛰고 있습니다.\n가슴 어딘가에 작은 온기가 남아 있습니다.\n나는 텅 빈 것이 아니었습니다.\n\n그 온기가 바로 나의 힘입니다.\n누가 대신 일어서 줄 수는 없습니다.\n하지만 나는 스스로 일어설 수 있습니다.\n\n두 손을 땅에 가만히 짚어 봅니다.\n땅이 단단하게 나를 받쳐 줍니다.\n천천히,\n내 힘으로 몸을 일으킵니다.\n한 무릎을 세우고,\n다리에 힘을 줍니다.\n\n이윽고 두 발로 우뚝 섭니다.\n내 두 다리가 나를 지탱합니다.\n비틀거려도 다시 중심을 잡습니다.\n스스로 일어선 그 느낌을 느껴 봅니다.\n\n가만히 마음속으로 속삭여 봅니다.\n'나는 다시 일어설 수 있습니다.' '넘어져도 스스로 일어섭니다.' 잔잔한 힘이 온몸에 퍼집니다.\n\n이 단단하고 따뜻한 느낌을 담아 둡니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n마음이 주저앉는 날이 오면,\n내 안의 온기를 떠올리며 일어섭니다.\n수고하셨습니다.","duration":"약 7분","tags":"#유도명상 #다시일어서기 #내면의힘","series":"숨비명상"},{"id":"4f9b431e","category":"수용","title":"거울 앞에서","body":"무용을 배우는 사람은 거울 앞에서 같은 동작을 여러 번 다듬습니다.\n연습실에서 충분히 익힌 뒤에야 무대에 올라 자연스럽게 춤을 춥니다.\n\n우리 마음에도 그런 조용한 연습실이 하나 있으면 좋겠습니다.\n오늘은 그 연습실로 천천히 들어가 봅니다.\n\n편안한 곳에 앉아 봅니다.\n등을 편하게 기대어도 좋습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n오늘 마음에 무거운 감정이 남아 있어도 괜찮습니다.\n서운함도, 화도,\n그대로 데려와도 됩니다.\n이곳에서는 내려놓아도 되고,\n울어도 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 조금 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n가슴에 얹혀 있던 것들이 숨과 함께 조금씩 풀려 나갑니다.\n\n생각이 자꾸 끼어들어도 괜찮습니다.\n끼어든 것을 알아차린 그 순간,\n이미 다시 돌아온 것입니다.\n\n무거운 감정이 잘 빠져나가지 않아도 괜찮습니다.\n그저 여기 있구나,\n하고 알아주면 됩니다.\n\n이제 마음속에 커다란 거울 하나를 떠올려 봅니다.\n그 거울 앞에 내가 서 있습니다.\n\n거울 속의 나를 가만히 바라봅니다.\n오늘 하루를 지나오느라 애쓴 얼굴입니다.\n조금 지쳐 보여도 괜찮습니다.\n\n그 얼굴을 탓하지 않고 그저 다정하게 바라봐 줍니다.\n오래된 친구를 바라보듯이.\n\n이제 입꼬리를 아주 조금 올려 봅니다.\n억지로 크게 웃지 않아도 됩니다.\n아주 옅은 미소면 충분합니다.\n\n거울 속의 나도 따라 웃습니다.\n웃음이 어색해도 괜찮습니다.\n어색한 그 미소도 좋은 연습이 됩니다.\n\n이 사람은 참 귀한 사람입니다.\n세상에 단 하나뿐인 얼굴입니다.\n누구보다 다정하게 대해도 좋은 사람입니다.\n\n가만히 두 손을 가슴 앞에 모아 봅니다.\n걸음마를 뗀 아이에게 손뼉 쳐 주듯,\n오늘의 나에게 마음속으로 손뼉을 쳐 줍니다.\n\n'오늘도 잘 견뎠어.' '여기까지 온 것만으로 충분해.' 가슴 한가운데가 조금씩 따뜻해집니다.\n\n그 따뜻함이 얼굴로 번져 미소가 조금 더 자연스러워집니다.\n\n이 미소를 그대로 지니고 연습실 문을 열고 나갈 준비를 합니다.\n여기서 연습한 웃음은 집에서도,\n길에서도 그대로 꺼내 쓸 수 있습니다.\n\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 누군가를 만나면 내가 먼저 아주 살짝 웃어 봅니다.\n그 작은 미소 하나면 충분합니다.","duration":"약 8분","tags":"#미소명상 #자기존중 #웃음연습","series":"숨비명상"},{"id":"3e77069b","category":"자비희사","title":"마음의 밭","body":"새해가 되면 우리는 서로에게 복 많이 받으라고 인사합니다.\n그런데 복은 누가 손에 쥐여 주는 것이 아닌지도 모릅니다.\n\n오히려 복은 밭을 가꾸는 일과 조금 닮았습니다.\n오늘은 마음속에 작은 밭 하나를 떠올려 봅니다.\n\n편안한 곳에 앉아 봅니다.\n두 손을 무릎 위에 가만히 내려놓습니다.\n준비가 되면 천천히 눈을 감아 봅니다.\n\n오늘 마음이 무언가를 바라느라 조금 지쳐 있어도 괜찮습니다.\n그 마음도 그대로 데려와도 됩니다.\n\n숨을 코로 천천히 들이마셔 봅니다.\n입으로 길게 내쉬어 봅니다.\n내쉬는 숨을 따라 어깨가 내려갑니다.\n\n한 번 더,\n천천히 들이마시고 내쉽니다.\n마음이 조금씩 느긋해집니다.\n\n생각이 자꾸 끼어들어도 괜찮습니다.\n끼어든 것을 알아차린 그 순간,\n이미 다시 돌아온 것입니다.\n\n이제 눈앞에 작은 텃밭 하나를 그려 봅니다.\n햇살이 따뜻하게 흙 위에 내려앉아 있습니다.\n이 밭이 바로 나의 마음입니다.\n\n가만히 내 두 손을 바라봅니다.\n그동안 이 손은 무언가 받으려고 자주 펼쳐져 있었습니다.\n\n'이것 좀 주세요, 저것 좀 주세요.' 그렇게 바라던 날도 많았습니다.\n그런 마음도 잘못이 아닙니다.\n\n이제 그 손을 천천히 흙으로 가져가 봅니다.\n받으려던 그 손으로 씨앗 하나를 흙에 심어 봅니다.\n\n첫 번째 씨앗은 따뜻한 말 한마디입니다.\n오늘 누군가에게 건넬 '고마워요' 한마디를 흙에 묻습니다.\n\n두 번째 씨앗은 작은 도움입니다.\n문을 잡아 주는 일,\n자리를 양보하는 일을 심어 봅니다.\n\n세 번째 씨앗은 미소입니다.\n내가 먼저 짓는 옅은 웃음을 심습니다.\n\n손끝에 닿는 흙이 서늘하고 촉촉합니다.\n흙냄새가 은은하게 올라옵니다.\n\n씨앗을 다 심고 나면 따뜻한 햇살과 부드러운 비가 이 밭을 천천히 돌봐 줍니다.\n\n씨앗이 언제 싹틀지는 몰라도 괜찮습니다.\n심는 순간,\n이미 밭은 시작되었습니다.\n\n가만히 느껴 봅니다.\n무언가 받았을 때보다 씨앗을 심는 지금이 더 넉넉합니다.\n\n이 밭에서 자란 것은 나 혼자 먹는 것이 아닙니다.\n곁의 사람과 함께 나누는 것입니다.\n\n그렇게 생각하니 가슴 한가운데가 조금 따뜻해집니다.\n\n이 따뜻한 느낌을 그대로 지녀 봅니다.\n손끝을 조금씩 움직여 봅니다.\n발끝도 가볍게 꼼지락거려 봅니다.\n숨을 크게 들이마시고 천천히 내쉽니다.\n\n준비가 되면 천천히 눈을 떠 봅니다.\n\n오늘 하루,\n누군가에게 복을 달라고 비는 대신 작은 씨앗 하나를 심어 봅니다.\n따뜻한 말 한마디면 충분합니다.","duration":"약 8분","tags":"#베풂명상 #복짓기 #마음챙김","series":"숨비명상"},{"id":"4572aec8","category":"용서감사","title":"밥 한 그릇","body":"우리는 자주 화면을 보거나 이야기를 하면서 밥을 먹습니다.\n정작 무엇을 먹었는지 기억나지 않을 때도 많습니다.\n\n오늘은 딱 한
