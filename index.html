리로 점점 더 깊이 가라앉습니다.\n\n나무와 하나가 됩니다.\n내가 나무입니다.\n\n땅이 나의 뿌리를 지탱하고,\n태양이 나의 가지를 보살핍니다.\n\n\n이제,\n다시 호흡으로 의식을 돌립니다.\n\n떠나가는 날숨을 알아차리며,\n\n나만의 리듬으로 천천히,\n자연스럽게 숨을 쉽니다.\n\n이 하나됨에서 빠져나올 준비가 되었다면,\n\n지금 내가 있는 이 자리로 가만히 의식을 되돌립니다.\n\n한 번 더 천천히,\n깊게 숨을 쉬고,\n\n준비가 되면,\n부드럽게 눈을 떠 봅니다.\n\n───\n진행 메모\n\n낭독 팁 : 야외에서 실제 나무에 등을 기대고 하면 특히 좋은 접지(그라운딩) 명상(약 10분)입니다. 날숨에 초점을 두는 도입, 뿌리로 땅의 기운을 끌어올리는 대목, 태양의 온기를 받는 대목을 아주 느리게 읽습니다. 마치고 나서 지금의 느낌을 짧게 적어 두면, 다음에 이 상태로 돌아오기가 쉬워집니다. 기존 '흔들리지 않는 나무'와 짝을 이루는 접지 명상입니다.","duration":"약 10분","tags":"#나무명상 #접지 #그라운딩","series":"숨비명상"},{"id":"a1b8fed4","category":"탈중심화","title":"파도가 아니라 바다","body":"자세를 바르게 하고,\n편안히 앉아 눈을 지그시 감습니다.\n\n먼저,\n깊은 숨을 세 번 쉬어 봅니다.\n\n코로 깊이 들이쉬고,\n길게 내쉬고.\n\n들이쉬고, 내쉬고.\n\n한 번 더, 들이쉬고,\n천천히 내쉽니다.\n\n이제,\n호흡과 함께 몸의 긴장을 하나씩 풀어 봅니다.\n\n의식을 머리로 가져가,\n들숨에 숨이 들어오고 날숨에 빠져나가며 머리가 이완되는 것을 느낍니다.\n\n얼굴이 부드럽게 풀리고,\n\n무거운 두 어깨가 호흡과 함께 스르르 내려앉습니다.\n\n숨이 팔을 지나 손끝으로 빠져나가며 두 팔이 가볍게 풀리고,\n\n답답하던 가슴, 긴장된 배,\n꽉 조이던 골반도 차례로 편안하게 풀립니다.\n\n숨이 허벅지로 들어와 발끝으로 빠져나가며,\n두 다리가 가볍게 풀어집니다.\n\n이제, 가볍게 이완된 채,\n의식을 호흡에 모읍니다.\n\n코끝,\n혹은 배 가운데 편한 곳에 의식을 두고,\n\n숨이 들고 날 때 느껴지는 감각을 가만히 관찰합니다.\n\n힘주어 집중하려 하지 않습니다.\n아무 의도도 더하지 않고,\n그저 편안하게 지켜보기만 합니다.\n\n지금부터 내가 할 일은,\n일어나는 모든 것을 아무런 판단 없이,\n있는 그대로 알아차리는 것뿐입니다.\n\n나는 지금,\n오직 지켜보는 자로 존재합니다.\n\n가만히 있으면,\n내 마음 공간 안에 생각과 감정과 감각이,\n\n물방울처럼 뽕, 뽕,\n떠오릅니다.\n\n생각이 떠오르면,\n생각이라고 이름을 붙이고 지켜봅니다.\n\n감정이 올라오면,\n감정이라고 이름을 붙이고 지켜봅니다.\n\n몸의 감각이 느껴지면,\n감각이라고 이름을 붙이고 지켜봅니다.\n\n무엇이 떠오르든,\n반응하거나 붙잡지 않고,\n그저 한 걸음 물러나,\n제삼자가 바라보듯 지켜봅니다.\n\n마치 바다에 물결치는 파도를 바라보듯이.\n\n무엇이 일어나도 괜찮습니다.\n저항하지 않고,\n모두 그대로 허용합니다.\n\n그렇게 지켜보다 보면,\n가만히 알게 됩니다.\n\n나는 이 몸이 아닙니다.\n나는 떠오르는 생각도,\n감정도 아닙니다.\n나는 보고 듣고 느끼는 이 감각들도 아닙니다.\n\n나는,\n이 모든 것을 지켜보는 관찰자입니다.\n\n나는 파도가 아니라,\n바다 그 자체입니다.\n\n아무리 거센 파도가 몰아쳐도,\n저 깊은 바다의 심연은 언제나 잔잔하듯이,\n\n어떤 생각과 감정이 일어나도,\n\n본래의 나는 그 무엇에도 물들지 않고,\n고요히, 텅 비어 있습니다.\n\n파도를 바라보듯,\n일어나는 모든 것을 그저 지켜봅니다.\n\n저항하지 않고 지켜보면,\n그것들은 물거품처럼 스르르 사라집니다.\n\n이제, 파도가 잠잠해지고,\n\n나는 바다의 깊은 심연으로 천천히 가라앉습니다.\n\n잠시, 그 텅 빈 고요 속에,\n\n잔잔한 호흡의 흐름과 함께 가만히 머물러 봅니다.\n\n\n안내는 여기까지입니다.\n\n조금 더 이 고요에 머물고 싶다면,\n그대로 명상을 이어 가고,\n\n마치고 싶다면,\n호흡을 고르며 천천히 눈을 떠 봅니다.\n\n───\n진행 메모\n\n낭독 팁 : 몸 이완→호흡→관찰자 순으로 진행하는 텅빈 충만(관찰자) 명상(약 12분)입니다. \"생각·감정·감각\"에 이름 붙여 지켜보는 대목과 \"나는 …가 아니다 / 나는 파도가 아니라 바다다\"는 아주 천천히, 여백을 넉넉히 둡니다. 잔잔한 싱잉볼(종소리)을 곁들여도 좋습니다. 마지막은 각자 이어가거나 마치도록 열어 둡니다.","duration":"약 12분","tags":"#텅빈충만 #관찰자 #알아차림","series":"숨비명상"},{"id":"400854df","category":"자비희사","title":"나의 다정한 친구","body":"마음이 힘든가요?\n내가 충분히 괜찮은 사람인지 걱정이 되나요?\n\n문득 외롭고, 슬프고,\n화가 나는 내 모습에 당혹스러운가요?\n\n사실,\n나만 그런 것이 아닙니다.\n\n특히 몸과 마음이 크게 변해 가는 이 시기에는,\n누구나 감정을 더 크게 느끼고,\n자주 흔들립니다.\n\n누군가 내 마음을 알아주고 위로해 주면 좋겠지만,\n그런 사람이 늘 곁에 있는 것은 아닙니다.\n\n그러니 오늘은,\n내가 나의 가장 다정한 친구가 되어,\n스스로를 위로해 봅니다.\n\n편안히 앉거나 누워,\n눈을 가만히 감습니다.\n\n먼저,\n나를 위로하는 손길을 찾아봅니다.\n\n한 손,\n또는 두 손을 가슴 위에 가만히 올려 봅니다.\n\n한 손은 가슴에,\n한 손은 배 위에 올려놓아도 좋고,\n\n두 볼을 부드럽게 감싸거나,\n머리를 천천히 쓰다듬어도 좋습니다.\n\n두 팔을 교차해 나를 꼭 안아 주어도 됩니다.\n\n그 가운데 가장 편안한 손길을 찾아,\n잠시 머물러 봅니다.\n\n이렇게 따뜻한 손길이 몸에 닿으면,\n\n마음의 불안과 긴장이 조금씩 풀려 갑니다.\n\n친한 친구를 다독이듯,\n그 손길로 나를 가만히 다독여 봅니다.\n\n이제, 손은 잠시 내려놓고,\n\n최근에 나를 힘들게 했던 한 상황을 떠올려 봅니다.\n\n누군가의 말에 서운했던 순간,\n소외감이 들었던 순간,\n마음처럼 되지 않아 속상했던 순간.\n\n너무 크고 아픈 일은 오늘은 꺼내지 않습니다.\n몸에 약간의 불편함이 올라오는 정도면 충분합니다.\n\n이제,\n마음의 눈으로 그 상황 속에서 힘들어하고 있는 나를 가만히 바라봅니다.\n\n그리고 부드러운 목소리로,\n나에게 말해 봅니다.\n\n참 힘든 순간이구나.\n많이 아프다.\n이건 정말 원하지 않는 상황이야.\n\n감정을 숨기지 않고,\n지금 마음을 있는 그대로 인정해 줍니다.\n\n할 수 있다면,\n그 감정에 이름을 붙여 봅니다.\n\n화, 슬픔, 외로움.\n\n이름을 붙이면,\n나와 감정 사이에 작은 공간이 생기고,\n마음이 조금 가벼워집니다.\n\n가만히 그 이름을 불러 봅니다.\n\n이것이 슬픔이구나.\n이것이 외로움이구나.\n\n이제,\n발끝에서 머리끝까지 가만히 훑어보며,\n\n그 힘겨움이 몸의 어디에서 가장 크게 느껴지는지 찾아봅니다.\n\n그 자리에 다시 위로의 손길을 얹고,\n부드럽게 다독이며 말해 봅니다.\n\n지금 내가 느끼는 이 감정은,\n누구나 살면서 느끼는 자연스러운 감정이야.\n\n내가 유별나거나 예민해서가 아니야.\n\n이런 상황에서는 누구나 비슷한 마음을 느껴.\n\n나만 그런 게 아니야.\n나 혼자가 아니야.\n\n나를 향한 위로의 말이 잘 떠오르지 않는다면,\n\n나와 똑같은 상황에 있는 친한 친구를 떠올려 봅니다.\n\n그 친구에게 무슨 말을 해 주고 싶나요?\n\n그 말을,\n그대로 나에게도 들려줍니다.\n\n어색해도 괜찮습니다. 천천히,\n다정한 말들을 나에게 건네 봅니다.\n\n내가 나 자신에게 친절하기를.\n\n우울하고 화나는 감정에 빠져 있기보다,\n지금처럼 나를 위로할 수 있기를.\n\n힘겨움 속에서 좌절하기보다,\n나를 위한 일들을 해낼 수 있기를.\n\n그리고 가만히,\n이렇게 말해 봅니다.\n\n내가 너를 사랑해.\n\n너는 웃는 모습이 가장 예쁘고 멋져.\n\n나는 언제나 너를 믿어.\n\n네 안의 가능성을,\n나는 알고 있어.\n\n내가 늘 너와 함께할게.\n\n시간을 갖고,\n지금 나에게 가장 필요한 말들을,\n부드러운 목소리로 들려줍니다.\n\n\n자기 자신을 위로하는 것은,\n나쁜 기분을 억지로 없애려는 것이 아닙니다.\n\n내 마음이 아프기 때문에,\n그 아픔을 다정하게 안아 주는 것입니다.\n\n힘든 순간에 이렇게 나를 위로할 때,\n\n있는 그대로의 나를 사랑하는 마음의 힘이,\n조금씩 자라납니다.\n\n이제 마지막으로,\n두세 번 깊게 숨을 들이쉬고 내쉬며,\n\n이 연습을 가만히 내려놓습니다.\n\n준비가 되면,\n부드럽게 눈을 떠,\n\n나를 위로한 지금 이 마음이 어떤 느낌인지,\n가만히 알아차려 봅니다.\n\n있는 그대로의 나를 사랑하며,\n\n그 무엇이든 될 수 있는 나로,\n멋지게 자라 가기를.\n\n───\n진행 메모\n\n낭독 팁 : 청소년 자기연민(MSC 계열) 명상(약 12분)입니다. 위로의 손길을 찾는 대목과 감정에 이름 붙이는 대목, 자애 문구(\"내가 너를 사랑해 …\")는 아주 천천히, 뒤에 여백을 넉넉히 둡니다. 큰 상처는 다루지 않도록 안내하고, 다정하고 나직한 목소리로 읽습니다. 기존 '나라는 친구'와 짝을 이루는 청소년 자기연민 명상입니다.","duration":"약 12분","tags":"#자기연민 #청소년명상 #자기위로","series":"숨비명상"},{"id":"91c68784","category":"자비희사","title":"내가 숲이 되어","body":"햇살이 따사로운 어느 숲에 오신 것을 환영합니다.\n\n지금 곧장 숲으로 갈 수 없다면,\n\n가까운 공원이나 산책로를 떠올려도 좋고,\n\n예전에 다녀온 어느 숲을 마음속에 그려도 좋습니다.\n\n편안히 자리를 잡고,\n잠시 그 숲을 가만히 느껴 봅니다.\n\n따스한 햇살이 얼굴에 닿고,\n바람이 볼을 스칩니다.\n\n초록빛 나뭇잎 사이로 내려오는 부드러운 햇빛을 느껴 봅니다.\n\n이제,\n허리를 펴고 가슴을 활짝 열어,\n\n눈을 살며시 감고,\n숨을 크게 들이마시고,\n천천히 내쉽니다.\n\n맑은 공기가 가슴 깊이 차오르고,\n\n다시 코를 통해 빠져나가는 것을 가만히 지켜봅니다.\n\n숲의 향기가 마음의 긴장을 스르르 가라앉힙니다.\n\n이제,\n눈을 뜨고 온몸의 감각을 활짝 열어 숲을 만나 봅니다.\n\n혹시 가지고 온 고민이나 어려움이 있다면,\n\n잠시 저 나뭇가지에 살며시 걸어 두고,\n\n지금 여기,\n이 감각들과만 함께합니다.\n\n고개를 돌려 주위의 나무와 풀과 꽃들을 바라봅니다.\n\n햇살을 받은 나뭇잎, 바위,\n흙의 빛깔과 모양을 살펴봅니다.\n\n은은한 숲의 향기를 맡고,\n\n멀리서 들려오는 새소리,\n물소리에 가만히 귀를 기울입니다.\n\n마치 오늘 이 숲에 처음 온 것처럼,\n새롭게 바라봅니다.\n\n이제,\n천천히 자리에서 일어나 숲길을 거닐어 봅니다.\n\n원한다면 신발을 벗고,\n맨발로 흙의 감촉을 느껴도 좋습니다.\n\n한 발, 또 한 발,\n발바닥이 땅에 닿는 그 느낌에 주의를 두고,\n천천히 걸어 봅니다.\n\n걷다가 소리가 들려오면 그 소리에 머물고,\n\n예쁜 꽃이나 나뭇잎을 만나면 잠시 멈추어 함께해도 좋습니다.\n\n이제,\n내가 기댈 만한 든든한 나무를 찾아,\n거기에 가만히 몸을 맡겨 봅니다.\n\n눈을 감고 자연스럽게 호흡하며,\n\n발바닥, 다리,\n가슴에서 일어나는 작은 반응들을 가만히 지켜봅니다.\n\n그 느낌들이 조금씩 잔잔해지며 안정을 찾아가는 것을 알아차립니다.\n\n이제, 눈을 감은 채,\n내가 숲이 되어 보는 상상을 펼쳐 봅니다.\n\n숲이 늘 나를 반겨 주었듯이,\n\n이번에는 내가 숲이 되어,\n새와 바람과 구름이 내 곁에서 쉬어 가도록 품어 봅니다.\n\n나의 두 발은 대지에 굳건히 뿌리내려 모든 것을 길러 냅니다.\n\n나의 두 팔과 다리는 크고 작은 아름드리나무가 되고,\n\n나의 머리는 산꼭대기의 표지석이 됩니다.\n\n깊이 숨을 들이마시고,\n내쉬며,\n\n숲이 된 나를 찾아와 쉬어 가는 새와 바람과 구름,\n따스한 햇살을 느껴 봅니다.\n\n저 멀리,\n색색의 옷을 입은 사람들이 숲을 찾아옵니다.\n\n벗과 이야기를 나누는 이들,\n가만히 쉬어 가는 이들,\n땀 흘려 걷는 이들.\n\n그들 모두가,\n내가 있어 참 좋아합니다.\n\n이렇게 숲이 되어 세상을 바라볼 때,\n\n나와 다른 이들의 마음도 조금 더 넓게 품을 수 있게 됩니다.\n\n이제, 상상의 나래를 접고,\n\n지금 이 자리로 돌아옵니다.\n\n편안하게 호흡하며,\n천천히 눈을 떠 봅니다.\n\n여전히 햇살은 따스합니다.\n\n우리는 가끔 혼자라는 생각에 외로워지고,\n\n위로해 줄 누군가를 찾기도 합니다.\n\n그럴 때 이렇게 숲을 찾아,\n\n그 생명력에 기대어 지친 나를 가만히 돌보는 시간을 가져 봅니다.\n\n마지막으로,\n옛 글의 한 구절을 가만히 음미해 봅니다.\n\n지나간 것에 슬퍼하지 않고,\n오지 않은 것을 동경하지 않으며,\n지금 주어진 것으로 삶을 살아가나니,\n\n그 얼굴빛이 그래서 맑도다.\n\n숲과 함께한 이 시간이,\n\n지친 마음에 잔잔한 평안이 되기를 바랍니다.\n\n───\n진행 메모\n\n낭독 팁 : 약 15분의 숲(산림욕) 명상입니다. 오감으로 숲을 느끼는 대목(햇살·향기·소리·흙)은 각 사이에 여백을 넉넉히. 맨발 걷기·나무에 기대기는 실제로 할 수 있게 천천히. \"내가 숲이 되어\" 남을 품는 대목은 따뜻하고 넉넉하게 읽습니다. 실제 숲·공원에서 하면 더욱 좋고, 실내라면 기억 속 숲을 떠올리게 안내합니다. 피톤치드·세로토닌 등은 시적으로 순화, 경전 구절은 무기명 처리했습니다.","duration":"약 15분","tags":"#숲명상 #산림욕 #오감","series":"숨비명상"},{"id":"caf7e9b7","category":"자비희사","title":"일하는 나에게","body":"하루 종일 사람을 마주하는 일은,\n생각보다 마음을 많이 쓰는 일입니다.\n\n손님이 무리한 요구를 하거나 차갑게 대해도,\n\n속마음과 상관없이 미소를 지어야 할 때,\n\n마음 안에서는 조용히 갈등과 지침이 쌓여 갑니다.\n\n그런 순간,\n잠시 멈추어 나 자신을 따뜻하게 돌보는 자기 연민의 시간을 가져 봅니다.\n\n자기 연민은 세 가지로 이루어집니다.\n\n하나,\n지금 내 마음에 무엇이 일어나는지 알아차리는 것.\n아, 지금 이게 힘듦이구나,\n하고.\n\n둘,\n이 힘듦이 나만 겪는 것이 아니라,\n사람이라면 누구나 겪는 것임을 아는 것.\n\n셋,\n힘들어하는 친구를 위로하듯,\n나 자신에게도 친절한 말을 건네는 것.\n\n먼저,\n마음을 가라앉히는 호흡부터 해 봅니다.\n\n편안한 자세를 찾아,\n눈을 반쯤 뜨거나 가만히 감습니다.\n\n어깨의 힘을 풀고,\n붙들고 있던 어려운 생각들을 잠시 내려놓습니다.\n\n천천히,\n편안하게 숨을 쉽니다.\n\n들이쉬고, 길게 내쉬고.\n\n숨이 들어오고 나가는 것을,\n\n마치 바다의 밀물과 썰물처럼,\n그저 가만히 지켜봅니다.\n\n마음이 다른 생각으로 떠돌아도 괜찮습니다.\n\n생각을 없애려 애쓰지 않고,\n아, 마음이 갔구나,\n하고 다시 호흡으로 돌아옵니다.\n\n그저 호흡합니다.\n\n\n이제,\n나를 사랑하는 마음으로,\n한 손을 가슴 위에 가만히 얹습니다.\n\n손의 따뜻함과 부드러운 감촉을 느껴 봅니다.\n\n이제,\n최근에 나를 힘들게 했던 한 상황을 떠올려 봅니다.\n\n너무 크고 아픈 일은 오늘은 꺼내지 않습니다.\n지금 다룰 만한 한 가지면 충분합니다.\n\n그 상황을 떠올릴 때,\n몸 어딘가에 불편함이 느껴진다면,\n\n그 자리에 가슴에 얹은 손의 온기를 가만히 보내 줍니다.\n\n그리고 마음속으로 말해 봅니다.\n\n아, 이것이 힘듦이구나.\n이것이 고통이구나.\n\n이런 마음은,\n나만 느끼는 것이 아니라,\n\n같은 일을 하는 수많은 사람들이 똑같이 느끼는 것입니다.\n\n내가 유별나거나 부족해서가 아닙니다.\n내 잘못이 아닙니다.\n\n이제,\n따뜻하고 포근한 마음으로,\n나 자신에게 이렇게 들려줍니다.\n\n내가 나 자신에게 친절하기를.\n\n내가 행복하기를.\n\n내가 평화롭기를.\n\n내가 건강하기를.\n\n내가 편안하기를.\n\n내가 안전하기를.\n\n천천히,\n필요한 만큼 몇 번이고 되뇌어 봅니다.\n\n\n우리가 일상을 즐겁게 살아가려면,\n\n먼저 내가 따뜻하고 편안해져야 합니다.\n\n내 안이 먼저 채워져야,\n그 따뜻함이 비로소 바깥으로,\n내가 만나는 이들에게로 흘러갈 수 있습니다.\n\n이제,\n그 따뜻한 마음을 품은 채 숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n준비가 되면,\n부드럽게 눈을 떠 봅니다.\n\n오늘,\n누군가에게 미소를 건네기 전에,\n\n먼저 나 자신에게 따뜻한 한마디를 건네 보시기 바랍니다.\n\n───\n진행 메모\n\n낭독 팁 : 서비스직·감정노동자를 위한 자기연민(MSC) 명상(약 10분)입니다. 호흡(밀물썰물)으로 안정시킨 뒤 자기연민으로 이어집니다. \"내가 …하기를\" 자애 문구는 한 줄씩 아주 천천히, 뒤에 여백을 둡니다. 큰 상처는 다루지 않게 안내하고, 다정하고 나직하게 읽습니다. 기존 '웃음 뒤의 나'와 짝을 이루는 편입니다.","duration":"약 10분","tags":"#자기연민 #감정노동 #서비스업","series":"숨비명상"},{"id":"5dcf5971","category":"수용","title":"부족한 그대로","body":"편안한 자리에 앉습니다.\n\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 내려놓습니다.\n\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n한 번 더,\n들이쉬고…… 내쉽니다.\n\n이제,\n나와 가장 가까운 한 사람을 떠올려 봅니다.\n\n배우자일 수도,\n부모나 자식일 수도,\n오래 함께한 누군가일 수도 있습니다.\n\n가장 가까이 있기에,\n가장 큰 기쁨을 주기도 하고,\n가장 자주 나를 힘들게 하기도 하는 사람입니다.\n\n그 사람에게는,\n내가 이것만은 바뀌었으면 하는 단점 하나가 있을지 모릅니다.\n\n가만히 떠올려 봅니다.\n\n나는 얼마나 오랫동안,\n그 사람이 바뀌기를 바라 왔던가요.\n\n몇 번을 말하고, 부딪히고,\n애를 써 봐도,\n\n그 사람은 좀처럼 바뀌지 않았습니다.\n\n그리고 어쩌면,\n바꾸려 애쓸수록\n\n그 사람은 더 멀어지고,\n사이는 더 팽팽해지기만 했는지도 모릅니다.\n\n이제, 가만히 인정해 봅니다.\n\n그토록 애썼는데도 바뀌지 않았다면,\n그것이 지금의 현실입니다.\n\n당신이 바뀌어야 나도 바뀔 수 있어.\n\n그 마음을,\n잠시 내려놓아 봅니다.\n\n그 사람을 위해서가 아니라,\n바로 나 자신을 위해서.\n\n그 무거운 기대를 내려놓는 순간,\n가장 먼저 가벼워지는 것은 내 마음이기 때문입니다.\n\n이제,\n잠시 그 사람이 되어 봅니다.\n\n그 사람의 자리에서,\n그 사람의 하루를 가만히 그려 봅니다.\n\n내가 미처 알지 못했던 그 사람의 짐,\n말없이 삼켜 온 피로와 외로움이 있었을지도 모릅니다.\n\n가장 가까이 있어서 오히려 자주 잊고 지낸 그 마음을,\n가만히 헤아려 봅니다.\n\n이제,\n방향을 나에게로 돌려 봅니다.\n\n나는 그 사람에게 어떤 사람으로 다가가고 있었는지.\n\n바라기만 했는지,\n탓하기만 했는지.\n\n가만히 바라봅니다.\n\n가만히 보면,\n단점 없는 사람은 없습니다.\n\n그리고 그 부족함은,\n어쩌면 나를 한 뼘 자라게 하려고 찾아온 귀한 스승인지도 모릅니다.\n\n그 사람의 부족함이 없었다면,\n나는 무엇을 통해 이만큼 깊어질 수 있었을까요.\n\n부족함,\n그것이야말로 완벽함의 다른 이름입니다.\n\n그러니 오늘은,\n\n그 사람을 바꾸려 하는 대신,\n\n지금 이대로의 그 사람을,\n부족한 그대로 가만히 받아들여 봅니다.\n\n무언가를 잘해야 사랑하는 것이 아니라,\n\n지금 이 모습 그대로 이미 소중하다고,\n\n마음속으로 가만히 건네 봅니다.\n\n있는 그대로를 있는 그대로 받아들여 주는 것,\n\n그것이 가장 온전한 사랑입니다.\n\n그리고 신기하게도,\n내가 먼저 그렇게 바뀔 때,\n\n그 사람도, 우리 사이도,\n조금씩 바뀌기 시작합니다.\n\n한 가지,\n만약 견디기 힘든 관계 속에 있다면,\n무엇보다 나의 안전이 먼저입니다.\n오늘의 이 명상은 억지로 참으라는 뜻이 아닙니다.\n\n이제,\n그 따뜻한 마음을 품은 채 숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n손끝과 발끝을 가볍게 움직여 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n떠올려 봅니다.\n오늘 그 사람에게 내가 먼저 건넬,\n따뜻한 눈빛 하나,\n말 한마디를.\n\n───\n진행 메모\n\n낭독 팁 : 배우자·가족 관계 명상(약 10분)입니다. \"그 사람이 되어 보는\" 대목과 \"부족함이 완벽함의 다른 이름\" 대목은 아주 천천히, 뒤에 여백을 넉넉히 둡니다. 안전 안내(견디기 힘든 관계는 안전이 먼저)는 꼭 살려 읽습니다. 부처님·업·불국정토 등 교리는 '있는 그대로 받아들임'의 보편 지혜로 옮겼습니다.","duration":"약 10분","tags":"#부부명상 #관계 #있는그대로받아들이기","series":"숨비명상"},{"id":"dc83d0eb","category":"호흡명상","title":"내쉬는 숨","body":"복잡하고 지친 마음에,\n아주 간단한 선물 하나를 건네 봅니다.\n\n거창한 준비는 필요 없습니다.\n잔잔한 음악 한 곡과,\n내쉬는 숨 하나면 충분합니다.\n\n먼저,\n편안히 앉아 허리를 부드럽게 폅니다.\n\n두 손은 손등이 위로 오도록 무릎 위에 가만히 올려놓습니다.\n\n혀끝은 윗니 안쪽 잇몸에 살짝 붙여 둡니다.\n\n입은 꼭 다물지 않아도 됩니다.\n턱의 힘도 가만히 풀어 줍니다.\n\n이제, 눈을 감고,\n\n오늘은 들이쉬는 숨은 신경 쓰지 않습니다.\n\n오직,\n내쉬는 숨 하나에만 가만히 집중해 봅니다.\n\n코로, 천천히,\n숨을 내쉽니다.\n\n옆 사람에게도 들리지 않을 만큼 아주 고요하게.\n\n숨을 내쉴 때마다,\n어깨와 가슴의 힘이 조금씩 함께 빠져나갑니다.\n\n이제,\n내쉬는 숨마다 가만히 번호를 붙여 봅니다.\n\n내쉬며, 하나.\n\n내쉬며, 둘.\n\n내쉬며, 셋.\n\n들이쉬는 숨은 그저 저절로 들어오도록 내버려 두고,\n\n나가는 숨에만 가만히 번호를 얹습니다.\n\n넷.\n\n다섯.\n\n숫자를 놓치거나,\n문득 다른 생각으로 멀리 다녀왔더라도 괜찮습니다.\n\n알아차린 그 순간,\n다시 내쉬는 숨,\n하나로 돌아오면 됩니다.\n\n이렇게 천천히 숨을 내쉬는 것은,\n\n우리 몸에게 이제 안전하다고 알려 주는 가장 빠른 신호입니다.\n\n그 신호를 받은 몸이,\n조금씩 긴장을 풀고,\n고요해집니다.\n\n잠시,\n그저 내쉬는 숨을 세며,\n\n이 잔잔한 고요 속에 머물러 봅니다.\n\n\n우리는 하루에도 수없이 많은 생각을 합니다.\n\n그런데 그 대부분은,\n이미 지나간 일이거나,\n아직 오지 않은 일,\n혹은 내 힘으로 어쩔 수 없는 일에 대한 생각들입니다.\n\n내쉬는 숨을 가만히 세는 동안,\n\n그 수많은 생각에서 잠시 물러나,\n\n지금 생각하고 있는 나를 한 걸음 뒤에서 바라보는 자리에 서게 됩니다.\n\n바로 그 자리가,\n어지러운 마음 너머의 고요한 쉼터입니다.\n\n이제, 숨을 깊게 들이마시고,\n\n내쉬면서,\n천천히 눈을 떠 봅니다.\n\n방금 몇 번의 숨을 내쉬었는지는 중요하지 않습니다.\n\n지금 이 마음이,\n조금 맑고 편안해졌다면,\n\n그것으로 충분합니다.\n\n───\n진행 메모\n\n낭독 팁 : 날숨에 집중하는 짧은 호흡 명상(약 5분, 핵심은 3분)입니다. 잔잔한 음악 한 곡을 배경으로 깔면 좋습니다. \"내쉬며 하나·둘·셋\"은 듣는 사람의 실제 날숨에 맞춰 천천히 읽습니다. 들숨은 신경 쓰지 않고 날숨만 세게 안내합니다. 명상 후 \"몇 번 내쉬었는지\" 물어보면 참여가 즐거워집니다. 부교감신경·스티브 잡스·통계 등은 보편어로 순화했습니다.","duration":"약 5분","tags":"#호흡명상 #날숨 #이완","series":"숨비명상"},{"id":"2b427259","category":"멈춤","title":"감각과 친해지기","body":"편안한 자리에 앉거나 누워,\n눈을 가만히 감습니다.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n한 번 더,\n들이쉬고…… 내쉽니다.\n\n명상은, 어렵지 않습니다.\n\n한마디로 하면,\n쉬는 것입니다.\n바쁘게 돌아가던 생각과 바람을,\n잠시 내려놓고 마음을 쉬게 하는 것입니다.\n\n그런데 생각을 하지 말아야지,\n하면,\n생각은 오히려 더 떠오릅니다.\n\n불안한 생각,\n지나간 일에 대한 생각이 자꾸 밀려올 때,\n\n그것과 씨름하지 않고,\n\n가만히 감각과 친해져 봅니다.\n\n우리의 마음은 아주 넓지만,\n\n지금 이 순간 무언가를 담는 의식의 공간은 그리 크지 않습니다.\n\n그 공간을 생각 대신 감각으로 채워 주면,\n\n나를 괴롭히던 생각은 저절로 자리를 비켜 갑니다.\n\n이제, 아주 슬쩍,\n발에 주의를 보내 봅니다.\n\n애쓰지 않아도 됩니다.\n그저 발이 거기 있다는 것,\n\n바닥에 닿은 느낌,\n발가락 끝의 온도나 감촉을,\n가만히 느껴 봅니다.\n\n이번에는,\n두 손을 느껴 봅니다.\n\n손바닥의 온기,\n손끝에 와닿는 공기의 느낌.\n\n이제, 가만히 귀를 열어,\n\n지금 들려오는 소리에 가볍게 머물러 봅니다.\n\n멀리, 가까이,\n그저 있는 소리를.\n\n이렇게 감각과 친해지는 동안,\n\n마음은 과거도 미래도 아닌,\n\n지금,\n바로 여기에 가만히 머뭅니다.\n\n지금 여기가, 곧 감각입니다.\n그리고 지금 여기에 있는 그것이,\n곧 명상입니다.\n\n이 감각의 세계는,\n멀리 있지 않습니다.\n\n마음이 힘들 때면 언제든,\n\n지금 있는 자리에서 발의 감각,\n손의 감각,\n들려오는 소리 하나에\n\n가만히 주의를 돌리는 것만으로,\n\n나는 지금 여기로,\n이 고요한 쉼으로 돌아올 수 있습니다.\n\n그리고 이 쉼은,\n방석 위에서만 누리는 것이 아닙니다.\n\n세수를 하고, 설거지를 하고,\n길을 걷는 그 모든 순간에도,\n\n생각에 빠진 채가 아니라,\n지금 내가 무엇을 하는지 깨어서,\n\n그 감각을 가만히 음미하듯,\n평소보다 조금 느리게 해 봅니다.\n\n그 순간,\n평범하던 일상이 그대로 마음을 쉬는 명상이 됩니다.\n\n이제,\n숨을 한 번 길게 들이쉬고,\n천천히 내쉽니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n───\n진행 메모\n\n낭독 팁 : '명상은 쉼'을 전하는 감각 알아차림 명상(약 6분)입니다. \"슬쩍\", \"애쓰지 않고\"를 곳곳에 살리고, 발→손→소리로 감각을 옮길 때 각 사이에 여백을 둡니다. 마지막 일상 행위(세수·설거지)로 확장하는 대목은 담담하게. 세면대 거울 등에 '감각'이라 적어 붙여 두면 하루 중 떠올리기 좋다고 안내해도 좋습니다. 두 번째 화살·열숨명상 등은 별도 편으로 이미 있습니다.","duration":"약 6분","tags":"#감각명상 #쉼 #지금여기","series":"숨비명상"},{"id":"850e94d4","category":"관찰","title":"먼 바다로","body":"생각은,\n내가 방심하는 사이 찾아와,\n\n때로 나를 무기력하게 만들곤 합니다.\n\n하지만 생각의 노예가 될 필요는 없습니다.\n\n그리고 그 생각이 곧 나 자신이라고 여기지도 않습니다.\n\n생각은,\n그저 생각일 뿐입니다.\n\n먼저,\n몸을 가볍게 풀어 줍니다.\n\n허리를 곧게 펴고 앉아,\n고개를 좌우로 천천히 움직여 봅니다.\n\n두 어깨를 앞뒤로 크게 돌려 주고,\n\n몸통도 오른쪽,\n왼쪽으로 가만히 비틀어 봅니다.\n\n지금 하는 이 동작들과,\n몸에서 일어나는 느낌을,\n가만히 바라봅니다.\n\n이제,\n정면으로 돌아와 허리를 곧게 펴고 편안히 앉습니다.\n\n두 손은 손바닥을 위로 해 무릎 위에 올리거나,\n\n엄지와 검지를 가만히 맞대거나,\n\n내가 편한 손 모양을 만들어 줍니다.\n\n눈을 부드럽게 감습니다.\n\n코로 숨을 들이마시고,\n코로 숨을 내쉽니다.\n\n한 번 더, 길게 들이마시고,\n천천히 내쉽니다.\n\n맑은 공기가 온몸으로 퍼지고,\n\n내쉬는 숨에 몸 안의 무거움과 스트레스가 함께 빠져나갑니다.\n\n이제,\n넓은 바다를 떠올려 봅니다.\n\n물결이 해안으로 밀려와 파도로 부서지고,\n\n다시 먼 바다로 유유히 흘러 나갑니다.\n\n밀려오고, 빠져나가고.\n\n우리의 생각도 꼭 이 파도와 같습니다.\n\n내가 알아채지 못한 사이에도 정신없이 몰아치지만,\n\n파도가 다시 먼 바다로 돌아가듯,\n\n그 생각도 그저 흘러갈 뿐입니다.\n\n지금 어떤 생각이 떠올라도 괴로워하지 않습니다.\n\n생각이 떠오르는 것은 아주 자연스러운 일입니다.\n\n다만,\n그 생각에 휘둘리지 않고,\n\n한 걸음 떨어져 가만히 바라봅니다.\n\n이제, 떠오른 생각을 하나씩,\n먼 바다로 흘려보내 봅니다.\n\n숨을 크게 들이마시고,\n\n후—\n\n내쉬는 숨에,\n머릿속을 채우던 생각 하나를 물결에 실어 먼 바다로 떠나보냅니다.\n\n한 번 더, 들이마시고,\n길게 내쉬며,\n\n그 생각이 물결을 따라 멀어져 가는 모습을,\n\n나는 멀리서 가만히 바라봅니다.\n\n또 한 번,\n들이마시고 내쉬며,\n\n남은 생각들도 모두 먼 바다로 흘려보냅니다.\n\n이제 머릿속은,\n아무것도 남지 않은 맑고 깨끗한 상태가 됩니다.\n\n모든 의식을,\n가만히 호흡으로 가져옵니다.\n\n들이마시고, 내쉬고.\n들이마시고, 내쉬고.\n\n이제 잠시,\n안내 없이 고요히 머물러 봅니다.\n\n어떤 생각이 떠오르든,\n그때마다 날숨에 실어 먼 바다로 흘려보내면 됩니다.\n\n억지로 생각을 없애려 하면,\n생각은 오히려 더 자주 찾아옵니다.\n\n그저, 지금 여기,\n이 호흡으로 가만히 돌아옵니다.\n\n\n이제,\n천천히 돌아올 시간입니다.\n\n손가락과 발가락에 가만히 힘을 주어 움직여 봅니다.\n\n두 손을 모아 빠르게 비벼,\n따뜻하게 만들어 줍니다.\n\n그 따뜻한 손으로 머리,\n어깨, 가슴,\n다리까지 부드럽게 쓸어내립니다.\n\n한 번 더 손을 비벼,\n\n이번에는 두 눈 위에 가만히 얹어 따뜻하게 감싸 줍니다.\n\n손바닥을 천천히 떼며,\n\n부드럽게 눈을 떠 봅니다.\n\n입가에 잔잔한 미소를 지어 봅니다.\n\n나는,\n내 생각보다 강한 사람입니다.\n\n나는,\n내 생각을 가만히 흘려보낼 수 있습니다.\n\n───\n진행 메모\n\n낭독 팁 : 준비 스트레칭→호흡→생각 흘려보내기→마무리 순의 명상(약 10분)입니다. 생각을 날숨에 실어 먼 바다로 보내는 대목은 실제 날숨에 맞춰 \"후—\"를 길게 냅니다. 중간 침묵 구간은 2~3분 넉넉히. 손 비벼 몸을 데우는 마무리는 실제로 하도록 천천히 안내합니다. 기존 ‘파도가 아니라 바다’(관찰자)와 달리 ‘생각을 능동적으로 흘려보내기 + 몸 풀기/마무리’가 특징입니다.","duration":"약 10분","tags":"#생각흘려보내기 #파도명상 #생각알아차림","series":"숨비명상"},{"id":"000d1407","category":"탈중심화","title":"설렘만 남기고","body":"편안한 자리에 앉습니다.\n허리는 부드럽게 세우고,\n두 손은 무릎 위에 가만히 내려놓습니다.\n\n준비가 되면,\n천천히 눈을 감아 봅니다.\n\n숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n한 번 더,\n들이쉬고…… 내쉽니다.\n\n살다 보면,\n물건은 나도 모르게 자꾸만 늘어납니다.\n\n옷과 책,\n오래된 선물과 추억의 물건들이 서랍마다,\n방마다 조금씩 쌓여 갑니다.\n\n그리고 그 쌓인 물건만큼,\n마음 한켠도 어쩐지 무거워집니다.\n\n오늘은,\n그 무게를 조금 덜어내는 연습을 해 봅니다.\n\n마음속으로,\n정리하고 싶은 한 곳을 떠올려 봅니다.\n옷장 한 칸이어도,\n서랍 하나여도 좋습니다.\n\n이제,\n그 안의 물건 하나를 가만히 집어 든다고 상상해 봅니다.\n\n그 물건을 손에 든 채,\n스스로에게 조용히 물어봅니다.\n\n이것은 지금,\n내가 실제로 쓰고 있는 물건인가.\n\n지금의 나에게,\n아직 마음이 가는 물건인가.\n\n앞으로 쓸 일이,\n정말로 있는 물건인가.\n\n서둘러 답하지 않아도 됩니다.\n\n그리고 마지막으로,\n가장 중요한 것을 느껴 봅니다.\n\n이 물건을 손에 들었을 때,\n가슴에 잔잔한 설렘이,\n따뜻한 기쁨이 이는지.\n\n만약 그렇다면,\n그 물건은 지금도 나를 행복하게 하는 물건입니다.\n고맙게 곁에 두면 됩니다.\n\n그런데 손에 들어도 아무런 설렘이 일지 않는다면,\n그것은 이미 나에게서 마음이 떠난 물건인지도 모릅니다.\n\n그럴 때는,\n미워하거나 아까워하는 대신,\n가만히 고마움을 전해 봅니다.\n\n그동안 내 곁에 있어 주어 고마웠다고,\n이제 편안히 떠나보낸다고.\n\n물건을 떠나보내는 것은,\n버리는 것이 아니라,\n그 물건이 나에게 준 시간에 인사하고,\n나에게 새로운 자리를 내어 주는 일입니다.\n\n가만히 느껴 봅니다.\n물건 하나가 떠난 그 자리에,\n생겨나는 작은 여백을.\n\n그 빈자리로,\n서늘하고 맑은 공기가 들어옵니다.\n\n신기하게도,\n물건이 줄어든 만큼 마음도 한결 가벼워집니다.\n\n이 설렘의 기준은,\n물건에만 쓰이는 것이 아닙니다.\n\n내 마음속에도,\n오래도록 설레지 않으면서 자리만 차지하고 있는 것들이 있습니다.\n\n묵은 걱정, 지나간 원망,\n언젠가는 하며 붙들고 있던 미련들.\n\n그런 마음의 짐에게도,\n고마움을 전하고 가만히 떠나보내 봅니다.\n\n설레는 것만 곁에 남기고,\n그렇지 않은 것은 가볍게 놓아줍니다.\n\n떠올려 봅니다. 오늘 내가,\n물건이든 마음이든,\n가장 먼저 떠나보내도 좋을 한 가지를.\n\n거창하지 않아도 됩니다.\n서랍 속 물건 하나면 충분합니다.\n\n이제,\n그 가벼워진 마음을 품은 채 숨을 길게 들이쉬고,\n천천히 내쉽니다.\n\n손끝과 발끝을 가볍게 움직여 봅니다.\n\n준비가 되면,\n천천히 눈을 떠 봅니다.\n\n───\n진행 메모\n\n낭독 팁 : 비움·정리 명상(약 7분)입니다. 네 가지 질문(쓰는가·마음 가는가·쓸 일 있는가·설레는가)은 각 사이에 여백을 두고 천천히 읽습니다. \"그동안 고마웠어, 이제 떠나보낸다\" 대목은 다정하게. 실제로 서랍·옷장 한 칸을 정리하기 전에 하거나, 마음의 짐을 정리하는 데도 좋습니다. 곤도 마리에·넷플릭스 등은 무기명 처리했습니다.","duration":"약 7분","tags":"#비움 #정리 #설렘","series":"숨비명상"}];

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function toast(msg,ms){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('on');},ms||2600);}
function isFav(d){return favs.indexOf(d._k)>=0;}
function toggleFav(d){var i=favs.indexOf(d._k);if(i>=0)favs.splice(i,1);else favs.push(d._k);localStorage.setItem('med_favs',JSON.stringify(favs));}
function grp(key,order){var g={};DATA.forEach(function(d){var v=d[key]||'기타';(g[v]=g[v]||[]).push(d);});var keys=order.filter(function(k){return g[k];}).concat(Object.keys(g).filter(function(k){return order.indexOf(k)<0;}));return {g:g,keys:keys};}
function reindex(){DATA.forEach(function(d,i){d._i=i;d._k=d.category+'∥'+d.title;});CAT=grp('category',CATORDER);SER=grp('series',SERORDER);}
function applyFS(){document.documentElement.style.setProperty('--bodyfs',(localStorage.getItem('med_fs')||'18.5')+'px');}
function applyDark(){document.body.classList.toggle('dark',localStorage.getItem('med_dark')==='1');}
function setHH(){var tb=document.getElementById('topbar');if(tb)document.documentElement.style.setProperty('--hh',tb.offsetHeight+'px');}
function matchFn(q){return function(d){return d.title.toLowerCase().indexOf(q)>=0||d.body.toLowerCase().indexOf(q)>=0;};}
function setFilter(k){curFilter=k;localStorage.setItem('med_filter',k);searchText='';document.getElementById('search').value='';buildMenu();buildSeries();renderList();document.getElementById('toc').scrollTop=0;closeNav();}

function buildMenu(){
 var menu=document.getElementById('catmenu');menu.innerHTML='';
 function mk(k,label,cls){var b=document.createElement('button');b.className='mi'+(cls?' '+cls:'')+((!searchText&&curFilter===k)?' on':'');b.textContent=label;b.onclick=function(){setFilter(k);};menu.appendChild(b);}
 mk('all','전체');
 CAT.keys.forEach(function(c){mk('cat:'+c,c);});
 var s=document.createElement('span');s.className='msep';menu.appendChild(s);

}

 });

function itemLink(d,metaField){
 var a=document.createElement('a');a.href='#s'+d._i;a.dataset.i=d._i;
 var sub=metaField==='category'?d.category:d.series;
 a.innerHTML=(isFav(d)?'<span class="fav">★</span>':'')+esc(d.title)+'<span class="meta">'+esc([d.duration,sub].filter(Boolean).join(' · '))+'</span>';
 if(d._i===current)a.className='active';
 a.onclick=function(e){e.preventDefault();show(d._i);closeNav();};
 return a;
}
function renderList(){
 var host=document.getElementById('toclist');host.innerHTML='';
 var q=searchText.trim().toLowerCase();
 if(q){
  var res=DATA.filter(matchFn(q));
  var h=document.createElement('div');h.className='listhead';h.innerHTML='검색 결과<span class="c">'+res.length+'편</span>';host.appendChild(h);
  if(!res.length){host.insertAdjacentHTML('beforeend','<div class="empty">일치하는 스크립트가 없습니다.</div>');return;}
  var box=document.createElement('div');box.className='items';res.forEach(function(d){box.appendChild(itemLink(d,'category'));});host.appendChild(box);
  markActive();return;
 }
 if(curFilter==='all'){
  var h0=document.createElement('div');h0.className='listhead';h0.innerHTML='전체<span class="c">'+DATA.length+'편</span>';host.appendChild(h0);
  CAT.keys.forEach(function(c){
   var lab=document.createElement('div');lab.className='grouplabel';lab.textContent=c+' ('+CAT.g[c].length+')';host.appendChild(lab);
   var box=document.createElement('div');box.className='items';CAT.g[c].forEach(function(d){box.appendChild(itemLink(d,'series'));});host.appendChild(box);
  });
  markActive();return;
 }
 var items,title,metaField;
 if(curFilter==='fav'){items=DATA.filter(isFav);title='★ 즐겨찾기';metaField='category';}
 else if(curFilter.indexOf('cat:')===0){var c=curFilter.slice(4);items=CAT.g[c]||[];title=c;metaField='series';}
 else if(curFilter.indexOf('ser:')===0){var s=curFilter.slice(4);items=SER.g[s]||[];title=s;metaField='category';}
 else {items=DATA;title='전체';metaField='category';}
 var hh=document.createElement('div');hh.className='listhead';hh.innerHTML=esc(title)+'<span class="c">'+items.length+'편</span>';host.appendChild(hh);
 if(!items.length){host.insertAdjacentHTML('beforeend','<div class="empty">'+(curFilter==='fav'?'아직 즐겨찾기가 없습니다.<br>본문 제목 옆의 ☆를 눌러 담아 보세요.':'항목이 없습니다.')+'</div>');return;}
 var box2=document.createElement('div');box2.className='items';items.forEach(function(d){box2.appendChild(itemLink(d,metaField));});host.appendChild(box2);
 markActive();
}
function markActive(){
 document.querySelectorAll('#toclist a').forEach(function(a){a.classList.toggle('active',parseInt(a.dataset.i)===current);});
 var act=document.querySelector('#toclist a.active');if(act)act.scrollIntoView({block:'nearest'});
}
function splitNotes(body){
 var m=body.indexOf('진행 메모');
 if(m<0)return {main:body,notes:''};
 var ls=body.lastIndexOf('\n',m);var lineStart=ls<0?0:ls+1;
 var main=body.slice(0,lineStart);var notes=body.slice(lineStart);
 main=main.replace(/\s+$/,'').replace(/[─—]{2,}$/,'').replace(/-{3,}$/,'').replace(/\s+$/,'');
 return {main:main,notes:notes};
}
function show(i){
 current=i;var d=DATA[i];if(!d){showCover();return;}currentId=d.id||null;
 var prev=DATA[i-1],next=DATA[i+1];
 var tags=(d.tags||'').split(/[#\s]+/).filter(Boolean);
 var sn=splitNotes(d.body);
 var html='<div class="page"><div class="crumbs">'+esc(d.category)+(d.series?' &nbsp;·&nbsp; '+esc(d.series):'')+'</div>';
 html+='<h2><span>'+esc(d.title)+'</span><button class="star" id="starbtn" title="즐겨찾기">'+(isFav(d)?'★':'☆')+'</button></h2>';
 if(hasLive)html+='<div class="actbar"><button class="abtn" id="editbtn">✏️ 수정</button><button class="abtn del" id="delbtn">🗑️ 삭제</button></div>';
 html+='<div class="tagline">';
 if(d.duration)html+='<span class="chip">'+esc(d.duration)+'</span>';
 tags.forEach(function(t){html+='<span class="chip">#'+esc(t)+'</span>';});
 html+='</div><hr class="rule"><div class="body">'+esc(sn.main)+'</div>';
 if(sn.notes)html+='<details class="notes"><summary>진행 메모 · 참고</summary><div class="notebody" style="white-space:pre-wrap;word-break:keep-all">'+esc(sn.notes)+'</div></details>';
 html+='<div class="nav">';
 html+= prev?'<a class="prev" href="#s'+(i-1)+'">◀ 이전<span class="t">'+esc(prev.title)+'</span></a>':'<a class="prev" style="visibility:hidden"></a>';
 html+= next?'<a class="next" href="#s'+(i+1)+'">다음 ▶<span class="t">'+esc(next.title)+'</span></a>':'<a class="next" style="visibility:hidden"></a>';
 html+='</div></div>';
 var r=document.getElementById('reader');r.innerHTML=html;
 r.querySelectorAll('.nav a').forEach(function(a){if(a.getAttribute('href'))a.onclick=function(e){e.preventDefault();show(parseInt(a.getAttribute('href').slice(2)));};});
 var sb=document.getElementById('starbtn');sb.classList.toggle('on',isFav(d));
 sb.onclick=function(){toggleFav(d);sb.textContent=isFav(d)?'★':'☆';sb.classList.toggle('on',isFav(d));renderList();};
 if(hasLive){document.getElementById('editbtn').onclick=function(){openEditor('edit',d);};document.getElementById('delbtn').onclick=function(){doDelete(d);};}
 markActive();
 window.scrollTo(0,0);location.hash='s'+i;
}
function showCover(){current=-1;currentId=null;var total=DATA.length;var html='<div class="cover"><div class="k">한 줄 한 호흡</div><h1>명상 스크립트</h1><p>마음이 쉬어가는 '+total+'편의 안내문</p>';html+='<div class="stat"><div><b>'+total+'</b>편</div><div><b>'+CAT.keys.length+'</b>갈래</div><div><b>'+SER.keys.length+'</b>시리즈</div></div>';html+='<p style="margin-top:44px;font-size:14px">위 <b>상단 메뉴</b>에서 카테고리를, <b>왼쪽 첫 열</b>에서 시리즈를 고르고,<br>➕ 새 스크립트 / ✏️ 수정 / 🗑️ 삭제로 관리할 수 있어요.</p></div>';document.getElementById('reader').innerHTML=html;location.hash='';markActive();}
function closeNav(){document.body.classList.remove('nav-open');}
/* ===== 동기화 ===== */
function loadLiveP(){return new Promise(function(resolve){
 var fn='__jsonp_'+Date.now()+Math.floor(Math.random()*1000);
 var s=document.createElement('script');var done=false;
 window[fn]=function(res){done=true;try{delete window[fn];}catch(e){window[fn]=undefined;}s.remove();resolve(res&&res.ok?res.data:null);};
 s.onerror=function(){if(!done){s.remove();resolve(null);}};
 s.src=API_URL+'?action=list&callback='+fn+'&t='+Date.now();
 document.head.appendChild(s);
 setTimeout(function(){if(!done){resolve(null);}},15000);
});}
function setData(arr){
 DATA=arr;reindex();buildMenu();buildSeries();renderList();
 if(currentId){var idx=-1;for(var i=0;i<DATA.length;i++){if(DATA[i].id===currentId){idx=i;break;}}if(idx>=0){show(idx);}else{showCover();}}
}
async function syncNow(silent){
 var live=await loadLiveP();
 if(live){hasLive=true;setData(live);document.getElementById('synced').textContent='시트와 동기화됨 · '+live.length+'편';}
 else{hasLive=false;document.getElementById('synced').textContent='오프라인(내장본) · 편집 불가';if(!silent)toast('시트에 연결하지 못했어요. 잠시 후 다시 시도해 주세요.');}
 setHH();
}
/* ===== 쓰기 ===== */
function getToken(){var t=localStorage.getItem('med_token');if(!t){t=prompt('편집 비밀번호를 입력하세요');if(t){t=t.trim();localStorage.setItem('med_token',t);}}return t;}
function genId(){return (Date.now().toString(16)+Math.floor(Math.random()*65536).toString(16)).slice(0,8);}
async function apiWrite(action,payload,verify){
 var token=getToken();if(!token){toast('취소되었습니다.');return false;}
 var bodyObj=Object.assign({token:token,action:action},payload);
 try{await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(bodyObj)});}catch(e){}
 await sleep(1500);
 var live=await loadLiveP();
 if(!live){toast('저장은 보냈지만 확인에 실패했어요(연결 문제). 새로고침 후 확인해 주세요.');return false;}
 hasLive=true;
 var okv=verify?verify(live):true;
 if(!okv){localStorage.removeItem('med_token');toast('저장이 반영되지 않았어요. 비밀번호가 틀렸거나 오류일 수 있어요. 다시 시도해 주세요.');}
 setData(live);
 return okv;
}
function catOptions(){return CATORDER.concat(Object.keys(grp('category',CATORDER).g).filter(function(k){return CATORDER.indexOf(k)<0;}));}
function fillSelect(sel,arr,val){sel.innerHTML='';arr.forEach(function(o){var op=document.createElement('option');op.value=o;op.textContent=o;if(o===val)op.selected=true;sel.appendChild(op);});}
var editMode='add', editId=null;
function openEditor(mode,d){
 editMode=mode;editId=(d&&d.id)||null;
 document.getElementById('mtitle').textContent=mode==='add'?'새 스크립트':'스크립트 수정';
 fillSelect(document.getElementById('f_cat'),catOptions(),d?d.category:'관찰');
 fillSelect(document.getElementById('f_ser'),SERORDER.concat(['(없음)']),d?(d.series||'(없음)'):'숨비명상');
 document.getElementById('f_title').value=d?d.title:'';
 document.getElementById('f_dur').value=d?d.duration:'';
 document.getElementById('f_tags').value=d?d.tags:'';
 document.getElementById('f_body').value=d?d.body:'';
 document.getElementById('modal').classList.add('on');
}
function closeEditor(){document.getElementById('modal').classList.remove('on');}
async function saveEditor(){
 var title=document.getElementById('f_title').value.trim();
 var body=document.getElementById('f_body').value;
 if(!title){toast('제목을 입력해 주세요.');return;}
 if(!body.trim()){toast('본문을 입력해 주세요.');return;}
 var ser=document.getElementById('f_ser').value;if(ser==='(없음)')ser='';
 var rec={category:document.getElementById('f_cat').value,title:title,body:body,duration:document.getElementById('f_dur').value.trim(),tags:document.getElementById('f_tags').value.trim(),series:ser};
 var save=document.getElementById('msave');save.disabled=true;save.textContent='저장 중…';
 var ok;
 if(editMode==='add'){
  var nid=genId();rec.id=nid;
  ok=await apiWrite('add',{record:rec},function(live){return live.some(function(x){return x.id===nid;});});
  if(ok){closeEditor();toast('추가되었습니다.');currentId=nid;var idx=-1;for(var i=0;i<DATA.length;i++){if(DATA[i].id===nid){idx=i;break;}}if(idx>=0)show(idx);}
 }else{
  rec.id=editId;
  ok=await apiWrite('update',{record:rec},function(live){var f=live.filter(function(x){return x.id===editId;})[0];return f&&f.title===title&&f.body===body;});
  if(ok){closeEditor();toast('수정되었습니다.');}
 }
 save.disabled=false;save.textContent='저장';
}
async function doDelete(d){
 if(!d||!d.id){toast('저장된 항목만 삭제할 수 있어요.');return;}
 if(!confirm('“'+d.title+'”\n정말 삭제할까요? 되돌릴 수 없습니다.'))return;
 var delId=d.id;
 var ok=await apiWrite('delete',{id:delId},function(live){return !live.some(function(x){return x.id===delId;});});
 if(ok){toast('삭제되었습니다.');showCover();}
}
/* ===== 이벤트 ===== */
document.getElementById('menubtn').onclick=function(){document.body.classList.toggle('nav-open');};
document.getElementById('brand').onclick=function(){showCover();closeNav();document.getElementById('reader').scrollTop=0;window.scrollTo(0,0);};
document.getElementById('backdrop').onclick=closeNav;
document.getElementById('search').oninput=function(e){searchText=e.target.value;buildMenu();buildSeries();renderList();};
document.getElementById('darkbtn').onclick=function(){var on=localStorage.getItem('med_dark')==='1';localStorage.setItem('med_dark',on?'0':'1');applyDark();document.getElementById('darkbtn').textContent=on?'🌙':'☀️';};
document.getElementById('fsminus').onclick=function(){var v=Math.max(14,(parseFloat(localStorage.getItem('med_fs')||'18.5'))-1);localStorage.setItem('med_fs',v);applyFS();};
document.getElementById('fsplus').onclick=function(){var v=Math.min(28,(parseFloat(localStorage.getItem('med_fs')||'18.5'))+1);localStorage.setItem('med_fs',v);applyFS();};
document.getElementById('addbtn').onclick=function(){if(!hasLive){toast('시트에 연결된 뒤에 추가할 수 있어요. 잠시만요…');syncNow();return;}openEditor('add',null);};
document.getElementById('mcancel').onclick=closeEditor;
document.getElementById('msave').onclick=saveEditor;
document.getElementById('modal').onclick=function(e){if(e.target===this)closeEditor();};
window.addEventListener('resize',setHH);
/* ===== 시작 ===== */
reindex();applyFS();applyDark();
document.getElementById('darkbtn').textContent=localStorage.getItem('med_dark')==='1'?'☀️':'🌙';
buildMenu();buildSeries();renderList();setHH();
if(location.hash.indexOf('#s')===0){var hi=parseInt(location.hash.slice(2));if(!isNaN(hi)&&DATA[hi])show(hi);else showCover();}else showCover();
setTimeout(setHH,300);
syncNow(true);
</script>
</body></html>
