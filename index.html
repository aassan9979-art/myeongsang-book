손가락 발가락을 움직여봅니다.\n기지개도 쭈욱 펴봅니다.\n오른쪽으로 돌아 눕습니다.\n왼손을 바닥에 대고 서서히 일어납니다.\n\n손을 세게 비빕니다.\n손바닥으로 눈을 덮습니다.\n다음 머리 목 어깨 팔을 마사지 합니다.\n수고하셨습니다.\n몸이 편안해지셨는지요?\n이 명상은 옛날 왕가에서 성군이 되기위해 햇볕 좋은날 연못에서 많이하던 명상법이라 합니다.\n꾸준히 하시면 불면증 치료에도 아주 효과가 있다고합니다.\n그럼 주무시기전 잠시 해보시면 더욱 좋겠지요.","duration":"","tags":"늘봄8회기,3회기","series":"늘봄명상"},{"id":"736bb485","category":"탈중심화","title":"마음 청진기","body":"이번에는 손을 활용해서 할 수 있는 마음 청진기 기법입니다.\n유능한 의사는 환자의 얼굴만 보고도 어디가 어떻게 아픈지 알 수 있다고 합니다.\n우리도 의사처럼 상대방의 마음을 진단해 볼까요?\n\nA조, B조,\n두 명씩 조를 만들겠습니다.\n남자는 남자끼리,\n여자는 여자끼리 같은 성별로 짝을 만들어 주세요.\n\n서로 마주보고 오른손을 들어 상대방 이마에 손을 가까이 대겠습니다.\n신체 접촉은 피해 주세요!\n\n상대가 무슨 생각을 하고 있는지 마음의 소리를 들어봅니다.\n\n‘당신은 무슨 생각을 하고 계십니까?’ (1분 후,\n명상발우) 땡~\n\n‘당신은 지금 어떤 감정입니까?’ (1분 후,\n명상발우) 땡~\n\n‘당신은 지금 무엇을 원하십니까?’ (1분 후,\n명상발우) 땡~\n\n지금까지 마음 청진기를 통해서 마음속에 있는 생각,\n감정,\n욕구를 알아보는 명상을 했습니다.\n\n여러분들은 상대방 마음의 소리,\n그 소리에 귀를 기울이면 상대방 마음을 알아차릴 수 있고,\n그것을 통해 서로 소통이 가능할 수 있을것입니다.","duration":"","tags":"늘봄8회기,3회기","series":"늘봄명상"},{"id":"b000b149","category":"탈중심화","title":"나는 바나나","body":"살며시 눈을 감고 마음속으로 바나나를 떠올려봅니다.\n노란 바나나의 색을 보고 향을 그려보고 맛과 촉감을 상상하면서 마음속으로  따라합니다.\n\n나는 누구인가?\n나는 바나나다.\n나는 바나나다.\n나는 바나나다..\n\n그렇게 말하고 생각한다고 우리가 바나나가 되었나요?\n나는 바나나라고 생각하고 말한다고 내가 바나나가 되는 것은 아닙니다.\n마찬가지로 보통 우리들이 나의 것이라고는 생각이 과연 나일까요?\n\n자신의 육체적 느낌이나 정서적 감정이 나입니까?\n(1분) 그러면 항상 바빠 쉴 틈이 없는 생각이 나입니까?\n(1분) 무언가를 가지고 싶어하는 욕심이 나입니까?\n(1분) 좋다 싫다하는 생각이 나입니까?\n(1분) 나라고 생각하는 몸이 나입니까?\n(1분) 명상발우 땡~ 살며시 눈을 뜹니다.\n생각한다고 내가 바나나가 아니듯 우리가 생각하는 것이 모두 우리의 것이 아님을 일깨우는 명상을 해보았습니다.","duration":"","tags":"늘봄8회기,3회기","series":"늘봄명상"},{"id":"a9082a44","category":"탈중심화","title":"늘보와 호보","body":"(완보와 파워워킹)\n\n걷기명상은 명상에서 많이 사용하는 방법입니다.\n여러분들께 오늘은 두가지의 걷기명상법을 알려드리고 걸어보는 시간을 가지겠습니다.\n\n‘걷는다’라는 것,\n특히 두발로 걷는 것은 사람만이 가지고 있는 특징입니다.\n걷는 모습과 뒷모습은 그 사람의 내면을 의미한다고 말을 하곤 합니다.\n그만큼 걸음걸이에서 사람들의 살아온 인생이 보이기도 합니다.\n이제 그 걸음을 가지고 하는 명상을 해보겠습니다.\n\n먼저 여러분들게 집중명상의 하나인 늘보명상을 먼저 해보겠습니다.\n사람들은 몸을 사용함에 있어서 자신의 속도를 가지고 있습니다.\n관성적으로 움직이고 생각합니다.\n이렇게 몸의 속도를 늦춰보면 생각의 속도를 느낄 수 있습니다.\n\n모두 일어나 주십시오.\n간격은 최대한 가능한 만큼 벌려 주시기 바랍니다.\n이 명상의 이름에서처럼 가능한한 천천히 걷는 겁니다.\n지금부터 10보를 걸을텐데,\n그 전에 선 상태에서 눈을 감고 크게 호흡을 10회 합니다.\n(10회 실시)\n\n이제 손은 가지런히 모읍니다.\n오른손이 왼손을 덮고 왼손의 장심,\n손바닥 가운데가 배꼽아래 5cm정도 위치에 둡니다.\n등은 곧게 편 상태에서 턱은 살짝 당깁니다.\n시선은 1m정도 앞을 바라봅니다.\n호흡은 신경 안쓰셔도 됩니다.\n이제 10분동안 열걸음을 걷겠습니다.\n열걸음을 넘어가서는 절대 안됩니다.\n열걸음 이내는 괜찮지만 넘어가서는 안됩니다.\n최대한 천천히 걸어주십시오.\n\n자~ 이제 시작합니다.\n(시작 명상발우) (10분뒤 - 마침 명상발우)\n\n자~ 이제 모두 자리에 앉으시고 잠시 가만히 계십시오.\n어떠셨나요?\n집중이 잘 되시나요?\n이 명상법은 여러분들의 몸의 속도를 느리게 해서 생각의 속도를 느끼고 관찰하는 시간을 갖는 겁니다.\n이렇게 관찰한 생각을 토대로 여러분들은 스스로 돌아보는 계기를 갖게 됩니다.\n\n이번에는 호랑이 걸음 명상을 해보겠습니다.\n호랑이하면 무슨 생각이 떠오르시나요?\n(사람들의 이야기를 듣는다) 호랑이는 용맹하고 위엄이 있습니다.\n걸음걸이도 당당합니다.\n\n이제 일어나주세요.\n크게 원을 만들어 주세요.\n이번에는 걷는 방법이 좀 다릅니다.\n먼저 가볍게 주먹을 쥡니다.\n그런데 엄지손가락을 안으로 넣고 주먹을 쥡니다.\n주먹에 힘이 들어가서는 안됩니다.\n그리고 팔을 보통 걸을 때보다 좀 더 크게 휘둘러주시고 거기에 맞춰 발도 옮기시면 됩니다.\n그러면 발의 보폭도 자연스럽게 커집니다.\n그리고 전체적으로는 약간 빠른 걸음으로 힘차게 걷습니다.\n자 이제 시작합니다.\n(시작 명상발우) (5분 뒤 - 마침 명상발우)\n\n이 걸음은 늘보명상을 하면서 안으로 향한 마음을 다시 밖으로 향하게 하면서 동시에 걸음에 따라 바뀌는 마음의 상태를 느껴보는 겁니다.\n어떠셨나요?\n걸음이 바뀌니까 마음도 좀 커지고 활기찬 느낌이 있지 않나요?\n\n이렇게 걷기명상을 끝내겠습니다.\n감사합니다.","duration":"","tags":"늘봄8회기,3회기","series":"늘봄명상"},{"id":"f2ded2dd","category":"탈중심화","title":"말랑젤리","body":"(미리 말랑젤리 나누어 줌) 각자의 자리에 편안하게 앉아주십시오.\n이 말랑젤리 아이들이 참 좋아하지요?\n새콤달콤 맛이 있어요.\n지금도 무의식중에 자꾸 먹게 되지요?\n몇 개 드셨어요?\n\n그럼 지금부터 말랑젤리를 관찰하며 먹어볼까요?\n앞에 말랑젤리가 있습니다.\n처음 보는 것처럼 호기심을 가져봅니다.\n\n천천히 색깔을 봅니다.\n모양도 봅니다.\n냄새도 맡아볼까요.\n한번 만져도 보고 만질 때 손끝에 느껴지는 촉감 무게도 가늠해 봅니다.\n귀에도 대어봅니다.\n귀에 대고 소리를 들어봅니다.\n\n냄새도 맡아봅니다.\n오렌지 냄새인가요?\n포도냄새인가요?\n눈을 감고 다시 냄새를 맡습니다.\n\n먹어봅니다.\n입과 입안의 혀와 치아의 감각,\n침이 나오는 것을 느껴봅니다.\n씹을 때의 느낌,\n입천장에 닿는 느낌,\n이에 달라붙는 느낌,\n목으로 넘길 때의 느낌,\n몸의 느낌은 어떤가요?\n\n자,\n말랑젤리를 입에 넣고 눈을 감습니다.\n말랑젤리를 먹으며 천천히 다시 느껴봅니다.\n씹을 때의 느낌,\n입천장에 닿는 느낌,\n이에 달라붙는 느낌,\n목으로 넘길 때의 느낌,\n몸의 느낌을 알아차려봅니다.\n(....잠시 후)\n\n그럼,\n이제 각자 진행자의 멘트 없이 다시 반복해 보겠습니다.\n(....1분 후)\n\n(명상발우) 어떠했습니까?\n무의식중에 계속 먹는 말랑젤리와 관찰하며 먹는 말랑젤리는 많은 차이가 있지요?\n그 느낌을 얘기해 볼까요.\n시계방향으로 말씀해보실까요?\n\n지금부터는 말랑젤리 씹다가 명상은 싱잉볼 치면 멈추고 내 몸의 반응을 살펴봅니다.\n\n그리고 싱잉볼을 다시 치면 먹는 행동을 계속합니다.\n\n우리가 무의식중에 해왔던 과정을 멈추고 그 순간의 경험을 알아차리게 되면,\n삶에 더욱 풍요로운 느낌을 갖게 되어 폭넓은 선택을 할 수 있습니다.\n하루 세 번 식사를 할 때도 적용하면 더욱 좋겠지요.","duration":"","tags":"늘봄8회기,3회기","series":"늘봄명상"},{"id":"22cf2adf","category":"탈중심화","title":"강건너 불구경","body":"강건너 불구경은 가까운 곳에서 불구경을 하면 불똥이 내게 튈 수도 있는데 멀리서 불똥이 튈 걱정 없이 편하게 불구경을 즐길 수 있다는 의미입니다.\n\n이 명상은 고통스러운 현실속에서 괴로운 현재의 나를 분리시켜 편안한 마음을 갖도록하여 나에 대한 집착으로 인한 고통에서 벗어나 강건너 불구경하듯 관람자로서 우리의 마음을 살펴보는 시간이 되도록 하는 명상입니다.\n\n⚬ 그럼 지금부터 강 건너 불구경 명상을 해보도록 하겠습니다.\n⚬ 모두 편안한 자세로 누워주세요.\n⚬ 모두 편안한 자세가 되었으면 눈을 감고 재미있는 만화영화 톰과 제리를 떠올리며 나 자신에게 “톰”이라는 닉네임을 붙이며 이미지화 합니다.\n각자 “나는 톰이다”라고 바라보며 조용히 불러봅니다.\n⚬ 이제 호흡을 가다듬고 가볍게 들숨~날숨을 이어가며 톰이 되어감을 봅니다.\n(2분)\n\n⚬ 조용히 움직이고 있는 톰,\n머무르고 있는 톰,\n앉아있는 톰,\n누워있는 톰을 떠올려봅니다.\n⚬ 여러분이 조용히 움직이면 “톰이 움직인다“라고 떠올려봅니다. ⚬ 여러분이 머무르면 “톰이 머무른다“라고 ⚬ 여러분이 앉아 있으면 “톰이 앉아 있다“라고 ⚬ 여러분이 누워 있으면 “톰이 누워있다” 라고 떠올려봅니다.\n(1분)\n\n⚬ 우리가 살아가면서 화를 참으면 병이 되고,\n화를 터트리면 나쁜 습관이 됩니다.\n⚬ 자 지금부터 내가 화가 났던 순간을 생각하며 그 화가 내 것이 아니고 톰의 것이라고 조용히 살펴봅니다.\n⚬ 네가 “화가 났구나” 하고 그 톰의 화를 조용히 관찰하면 화가 조용히 사라집니다.\n⚬ 호흡을 편하게 이어가며 그 화가 사라질 때까지 조용히 살펴봅니다.\n(3분) 땡~\n\n이번에는 타인과 관계의 분노에 대해서 살펴보겠습니다.\n\n⚬ “살아오면서 괜히 다른 사람과 불편했던 사람이 있었습니다. ⚬ 이번에는 여러분을 불편하게 하는 사람에게 “제리”라는 닉네임을 붙여줍니다.\n⚬ 그 사람을 제리라 생각하며 1분 동안 그 사람의 귀엽고 앙증맞은 제리로 이미지화하여 바라봅니다.\n(1분)\n\n⚬ “우리가 생활해 오면서 기억을 떠올릴 때마다 아주 불편했던 상황이 있습니다. ⚬ 이번에는 여러분이 불편했던 상황을 “톰” 혹은 “제리”라고 이미지화하여 관찰하여 보겠습니다.\n⚬ 조용히 여러분이 불편했던 상황을 떠올리고 그 상황을 톰과 제리라고 관찰해 봅니다.\n(2분)\n\n⚬ 어떠세요?\n그 불편했던 마음이 많이 편해지셨나요?\n아마 여러분은 그 불편했던 마음을 나로부터 분리시켜서 관찰함으로서 마음이 많이 편해지셨을 것입니다.\n\n우리 모두 현재의 모든 어려운 상황이 나의 것이 아니고 톰이나 제리의 것으로 좀 떨어져서 봅니다.\n모든 고통을 나와 분리시키는 연습을 함으로써 ‘강 건너 불구경하듯’ 톰과 제리 만화를 보듯 나에 대한 집착에서 벗어나 욕심과 화냄과 어리석음(걱정)으로 인한 고통에서 몇걸음 물러서서 늘 평화롭고 행복한 시간이 되시길 바랍니다.","duration":"","tags":"늘봄8회기,3회기","series":"늘봄명상"},{"id":"7f75b456","category":"수용","title":"물방울 명상","body":"(수륜(水輪)호흡 명상,\n물방울 동심원 명상,\n약칭 물방울 명상)\n\n이번에는 물방을 명상을 해보겠습니다.\n이 명상법은 집중력을 높여줍니다.\n흐트러진 마음을 제자리로 돌아오게 하는 데 아주 효과적입니다.\n\n시작하기 전에 숫자 세는 것부터 같이 해보겠습니다.\n제 손을 보면서 따라해 주세요.\n\n(그림으로 숫자 표시)\n(일반 손가락셈과 다름)\n\n① 주먹에서 검지만 폅니다.\n② 주먹에서 검지+중지를 폅니다.\n③ 주먹에서 검지+중지+약지를 폅니다.\n④ 주먹에서 검지+중지+약지+소지(새끼손가락)를 폅니다.\n⑤ 주먹에서 엄지만 폅니다.\n⑥ 주먹에서 엄지+검지를 폅니다.\n⑦ 주먹에서 엄지+검지+중지를 폅니다.\n⑧ 주먹에서 엄지+검지+중지+소지를 폅니다.\n⑨ 모든 손가락을 폅니다.\n⑩ 주먹을 쥡니다.\n\n그럼 본격적으로 시작해보겠습니다.\n\n<기초> 1.\n앉은 상태에서 양손을 가볍게 주먹 쥐고 무릎 위에 둡니다.\n2. 먼저 오른손으로,\n다음은 왼손,\n마지막으로 양손으로 하되 1부터 10까지 호흡에 맞춰 숫자를 셉니다.\n팔(위팔)을 옆구리에 붙인 상태에서 팔(팔뚝)을 구부려 우선 주먹을 신체 바깥으로 밀어둡니다.\n코로 들숨 때는 바깥쪽에 두었던 주먹을 하단전으로 당겨 들입니다.\n입으로 날숨 때는 ‘후~(입으로 소리 내지 않고)’ 하단전에서 최대한 바깥으로 밀어낸 후,\n숫자에 맞춰 해당 손가락을 폅니다.\n\n마치 비 오는 날 자동차 와이퍼가 앞 유리에서 왕복운동 하듯이 주먹을 단전으로 접었다,\n옆으로 폈다 하면서 왕복합니다.\n\n<방법1> 오른손 앵커링 1.\n무릎에 왼손은 그대로 두고,\n오른손을 밖으로 밀어낸 다음 코로 들숨을 쉬며,\n하단전으로 가져옵니다.\n날숨을 입으로 ‘후~’ 소리 내지 않고 내쉬며 주먹(손)이 최대한 밖으로 나왔을 때,\n마음속으로 ‘하나(1)’ 하며 검지만 폅니다.\n2. 검지만 편 상태에서,\n코로 숨을 들이쉬며 주먹(손)을 하단 전으로 가져옵니다.\n입으로 ‘후~’ 하며 숨을 내쉬며 주먹(손)을 최대한 밖으로 나왔을 때 ‘둘(2)’ 하며 검지+중지를 폅니다.\n3.\n검지+중지를 편 상태에서 코로 숨을 들이쉬며 주먹(손)을 하단전으로 가져옵니다.\n입으로 ‘후~’ 하며 숨을 내쉬며 주먹(손)을 최대한 밖으로 나왔을 때 ‘삼(3)’ 하며 검지+중지+약지를 폅니다.\n...\n같은 방법으로 10까지 합니다.\n마지막으로 바깥에 있는 주먹을 오른쪽 무릎에 둡니다.\n눈을 감으시고 자연스럽게 숨을 들이쉬고,\n내쉬고 그냥 숨에만 집중합니다.\n(3분 진행)\n\n<방법2> 왼손 앵커링\n<방법3> 양손 앵커링\n\n물방울 명상으로 호흡만 잘하셔도 호흡이 더 깊어지고,\n치매 예방도 됩니다 또한,\n맑고, 향기롭고,\n건강하게 됩니다.","duration":"","tags":"늘봄8회기,4회기","series":"늘봄명상"},{"id":"2f248a0d","category":"수용","title":"텅빈 몸 명상","body":"먼저 편안하게 앉아 주십시오.\n손도 그대로 편안한 자세로 둡니다.\n허리를 펴고 몸을 바로 세웁니다.\n조용히 눈을 감아주십시오.\n(명상발우 땡~)\n\n의식적으로 호흡을 깊게 하거나 길게 할 필요는 없습니다.\n주의력을 호흡에 두고 숨을 들이쉬면서 머리 속이 스노우볼의 눈처럼  생각으로 가득 차있다고 상상합니다.\n\n이제 숨을 내쉬면서 머리 속을 채운 생각의 안개가 빠져나간다고 상상하십시오.\n\n이때 생각안개의 밀도,\n부피 등의 느낌이나 이미지를 구체적으로 생각합니다.\n그러면 머리 속이 완전히 비워져 그저 공간으로 남는 것을 상상합니다.\n\n같은 방법으로 들숨과 날숨에 온몸의 안개가 사라진다고 상상합니다.\n\n머리의 안개가 나가고 양팔의 안개,\n몸통의 안개,\n다리의 안개 순으로 사라지는 것을 상상합니다.\n생각, 느낌, 지각,\n이미지를 안개에 실어서 몸 밖으로 내보냅니다.\n이제 나의 몸이 텅 비어감을 바라봅니다.\n그리고 그 안에서 완전한 휴식을 취합니다.\n(5분)\n\n(명상발우 땡~) 천천히 눈을 뜹니다.\n이상으로 텅빈 몸 명상을 마치겠습니다.\n감사합니다.","duration":"","tags":"늘봄8회기,4회기","series":"늘봄명상"},{"id":"019093cd","category":"수용","title":"나무명상","body":"일어나 선 채로 지그시 눈을 감습니다.\n이제 손을 양쪽으로 뻗어 봅니다.\n나의 발이 대지에 뿌리를 내리고 있다고 생각합니다.\n\n이제 당신은 쉽사리 휘지 않는 한 그루 나무가 되었다고 상상합니다.\n당신의 발바닥으로부터 대지의 영양분이 몸을 타고 올라옵니다.\n그리고 그 영양분이 온몸 구석구석으로 퍼집니다.\n발에서 다리를 지나 허리,\n가슴,\n머리와 손끝까지 퍼집니다.\n손끝에 달려있는 나뭇잎으로도 그 영양분이 흘러가는 것을 상상하십시오.\n(1분)\n\n이제 살며시 나무에서 빠져나와 나무를 바라봅니다.\n\n(1분)\n\n나무 앞에 섰습니다.\n나무의 모양은 어떤가요?\n나무의 변하는 모습을 봅니다.\n봄엔 새싹이 돋아나고 여름엔 잎이 무성해 그늘도 되어주고 가을엔 예쁜 단풍도 듭니다.\n겨울엔 춥고 거센 눈발도 다 이겨냅니다.\n참 대견한 나무입니다.\n이제 다시 나무로 돌아갑니다.\n이제 천천히 나무에서 빠져나와 손과 발의 느낌을 느끼며 여러분 자신으로 돌아옵니다.\n(1분) (명상발우 땡~)\n\n천천히 눈을 뜹니다.\n이것으로 나무명상을 마치겠습니다.\n감사합니다.","duration":"","tags":"늘봄8회기,4회기","series":"늘봄명상"},{"id":"873218c9","category":"수용","title":"산 명상","body":"산 이미지를 쉽게 떠올릴 수 있도록 참고영상을 보면서 명상하겠습니다.\n(1분)\n\n(발우볼 땡~)\n\n(발우볼 땡~) 존재하는 모든 것들이 진정으로 건강하고,\n행복하고, 평온하기를 바랍니다\n\n감사합니다.","duration":"","tags":"늘봄8회기,4회기","series":"늘봄명상"},{"id":"ac38c789","category":"수용","title":"받아들임","body":"받아들임 명상을 시작해 보겠습니다.\n명상을 하는 중에 어떤 감정이 느껴지거나 생각이 떠올라도 괜찮습니다.\n그냥 알아차리고 받아들여 주세요.\n편안한 자세로 심호흡을 하고 어깨와 몸의 긴장을 풀어줍니다.\n자연스럽게 눈을 감습니다.\n(발우볼 땡~)\n\n사실 우리는 살면서 많이 지쳐갑니다.\n하루하루가 너무 힘이 들때도 있습니다.\n나의 부족한 모습을 받아들이면,\n내가 그 상태에 계속 머물게되지는 않을까 걱정되는 것입니다.\n소심한 나를 받아들이면 계속 소심해질 것 같고,\n게으른 나를 받아들이면 더 게을러질까봐 걱정이 됩니다.\n그러나 자기 수용은 그렇지 않습니다.\n받아들이고 수용하는 것은 지금 자신의 상황,\n상태,\n현실을 인정하는 것입니다.\n그런 사실들에 마음을 활짝 열겠다는 의미이고,\n현재 지금 이 시점을 정확히 보고 느끼겠다는 건강한 관점입니다.\n\n이제 나의 가슴에 손을 얹고 나의 모든 것을 받아들이고 수용합니다.\n마음속으로 조용히 따라해봅니다.\n가슴에 손을 올려주세요\n\n작은 일에도 화를 내는 나를 있는 그대로 받아들입니다.\n성격 급한 나를 있는 그대로 받아들입니다.\n욕심이 많은 나도 있는 그대로 받아들입니다.\n자만심 가득한 나를 있는 그대로 받아들입니다.\n끈기가 없는 나를 있는 그대로 받아들입니다.\n부정적인 생각이 많은 나를 있는 그대로 받아들입니다.\n인정받기 위해 애쓰는 나를 있는 그대로 받아들입니다.\n때론 지혜롭지 못한 나를 있는 그대로 받아들입니다.\n서툴고 실수하는 나를 있는 그대로 받아들입니다.\n(잠시 명상) 내가 나의 마음들을 판단하지 않고 허용했을 때,\n힘들고 지치고 괜찮지 않은 마음들을 있는 그대로 허용했을 때,\n나는 다시 힘을 내며 앞으로 나아갈 수 있습니다.\n그리고 나는 진정으로 단단해져 갑니다.\n자신의 모습을 있는 그대로 받아들이고 인정하는 것이 자기수용입니다.\n자신을 사랑하는 첫걸음으로 지혜를 만나는 시작입니다.\n(싱잉볼) 땡~\n\n우리가 바다에 빠졌을 때 그대로 수용하여 힘을 빼면 천천히 바다위로 떠오른다는 것을 알고있습니다 단지 믿지못하고 두렵기 때문에 할수 없는 것 입니다.\n\n자기수용은 자신을 믿는 것입니다.\n이상으로 받아들임 명상을 마치겠습니다.\n내 안의 고요함과 지혜를 만나보세요.","duration":"","tags":"늘봄8회기,4회기","series":"늘봄명상"},{"id":"08759bd5","category":"수용","title":"바다명상","body":"(바다 동영상을 시청하면서)\n\n지금부터 바다명상을 시작하겠습니다.\n모두 편안한 자세로 천천히 눈을 감습니다.\n(발우볼 땡~)\n\n(발우볼 땡~)\n\n자, 조용히 눈을 뜹니다.\n이것으로 바다 명상을 마치겠습니다.","duration":"","tags":"늘봄8회기,4회기","series":"늘봄명상"},{"id":"da7b8772","category":"수용","title":"‘결국 나는?","body":"이번에는 ‘결국 나는?’이라는 주제를 가지고 같이 생각해보고 명상도 해보는 시간을 가져보겠습니다.\n\n결국 나는 어떤 존재인가요?\n비록 상상이지만 나무가 되어보고 산,\n바다를 보니 지금 어떤 것도 받아드릴 수 있을 것 같지 않나요?\n\n편안한 자세로 자리에 앉습니다.\n부드럽게 눈을 감아주세요.\n(명상발우) 땡~\n\n일부러 깊게 호흡하지 않습니다.\n자연 호흡하면서,\n고요하게 호흡에 집중합니다.\n\n우리는 보통 사라져 버린 과거에 좋았던 일을 그리워하거나,\n나빴던 기억 때문에 고통스러워합니다.\n오지도 않은 미래 생각에 근심걱정을 하며 삽니다.\n과거와 미래의 고통은 생각 속에서나 있고,\n자유와 행복은 현재에 이미 갖춰져 있고 화를 자주 내고,\n탐욕스러운 삶은 어리석은 삶이라는 것을 우리는 알고 있습니다.\n현재 가진 것과 있는 그대로 만족하는 인생이 지혜로운 삶을 사는 현명한 사람의 모습인것을요\n\n배고프면 밥을 먹고 잠잘 때는 잠을 자고 일할 땐 일을 하고 있는 그대로의 나를 받아들이면서 나의 마음엔 한계가 없어서 어떠한 것도 다 받아들일 수 있다고 생각하며 그렇게 잠시 명상을 하겠습니다.\n(5분 후, 명상발우) 땡~\n\n천천히 눈을 뜹니다.\n이것으로 명상을 마치겠습니다.","duration":"","tags":"늘봄8회기,4회기","series":"늘봄명상"},{"id":"0825de83","category":"자비희사","title":"이완명상","body":"(호흡바라보기)\n\n호흡 바라보기는 반듯하게 앉아서 머리,\n목,어깨 등 힘을 빼고 불필요한 긴장을 내보낸 편안한 자세에서 눈은 살포시 감고 오직 들숨과 날숨을 코끝에 주의를 두고 하나에서 열까지,\n다시 거꾸로 열에서 하나까지 세어봅니다.\n숫자를 잊어버리면 마음이 달아난 것이니 다시 하나부터 호흡에 집중하면서 숫자를 헤아려 봅니다.\n명상발우로 시작해서 명상발우로 마칩니다.\n\n여러분 눈을 감아주세요.( 명상발우,\n2분)\n\n여러분 천천히 눈을 떠주세요.( 명상발우)","duration":"","tags":"늘봄8회기,5회기","series":"늘봄명상"},{"id":"9b25a744","category":"자비희사","title":"자기자신 안아주기","body":"등토닥여주기, 저항 내려놓기\n\n인형을 하나씩 나눠드리겠습니다.\n인형을 들고 사랑스럽게 안아보겠습니다.\n\n안아주기는 자연스러운 돌봄의 기술로 공감적 유대감이 형성되어 행복 호르몬인 세로토닌 분비가 증대됩니다.\n\n안아줄 때 마음은 타인이 행복하기를 진심으로 바라면서 따듯한 마음으로 쓰다듬고 안아줍니다.\n안아줌으로써 닫혔던 문이 열려,\n너와 내가 서로 안아주면 우리가 되어,\n서로 하나가 됩니다.\n\n▶사랑하는 사람,\n가족 친구 등 안아주기 ▶애완 동물(강아지,\n고양이) 안아주기 ▶인형 안아주기 ▶마음 안아주기 ▶내 마음,\n친구 마음 안아주기\n\n안아주기 방법 본인의 두손으로 자신을 안아주세요.\n따스한 다솜의 힘으로 안아주세요.\n어깨도 토닥토닥 다독여 주세요.\n\n그동안 지쳤던 스스로를 안아주며 애정어린 진심으로 말해요.\n여러분 같이 따라해 주세요.\n“그동안 고생 많았어요.” (토닥토닥) “이젠 다 괜찮아요 앞으로는 꽃길만 걸어요...” (토닥토닥)\n\n상처받은 마음,\n분노의 마음 안아주면서 여러분 같이 따라해 주세요.\n“모든 것은 다 변한다” “이또한 지나가리라.” (토닥토닥)\n\n두려운 마음 안아주면서 여러분 같이 따라해 주세요.\n“괜찮아 괜찮아. 다 잘 될거야.” (토닥토닥)\n\n아픈 기억 안아주면서 여러분 같이 따라해 주세요.\n“괜찮아요 / 이젠 다괜찮아요” “온 세상이 나를 돕고 있습니다.” “온 세상이 나를 돕고 있습니다.” (토닥토닥)","duration":"","tags":"늘봄8회기,5회기","series":"늘봄명상"},{"id":"e6682920","category":"자비희사","title":"다솜소통 하기","body":"긴장을 풀고 편안하게 앉으십시오.\n눈을 살포시 감으십시오.\n\n“ㅇㅇ야 때론 어려운 일도 있었지만 기쁜 날도 많았잖니.” “ㅇㅇ야 오늘을 그렇게 고대했던 어제 간 사람도 있는데,” “ㅇㅇ야 지금 살아 있으니 이 얼마나 감사할 일이냐!”\n\n여러분 같이 따라해 주세요.\n“나는 ‘나를 아끼고 사랑합니다.”\n\n다 같이 따라해주십시오.\n\n“내가 위험에서 벗어나기를” “내가 행복하기를” (2번 반복,\n따라서 읽기)\n\n“은인들과 친구들이 위험에서 벗어나기를”\n“은인들과 친구들이 행복하기를”\n(2번 따라서 하기)\n\n“모든 이웃들이 위험에서 벗어나기를”\n“모든 이웃들이 행복하기를”\n(2번 따라서 하기)\n\n이번에는 미운 사람을 생각하면서 여러분 같이 따라해 주세요.\n\n“그들도 위험에서 벗어나기를”\n“그들도 행복하기를”\n(2번 따라서 하기)\n\n이제 천천히 눈을 뜨십시오.\n이상으로 다솜 소통 명상을 마치겠습니다.\n감사합니다.","duration":"","tags":"늘봄8회기,5회기","series":"늘봄명상"},{"id":"2febadd5","category":"자비희사","title":"몸에 대한 다솜명상","body":"여러분 안녕하세요?\n저는 대박입니다.\n이번 명상은 “그림과 함께하는 다솜명상”입니다.\n\n⦁그럼 지금부터 종이와 색연필을 나누어 드리겠습니다.\n(오색 색연필)\n\n⦁이 시간 명상내용은 지금 이 순간을 느끼는 호흡명상,\n지금 이 순간 나의 몸과 마음으로 느끼기,\n나의 몸을 종이 위에 그려보고 호흡하는 동안 나의 몸에서 느껴지는 긴장된 부위에 색칠해 보고,\n그 부위의 긴장을 해소해보는 명상입니다.\n\n⦁자 모두 편안하게 앉아주세요.\n지금부터 이 순간과 이 공간을 느껴보겠습니다.\n조용히 눈을 감고 편안하게 호흡합니다.\n(들숨~날숨) 당신의 주의를 코끝에 두고,\n코끝을 지나는 들숨과 날숨을 느껴봅니다.\n(2분)\n\n①몸관찰 ⦁ 이제 주의를 자신의 몸으로 돌려 몸의 각 부분에 대하여 살펴봅니다.\n· 호흡은 부드럽고 깊게 하면서 몸의 각 부분에 대하여 느껴봅니다.\n· 먼저 나의 머리를 지켜보면서 들숨~,\n날숨~.\n· 나의 목과 몸통을 지켜보면서 들숨~,\n날숨~.\n· 나의 오른쪽 팔을 지켜보면서 들숨~,\n날숨~.\n· 나의 왼쪽 팔을 지켜보면서 들숨~,\n날숨~.\n· 나의 등과 허리를 지켜보면서 들숨~,\n날숨~.\n· 나의 골반과 오른쪽 다리를 지켜보면서 들숨~,\n날숨~.\n· 나의 왼쪽 다리를 지켜보면서 들숨~,\n날숨~.\n· 호흡과 함께 몸의 각 부분을 느끼는 동안 긴장된 부분이 있었다면 긴장된 부위에만 주의를 집중시키고 호흡을 합니다.\n· 이제 다시 주의를 자신의 코끝에 두고 잠시 호흡에 집중합니다.\n· 이제 천천히 눈을 뜹니다.\n(5분)\n\n②몸 그리기 ⦁이제 당신의 몸을 지켜보면서 느꼈던 것을 떠올리며 편안한 마음으로 종이 위에 자신의 몸을 그려보겠습니다.\n\n· 지금까지 몸에 대한 명상을 하며 불편한 부위를 떠올려 보세요.\n· 천천히 주의를 나의 몸에 보낸 채 그 느낌 그대로 종이 위에 옮겨 보도록 하세요.\n· 마치 연필 끝이 당신이 떠올린 이미지를 어루만지듯 그냥 손이 움직이는 대로 따라가게 하세요.\n· 그림이 잘 그려지고 잘못 그려지는 것은 중요하지 않으니 아무 걱정 말고 그리세요.\n· 잘 그리려 하거나 그리는 행위에 집중하지 말고 마음속에 보이는 것을 손이 그냥 따라가도록 하세요.\n· 그림은 손을 사용하지 않고 마음의 눈으로 그린다고 생각하세요.\n· 그리는 순서는 머리,\n목과 몸통, 오른팔, 왼팔,\n등과 허리,\n골반과 오른쪽 다리,\n왼쪽다리의 순서로 그립니다.\n\n③느낌 색칠하기 ⦁ 호흡과 함께 나의 몸을 느껴보는 순간 강한 감정이 느껴졌던 부위를 표시하고 느껴지는 감정을 색으로 칠해 봅니다.\n\n④다시 호흡하기 · 다 그리셨으면 색연필을 내려 놓습니다.\n다시 조용히 눈을 감고 호흡하며 강한 느낌이 느껴졌던 부위로 주의를 기울이고 호흡하며 그 부위에 대한 강한 느낌이 사라질 때까지 부드러운 호흡을 이어갑니다.\n· 긴장이 사라졌으면 다시 편안하게 주의를 자신의 호흡에 두고 부드럽고 편안하게 지금 이 순간의 흐름에 집중해 봅니다.\n· 마음이 안정이 되었으면 천천히 눈을 뜨고 마무리합니다.","duration":"","tags":"늘봄8회기,5회기","series":"늘봄명상"},{"id":"f7e802d7","category":"자비희사","title":"다솜 마사지","body":"(마사지봉)\n\n그렸던 그림을 봐주세요.\n어디가 가장 불편하신가요?\n가장 불편한 곳이 어딘가요?\n지금부터 색칠한 아픈 부위에 다솜 마사지해 주겠습니다.\n\n2인 1조가 되어 한 사람은 편안히 눕고 한 사람은 마사지봉을 가집니다.\n\n마사지봉을 가진 사람은 상대방의 정수리를 가볍게 마사지해줍니다.\n\n\"걱정이 사라졌습니다.\" (3번 마사지)\n\n다음은 색칠된 부분을 확인하고 가볍게 두드립니다.\n\"편안해졌습니다. 아픔이 사라졌습니다.“ (3번 마사지)\n\n짝이 된 두 사람이 역할을 바꿔 똑같이 시행합니다.","duration":"","tags":"늘봄8회기,5회기","series":"늘봄명상"},{"id":"875704bb","category":"자비희사","title":"다솜 샤워","body":"(칭찬 샤워)\n\n5명씩 팀을 만들어 주세요.\n1인당 4장의 포스트잇을 나누어 드리겠습니다.\n\n타인과 소통하면서 상호간에 영향을 주고 받습니다.\n우리가 하는 칭찬은 자신과 타인의 자존감을 증진시켜줍니다.\n\n한명씩 가운데 의자에 올라가주세요.\n나머지 네분은 칭찬의 말을 포스트잇에 적어주세요.\n되도록이면 구체적이고 다양한 칭찬만 적어주세요.\n※고쳐야 할 말이나,\n바뀌었으면 하는 말들은 적지 않습니다.\n\n모두 원형 상태로 서고,\n각 팀원들은 주인공 몸에 포스트잇을 붙인 후,\n주인공과 얼굴을 마주보며 칭찬의 말을 실감나게 표현합니다.\n칭찬의 말을 하고 난 후 ‘와~’ 함성과 함께 박수를 쳐주세요.\n\n팀원 모두 칭찬 샤워를 주고 받도록합니다.\n쑥스럽더라도 충분히 칭찬을 받아 보십시오.","duration":"","tags":"늘봄8회기,5회기","series":"늘봄명상"},{"id":"0cbd46aa","category":"자비희사","title":"다솜 만트라","body":"만트라 명상은 집중과 통찰을 동시에 만족시킬 수 있습니다.\n소리를 통해 좋은 파동 에너지를 형성하여 몸과 마음을 긍정적 상태로 만들 수 있습니다.\n\n·먼저 긍정적 파동 에너지를 일으키는 만트라를 선정합니다.\n\n엄마, 사랑, 행복,\n평화와 같이 생각하면 따뜻해지고 행복해지는 위로가 되는 단어 또는 이미지를 생각하면서 집중하시고 상황이 되면 큰소리로 불러도 됩니다.\n\n내가 내소리를 들을 때가 집중된 상태 마음이 지금 이곳에 있는 것입니다.\n수련시간은 보통 5~30분 정도 하면 좋습니다.","duration":"","tags":"늘봄8회기,5회기","series":"늘봄명상"},{"id":"7fbcf8c8","category":"자비희사","title":"오륜호흡명상","body":"안녕하세요 이번 시간은 오륜호흡명상입니다.\n\n우리가 오륜이라고 많이들 쓰긴 하는데 정확히 어떤 의미인지 잘모르시지요?\n이것은 원래 地(지).\n水(수). 火(화).\n風(풍).\n空(공) 오대를 말하는데요.\n地(지). 水(수).\n火(화). 風(풍).\n空(공) 오대에서 ㅇ地(지)대는 딱딱함,\n견고함,\n부드러움 등을 뜻하고 ㅇ水(수)대는 팽창함,\n수축함,\n끈적끈적함 등을 의미합니다.\nㅇ火(화)대는 뜨겁고 차가움 등 온도에 들어가 있기 때문에 영하로 내려간          마이너스 온도도 화대에 들어갑니다.\nㅇ風(풍)대는 혈관부터 시작해서 장기들은 다 풍대에 들어가고,\n부푸는 것도 다 풍대입니다.\n흔들린다든가 쉐이킹 한다든가 몸 안에 각종 움직임이나 증세가 나타나는 것은 대부분 風(풍)대입니다.\n그래서 풍대는 바로 뇌로 들어가기 때문에 코를 뜻합니다.\n향기를 포함해서 다른 데를 거쳐 들어가지 않고 뇌로 바로 들어가기 때문에 공부를 제대로 해야 하는 부분입니다.\nㅇ空(공)대는 공간을 뜻하며 40cm 앞뒤로 위아래까지 다 나라고 여기는 것입니다.\n실제로 우리가 호흡할 때 나의 반경 40cm안의 공기를 마신다고 하네요 그래서 요즘 코로나로 음식점이나 터미널,\n공항안에 좌석 한칸 띄우기도 다 거기에서 비롯되었다 합니다.\n마법의 40cm,\n이 공간이 다름아닌 나이기 때문에 이것을 잘 이용하여 우리가 어디에 있던 나만의 공간에서 마음챙김,\n바로 알아차림,\n바로 여기의 명상을 할 수 있습니다.\n\n오륜호흡명상은 이 마법의 40cm를 활용하는 명상입니다.\n지수화풍과 나의 공간을 잘 활용하면 내 몸에 있는 모든 작용뿐만 아니라 내 마음을 바로 나로 옮겨오는데 가장 효과적인 오륜명상을 해 보도록 하겠습니다.\n\nㅇ편안한 자세로 자리에 앉아 양손을 무릎에 올려놓습니다.\n오륜호흡명상은 무릎에서 시작하고 무릎으로 마무리가 됩니다.\n먼저,\n5가지 단어를 떠올리며 저와 함께 동작을 연습하겠습니다.\n(간단하게 앞의 설명을 다시 한번 더 인지시키며...)\n\n․ 첫째 지륜정방(地輪正方) 오륜중에 지대를 바탕으로하는 지륜정방(地輪正方)입니다.\n지륜, 地(지)대는 딱딱함,\n견고함,\n부드러움 등을 뜻하고 정방은 땅을 설명하는 네모 모양을 뜻합니다.\n손을 양무릎 위에 자연스럽게 손을 얹으면 앉아있는 다리는 네모가 만들어진다고 생각하면 되겠습니다.\n\n․ 둘째 수륜원(水輪圓) 수륜원은 팽창함,\n수축함, 끈적끈적함인 수대,\n물을 뜻하는 수와 원형을 뜻합니다.\n손등을 밑으로 향하게 겹치시고,\n오른손이 위로 올라오든 왼손이 위로 올라오든 아무 상관없습니다.\n그냥 편안한 쪽으로 하시면 됩니다.\n엄지손가락은 자연스럽게 마주대고 손으로 원을 만들어 그냥 툭 하고 밑으로 놓으면 원형의 수륜이 되겠습니다.\n\n․ 셋째 화륜삼각(火輪三角) 화륜삼각은 뜨겁고 차가움 등 온도에 들어가 있는 화대,\n불 火(화)자를 뜻하고 두손을 가슴앞에 합장하면 팔은 자연스럽게 삼각형을 이룹니다.\n이 삼각형은 이곳 저곳을 향하는 방향성을 말하고 있습니다.\n\n․ 넷째 풍륜반월(風輪半月) 풍륜반월은 흔들린다든가 쉐이킹 한다든가 몸 안에 각종 움직임의 풍대입니다.\n합장한 양손의 엄지 끝을 콧대(코뿌리)에 대면 자연스럽게 두 번째 손가락이 제3의 눈이라고 할 수 있는 전두엽 쪽에 위치하게 됩니다.\n이것이 옆에서 보면 반달 모양이라고 해서 풍륜반월이라고 합니다.\n엄지를 제 위치에 잘 두셔야지 둘째손가락이 제 위치에 놓이게 됩니다.\n\n․ 다섯째 공륜보주(空輪寶珠) 공륜보주는 허공을 뜻하는 空(공),\n공간을 뜻하는 空(공)을 의미합니다.\n공의 수레바퀴는 보주인데,\n보주는 합장한 상태에서 공기가 살짝 들어가도록 해서 보석을 만들면 됩니다.\n보통은 물방울 다이아몬드라고 얘기합니다.\n이렇게 물방울 다이아몬드,\n보석,\n구술 등을 머리위에 얹는 것입니다.\n태어났을 때 막혀있지않아 움직였던 머리 위 숨골,\n바로 그 숨자리 위에 보석처럼 얹어져 마치 숨쉴 때마다 위로 올라갔다가 내려갔다가 호흡하는 모양을 하고 있습니다.\n\n․ 마지막으로 손을 원으로 쭉 돌려서 '모든 것은 변한다'나 ‘고통빼기’ ‘나를 사랑합니다.’ 등등 그날의 마음목표를 말하면서 합장하고 본래 자리로 돌아옵니다.\n(잠시 동영상을 멈추고)\n\n그리고 이번 회기에서는 하지 않지만 이 오륜을 이용하여 걷기 명상도 할 수 있습니다 자세를 바르게 서서 손은 앞으로 모으든지 뒷짐을 지시면 됩니다.\n한발 올리는 순간 바람이 생기고 든 순간 공간을 느끼고 그러므로 소리로나 마음으로 “풍공”,\n발을 내리면서 지면의 딱딱함 접촉할 때 느껴지는 지면의 수분,\n온도를 바라보며 소리나 마음으로 “지수화”\n\n또 다시 다른발 올리면서 풍공,\n내리면서 지수화...\n이렇게 계속 나의 모든 생각을 발로 발로 발로 마음을 모으며 걷기에 집중하는 것입니다.\n이 때 팔을 흔드셔도 좋지만 천천히 걸을때에 균형이 흐트려질수도 있으므로 미얀마 마하시에서는 손을 한 곳으로 모으고 걷기명상을 한다합니다.\n저도 처음에는 손을 자연스럽게 하니 몸이 뒤뚱뒤뚱해서 뒷짐을 지고 연습을 하였습니다.\n이렇게 평소 걸을 때에도 집중하여 걸으면 쓸데없는 걱정,\n균형을 잃어 넘어지는 일이 좀 덜 생기겠지요.\n\n(다시 동영상을 play~,\n혹은 동영상 없이,\n혹은 동영상 짤) 이제 다시 자리에 앉아 오륜호흡명상을 해 볼까요 따라서 합니다.\n\n지륜정방(地輪正方)       ( 지륜정방(地輪正方) 수륜원(水輪圓)           ( 수륜원(水輪圓)) 화륜삼각(火輪三角)       (화륜삼각(火輪三角)) 풍륜반월(風輪半月)       (풍륜반월(風輪半月)) 공륜보주(空輪寶珠)       (공륜보주(空輪寶珠)) 모든 것은 변한다        (모든 것은 변한다)      합장.\n\n․ 이렇게 해서 3번 저와 함께 연속동작으로 해보겠습니다.\n시작~\n\n지륜정방(地輪正方) 수륜원(水輪圓) 화륜삼각(火輪三角) 풍륜반월(風輪半月) 공륜보주(空輪寶珠) 모든 것은 변한다.\n~  합장.\n\n․ 이제 좀 동작들이 익숙해 지셨나요?\n․ 좀 익숙해지셨으면 다음에는 각자 눈을 감고 해보도록 하겠습니다.\n․ 눈을 감고 잠시 하시면 자연스럽게 마음이 나에게로 옮겨오게 될 것입니다.\n․ 횟수는 시간에 맞춰서 하면 됩니다.\n․ 처음에는 같이 소리 내면서 따라하고,\n익숙해지면 각자 눈을 감고 무음으로 자연스럽게 하시면 되겠습니다.\n\n자~ 이제 시작해 봅니다.\n지륜정방(地輪正方) 수륜원(水輪圓) 화륜삼각(火輪三角) 풍륜반월(風輪半月) 공륜보주 모든 것은 변한다.\n~합장.\n바로~ (1분후~     명상발우 땡)\n\n명상이 잘 되셨습니까?\n이 명상법은 집으로 돌아가셔서 하실때에는 오륜호흡명상을 5분정도 앉아서 하시고 다음 오륜걷기명상을 5분 하시면 흩어진 마음을 나의 이 자리로 돌아오게하는데 아주 효과가 있습니다.\n\n(앉아있는 분들을 눈을 맞추고 둘러보며) 수고하셨습니다.","duration":"","tags":"늘봄8회기,6회기","series":"늘봄명상"},{"id":"661884f0","category":"자비희사","title":"연민에 대한 명상","body":"(연민심 일깨우기)\n\n지금부터 연민에 대한 명상을 시작하겠습니다.\n연민은 사람만이 가질 수 있는 따뜻한 마음을 의미합니다.\n타인의 아픔을 함께 나눌 수 있는 마음입니다.\n\n① 용서 구하기\n\n각자의 자리에서 편안하게 앉아주십시오.\n눈을 감고 고요히 깨어있도록 합니다.\n먼저 당신이 다른 사람에게 상처를 주었던 상황을 떠올려 봅니다.\n다른 사람을 아프게 했던 상황을 잠시 떠올려서,\n그 사람이 느꼈을 상처,\n실망감, 배신감을 느껴봅니다.\n\n이제 그 사람을 떠올리며 용서를 구해 봅니다.\n마음속으로 그의 이름을 부르며\n\n“나는 당신이 느꼈던 상처를 이해합니다.” “미안합니다! 용서하세요!” “000님께서 부디 고통에서 벗어나시길 기원합니다...” “000님이 안락하시길...기원합니다.”\n\n진심으로 몇 번 반복해서 용서를 구해봅니다.\n\n2.타인 용서하기\n\n부모님의 화난 얼굴,\n형제의 무시하는 말,\n친구의 거친 말,\n믿었던 사람이 나를 속였음을 알게 된 순간 등을 떠올리며 다른 사람으로 인해 내가 어떻게 상처받았는지 구체적인 상황을 자세히 회상해 봅니다.\n\n일어나는 슬픔이나 수치심,\n분노나 두려움을 느껴봅니다 온화하게 수용하는 태도로 몸,\n가슴,\n마음에서 일어나는 고통을 느껴봅니다.\n이제 이 사람과,\n이 사람이 나에게 상처를 입히게 만든 두려움과 상처와 느낌을 더 자세히 바라봅니다.\n\n나를 고통스럽게 했던 이 사람을 한 명의 나약하고 불완전한 사람으로 인식해 봅니다.\n그의 존재를 느끼면서 마음속으로 그의 이름을 속삭이며 용서의 메시지를 보냅니다.\n“나는 당신을 용서했습니다.” “당신이 고통과 슬픔에서 벗어나기를 기원합니다.” “안락하기를 기원합니다.” (수회 반복합니다)\n\n나를 힘들게 하고 화나게 하는 사람이 있다면 그는 나를 성장시키는 스승이되고 후원자가 됩니다.\n\n이제 마음에서 모든 것이 용서가 됨을 알아차리면서 명상을 끝내겠습니다.\n두손을 모으면서 속삭이며 마무리합니다\n\n“미안합니다! 용서하세요! 고맙습니다! 사랑합니다!”\n\n3.나와 화해하고 나 용서하기\n\n자신의 용서할 수 없는 부분을 생각해봅니다.\n그것 때문에 자신에게 어떤 느낌인가요?\n그것이 자신이 행복해지는 것을 어떻게 방해하나요?\n그것이 바람직한 방향으로 나아가는 나에게 어떤 영향을 주나요?\n스스로 거부하고 있는 느낌,\n생각,\n행동이 무엇이든 진심어린 메시지를 보냅니다.\n\n비록 나는 부족하지만,\n부족한 나를 깊이 이해하고 용서합니다.\n(이런 식으로 적용하셔서)\n\n비록 나는 지난날 부모님께 깊은 상처를 드렸지만 부족한 자 자신을 깊이 이해하고 용서합니다.\n비록 나는,,,,\n하지만 자신의 부분을 말하고 뒷부분 용서합니다.\n사랑합니다,\n라고 긍정으로 문장연결 해봅니다.\n\n“내가 나에게 어떻게 괴로움을 줬는지 압니다. 나는 이제 나를 용서합니다” 라고 마음속으로 속삭여 봅니다.\n\n“용서 받음, 용서받음.” 나는 내 생각보다 더크고 훌륭합니다“ 라고 마음속으로 속삭여 봅니다.","duration":"","tags":"늘봄8회기,6회기","series":"늘봄명상"},{"id":"aaee2344","category":"자비희사","title":"마음 바꾸기","body":"지금부터 마음 바꾸기 명상을 하겠습니다.\n이 명상은 묵은 습관에서 벗어나기 위한 방법입니다.\n그릇을 비워야 새로운 것을 담을 수 있습니다.\n그래서 보통 때와는 달리 숨을 내쉰 후에 숨을 들이킨다고 생각합니다.\n이것은 안에 있는 숨과 함께 묵은 습관을 내보내는 것입니다.\n\n그럼 모두 평좌를 하겠습니다.\n평좌 보다는 반가부좌가 더 편하다 하시는 분은 반가부좌를 하셔도 되겠습니다.\n두 손을 무릎위에 가볍게 얹고 손바닥은 위로 향하게 합니다.\n\n잠시 후 깊은 호흡을 할 때에 힘드신 분들은 몸을 앞으로 숙여서 손을 무릎 앞 바닥에 짚고 하셔도 됩니다.\n이렇게 하면 깊은 호흡을 하는 데 도움이 됩니다.\n또한 숨을 끝가지 내쉬는데 도움이 됩니다.\n그리고 지금은 코로나로 숨을 내쉴 때,\n입을 닫은채로 하시지만 집에서 혼자 있을때나 코로나가 끝나면 입을 자연스럽게 벌리시고 윗니와 아랫니 사이로 ‘쓰으으으~’ 하시면 훨씬 쉽습니다.\n\n이제 마음바꾸기 호흡명상을 시작하겠습니다.(땡) 조용히 눈을 감습니다.\n편안한 호흡을 합니다.\n가만히 호흡을 바라봅니다.\n날숨~ 들숨~ 천천히 그리고 자세히 바라봅니다.\n그리고 바라보다보면 날숨하고 보고 들숨하고 보면 날숨도 들숨도 아닌 숨이 멈춰있는 순간이 있습니다.\n그 멈춰있는 순간들을 알아차려 봅니다.(잠시)\n\n그 순간이 보이시지요.\n그럼 숨을 깊이 그리고 천천히 내쉽니다.\n해묵은 습관의 마음방식을 내던지듯 단전 깊이 잡아당기면서 쪼여내듯 내쉽니다.\n\n숨이 잠시 멈추는 것을 느끼다가 몸 밖의 아주 밝고 청량한 공기를 나의 몸 구석구석 밀어넣듯 마십니다.\n나의 모든 부정적인 마음들이 빠져 나갑니다.\n\n잠깐의 멈춤을 느끼고 천천히 맑고 밝은 기운을 나의 몸에 밀어 넣습니다.\n진행자의 멘트가 없어도 본인의 호흡길이에 따라 계속합니다.\n우울한 마음도 나갑니다.\n기운찬 에너지가 들어옵니다.\n(3분)\n\n몸을 기울이셨던 분들은 자세를 바로 합니다.\n서서히 자연스런 호흡으로 돌아옵니다.\n(1분) (땡)\n\n눈을 뜹니다. 어떠신지요?\n호흡이 조금 불편하셨지요?\n한 생각에 골똘히 빠져 있을 때 혹은 습관을 바꾸기 위해 마음을 다시 먹을 때 도움이 됩니다.\n그렇다고 이 호흡으로 수 십년 가져왔던 나쁜 습관이나 마음들이 바로 쉽게 없어지지는 않습니다.\n조금씩 조금씩 마음 바꾸기를 편한 호흡이 될 때까지 해보셨으면 합니다.\n\n감사합니다.","duration":"","tags":"늘봄8회기,6회기","series":"늘봄명상"},{"id":"4175bd5c","category":"자비희사","title":"낙엽 쓸기","body":"지금부터 ‘낙엽쓸기’ 명상을 시작하겠습니다.\n편한 자세로 부드럽게 눈을 감습니다.\n\n호흡에 의식을 집중합니다.\n공기가 뱃속으로 깊숙이 들어가는 것을 느끼고 나서 천천히 부드럽게 숨을 내쉽니다.\n숨을 들이쉴 때 배가 부풀어 오르고 숨을 내쉴 때 배가 꺼지는 것을 느껴봅니다.\n계속해서 천천히 숨을 깊이 마시고 천천히 내쉬면서 배가 공기로 가득 찼다가 빠져나가는 느낌에 집중합니다.\n만일 주의가 다른 곳으로 흐트러지면,\n조용히 다시 배가 오르내리는 느낌으로 의식을 가져옵니다.(몇 분 동안)\n\n올해도 가을 낙엽이 쌓여갑니다 여러분이 빗자루를 들고 낙엽을 쓸고 있다고 생각해봅니다.\n\n바람이 붑니다.\n바람은 살아가면서 만나는 풍파입니다.\n바람이 같은 방향이면,\n낙엽을 쓰는 대로 도와주어 행복합니다.\n마주 불어오는 바람은 낙엽 쓸기를 방해하지만 시간이 지나면 잦아집니다.\n\n비에 젖어 바닥에 붙어버린 낙엽은 고통스러웠던 과거의 일이나 어렵고 힘들었던 생각들과 같이 쓸어지지 않으면서 나를 힘들게 할 수도 있습니다.\n\n낙엽을 쓸면서 조금씩 마음속에 고통의 찌꺼기를 조금씩 천천히 쓸어내어 봅니다.\n\n모든 것은 내가 마음의 집착을 떨쳐 버리지 못해 고통도 함께 따르는 것입니다.\n의식을 전환하여 낙엽처럼 쓸어 버린다고 생각하고 천천히 낙엽쓸기에 집중하면서 고통을 쓸어내 보세요.\n\n이렇게 낙엽들과 친구처럼 대화하고 감사하는 낙엽쓸기는 아주 즐거운 일입니다.\n\n낙엽쓸기를 하고 나면 기쁜 마음으로 깨끗해진 길을 지나다니는 사람들을 바라볼 수 있습니다.\n그 마음으로 사람을 바라보며 모두가 행복하기를 바래 봅니다.\n\n이제 잠시 호흡에 집중합니다.\n공기가 뱃속으로 깊숙이 들어가는 것을 느끼고 나서 천천히 부드럽게 숨을 내쉽니다.\n숨을 들이쉴 때 배가 부풀어 오르고 숨을 내쉴 때 배가 꺼지는 것을 느껴봅니다.\n\n계속해서 천천히 숨을 깊이 마시고 천천히 내쉬면서 배가 공기로 가득 찼다가 빠져나가는 느낌에 집중합니다.\n(3분 동안)\n\n조용히 눈을 뜹니다.\n이것으로 ‘낙엽쓸기’ 명상을 마치겠습니다.\n모든 존재들이 건강하고,\n행복하고,\n평온하기를 바랍니다.\n\n감사합니다","duration":"","tags":"늘봄8회기,6회기","series":"늘봄명상"},{"id":"2c24cea4","category":"자비희사","title":"나뭇잎 띄워 보내기","body":"여러분 안녕하세요.\n이번에 저와 함께할 명상은 나뭇잎 띄워 보내기 명상입니다.\n\n나뭇잎 띄워 보내기 명상은 우리들의 일상생활이나 평소에 느끼고 있던 괴로움을 나뭇잎에 얹어서 맑은 시냇물에 띄워서 흘려보내는 상상하면서 아픔이나 불편함에서 빠져나오는 명상입니다.\n오늘은 시냇물이 흐르는 효과음을 들으면서 시냇가 장소를 대신해서 명상을 하겠습니다.\n\n지금부터 나뭇잎 띄워 보내기 명상을 하겠습니다.\n모두 편안한 자세로 앉아주세요.\n앉는 자세는 가부좌도 좋고 반가부좌나 평좌로 하되 허리를 곧게 펴고 어깨에 힘을 빼고 반듯하게 앉습니다.\n\n먼저 잠시 호흡명상을 하겠습니다.\n숨을 깊게 들어 마시며 “깊게 들어 마신다”고 그 들이쉬는 숨을 바라봅니다.\n숨을 길게 내쉬며 “길게 내 쉰다”고 그 내쉬는 숨을 바라봅니다.\n숨이 짧으면 짧게 들이쉬면서 “짧게 들이 쉰다”고 바라보고 짧게 내쉬면 “짧게 내 쉰다”고 그 호흡을 바라봅니다.(3분)\n\n이어서 나뭇잎 띄워 보내기 명상을 해보겠습니다.\n(시냇물 흐르는 배경음악을 준비한다) 조용히 눈을 감고 시냇물 소리에 귀 기울여 봅니다.\n내가 조용한 계곡의 맑은 시냇물이 흐르는 냇가에 앉아 있다고 상상한다.\n천천히 흐르는 시냇물에 나뭇잎이 떠내려가는 것을 상상해 봅니다.\n\n머릿속에 고통스러웠던 기억이 떠오르면 그 고통스러웠던 생각을 나뭇잎 위에 글씨를 쓰거나 나뭇잎 위에 살짝 올려놓아 흐르는 물에 띄워 보내는 상상을 해봅니다.\n머릿속에 잡념이 떠오를 때마다 그 잡념이나 망상을 나뭇잎 위에 하나씩 올려 놓아 냇물을 따라 흘려보냅니다.\n계속해서 마음에 일어나는 생각들을 나뭇잎 위에 올려놓고 나뭇잎이 아래로 떠 내려가는 것을 지켜봅니다.\n\n이제 잠시 동안 계속해서 여러분의 마음속에 쌓여 있던 생각들이 흐르는 냇물 따라 떠내려가는 것을 그냥 지켜보겠습니다.\n마음속에 일어났던 고통이나 망상들이 점차 사라지는 것을 지켜봅니다.\n(띵~)\n\n천천히 눈을 뜨겠습니다.\n마음이 많이 가벼워 지셨나요?\n이것으로 나뭇잎 띄워 보내기 명상을 마치겠습니다.\n감사합니다.","duration":"","tags":"늘봄8회기,6회기","series":"늘봄명상"},{"id":"c3e3a133","category":"자비희사","title":"마음에 대한 자애명상","body":"여러분 안녕하세요?\n이번 명상은 “그림과 함께하는 마음에 대한 자애명상”입니다.\n시간에 사용할 인체그림 종이와 색연필을 나누어 드리겠습니다.\n\n명상내용은 호흡하는 동안 나의 마음에서 느껴지는 긴장된 부분에 색칠해 보고 그 부분의 긴장을 해소해보는 명상입니다.\n모두 편안하게 앉아 주세요.\n앉는 자세는 가부좌도 좋고 반가부좌나 평좌로 하되 허리를 곧게 펴고 어깨에 힘을 빼고 반듯하게 앉습니다.\n눈을 감고 이 순간과 이 공간을 느껴보겠습니다.\n\n먼저 잠시 호흡명상을 하도록 하겠습니다.\n주의를 지신의 코끝에 두고 지금 이 순간의 호흡을 느껴봅니다.\n숨을 깊게 들어 마시며 “깊게 들어 마신다”고 그 들이쉬는 숨을 바라봅니다.\n숨을 길게 내쉬며 “길게 내 쉰다”고 그 내쉬는 숨을 바라봅니다.\n숨이 짧으면 짧게 들이쉬면서 “짧게 들이 쉰다”고 바라보고 짧게 내쉬면 “짧게 내 쉰다”고 그 호흡을 바라봅니다.\n조용히 눈을 감고 편안하게 호흡합니다.\n(들숨~날숨) 당신의 주의를 코끝에 두고 코끝을 지나는 들숨과 날숨을 느껴봅니다.\n(2분)\n\n지금부터 긴장되는 자신의 마음을 살펴보도록 하겠습니다.\n(3분)\n\n“내 마음의 크기는 어느 정도 인가요?” “어떤 모양인가요?” “어떤 색깔인가요?” “위치는 어느 부분인가요?”\n\n이제 천천히 눈을 뜹니다.\n\n당신의 몸에서 느꼈던 것을 생각해보며 편안한 마음으로 지금까지 마음에 대한 명상을 하며 느꼈던 이미지에 집중해 보세요.\n인체그림 위에 자신의 마음을 그려보겠습니다.\n색연필을 잡고 천천히 주의를 나의 마음에 보낸 채 그 느낌을 그대로 인체그림 종이 위에 위치,\n크기, 모양,\n색깔을 옮기도록 하세요.","duration":"","tags":"늘봄8회기,6회기","series":"늘봄명상"},{"id":"0f765046","category":"자비희사","title":"할머니의 약손","body":"각자의 자리에서 편안하게 누워 주십시오.\n편안하게 누워 앞에서 해 본 몇 번의 호흡을 해봅니다.\n당신이 힘들고 괴로운 순간을 알아차리고 부드럽게 배에 오른손을 얹습니다.\n지긋이 누르며 따뜻하게 감싼다.\n(섬집아이 동요,\n동성 2인 1조)\n\n어릴 때 배가 아프면 아픈 배를 문질러 주시던 할머니의 손길을 생각하며 시계방향으로 부드럽게 문지릅니다.\n배에 얹은 손의 감각을 느껴봅니다.\n\n배가 오르락 내리락 하는 자연스런 움직임을 느껴봅니다.\n배가 따뜻해지고 괴롭다는 생각이 사라질 때까지 깊은 호흡을 하며 손의 움직임을 느껴봅니다.\n괴롭다는 생각이 사라질 때까지 깊은 호흡을 합니다.\n(3분 명상)\n\n이제 서로 역할을 바꾸어 진행하겠습니다.\n(교대하여 3분 진행)\n\n아픈부위를 문질러 주는 내용 추가\n\n아픈 마음이 많이 편안해 지셨나요?\n이상으로 할머니의 약손 명상을 마치겠습니다.","duration":"","tags":"늘봄8회기,6회기","series":"늘봄명상"},{"id":"0a4a5058","category":"용서감사","title":"‘하하호호’ 웃음명상","body":"모두 자리에서 일어나 주세요.\n먼저 손을 살짝살짝 앞으로 튕기면서 하하 (동작 2번).\n다음은 손을 밑으로 튕기면서 호호(동작2번).\n이번엔 모두같이 한번해 보겠습니다.(하하 호호 연속 동작3번)\n\n이제 움직이면서 해보겠습니다.\n옆 사람과 2인1조가 되어 손바닥을 마주치며 같이 하시면 됩니다.\n하하 호호(큰 소리로 웃으며 1분 실시)\n\n이제부터는 기차놀이 하듯이,\n하하호호를 소리치며 앞 사람을 따라 (둥근 원을 그리며) 북소리에 맞춰 즐겁게 돌겠습니다.(북준비)\n\n첫 바퀴 땐 천천히 돌면서 하하 호호\n두 바퀴 땐 조금 빠르게 돌면서 하하 호호\n세 바퀴부턴 빠르게 하하 호호\n\n이제 천천히 걸으십시오..\n제 자리에서 심호흡을 3번 천천히 하시고 하하호호 명상을 마치겠습니다.","duration":"","tags":"늘봄8회기,7회기","series":"늘봄명상"},{"id":"eae8f488","category":"용서감사","title":"더불어 기뻐함","body":"(mudita)에 대한 명상\n\n‘더불어 기뻐함’에 대한 명상’을 함께 해보도록 하겠습니다.\n\n두 사람씩 짝을 지어 주세요.\n왼쪽에 계신 분은 산 자세로 그냥 앉습니다.\n그리고 다른 사람은 바위자세로 무릎을 베고 위에 눕습니다.(방석 또는 타올)\n\n이 상태에서 앉아계신 산이 누워계신 바위에게 다음과 같이 얘기합니다.\n자 따라해보세요.\n“당신의 행복이, 당신과 함께하기를, 기원합니다” (이 상태에서 ‘땡~’)\n\n“바위는 산이 말하고 있는 것을 가슴에 새기시기 바랍니다.” (5분후)\n\n이번에는 역할을 바꾸어서 해보겠습니다.\n누웠던 분이 앉으시고,\n앉았던 분은 누워주세요.\n\n자 따라해보세요.\n“당신의 행복이, 당신과 함께하기를, 기도합니다” (이 상태에서 명상발우 땡~)\n\n“바위는 산이 말하고 있는 것을 가슴에 새기시기 바랍니다.” (5분후)\n\n자 모두 일어나 앉아주세요.\n그리고 손을 잡고 따라해 주세요.\n“우리의 행복이, 항상 함께하기를, 기도합니다” (3회 반복)\n\n그럼 이상으로 ‘더불어 기뻐함’ 명상을 마치겠습니다.\n\n감사합니다.","duration":"","tags":"늘봄8회기,7회기","series":"늘봄명상"},{"id":"5a3a194a","category":"용서감사","title":"한잔의 차 명상","body":"지금부터 한잔의 커피(보이차) 명상을 시작도록 하겠습니다.\n(보조강사 커피(보이차) 세팅)\n\n여러분 앞에 놓여 있는 커피(보이차)를 30초 동안 보겠습니다.\n‘땡~’\n\n그럼 눈을 감고 지금까지 지켜본 커피(보이차)에 대한 이미지를 머릿속에 띄우시기 바랍니다.\n‘땡~’ (2분)\n\n이제 눈을 뜨시고 다시 한 번 커피(보이차)를 보시고 커피(보이차)와 관련된 경험을 토대로 커피(보이차)에 고마운 점과 장점을 찾아보도록 하겠습니다.(2분)\n\n그럼 지금부터 커피(보이차)의 장점을 10가지 씩만 적어보도록 하겠습니다.\n(다 적고 나면,\n10분 정도)\n\n그럼 이제 돌아가면서 발표해보도록 하겠습니다.\n저를 기준으로 시간방향으로 시작하겠습니다.\n(상황에 따라 일부 4-5명만 발표)\n\n네 잘 들었습니다.\n많은 분들이 커피의 ㅇㅇㅇ,\nㅇㅇㅇ,\nㅇㅇㅇ를 감사한 점으로 말씀해주셨습니다.\n우리가 습관적으로 무심히 마셨던 커피도 이렇게 감사한 점들이 많았네요.\n그런데 우리가 가까운 사람들에게도 감사하게 느꼈는지 생각해보면 좋겠지요.\n이상으로 한잔의 차 명상을 마치도록 하겠습니다.\n\n감사합니다.","duration":"","tags":"늘봄8회기,7회기","series":"늘봄명상"},{"id":"3dfc0f61","category":"용서감사","title":"함께 기뻐한 경험 기억해내기","body":"지금부터 ‘함께 기뻐한 경험 기억해내기’ 명상을 시작하겠습니다.\n\n긴장을 풀고 편하게 앉으세요.\n그리고 눈을 조용히 감습니다.\n(시작 명상발우 ,\n차분하고 조용한 목소리로 읽어주기)\n\n여러분이 이미 했던 일 중에 친절을 베풀었거나 선한 행위라고 느꼈던 말이나 행동을 생각해봅니다.\n무엇인가 마음에 떠오르면,\n좋은 기억과 함께 행복을 느껴봅니다.\n\n만일 아무것도 떠오르지 않는다면,\n여러분 자신의 좋은 면을 생각해봅니다.\n아직도 마음에 떠오르는 것이 없다면,\n행복했던 어린시절,\n함께했던 친구들과의 순수한 꿈을 떠올려 봅니다.\n\n이렇게 생각을 일으키는 동안에,\n조바심이나 귀찮다는 생각 혹은 두려움이 일어나더라도 실망하거나 불안해하지 마십시오.\n명상으로 다시 돌아갈 수 있다고 생각하십시오.\n\n명상은 끊임없이 떠오르는 상념들이 일어나고 사라지는 것을 마음으로 알아차리는 것입니다.\n한 번 앉아 있는 동안,\n수천 번이나 이런 일을 반복해야 하더라도 상관하지 마십시오.\n\n선택한 수행의 주제를 놓쳐버렸을 때,\n그 사실을 바로 알아차린 바로 그 순간 우리는 다시 시작할 수 있습니다.\n\n산만한 정신이 아무리 오래간다 하더라도,\n우리의 마음이 완전히 길을 잃지 않습니다.\n오히려 그러한 사실을 아는 순간에,\n우리는 다시 시작합니다.\n\n(나래이션 후,\n5분후 명상발우 )\n\n자,\n이제 천천히 눈을 뜹니다.\n명상을 하면서 마음이 따뜻해지셨나요?\n이상으로 ‘함께 기뻐한 경험 기억해내기’ 명상을 마치겠습니다.\n\n감사합니다.","duration":"","tags":"늘봄8회기,7회기","series":"늘봄명상"},{"id":"ef8b0e8d","category":"용서감사","title":"감사의 절하기","body":"지금부터는 감사의 마음을 표현해보는 감사의 절하기를 같이 해보겠습니다.\n\n먼저 2줄로 마주보고 서주세요.\n마주보고 삼배하기를 하겠습니다.(3배)\n\n다음은 5명씩 조를 나누어 보겠습니다.(4개 조로 나눈 후) 조별로 1분씩 앞의 단으로 올라가고,\n아래에서 있는 사람들은 모두 삼배를 하도록 하겠습니다.\n(음악준비)\n\n첫번째 분이 단에 올르겠습니다.\n‘우리의 가장 소중한 인연 ㅇㅇㅇ님을 모시겠습니다’\n\n나머지 아래에 계신 분들은 단에 오르신 분을 향해 3배를 올리겠습니다.\n‘세상에 가장 소중하고 귀하신 ㅇㅇㅇ님께 삼배를 올립니다(3번)’\n\n두번째 분이 단에 올르겠습니다.\n‘우리의 가장 소중한 인연 ㅇㅇㅇ님을 모시겠습니다’ ‘세상에 가장 소중하고 귀하신 ㅇㅇㅇ님께 삼배를 올립니다(3번)’\n\n세번째 분이 단에 올르겠습니다.\n‘우리의 가장 소중한 인연 ㅇㅇㅇ님을 모시겠습니다’ ‘세상에 가장 소중하고 귀하신 ㅇㅇㅇ님께 삼배를 올립니다(3번)’\n\n네번째 분이 단에 올르겠습니다.\n‘우리의 가장 소중한 인연 ㅇㅇㅇ님을 모시겠습니다’ ‘세상에 가장 소중하고 귀하신 ㅇㅇㅇ님께 삼배를 올립니다(3번)’\n\n다섯번째 분이 단에 올르겠습니다.\n‘우리의 가장 소중한 인연 ㅇㅇㅇ님을 모시겠습니다’ ‘세상에 가장 소중하고 귀하신 ㅇㅇㅇ님께 삼배를 올립니다(3번)’\n\n마지막으로 2줄로 마주보고 삼배하기를 하겠습니다.\n이상으로 ‘감사의 절하기’를 마치겠습니다.\n\n감사합니다.","duration":"","tags":"늘봄8회기,7회기","series":"늘봄명상"},{"id":"ad360cf6","category":"용서감사","title":"편지쓰기","body":"지금부터 편지쓰기를 시작하겠습니다.\n\n편안한 자세로 앉아주세요.\n조용히 눈을 감고 크게 세 번 숨을 쉬어봅니다.\n\n지금부터 여러분이 지금까지 살아오면서 가장 감사하게 생각하신 분을 떠올려 보세요.\n부모님, 은사님, 친구,\n가족... 누구라도 좋습니다.\n\n한 분을 선택하셨으면 그 분에게 가장 감사하게 느꼈던 시간으로 돌아가 감사한 점들을 찾아보세요.\n구체적인 상황을 생각하셔도 좋고 그분이 해주신 말이나 행동도 좋습니다.\n가능하면 자세하게 기억해 봅니다.\n\n천천히 눈을 뜹니다.\n이제 방금 여러분이 생각하신 분께 감사했던 내용을 편지로 써보겠습니다.\n(10분 동안 편지작성)\n\n자, 모두 작성을 하셨지요?\n그럼 작성한 편지를 한 분씩 읽어보는 시간을 갖겠습니다.\n저를 기준으로 시계방향으로 시작하도록 하겠습니다.\n\n(마지막 사람까지 듣고 나서)\n\n이상으로 편지쓰기를 마치겠습니다.\n모두 수고하셨습니다.","duration":"","tags":"늘봄8회기,7회기","series":"늘봄명상"},{"id":"f007a73d","category":"용서감사","title":"감사호흡명상","body":"우선 가부좌나 반가부좌 혹은 평좌로 하되 바른 자세로 편안하게 앉으십시오.\n무릎위에 놓으시거나 발목위에 두손을 겹쳐 엄지끼리 맞대고 있으셔도 되고요,\n어깨에 힘도 빼고 반듯하게 앉습니다.\n\n부드럽지만 단호하게 마음을 호흡에 집중하도록 노력해야 합니다.\n호흡을 알아차리다가 잡념에 빠졌다는 것을 자각하면 부드럽게 호흡으로 다시 돌아오면 됩니다.\n\n하지만 실제로 해보면 호흡에 지속적으로 집중하고 싶어도 마음이 뜻대로 되지 않음을 발견하게 되지요.\n이것이 바로 야생의 마음 상태입니다.\n마음의 야생마가 날뛰는 가운데 기수가 허둥대면 우리는 고요한 평화와 지혜를 얻을 수 없겠지요.\n\n자 그러면 조금은 지루할 수도 있는 마음 야생마를 길들이는 호흡명상으로 가 보겠습니다.\n눈을 살포시 감으세요 (명상 발우~)\n\n(내레이션) 길게 들이쉬면서는 ‘길게 들이쉰다.’고 바라봅니다.\n길게 내쉬면서는 ‘길게 내쉰다.’고 바라봅니다.\n(잠시)\n\n짧게 들이쉬면서는 ‘짧게 들이쉰다.’고 바라보고 짧게 내쉬면서는 ‘짧게 내쉰다.’고 바라봅니다..(잠시)\n\n온몸으로 들이쉬는 것을 바라보고 온몸으로 내쉬어 지는 것을 바라봅니다.\n(잠시)\n\n들이쉬면서 내 몸이 순환이 편안한지 바라보고,\n내쉬면서 내 몸의 순환을 편안한지 바라봅니다.(잠시)\n\n이번엔 내 몸의 순환을 편안히 하면서 들이쉬고,\n내 몸의 순환을 편안히 하면서 내쉽니다.(잠시)\n\n나의 기쁨을 바라보며 들이쉬고,\n나의 기쁨을 바라보며 내쉽니다.(잠시)\n\n나의 행복을 바라보며 들이쉬고,\n나의 행복을 바라보며 내쉽니다.(잠시)\n\n상대의 기쁨을 바라보며 들이쉬고,\n상대의 기쁨을 바라보며 내쉽니다.(잠시)\n\n상대의 행복을 바라보며 들이쉬고,\n상대의 행복을 바라보며 내쉽니다.(잠시)\n\n나의 기쁨 하며 들이쉬고,\n너의 기쁨 하며 내쉽니다.(잠시)\n\n나의 행복 하며 들이쉬고,\n너의 행복 하며 내쉽니다.(잠시)\n\n나의 기쁨, 너의 기쁨,\n나의 행복,\n너의 행복 나의 기쁨,\n너의 기쁨, 나의 행복,\n너의 행복 진행자 없이 계속 합니다.\n(5분)\n\n(명상 발우~) 천천히 눈을 뜹니다.\n야생마를 길들이느라 수고많으셨습니다.","duration":"","tags":"늘봄8회기,7회기","series":"숨비명상"},{"id":"2567f897","category":"자비희사","title":"그라운딩 기법","body":"(흘러서 내려간다)\n\n지구는 모든 살아 있는 것들을 품어주는 생명의 어머니입니다.\n지구는 어머니와 같은 사랑의 에너지를 품고 있습니다.\n지금부터 그 사랑의 에너지를 통해 생명 근본의 에너지를 느껴보는 시간을 가져보겠습니다.\n\n(명상발우 땡-) 두발을 어깨 넓이로 벌리고 눈을 감고 서봅니다.\n천천히 호흡하세요.\n\n바닥에 닿은 두 발바닥의 감촉을 느껴보세요.\n그리고 저 지구의 중심까지 발바닥과 연결되어있음을 느껴봅니다.\n대지의 중심으로부터 전해져오는 에너지를 느껴봅니다.\n두발부터 무릎 엉덩이 허리 그리고 몸통과 목 머리까지 온몸으로 전해집니다.\n\n그 사랑의 에너지 안에서 편안합니다.\n몸은 활력이 넘치고 마음은 사랑이 가득합니다.\n\n이제 지구와 하나된 생명의 에너지를 가지고 마음의 집중을 통해 정수리로부터 발가락 끝까지 천천히 내려오는 명상을 할 것입니다.\n몸의 각 부분으로 천천히 내려가면서 이완시키면,\n자연스럽게 긴장이 빠져나가게 됩니다.\n\n집중하면서 모든 긴장이 풀어지는 상상을 합니다.\n모든 긴장이 녹아서 몸을 통해 땅으로 흘러 내려옵니다.\n지금 편안하고 이완되어 있다고 스스로 생각합니다.\n\n먼저 머리의 정수리에 집중합니다.(10초) 이마와 관자놀이에 집중합니다.(10초) 목과 어깨의 긴장에 집중합니다.(10초) 등과 척추에 집중합니다.(10초) 몸통의 앞쪽,\n가슴과 배에 집중합니다.(10초) 골반에 집중합니다.(10초) 다리와 발에 집중합니다.(10초)\n\n몸에 남아 있는 긴장이 있는지 머리에서 발끝까지 천천히 훑어봅니다.\n만약 긴장이 남아 있으면,\n그 곳에 다시 집중해봅니다.\n\n이제 모든 긴장이 다 빠져나왔다고 상상하고 그 편안한 이완의 경험을 즐깁니다.\n\n내 몸 전체가 편안하고 이완되어 있습니다.\n이제 다시 여러분의 몸을 인식하면서 부드럽게 눈을 뜹니다.","duration":"","tags":"늘봄8회기,8회기","series":"늘봄명상"},{"id":"98431df6","category":"자비희사","title":"쌀 한 톨 명상","body":"한 톨의 쌀과 대자연이 사람과 모든 생명체를 사랑하듯이,\n지금부터 명상을 하겠습니다.\n몸을 편하게 하시고,\n부드럽게 눈을 감습니다.\n몸의 긴장을 풀면서 가볍게 호흡합니다.\n가슴에 집중하십시오.\n마음을 가슴에 두고 가슴으로 호흡을 느껴보십시오.\n호흡이 가슴 한가운데로 들어오고 나가는 것을 느껴보십시오.\n\n우리(나를 포함한) 모두의 가슴에 사랑이 가득하기를 바랍니다.\n우리(나를 포함한) 모두의 가슴에 행복이 가득하기를 바랍니다.\n우리(나를 포함한) 모두의 가슴에 친절과 평화가 가득하기를 바랍니다.\n우리(나를 포함한) 모두의 마음이 열리길 바랍니다.\n\n쌀 한 톨을 먹기까지 얼마나 많은 사람과 대자연이 서로 의존하여 연결되어있는지 생각을 해보세오.\n그리고 왜 우리는 집착을 내려놓아야 하는지 살펴보겠습니다.\n\n먼저 편안히 앉아서 몸에서 힘을 빼고 잘 이완시켜줍니다.\n눈은 지그시 감습니다.\n일부러 호흡을 조정하지 말고 자연스럽게 숨을 쉽니다.\n숨이 들어오고 나가는데 주의를 집중합니다.\n이런 생각 저런 생각이 일어나더라도 그냥 내버려 두십시오.\n다시 호흡으로 돌아와 호흡에만 집중 하세요.\n(명상발우 땡-)\n\n식탁에 오른 쌀 한 톨에 담긴 많은 사람들의 수고를 생각해봅니다.\n아낌없이 주는 천지 대자연의 은혜를 상상해 보세요.\n쌀, 나,\n자연과 우주의 끝없이 이어진 상호 의존성을 생각해봅니다.\n\n(5분) (명상발우 땡-) 이제 천천히 눈을 뜹니다.\n이상으로 쌀한톨 명상을 마치겠습니다.","duration":"","tags":"늘봄8회기,8회기","series":"늘봄명상"},{"id":"2be9233a","category":"자비희사","title":"Last drop(마지막 차한잔)","body":"지금부터 ‘마지막 한잔’ 명상을 시작하겠습니다.\n\n스스로 자신을 돌이켜 이 차를 마지막 방울까지 마실 수 있는지 확인해보겠습니다.\n이 한잔이 차가 아니라 독이든 독배라고 생각합니다.\n이 한잔을 다 마시면 죽음에 이르게 된다고 생각합니다.\n일종의 내려놓음 자격시험이라고 할 수 있습니다.\n\n모두 눈을 감아주십시오.\n당신은 조명이 없는 칠흑같이 캄캄한 방에 앉아 있습니다.\n앞에는 독배 한 잔이 놓여 있습니다.\n이 한 잔은 여러분이 세상에 더 이상 미련이 없을 때 마실 수 있습니다.\n이 방안에는 당신을 방해하는 어떤 것도 존재하지 않습니다.\n그 누구도 그 무엇도 당신에게 영향을 미치지 않습니다.\n당신은 오직 당신 자신만을 바라볼 수 있습니다.\n\n먼저 솔직한 마음으로 돌이켜봅니다.\n당신을 괴롭히던 대상을 모두 용서하셨나요?\n그게 가족일 수도 있고,\n친구일 수도 있고,\n이웃일 수도 있고,\n동료일 수도 있습니다.\n모두 용서하셨나요?\n그 대상을 생각하면 더 이상 미움이 일어나지 않나요?\n\n이제 당신 때문에 괴롭던 사람들에게서 용서를 구했나요?\n당신이 원했던 원하지 않았던 당신으로 인해 괴롭던 사람들이 당신을 용서했을까요?\n더 이상 미안함이 일어나지 않나요?\n\n이제 마지막으로 당신 스스로에게 묻습니다.\n당신은 당신을 용서했나요?\n당신은 당신을 용서할 마음이 있나요?\n더 이상 당신을 미워하지 않나요?\n\n잠시 스스로 돌이켜보는 시간을 갖겠습니다.\n(3분)\n\n이제 눈을 뜨고 대상을 떠올리며 한 번 용서를 할때마다 한 모금씩 마십니다.\n한 사람,\n한 사람 떠올리면서 한 모금씩 마십니다.\n\n마지막 한 모금은 자신을 위해 남겨놓습니다.\n마지막 한 모금은 자신을 용서했을 때 마십니다.\n\n아직 용서가 되지 않으셨다면 다음에 이어지는 ‘용서하기’ 명상에서 다시한번 시도해보시기 바랍니다.\n\n이상으로 ‘마지막 차한잔’ 명상을 마치겠습니다.\n\n감사합니다.","duration":"","tags":"늘봄8회기,8회기","series":"늘봄명상"},{"id":"573b57d8","category":"자비희사","title":"용서하기","body":"(용서하기 동영상 본 후)\n(명상발우 땡~)\n\n이제 이 고요함 속에서 용서 명상을 시작합니다.\n\n온몸과 마음으로 호흡을 느끼면서 가슴을 열고 부드럽게 호흡하십시오.\n지금까지 당신이 행동이나 말 또는 생각으로 누군가에게 상처를 주었다면 그 사람에게 진심으로 용서를 청하십시오.\n\n차분한 목소리로 따라해주세요.\n\n“내가 당신에게 / 상처를 주었습니다.” “오늘 나는 당신에게 / 용서를 구합니다.” 3회\n\n이제 다른 사람에게 받았던 상처와 슬픔을 떠올려보십시오.\n다른 사람들의 생각과 말과 행동에서 알게 모르게 상처를 입었습니다.\n이제 자신이 용서할 수 있는 만큼 최대한 그들을 용서합니다.\n\n차분한 목소리로 따라해주세요.\n“나는 오늘 / 내게 상처를 주었던 / 당신을 용서합니다.” “당신을 용서합니다.” “당신을 용서합니다.”\n\n이제는 당신 자신을 살펴봅니다.\n우리는 자기 자신에게 심하게 행동했습니다.\n또한 우리는 자신의 고통과 두려움 때문에 미숙하게 행동합니다.\n자신을 용서하십시오.\n\n차분한 목소리로 따라해주세요.\n“힘든 삶에 치여왔던 / 나를 용서합니다.” “나를 용서합니다.” “나를 용서합니다.”\n\n(명상발우 땡~) 천천히 눈을 뜹니다.\n\n이제 용서가 되었나요?\n이상으로 용서명상을 마치겠습니다.","duration":"","tags":"늘봄8회기,8회기","series":"늘봄명상"},{"id":"14c530db","category":"자비희사","title":"텅 빈 충만 명상","body":"지금부터 ‘텅 빈 충만 명상‘을 시작하겠습니다. 편안하게 앉아서 허리를 펴고 몸을 이완합니다. 천천히 눈을 감습니다. (명상발우 땡-)\n\n텅빔이란 욕망을 비워내는 것이고 충만은 영성이 충만한 것입니다.\n\n욕망의 속성은 본질을 잃게 만들고 영성의 속성은 본체로 들어가게 합니다.\n\n욕망은 삶에서 길을 잃게 하지만 영성은 삶에서 길을 바로 보게 합니다.\n\n욕망은 진실을 가려 어둡게 하지만 영성은 스스로 진실을 나타냅니다.\n\n욕망이 비워지고 영성이 가득찬 마음은 본질적이고 고귀한 본연의 자신으로 돌아가게 합니다.\n\n이제 날숨으로 마음의 욕망을 내뱉고 들숨으로 자신의 영성을 키웁니다.\n\n자,\n이제부터 호흡을 통한 명상을 시작하겠습니다.\n주의력을 호흡에 두고 날숨을 내뱉습니다.\n이 때 날숨에 내 안에 있는 욕망의 찌꺼기들을 호흡에 실어 같이 내보낸다고 생각하면서 날숨을 내쉽니다.\n이렇게 날숨을 먼저 뱉는 것은 어떤 그릇도 비워져야 다시 다른 것으로 채울수 있기 때문입니다.\n내 안에 있는 마지막 찌꺼기를 비워낸다는 느낌으로 끝까지 숨을 내쉽니다.\n\n사실 이 영적인 에너지는 여러분의 마음 속에 살아있는 자신의 영적능력을 일깨우는 역할을 합니다.\n마음 속에 물들어 있던 욕망의 내뱉어 비워진 곳에 영성을 채워 더욱 비워지게 하는 것입니다.\n\n이제 들숨을 들이 쉽니다.\n세상에 존재하는 가장 고귀한 영적인 가치를 호흡에 담아 들이 마십니다.\n이것은 내안에 실재하는 정신적인 가치를 고양시킨다고 생각하면서 숨을 들어 마십니다.\n\n날숨에서 온몸에 퍼져있는 욕망의 잔재들을 내뱉듯이 들숨에서는 이러한 영적인 에너지들이 몸으로 들어온다고 상상하십시오.\n이렇게 머리에서 시작해서 목,\n오른팔, 오른손,\n다시 목에서 왼팔, 왼손,\n다시 목으로 돌아와 가슴,\n배, 허리, 엉덩이, 왼다리,\n왼발, 오른다리,\n오른발 순으로 채워 나갑니다.\n\n이렇게 자신의 호흡으로 온몸이 채워지도록 날숨과 들숨을 반복합니다.\n(5분후 명상발우 땡-)\n\n천천히 눈을 뜹니다.\n잘 되셨나요?\n이상으로 텅빈충만명상을 마치겠습니다.","duration":"","tags":"늘봄8회기,8회기","series":"늘봄명상"},{"id":"d8fbb336","category":"자비희사","title":"중도로서의 베풂","body":"지금부터 ‘중도로서의 베풂’의 명상을 시작하겠습니다.\n자세를 바르게 하고 부드럽게 감습니다.\n(명상발우 땡-)\n\n중도는 양극단의 중심에서 균형을 잡는 것이 아니라 양극단을 포함하는 포용의 자세입니다.\n\n우선,\n현재 자신이 가장 아끼는 물건을 하나 떠올려 보세요.\n그 물건을 주려는 의도에 저항을 느끼는 순간을 관찰한다면 나의 수행이 향상될 것입니다.\n저항의 본질을 느껴보세요.\n그것을 말로 표현해 보세요.\n아까움, 움츠림, 경직됨,\n두려움으로 그 저항을 경험하십니까?\n그 저항하는 마음을 조사해 보십시오.\n\n주는 행위는 우리가 서로 연결되는 출발점이라는 것을 기억하십시오.\n우리가 수행으로서 베품을 실천한다면 베품은 계속 성장할 것이며 더욱 강해질 것입니다.\n베품은 자애와 연민의 표현입니다.\n나누는 물건이 반드시 값어치가 있거나 멋진 것일 필요는 없습니다.\n오히려 중요한 것은 마음의 순수성,\n진지성 그리고 발원의 크기입니다.\n\n베품을 실천하면 타인 뿐만 아니라 자신도 소중한 존재가 됩니다.\n자신과 타인의 경계가 없어지는 것이 중도입니다.\n자기 자신이 가치가 없다고 확신한 채로,\n단지 다른 사람에게 주기만하는 행동은 잠재력을 발휘하지 못합니다.\n베품은 다른 사람들과의 관계를 맺는 훌륭한 방식입니다.\n베품은 나와 다른 사람을 자유롭게 합니다.\n베품은 자유를 위한 필수적 태도입니다.\n베품의 실천은 우리를 목적지인 행복역까지 태워주는 수레와 같습니다.\n\n평정을 실천할 때,\n베품의 실천이 균형을 유지합니다.\n그래서 우리의 마음은 열리고,\n베풀 수 있습니다.\n동시에 현재의 한계를 분명히 자각하게 됩니다.\n그렇게 할 때 베품은 강력해지고,\n중도에 더 가까워집니다.\n베품은 중도의 행동 가운데 가장 우선합니다.\n\n모든 분들이 보상을 바라지 않는 베품의 실천으로 행복을 이루시길 바랍니다.\n\n이상으로 ‘중도로서의 베풂’ 명상을 마치겠습니다.\n천천히 눈을 뜨십시오.","duration":"","tags":"늘봄8회기,8회기","series":"늘봄명상"},{"id":"38670d3c","category":"자비희사","title":"라온 누리에서 행복 선포식","body":"마지막 프로그램 행복선포식을 시작하겠습니다.\n\n(5명씩 조편성하기) 조별로 한 분씩 의자에 올라가서 함께 노래하겠습니다.\n\n“나는 행복합니다.” ”나는 행복합니다.” “나는 정말 정말 행복합니다.”\n\n“너는 행복합니다.” ”너는 행복합니다.” “너는 정말 정말 행복합니다.”\n\n“우리는 행복합니다.” ”우리는 행복합니다.” “우리는 정말 정말 행복합니다.”\n\n모두 박수치면서 합창으로 노래해보겠습니다.\n\n“나는 행복합니다.” ”나는 행복합니다.” “나는 정말 정말 행복합니다.”(점점 빠르게 5번만)\n\n이상으로 행복선포식을 마치겠습니다.\n\n·모두 자리에 앉아 주십시오.\n·지금부터 프로그램 참가 소회,\n그리고 앞서 명상에서 다뤘던 앞으로의 내 삶의 방향에 대해 자조하는 시간을 갖겠습니다.\n지난 회기와 마찬가지로,\n가장 먼저 본인의 이름을 밝힌 후,\n명상을 통해 알게 된 바를 간략하게 표현하시면 됩니다.\n너무 자세할 필요 없이 그저 담담하게 이야기해주시면 됩니다.\n각자 최대 5분의 시간을 활용하실 수 있습니다.\n·경청하는 참여자분들은 이야기가 끝나면 “oo님, 이야기 감사합니다.”라고 대답해주시면 됩니다.\n·그럼 제 왼쪽부터 시작하도록 하겠습니다.\n(50분 간 참여자들의 자조의 시간) ·각자의 느낀 바를 나눠주셔서 감사합니다.\n·지금부터는 설문지를 작성하겠습니다.\n총 30분의 시간을 드리겠습니다.","duration":"","tags":"늘봄8회기,8회기","series":"늘봄명상"},{"id":"376d495b","category":"수용","title":"민들레","body":"당신은 지금까지 살아오면서 자신을 제대로 바라본 적이 있었나요?\n\n나는 어떤 사림일까요?\n나는 내 자신을 어떤 사람이라고 생각하고 있나요?\n그리고 다른 사람들에게 나는 어떤 사람으로 보여지고 불리워지고 있나요?\n자신의 이미지를 떠올려봅니다.\n\n지금까지 내가 불리워졌던 수많은 이름과 역할,\n그리고 평가들을 생각해봅니다.\n집에서 엄마, 아빠, 자식,\n형제,\n자매의 역할로 학교에서 선생님,\n학생, 친구, 선배,\n후배의 역할로 직장에서 상사,\n부하직원, 동료의 역할로…\n\n이 모든 이름과 역할 속에 나는 다양한 모습으로 살고있었습니다.\n그 모습으로 살아가는 동안,\n정작 나는 내자신을 돌아볼 시간이 없었습니다.\n\n양손을 부드럽게 가슴에 얹습니다.\n내 안에서 들려오는 마음의 소리,\n가슴의 느낌을 그대로 느껴봅니다.\n고요하면 고요한 대로,\n답답하면 답답한 대로,\n기쁘면 기쁜 대로,\n슬프면 슬픈 대로 그 느낌이 무엇이든지 있는 그대로 느껴봅니다.\n\n지금까지 살아오면서 나와 가장 오래 함께했던 마음의 소리,\n지금 올라오는 감정을 그대로 느껴봅니다.\n나의 감정을 좋아하고 싫어함이 없이,\n있는 그대로 마주합니다.\n\n생각이 떠오르면 그 생각도 있는 그대로 바라봅니다.\n지금까지 나를 위해 애써왔던 생각들을 있는 그대로 바라봅니다.\n\n더 나은 존재가 되기 위해 애쓰는 나,\n상처와 절망 속에서 울고 있는 나,\n미래에 대한 두려움에 떨고 있는 나,\n\n그동안 내가 싫어했던 나의 모습,\n평생 기억하고 싶지 않았던 지나간 경험,\n미래에 대한 끊임없는 걱정도 떠오르는 대로 바라봅니다.\n\n되돌아본 몸과 마음의 느낌에 아기를 돌보는 엄마처럼,\n사랑하는 친구처럼 따뜻하고 다정하게 속삭여줍니다.\n\n그동안 몰라봐서 미안해.\n함께 해주어서 고마워.\n내가 늘 너를 사랑해.\n돌봐주지 못한 나를 용서해.\n\n가슴의 괴로움과 아픔이 사라질 때까지,\n환한 햇살과 봄바람의 따스함처럼 가슴에 온전히 집중하여 속삭여줍니다.\n미안해, 고마워, 사랑해,\n용서해…\n\n마음이 사랑과 평화로 가득 찰 때까지 나에게 그렇게 속삭여줍니다.\n미안해, 고마워, 사랑해,\n용서해…","duration":"10","tags":"민들레,제주의사","series":"숨비명상"},{"id":"3287229a","category":"수용","title":"나는 꽃","body":"우리는 살아가면서 자신에게 만족하지 못하고 부족함을 느낄 때가 많습니다.\n세상이 나에게만 상처를 주고 있다고 생각합니다.\n\n하지만 실제로는 세상이 나에게 상처를 주는 것이 아니라,\n내가 '상처'라고 생각하면서 세상을 잘못 받아들이고 있는 것입니다.\n\n다른 사람들에게 인정받고 완벽한 사람이 되기 위해 더 많은 노력하고 더 열심히 살아갑니다.\n\n나를 가치 있게 하는 다양한 모습을 설정합니다.\n좋은 부모,\n능력 있는 직장인,\n타인을 돕는 사람,\n훌륭한 인격자 등\n\n\n성공한 사람,\n착하고 성실한 사람,\n훌륭한 직장인,\n남을 돕는 사람… 주변에서 요구하는 이러한 완벽한 사람이 되기 위해 정작 나를 바라보지 못하하고 나를 잃어버린 채 살아갑니다.\n\n하지만 완벽한 사람은 언제나 너무 멀게 느껴집니다.\n끝없이 밀려오는 파도와 같아서 아무리 애를써도 닿을 수 없습니다.\n겨우 한 파도를 넘었다 싶으면 더욱 거센 파도가 기다리고 있습니다.\n\n완벽한 사람이란 어쩌면 나의 행복과는 거리가 먼,\n사막의 신기루처럼 우리 모두가 만들어낸 허상일지도 모릅니다.\n\n갓난아이가 처음 걸음마를 배울 때 수 없이 넘어지고 다시 일어서기를 반복합니다.\n우리도 살아가면서 넘어지기도 하고 좌절할 때도 있습니다.\n중요한 것은 포기하지 않고 다시 일어나 자신만의 속도로 앞으로 나아가는 것입니다.\n\n우리는 모두 자신만의 속도와 방식으로 성장합니다.\n세상에 똑같은 꽃잎은 없듯이,\n저마다 고유한 색깔과 향기를 지닌 소중한 존재입니다.\n\n세상의 모든 시선을 잠시 내려놓고,\n온전히 나를 바라보세요.\n나는  있는 그대로 충분히 가치 있는 존재입니다.\n나는 정말 소중한 존재입니다.\n\n남과 비교하며 스스로를 괴롭힐 필요는 없습니다.\n나를 있는 그대로 사랑하고 존중하는 것,\n그것이야말로 온전한 나를 찾아가는 시작입니다.\n\n행복은 내가 만들어가는 것입니다.\n행복은 과거나 미래가 아닌,\n바로 지금 이 곳에 있습니다.\n내 삶의 주인공은 바로 나입니다.\n나는 이미 충분히 잘하고 있습니다.\n\n작은 씨앗 하나로도 세상 어디든 뿌리내리는 민들레처럼,\n나또한 어디든지 뿌리 내릴수 있는 세상에서 가장 아름다운 꽃입니다.\n\n\n나는 꽃\n\n허리를 바르게 세웁니다.\n부드럽게 눈을 감습니다.\n천천히 숨을 들이쉬고 편안하게 내쉽니다.\n몸과 마음을 편안하게 합니다.\n\n우리는 살아가면서 스스로 만족하지 못하고 부족함을 느낄 때가 많습니다.\n다른 사람들에게 인정받고 완벽한 사람이 되기 위해 더 많은 노력을 기울이고 더 열심히 살아갑니다.\n\n성공한 사람,\n착하고 성실한 사람,\n훌륭한 직장인,\n남을 돕는 사람… 이렇게 사회가 만들어 놓은 기준에 자신을 채찍질하며 정작 '나'를 잃어버린 채 살아갑니다.\n\n하지만 내가 세운 기준이나,\n세상이 요구하는 기준은 언제나 너무 멀게 느껴집니다.\n끝없이 밀려오는 파도와 같아서 아무리 애를써도 닿을 수 없습니다.\n겨우 한 파도를 넘었다 싶으면 더욱 거센 파도가 우리 앞에 기다리고 있습니다.\n\n어쩌면 우리가 생각하는 성공이란 우리의 행복과는 거리가 먼,\n사회가 만들어낸 허상일지도 모릅니다.\n\n인생은 마라톤과 같습니다.\n빠르게 달리는 것도 좋지만,\n정말 중요한 것은 꾸준히 나아가는 것입니다.\n때로는 넘어지고 좌절할 때도 있습니다.\n하지만 포기하지 않고 다시 일어나 자신만의 속도로 한 걸음씩 앞으로 나아가는 것이 중요합니다.\n\n자전거를 처음 배울 때 넘어지고 다시 일어서기를 반복하듯,\n인생에서도 수많은 시행착오를 겪게 됩니다.\n중요한 것은 넘어졌을 때 다시 일어설 수 있는 용기입니다.\n\n우리는 모두 각자의 속도와 방식으로 성장합니다.\n남과 비교하며 스스로를 괴롭힐 필요는 없습니다.\n자신만의 길을 찾아 나아가는 것,\n그것이 진정한 성공입니다.\n\n세상에 똑같은 꽃잎이 없듯이,\n우리 모두는 저마다 고유한 색깔과 향기를 지닌 소중한 존재입니다.\n있는 그대로의 자신을 사랑하고 존중하는 것,\n그것이야말로 진정한 행복의 시작입니다.\n\n세상의 모든 시선을 잠시 내려놓고,\n온전히 자신을 바라보세요.\n당신은 정말 소중한 존재입니다.\n\n당신은  있는 그대로 이미 충분히 가치 있는 존재입니다.\n지금도 충분히 잘하고 있습니다.\n스스로를 사랑하고 존중하는 것,\n그것이 진정한 행복의 시작입니다.\n\n행복은 미래가 아닌,\n바로 지금 이 순간에 있습니다.\n내 삶의 주인공은 바로 나입니다,\n행복은 내가 만들어가는 것입니다.\n\n작은 씨앗 하나로도 세상 어디든 뿌리내리는 민들레처럼,\n나도 어디든지 뿌리 내릴수 있는 세상에서 가장 아름다운 꽃입니다.\n\n나는 꽃\n\n편안한 자세로 앉습니다.\n부드럽게 눈을 감습니다.\n천천히 숨을 들이마시고,\n편안하게 내쉽니다.\n한 번 더 천천히 숨을 들이마시고,\n편안하게 내쉽니다.\n내쉬는 숨에 몸의 긴장을 함께 흘려보냅니다.\n\n우리는 살아가면서 스스로 만족하지 못하고 부족하다고 느낄 때가 많습니다.\n그래서 다른 사람들이 좋아하는 완벽한 사람이 되기 위해 더 많이 노력하고,\n더 열심히 일합니다.\n\n완벽한 부모, 훌륭한 직원,\n남을 돕는 사람… 이런 사람이 되기 위해 스스로를 채찍질하며 자신을 돌보지 않고 더 나은 모습을 만들기 위해 노력합니다.\n\n하지만 내가 세운 기준이나,\n세상이 요구하는 기준은 언제나 너무 멀게 느껴집니다.\n노력해서 간신히 다가가도 또 다른 기준이 생겨납니다.\n\n마치 사막에서 물을 찾다가 물이라고 믿었던 것이 모래였다는 것을 깨닫는 것과 같습니다.\n어쩌면 우리가 생각했던 기준은 실제로는 존재하지 않습니다.\n사막의 신기루일 뿐입니다.\n\n실수해도 괜찮습니다.\n실패하고 아파해도 괜찮습니다.\n힘든 일이 있어도 용기를 내어 헤쳐 나가면 그뿐입니다.\n\n실패하거나 힘든 일이 생겨도 당당하게 극복하면 됩 니다.\n우리의 경험과 감정을 있는 그대로 받아들이는 것만으로도 충분합니다.\n\n우리는 각자 다른 모습과 색깔로 세상을 살아가는 존재입니다.\n우리는 지금 이 순간 있는 그대로 완전한 존재입니다.\n\n자신을 비난하지 말고,\n스스로에게 부드럽고 따뜻하게 대해주세요.\n자신을 용서하세요.\n완벽해지려고 애쓸 필요 없습니다.\n완벽은 허상일 뿐이며,\n우리를 힘들게 합 니다.\n\n완전한 나를 만들고 밝고 행복하게 살 수 있는 시간은 바로 지금입니다.\n\n민들레가 어디에 있든 민들레인 것처럼 나도 언제 어디서든 나입니다.\n나는 항상 완전하고 아름다운 꽃입니다.\n\n손끝과 발끝을 부드럽게 움직이며 몸을 깨웁니다.\n마음의 준비가 되었을 때,\n천천히 눈을 떠주세요.\n\n나는 나\n\n우리는 종종 세상이 우리에게만 상처를 준다고 생각합니다.\n하지만 실제로는 세상이 우리에게 상처를 주는 것이 아니라,\n우리가 그것을 '상처'라고 받아들이면서 세상을 잘못 이해하고 있는 것입니다.\n\n현재의 나 자신이 충분하지 않다고 느끼며,\n더 나은 사람이 되기 위해 노력합니다.\n때로는 스스로를 방치하거나 세상과 맞서 싸우며 거칠게 살아가기도 하고,\n'더 나은 사람'이 되려고 애쓰기도 합니다.\n\n이러한 노력은 '지금의 나는 부족하다',\n'뭔가 잘못되고 있다',\n'이대로는 안 된다'는 생각 때문입니다.\n우리는 자신을 가치 있게 만들기 위해 다양한 모습을 설정합니다.\n좋은 부모,\n능력 있는 직장인,\n남을 돕는 사람,\n훌륭한 인격자 등 여러 가지 모습일 수 있습니다.\n\n그러면서 사회의 기준에 맞추고 남을 기쁘게 하면서 만족을 얻으려고 합니다.\n자신을 조금 더 완벽하게 만들기 위해 공부하고,\n강연을 듣고,\n열심히 일하며 쉬지 않고 노력합니다.\n하지만 이러한 노력으로는 절대로 충족되지 않습니다.\n내가 세운 기준이나 세상이 부과하는 기준은 언제나 현재의 나와 너무 멀리 떨어져 있습니다.\n\n그 기준에 도달했다고 해도,\n그 뒤에는 또 다른 기준이 등장합니다.\n마치 신기루와 같습니다.\n그래서 일, 사랑,\n인간관계 등 모든 면에서 '불완전한 존재'라는 생각이 들고 자연스럽게 상처를 남깁니다.\n\n하지만 우리가 지금 이 순간 있는 그대로 완전한 존재라고 인식한다면,\n상처받지 않기 위해 필사적으로 노력하는 대신,\n상처, 실패, 좌절,\n절망과 같은 부정적 경험에 당당히 맞설 수 있게 됩니다.\n실패하고 상처받고 아파하면서도 당당하게 세상을 살아갈 수 있습니다.\n\n자신이 완전한 존재임을 느끼는 순간 우리는 더 이상 두려워하지 않고 자유롭게 살아갈 수 있으며,\n마음껏 사랑할 수도 있습니다.\n자신을 돌본다는 것,\n그것은 이 세상에 와서 해야 할 우리의 유일한 일일지도 모릅니다.\n그 일이야말로 진정으로 중요한 일입니다.\n\n자신을 받아들이기 위해서는 자신에 대한 비난을 멈추고 스스로에게 자비와 연민을 보낼 수 있어야 합니다.\n\n자신을 용서하세요.\n지금이 온전해질 수 있는 유일한 순간입니다.\n자신이 진정한 빛 속에서 살 수 있는 유일한 순간은 바로 지금입니다.\n완벽을 찾다보면 그 어떤 것도 이룰수 없습니다.\n오직 고통만을 가져올 뿐입니다.\n눈을  뜨고 세상을 똑바로 보세요.\n허상을 쫓아 시간을 낭비하지 마세요.\n오늘이 바로 당신이 깨어나는 날입니다.\n\n민들레가 언제 어디서든 민들레인 것처럼 나도 언제 어디서든 나입니다.\n언제나 완전하고 자유로운 존재입니다.","duration":"10","tags":"민들레,나는나","series":"숨비명상"},{"id":"1ebf1bf0","category":"자비희사","title":"용서명상","body":"우리는 살아가면서 잘못도 하고,\n실수도 합니다.\n자신을 용서하지 못하면 후회가 남고,\n후회는 자신에 대한 또 다른 학대가 됩니다.\n타인을 용서하지 못하면 미움이 됩니다.\n\n지금부터 용서가 쉽지 않았던 타인을 용서하는 명상을 같이해보겠습니다.\n자세를 바르게 하고 천천히 눈을 감습니다.\n숨을 부드럽게 들이쉬고 내쉽니다.\n\n이제 우리가 살아오면서 만났던 사람 중에 쉽게 용서가 안 되는 사람이 있는지 떠올려 봅니다.\n그리고 그 사람이 어떤 행동과 말로 상처를 주었는지 떠올려 봅니다.\n\n혹시 지난날의 상처가 떠올라 몸이 긴장되고 마음에 불편함이 있다면 그 감각과 느낌들을 충분히 받아들입니다.\n\n손을 가슴 위에 가만히 올려놓고 손바닥에서 느껴지는 따뜻함에 주의를 두고 상처받았던 상황들을 관찰자가 되어 바라봐도 좋습니다.\n\n자 다시 한번 더 자신이 도저히 용서할 수 없었던 그 사람의 얼굴을 떠올려 봅니다.\n미운 마음이나 회피하고 싶은 마음의 저항감을 모두 내려놓고 아무런 반응없이 그저 담담히 그 사람을 떠 올려봅니다.\n\n그 사람을 향한 미운 감정에서 한 걸음 떨어져서 바라봅니다.\n마치 저 앞에 서 있는 한 그루의 나무를 바라보듯이 그 사람을 바라볼 수 있는지 살펴봅니다.\n그리고 깊이 숨을 들이쉬고 내쉬면서 충분히 호흡에 머물러 봅니다.\n\n이제 용서가 쉽지 않았던 그사람에게 마음속으로 이렇게 말해봅니다.\n\n‘나 또한 다른 사람에게 상처를 준 일이 있습니다. 당신이 나에게 상처를 주었지만 이제 나는 당신을 용서합니다.’ ‘나에게 깊은 상처를 준 당신을 용서합니다. 나는 할 수 있는 만큼 당신을 용서합니다.’\n\n용서하기 쉽지 않았던 그 사람에게 용서의 메시지를 천천히 원하는 만큼 반복합니다.\n\n용서의 메시지를 보내는 동안 문득문득 미운 마음이 일어나고 불편한 감정이 일어나면 충분히 그 마음을 받아들입니다.\n\n그런 다음 다시 크게 숨을 들이쉬고 내쉬며 다시 천천히 그 사람을 향해 용서의 메시지를 보내봅니다.\n\n원하는 만큼 반복한 후 준비가 되었다면 천천히 눈을 뜹니다.\n\n남들이 뒤에서 나를 헐뜯는 말은 독이 묻은 화살과 같습니다.\n다행히 뒤에 숨어서 하는 말은 힘이 없어서 그 화살이 내 가슴을 뚫지는 못합니다.\n그런데 가장 어리석은 행동은 땅에 떨어진 그 화살을 주워서 내가 내 가슴을 찌르는 것입니다.\n맞지 않아도 되는 화살을 맞고 받지 않아도 되는 상처를 받고 미워하지 않아도 되는 사람을 미워하는 것입니다.\n\n2001년 미국에서 911테러가 일어났습니다.\n생사의 길목에서 마지막으로 보내온 1600통의 통화내용과 메시지를 분석해보니 사랑한다 거의 대부분이었고,\n그 다음이 미안였다고 합니다.\n우리 인생은 사랑만 하고 살기에도 너무 짧은것 같습니다.\n용서나 미움이라는 것은 우리가 만든 허상이 아닐까 생각해봅니다.","duration":"","tags":"용서,911","series":"숨비명상"},{"id":"9200398b","category":"자비희사","title":"용서명상(10’)","body":"편안하게 자리를 잡고 눈을 부드럽게 감고 호흡을 바라보십시오.\n부드러운 산들바람이 불듯 숨이 들어오고 나가는 느낌을 바라봅니다.\n\n강물 위에 고요히 부는 산들바람처럼 그렇게 호흡이 온몸을 지나갑니다.\n호흡을 조절하지 말고 자연스럽고 편안하게 숨을 쉽니다.\n숨이 들어오고 나갈 때 생겨나는 아주 작은 움직임까지도 집중하고 느껴봅니다.\n​ 이제 이 고요함 속에서 용서 명상을 하려고 합니다.\n용서 명상은 시간이 흐를수록 그 가치가 더욱 드러나는 명상입니다.\n​온몸과 마음으로 호흡을 느끼면서 가슴을 열고 부드럽게 호흡하십시오.\n\n생각이나 말 또는 행동으로 일부러 혹은 모르고 누군가에게 상처를 주었다면 용서를 청하십시오.\n우리는 자신의 고통과 두려움 때문에 미숙하게 행동합니다.\n자신의 고통과 두려움 때문에 혼란스러워진 우리는 타인에게 상처를 줍니다.\n자신을 용서하십시오.\n​ 이제 다른 사람에게 받았던 상처와 슬픔을 떠올려보십시오.\n우리는 돌처럼 굳은 마음과 분노로 상처와 슬픔을 대하며 냉담해졌습니다.\n다른 사람들의 생각과 말과 행동에서 알게 모르게 상처를 입었습니다.\n​ 두려움과 고통과 혼란에 빠진 그들에게서 상처를 받았습니다.\n이제 자신이 용서할 수 있는 만큼 최대한 그들을 용서합니다.\n\n이제는 당신 자신을 살펴봅시다.\n우리는 자기 자신에게 심하게 행동했습니다.\n용서는 가슴의 벽을 허물고 자신을 가슴으로 끌어안는 것입니다.\n우리의 몸과 마음은 두려움과 고통,\n무지, 태만,\n거짓으로 인해 소중한 자신을 돌보지 않았습니다.\n자신을 용서하십시오.\n​ 용서를 구하는 장면을 떠올려보십시오.\n​마음을 최대한 부드럽게 하십시오.\n​당신은 용서받을 자격이 있습니다.\n용서만이 당신의 마음을 열수 있습니다.\n​ 상처입고 분노했던 장소와 사건을 떠올려보십시오.\n다정한 손길로 어루만지면서 용서하십시오.\n분노를 떠나보낼 때가 되었습니다.\n​ 바로 지금,\n우리 자신과 주변의 사람들,\n온 세상이 용서와 자비와 마음에서 우러난 사랑을 바라고 있습니다.\n​ 용서하고 사랑하십시오.\n\n----\n용서의 명상\n- 처음 만나는 명상레슨\n\n편안하게 자리를 잡고 눈을 부드럽게 감고 호흡을 바라보십시오.\n부드러운 산들바람이 불듯 숨이 들어오고 나가는 느낌을 바라봅니다.\n강물 위에 고요히 부는 산들바람처럼 그렇게 호흡이 온몸을 지나갑니다.\n호흡을 조절하지 말고 자연스럽고 편안하게 숨을 쉽니다.\n숨이 들어오고 나갈 때 생겨나는 아주 작은 움직임까지도 집중하고 느껴봅니다.\n\n이제 이 고요함 속에서 용서 명상을 하려고 합니다.\n용서 명상은 당신에게 도움이 될 수도 있고 그렇지 않을 수도 있습니다.\n그러나 시간이 흐를수록 그 가치가 더욱 드러나는 명상입니다.\n\n온몸과 마음으로 호흡을 느끼면서 가슴을 열고 부드럽게 호흡하십시오.\n생각이나 말 또는 행동으로 일부러 혹은 모르고 누군가에게 상처를 주었다면 용서를 청하십시오.\n우리는 자신의 고통과 두려움 때문에 미숙하게 행동합니다.\n자신의 고통과 두려움 때문에 혼란스러워진 우리는 타인에게 상처를 줍니다.\n자신을 용서하십시오.\n\n이제는 당신 자신을 살펴봅시다.\n우리는 자기 자신에게 심하게 행동했습니다.\n용서는 가슴의 벽을 허물고 자신을 가슴으로 끌어안는 것입니다.\n우리의 몸과 마음은 두려움과 고통,\n무지, 태만,\n거짓으로 인해 소중한 자신을 돌보지 않았습니다.\n자신을 용서하십시오.\n\n용서를 구하는 장면을 떠올려보십시오.\n\n마음을 최대한 부드럽게 하십시오.\n\n당신은 용서받을 자격이 있습니다.\n용서만이 당신의 마음을 열수 있습니다.\n\n이제 다른 사람에게 받았던 상처와 슬픔을 떠올려보십시오.\n우리는 돌처럼 굳은 마음과 분노로 상처와 슬픔을 대하며 냉담해졌습니다.\n다른 사람들의 생각과 말과 행동에서 알게 모르게 상처를 입었습니다.\n\n두려움과 고통과 혼란에 빠진 그들에게서 상처를 받았습니다.\n이제 자신이 용서할 수 있는 만큼 최대한 그들을 용서합니다.\n\n상처입고 분노했던 장소와 사건을 떠올려보십시오.\n다정한 손길로 어루만지면서 용서하십시오.\n분노를 떠나보낼 때가 되었습니다.\n\n바로 지금,\n우리 자신과 주변의 사람들,\n온 세상이 용서와 자비와 마음에서 우러난 사랑을 바라고 있습니다.\n\n용서하고 사랑하십시오.","duration":"","tags":"용서,해인사","series":"숨비명상"},{"id":"7e1c2a31","category":"자비희사","title":"용서명상 (타라브렉)","body":"1. 용서 구하기\n\n편안하게 앉아서 부드럽게 눈을 감습니다.\n잠시 호흡에 주의를 기울이면서 숨을 들이쉬고 내쉬면서 긴장을 풀어봅니다..\n\n당신이 다른 사람에게 상처를 준 상황을 떠올려 보세요.\n모욕적인 말을 하거나 화를 내며 전화를 끊어 의도적으로 누군가에게 상처를 주었을 수도 있습니다.\n\n혹은 사랑하는 사람에게 이별을 통보했거나 자신의 생각에 사로잡혀 아이를 제대로 돌보지 못해 자신도 모르게 마음이 아프게 되었을 수도 있습니다.\n\n어쩌면 그것은 수년간 반복적으로 누군가에게 해를 끼친 불 같은 기질이나 부주의일 수도 있습니다.\n누군가에게 상처를 주었던 상황을 잠시 떠올려보고,\n그 사람이 느꼈을 상처와 실망,\n배신감을 느껴보세요.\n\n이제 그 사람을 생각하며 용서를 구해봅니다.\n마음 속으로 그 사람의 이름을 부르며\n\n\"당신이 느꼈던 상처를 이해합니다. 이제 용서를 구합니다. 용서해주세요.\"\n\n몇 번이고 진심으로 용서를 구합니다.\n그런 다음 잠시 동안 침묵하고 용서받는 데 마음을 여십시오.\n\n2. 타인 용서하기\n\n우리 각자가 다른 사람에게 상처를 준 것과 마찬가지로 우리 역시 인간관계에서 상처를 받았습니다.\n\n당신이 크게 실망하고,\n거부당하고, 학대당하고,\n배신당했던 경험을 떠올려 보십시오.\n\n자신을 판단하지 마십시오.\n하지만 당신에게 상처를 준 사람에 대해 여전히 분노와 억울함을 느끼는지 알아차리게 됩니다.\n이 사람을 마음에서 지웠나요?\n\n당신이 어떻게 상처받았는지 가장 잘 기억하는 구체적인 상황을 자세히 기억해 보세요.\n\n부모님의 분노한 표정,\n친구의 거친 말,\n믿었던 사람이 자신을 속였다는 사실을 알게 된 순간,\n집에서 뛰쳐나온 배우자 등이 떠오를 것입니다.\n\n잠에서 깨어난 느낌,\n즉 슬픔이나 수치심,\n분노나 두려움을 느껴보세요.\n온화하게 받아들이는 태도로 몸과 가슴,\n마음으로 표현되는 고통을 느껴보세요.\n\n이제 그 사람과 그가 나에게 가한 두려움,\n상처,\n빈곤의 느낌을 더 자세히 살펴봅니다.\n이 존재를 약하고 불완전한 실제 인물로서 경험해보세요.\n\n그의 존재를 느낀 그는 마음속으로 그의 이름을 속삭이며 용서의 메시지를 보낸다.\n\n\"당신이 나에게 준 고통을 느끼면서 지금 최대한 당신을 용서합니다.\"\n\n지금 이 순간 용서할 수 없다면 이렇게 해도 됩니다.\n\"당신이 나에게 준 고통을 느끼면서 당신을 용서하고 싶다는 생각이 듭니다.\" 계속해서 자신의 나약함을 느끼며 원하는 만큼 용서의 메시지를 반복해서 그 사람에게 보냅니다.\n\n일상생활에서 형태에 관계없이 용서를 실천할 수 있습니다.\n당신이 자신이나 다른 사람을 가혹하게 비판하고 있다는 것을 깨닫게 되면,\n비판하는 생각과 감정을 멈추고 알아차릴 수 있습니다.\n\n당신을 비판하게 만드는 욕망이나 두려움을 잠시 들여다보세요.\n그러면 당신은 가장 자연스러운 용서의 메시지를 내면의 삶이나 다른 사람들의 삶에 전파하기 시작합니다.\n\n인내심을 갖고 꾸준히 실천한다면,\n온전히 사랑하려는 의도가 용서로 피어날 것입니다.\n\n3. 자신 용서\n\n이제 자신이 용서할 수 없는 자신의 어떤 면을 생각합니다.\n\n비판적이고 통제적이거나 다른 사람에게 상처를 준 자신을 용서하지 못할 수도 있습니다.\n\n자신이 비겁하다고 생각하거나 인생을 더 풍요롭게 만들어 줄 수 있는 도전을 받아들이지 않았기 때문에 자신을 미워할 수도 있습니다.\n\n중독적인 행동으로 인생을 망친 자신을 용서하지 못할 수도 있습니다.\n정신적 집착이나 질투로 인해 혐오감을 느낄 수도 있습니다.\n\n용서할 수 없는 행동, 감정,\n사고 방식에 대해 무엇이 당신을 그렇게 나쁘게 만드는지 의식하십시오.\n그 때문에 당신은 당신에 대해 어떻게 생각합니까?\n그것이 어떻게 당신이 행복해지는 것을 방해합니까?\n당신은 자신의 중독성,\n불안함,\n비판적인 면을 밀어내고 싶게 만드는 고통을 느낍니다.\n\n이제 바람직하지 않은 부분에 힘을 실어주는 것이 무엇인지 자세히 살펴보겠습니다.\n당신이 음식, 니코틴,\n알코올에 중독되어 있다면,\n당신은 어떤 욕구를 충족시키려고 노력하고 있으며 어떤 두려움을 진정시키려고 노력하고 있습니까?\n\n다른 사람을 비판할 때 자신이 두렵습니까?\n만약 당신이 다른 사람에게 상처를 줬다면 그것은 당신이 상처받고 불안정했기 때문이었을까?\n강력하거나 안전하다고 느끼려는 욕구에서 그렇게 하였습니까?\n\n근본적인 욕망과 두려움을 의식할 때,\n그것을 몸과 가슴,\n마음으로 직접 느껴보세요.\n\n당신이 거부하고 있는 감정,\n생각,\n행동에 대해 진심 어린 용서의 메시지를 보내십시오.\n이 말을 마음속으로 속삭여 보세요.\n\n\"나는 내가 어떻게 나에게 괴로움을 안겨주었는지 알고 있습니다. 나는 이제 나 자신을 용서합니다.\" 또는 \"용서, 용서\".\n\n두려움, 판단, 수치심,\n슬픔 등 무엇이 떠오르든 우리는 그것을 용서의 메시지로 대합니다.\n열린 용서의 마음으로 상처를 풀어주세요.\n\n이렇게 하면 자신이 가장하고 있는 것처럼 느껴질 수도 있고 실제로는 자신을 용서할 수 없다고 느낄 수도 있습니다.\n당신은 용서받을 자격이 없다고 믿을 수도 있습니다.\n\n자신을 용서하면 같은 일을 다시 하는 것이 두려울 수도 있습니다.\n아마도 당신이 정말로 마음을 열고 자신을 용서한다면,\n당신은 자신에 대한 참을 수 없는 진실을 직면하게 될까 두려울 것입니다.\n그러한 의심과 두려움이 생기면 자비롭게 인정하고 받아들이십시오.\n\n# 용서명상 1\n\n우리는 살아가면서 잘못도 하고,\n실수도 합니다.\n자신을 용서하지 못하면 후회가 남고,\n후회는 자신에 대한 또 다른 학대가 됩니다.\n타인을 용서하지 못하면 미움이 됩니다.\n\n지금부터 용서가 쉽지 않았던 타인을 용서하는 명상을 같이해보겠습니다.\n자세를 바르게 하고 천천히 눈을 감습니다.\n숨을 부드럽게 들이쉬고 내쉽니다.\n\n이제 우리가 살아오면서 만났던 사람 중에 쉽게 용서가 안 되는 사람이 있는지 떠올려 봅니다.\n그리고 그 사람이 어떤 행동과 말로 상처를 주었는지 떠올려 봅니다.\n\n혹시 지난날의 상처가 떠올라 몸이 긴장되고 마음에 불편함이 있다면 그 감각과 느낌들을 충분히 받아들입니다.\n\n손을 가슴 위에 가만히 올려놓고 손바닥에서 느껴지는 따뜻함에 주의를 두고 상처받았던 상황들을 관찰자가 되어 바라봐도 좋습니다.\n\n자 다시 한번 더 자신이 도저히 용서할 수 없었던 그 사람의 얼굴을 떠올려 봅니다.\n미운 마음이나 회피하고 싶은 마음의 저항감을 모두 내려놓고 아무런 반응없이 그저 담담히 그 사람을 떠 올려봅니다.\n\n그 사람을 향한 미운 감정에서 한 걸음 떨어져서 바라봅니다.\n마치 저 앞에 서 있는 한 그루의 나무를 바라보듯이 그 사람을 바라볼 수 있는지 살펴봅니다.\n그리고 깊이 숨을 들이쉬고 내쉬면서 충분히 호흡에 머물러 봅니다.\n\n이제 용서가 쉽지 않았던 그사람에게 마음속으로 이렇게 말해봅니다.\n\n‘나 또한 다른 사람에게 상처를 준 일이 있습니다. 당신이 나에게 상처를 주었지만 이제 나는 당신을 용서합니다.’ ‘나에게 깊은 상처를 준 당신을 용서합니다. 나는 할 수 있는 만큼 당신을 용서합니다.’\n\n용서하기 쉽지 않았던 그 사람에게 용서의 메시지를 천천히 원하는 만큼 반복합니다.\n\n용서의 메시지를 보내는 동안 문득문득 미운 마음이 일어나고 불편한 감정이 일어나면 충분히 그 마음을 받아들입니다.\n\n그런 다음 다시 크게 숨을 들이쉬고 내쉬며 다시 천천히 그 사람을 향해 용서의 메시지를 보내봅니다.\n\n원하는 만큼 반복한 후 준비가 되었다면 천천히 눈을 뜹니다.\n\n남들이 뒤에서 나를 헐뜯는 말은 독이 묻은 화살과 같습니다.\n다행히 뒤에 숨어서 하는 말은 힘이 없어서 그 화살이 내 가슴을 뚫지는 못합니다.\n그런데 가장 어리석은 행동은 땅에 떨어진 그 화살을 주워서 내가 내 가슴을 찌르는 것입니다.\n맞지 않아도 되는 화살을 맞고 받지 않아도 되는 상처를 받고 미워하지 않아도 되는 사람을 미워하는 것입니다.\n\n2001년 미국에서 911테러가 일어났습니다.\n생사의 길목에서 마지막으로 보내온 1600통의 통화내용과 메시지를 분석해보니 사랑한다 거의 대부분이었고,\n그 다음이 미안였다고 합니다.\n우리 인생은 사랑만 하고 살기에도 너무 짧은것 같습니다.\n용서나 미움이라는 것은 우리가 만든 허상이 아닐까 생각해봅니다.\n\n============================ 우리는 살아가면서 잘못도 하고 실수도 합니다.\n자신을 용서하지 못하면 후회가 남고 후회는 자신에 대한 또 다른 학대가 됩니다.\n타인을 용서하지 못하면 미움이 남습니다.\n\n오늘은 타인을 용서해보는 명상을 같이 보겠습니다.\n\n천천히 눈을 감습니다.\n부드럽게 호흡합니다.\n\n자 우리가 살아오면서 만났던 사람 중에 쉽게 용서가 안 되는 사람을 떠올려봅니다.\n그리고 그 사람이 어떤 행동과 말로 상처를 주었는지 떠올려봅니다.\n\n혹시 지난날에 상처가 떠올라 몸이 긴장되고 마음이 불편한 점이 있다면 그 감각과 느낌을 충분히 받아들입니다.\n\n손을 가슴에 가만히 올려놓고 손바닥에서 느껴지는 따뜻함에 주의를 두고 상처 받았던 상황들을 관찰자의 입장에서 바라보아도 좋습니다.\n\n자 다시 한 번 더.\n자신이 도저히 용서할 수 없었던 그 사람의 얼굴을 떠올려봅니다.\n\n그 사람에 대한 미운 마음과 회피하고 싶은 마음의 저항감을 모두 내려놓고 아무런 반응 없이 그저 담담하게 그 사람을 떠올려 봅니다.\n\n그 사람에 대한 미움 마음에서 한 걸음 떨어져서 바라봅니다.\n마치 앞에서 있는 한그루의 나무를 바라보듯이 그 사람을 바라볼 수 있는지 살펴봅니다.\n그리고 숨을 깊이 들이쉬고 내쉬면서 충분히 호흡에 머물러 봅니다.\n\n자 이제 그 사람에게 용서의 메시지를 마음속으로 보내보겠습니다.\n\n나 또한 다른 사람에게 상처를 준 일이 있습니다.\n당신이 나에게 상처를 주었지만 이제 나는 당신을 용서합니다.\n나에게 깊은 상처를 준 당신을 용서합니다.\n내가 할 수 있는 만큼 당신을 용서합니다.\n\n용서하기 쉽지 않았던 그 사람에게 용서의 메시지를 천천히 원하는 만큼 반복합니다.\n\n용서의 메시지를 보내는 동안 문득 문득 미워하는 마음이 일어나고 마음에 불편함이 일어나면 충분히 그 마음을 받아들입니다.\n\n그런 다음 다시 한번 더 크게 숨을 들이쉬고 내쉬면서 다시 한 번 더 천천히 그 사람을 향해서 용서의 메시지를 보냅니다.\n\n우리 마음속에 많은 감정들은 독이 묻은 화살과 같습니다.\n다행히 우리가 그 감정들에게 관심을 가지지 않으면 힘이 없어서 그 화살은 우리의 가슴을 뚫지는 못합니다.\n그런데 가장 어리석은 행동은 땅에 떨어진 그 화살을 주워서 내가 내 가슴을 찌르는 것입니다.\n맞지 않아도 되는 화살을 맞고 받지 않아도 된 상처를 받고 미워하지 않아도 되는 사람을 미워하게 되는 것입니다.\n\n2001년 미국에서 911 테러가 있었습니다.\n많은 사람들이 죽음의 문턱에서 가족이나 지인들에게 보낸 1600통에 통화 내용과 문자메시지 분석해 보니 사랑한다라는 말이 압도적으로 많았고 그 다음이 미안하다는 말이었습니다.\n우리 인생은 사랑만 하고 살기에도 부족한 것 같습니다.","duration":"","tags":"용서명상,타라브랙","series":"숨비명상"},{"id":"48abbc78","category":"자비희사","title":"용서명상 (일중스님)","body":"용서명상 2\n(동영상 후)\n\n용서는 상대를 위해서가 아니라 나 자신을 위한 것입니다.\n얽힌 인연의 고리를 풀어 내고,\n낡은 과거를 놓아 보내고,\n내 마음을 얼룩지게 하고,\n소중한 지금의 시간을 갉아먹는 에너지를 온전히 떠나 보내고,\n자유롭게 새로운 삶을 창조하기 위해 필요한 과정입니다.\n\n그래서 용서를 해야 한다는 것을 사실 누구보다 잘 알지만 내 안에 풀리지 않은 감정들을 앉은 채 용서를 하는 것이 마음처럼 잘 되지 않습니다.\n오늘은 용서 명상을 같이해보겠습니다.\n나를 위해 용서의 마음을 열 준비가 되셨다면 용서 명상을 시작하겠습니다.\n\n우선,\n편안한 자세를 취한 후 눈을 지긋이 감고 잠시 나의 호흡을 알아차려보세요.\n호흡을 인위적으로 조절하지 말고 편안하고 자연스럽게 호흡합니다.\n부드럽게 바람이 불듯 숨이 들고 나는 느낌을 가만히 바라봅니다.\n가슴을 열고 온 몸과 마음으로 일어났다 사라지는 호흡을 느껴보세요.\n부드러운 호흡의 흐름을 따라 나의 몸과 마음도 조금씩 고요해지는 것이 느껴집니다.\n\n이제 마음으로 안내자의 멘트를 차분하게 들어봅니다.\n우리는 삶의 여정 속에서 많은 경험을 통해 부딪히고,\n깨어지고,\n성장해 나아가고 있습니다.\n때로는 원치 않은 상처를 받고,\n또 때로는 의도치 않게 상처를 주기도 합니다.\n그리고 오랜 시간이 지나도 놓아지지 않는 기억과 깊은 상처를 최소한 한 두 가지씩은 가지고 있습니다.\n\n먼저 내가 본의 아니게 혹은 실수와 미숙함으로 상처를 주었던 기억나는 사람들을 떠올려 보세요.\n크고 작은 상처를 준 기억과 사람들이 파노라마처럼 스쳐 지나갑니다.\n떠오르는 이들에게 마음으로 진심을 담아 용서를 청해보세요.\n미숙했고, 두려웠고,\n또 아팠기에 누군가의 마음에 원치 않은 스크래치를 내었던 나 자신은 이제는 용서해 주세요.\n\n우리는 삶이라는 거대한 퍼즐 속에서 때로는 악역이 되기도 하며 서로의 완성을 위한 배움을 돕습니다.\n그래서 또 다른 누군가 역시 미숙하고,\n부족하고,\n아프고 때로는 두려웠기에 나에게 씻을 수 없는 상처를 주기도 하였습니다.\n그럼에도 도무지 그 사람은 용서가 되지 않습니다.\n아니 용서하고 싶지 않습니다.\n\n내가 그 사람을 용서하면 나의 상처와 억울함을 덮고,\n그 사람의 잘못을 묵과하는 것만 같아서 꼭 쥔 이 마음을 풀어놓고 싶지 않습니다.\n사과는 커녕 자신의 잘못도 모르는 사람,\n오히려 큰소리 치는 사람,\n별일 아니라는 듯이 대수롭지 않게 생각하는 사람,\n나는 이렇게 억울하고 분노가 치미는데 아무 일 없다는 듯이 잘 사는 그 사람을 떠올리면 도무지 그 사람을 내 마음 속에서 놓아주고 싶지 않습니다.\n끝까지 붙들고 그 사람을 내 마음에서 풀어주고 싶지 않습니다.\n아직도 너무 화납니다.\n너무 원망스럽습니다.\n너무 억울합니다.\n너무너무 밉습니다.\n정말 생각조차 하기 싫습니다.\n\n이렇게 오랜 시간 나는 나를 고통 속에 넣어두고 나를 더 힘들게 만들었습니다.\n무엇이 어떤 앙금이 남아서 나를 아직도 그 기억과 그 시간들 속에 묶어두고 있나요.\n이제 내 앞에 그 사람이 서 있다고 마음으로 상상하며 상대방을 마주하고 바라보세요.\n만약 직접 마주하는 것이 아직은 힘들다면 느낌으로만 할 수 있는 만큼만 마주하시면 됩니다.\n\n그리고 아직 표현하지 못한 속에 담아둔 말을 전해봅니다.\n그토록 하고 싶었던 혹은 그토록 나를 괴롭게 한 내 안에 그 이야기들을 쏟아내 보세요.\n어떤 말이든 괜찮아요.\n내가 얼마나 아팠는지,\n내가 얼마나 상처 받았는지,\n내가 얼마나 고통스러웠는지,\n내가 얼마나 억울하고 화가 났는지,\n당신이 나에게 어떤 아픔을 주었는지,\n왜 내가 놓아버리지 못하는지,\n내가 진정 무엇을 원했는지,\n내 앞에 상대방이 알아들을 수 있게 이야기해주세요.\n\n지금은 상대가 나의 말에 어떤 반응을 하는지는 전혀 중요하지 않습니다.\n나에게 진심으로 사죄를 하건 하지 않건 나는 오로지 나를 자유롭게 하기 위해 이야기할 뿐입니다.\n지금 가슴 속에 차오르는 그 감정들을 충분히 느끼고 흘려보내는 시간을 갖습니다.\n내 심장에 가둬두었던 그 감정들을 느끼고 소화시켜 깊은 심호흡과 함께 흘려보내주세요.\n놓아주세요.\n\n더 이상 이 감정들이 나를 그 기억 속에,\n그 인연에,\n그 이야기 속에 얽매이지 않도록 나의 가슴으로 나의 눈물로 떠나 보내주세요.\n그리고 하고싶은 말이 아직 남았다면 같이 흘려보내줍니다.\n감정들을 흘려보내고 아직 나를 떠나가지 않은 감정들이 남아있다면 이제는 사랑으로 안아주세요.\n억지로 밀어내지 않아도 괜찮아요.\n힘들었을 그 감정에 그저 사랑의 마음을 보내줍니다.\n아무리 생각해도 이해되지 않고,\n상대가 진짜 천하의 나쁜 사람이라 생각되어 여전히 억울하고 용서가 되지 않을 수 있습니다.\n\n하지만 이 삶의 퍼즐들이 아직 완성되지 않았기에 아직은 그 인연의,\n그 경험의 진짜 의미를 다 헤아리지 못할 수 있습니다.\n때로는 가족과 같은 필연이기도 하고,\n때로는 나의 책임 또는 선택이기도 하였으며,\n또 때로는 배움을 위한 드라마이기도 하였습니다.\n지금은 다 이해할 수 없을지라도,\n이 세상 모든 경험은 그래서 그 상처의 기억들도 내가 존재하기에 벌어진 나에게서 시작된 삶의 파노라마입니다.\n\n이제는 정말 내가 그 감정 속에서,\n그 기억 속에서,\n그 인연에서 자유로워질 수 있도록 용기를 내보겠습니다.\n최대한 할 수 있는 만큼 그 사람을 용서해 보세요.\n놓아주세요.\n나를 위해서 더 이상 나를 상처 속에 어두컴컴한 마음의 방에 방치해 두지 마세요.\n날개를 달고 훨훨 자유롭게 날아갈 수 있게 나를 그 방에서 꺼내어 주세요.\n내가 용서하건 하지 않건 그 사람은 그 사람의 삶을 살아갈 것입니다.\n내가 놓지 않으면 나는 계속 이 에너지의 굴레에서 벗어나지 못하고 또 반복되는 현실을 경험해야 할지도 모릅니다.\n그러니 이제는 내가 진정 자유로워질 수 있게 오로지 나를 위해서 쥐고 있는 마음을 놓아버리세요.\n\n깊이 호흡하며 나는 내 마음의 평화를 위해 내려놓습니다.\n나는 내가 자유롭기 위해 내려놓습니다.\n나는 내 삶을 위해 내려놓습니다.\n나는 새로운 시작을 위해 내려놓습니다.\n나는 나를 사랑하기에 내려놓습니다.\n나는 소중하기에 내려놓습니다.\n나는 나를 위해 용서합니다.\n\n모든 에너지들을 떠나보낸 자리에 힘들었던 경험 속에 담긴 교훈과 성장의 메시지가 남아 있을지 모릅니다.\n분명 너무 아팠던 경험일지라도 나를 위한 한 가지 선물은 들어있을 거예요.\n남겨진 배움을 잘 수확하시고 용서 명상은 여기서 마무리하겠습니다.\n수고 많으셨어요.\n참 잘하셨어요.\n\n하지만 한 번의 명상만으로 온전히 용서가 되지 않을 수 있습니다.\n할 수 있는 만큼만 내려놓으면서 온전히 놓아질 때까지 이 명상을 반복적으로 활용해 보세요.\n그리고 그 누구보다 나 자신에 대한 용서가 필요할 수도 있습니다.\n자기 용서의 시간이 필요하다면 나 자신을 용서하고 화해하는 시간을 통해 더욱더 자유로워지시길 바랍니다.\n마음이 빛나면 삶이 빛납니다.\n내 안에 별을 밝히세요.\n\n용서명상 (일중스님)\n\n눈을 감고,\n배가 일어나고 사라짐을 느끼면서 천천히 호흡을 합니다.\n몸과 마음의 긴장을 풀고 편안하게 호흡합니다.\n\n이제 지난 시간동안 상처를 받았던 일을 떠올려 봅니다.\n무시당하고, 거부당하고,\n실망했던 상황을 떠올려 봅니다.\n\n또한 마음에 아직 분노와 미움,\n후회 등이 남아있는지 알아차리고 바라봅니다.\n용서하기 어려운 감정, 고통,\n분노가 있다면 알아차리고 바라보고 이름을 붙입니다.\n\n`분노`·`미움`·`후회` 그 감정들에 대해 분석하거나 판단하지 말고 단지 자각만 합니다.\n\n상처에 대한 감정을 자각하고 바라봅니다.\n분노 미음의 감정이 일어나더라도,\n누르거나 회피하지 않고 분석하거나 비난하지 않습니다.\n그저 그 감정을 바라보고 알아차린다면,\n그것은 약해지고 스스로 사라질 것입니다.\n\n자각 자체에 치유의 기능이 있습니다.\n명상이 마음을 치료하고 가슴을 열어줍니다.\n`나는 당신을 용서합니다.` 반복해서 마음으로 말합니다.\n그리고 가슴으로 따뜻함을 느끼면서 여러 번 호흡합니다.\n\n이제 다른 사람에게 상처를 준 사실,\n기억,\n상황들을 떠올려 봅니다.\n자각하고 인정하고 수용합니다.\n말로, 행동으로 상처를 주고,\n아프게 했던 상황과 사람을 떠올리며 용서를 구합니다.\n\n마음속으로 그 사람 이름을 부르면서 천천히 부드럽게 `나는 용서를 구합니다.` 마음으로 반복해서 용서를 구하고,\n마지막으로 자기 자신을 용서합니다.\n`나는 나 자신을 용서합니다.`\n\n용서는 해로운 행동을 용납하는 것은 아닙니다.\n마음속의 분노와 미움을 내려놓는 것입니다.\n분노와 미움,\n후회 등 스스로 만들어낸 고통으로부터 자신을 자유롭게 하는 것입니다.\n\n용서는 우리 자신과 용서하는 대상 둘 다를 치유합니다.\n용서 명상으로 마무리하면서,\n마음의 고요한 평화와 자유가 충만하시기를 바랍니다.\n\n용서명상\n\n누군가를 미워하는 마음은 몸의 긴장감을 불러 오고 근육이 뭉친 이 몸의 통로가 막혀서 몸 구석 구석을 딱딱하게 만들지요.\n편안하게 몸의 긴장을 푸는 이완명상을 통해 몸과 마음에 맺힌 응어리를 천천히 풀어보겠습니다.\n\n편안한 자세로 앉아 보십시오.\n등과 허리를 곧게 펴고 가슴을 활짝 열어보세요.\n깊이 숨 한번 들이마시고 내쉬어 줍니다.\n눈은 감거나,\n뜨거나 자유롭게 하십시오.\n\n눈을 뜨고 있는 분은 시선을 편안한 지점에 아래로 툭 떨어뜨려 놓으세요.\n머리 위에서 발끝까지 온 몸의 긴장을 천천히 마음의 눈으로 풀어 내려가 보겠습니다.\n\n머리가 맑고 가볍다고 상상하십시오.\n목과 어깨,\n팔과 손가락 끝까지 긴장감을 풀어 놓습니다.\n앞가슴과 아랫배,\n등과 허리 쪽의 긴장감을 풀어 놓습니다.\n엉덩이와 허벅지,\n무릎과 종아리,\n발목과 발가락 끝까지 긴장감을 풀어 놓습니다.\n아랫니와 윗니의 긴장을 풀고 혀를 입천장에 살짝 붙여 놓으세요.\n\n손이 자유롭다면 손바닥이 위를 향하도록 해서 양손을 무릎 위에 살포시 내려 놓습니다.\n다시 한번 숨을 깊게 숨을 깊게 들이마시고 내쉬어 줍니다.\n이제 배꼽 아래 단전에 마음을 모아 보십시오.\n\n온몸의 긴장이 사라진 지금 편안한 상태를 몸이 기억할 수 있도록 그대로 느껴 보세요.\n숨을 깊이 들이마시고 내쉬면서 지금 나는 살아 있구나 하고 느껴봅니다.\n\n당신의 삶에서 만났던 사람 중에 쉽게 용서가 안되는 사람이 있나요?\n그렇다면 그 사람을 떠올려 보십시오.\n얼굴을 떠 올려도 좋고,\n얼굴이 잘 기억 나지 않으며 이름을 떠올려도 상관 없습니다.\n\n그 사람이 어떤 행동으로 당신에게 상처를 주었는지 잠시 떠올려 봅니다.\n혹시 지난날의 상처가 떠올라 마음이 아프다면 그 느낌을 그대로 충분히 받아들이세요.\n\n깊이 숨을 들이마시고 내쉬어 줍니다.\n혹시 다른 누군가가 당신을 용서하지 못하고 있는 사람이 있는지 지금 돌아봅니다.\n\n만약 그 사람이 당신의 잘못에 대해 용서 해주면서 이해하겠다 라고 말해 준다면 당신의 기분이 어떨까 잠시 돌아 봅니다.\n\n자,\n이제 당신이 도저히 용서할 수 없었던 그 사람이 바로 당신 앞에 마주 앉아 있다 생각해 보세요.\n싫다는 마음이나,\n밉다는 마음에 저항감을 모두 내려놓고 아무 반응하지 말고 그저 담담히 바라봅니다.\n\n마치 저 앞에 서 있는 한 그루의 나무를 바라보듯 그 사람을 향한 생각이나 감정에서 한 걸음 뚝 떨어져서 바라보세요.\n\n자,\n다시 한번 숨을 들이마시고 내쉬어 줍니다.\n그리고 이렇게 속삭여 봅니다.\n\n나 또한 남에게 상처 준 일이 있습니다.\n오늘 나는 당신을 용서합니다.\n나 또한 남에게 상처 준 일이 있습니다 오늘 나는 당신을 용서합니다.\n\n우리는 죽을 때까지 용서할 수 없어 라고 말하지만 과연 그 약속을 지킬 수 있을까요?\n정말 영원히 미워하는 일이 가능하긴 할까요?\n\n내가 누군가를 용서하지 못할 때 가만히 되짚어보면 나 또한 남에게 상처를 주거나 피해를 준 적이 있을 수 있지요.\n이렇게 돌이켜 생각해 본다면 다른 사람의 잘못을 용서하는 일이 그렇게 어려운 일만은 아닐 겁니다.\n\n쉽게 용서하지 못해서 힘든 시간을 보내고 있는 나를 위해 마음으로 먼저 용서하는 용기를 내어 보는 건 어떻겠습니까?\n\n이상으로 명상 마치겠습니다.\n인생은 그대 편입니다.","duration":"","tags":"용서명상,일중스님","series":"숨비명상"},{"id":"3f5b4043","category":"자비희사","title":"쓰담쓰담 명상","body":"지금부터 쓰담쓰담 명상을 시작하겠습니다.\n이 명상은 내가 내 자신의 다정한 친구가 되어 고통으로부터 자유로워지기를 소망하며 스스로를 위로하고 안아주는 명상입니다.\n\n​먼저,\n주먹을 쥐었다가 천천히 펴보겠습니다.\n\n이제 나를 가장 잘 위로하는 동작을 찾아보겠습니다.\n한 손 또는 두 손을 가슴 위에 올려 볼까요?\n이번에는 양볼을 부드럽게 감싸봅니다.\n머리를 천천히 쓰다듬어도 봅니다.\n이번에는 주먹쥔 손을 가슴 위에 올려놓고 다른 한 손으로 주먹을 부드럽게 감싸봅니다.\n두 팔을 교차해서 나를 꼭 안아도 봅니다.\n마지막으로 한 손은 배 위에 한 손은 가슴 위에 올려놓습니다.\n(들숨에 괜찮아,\n괜찮아 / 날숨에 다 잘될거야) 잠시 시간을 갖고 나만의 위로의 손길을 찾아봅니다.\n\n이제 손은 잠시 내려놓고 부드럽게 눈을 감습니다.\n\n\n지금부터 나를 힘들게 했던 상황을 떠올려 보겠습니다.\n\n누군가 나에게 비난의 화살을 꽂았던 순간,\n소외감이 느껴져 서운했던 순간,\n일이 잘 풀리지 않아 속상했던 순간,\n어느 것도 좋습니다.\n최근의 일일 수도 있고,\n아주 오래된 기억일수도 있습니다.\n\n이제 마음의 눈으로 그 상황 속에서 힘들어하고 있는 나를 발견해 봅니다.\n그리고 나를 향해 부드러운 목소리로 이렇게 말해 봅니다.\n\n참 힘든 순간이구나!\n많이 아프다!\n이건 정말 원하지 않는 상황이야!\n\n감정을 숨기지 말고 그대로 인정해 줍니다.\n판단하지 않습니다.\n\n할 수 있다면 힘든 감정에 이름표를 붙여 봅니다.\n이름을 붙였다면 공감하는 목소리로 이름을 불러봅니다.\n\n이것이 슬픔이구나!\n이것이 아픔이구나!\n이것이 불안이구나!\n이것이 외로움이구나!\n\n감정에 이름을 붙이면 나와 감정 사이에 공간이 생겨나면서 약간의 해방감이 느껴질 것입니다.\n\n​이번에는 머리끝에서 발끝까지 쭉 훑어보면서 몸의 어디에서 아픔이 가장 잘 느껴지는지 알아차려 봅니다.\n머리를 살펴봅니다.\n아픔이 느껴지는지 알아차려봅니다.\n(얼굴, 목, 어깨, 양팔,\n가슴, 배, 허리, 골반,\n엉덩이, 허벅지, 무릎,\n종아리, 발)\n\n불편한 감정이 자리하고 있는 몸의 부위를 위로의 손길로 부드럽게 다독이면서 이렇게 말해봅니다.\n\n​지금 내가 느끼는 감정은 누구나 살면서 느낄 수 있는 자연스러운 감정이야.\n특히 힘든 시기에는 감정을 더 크게 느끼기도 해.\n내가 유별나고 예민해서가 아니라 이런 상황에서는 대부분의 사람들이 비슷한 감정을 느껴.\n나만 그런 것이 아니야.\n나 혼자가 아니야.\n\n이제부터 나에게 위로의 말을 해보겠습니다.\n나를 향한 위로의 말이 잘 떠오르지 않는다면 친한 친구가 나와 똑같은 상황에 있다고 상상해 봅니다.\n그 친구에게 무슨 말을 해줄지 생각해봅니다.\n그 말을 그대로 나에게 해볼까요?\n어색하더라도 천천히 말해 봅니다.\n\n​나는 언제나 너를 믿어.\n내가 가지고 있는 잠재력을 난 알고 있어.\n내가 너를 사랑해.\n너는 웃는 모습이 가장 예쁘고 멋져.\n내가 늘 너와 함께 할 거야.\n​ 이 명상은 안 좋은 기분을 없애려는 것이 아닙니다.\n내 마음이 아프기 때문에 하는 것입니다.\n아픔을 회피하거나 없애려고만 하면 언젠가는 더 크게 덧나 나를 괴롭게 합니다.\n하지만 아프고 힘든 순간 지금처럼 다정하게 위로한다면,\n마음에 힘이 생기는 것을 느낄 수 있을 것입니다.\n\n이렇게 나를 위로하는 것이 어떤 느낌인지 알아차려 봅니다.\n기분에 변화가 있는지도 알아차려 봅니다.\n\n네,\n​이제 마지막으로 두세 차례 깊게 숨을 들이쉬고 내쉬면서 지금 이 순간 내 자신이 되어 봅니다.\n준비가 되면 부드럽게 눈을 뜹니다.\n\n스스로를 다독이는 것은 다른 사람이 위로해 주는 것과 똑같은 효과가 있다고 합니다.\n내가 ​친한 친구를 위로할 때처럼 부드러운 손길로 나를 다독이면서 마음의 불안과 스트레스로부터 편안해지는 것을 느껴봅니다.\n여러분 모두가 있는 그대로의 나를 사랑하면서 멋지게 성장하시길 응원드립니다.","duration":"","tags":"자기연민,MSC","series":"숨비명상"},{"id":"954976bc","category":"수용","title":"바람의 오감","body":"지금 이 순간,\n우리의 오감을 모두 열어 바람을 온전히 느껴보겠습니다.\n바람을 통해 다섯 가지 감각을 차례로 경험하며,\n세상을 더 깊이 마주하는 시간을 가져볼까요?\n\n바람의 모양을 봅니다 눈을 가만히 뜨고 바람을 바라봅니다.\n바람은 눈에 보이지 않지만,\n그 흐름이 세상을 움직입니다.\n나뭇잎이 흔들리고,\n머리카락이 살짝 흩날리며,\n주위의 작은 움직임을 통해 바람의 모양을 볼 수 있습니다.\n바람이 만들어내는 변화의 모습을 주의 깊게 관찰해 보세요.\n\n이제 눈을 감고 귀를 열어보세요.\n바람의 소리를 듣습니다 바람이 지나가는 소리를 들어봅니다.\n나뭇잎이 흔들리는 소리,\n건물 사이를 지나가는 소리,\n혹은 당신의 몸을 스치는 소리까지.\n그 소리에 집중하며 바람의 노래를 들어봅니다.\n소리의 높낮이와 강약을 느끼며,\n바람이 들려주는 이야기에 귀 기울여 보세요.\n\n바람의 향기를 맡습니다 이번에는 코로 바람을 맡아봅니다.\n바람이 어디서부터 왔는지,\n그 안에 담긴 향기가 느껴지나요?\n바람은 주변의 냄새를 함께 실어옵니다.\n풀냄새, 흙냄새,\n혹은 나무의 향기까지.\n이 순간,\n바람이 가져다주는 자연의 향기를 깊이 들이마셔보세요.\n\n바람을 맛봅니다 입을 약간 벌리고 바람을 천천히 들이마시면,\n미세한 맛의 변화가 느껴질 수 있습니다.\n혀를 통해 바람을 느껴봅니다.\n바람에 실려 온 공기의 차가움이나 따스함,\n혹은 습기와 건조함을 미각으로도 느낄 수 있습니다.\n이 미묘한 차이를 음미하며 바람의 맛을 경험해 보세요.\n\n바람의 감촉을 느낍니다 마지막으로,\n피부로 바람의 촉감을 느껴봅니다.\n바람이 얼굴, 팔,\n손끝을 스쳐 지나가며 전해주는 부드러운 감각에 집중해 보세요.\n때로는 시원하게,\n때로는 따스하게 느껴지는 바람의 손길을 온몸으로 느껴봅니다.\n바람이 스치는 순간,\n당신의 몸은 바람과 하나가 됩니다.\n\n모든 감각을 열어 바람을 느껴보았습니다.\n하나의 대상,\n바람을 통해 우리는 눈에 보이지 않는 세상의 깊은 층을 경험할 수 있습니다.\n지금 이 순간,\n다섯 가지 감각을 통해 더 넓은 세상이 펼쳐집니다.\n이제 천천히 깊은 호흡을 하고,\n눈을 뜨며 현실로 돌아옵니다.\n감각을 열고 경험한 이 순간을 기억하며,\n일상 속에서 새로운 세상을 마주하길 바랍니다.","duration":"","tags":"오감명상,걷기명상","series":"숨비명상"},{"id":"795afa19","category":"수용","title":"고요한 물결 (10~15)","body":"손을 들고 내리며 호흡하는 명상 스크립트\n편안한 자세로 시작하기\n\n편안한 자세로 앉거나 누워주세요.\n등을 곧게 펴고 어깨의 힘을 빼고 편안하게 몸을 맡겨보세요.\n양손은 무릎 위에 가볍게 올려놓고 눈을 감거나 편안하게 앞을 응시합니다.\n\n호흡에 집중하기\n\n들숨과 함께 손을 들어 올리기: 천천히 숨을 들이마시면서 양손을 가슴 높이까지 천천히 들어 올려보세요.\n손바닥이 하늘을 향하도록 유지하며 숨을 최대한 들이마셔 봅니다.\n날숨과 함께 손을 내려놓기: 숨을 천천히 내쉬면서 양손을 무릎 위로 다시 내려놓습니다.\n몸 안에 남아있는 긴장과 스트레스를 모두 내뱉는다는 상상을 해보세요.\n호흡과 움직임의 조화\n\n호흡과 움직임의 연결: 들숨과 날숨에 맞춰 손을 부드럽게 움직이면서 호흡에 집중해 보세요.\n호흡과 움직임이 자연스럽게 연결되어 하나가 되는 느낌을 느껴보세요.\n몸 전체 느끼기: 손을 움직일 때 팔뿐만 아니라 몸 전체에 집중해 보세요.\n어떤 부분이 긴장되어 있고,\n어떤 부분이 이완되어 있는지 느껴보세요.\n마음 관찰하기: 호흡과 움직임에 집중하다 보면 어떤 생각이 떠오를 수 있습니다.\n그 생각들을 판단하거나 저지하려 하지 말고,\n그냥 지켜보는 것처럼 가만히 내려놓아 보세요.\n명상 마무리\n\n마음 돌아보기: 잠시 눈을 감고,\n지금 이 순간의 느낌에 집중해 보세요.\n몸과 마음이 어떤 상태인지 느껴보고,\n편안함을 유지하세요.\n천천히 일어서기: 몇 번 심호흡을 하고 천천히 눈을 뜨세요.\n몸을 부드럽게 움직여 스트레칭을 해주고,\n편안하게 자리에서 일어나세요.","duration":"","tags":"호흡,몸동작","series":"숨비명상"},{"id":"32a427a0","category":"수용","title":"늘보명상(15~30)","body":"위빠사나라고 얘기하는 좌선도 좀 하셨는데 부처님은 좌선만 하셨다 이렇게 생각하기 쉬운데 좌선과 경행,\n좌선과 경행,\n이것을 항상 반복하면서 하셨습니다.\n\n좌선을 할 때도 한 번 좌선을 시작하면 우리나라처럼 열시간 스무시간 일주일씩 앉아서 버텨야 한다,\n이런 좌선을 하지 않죠.\n보통 40~50분,\n30분이나 40분 좌선하고,\n그리고 20분이나 30분 경행하고 이런식으로 많이 합니다.\n\n\n\n지금 이 순간,\n우리는 걷기 시작합니다.\n일반적으로 우리는 걸을 때 걸음걸이에 주의를 기울이지 않습니다.\n무의식적으로 걸음을 옮기고,\n다른 생각에 잠기곤 합니다.\n\n하지만 오늘,\n우리는 걸음 하나하나에 집중하려고 합니다.\n걸음걸이가 단순한 움직임이 아닌,\n몸과 마음을 연결하는 중요한 동작임을 느껴봅니다.\n\n먼저 발바닥이 땅에 닿는 순간을 느껴보세요.\n발끝이 땅을 떠나는 감각에도 주의를 기울입니다.\n천천히 걷는 동안,\n우리는 몸의 움직임과 호흡에 집중합니다.\n\n걸음이 점점 느려질수록,\n마음의 소란도 함께 가라앉습니다.\n걸음이 고요해지면,\n마음도 고요해집니다.\n몸과 마음이 따로가 아님을,\n이 순간 직접 경험합니다.\n\n지금 우리는 산불처럼 마음이 산란하고 불안할 때 어떻게 걷는지 알아봅니다.\n그럴 때, 걸음은 급해지고,\n호흡은 짧아지며,\n우리는 긴장하게 됩니다.\n하지만 천천히 걷는다면,\n우리의 불안함과 산란함이 가라앉기 시작합니다.\n걸음이 느려질수록 우리는 더 깊이,\n더 고요하게 마음을 다스립니다.\n\n이 느리게 걷는 명상은 우리가 평소에 습관적으로 걷는 것과는 다릅니다.\n지금 우리는 한 발 한 발에 온전히 주의를 기울입니다.\n움직임 하나하나가 우리의 몸과 마음을 평온하게 만들어줍니다.\n\n특히 좌선과 걷기 명상을 함께하면,\n명상의 깊이를 더욱 더할 수 있습니다.\n계속 앉아만 있지 않고,\n걸으면서 명상하는 것은 몸과 마음을 더 깊이 연결시켜 줍니다.\n\n이제,\n우리는 이 걷기 명상을 통해 몸과 마음을 하나로 만드는 경험을 합니다.\n걸음걸이를 통해,\n고요하고 평온한 마음의 상태로 돌아갑니다.\n\n\n우리는 걸을 때 걸음걸이에 주의를 주지 않습니다.\n상황에 따라 다르지만 일반적으로 우리는 걸을 때 거의 신경을 쓰지 않고 걷습니다..\n습관적으로 패턴화된 행동으로 걷는 것입니다.\n\n운동을 하거나,\n새로운 장소를 찾아갈 때는 걸음에 주의를 기울이는 정도가 높아지지만,\n다른 생각을 하고 있거나 대화를 하면서 걸으면 거의 걸음걸이에 신경쓰지 못하고 걷습니다\n\n우리는 몸과 마음이 따로가 아닙니다.\n몸이 고요해지면 마음도 고요해집니다.\n몸 따로 마음 따로가 될 수 없습니다.\n\n걷기 명상은 마음에 산불이 났을 때 하면 좋습니다.\n마음이 산란하고 불안하면 걸음도 빨라집니다.\n불안하고 산란할 때 천천히 걸으면 편안하고 고요하고 바뀌게 됩니다.\n느리게 걷기는 우리가 습관적이고 패턴과된 행동으로 걷는 것이 아닌 움직임 하나하나에 주의를 기울이면서 몸과 마음을 고요하고 편안하게 하는 방법입니다.\n\n특히 좌선과 걷기명상을 함께하면 계속 앉아서 좌선을 하는 것보다 명상의 효과를 훨씬 더 높일 수 있습니다.\n\n두 가지 명상법을 번갈아 가며 실천하면,\n고요한 상태에서의 집중력과 움직임을 통한 신체적 이완을 동시에 경험할 수 있습니다.\n이는 명상의 전반적인 효과를 높이고,\n일상생활에서의 스트레스 관리와 정신적 안정에 큰 도움이 됩니다.\n\n조금 전에 같이 해보았던 앉아서 하는 호흡명상과 걷기명상을 함께 실천하면 명상의 효과를 더욱 높일 수 있습니다.\n두 명상법은 서로 보완적인 역할을 하며,\n각각의 장점을 극대화할 수 있습니다.\n\n걷기 명상은 움직임을 통해 명상을 실천하는 방법으로,\n신체와 정신의 조화를 이루는 데 도움을 줍니다.\n걷는 동안 호흡과 발걸음,\n주변의 감각에 집중하며 마음의 평온을 찾을 수 있습니다.\n특히 신체의 긴장을 풀어주고,\n정신을 맑게 하며,\n불안과 우울증을 완화하는 데 효과적입니다.","duration":"","tags":"늘보,걷기","series":"숨비명상"},{"id":"3c533e32","category":"호흡명상","title":"인중 명상","body":"자, 바르게 앉아 보세요.\n\n엉덩이를 좌우로 가볍게 흔들어,\n바닥에 안정되게 자리를 잡습니다.\n\n자리가 잡혔으면,\n허리를 곧게 세워 보세요.\n\n정수리를 위에서 살짝 당긴다는 느낌으로 세우고,\n턱은 가볍게 당깁니다.\n\n두 손은 무릎 위에 편안하게 내려놓으세요.\n\n어깨를 가볍게 들썩들썩,\n남아 있는 힘을 털어 냅니다.\n\n눈은 뜬 채로,\n전방 1미터쯤 아래를 내려다보세요.\n\n가장 편하게 내려다볼 수 있는 자리에,\n시선을 살며시 내려놓습니다.\n\n시선이 안정되었으면,\n이제 눈을 뜬 채로,\n내 몸 전체를 한눈에 비추어 봅니다.\n\n거울 앞에 선 것처럼,\n정수리부터 엉덩이까지,\n한 번에, 통째로.\n\n'내 몸이다' 하면서,\n그냥 바라보세요.\n\n이제 천천히, 눈을 감습니다.\n\n눈을 감은 채로,\n다시 한 번 내 몸 전체를 비추어 봅니다.\n\n한 번에, 통째로.\n\n또렷이 보여도 좋고,\n보이지 않아도 괜찮습니다.\n\n'내 몸이다' 하면서,\n그냥 봅니다.\n\n이제 마음을 인중으로 보내세요.\n\n코와 윗입술 사이,\n숨이 스치는 그 자리입니다.\n\n인중, 인중, 인중.\n\n마음은 공간입니다.\n그 공간 속에,\n'여기가 인중 자리다' 하면서,\n마음을 가만히 내려놓습니다.\n\n그리고 마음속으로 정해 보세요.\n\n'이 자리에서 호흡을 지켜보겠다.' '명상이 끝날 때까지, 이 자리를 지키겠다.'\n\n인중, 인중, 인중.\n\n자세히 보아야 아름답습니다.\n그 자리를,\n자세히 들여다보세요.\n\n그냥, 자세히.\n\n자세히 들여다보면,\n호흡이 저절로 잡힙니다.\n\n숨이 들어올 때의 서늘함,\n나갈 때의 따뜻함.\n\n마음이 달아나면, 알아차리고,\n다시 인중으로 돌아오면 됩니다.\n\n백 번 달아나면,\n백 번 돌아오세요.\n\n무소의 뿔처럼 혼자서 가겠다는 마음으로,\n\n계속해서, 세심하게,\n호흡을 들여다봅니다.\n\n자세히 보아야 아름답습니다.\n\n띵샤가 울릴 때까지,\n그렇게 머무르세요.\n\n\n------------ 자,\n자세를 바르게 앉으세요.\n엉덩이를 좌우로 흔들어 안정되게 자리를 잡으세요.\n\n자리가 안정되었으면 허리를 곧추 세우세요.\n머리는 위에서 당긴다는 느낌으로 세우고,\n턱은 당겨주세요.\n두손은 무릎위에 편안하게 내려놓습니다.\n어께는 가볍게 들썩이며 힘을 빼주세요.\n\n눈은 전방 1m 아래쪽을 내려다보세요.\n가장 편하게 내려다볼 수 있는 위치에 안착시키고 보세요.\n\n눈을 뜬 상태에서 의식으로 내 몸 전체를 한방에 투영해 보세요.\n거울을 바라본다는 느낌으로 투영해보시기 바랍니다.\n\n눈이 안정되었으면 이제 천천히 눈을 감으세요.\n\n이번에는 눈을 감은 상태에서 내 몸 전체를 투영해 보시기 바랍니다.\n한 방에 투영하세요.\n어디가 보이든 안보이든 상관없습니다.\n그냥 ‘내 몸이다’ 하면서 정수리부터 엉덩이까지 한방에 투영해보세요.\n'내 몸이다' 하면서 그냥 보세요.\n\n이제 마음을 인중점으로 보내세요.\n인중, 인중, 인중.\n\n마음은 공간입니다.\n그 공간 속에 '여기가 인중 자리다' 하면서 거기에 마음을 둡니다.\n‘이 자리에서 호흡을 지켜보아야겠다’ ‘명상이 끝날 때까지 이 자리를 고수하겠다’ 하면서 그 자리를 확고하게 잡으세요\n\n인중, 인중, 인중.\n\n‘자세히 보아야 아름답다’ 하면서 자세히 들여다보시기 바랍니다.\n그냥 자세히 들여다보세요.\n자세히 들여다보면 호흡이 잡힐 겁니다.\n무소의 뿔처럼 혼자서 가겠다는 마음으로 계속해서 호흡을 세심하게 들여다보세요.\n\n​‘자세히 보아야 아름답다’ 하면서 띵샤가 울릴 때까지 그렇게 명상하시기 바랍니다.","duration":"약 5분","tags":"#인중명상 #호흡명상 #집중","series":"숨비명상"},{"id":"4017bc23","category":"수용","title":"반추명상","body":"심리학에 ‘반추’라는 말이 있습니다.\n반복해서 추억한다는 뜻으로 어떤 일을 경험하고 난 후에,\n그것을 반복해서 생각하다는 의미입니다.\n\n심리학은 주로 기분이 안 좋을 때 과거의 일에 얽매이는 부정적인 의미로 사용하지만,\n명상에서는 기분이 좋지 않을 때 가장 기분 좋았던 기억을 반복해서 떠올리며 빠르게 기분을 환기할 수 있습니다.\n\n그럼,\n지금부터 긍정반추 명상을 같이 해보겠습니다.\n다리를 골반 너비로 벌리고 편안하게 서봅니다.\n척추를 곧게 폅니다.\n머리를 좌우로 천천히 기울이면서,\n목의 긴장을 풀어봅니다.\n어깨도 살짝 움직여 힘을 빼주세요.\n손은 가슴 앞에 모아 합장합니다.\n\n천천히 숨을 들이마시고 길게 내쉽니다.\n숨을 들이쉴 때 공기가 몸속으로 들어와 온몸을 깨끗하게 채우고,\n숨을 내쉴 때는 몸과 마음 속의 긴장이 풀리는 것을 느껴봅니다.\n계속해서 호흡에 집중합니다.\n\n이제 마음속에서 과거의 가장 기분 좋았던 순간을 떠올려 보세요.\n그 순간에 느꼈던 행복,\n편안함,\n따스함이 마음에 스며드는 것을 느낍니다.\n그때 함께한 사람들,\n시간과 장소,\n주변의 소리와 풍경까지 떠올리며 그 행복감을 다시 불러옵니다.\n\n이제 두손으로 자신을 안아봅니다.\n눈을 감고 당신이 경험했던 행복한 기억과 그때 느꼈던 따스함을 가슴에 끌어안는다는 느낌을 상상해 보세요.\n\n이제 손바닥을 가슴 위에 올리고,\n그 따뜻한 감정이 온몸으로 퍼져 나가는 것을 느끼세요.\n따뜻한 에너지가 손을 통해 가슴으로,\n가슴에서 전신으로 퍼져 나가는 모습을 그리며 천천히 숨을 들이마시고 내쉽니다.\n\n이제 천천히 손을 옆으로 뻗으며 하늘을 향해 팔을 들어 올립니다.\n마치 하늘로부터 빛과 에너지를 받아들이는 것처럼,\n두 팔을 넓게 벌려 가슴을 활짝 열어보세요.\n이때 당신이 느꼈던 행복과 기쁨이 더욱 커지고 확장되는 것을 상상하세요.\n몸 전체가 그 감정으로 가득 차오르는 것을 느끼며,\n팔을 천천히 내립니다.\n\n눈을 감은 상태로 잠시 더 그 따뜻한 감정을 느껴보세요.\n행복했던 기억과 그때의 감정을 내면에 깊이 새기면서,\n앞으로도 언제든지 이 순간을 떠올릴 수 있다는 자신감을 가집니다.\n그 기억이 당신을 지탱해주고,\n언제든지 불러올 수 있다는 것을 마음에 새깁니다.\n\n이 명상은 기분이 급격히 안 좋아질 때 가장 즐거웠던 과거를 반추해보고 기분을 환기하는 명상법입니다.","duration":"","tags":"반추,회상","series":"숨비명상"},{"id":"7d4e3962","category":"수용","title":"해피엔딩 명상","body":"https://www.youtube.com/watch?v=TbZl8PPF_-c\n\n(이 명상은 누구에게도 방해받지 않는 혼자 고요히 몰입할 수 있는 장소에서 진행합니다.\n그리고 주위의 조명은 어둡게 조절 하시거나,\n꺼두시는 것이 좋습니다.\n그러나 무서운 마음이 조금이라도 든다면 조명을 키고 하셔도 무방합니다.)\n\n바닥에 바르게 눕습니다.\n눈을 편안하게 감고,\n몸에 힘을 털썩 떨어뜨려 놓습니다.\n\n지금부터 죽음을 간접적으로 체험해 보고 지금 삶을 돌아보는 시간을 가져보겠습니다.\n\n간접적으로 체험하는 것입니다.\n그러니 너무 긴장하지 않으셔도 됩니다.\n잠시 편안하게 호흡하며 머리끝부터 발끝까지 몸을 살펴보며 긴장된 몸의 부위를 알아차립니다.\n\n그리고 이제 숨을 천천히 들이마시고,\n다시 천천히 내쉽니다.\n숨이 들어올 때 배가 나왔다가 숨이 나갈 때 배가 들어가는 호흡의 흐름을 가만히 지켜봅니다.\n숨을 천천히 들이마시고 다시 천천히 내쉬며 몸의 긴장을 풀어줍니다.\n숨을 천천히 들이마시고 내쉬는 호흡에 긴장이 후~하고 손끝,\n발끝을 통해 빠져나갑니다 천천히 숨을 들이마시고,\n다시 후~\n\n네 좋습니다.\n아직 경직된 곳이 남아있다면 한번 더 힘을 풀어 줍니다.\n이제 몸과 마음이 편안하게 이완되었습니다.\n\n우리는 원하든 원하지 않든 언젠가는 삶을 마치게 됩니다.\n그래서 우리에게 가장 두려운 것은 죽음일지 모릅니다.\n생존 본능의 가장 밑바닥에 죽음에 대한 두려움이 자리하고 있습니다.\n그만큼 죽음이라는 것은 우리에게 많은 것을 돌아보게 합니다.\n\n죽으면 어떤 것도 가져갈 수 없습니다.\n지금 여러분들의 하고 있는 고민,\n걱정, 집착,\n욕심 같은 것들은 죽음 앞에서는 의미가 없습니다.\n\n모든 것은 생이 있으면 사가 있습니다.\n구름도 생겨났다 사라지고 자연도 사계절에 따라 봄이 되면 싹이 트고 여름에는 무성하게 피어나고 가을에는 시들어지고 겨울에는 다시 흙으로 돌아갑니다.\n\n동물들도 수명이 다하면 자연으로 돌아가고 내가 함께 했던 사랑했던 모든 것들도 때가 되면 모두 자연으로 돌아갑니다.\n\n모든 것은 시작과 함께 변화되고 결국 멸하게 되는 것이 우주의 이치인것처럼 우리도 죽음을 통해 이번 삶을 정리하게 될 것입니다.\n\n이제 여러분에게는 이번 삶을 경험할 수 있는 시간이 단 일주일 남았습니다.\n\n당신은 어떤 것을 생각하고 무엇을 정리하고 무엇을 하며 시간을 보내고 싶은가요?\n잠시 정리할 수 있는 시간을 드리겠습니다.\n\n이제 죽음이 하루 앞으로 다가왔습니다.\n당신은 누구와 무엇을 하며 어떤 이야기를 나누고 있나요?\n당신의 마음은 또 어떠한가요?\n\n지난 삶을 다시 한번 돌아보고 내가 어떻게 살아왔는지,\n후회되는 것은 무엇인지,\n아쉬운 것은 무엇인지,\n혹은 여전히 놓을 수 없는 것이 있는지,\n잠시 돌아보는 시간을 갖겠습니다.\n\n이제 죽음이 1시간 앞으로 다가왔습니다.\n아무리 되돌리고 싶어도 되돌릴 수 없습니다.\n1시간 후면 당신 몸의 모든 기능이 서서히 멈추면서 생명력을 잃게 됩니다.\n\n지금 당신은 어디에 있습니까?\n주변을 돌아보세요.\n당신의 곁에는 누가 함께 하고 있나요?\n그들은 당신에게 어떤 말을 건네고,\n또 당신은 그들에게 어떤 말을 남기고 싶은가요?\n\n이제 1분 후면 당신은 모든 것을 놓고 이번 생을 마감하게 됩니다.\n이제 당신은 서서히 죽어가고 있습니다.\n생각도 사라져 갑니다.\n당신의 몸은 완전히 정지되었고,\n당신의 몸에 머물렀던 모든 생각,\n감정,\n에너지들도 심장을 통해 빠져 나와 몸을 떠나갑니다.\n\n이제 당신의 의식도 당신의 몸에서 빠져나왔습니다.\n당신이 누워있는 그 방의 주변을 살펴보세요.\n어떤 광경이 펼쳐지건 당신은 이제 이번 삶의 여행이 끝났으니 더 이상 여기에 머무를 수 없으며,\n태어나기 전 당신이 있었던 그 곳으로 돌아가야 할 때가 되었습니다.\n\n싱잉볼 소리와 함께 시간과 공간을 초월하여 당신은 태어나기 전 우주의 한 영역으로 돌아갈 것입니다.\n\n이제 당신은 우주에 있습니다 지구를 바라보며 지난 삶에서 무엇을 배웠는지 얼마나 성장했는지 얼마나 많은 것을 수확했는지 혹은 목표를 달성했는지 돌아보고 있습니다.\n\n한때는 그토록 고통스럽고,\n아프고,\n힘들었던 시간들이 우주에서 바라보면 나를 성장시키기는 무대장치에 불과했습니다.\n\n이번 여행은 어떠셨나요?\n만족스러운신가요?\n아니면 아직도 미련이 많이 남나요?\n만약 다시 돌아가면 좀 더 여행을 잘 즐길 수 있을 것 같은가요?\n이번에는 도망가지 않고 어려운 과제를 잘 풀어낼 수 있을 것 같은가요?\n\n네. 좋습니다.\n이제 당신에게 다시 한번 기회를 드리겠습니다.\n당신이 느끼고 깨우친 것이 많아 보여 다시 당신의 삶으로 돌아가 당신이 살고 싶은 만큼 충분히 삶을 경험하고 다시 돌아 오시기 바랍니다.\n\n싱잉볼 소리와 함께 당신은 당신이 죽기 일주일 전으로 다시 돌아가겠습니다.\n\n당신의 의식은 지금 이곳 나의 몸으로 돌아 왔습니다.\n조금씩 몸의 감각이 다시 느껴지고 주변에 소리들이 들리고 생각과 감정도 다시 자각되기 시작합니다.\n서서히 돌아올 수 있도록 시간을 갖고 기다려 줍니다.\n\n나의 손과,\n나의 발 그리고 바닥과 닿아 있는 나의 몸을 천천히 느껴봅니다.\n나의 호흡도 가만히 느껴봅니다.\n\n이제 당신은 남은 지구에서의 여행을 어떻게 보낼 것인가요?\n어떤 마음가짐으로 살아가고,\n무엇을 내려놓고,\n무엇을 더 노력하고,\n당신의 시간과 에너지를 무엇에 투자하고 싶으신가요?\n\n이제 휴식하면서 앞으로의 여정을 새롭게 시작하는 마음으로 다시 세팅하는 시간을 가져보시기 바랍니다.\n\n천천히 눈을 뜹니다.\n몸을 옆으로 돌려 바닥을 짚고 일어납니다.\n함께 해주셔서 감사합니다.\n의미있는 시간이 되셨기를 바랍니다.","duration":"","tags":"죽음,수용","series":"숨비명상"},{"id":"89aa630d","category":"수용","title":"나는 어떤 사람인가?","body":"당신은 지금까지 살아오면서 자신을 제대로 바라본 시간이 있었나요?\n\n나는 어떤 사람일까요?\n나는 내 자신을 어떤 사람이라고 생각하고 있나요?\n그리고 다른 사람들에게 나는 어떤 사람으로 보여지고 불리어지고 있나요?\n자신에 대한 이미지를 떠올려봅니다.\n\n지금까지 내가 불리워졌던 수 많은 명칭과 역할 그리고 평가들을 생각해봅니다.\n\n엄마 아빠\n남편 부인\n선생님 친구들\n직장상사 부하직원\n친구 동료…\n\n이것들에 따른 여러 가지 나에 대한 모습들이 있습니다.\n나는 나에 대한 모습들 그것으로 지금까지 살고 있었습니다.\n\n그것으로 살고 있는 동안에 정작 나는 그동안 온전히 존재해온 나를 돌아볼 시간이 없었습니다.\n\n양손을 부드럽게 가슴에 갖다 댑니다.\n나에게 전해지는 마음의 소리,\n가슴의 느낌을 그대로 느껴봅니다.\n고요하면 고요한대로,\n답답하면 답답한대로,\n기쁘면 기쁜대로,\n슬프면 슬픈대로 그 느낌이 무엇이든지 있는 그대로 가만히 느껴봅니다.\n\n지금까지 살아오는 동안 나와 가장 오래 함께했던 마음의 소리,\n지금 올라오는 감정을 그대로 느낍니다.\n\n나의 감정을 좋아하고 싫어함이 없이 있는 그대로 지금 마주하고 있습니다.\n느낌을 그대로 느껴봅니다.\n생각이 떠오르면 생각도 있는 그대로 바라봅니다.\n나를 위해서 지금까지 애써왔던 생각들을 있는 그대로 바라봅니다.\n\n지금보다 더 나은 사람이 되려고 애쓰는 나,\n상처와 절망 속에 울고 있는 나,\n미래에 대한 두려움에 떨고 있는 나,\n\n그동안 내가 싫어했던 나의 모습,\n평생 기억하고 싶지 않았던 지나간 경험,\n미래에 대한 끊임없는 걱정도 떠오르는 대로 바라봅니다.\n\n되돌아본 몸과 마음의 느낌에 아기를 돌보는 엄마처럼 사랑하는 친구처럼 따뜻하고 다정하게 속삭여줍니다.\n\n그동안 몰라봐서 미안해.\n함께 해주어서 감사해.\n내가 늘 너를 사랑해.\n\n가슴의 괴로움과 아픔이 사라질 때까지 환한 햇살과 봄바람의 따스함처럼 가슴에 마음을 온전히 집중하여 속삭여줍니다.\n\n미안해, 감사해, 사랑해,\n용서해…\n\n마음이 사랑과 평화로 온전해질 때까지 나에게 그렇게 속삭여줍니다.\n\n미안해, 감사해, 사랑해,\n용서해…","duration":"","tags":"자기바라보기,제주","series":"숨비명상"},{"id":"5fcbe56c","category":"탈중심화","title":"바람의 틈","body":"오늘 우리는,\n무언가를 없애려고 여기 앉은 것이 아닙니다.\n힘든 일을 지우려고,\n문제를 밀어내려고,\n감정을 눌러 없애려고 앉은 것이 아닙니다.\n\n우리가 오늘 할 일은 단 하나,\n조금 떨어져 보는 것입니다.\n\n가까이 있으면,\n산은 벽이 됩니다.\n조금 물러서면,\n비로소 산의 모양이 보입니다.\n문제는 그대로인데,\n문제를 보는 자리가 달라집니다.\n\n함께 있으되,\n거리를 두는 것.\n그래서 그 사이로,\n바람이 지나가게 하는 것.\n\n지붕을 떠받치는 기둥들도 서로 떨어져 서 있고,\n나무와 나무도,\n서로의 그늘 속에서는 자랄 수 없습니다.\n거리는 멀어짐이 아닙니다.\n거리는,\n자랄 수 있는 공간입니다.\n\n이제 당신과 당신의 어려움 사이에도,\n바람이 지나갈 틈을 하나 내어 보겠습니다.\n\n편안히 앉습니다.\n허리를 바르게 세우고,\n어깨는 아래로 내려놓습니다.\n턱은 아주 조금 당기고,\n손은 무릎 위에 가만히 둡니다.\n\n눈은 지그시 감습니다.\n눈을 감는 것도 하나의 거리두기입니다.\n바깥의 자극과 나 사이에,\n얇은 커튼 하나를 내리는 일입니다.\n\n지금 몸이 닿아 있는 곳을 느껴 봅니다.\n바닥에 닿은 발,\n의자에 닿은 다리와 등.\n나를 받쳐 주고 있는 단단함이 거기 있습니다.\n\n애쓸 필요 없습니다.\n지금 이 순간,\n당신이 해야 할 일은 아무것도 없습니다.\n\n이제 숨으로 주의를 옮깁니다.\n숨을 바꾸려 하지 말고,\n그저 지금 오가는 숨을 알아차립니다.\n\n들어오는 숨. 나가는 숨.\n코끝이 서늘해지는 감각.\n가슴이 열리고,\n배가 부풀었다 꺼지는 움직임.\n\n숨을 내쉴 때마다, 어깨에서,\n턱에서, 미간에서,\n힘이 조금씩 빠져나갑니다.\n\n숨은,\n세상에서 가장 짧은 거리두기입니다.\n들이쉬는 사이,\n반응이 한 박자 늦어집니다.\n내쉬는 사이,\n몸은 위협이 아니라 안전을 배웁니다.\n\n숨을 세어 봅니다. 들이쉬고,\n하나. 내쉬고, 둘.\n열까지 갔다가,\n다시 하나로 돌아옵니다.\n중간에 생각에 끌려가도 괜찮습니다.\n알아차리는 그 순간이,\n이미 돌아온 것입니다.\n\n이제 숨은 배경으로 물러나게 두고,\n지금 마음에 무엇이 있는지 살펴봅니다.\n\n스스로에게 조용히 물어봅니다.\n지금, 어떤 생각이 있는가.\n지금, 어떤 감정이 있는가.\n지금,\n몸의 어디에 그것이 느껴지는가.\n\n떠오르는 것을 고치려 하지 않습니다.\n좋다,\n나쁘다 이름 붙이지 않습니다.\n그저 날씨를 읽듯이 읽습니다.\n\n이렇게 불러 봅니다.\n마음속으로, 조용히. 아,\n걱정이 와 있구나. 아,\n조급함이 와 있구나. 아,\n가슴이 답답하구나.\n\n나는 불안하다, 가 아니라,\n불안이 지금 여기에 와 있다,\n입니다.\n이 한 끗의 차이가 거리를 만듭니다.\n당신은 불안이 아니라,\n불안을 보고 있는 사람입니다.\n\n감정은 손님입니다. 왔다가,\n머물다가, 갑니다.\n당신은 손님이 아니라,\n그 손님이 지나가는 방입니다.\n\n이제,\n요즘 당신을 가장 무겁게 누르는 일 하나를 떠올려 봅니다.\n가장 크고 아픈 것 말고,\n지금 다룰 수 있을 만한 것으로,\n하나. 그 일을 눈앞에 두고,\n잠시 그대로 둡니다.\n\n이제 언어를 바꿔 보겠습니다.\n내가 왜 그랬지, 대신에,\n그는 왜 그랬을까.\n나는 왜 이걸 이렇게 걱정하고 있지,\n대신에,\n당신의 이름을 넣어서,\n그 사람은 왜 이걸 이렇게 걱정하고 있을까.\n\n당신의 이름을 마음속으로 한 번 불러 봅니다.\n그리고 그 사람의 상황을,\n삼인칭으로 조용히 설명해 봅니다.\n마치 다른 방에서 그 사람을 지켜보는 사람처럼.\n그는 요즘,\n이런 일을 겪고 있다.\n그는 그래서,\n이런 마음이 든다.\n\n어떻습니까. 같은 일인데,\n조금 덜 뜨겁지 않습니까.\n\n이제 이렇게 물어봅니다.\n만약 아주 가까운 친구가 지금 이 일을 겪고 있다면,\n나는 그에게 무슨 말을 해 줄까.\n\n우리는 친구에게는 결코 하지 않을 말을,\n자기 자신에게는 매일 합니다.\n친구에게 건넬 그 말을,\n지금 그 사람에게 그대로 건네 봅니다.\n\n이제 시간을 이동해 보겠습니다.\n숨을 한 번 깊게 들이쉬고,\n길게 내쉽니다.\n\n시간이 흐릅니다.\n한 달이 지나고,\n한 해가 지나고,\n십 년이 흘렀습니다.\n\n십 년 뒤의 당신이 지금 여기 앉아 있습니다.\n조금 더 나이 들었고,\n조금 더 많은 일을 겪었고,\n그래서 조금 더 넓어진 사람입니다.\n그 사람의 눈으로,\n오늘의 이 일을 돌아봅니다.\n\n십 년 뒤의 당신에게 물어봅니다.\n그때 그 일은,\n지금 어떻게 보이나요.\n그때의 나에게,\n무슨 말을 해 주고 싶나요.\n그 일은 결국,\n나에게 무엇을 남겼나요.\n\n같은 일도 한 달 뒤에는 설레다가,\n일주일 앞으로 다가오면 두려워집니다.\n두려움의 크기는 사건의 크기가 아니라,\n사건과의 거리가 정합니다.\n그 십 년 뒤의 시선을,\n잊지 말고 가져옵니다.\n\n이제 공간을 넓혀 보겠습니다.\n지금 앉아 있는 이 방을 떠올립니다.\n그 안에 앉아 있는,\n한 사람.\n\n천천히,\n시선이 위로 올라갑니다.\n천장을 지나, 지붕을 지나,\n건물 전체가 보입니다.\n\n더 올라갑니다. 거리와 골목,\n오가는 사람들, 불빛들.\n그 수많은 창 중 하나에,\n그 사람이 있습니다.\n\n더 올라갑니다.\n도시 전체가 보이고,\n산과 강의 선이 보이고,\n멀리 바다가 보입니다.\n\n더 올라가면 구름,\n그 위의 고요. 아래는,\n푸른 곡선.\n\n여기서 보면,\n오늘의 그 일은 아주 작은 점 하나입니다.\n사라진 것이 아니라,\n제 크기를 되찾은 것입니다.\n\n이 넓은 시야를 기억한 채,\n천천히 다시 내려옵니다.\n구름을 지나, 도시를 지나,\n이 방으로.\n\n여행을 가면 마음이 순해지는 이유,\n산책만 해도 생각이 풀리는 이유가 이것입니다.\n몸이 자리를 옮기면,\n마음도 자리를 옮깁니다.\n\n이제 마지막으로,\n사람을 떠올립니다.\n요즘 당신의 마음을 가장 많이 흔드는 한 사람.\n미워하는 사람일 수도 있고,\n너무 사랑해서 아픈 사람일 수도 있습니다.\n\n그 사람이 당신 앞에 서 있다고 상상합니다.\n얼마나 가까이 있습니까.\n\n이제 그 사람을 미워하지도,\n밀어내지도 않은 채,\n두 걸음만,\n뒤로 물러나 봅니다.\n\n그 사이에 생긴 공간을 느껴 봅니다.\n비어 있고, 조용하고,\n아무 일도 일어나지 않는 공간.\n그 공간에는,\n바람이 지나갑니다.\n\n사원의 기둥들은 서로 떨어져 있어서,\n지붕을 함께 들 수 있습니다.\n참나무와 삼나무는 서로의 그늘에서는 자라지 못합니다.\n이 거리는 관계를 끊는 거리가 아닙니다.\n서로가 자랄 수 있는 거리입니다.\n\n마음속으로 조용히 말해 봅니다.\n당신은, 당신의 자리에.\n나는, 나의 자리에.\n그리고 우리 사이에는,\n숨 쉴 공간이.\n\n이제,\n오늘 만들어 온 거리들을 하나씩 확인합니다.\n생각과 나 사이에 생긴, 틈.\n감정과 나 사이에 생긴, 틈.\n문제와 나 사이에 생긴,\n시간.\n사람과 나 사이에 생긴,\n공간.\n\n이 틈은 도망이 아닙니다.\n이 틈이 있어야,\n선택이 생깁니다.\n자극이 오면 반응이 튀어나오던 자리에,\n이제 아주 짧은 정지가 하나 생겼습니다.\n그 정지가,\n우리를 자유롭게 합니다.\n\n거리두기는 재능이 아니라,\n근육입니다. 오늘 이 시간이,\n한 번의 훈련입니다.\n반복하면 마음의 길이 바뀌고,\n길이 바뀌면,\n삶이 덜 흔들립니다.\n\n이제 숨을 조금 깊게 들이쉽니다.\n길게 내쉽니다.\n손가락을 천천히 움직여 봅니다.\n발가락도 움직여 봅니다.\n어깨를 한 번 돌리고,\n목을 좌우로 가볍게 풀어 줍니다.\n\n준비가 되면,\n천천히 눈을 뜹니다.\n\n같은 방입니다.\n같은 하루입니다.\n그런데 보는 자리가,\n조금 달라졌습니다.\n\n수고하셨습니다.","duration":"약 15분","tags":"#거리두기명상 #마음챙김 #감정돌봄","series":"숨비명상"},{"id":"9e77a6cd","category":"자비희사","title":"나 하나, 너 하나","body":"편안하게 앉아,\n두 눈을 감습니다.\n\n원한다면,\n한 손을 가슴 위에 가만히 얹어 보세요.\n\n지금부터 나에게 보내는 것은 그냥 주의가 아니라,\n다정한 주의라는 것을,\n\n그 손의 온기가 계속 기억하게 해 줄 것입니다.\n\n깊고 편안한 숨을,\n두 번 쉬어 봅니다.\n\n들이쉴 때,\n숨이 몸 구석구석 힘을 채워 주는 것을 느끼고,\n\n내쉴 때,\n숨이 몸을 가만히 쓰다듬어 주는 것을 느낍니다.\n\n이제 호흡이 제 리듬을 찾아가도록 내버려 두세요.\n\n들어오고,\n\n나가고.\n\n그 잔잔한 리듬 위에서,\n요람에 누운 듯 몸이 살짝살짝 흔들리는 것을 허용해 봅니다.\n\n이제 들숨에 마음을 모아 봅니다.\n\n숨이 들어올 때마다,\n따뜻한 것이 함께 들어온다고 느껴 보세요.\n\n친절이어도 좋고,\n위로여도 좋고,\n사랑이어도 좋습니다.\n\n말이 편하다면,\n'괜찮아' 같은 한마디를 숨에 실어 들여보내도 좋습니다.\n\n이것은, 나를 위한 숨입니다.\n\n이제 날숨으로 마음을 옮깁니다.\n\n내쉬는 숨의 그 편안함을 느껴 보세요.\n\n그리고,\n한 사람을 떠올려 봅니다.\n\n내가 사랑하는 사람,\n혹은 지금 힘든 시간을 지나고 있어서 따뜻함이 필요한 사람.\n\n그 사람을 마음속에 선명하게 그려 봅니다.\n\n이제 내쉬는 숨을,\n그 사람에게로 보내 보세요.\n\n날숨의 편안함이 그 사람에게 가 닿습니다.\n\n숨을 내쉴 때마다,\n친절과 따뜻함이 그 사람에게로 흘러갑니다.\n\n이제 이 두 가지를 하나로 잇습니다.\n\n나를 위해 들이쉬고,\n당신을 위해 내쉬고.\n\n나 하나,\n\n너 하나.\n\n들이쉬며 나를 채우고,\n내쉬며 너에게 보냅니다.\n\n나 하나,\n\n너 하나.\n\n비율은 자유롭게 맞추어도 됩니다.\n\n오늘 내가 많이 지쳤다면,\n나를 위해 두 번,\n너를 위해 한 번.\n\n그 사람이 많이 힘들다면,\n나를 위해 한 번,\n너를 위해 세 번.\n\n그냥 반반이어도 좋습니다.\n\n지금 이 순간,\n나에게 알맞게 느껴지는 대로 쉬면 됩니다.\n\n이제,\n애쓰는 마음을 모두 내려놓습니다.\n\n주려고 애쓰지 않아도,\n받으려고 애쓰지 않아도,\n\n숨은 저절로 들어오고,\n저절로 나갑니다.\n\n바닷물이 경계 없이 밀려왔다 밀려가듯이.\n\n들어오는 숨과 나가는 숨,\n나와 너 사이에,\n금이 없어집니다.\n\n우리는 지금,\n크고 따뜻한 바다의 한 부분입니다.\n\n이제 호흡도 내려놓고,\n명상도 내려놓습니다.\n\n지금 느껴지는 것을 그대로 느끼고,\n\n지금 있는 그대로의 나로,\n그냥 있어 봅니다.","duration":"약 15분","tags":"#자비희사 #연민명상 #숨나누기","series":"숨비명상"},{"id":"8d1f0a27","category":"탈중심화","title":"마음의 이름","body":"편안한 자리에 앉아 보세요.\n허리는 부드럽게 세우고,\n어깨의 힘은 살며시 내려놓습니다.\n눈은 편안하게 감아도 좋고,\n살짝 떠 두어도 괜찮습니다.\n\n숨을 한 번,\n깊게 들이쉬어 보세요.\n그리고 천천히,\n길게 내쉬어 봅니다.\n한 번 더, 들이쉬고,\n내쉽니다.\n\n몸 어딘가에 아직 힘이 남아 있어도 괜찮습니다.\n지금 이대로, 충분합니다.\n\n이제 한 손을 가슴 위에 가만히 얹어 보세요.\n손바닥의 온기가 가슴에 스며드는 것을 느껴 봅니다.\n따뜻한 손이,\n따뜻한 가슴을 만나고 있습니다.\n\n그 온기 아래로 숨이 드나드는 것을 느껴 보세요.\n숨이 들어올 때,\n가슴이 조금 부풀고,\n숨이 나갈 때,\n가슴이 살며시 내려앉습니다.\n파도가 밀려왔다,\n물러가는 것처럼.\n\n몇 번의 숨을,\n그렇게 바라봅니다.\n\n이제 손은 무릎 위에 편안히 내려놓아도 좋습니다.\n주의는 그대로,\n가슴에 남겨 둡니다.\n\n그리고 마음속으로 가만히 물어봅니다.\n지금,\n나는 무엇을 느끼고 있을까.\n\n서둘러 답하지 않아도 됩니다.\n몸이 조용히 알려 줄 때까지,\n기다려 봅니다.\n가슴이 조금 답답한지,\n따뜻한지, 어딘가 묵직한지.\n아주 작은 속삭임 같은 느낌이라도 좋습니다.\n\n지금 가장 크게 느껴지는 마음이 있다면,\n그 마음에 이름을 붙여 봅니다.\n어쩌면 걱정일 수도 있고,\n서운함일 수도 있습니다.\n쓸쓸함, 설렘, 미안함,\n혹은 그냥 담담함일 수도 있습니다.\n\n아무 느낌이 없다면,\n그것은 편안함인지도 모릅니다.\n무엇이든,\n틀린 답은 없습니다.\n\n이름을 찾았다면,\n마음속으로 가만히 불러 봅니다.\n아, 걱정이구나.\n걱정이 여기 있구나.\n\n좋아하는 사람의 이름을 부르듯,\n다정한 목소리로 두세 번,\n천천히 불러 줍니다.\n\n신기하게도,\n이름을 불러 주면 감정은 조금 순해집니다.\n누군가 내 이름을 다정하게 불러 줄 때,\n마음이 스르르 풀리는 것처럼.\n그 감정도 지금,\n자기 이름이 불리기를 기다리고 있었는지 모릅니다.\n\n그 느낌이 몸 어디에 머물고 있는지 살펴봐도 좋습니다.\n가슴인지, 목인지, 배인지.\n그 자리에 숨을 보내며 속으로 말해 줍니다.\n괜찮아. 여기 있어도 괜찮아.\n\n밀어내지 않고,\n그냥 곁에
