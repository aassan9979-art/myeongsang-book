께 명상을 마무리합니다.\n차는 사람들과 대화하면서 마시는 것도 좋지만,\n혼자 마실 수 있는 기회를 만들어 마음을 편안하게 하는 힐링시간을 갖으면 좋습니다.\n\n차 명상은 많은 감각들을 느낄 수 있고,\n마음을 살펴보는 좋은 기회가 됩니다.","duration":"약 8분","tags":"#차명상 #오감알아차림 #일상속쉼","series":"숨비명상"},{"id":"4e0e910d","category":"움직임명상","title":"발끝의 여행","body":"명상은 앉아서만 하는 것이 아닙니다.\n출근길에도, 퇴근길에도,\n산책하는 동안에도 할 수 있습니다.\n오늘은 걸으면서 하는 명상,\n매일 걷던 길이 특별한 여행이 되는 시간을 함께해 보겠습니다.\n\n운동화 끈을 단단히 조이고,\n자연과 가까운 곳을 찾아가 봅니다.\n산도 좋고, 바다도 좋고,\n집 앞 작은 공원도 좋습니다.\n가까이에 자연이 없다면,\n지금 걷는 이 길이 아름다운 숲길이라고 상상해 보아도 좋습니다.\n집 안을 천천히 걸어도 충분합니다.\n\n이제 걷기 시작합니다.\n평소보다 훨씬 천천히,\n한 걸음, 한 걸음. 오른발,\n왼발, 오른발, 왼발.\n\n걷는 동안 내 몸에서 느껴지는 감각을 가만히 살펴봅니다.\n발이 땅에 닿을 때마다 발바닥에 전해지는 느낌.\n바닥의 단단함,\n발에 실리는 무게.\n한 발이 땅을 딛는 동안 다른 발이 가볍게 떠오르는,\n그 리듬을 느껴 봅니다.\n\n걷다가 어떤 생각이 떠오를 수 있습니다.\n밀어내지 않아도 되고,\n따라 들어가지 않아도 됩니다.\n아,\n내가 이런 생각을 하고 있구나.\n그렇게 알아차리고,\n발걸음으로 돌아옵니다.\n생각은 바람처럼 왔다가 지나갑니다.\n\n이제 귀를 열어 봅니다.\n걸음 곁으로 찾아오는 소리들.\n새소리일 수도,\n자동차 소리일 수도 있습니다.\n시끄러운 소리가 들려도 괜찮습니다.\n아,\n저런 소리가 나고 있구나.\n그렇게 맞이하고,\n흘려보냅니다.\n소리 때문에 마음이 일렁인다면,\n그 마음도 같은 길로 흘려보냅니다.\n\n이번에는 코끝으로 주의를 옮겨 봅니다.\n걸음에 맞춰 공기가 코로 들어오고,\n코로 나갑니다.\n너무 당연해서 한 번도 고마운 줄 몰랐던 공기.\n하지만 단 한순간도 나를 떠난 적 없는 소중한 공기를,\n반갑고 기쁘게 맞이해 봅니다.\n\n이제 자유롭게 걸어 봅니다.\n걸음이 저도 모르게 빨라지지는 않았는지,\n몸에 불편한 곳은 없는지 가끔씩 살펴보면서,\n발바닥의 감각과 바람과 소리와 함께 나의 속도로 걷습니다.\n\n문득 주위를 둘러봅니다.\n매일 지나치던 익숙한 길인데,\n오늘은 조금 다르게 보입니다.\n여태 보이지 않던 것들이 하나둘 눈에 들어옵니다.\n담장 밑의 작은 풀,\n나뭇잎 사이로 흔들리는 빛.\n\n여행이 즐거운 것은 낯선 곳에서 처음 마주하는 새로운 나의 감정과 모습이 신기하고 반갑기 때문입니다.\n그렇다면 지금 이 길도 이미 여행입니다.\n새로운 눈으로 걷는 순간,\n평범했던 하루가 즐겁고 특별한 여행이 됩니다.\n\n이 여행은 언제든 다시 떠날 수 있습니다.\n필요한 것은 운동화 한 켤레와,\n천천히 걷겠다는 마음뿐입니다.\n오늘의 발걸음이 남은 하루를 가볍게 데려다줄 것입니다.\n\n\n\n------------\n걷기명상\n\n명상은 앉아서 하는 것도 좋지만 출근길이나 퇴근길,\n산책하면서 걷는 동안에도 가능합니다.\n움직이면서 감각을 사용하는 걷기명상은 당연하다고 생각했던 것들이 경의로워지고 특별해지는 경험이 됩니다.\n\n오늘은 걷기명상을 해보겠습니다.\n\n운동화 끈을 단단하게 조이고,\n최대한 자연과 가까운 곳을 찾아갑니다.\n산, 바다,\n집 앞 공원도 좋습니다.\n주변에 자연이 없다면 지금 내가 걷고 있는 이 공간이 아름다운 자연 속이라고 상상해보셔도 좋습니다.\n집 안을 천천히 걸어도 좋습니다.\n\n최대한 천천히 한 걸음 한 걸음 걸어봅니다.\n오른발, 왼발, 오른발,\n왼발… 걷는 동안 내 몸에서 느껴지는 감각을 관찰해 봅니다.\n발을 땅에 디딜때마다 느껴지는 발바닥의 감각,\n걸을 때 느껴지는 내 발에 무게감,\n내 몸의 움직임들을 살펴봅니다.\n\n걷다가 어떤 생각이 떠오르면 거부하거나 그 생각 안으로 깊이 들어가지 말고,\n\"아, 내가 이런 생각을 하고 있구나\" 하고 자연스럽게 흘려보냅니다.\n\n이제,\n소리에 귀를 기울여 봅니다.\n시끄러운 소리가 난다면,\n\"아, 저런 소리가 나고 있구나\" 하고 그냥 흘려보냅니다.\n그 소리 때문에 어떤 감정이 생긴다면,\n그 감정 또한 흘려보냅니다.\n\n이번에는 코에서 느껴지는 공기의 흐름을 관찰해 봅니다.\n공기가 코로 들어오고 코로 나갑니다.\n당연하다고 생각했던 공기,\n하지만 절대 당연하지 않은 소중한 공기를 반갑고 기쁘게 맞이해 봅니다.\n\n걸음이 빨라지지는 않았는지,\n몸에 불편한 곳은 없는지도 살펴보면서 자유롭게 걷기명상을 계속합니다.\n\n걷기명상은 매일 지나치는 익숙한 길들을 새로운 눈으로 낯설게 관찰할수 있게 합니다.\n여태 보이지 않던 아름다움이 보이기 시작하고,\n평범했던 일상은 즐겁고 특별한 여행이 됩니다.\n\n여행이 즐거운 이유는 낯선 장소에서 새로운 경험을 하며 처음 마주하는 내 감정,\n내 모습이 재미있고 신기하기 때문입니다.","duration":"약 8분","tags":"#걷기명상 #일상명상 #오감알아차림","series":"숨비명상"},{"id":"76193ef4","category":"용서감사","title":"용서의 씨앗","body":"마음속에 오래 담아 둔 미움과 분노는,\n누구보다 나 자신을 가장 아프게 합니다.\n그 무거움을 내려놓는 길이 바로 용서입니다.\n\n용서는 세 갈래의 길을 지납니다.\n내가 상처 준 사람에게 용서를 구하고,\n나에게 상처 준 사람을 용서하고,\n마지막으로 나 자신을 용서하는 길입니다.\n오늘 그 길을 천천히 함께 걸어 보겠습니다.\n가슴에 작은 씨앗 하나를 심는다는 마음이면 충분합니다.\n\n편안한 자세로 앉아서 부드럽게 눈을 감습니다.\n호흡에 주의를 기울이며 숨을 들이쉬고,\n내쉽니다. 들이쉬고, 내쉬고.\n들이쉬고, 내쉬고.\n숨결이 고요해질 때까지 잠시 머뭅니다.\n\n먼저,\n내가 다른 사람에게 말로,\n생각으로,\n행동으로 상처를 주었던 상황을 떠올려 봅니다.\n그때 그 사람이 느꼈을 아픔과 실망을 가만히 헤아려 봅니다.\n\n이제 그 사람을 향해 천천히 따라 해 주세요.\n소리 낼 수 없다면 마음속으로 따라 해도 좋습니다.\n\n지금 당신에게 용서를 구합니다.\n나를 용서해 주세요.\n\n진심을 담아,\n이 말을 몇 번이고 반복합니다.\n말이 오갈 때마다 가슴이 조금씩 가벼워집니다.\n\n다음은,\n나에게 상처를 준 사람을 용서할 차례입니다.\n이 길에서는 서두르지 않는 것이 가장 중요합니다.\n\n내가 어떻게 상처받았는지,\n가장 또렷하게 기억나는 한 장면을 떠올려 봅니다.\n너무 크고 깊은 상처라면,\n아직 꺼내지 않아도 됩니다.\n오늘 마주할 수 있을 만큼의 기억이면 충분합니다.\n\n그 기억과 함께 몸에서,\n가슴에서,\n마음에서 올라오는 아픔을 온화하게 맞이해 봅니다.\n아픔을 없애려 하지 않고,\n다만 곁에 두고 바라봅니다.\n\n이제 마음속으로 그 사람의 이름을 조용히 부릅니다.\n그리고 용서의 말을 건넵니다.\n천천히 따라 해 주세요.\n\n나는 사람들이 두려움과 고통,\n혼란과 분노 때문에 나에게 상처를 주었던 여러 순간들을 기억합니다.\n\n나는 이 아픔을 오랫동안 가슴속에 지닌 채 살아왔습니다.\n\n그렇지만 내가 할 수 있는 만큼,\n당신에게 용서의 마음을 전합니다.\n\n당신을 용서합니다.\n\n지금 다 용서되지 않아도 괜찮습니다.\n할 수 있는 만큼이면,\n오늘은 충분합니다.\n\n마지막으로,\n상처받은 나 자신을 용서할 차례입니다.\n\n내가 나에게 고통과 괴로움을 안겨 주었던 일들을 천천히 떠올려 봅니다.\n스스로를 몰아세우고, 탓하고,\n아프게 했던 시간들.\n그 시간을 지나며 몸과 가슴과 마음에 남은 아픔과 슬픔과 부끄러움을,\n있는 그대로 인정해 봅니다.\n\n이제 나에게 용서의 말을 건넵니다.\n천천히 따라 해 주세요.\n\n내가 나에게 어떻게 상처를 주었는지,\n이제는 알고 느낍니다.\n지금 나는, 나를 용서합니다.\n\n이 말을 몇 번이고 나에게 다시 보내 줍니다.\n지금 이 마음이 용서의 씨앗이 됩니다.\n\n이제 나와 타인에 대한 생각을 모두 살며시 내려놓습니다.\n텅 빈 고요 속에서 숨을 한 번 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되면 천천히 눈을 뜹니다.\n\n용서는 미움에 찬 마음을 내려놓는 일입니다.\n분노와 두려움이 더는 자라나지 않게 하는 일입니다.\n오늘 심은 이 작은 씨앗은,\n같은 자리에 다시 앉을 때마다 조금씩 자라날 것입니다.\n그리고 어느 날,\n온전히 사랑하려는 마음이 용서의 꽃으로 피어날 것입니다.\n\n\n-------------\n\n용서명상 우리 마음속에 분노와 적개심이 있으면 절대로 평화를 찾지 못합니다.\n고통에서 벗어나는 길은 우리 자신과 다른 사람들을 용서하고,\n고통의 원인이 된 사건을 용서하는 것입니다.\n우리가 상처받은 진짜 감정을 숨긴다면,\n영원히 용서하지 못할 것입니다.\n우리 모두는 크든 작든 용서라는 치유의 샘물을 찾을 필요가 있습니다.\n오늘은 용서 명상을 해보도록 하겠습니다.\n편안한 자세로 앉아서 부드럽게 눈을 감습니다.\n호흡에 주의를 기울이면서 숨을 들이쉬고 내쉽니다.\n들이쉬고~ 내쉬고~ 들이쉬고~ 내쉬고~ 들이쉬고~ 내쉬고~ 먼저,\n내가 다른 사람에게 말로,\n생각으로,\n행동으로 상처를 준 상황을 떠올려 봅니다.\n그 사람이 느꼈을 상처,\n실망, 배신을 느껴봅니다.\n그리고 천천히 따라해주세요.\n소리낼 수 없으면 마음속으로 따라해도 좋습니다.\n“지금 당신에게 용서를 구합니다. \\ 나를 용서해주세요.” 진심을 담아 이 말을 반복합니다.\n(30초 후) 다음은,\n나에게 상처를 입힌 사람을 용서합니다.\n이 단계에서는 서두르지 않는 것이 중요합니다.\n자신이 어떻게 상처받았는지 가장 완벽하게 기억나는 구체적인 상황을 자세히 회상합니다.\n온화하게 수용하는 태도로 몸,\n가슴,\n마음에서 표현되는 고통을 느껴봅니다.\n(30초 후) 이제,\n마음속으로 그 사람의 이름을 속삭이며 용서의 메시지를 보냅니다.\n천천히 따라해주세요.\n“나는 사람들이 두려움과 고통, \\ 혼란과 분노 때문에 나에게 해를 입힌 \\ 여러 가지 방식에 대해 기억합니다. 나는 이 고통을 오랫동안 \\ 가슴속에 지닌 채 살았습니다. 그렇지만 내가 할 수 있는 만큼 \\ 당신에게 용서의 마음을 전합니다. 나에게 해를 입힌 사람들에게 \\ 용서를 전합니다. 당신을 용서합니다.” 마지막으로 상처받은 자기 자신을 용서합니다.\n천천히 자신이 스스로 고통과 괴로움을 안겨주었던 일들을 떠올려봅니다.\n그리고 몸과 마음과 정신에 상처를 주면서 지금까지 겪은 고통을 고스란히 느껴봅니다.\n자신의 몸에, 가슴에,\n마음에 여전히 남아 있는 고통,\n슬픔, 수치심을 인정합니다.\n(30초 후) 이제 천천히 따라해주세요.\n“내가 나에게 어떻게 상처를 주었는지 \\ 이제는 알고 느낍니다. 지금 나는 나를 용서합니다.” 용서의 메시지를 반복해서 보냅니다.\n지금 이 마음은 용서의 씨앗이 될 것입니다.\n이제 자신과 타인에 대한 생각을 모두 내려놓습니다.\n종소리와 함께 명상을 마무리합니다.\n천천히 눈을 뜹니다.\n용서는 증오에 찬 비난을 내려놓는 것입니다.\n분노하고 두려워하는 마음이 더 이상 확대되지 않는다는 의미입니다.\n인내심을 갖고 용서명상을 꾸준히 하면,\n우리의 온전히 사랑하려는 의도가 용서의 마음으로 꽃필 것입니다.","duration":"약 12분","tags":"#용서명상 #자기용서 #마음치유","series":"숨비명상"},{"id":"d84952c7","category":"수면·이완","title":"오늘의 메아리","body":"하루가 저물었습니다.\n오늘 나는 세상으로 무엇을 내보냈을까요.\n오늘은 그 물음 하나를 품고,\n조용한 골짜기로 잠시 다녀오려 합니다.\n\n편안한 자리에 앉거나 누워 보세요.\n어깨의 힘을 내려놓고,\n준비가 되면 살며시 눈을 감습니다.\n\n코로 천천히 숨을 들이쉬고,\n입으로 길게 내쉽니다.\n내쉬는 숨을 따라 하루의 분주함이 조금씩 빠져나갑니다.\n한 번 더 들이쉬고,\n길게 내쉽니다.\n몸이 자리에 편안히 내려앉는 것을 느껴 봅니다.\n\n이제 마음속에 고요한 산속 풍경을 떠올려 봅니다.\n나는 지금 넓은 골짜기 앞에 서 있습니다.\n공기는 맑고 서늘하며,\n발밑에는 부드러운 흙이 밟힙니다.\n사방이 아주 고요합니다.\n\n이 골짜기에는 한 가지 신기한 이치가 있습니다.\n내가 소리를 내면,\n잠시 뒤에 꼭 그 소리가 되돌아옵니다.\n내보낸 적 없는 소리는 결코 돌아오지 않습니다.\n돌아오는 것은 언제나,\n내가 내보낸 것뿐입니다.\n\n이 골짜기 앞에서,\n오늘 하루를 천천히 돌아봅니다.\n오늘 나는 어떤 말을 내보냈나요.\n누군가에게 건넨 따뜻한 한마디가 있었나요.\n나도 모르게 튀어나온 뾰족한 말이 있었나요.\n\n오늘 나는 어떤 표정을 내보냈나요.\n스치듯 지은 미소,\n혹은 굳어 있던 얼굴.\n\n그리고 아무도 보지 못했지만,\n마음속으로 내보낸 것들도 가만히 헤아려 봅니다.\n고마움이었을 수도 있고,\n미움이나 걱정이었을 수도 있습니다.\n\n무엇이 떠오르든 괜찮습니다.\n잘했다,\n못했다 따지려는 것이 아닙니다.\n아,\n오늘 나는 이런 것들을 내보냈구나.\n그렇게 알아차리는 것만으로,\n충분합니다.\n\n이제 잠들기 전,\n이 골짜기에 마지막으로 내보낼 것을 하나 골라 봅니다.\n오늘 고마웠던 사람 한 명을 떠올립니다.\n그 사람의 얼굴을 그리며,\n골짜기를 향해 마음속으로 말해 봅니다.\n\n고맙습니다.\n당신 덕분에 오늘이 조금 더 따뜻했습니다.\n\n그 말이 골짜기 너머로 멀리 퍼져 나갑니다.\n그리고 잠시 뒤,\n메아리가 되어 돌아옵니다.\n내가 내보낸 따뜻함이 가슴 한가운데로 가만히 되돌아와 앉습니다.\n\n그 온기를 느껴 봅니다.\n신기한 일입니다.\n분명 내가 건넨 마음인데,\n받은 사람처럼 가슴이 따뜻해집니다.\n내보내는 것이 곧 돌아오는 것임을,\n지금 이 가슴이 먼저 알고 있습니다.\n\n이 따뜻함을 안고,\n내일을 향해 작은 마음 하나를 정해 봅니다.\n내일 아침,\n가장 먼저 내보내고 싶은 것은 무엇인가요.\n밝은 인사 한마디,\n부드러운 표정,\n누군가를 향한 고마움.\n그 하나를 가슴 주머니에 넣어 둡니다.\n\n이제 골짜기를 뒤로하고,\n천천히 돌아올 시간입니다.\n숨을 한 번 깊이 들이쉬고,\n길게 내쉽니다.\n손끝과 발끝을 가볍게 움직여 봅니다.\n\n이대로 잠들어도 좋습니다.\n눈을 뜬다면,\n머리맡에 오늘 내보낸 것들을 한 줄 적어 보아도 좋습니다.\n\n기억해 주세요.\n내일 나에게 돌아올 메아리는,\n내일 내가 내보낼 첫 마음에서 시작됩니다.\n편안한 밤 되세요.","duration":"약 9분","tags":"#저녁명상 #마음돌아보기 #감사명상","series":"숨비명상"},{"id":"39343d69","category":"관찰","title":"처음 보는 눈","body":"우리 눈은 늘 보던 것을 다시 보지 않습니다.\n아, 그거지.\n그렇게 아는 순간,\n눈은 뜨고 있어도 보기를 멈춥니다.\n오늘은 그 멈춘 눈을 다시 깨우는 시간을 가져 보겠습니다.\n\n편안한 자세로 앉아 보세요.\n허리는 가볍게 세우고,\n어깨는 부드럽게 내려놓습니다.\n준비가 되면 천천히 눈을 감습니다.\n\n코로 숨을 들이쉬고,\n길게 내쉽니다.\n들어오는 이 숨도,\n방금 나간 숨과는 다른 새 숨입니다.\n한 번 더 들이쉬고,\n내쉬면서,\n몸을 지금 이 자리에 가만히 내려놓습니다.\n\n이제 마음속으로 강가에 서 봅니다.\n넓은 강이 내 앞을 흐르고 있습니다.\n물 흐르는 소리가 잔잔하게 들려오고,\n강바람이 뺨을 시원하게 스칩니다.\n\n흐르는 물을 가만히 바라봅니다.\n햇빛을 받아 반짝이며 지나가는 물결.\n지금 내 앞을 지나는 이 물은,\n어제 흐르던 그 물이 아닙니다.\n조금 전에 지나간 물도 이미 저 아래로 떠났습니다.\n같은 강인데,\n단 한 순간도 같은 물이 흐른 적이 없습니다.\n\n강가에는 꽃 한 송이가 피어 있습니다.\n해마다 봄이면 피던 자리입니다.\n그런데 이 꽃은 작년의 그 꽃이 아닙니다.\n올해 처음,\n세상에 온 꽃입니다.\n처음 온 꽃을 처음 보는 눈으로 바라봅니다.\n꽃잎의 결,\n빛깔의 깊이가 새롭게 눈에 들어옵니다.\n\n문득 알게 됩니다. 강도,\n꽃도, 늘 새것이었는데,\n같은 것이라 여긴 내 생각이 새것을 가리고 있었다는 것을.\n안다고 여기는 순간,\n꽃은 피어 있어도 나에게는 없는 것과 같았습니다.\n\n이제 이 새로운 눈으로 나의 하루를 바라봅니다.\n매일 걷는 길,\n매일 마주하는 얼굴,\n창밖의 익숙한 풍경.\n사실은 그 모든 것이 오늘 처음 만나는 것들입니다.\n어제의 그 사람과 오늘의 그 사람은 같은 사람이 아니고,\n어제의 하늘과 오늘의 하늘도 같은 하늘이 아닙니다.\n\n그렇게 생각하니,\n세상이 잠깐 새것처럼 반짝입니다.\n낡은 줄 알았던 하루가 방금 도착한 선물처럼 느껴집니다.\n가슴 어딘가에 설렘과 고마움이 은은하게 번져 옵니다.\n\n그 느낌을 안은 채,\n천천히 돌아올 준비를 합니다.\n숨을 한 번 깊이 들이쉬고,\n길게 내쉽니다.\n손끝과 발끝을 가볍게 움직여 봅니다.\n\n그리고 눈을 뜰 때,\n작은 실험을 하나 해 봅니다.\n지금 있는 이 공간을,\n난생처음 와 본 곳처럼 바라보는 것입니다.\n준비가 되면,\n천천히 눈을 떠 보세요.\n\n어떤가요.\n늘 있던 것들이 조금 다르게 보이나요.\n잘 보이지 않아도 괜찮습니다.\n처음 보는 눈은 연습할수록 밝아집니다.\n오늘 하루,\n익숙한 것 하나를 처음 보듯 바라보는 순간이 한 번이라도 있다면,\n그날의 꽃은 비로소 나에게 피어난 것입니다.","duration":"약 8분","tags":"#마음챙김 #새롭게보기 #관찰명상","series":"숨비명상"},{"id":"4e619dc0","category":"움직임명상","title":"마음의 거울","body":"오늘은 칭찬을 건네는 시간을 가져 보겠습니다.\n잘한 일에 대한 칭찬이 아니라,\n있어 준 것에 대한 칭찬입니다.\n아무것도 하지 않아도 이미 귀한 존재들에게,\n그리고 나 자신에게.\n\n편안한 자세로 앉아 보세요.\n허리는 가볍게 세우고,\n어깨의 힘은 살며시 내려놓습니다.\n준비가 되면 천천히 눈을 감습니다.\n\n코로 숨을 들이쉬고,\n길게 내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다. 숨이 잔잔해질수록,\n마음도 함께 잔잔해집니다.\n\n이제 내 마음이 고요한 거울이 되었다고 상상해 봅니다.\n바람 한 점 없는 날의 호수처럼 맑은 거울입니다.\n이 거울은 아무것도 판단하지 않습니다.\n잘했다고도,\n못했다고도 하지 않고,\n다만 있는 그대로를 비출 뿐입니다.\n\n이 거울 앞에,\n소중한 사람 한 명을 초대해 봅니다.\n가족일 수도 있고,\n친구나 동료일 수도 있습니다.\n지금 떠오르는 그 한 사람이면 충분합니다.\n\n거울에 비친 그 사람을 가만히 바라봅니다.\n그 사람이 이룬 것들,\n잘한 일들,\n나에게 해 준 것들은 잠시 내려놓습니다.\n아무것도 걸치지 않은,\n존재 그대로의 모습만 거울에 남깁니다.\n\n그리고 알아차립니다. 아,\n이 사람이 지금 여기 있구나.\n나와 같은 시간을,\n같은 세상에서 살아 주고 있구나.\n\n그것만으로 가슴 어딘가가 조용히 차오릅니다.\n이제 그 사람을 향해 마음속으로 말을 건넵니다.\n\n당신이 있어 줘서,\n고맙습니다.\n무언가를 해 줘서가 아니라,\n그냥 있어 줘서, 고맙습니다.\n\n그 말을 들은 그 사람의 얼굴이 거울 속에서 부드럽게 풀어지는 것을 바라봅니다.\n존재가 존재에게 건네는 인사는,\n이렇게 서로를 환하게 합니다.\n\n이제 그 사람을 따뜻하게 배웅하고,\n거울 앞에 한 사람을 더 초대합니다.\n이번에는, 나 자신입니다.\n\n거울에 비친 나를 가만히 바라봅니다.\n잘한 일도,\n부족했던 일도 잠시 내려놓습니다.\n이룬 것도,\n못 이룬 것도 다 내려놓고,\n그냥 여기 있는 나만 바라봅니다.\n\n우리는 스스로에게 가장 인색한 거울이었는지도 모릅니다.\n잘했을 때만 비춰 주고,\n못했을 때는 흐리게 비추던 거울.\n오늘은 그 판단을 모두 걷어 내고,\n맑은 거울로 나를 비춥니다.\n\n그리고 나에게도 같은 인사를 건넵니다.\n\n네가 있어 줘서, 고마워.\n잘해서가 아니라,\n그냥 있어 줘서, 고마워.\n\n이 말이 낯설고 쑥스러워도 괜찮습니다.\n받는 연습이 처음이라 그런 것뿐입니다.\n한 번 더,\n천천히 건네 봅니다.\n네가 있어 줘서, 고마워.\n\n가슴에 번지는 온기를 잠시 느껴 봅니다.\n그리고 문득 둘러보면,\n나를 둘러싼 모든 것이 저마다의 자리에서 있어 주고 있습니다.\n곁을 지키는 반려동물,\n오늘의 밥 한 그릇,\n몸을 감싸 준 옷 한 벌까지.\n그 모두에게 마음속으로 가볍게 고마움을 건넵니다.\n\n이제 천천히 돌아올 준비를 합니다.\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n손끝과 발끝을 가볍게 움직여 봅니다.\n준비가 되면,\n살며시 눈을 뜹니다.\n\n오늘 하루,\n소중한 사람에게 기회가 닿는다면 오늘의 인사를 소리 내어 전해 보아도 좋습니다.\n당신이 있어 줘서 고맙다고.\n그 한마디가,\n서로를 비추는 가장 맑은 거울이 되어 줄 것입니다.","duration":"약 9분","tags":"#존재칭찬 #관계명상 #자기사랑","series":"숨비명상"},{"id":"acf1813d","category":"움직임명상","title":"스스로 느끼게 하는 칭찬 명상","body":"■ 이 기법의 원리 말로 전해준 칭찬은 잠깐 기쁘지만 곧 잊힙니다.\n스스로 몸으로 느껴 깨달은 것은 자기 것이 되어 남습니다.\n그래서 이 기법은 결론을 진행자가 내려주지 않습니다.\n관찰이라는 씨앗만 심고,\n열린 질문으로 물을 준 뒤,\n침묵 속에서 상대가 직접 답을 발견하게 둡니다.\n지관(止觀),\n판단 없이 지켜보고 스스로 알아차리는 수행의 방식입니다.\n\n■ 1단계 — 행동으로 칭찬하기 (판단 없는 관찰의 씨앗) 평가하지 않습니다.\n결론짓지 않습니다.\n내가 본 행동 하나만, 짧게,\n판단 없이 건넵니다.\n그리고 곧바로 침묵합니다.\n설명을 덧붙이지 않는 것이 핵심입니다.\n\n예시 - \"아까 힘들었을 텐데 끝까지 자리를 지키더라. 나는 그걸 봤어.\" - \"아무도 안 볼 때 조용히 정리하는 걸 봤어.\" - \"네 말을 듣고 상대가 표정이 풀리더라. 그 순간을 봤어.\"\n\n말한 뒤 곧바로 \"그러니까 넌 대단해\" 같은 결론을 붙이지 않습니다.\n씨앗만 심고 멈춥니다.\n나머지는 명상 안에서 스스로 자랍니다.\n\n■ 2단계 — 눈을 감게 하기 \"이제 편하게 눈을 감아볼게요.\" \"방금 들은 그 말은 판단이 아니라, 그냥 본 것이었어요.\" \"그 말이 몸 어디에 닿았는지, 지금부터 스스로 찾아볼 거예요.\"\n\n■ 3단계 — 스스로 느끼게 하는 명상 스크립트 아래 스크립트를 천천히,\n한 줄에 한 호흡으로 읽어줍니다.\n질문 뒤에는 특히 길게,\n7~10초 침묵을 둡니다.\n답을 말해주지 마세요.\n상대가 스스로 도착할 시간을 주는 것이 이 명상의 전부입니다.\n\n─────────────────────────────\n내 안에서 올라오는 대답\n\n눈을 감고 숨이 드나드는 것을 바라봅니다\n방금 누군가 당신이 한 일을 그대로 말해주었습니다\n\n그 말을 다시 마음속에 가만히 떠올려봅니다\n그 말을 들었을 때\n몸의 어느 곳이 반응했나요\n가슴인가요\n아니면 목이나 눈가인가요\n\n그 자리를 찾았다면\n그곳에 조용히 숨을 보내봅니다\n서두르지 않습니다\n\n그곳이 따뜻한가요\n간지러운가요\n아니면 조금 뭉클한가요\n이름 붙이지 않아도 됩니다\n그저 느껴봅니다\n\n이제 스스로에게 물어봅니다\n나는 지금 이 느낌을\n누가 잘했다고 말해줘서 느끼는 걸까요\n아니면 그냥 내 안에 원래 있던 것이\n비춰져서 드러난 걸까요\n답하지 않아도 됩니다\n\n질문만 안고 숨을 쉽니다\n들이쉬고\n내쉬고\n\n한 가지만 더 물어봅니다\n이 따뜻함은 누가 준 것일까요\n밖에서 온 것일까요\n아니면 내가 원래 가지고 있던 것을\n이제야 알아차린 것일까요\n\n숨이 대신 대답하게 둡니다\n들이쉴 때 그 자리가 차오르고\n내쉴 때 온몸으로 번집니다\n\n무언가 알아차려졌다면\n그것을 붙잡지 말고\n그냥 그 자리에 두세요\n\n당신은 방금 누가 말해준 것이 아니라\n스스로 느낀 것입니다\n그래서 이것은 사라지지 않습니다\n이미 당신 것이었으니까요\n\n준비가 되면\n그 느낌을 가슴에 담은 채\n천천히 눈을 뜹니다\n\n■ 진행자를 위한 안내\n- 질문 뒤 침묵이 이 기법의 핵심입니다. 어색해도 참고 기다려 주세요. 답을 채워주면 명상이 무너집니다.\n- 1단계 관찰은 짧을수록 좋습니다. 길게 설명하면 그 자체가 평가가 됩니다.\n- 명상이 끝난 뒤에도 \"어땠어?\"라고 캐묻지 마세요. \"느낀 게 있으면 그건 네 거야\" 정도로 닫습니다.\n- 혼자 할 때는 오늘 내가 한 행동 하나를 판단 없이 떠올린 뒤, 그대로 이 질문들을 스스로에게 던지면 됩니다.\n- 자녀·직장·선후배 어느 대상에게나 그대로 쓸 수 있습니다. 앞서 만든 대상별 문서의 1단계 예시를 씨앗으로 가져와 결합해도 좋습니다.","duration":"약 10분","tags":"칭찬 느끼기","series":"숨비명상"},{"id":"77733c9e","category":"움직임명상","title":"있는 그대로 비춰지는 자리","body":"존재를 비추는 칭찬 명상 — 자녀편 법상 스님의 \"행위가 아닌 존재를 칭찬하라\"(보현행원 칭찬여래원)를 바탕으로,\n판단 없이 관찰한 행동을 그대로 비춰주며 존재를 인정한 뒤,\n눈을 감기고 명상 스크립트를 전달하는 기법입니다.\n\n■ 이 기법의 원리 핵심은 \"잘했다\"는 판단이 아니라,\n지켜본 것을 그대로 비춰주는 것입니다.\n\"착하다\" \"똑똑하다\" 같은 평가는 아이를 외적 승인에 매달리게 하지만,\n내가 본 아이의 행동을 판단 없이 묘사해주면 아이는 \"있는 그대로 받아들여졌다\"고 느낍니다.\n그 안전함 위에서 눈을 감을 때,\n명상은 비로소 깊어집니다.\n\n\n■ 1단계 — 행동으로 칭찬하기 (판단 없는 관찰) \"잘했어\"가 아니라,\n실제로 본 행동을 그대로 들려주고,\n존재를 인정하는 한 문장으로 닫습니다.\n\n자녀에게 하는 예시 - \"아까 동생이 우니까 네가 먼저 다가가서 손을 잡아주더라. 나는 그걸 다 봤어. 그런 마음이 네 안에 있다는 게 느껴졌어.\" - \"숙제가 어려웠을 텐데 지우고 다시 쓰기를 몇 번이나 하더라. 포기하지 않는 그 시간을 나는 옆에서 봤어.\" - \"오늘 아침에 스스로 일어나서 신발을 챙겨 신더라. 누가 시키지 않아도 그렇게 하는 너를 봤어.\" - \"네가 밥 먹고 그릇을 조용히 싱크대에 갖다 놓는 걸 봤어. 그 마음이 나한테 전해졌어.\"\n\n닫는 문장: \"그렇게 여기 있어줘서 고마워. 네가 무얼 잘해서가 아니라, 너라서 좋아.\"\n\n평가 단어(잘·못·착함·똑똑함)를 빼고,\n본 것 + 그때 내가 느낀 것만 전합니다.\n\n■ 2단계 — 눈을 감게 하기 \"이제 편하게 눈을 감아볼까.\" \"방금 엄마(아빠)가 한 말이 아직 몸 어딘가에 남아 있을 거야. 그 자리를 느껴봐.\"\n\n■ 3단계 — 명상 스크립트 전달 아래 스크립트를 천천히,\n한 줄에 한 호흡으로 읽어줍니다.\n\n눈을 감으면 아무것도 하지 않아도 됩니다.\n지금 이 순간 잘할 것도,\n못할 것도 없습니다.\n\n방금 누군가 네가 한 일을 그대로 말해 주었습니다.\n칭찬이 아니라 그저 본 것을 들려주었을 뿐입니다.\n그 말속에 어떤 판단도 없었습니다.\n그래서 마음이 조금 놓였을지도 모릅니다.\n\n숨을 들이쉬고,\n천천히 내쉽니다.\n\n너는 무언가를 잘해서 여기 있는 것이 아닙니다.\n그냥 여기 있어서,\n여기 있습니다.\n\n숨이 들어오고 나가는 것을 바라봅니다.\n들어올 때 애쓰지 않아도 들어옵니다.\n나갈 때 밀어내지 않아도 나갑니다.\n너의 존재도 그러합니다.\n인정받으려 애쓰지 않아도,\n이미 있습니다.\n\n가슴 한가운데를 가만히 느껴 봅니다.\n누군가 너를 판단 없이 바라봐 준 그 온기가,\n아직 거기 남아 있습니다.\n\n그 따뜻함을 숨으로 데워 봅니다.\n들이쉬며 그 자리를 채우고,\n내쉬며 몸 전체로 퍼뜨립니다.\n\n이제 알겠습니다.\n내가 잘해야 사랑받는 것이 아니었습니다.\n있는 그대로 비춰질 때,\n나는 이미 충분했습니다.\n\n나는 칭찬을 받아야 하는 사람인가.\n아니면 그저 바라봐지면 되는 사람인가.\n답을 찾지 않아도 됩니다.\n숨이 알고 있습니다.\n\n한 번 더 깊게 들이쉬고,\n길게 내쉽니다.\n\n이 고요를 몸에 담은 채,\n준비가 되면,\n천천히 눈을 뜹니다.","duration":"약 5분","tags":"#존재칭찬 #판단없이바라보기 #마무리명상","series":"숨비명상"},{"id":"96e23730","category":"관찰","title":"한 톨의 우주","body":"우리는 매일 밥을 먹지만,\n먹는 그 순간에 온전히 있어 본 적은 생각보다 드뭅니다.\n눈은 화면을 보고,\n마음은 걱정을 씹는 사이,\n밥은 저 혼자 넘어갑니다.\n오늘은 한 끼 식사를,\n처음 먹어 보는 것처럼 천천히 만나 보겠습니다.\n\n음식이 놓인 식탁 앞에 편안히 앉습니다.\n허리를 가볍게 세우고,\n이 식사의 처음부터 끝까지 깨어서 함께하겠다고,\n마음속으로 가만히 뜻을 세워 봅니다.\n\n먹기 전에,\n이 음식을 향한 여섯 가지 마음을 하나씩 떠올려 봅니다.\n소리 내어 읽어도 좋고,\n마음속으로 따라 해도 좋습니다.\n\n이 음식은 하늘과 비와 햇살,\n온 우주가 함께 지은 선물입니다.\n\n이 음식이 내게 오기까지 애쓴 농부와 상인과 요리한 이에게 감사합니다.\n\n나는 먹을 수 있는 만큼만 그릇에 담겠습니다.\n\n나는 천천히 씹으며 즐겁게 먹겠습니다.\n\n이 음식은 내가 더 사랑하고 더 이해하며 살아갈 힘이 되어 줍니다.\n\n나는 건강하고 행복하기 위해,\n소중한 사람들과 서로 사랑하기 위해 이 음식을 먹습니다.\n\n이제 눈앞의 음식을 가만히 바라봅니다.\n밥 한 톨에 눈길을 모아 봅니다.\n이 작은 한 톨은 저절로 생겨나지 않았습니다.\n봄의 햇살이 들어 있고,\n여름의 비와 바람이 들어 있고,\n흙의 영양과 사람의 손길이 들어 있습니다.\n한 톨의 밥알 속에,\n온 우주가 담겨 있습니다.\n\n바라보는 동안 몸에서 일어나는 일도 살펴봅니다.\n배고픔이 느껴지나요.\n입안에 침이 고이나요.\n빨리 먹고 싶은 마음이 일어날 수도 있습니다.\n어떤 것이든 괜찮습니다. 아,\n지금 이런 마음이 있구나.\n그렇게 알아차리기만 하면 됩니다.\n\n이제 코를 가까이 가져가 냄새를 맡아 봅니다.\n따뜻한 김과 함께 올라오는 음식의 향을 깊이 들이마셔 봅니다.\n\n수저를 손에 쥡니다.\n손가락에 닿는 수저의 매끄러움과 무게를 느껴 봅니다.\n음식을 한 숟가락 떠서,\n천천히 입으로 가져갑니다.\n\n음식이 입에 들어오는 순간을 알아차립니다.\n바로 씹지 말고,\n혀 위에 잠시 두어 봅니다.\n온도가 느껴지나요.\n첫맛이 올라오나요.\n\n이제 천천히, 한 번,\n한 번,\n의도를 담아 씹어 봅니다.\n씹을수록 맛이 달라집니다.\n처음의 맛과 지금의 맛이 어떻게 다른지 따라가 봅니다.\n\n삼키고 싶은 충동이 일어나면,\n아, 삼키고 싶구나,\n하고 알아차린 뒤에 천천히 삼킵니다.\n음식이 목을 지나 내려가는 감각과,\n삼킨 뒤 입안에 남는 여운까지 지켜봅니다.\n\n맛도, 감각도,\n마음도 그대로 머물지 않습니다.\n나타났다가, 변했다가,\n사라집니다.\n그 오고 감을 한 입 한 입 속에서 가만히 지켜봅니다.\n\n남은 식사도 이렇게 천천히,\n알아차리며 먹습니다.\n먹는 동안 걱정이 끼어들면 걱정을 씹지 말고,\n다시 음식으로 돌아옵니다.\n두려움을 씹지 말고,\n화를 씹지 말고,\n다만 주의 깊게 음식만을 씹습니다.\n\n혼자 먹는 식사여도 혼자가 아닙니다.\n이 한 그릇 안에 수많은 사람의 수고와 사랑이,\n햇살과 비와 바람이 함께 앉아 있습니다.\n온 우주와 겸상하는 식사입니다.\n\n식사가 끝났다면 수저를 내려놓고,\n잠시 그대로 머뭅니다.\n몸에 퍼지는 든든함과 고마움을 느껴 봅니다.\n\n앞으로 모든 끼니를 이렇게 먹지 않아도 됩니다.\n다만 음식을 먹을 때마다,\n첫 한 숟가락만이라도 오늘처럼 깨어서 먹어 보세요.\n그 한 숟가락이,\n바쁜 하루 가운데 지금 여기로 돌아오는 작은 문이 되어 줄 것입니다.","duration":"약 10분","tags":"#먹기명상 #마음챙김식사 #오감알아차림","series":"숨비명상"},{"id":"0e2963b9","category":"호흡명상","title":"지금이라는 집","body":"명상이라는 말을 들으면 어떤 모습이 떠오르나요.\n깊은 산속에서 오랜 시간 앉아 있는 사람들,\n어딘가 특별한 사람들의 특별한 일처럼 느껴질지도 모릅니다.\n\n하지만 오늘 이 시간이 끝날 때쯤,\n알게 되실 겁니다.\n숨을 쉴 수 있고,\n느낄 수 있는 사람이라면,\n누구나 명상을 할 수 있다는 것을.\n지금 이대로의 당신이면 충분하다는 것을.\n\n편안한 자세로 앉아 보세요.\n허리는 가볍게 세우고,\n어깨와 손은 편안히 내려놓습니다.\n준비가 되면 천천히 눈을 감습니다.\n\n이제 숨을 느껴 봅니다.\n바꾸려 하지 말고,\n지금 드나드는 숨을 그저 지켜봅니다.\n들어오는 숨, 나가는 숨.\n이 숨은 언제나 지금 이 순간에만 있습니다.\n어제의 숨도,\n내일의 숨도 쉴 수 없습니다.\n숨을 느끼는 지금,\n당신은 이미 명상을 하고 있는 것입니다.\n\n몸의 감각도 느껴 봅니다.\n의자에 닿은 몸의 무게,\n바닥을 딛고 있는 발.\n들려오는 소리에도 잠시 귀를 열어 봅니다.\n가까운 소리, 먼 소리.\n몸도, 소리도,\n모두 지금 여기에서 일어나고 있는 일들입니다.\n\n그런데 가만히 있어 보면,\n마음은 잠시도 가만히 있지 않습니다.\n어느새 어제 있었던 일로 날아가 있고,\n문득 내일 할 일을 걱정하고 있습니다.\n지나간 시간과 오지 않은 시간 사이를,\n마음은 쉼 없이 여행합니다.\n\n괜찮습니다.\n마음은 원래 그렇습니다.\n잘못된 것이 아니라,\n그것이 마음의 습관일 뿐입니다.\n\n여기서 한 가지만 기억하면 됩니다.\n마음이 떠났다는 것을 알아차린 바로 그 순간,\n당신은 이미 돌아와 있다는 것.\n알아차림이 곧 돌아오는 길입니다.\n\n지금이라는 이 자리는,\n언제나 같은 곳에서 나를 기다리는 집과 같습니다.\n아무리 멀리 떠돌아도,\n문은 늘 열려 있습니다.\n숨 한 번이면 돌아올 수 있습니다.\n\n이제 잠시,\n이 집에 머물러 봅니다.\n지금 무엇이 느껴지나요.\n지금 어떤 소리가 들리나요.\n지금 마음에는 무엇이 지나가나요.\n좋다, 나쁘다 가리지 않고,\n일어나는 그대로 조용히 지켜봅니다.\n지켜보는 것,\n그것이 명상의 전부입니다.\n\n무언가 대단한 상태가 되지 않아도 괜찮습니다.\n마음이 자꾸 떠나도 괜찮습니다.\n떠나면 돌아오고,\n또 떠나면 또 돌아오고.\n그 단순한 반복이 명상입니다.\n지금 이 순간에 이렇게 앉아 있는 것만으로,\n당신은 이미 명상가입니다.\n\n그 사실이 주는 편안함을 잠시 느껴 봅니다.\n애쓰지 않아도 되는 편안함.\n지금 여기 있는 것만으로 충분하다는 안도감.\n\n이제 천천히 돌아올 준비를 합니다.\n숨을 한 번 깊이 들이쉬고,\n길게 내쉽니다.\n손끝과 발끝을 가볍게 움직여 봅니다.\n준비가 되면,\n살며시 눈을 뜹니다.\n\n오늘 하루,\n마음이 걱정 속을 떠돌고 있다는 것을 알아차리는 순간이 온다면,\n그때 숨을 한 번 느껴 보세요.\n그 한 번의 숨으로 당신은 언제든,\n지금이라는 집으로 돌아올 수 있습니다.","duration":"약 8분","tags":"#명상입문 #마음챙김 #지금여기","series":"숨비명상"},{"id":"d59c6d51","category":"호흡명상","title":"세 번의 숨","body":"명상은 마음의 운동입니다.\n그리고 모든 운동이 그렇듯,\n아주 가벼운 것부터 시작할 수 있습니다.\n오늘 함께할 것은 단 세 번의 숨입니다.\n세 번의 숨은 누구나 쉴 수 있으니까요.\n\n시작하기 전에 한 가지만 내려놓겠습니다.\n바로 기대입니다.\n편안해져야지,\n잡념이 사라져야지,\n하는 마음도 살며시 내려놓습니다.\n무언가를 얻으려는 자리가 아니라,\n그저 앉아 보는 자리입니다.\n그것이면 충분합니다.\n\n이제 자세를 잡아 봅니다.\n앉아서도 좋고, 서서도,\n누워서도 좋습니다.\n등은 부드럽게 세우되,\n몸의 긴장은 내려놓습니다.\n손은 무릎 위에 가볍게 올리고,\n두 발은 바닥에 가지런히 둡니다.\n눈은 살며시 감습니다.\n뜨는 것이 편하다면 가볍게 떠도 괜찮습니다.\n\n먼저 준비 호흡을 합니다.\n숨을 한 번 크게 들이쉬고,\n내쉽니다.\n한 번 더 크게 들이쉬고,\n내쉽니다.\n마지막으로 크게 들이쉬고,\n길게 내쉽니다.\n\n이제 자연스러운 숨으로 돌아옵니다.\n아,\n내가 이렇게 숨을 쉬고 있구나.\n그저 그렇게 알기만 하면 됩니다.\n\n이제 세 번의 숨을 시작합니다.\n\n첫 번째 숨입니다.\n깊이 들이쉬고,\n천천히 내쉽니다.\n숨이 들어오고 나가는 것을 처음 보는 것처럼 가만히 바라봅니다.\n\n두 번째 숨입니다.\n깊이 들이쉬고,\n이번에는 내쉬는 숨을 조금 더 길게 내보냅니다.\n몸 어딘가에 긴장이 있다면,\n그 긴 숨에 실어 함께 내려놓습니다.\n\n마지막, 세 번째 숨입니다.\n깊이 들이쉬고,\n천천히 내쉬면서,\n들어오는 숨과 나가는 숨을 있는 그대로 바라봅니다.\n잘 되었는지 따지지 않습니다.\n지금 쉰 이 숨이,\n그대로 온전한 한 번입니다.\n\n이제 잠시 그대로 머뭅니다.\n세 번의 숨이 지나간 자리에 고요가 남아 있습니다.\n그 고요를 잠시 느껴 봅니다.\n\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n방금 하신 것이 명상의 전부입니다.\n길지 않아도 됩니다.\n언제 어디서든,\n버스를 기다리면서도,\n일을 시작하기 전에도,\n잠들기 전에도,\n세 번의 숨이면 나를 지금 이 순간으로 초대할 수 있습니다.\n오늘 하루,\n그 초대장을 몇 번이고 꺼내 써 보세요.","duration":"약 5분","tags":"#호흡명상 #3분명상 #명상입문","series":"숨비명상"},{"id":"f98eb48e","category":"호흡명상","title":"3분의 멈춤","body":"우리는 생각보다 자주,\n자동으로 살아갑니다.\n누군가의 말 한마디에 바로 화가 올라오고,\n오래된 습관대로 말하고 행동합니다.\n내가 선택한 것이 아니라,\n감정과 습관이 나 대신 움직인 순간들입니다.\n\n오늘은 그 자동반응 사이에 작은 멈춤 하나를 만들어 보겠습니다.\n필요한 시간은 단 3분입니다.\n\n편안한 자세로 앉아 보세요.\n목과 어깨에 힘이 들어가지 않게 합니다.\n그리고 마음속으로 가만히 뜻을 세웁니다.\n지금부터 3분간,\n나의 호흡을 있는 그대로 바라보겠다.\n어떤 경험이 오더라도 판단하거나 따지지 않고 그대로 받아들이겠다.\n뜻을 세웠다면,\n눈을 가볍게 감습니다.\n\n먼저 숨을 천천히 깊이 들이마시고,\n길게 내쉽니다.\n한 번 더 깊이 들이마시고,\n길게 내쉽니다.\n마지막으로 깊이 들이마시고,\n길게 내쉽니다.\n\n이제 자연스러운 호흡으로 돌아옵니다.\n그리고 내 숨이 가장 잘 느껴지는 곳을 찾아봅니다.\n숨이 드나드는 코끝일 수도 있고,\n부풀었다 꺼지는 배일 수도 있습니다.\n그 한 곳에 주의를 살며시 내려놓습니다.\n\n지금 내가 이렇게 숨을 들이쉬고 있구나.\n지금 내가 이렇게 숨을 내쉬고 있구나.\n그저 바라봅니다.\n\n바라보는 사이 이런저런 생각이 찾아올 것입니다.\n괜찮습니다. 아,\n생각이 왔구나,\n하고 알아차린 뒤,\n다시 부드럽게 숨으로 돌아옵니다.\n몇 번을 떠나도,\n몇 번이든 돌아오면 됩니다.\n\n내가 숨 쉬고 있음을 안다는 것은,\n내가 지금 여기에 살아 있다는 것입니다.\n숨과 함께 머무는 이 시간,\n마음 안에 작은 공간이 생겨납니다.\n\n이 공간이 왜 소중할까요.\n무언가 우리를 건드릴 때와 우리가 반응할 때,\n그 사이에는 아주 짧은 틈이 있습니다.\n평소에는 너무 좁아서 화가 곧바로 튀어나가지만,\n숨을 바라보는 연습은 그 틈을 조금씩 넓혀 줍니다.\n그리고 그 틈 안에서,\n우리는 처음으로 선택할 수 있게 됩니다.\n욱하고 반응할 것인지,\n숨 한 번 쉬고 다르게 말할 것인지.\n\n이제 호흡에 두었던 주의를 살며시 내려놓고,\n잠시 그대로 머뭅니다.\n이 공간에 앉아 있는 나와,\n나를 둘러싼 주위를 가만히 느껴 봅니다.\n\n준비가 되었다면,\n깊이 숨을 들이쉬고 내쉬면서,\n천천히 눈을 뜹니다.\n\n이 3분은 하루 중 언제라도 다시 꺼낼 수 있습니다.\n그리고 특히,\n화가 확 올라오는 순간,\n누군가가 미워지는 순간이 온다면,\n그때를 기억해 주세요.\n반응하기 전에, 숨 한 번.\n그 한 번의 멈춤 안에 지혜로운 선택이 들어 있습니다.","duration":"약 6분","tags":"#3분호흡명상 #멈춤연습 #감정조절","series":"숨비명상"},{"id":"322c8ace","category":"수면·이완","title":"오늘의 쉼표","body":"우리는 매일 걷고, 먹고,\n앉습니다.\n그런데 걷는 동안 걷고 있음을 알고,\n먹는 동안 먹고 있음을 알고 있을까요.\n우리는 자주 걱정하며 걷고,\n투정하며 먹고,\n후회하며 앉습니다.\n몸은 여기 있는데 마음은 다른 곳에 가 있는 것이지요.\n\n오늘은 하루 중 가장 흔한 순간 하나를 연습 도구로 삼아 보겠습니다.\n바로 커피 한 잔입니다.\n긴 문장에 쉼표가 있어야 숨을 고를 수 있듯,\n바쁜 하루에도 쉼표 하나가 필요합니다.\n오늘 이 한 잔이 그 쉼표가 되어 줄 것입니다.\n\n따뜻한 커피 한 잔을 준비합니다.\n커피가 아니어도 좋습니다.\n내가 좋아하는 음료면 충분합니다.\n그리고 잔을 앞에 두고 편안히 앉습니다.\n\n먼저,\n지금 내 앞에 커피 한 잔이 있다는 것을 알아차립니다.\n너무 당연해서 우스운가요.\n하지만 이 당연한 알아차림이 명상의 시작입니다.\n\n잔을 바라보며 이 한 잔이 나에게 오기까지를 잠시 떠올려 봅니다.\n먼 나라의 햇빛과 비바람,\n열매를 거둔 농부의 손,\n볶고 내리고 건네준 여러 사람의 수고.\n작은 잔 하나에 참 많은 것이 담겨 있습니다.\n\n바라보는 동안 몸과 마음에서 일어나는 일도 알아차려 봅니다.\n입에 침이 고이나요.\n빨리 마시고 싶은 마음이 있나요.\n무엇이든 좋습니다. 아,\n지금 이렇구나,\n하고 알기만 하면 됩니다.\n\n잔의 모양을 눈으로 따라가 봅니다.\n김이 올라오고 있나요.\n커피의 빛깔은 어떤가요.\n표면에 얇은 거품이 있나요.\n좋다,\n싫다 없이 그저 보이는 대로 받아들입니다.\n\n이제 천천히 손을 뻗어 잔을 잡습니다.\n손바닥에 닿는 감각을 있는 그대로 느껴 봅니다.\n단단함, 매끄러움, 따뜻함.\n\n잔을 들어 코앞에 가져옵니다.\n향을 맡아 봅니다.\n어떤 향이 올라오나요.\n이름 붙이지 않아도 됩니다.\n향 그대로를 한 번 깊이 들이마십니다.\n\n잔을 입술에 댑니다.\n입술에 닿는 느낌,\n그리고 마시고 싶은 마음까지 알아차립니다.\n\n이제 한 모금 마십니다.\n바로 삼키지 말고,\n혀 위에서 느껴지는 맛을 가만히 살펴봅니다.\n쓴맛인가요, 신맛인가요,\n고소함인가요.\n맛이 조금씩 변해 가는 것도 따라가 봅니다.\n\n삼킨 뒤에는 목을 지나 몸으로 퍼지는 따뜻함을 느껴 봅니다.\n입안에 감도는 향의 여운도 좋다,\n싫다 없이 그대로 받아들입니다.\n\n한 모금 더 마셔 봅니다.\n이번에는 아까보다 조금 더 미세한 향과 맛이 느껴질지도 모릅니다.\n마시는 사이 다른 생각이 찾아오면,\n알아차리고,\n다시 부드럽게 잔으로 돌아옵니다.\n\n남은 커피도 이렇게 천천히,\n음미하며 마십니다.\n\n다 마셨다면 잔을 내려놓고,\n잠시 눈을 감습니다.\n드나드는 숨에 주의를 기울여 봅니다.\n방금 지나온 시간이 몸 안에 남긴 따뜻하고 느슨한 기운을 느껴 봅니다.\n\n준비가 되었다면 천천히 눈을 뜹니다.\n\n커피 한 잔을 마시면서도 마음이 딴 곳에 가 있다면,\n우리는 삶의 그 순간을 살지 못한 것입니다.\n반대로 한 잔에 온전히 머문다면,\n그 몇 분은 하루 중 가장 귀한 진짜 휴식이 됩니다.\n오늘도 어디선가 커피 잔을 드는 순간이 온다면,\n기억해 주세요.\n지금 이 한 잔이,\n나의 하루에 찍는 쉼표라는 것을.","duration":"약 8분","tags":"#커피명상 #일상명상 #진짜휴식","series":"숨비명상"},{"id":"39073b7c","category":"호흡명상","title":"마음의 닻","body":"마음은 작은 배와 같습니다.\n가만히 두면 물결을 따라 과거로,\n미래로,\n이 걱정에서 저 걱정으로 하염없이 떠내려갑니다.\n떠도는 배를 붙잡아 주는 것이 닻입니다.\n오늘은 마음을 지금 여기에 묶어 두는 작은 닻 하나를 내려 보겠습니다.\n그 닻은 바로,\n숨과 함께 세는 숫자입니다.\n\n의자나 방석 위에 편안히 앉습니다.\n허리는 곧게 세우고,\n가슴을 폅니다.\n두 손은 무릎 위에 가볍게 올려놓습니다.\n의자에 앉았다면 두 발을 바닥에 가만히 내려놓습니다.\n\n눈을 감기 전에 몸을 한 번 살펴봅니다.\n목과 어깨에 긴장이 남아 있다면 부드럽게 풀어 줍니다.\n준비가 되었다면 눈을 감습니다.\n\n먼저 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n한 번 더 깊이 들이쉬고,\n내쉽니다.\n마지막으로 깊이 들이쉬고,\n길게 내쉽니다.\n\n이제 자연스러운 호흡으로 돌아옵니다.\n숨이 가장 잘 느껴지는 곳을 찾아봅니다.\n부풀었다 꺼지는 배,\n오르내리는 가슴,\n바람이 스치는 콧구멍 주변.\n그곳에 주의를 가만히 내려놓습니다.\n\n이제 숨에 숫자를 실어 보겠습니다.\n숨을 들이쉬며 마음속으로,\n하나. 내쉬며, 둘.\n다시 들이쉬며, 셋. 내쉬며,\n넷. 들이쉬며, 다섯.\n내쉬며, 여섯. 들이쉬며,\n일곱. 내쉬며, 여덟.\n들이쉬며, 아홉. 내쉬며,\n열. 열까지 갔다면,\n다시 하나로 돌아가 같은 길을 걷습니다.\n\n한 가지 기억해 주세요.\n이것은 숫자를 잘 세기 위한 연습이 아닙니다.\n숫자는 다만 마음을 숨에 묶어 두는 닻일 뿐입니다.\n잘 세는 것보다,\n숨과 함께 있는 것이 중요합니다.\n\n세다 보면 어느새 생각에 떠내려가 숫자를 잃어버리거나,\n열을 훌쩍 넘겨 세고 있는 자신을 발견할 것입니다.\n괜찮습니다.\n그것은 실패가 아닙니다.\n떠내려갔다는 것을 알아차린 바로 그 순간이,\n닻이 다시 걸린 순간입니다.\n가벼운 마음으로 다시 하나로 돌아가면 됩니다.\n\n이제 각자의 속도로,\n하나에서 열까지,\n숨과 숫자와 함께 잠시 머물러 봅니다.\n\n이제 숫자를 살며시 내려놓습니다.\n세지 않아도 숨은 저 혼자 고요히 드나들고 있습니다.\n그 고요 속에 잠시 그대로 머뭅니다.\n\n깊이 숨을 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n오늘 하루,\n마음이 분주하게 떠다니고 무엇에도 집중이 되지 않을 때,\n이 닻을 기억해 주세요.\n들이쉬며 하나, 내쉬며 둘.\n그 작은 숫자들이 떠도는 마음을 지금 여기로 데려다 놓아 줄 것입니다.","duration":"약 7분","tags":"#수세기명상 #호흡명상 #집중력","series":"숨비명상"},{"id":"17b895cc","category":"호흡명상","title":"숨이라는 친구","body":"우리에게는 태어난 순간부터 지금까지,\n단 한순간도 곁을 떠나지 않은 친구가 하나 있습니다.\n바로 숨입니다.\n\n이 친구는 내 마음을 가장 잘 압니다.\n화가 나면 함께 가빠지고,\n깜짝 놀라면 함께 멎고,\n마음이 놓이면 함께 깊고 느려집니다.\n그래서 숨을 들여다보면,\n지금 내 마음이 어떤지 알 수 있습니다.\n오늘은 이 오랜 친구와 조금 길게 마주 앉아 보겠습니다.\n\n먼저 자세를 잡습니다.\n가슴을 펴고 허리를 바로 세우되,\n목과 어깨의 긴장은 부드럽게 풀어 줍니다.\n다리는 편한 대로 둡니다.\n바닥이라면 책상다리도 좋고,\n의자라면 두 발을 가지런히 바닥에 놓습니다.\n손은 손바닥이 하늘을 향하게 하여 무릎 위에 가볍게 올립니다.\n준비가 되면 눈을 감습니다.\n\n숨을 한 번 크게 들이쉬고,\n내쉽니다.\n한 번 더 크게 들이쉬고,\n내쉽니다.\n들이쉬는 숨은 몸을 살며시 깨우고,\n내쉬는 숨은 몸을 느슨하게 풀어 줍니다.\n\n이제부터는 숨을 조절하지 않습니다.\n깊이 쉬려고,\n느리게 쉬려고 애쓰지 않습니다.\n숨은 저 혼자서도 잘 쉬어지고 있습니다.\n우리는 다만 곁에서 지켜볼 뿐입니다.\n아,\n내가 이렇게 들이쉬고 내쉬고 있구나.\n그 호기심이면 충분합니다.\n\n내 숨이 가장 잘 느껴지는 곳은 어디인가요.\n바람이 드나드는 콧속인가요.\n오르내리는 가슴인가요.\n부풀었다 꺼지는 배인가요.\n어디라도 좋습니다.\n숨이 가장 또렷하게 느껴지는 그 한 곳에 주의를 가만히 내려놓습니다.\n\n그리고 지켜봅니다.\n들어오는 숨, 나가는 숨.\n숨과 숨 사이의 짧은 쉼표까지.\n\n지켜보는 동안 마음은 몇 번이고 다른 곳으로 떠날 것입니다.\n그럴 때마다, 아,\n내가 지금 이런 생각을 하고 있구나,\n하고 알아차리고,\n친절하고 부드럽게 다시 숨으로 돌아옵니다.\n꾸짖을 일이 아닙니다.\n떠나고 돌아오는 그 한 번,\n한 번이 알아차림의 근육을 키우는 중입니다.\n\n이제 잠시 안내를 멈추겠습니다.\n각자의 숨과 함께,\n고요히 머물러 봅니다.\n코로 공기가 들고 나고,\n가슴이 오르내리고,\n배가 부풀고 꺼지고.\n온몸이 숨을 따라 잔잔히 움직이는 것을 그저 지켜봅니다.\n\n이제 호흡에 두었던 주의를 살며시 내려놓습니다.\n그리고 잠시,\n아무것도 하지 않고 그대로 머뭅니다.\n이 공간에 앉아 있는 나와,\n나를 둘러싼 주위가 천천히 느껴집니다.\n\n준비가 되었다면,\n숨을 깊이 들이쉬고 내쉬면서,\n천천히 눈을 뜹니다.\n\n살다 보면 지나간 일이 후회로 밀려오고,\n오지 않은 일이 걱정으로 몰려오는 날이 있습니다.\n마음이 어지럽고 힘든 그런 날일수록,\n이 친구를 기억해 주세요.\n숨은 언제나 지금 이 순간에만 있고,\n언제나 내 곁에 있습니다.\n하루 중 잠깐이라도 이 친구 곁에 앉아 보세요.\n숨에게는,\n떠도는 마음을 지금 여기로 데려오는 힘이 있습니다.","duration":"약 10분","tags":"#호흡명상 #알아차림 #마음챙김","series":"숨비명상"},{"id":"6d1cf614","category":"움직임명상","title":"나와의 산책","body":"우리는 걸을 때조차 혼자 걷지 않습니다.\n손에는 스마트폰,\n귀에는 음악,\n머릿속에는 끝나지 않은 걱정들.\n늘 무언가와 함께 걷느라,\n정작 나와 함께 걸어 본 적은 드뭅니다.\n오늘 산책의 동행은 단 한 사람,\n나 자신입니다.\n특별한 기술은 필요하지 않습니다.\n천천히 걷는 것,\n그것이 전부입니다.\n\n산책을 시작하기 전,\n잠시 그 자리에 서 봅니다.\n천천히 숨을 들이쉬고,\n내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n마지막으로 들이쉬고,\n길게 내쉽니다.\n\n서 있는 내 몸을 따뜻한 호기심으로 살펴봅니다.\n두 발바닥에 몸무게가 고르게 실려 있나요.\n몸이 한쪽으로 기울어 있지는 않나요.\n어깨에 힘이 들어가 있다면 살며시 풀어 줍니다.\n이제 발바닥으로 주의를 가져오고,\n걸을 준비를 합니다.\n\n천천히, 첫걸음을 내딛습니다.\n평소보다 느리게, 한 걸음,\n한 걸음에 마음을 실어 걷습니다.\n어느 발이 먼저 나가는지 호기심을 가지고 살펴봅니다.\n오른발, 왼발, 오른발,\n왼발.\n마음속으로 걸음마다 이름을 붙여 보아도 좋습니다.\n\n걷는 동안 몸에서 느껴지는 감각들을 있는 그대로 알아차립니다.\n발바닥이 땅에 닿는 느낌,\n다리의 움직임, 팔의 흔들림,\n얼굴을 스치는 바람.\n\n걷다 보면 생각과 걱정이 따라와 말을 걸 것입니다.\n괜찮습니다. 아,\n이런 생각이 있구나.\n이런 걱정을 하고 있었구나.\n그렇게 알아차리고,\n다시 걸음으로 돌아옵니다.\n\n몸에 밴 습관들도 슬며시 나타날 것입니다.\n주머니 속 스마트폰을 꺼내려는 손,\n지나가는 사람을 따라가는 눈길.\n그 순간을 알아차려 봅니다.\n아,\n지금 꺼내고 싶어 하는구나.\n그리고 부드럽게,\n다시 걸음으로 돌아옵니다.\n오늘만큼은 걷는 일 하나로 충분합니다.\n\n산책길에 새소리나 바람 소리가 들린다면,\n잠시 멈춰 서서 들어도 좋습니다.\n소리가 왔다가 사라지는 것을 듣고,\n다시 천천히 걷습니다.\n시선이 닿는 풍경들도 평가 없이 그저 바라보며 지나갑니다.\n\n이렇게 걷는 동안 알게 됩니다.\n생각도 왔다가 가고,\n소리도 왔다가 가고,\n발걸음도 디뎠다가 떠납니다.\n어떤 것도 그대로 머물지 않습니다.\n무겁던 고민도,\n이 길 위에서는 왔다가 지나가는 것 중 하나일 뿐입니다.\n\n원하는 만큼 걸었다면,\n이제 천천히 제자리에 멈춰 섭니다.\n주의를 몸 전체로 가져와,\n걷고 난 몸에 남은 감각들을 있는 그대로 느껴 봅니다.\n따뜻해진 다리,\n가벼워진 어깨,\n조금 트인 가슴.\n\n잠시 그대로 서서,\n드나드는 숨을 따라갑니다.\n들이쉬고, 내쉬고.\n오늘의 산책을 여기서 마칩니다.\n\n느리게 걷는 이 단순한 일이 가진 힘을 작게 여기지 마세요.\n마음이 복잡한 날,\n걱정이 무거운 날일수록 나를 데리고 산책을 나가 주세요.\n나와 나란히 걷는 그 길에서,\n엉킨 생각은 느슨해지고,\n무거운 마음은 한 걸음씩 가벼워질 것입니다.","duration":"약 9분","tags":"#산책명상 #걷기명상 #나를만나는시간","series":"숨비명상"},{"id":"c0e4836a","category":"탈중심화","title":"열 가지 빛","body":"마음 깊이 존경하는 분을 떠올리기만 해도,\n등이 저절로 펴지고 마음가짐이 바르게 되는 경험이 있으실 겁니다.\n오늘의 명상이 그렇습니다.\n\n부처님을 떠올리는 명상,\n그중에서도 모습이 아니라 부처님의 위없는 덕성을 마음에 모시는 시간입니다.\n열 가지 덕성은 열 가지 빛과 같아서,\n떠올리는 것만으로 마음이 환해지고 고요하게 가라앉습니다.\n\n편안한 자세로 앉습니다.\n허리를 바로 세우고,\n두 손은 무릎 위에 가만히 올려놓습니다.\n눈을 가볍게 감습니다.\n\n숨을 한 번 크게 들이마시고,\n내쉽니다.\n한 번 더 크게 들이마시고,\n내쉽니다.\n마지막으로 크게 들이마시고,\n길게 내쉽니다.\n\n이제 자연스러운 호흡으로 돌아옵니다.\n숨을 조절하지 않고,\n내가 이렇게 들이쉬고 내쉬고 있구나,\n하고 그저 알아차립니다.\n생각이 떠오르면 알아차리고,\n다시 호흡으로 돌아옵니다.\n잠시 이 호흡에 머뭅니다.\n\n마음이 고요해졌다면,\n이제 부처님의 열 가지 덕성을 하나씩 마음에 모셔 봅니다.\n먼저 그 이름들을 염불하듯 천천히,\n마음속으로 따라 해 봅니다.\n\n응공. 정변지. 명행족.\n선서. 세간해. 무상사.\n조어장부. 천인사. 불.\n세존.\n\n이번에는 그 뜻을 하나하나 새기며 떠올려 봅니다.\n\n마땅히 존경과 공양을 받으실 분.\n위없는 진리를 바르게 두루 아시는 분.\n최상의 지혜와 실천을 갖추신 분.\n열반으로 잘 나아가신 분.\n이 세상 모든 것을 잘 아시는 분.\n위없이 거룩하신 분.\n모든 중생을 잘 이끄시는 분.\n하늘과 인간 세상의 스승이신 분.\n바른 깨달음을 이루신 분.\n세상에서 위없는 존경을 받으시는 분.\n\n이제 열 가지 가운데 오늘 마음에 와닿는 한두 가지를 골라 봅니다.\n그리고 숨에 실어 천천히 반복합니다.\n숨을 들이쉬며, 불.\n숨을 내쉬며, 세존.\n들이쉬며, 불. 내쉬며,\n세존.\n숨이 오갈 때마다 그 덕성의 빛이 마음 안으로 스며들게 합니다.\n\n부처님의 덕성을 이렇게 떠올리는 동안,\n신기한 일이 일어납니다.\n그 순간의 마음에는 탐욕이 자리 잡지 못하고,\n성냄이 자리 잡지 못하고,\n어리석음이 자리 잡지 못합니다.\n빛이 든 방에 어둠이 머물 수 없듯이,\n덕성을 그리는 마음은 저절로 올곧아집니다.\n\n원하는 만큼,\n숨과 함께 그 빛에 머물러 봅니다.\n\n이제 천천히 마무리할 시간입니다.\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n오늘 하루,\n마음이 욕심으로 흐려질 때,\n화가 올라올 때,\n길이 보이지 않을 때,\n열 가지 빛 가운데 하나를 떠올려 보세요.\n부처님의 덕성을 잊지 않고 그리는 마음이,\n나를 조금씩 그 빛을 닮은 사람으로 데려가 줄 것입니다.","duration":"약 9분","tags":"#불수념 #부처님명상 #집중명상","series":"숨비명상"},{"id":"13c1f07a","category":"관찰","title":"마음의 하늘","body":"생각이 너무 많아서 명상이 안 된다고 말하는 분들이 있습니다.\n그런데 생각은 멈추려고 하면 오히려 더 많아집니다.\n\n멈추려는 그 마음이 또 하나의 생각을 데려오기 때문입니다.\n오늘은 생각을 멈추는 대신,\n바라보는 법을 연습해 보겠습니다.\n\n앉은 자리에서 허리를 바로 펴고,\n목과 어깨의 긴장을 풀어 줍니다.\n눈을 부드럽게 감습니다.\n\n천천히 몸에 주의를 둡니다.\n얼굴의 감각,\n의자에 닿은 엉덩이,\n바닥에 닿은 발바닥.\n차례로 느껴 봅니다.\n\n이제 숨을 크게 들이쉬고,\n길게 내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n마지막으로 들이쉬고,\n길게 내쉽니다.\n그리고 자연스러운 호흡으로 돌아와,\n드나드는 숨을 가만히 바라봅니다.\n\n이제 마음을 넓은 하늘이라고 상상해 봅니다.\n맑고 푸른,\n끝없이 넓은 하늘입니다.\n그리고 생각과 감정은 그 하늘을 지나가는 구름입니다.\n\n앉아 있는 동안 구름은 계속 찾아올 것입니다.\n할 일 걱정, 아까의 대화,\n문득 떠오르는 기억.\n구름이 나타나면 붙잡지 말고,\n이름표 하나만 가만히 붙여 줍니다.\n생각이구나.\n그러면 그 구름은 잠시 머물다가,\n저 혼자 흘러갑니다.\n\n감정의 구름도 찾아올 것입니다.\n조금 어둡고 무거운 구름일 수도 있습니다.\n그때도 밀어내지 말고,\n다가가서 이름을 붙여 줍니다.\n걱정이구나. 슬픔이구나.\n짜증이구나.\n꼭 맞는 이름이 아니어도 괜찮습니다.\n중요한 것은 이름이 아니라,\n지금 이 순간을 지켜보고 있다는 사실입니다.\n\n감정이 찾아오면 몸도 함께 살펴봅니다.\n가슴이 답답한가요.\n어깨가 굳어 있나요.\n열이 오르나요.\n감정이 몸 어디에 와 있는지 알아차리면,\n굳었던 자리가 조금씩 풀리기 시작합니다.\n\n기억해 주세요.\n감정은 억누르면 사라지는 것이 아니라,\n풍선의 한쪽을 누르면 다른 쪽이 부풀듯,\n어딘가에서 더 크게 터져 나옵니다.\n하지만 부드럽게 맞아 주면,\n감정은 제 할 일을 마치고 조용히 떠나갑니다.\n\n구름을 바라보다가 어느새 구름 속에 들어가 있는 자신을 발견할 수도 있습니다.\n생각에 빠져 있었구나,\n판단하고 있었구나.\n알아차린 그 순간,\n다시 호흡으로 돌아옵니다.\n숨은 언제나 하늘 아래 그 자리에 있습니다.\n\n그리고 문득 알게 됩니다.\n아무리 많은 구름이 지나가도,\n하늘은 젖지 않고,\n물들지 않고,\n좁아지지 않습니다.\n구름이 오가는 동안에도 하늘은 언제나 넓고 고요합니다.\n내 마음의 본래 모습도 그렇습니다.\n\n잠시,\n오가는 구름과 그 뒤의 고요한 하늘을 함께 느껴 봅니다.\n\n이제 숨을 크게 들이쉬고,\n길게 내쉬면서,\n천천히 눈을 뜹니다.\n\n모든 것은 나타났다가 사라집니다.\n생각도, 감정도,\n붙잡지 않으면 왔다가 지나가는 구름일 뿐입니다.\n오늘 하루,\n마음에 거센 구름이 몰려오면 이름표 하나 붙여 보세요.\n화구나. 불안이구나.\n그 한마디가,\n구름에 휩쓸리는 대신 하늘로 머무는 길이 되어 줄 것입니다.","duration":"약 10분","tags":"#생각알아차림 #감정명상 #이름붙이기","series":"숨비명상"},{"id":"0a6a62b0","category":"관찰","title":"몸의 안부","body":"우리는 몸이 아플 때에야 비로소 몸을 들여다봅니다.\n쑤셔야 어깨를 알고,\n결려야 허리를 압니다.\n\n평소의 몸은 너무 조용히 일해 주어서,\n있다는 것조차 잊고 지냅니다.\n오늘은 아프기 전에 먼저,\n오랫동안 소원했던 내 몸에게 안부를 묻는 시간을 가져 보겠습니다.\n\n의자에 앉아 척추를 바로 세웁니다.\n몸 전체의 긴장을 부드럽게 풀어 줍니다.\n눈을 감고,\n잠시 호흡에 주의를 둡니다.\n들어오는 숨, 나가는 숨.\n\n시작하기 전에 한 가지만 기억해 주세요.\n오늘 우리가 할 일은 몸을 바꾸거나 고치는 것이 아닙니다.\n그저 찾아가서,\n어떻게 지내는지 안부를 묻고,\n잠시 곁에 머무는 것입니다.\n\n이제 호흡에 두었던 주의를 살며시 내려놓고,\n머리 꼭대기,\n정수리로 찾아갑니다.\n정수리에서 느껴지는 감각이 있는지 살펴봅니다.\n저릿한가요, 따뜻한가요.\n무겁거나 가려운가요.\n느껴지는 그대로 알아차립니다.\n아무 느낌이 없다면,\n없다는 것을 알아차리면 됩니다.\n그것도 하나의 안부입니다.\n\n천천히 주의를 얼굴로 옮깁니다.\n이마, 눈가, 뺨, 턱.\n어딘가 힘이 들어가 있나요.\n미세한 떨림이나 간지러움이 있나요.\n좋다,\n싫다 없이 그저 느껴 봅니다.\n\n이제 가슴,\n심장이 있는 자리로 찾아갑니다.\n심장이 뛰고 있습니다.\n빠른지, 느린지,\n어떤 리듬인지 가만히 들어 봅니다.\n내가 묻지 않아도 심장은 오늘도 하루 종일 일하고 있었습니다.\n\n주의를 배로 옮깁니다.\n숨을 따라 부풀고 꺼지는 움직임,\n그 안쪽의 느낌까지 있는 그대로 알아차립니다.\n\n이제 의자에 닿아 있는 엉덩이로 갑니다.\n몸의 무게가 실려 있는 느낌,\n닿은 자리의 단단함이나 푹신함을 느껴 봅니다.\n\n오른쪽 다리로 내려갑니다.\n허벅지, 무릎, 종아리,\n발목과 발바닥까지.\n그곳에서 일어나는 모든 감각을 있는 그대로 알아차립니다.\n\n이번에는 왼쪽 다리입니다.\n같은 길을 따라 천천히 내려가며,\n느껴지는 것들을 그대로 맞이합니다.\n\n몸을 살피는 동안 어딘가 불편한 곳을 만났을 수도 있습니다.\n밀어내지 말고,\n잠시 그 곁에 머물러 봅니다.\n신기하게도,\n불편함은 알아봐 주는 것만으로 조금 누그러지곤 합니다.\n그리고 생각이 끼어들었다면,\n알아차리고 다시 몸으로 돌아오면 됩니다.\n\n한 바퀴 안부를 다 물었습니다.\n몸의 감각들은 잠시도 같지 않았을 것입니다.\n나타나고, 변하고,\n사라졌을 것입니다. 몸도,\n마음도,\n그렇게 늘 흐르고 있습니다.\n\n이제 주의를 서서히 호흡으로 가져옵니다.\n잠시 내 숨을 있는 그대로 바라봅니다.\n준비가 되었다면,\n크게 숨을 들이쉬고 내쉬면서,\n천천히 눈을 뜹니다.\n\n몸은 언제나 작은 신호를 보내고 있습니다.\n뻐근함으로, 간지러움으로,\n따뜻함으로.\n그 신호를 알아차리는 것만으로 몸은 평온해지고 느슨해집니다.\n오늘 하루 중 언제라도,\n잠깐 멈추어 몸에게 안부를 물어봐 주세요.\n잘 지내니, 하고.\n평생 나를 살아 주는 몸은,\n그 짧은 안부 하나에도 환해집니다.","duration":"약 7분","tags":"#몸관찰명상 #바디스캔 #알아차림","series":"숨비명상"},{"id":"68d60841","category":"움직임명상","title":"스무 걸음","body":"우리에게 걷기는 어디론가 가기 위한 수단이었습니다.\n빨리, 더 빨리.\n목적지만 바라보고 걷느라,\n한 걸음,\n한 걸음이 주는 기쁨은 느껴 볼 틈이 없었습니다.\n오늘은 처음으로 아무 데도 가지 않는 걸음을 걸어 보겠습니다.\n필요한 것은 스무 걸음의 길이면 충분합니다.\n\n시작하기 전에,\n잠시 나의 두 발을 생각해 봅니다.\n이 작은 발바닥 두 개가 몸 전체를 지탱하며 평생 나를 실어 날랐습니다.\n너무 당연해서 한 번도 고맙다고 한 적 없는 그 수고에,\n잠시 고마운 마음을 보냅니다.\n\n이제 자리를 마련합니다.\n스무 걸음쯤 걸을 수 있는 평평한 곳이면 됩니다.\n공원도 좋고,\n거실이나 방 안도 좋습니다.\n두 손은 앞으로 가볍게 모읍니다.\n발에 온전히 주의를 두기 위해서입니다.\n시선은 두어 걸음 앞,\n바닥에 부드럽게 둡니다.\n두리번거리지 않으면 걸음에 마음을 모으기가 쉬워집니다.\n\n출발점에 서서,\n깊이 숨을 들이쉬고 내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n마지막으로 들이쉬고,\n길게 내쉽니다.\n\n선 채로 발바닥에 주의를 둡니다.\n바닥에 닿아 있는 두 발의 무게,\n단단함, 따뜻함이나 서늘함.\n지금 느껴지는 그대로 알아차립니다.\n그리고 마음속으로 가만히 뜻을 세웁니다.\n이 발이 무슨 일을 하는지,\n따뜻한 호기심으로 지켜보겠다.\n\n이제 천천히 걷기 시작합니다.\n너무 빠르지도,\n너무 느리지도 않게.\n발이 경험하는 것을 알아차릴 수 있는 편안한 속도면 됩니다.\n한 걸음, 한 걸음.\n발바닥이 바닥에 닿을 때의 느낌에 주의를 둡니다.\n\n스무 걸음쯤 걸었다면 잠시 멈춰 섭니다.\n서 있는 발바닥을 한 번 느끼고,\n천천히 몸을 돌립니다.\n그리고 다시, 한 걸음,\n한 걸음 주의를 두고 걷습니다.\n\n걷는 동안 생각이 찾아오면,\n알아차리고 살며시 놓아 준 뒤,\n다시 발바닥으로 돌아옵니다.\n왼발이 닿는 것을 알고,\n오른발이 닿는 것을 안다면,\n충분히 잘하고 있는 것입니다.\n\n익숙해졌다면 조금 더 자세히 들여다봅니다.\n발이 바닥에서 떨어지는 순간의 감각.\n앞으로 나아가는 움직임.\n그리고 다시 바닥에 내려앉는 느낌.\n드는 것을 알고,\n내딛는 것을 알고,\n닿는 것을 압니다.\n반대편 발도 같은 길을 갑니다.\n\n모든 것을 다 알아차리겠다고 애쓰지 않아도 됩니다.\n지나친 애씀은 오히려 걸음을 무겁게 합니다.\n편안한 마음으로,\n발에게 무슨 일이 일어나는지 따뜻한 관심을 두고 걷는 것으로 충분합니다.\n\n이 짧은 길을 두세 차례 오가며,\n걸음과 발바닥에 온전히 머물러 봅니다.\n\n원하는 만큼 걸었다면,\n이제 제자리에 천천히 멈춰 섭니다.\n두 발로 서 있는 지금 이 순간을 알아차립니다.\n내가 지금, 여기에,\n이렇게 서 있습니다.\n\n돌아보면 이 걸음에는 목적지가 없었습니다.\n그런데 이상하지요.\n어디에도 가지 않았는데,\n걸음마다 도착해 있었습니다.\n지금 이 순간이라는 자리에 말입니다.\n삶은 저 멀리 목적지에 있는 것이 아니라,\n발바닥이 닿는 바로 이 자리에 있습니다.\n\n하루 중 잠깐,\n시간을 정해 이 스무 걸음의 길을 걸어 보세요.\n오가는 그 짧은 길 위에서,\n한 걸음이 주는 기쁨과 지금 여기의 행복을 만나게 될 것입니다.","duration":"약 9분","tags":"#걷기명상 #한걸음 #지금여기","series":"숨비명상"},{"id":"dc8f86e3","category":"용서감사","title":"네 번의 감사","body":"우리 마음에는 이상한 버릇이 하나 있습니다.\n나쁜 일은 찍찍이처럼 착 달라붙는데,\n좋은 일은 기름 바른 듯 스르르 미끄러져 버립니다.\n\n그래서 하루에 좋은 일이 아무리 많아도,\n저녁이 되면 속상했던 일 하나만 마음에 남곤 합니다.\n\n감사에 연습이 필요한 이유가 여기에 있습니다.\n오늘은 미끄러지려는 좋은 것들을 숨에 실어 마음에 붙잡아 두는 연습을 네 번에 걸쳐 해 보겠습니다.\n\n시작 전에 감사한 일들을 몇 줄 적어 두면 더 좋습니다.\n\n조용한 공간에 편안하게 앉습니다.\n허리는 펴고,\n목과 어깨의 긴장은 풀어 줍니다.\n숨을 천천히 깊게 들이마시고,\n내쉽니다.\n한 번 더 들이마시고,\n내쉽니다.\n마지막으로 들이마시고,\n길게 내쉽니다.\n이제 자연스러운 호흡으로 돌아옵니다.\n\n첫 번째 감사입니다.\n오늘 하루 나에게 일어난 일들을 천천히 떠올려 봅니다.\n크지 않아도 좋습니다.\n따뜻했던 날씨,\n맛있었던 한 끼,\n반가운 얼굴,\n위로가 되어 준 문자 한 통.\n그중 하나를 골라 마음에 담습니다.\n그리고 숨에 실어 봅니다.\n숨을 들이쉬고, 내쉬며,\n감사합니다. 들이쉬고,\n내쉬며, 감사합니다.\n몸 어딘가가 따뜻해지거나 가슴이 느슨해진다면,\n그 느낌도 함께 알아차리며 잠시 반복합니다.\n\n두 번째 감사입니다.\n이번에는 시야를 넓혀,\n내 인생 전체에서 가장 감사한 것 하나를 떠올려 봅니다.\n그 일이 있었던 순간을 자세히 그려 봅니다.\n그때의 장면, 그때의 마음.\n가슴에서 일어나는 것을 있는 그대로 느끼며,\n숨에 실어 봅니다. 들이쉬고,\n내쉬며, 진정으로 감사합니다.\n들이쉬고, 내쉬며,\n진정으로 감사합니다.\n\n세 번째 감사입니다.\n이번에는 사람입니다.\n내가 감사하게 여기는 한 분을 떠올립니다.\n부모님일 수도, 스승일 수도,\n친구일 수도 있습니다.\n그분에게 고마웠던 일을 구체적으로 떠올리고,\n그 얼굴을 마주 봅니다.\n그리고 그분을 향해 숨에 실어 전합니다.\n들이쉬고, 내쉬며,\n당신에게 감사합니다.\n들이쉬고, 내쉬며,\n진정으로 당신에게 감사합니다.\n\n마지막, 네 번째 감사입니다.\n이번에 마주할 사람은 나 자신입니다.\n내가 나에게 감사할 만한 일을 떠올려 봅니다.\n용기 내어 도전했던 일,\n끝까지 해냈던 일,\n누군가에게 건넨 친절,\n오늘 하루를 성실히 살아 낸 것.\n그 모습을 바라보며,\n나를 향해 숨에 실어 봅니다.\n들이쉬고, 내쉬며,\n나에게 감사합니다. 들이쉬고,\n내쉬며, 나에게 감사합니다.\n\n이제 감사의 말들을 살며시 내려놓습니다.\n그리고 잠시 호흡에만 주의를 둡니다.\n네 번의 감사가 지나간 가슴에 남아 있는 온기를 가만히 느껴 봅니다.\n\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n오늘 붙잡아 둔 좋은 것들은 쉽게 미끄러지지 않습니다.\n그리고 이 연습을 매일 이어 가면,\n신기한 일이 일어납니다.\n좋은 것에 머무는 시간이 조금씩 길어지고,\n마음의 길이 바뀌어 갑니다.\n감사가 행복과 얼마나 가까이 붙어 있는지,\n매일의 네 번의 감사로 직접 확인해 보시기 바랍니다.","duration":"약 10분","tags":"#감사명상 #긍정마음 #호흡명상","series":"숨비명상"},{"id":"75fb1438","category":"용서감사","title":"용서의 첫걸음","body":"오늘은 조금 용기가 필요한 시간입니다.\n마음 한구석에 오래 미뤄 두었던 말,\n미안하다는 말을 꺼내 보는 연습입니다.\n용서는 쉽지 않습니다.\n시간이 걸리는 일입니다.\n하지만 기억해 주세요.\n진정한 용기는 싸워 이기는 것이 아니라,\n용서하려는 마음을 내는 것입니다.\n\n시작하기 전에,\n용서의 문을 여는 열쇠 하나를 먼저 건네 드립니다.\n그 열쇠는 이해입니다.\n그때의 나는 왜 그런 말을 했을까.\n돌아보면 그 시절의 나에게도 나름의 부족함이 있었고,\n알지 못한 어리석음이 있었고,\n말 못 할 고통이 있었습니다.\n사람은 저마다 자기 몫의 슬픔을 짊어진 채 휘청이며 걷습니다.\n그 휘청임 속에서 서로에게 상처를 주고받습니다.\n이것을 이해할 때,\n비로소 용기 내어 용서를 구할 수 있습니다.\n\n이제 몸을 준비합니다.\n편안한 자세로 앉아,\n등과 허리를 곧게 펴고,\n가슴을 활짝 열어 봅니다.\n눈은 감아도 좋고,\n뜨고 있다면 시선을 바닥의 편안한 한 지점에 내려놓습니다.\n\n깊이 숨을 들이쉬고,\n천천히 내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n마지막으로 한 번 더,\n깊이 들이쉬고,\n길게 내쉽니다.\n\n이제 몸에 잠시 주의를 두고,\n긴장된 곳을 하나씩 풀어 줍니다.\n머리와 목, 어깨,\n팔을 지나 손가락 끝까지,\n힘을 살며시 내려놓습니다.\n가슴과 아랫배,\n등과 허리의 긴장도 내려놓습니다.\n엉덩이와 허벅지,\n무릎과 종아리,\n발목을 지나 발가락 끝까지,\n힘을 내려놓습니다.\n꼭 다물고 있던 어금니도 살짝 풀어 줍니다.\n\n다시 한 번 깊이 숨을 들이쉬고,\n내쉽니다.\n이제 호흡은 자연스러운 흐름에 맡기고,\n편안해진 몸으로 드나드는 숨을 잠시 지켜봅니다.\n\n이제 마음속으로 한 사람을 초대해 봅니다.\n살아오며 만난 사람 가운데,\n나의 크고 작은 잘못과 실수로 마음을 다친 사람.\n미안하다고 말하고 싶었지만,\n용기가 없어 끝내 말하지 못한 사람.\n\n한 사람이 떠올랐다면,\n그 사람의 얼굴을 가만히 바라봅니다.\n그리고 나의 어떤 말이,\n어떤 행동이 그 사람에게 상처가 되었는지 천천히 떠올려 봅니다.\n그때의 나에게 어떤 부족함이,\n어떤 어려움이 있었는지도 함께 헤아려 봅니다.\n\n가슴이 조여 오거나 마음이 아파 올 수 있습니다.\n괜찮습니다.\n그 아픔은 내가 그 사람을 소중히 여긴다는 증거이기도 합니다.\n밀어내지 말고,\n그 느낌을 있는 그대로 잠시 안고 있어 봅니다.\n\n이제 깊이 숨을 들이쉬고,\n내쉬면서,\n그 사람을 향해 마음속으로 조용히 말을 건넵니다.\n\n내가 당신에게 몸으로, 말로,\n마음으로 준 상처에 용서를 구합니다.\n당신의 용서를 구합니다.\n\n한 번 더,\n호흡에 실어 건넵니다.\n\n내가 당신에게 몸으로, 말로,\n마음으로 준 상처에 용서를 구합니다.\n당신의 용서를 구합니다.\n\n원한다면 한 손을 가슴 위에 얹어도 좋습니다.\n손바닥의 온기를 느끼며,\n숨이 드나드는 리듬에 맞춰 이 말을 부드럽게 되뇌어 봅니다.\n나는 당신의 용서를 구합니다.\n나는 당신의 용서를 구합니다.\n\n되뇌는 동안 몸 어딘가가 뻐근해지거나,\n불편한 감정이 올라올 수 있습니다.\n잘못하고 있는 것이 아닙니다.\n오래 눌러 두었던 마음이 움직이기 시작한 것입니다.\n그 느낌을 그대로 받아들이고,\n다시 문장으로 돌아옵니다.\n나는 당신의 용서를 구합니다.\n\n이제 충분하다고 느껴지면,\n문장을 살며시 내려놓습니다.\n말은 멈추어도,\n전하려던 마음은 이미 길을 떠났습니다.\n\n깊이 숨을 들이쉬고,\n내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n마지막으로 한 번 더,\n깊이 들이쉬고,\n길게 내쉽니다.\n\n준비가 되었다면 천천히 눈을 뜹니다.\n\n기억해 주세요.\n용서하려는 마음을 일으킨 것만으로,\n용서의 문은 이미 열리기 시작했습니다.\n누군가를 계속 미워하는 것은 나에게 또 하나의 고통입니다.\n그 무거움을 내려놓는 길을 오늘 한 걸음 걸었다면,\n그것으로 충분합니다.\n용서는 단박에 이루어지지 않습니다.\n충분한 시간을 두고,\n같은 자리에 다시 앉을 때마다,\n그 걸음은 조금씩 가벼워질 것입니다.","duration":"약 11분","tags":"#용서명상 #이해와용서 #마음치유","series":"숨비명상"},{"id":"6686333a","category":"용서감사","title":"나를 위한 용서","body":"용서하지 못한 일이 있는 한,\n우리는 그 과거에 계속 머물게 됩니다.\n몸은 오늘을 사는데,\n마음은 그날에 묶여 있는 것이지요.\n\n오늘은 그 매듭을 조금 풀어 보는 시간입니다.\n오늘은 나에게 상처 준 사람을 용서하는 연습입니다.\n\n시작 전에 두 가지만 기억해 주세요.\n용서는 그 일을 잊어버리는 것이 아닙니다.\n지혜로운 눈으로 상대를 이해해 보는 것입니다.\n\n그리고 용서는 억지로 되지 않습니다.\n아직 도저히 어려운 사람은 오늘 꺼내지 않아도 됩니다.\n용기를 낼 수 있을 만한 한 사람이면 충분합니다.\n\n이제 몸을 편안히 준비합니다.\n앉아도 좋고,\n눕는 것이 편하다면 누워도 좋습니다.\n등과 허리를 펴고,\n가슴을 활짝 엽니다.\n깊이 숨을 들이쉬고,\n내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n마지막으로 들이쉬고,\n길게 내쉽니다.\n\n자연스러운 호흡으로 돌아와,\n머리에서 발끝까지 온몸의 긴장을 천천히 풀어 나갑니다.\n이마, 어깨, 가슴, 배,\n다리, 발끝.\n편안해진 몸으로 다시 한 번 깊이 들이쉬고,\n내쉽니다.\n\n이제 마음속으로 한 사람을 떠올려 봅니다.\n살아오며 만난 사람 가운데,\n쉽게 용서가 되지 않는 사람.\n그 사람의 어떤 말이,\n어떤 행동이 나에게 상처가 되었는지 가만히 떠올려 봅니다.\n\n지난 상처가 되살아나 몸이 굳고 마음이 불편해질 수 있습니다.\n괜찮습니다.\n그 감각과 느낌을 충분히 받아들입니다.\n한 손을 가슴 위에 가만히 올려놓아도 좋습니다.\n손바닥의 따뜻함에 기대어,\n그때의 일을 한 발 물러난 자리에서 바라봅니다.\n\n이제 다시 한 번,\n그 사람의 얼굴을 떠올립니다.\n미운 마음도,\n피하고 싶은 마음도 잠시 내려놓고,\n아무 반응 없이 담담하게 바라봅니다.\n마치 저만치 서 있는 한 그루 나무를 바라보듯이.\n나무를 미워하지 않듯,\n나무를 두려워하지 않듯,\n그저 바라볼 수 있는지 살펴봅니다.\n그리고 깊이 숨을 들이쉬고,\n내쉽니다.\n\n그렇게 바라보다가,\n조용히 나를 돌아봅니다.\n나 또한 살아오며 누군가에게 상처를 준 적이 있지 않았던가.\n알고도, 모르고도,\n누군가를 아프게 한 날들이 나에게도 있었습니다.\n그리고 저 사람 역시 자기 몫의 고통과 슬픔을 짊어지고 살아가는 한 사람입니다.\n이 이해가 용서의 문을 엽니다.\n\n이제 호흡에 충분히 머문 뒤,\n그 사람을 향해 마음속으로 말해 봅니다.\n\n나 또한 다른 사람에게 상처를 준 일이 있습니다.\n당신이 나에게 상처를 주었지만,\n이제 나는 당신을 용서합니다.\n\n한 번 더, 천천히 건넵니다.\n\n나에게 깊은 상처를 준 당신을 용서합니다.\n나는 할 수 있는 만큼,\n당신을 용서합니다.\n\n이 문장들을 숨과 함께,\n원하는 만큼 반복합니다.\n할 수 있는 만큼이면 충분합니다.\n\n반복하는 동안 문득문득 미운 마음이,\n불편한 감정이 다시 올라올 수 있습니다.\n자연스러운 일입니다.\n그 마음을 충분히 받아 주고,\n크게 숨을 들이쉬고 내쉰 뒤,\n다시 천천히 용서의 말로 돌아옵니다.\n\n이제 문장을 살며시 내려놓습니다.\n그리고 알아 두세요.\n누군가를 미워하는 동안,\n그 밧줄의 한쪽 끝은 내 손목에 묶여 있습니다.\n용서는 상대를 풀어 주는 일이기 전에,\n내 손목의 매듭을 푸는 일입니다.\n그래서 용서는 그 사람을 위한 것이 아니라,\n나를 위한 것입니다.\n\n깊이 숨을 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n오늘 용서가 다 되지 않았어도 괜찮습니다.\n과연 될까, 판단하지 말고,\n용서하려는 마음을 낸 나를 존중해 주세요.\n그 의도를 일으킨 순간,\n용서는 이미 시작되었습니다.\n같은 자리에 매일 앉아 조금씩 마음이 열리는 것으로,\n충분합니다. 매듭은 그렇게,\n한 올씩 풀려 갑니다.","duration":"약 11분","tags":"#용서명상 #나를위한용서 #마음치유","series":"숨비명상"},{"id":"9b9792a1","category":"자비희사","title":"나를 안는 말","body":"우리는 이상하게도,\n남에게는 친절하면서 나에게는 그렇지 못합니다.\n친구의 실수에는 괜찮다고 말해 주면서,\n나의 실수에는 밤새 나를 다그칩니다.\n\n지난 일을 후회하고,\n오지 않은 일을 걱정하고,\n스스로에게 화를 내면서요.\n하지만 나를 따뜻하게 대할 줄 모르면,\n다른 사람의 아픔을 따뜻하게 안아 주기도 어렵습니다.\n\n그래서 자비는 나에게서 시작합니다.\n오늘은 나에게 따뜻한 말 한마디를 건네는 연습을 해 보겠습니다.\n\n고요히 앉아 허리를 펴고,\n몸의 긴장을 내려놓습니다.\n조용히 눈을 감고,\n잠시 호흡에 주의를 둡니다.\n들이쉬는 숨에, 들숨.\n내쉬는 숨에, 날숨.\n마음속으로 이름을 붙이며 내가 이렇게 숨 쉬고 있음을 알아차립니다.\n\n이제 나에게 조용히 물어봅니다.\n지금 나에게 진정으로 필요한 바람은 무엇일까.\n서두르지 말고,\n충분히 시간을 들여 찾아봅니다.\n내가 지금의 나를 있는 그대로 사랑할 수 있기를.\n내가 건강하기를.\n내가 행복하기를.\n내가 편안하기를.\n이 가운데 하나여도 좋고,\n나만의 문장이어도 좋습니다.\n\n나의 문구를 찾았다면,\n이제 그 말을 나를 향해 건넵니다.\n자연스러운 호흡에 맞춰,\n따뜻한 마음으로,\n천천히 반복합니다.\n내가 나를 있는 그대로 사랑하기를.\n내가 건강하고 행복하기를.\n\n원한다면 한 손을 가슴에 얹습니다.\n손바닥의 온기를 느끼며,\n그 온기 위에 말을 포개어 올립니다.\n내가 행복하기를.\n내가 편안하기를.\n\n반복하다 보면 이런 마음이 들 수도 있습니다.\n말이 겉도는 것 같고,\n어색하고,\n오히려 마음이 불편해지기도 합니다.\n괜찮습니다.\n잘못하고 있는 것이 아닙니다.\n가슴은 원래 열렸다가 닫혔다가 하며 숨을 쉽니다.\n지금 닫혀 있다면,\n억지로 열려고 하지 말고 문구를 가슴 위에 살짝 올려 두기만 하면 됩니다.\n문 앞에 놓아 둔 선물처럼.\n언젠가 가슴이 열리는 날,\n그 말은 저절로 안으로 들어갑니다.\n\n떠오르는 생각이 있다면 따라가지 않고,\n올라오는 감정이 있다면 누르지도,\n외면하지도 않습니다.\n그저 바라보고,\n다시 문구로 돌아옵니다.\n내가 나를 사랑하기를.\n내가 편안하기를.\n\n원하는 만큼,\n숨과 함께 나를 안는 말에 머뭅니다.\n\n이제 문구를 살며시 내려놓고,\n잠시 호흡에만 주의를 둡니다.\n말이 지나간 가슴에 남아 있는 온기를 느껴 봅니다.\n\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n이 연습은 방석 위에서만 하는 것이 아닙니다.\n산책을 하면서,\n설거지를 하면서,\n지하철에 앉아서도 할 수 있습니다.\n하루에도 몇 번씩,\n나에게 이 말을 건네 주세요.\n내가 행복하기를.\n남에게 하듯 나에게도 친절한 사람,\n나를 안아 줄 수 있는 사람이 되어 가기를 바랍니다.","duration":"약 9분","tags":"#자비명상 #자기자비 #나를돌보는시간","series":"숨비명상"},{"id":"099b81f6","category":"자비희사","title":"자비의 물결","body":"고요한 호수에 물방울 하나가 떨어지면,\n작은 물결이 일어나 가장자리까지 번져 갑니다.\n자비의 마음도 그렇습니다.\n내 가슴에서 시작된 따뜻함은 가까운 사람에게,\n스쳐 가는 사람에게,\n그리고 마침내 모든 존재에게 번져 갑니다.\n지난 시간,\n나를 안는 말로 물결의 중심을 만들었다면,\n오늘은 그 물결을 바깥으로 넓혀 보겠습니다.\n\n편안하게 앉아도 좋고,\n누워도 좋습니다.\n허리를 펴고,\n목과 어깨의 긴장을 풀어 줍니다.\n숨을 크게 들이쉬고,\n내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n마지막으로 들이쉬고,\n길게 내쉽니다.\n자연스러운 호흡으로 돌아와,\n지금 내가 여기서 숨 쉬고 있음을 알아차립니다.\n\n첫 물결은 언제나 나에게서 시작합니다.\n잠시 나를 향해 따뜻한 마음을 보냅니다.\n내가 건강하기를.\n내가 행복하기를.\n내가 편안하기를.\n\n이제 물결을 한 겹 넓힙니다.\n마음 깊이 존경하는 분을 한 분 떠올립니다.\n그분의 얼굴을 그리며,\n따뜻한 바람을 보냅니다.\n당신이 건강하기를.\n당신이 행복하기를.\n당신이 용기를 갖게 되기를.\n당신이 고통과 불안에서 벗어나기를.\n하나의 문구를 반복해도 좋고,\n두세 개를 오가도 좋습니다.\n충분히 머뭅니다.\n\n물결이 더 넓어집니다.\n사랑하는 가족,\n소중한 친구들을 한 사람씩 떠올리며,\n같은 바람을 보냅니다.\n당신이 건강하기를.\n당신이 행복하기를.\n\n이번에는 잘 알지 못하는 분들에게로 물결을 보냅니다.\n아침에 스친 동네 이웃,\n마트의 직원,\n경비실의 어르신.\n이름도 모르는 그분들도 나와 똑같이 행복을 바라며 살아갑니다.\n그분들을 떠올리며 마음을 보냅니다.\n당신이 건강하기를.\n당신이 행복하기를.\n\n이제 조금 더 깊은 물결입니다.\n나를 불편하게 하는 사람에게 마음을 보내 볼 차례인데,\n이것은 준비가 되었을 때만 하면 됩니다.\n오늘이 아니어도 괜찮습니다.\n시작한다면 가장 미운 사람이 아니라,\n조금 불편한 정도의 사람부터 떠올립니다.\n그리고 기억합니다.\n나처럼 이 사람도 행복을 바라고,\n고통을 바라지 않습니다.\n이 사람에게도 자기 삶이 소중합니다.\n그 마음으로 보냅니다.\n내가 당신에게 아무런 미움이 없듯이,\n당신도 나에게 아무런 미움이 없기를.\n당신이 진정으로 건강하고 행복하기를.\n당신이 고통에서 벗어나 편안하기를.\n\n마지막 물결은 가장 멀리까지 갑니다.\n이 세상에 살아 있는 모든 존재들에게로.\n내가 행복을 바라듯,\n살아 있는 모든 존재가 행복을 바랍니다.\n그 모두를 향해 마음을 보냅니다.\n모든 존재들이 행복하기를.\n모든 존재들이 고통에서 벗어나기를.\n\n문구를 보내다 보면 어느 순간 말이 기계처럼 느껴질 수도 있습니다.\n괜찮습니다.\n가슴은 열렸다 닫혔다 하며 제 숨을 쉬고 있고,\n그 오르내림 속에서도 자비는 자라고 있습니다.\n중요한 것은 따뜻한 마음을 내려는 나의 뜻,\n그 하나입니다.\n\n충분히 머물렀다면,\n이제 문구를 내려놓고 잠시 고요히 쉽니다.\n물결이 지나간 호수처럼,\n잔잔해진 마음을 느껴 봅니다.\n\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n호수의 물결은 아무리 작아도 결국 가장자리까지 닿습니다.\n매일 이 자리에 앉아 물결을 일으켜 주세요.\n나에게서 시작된 따뜻함이 모든 존재에게 닿아 있음을,\n그리고 우리 모두가 그 물결로 이어져 있음을,\n조금씩 느끼게 될 것입니다.","duration":"약 11분","tags":"#자비명상 #모든존재의행복 #연결","series":"숨비명상"},{"id":"3e6910c0","category":"관찰","title":"마음의 등불","body":"지난번에는 앉아서 몸에게 짧은 안부를 물었다면,\n오늘은 시간을 넉넉히 두고 온몸을 천천히 도는 긴 여정을 떠나 보겠습니다.\n주의는 등불과 같습니다.\n등불이 비추는 곳은 환하게 깨어나고,\n오래 비추지 않은 방에는 나도 모르는 사이 긴장이 쌓입니다.\n오늘은 그 등불을 들고,\n몸이라는 집의 방들을 하나하나 밝혀 보겠습니다.\n고치려 하지 않고,\n판단하지 않고,\n다만 비추기만 하면 됩니다.\n\n편안하게 자리에 눕습니다.\n두 팔은 몸통 옆에 편안하게 내려놓고,\n두 발은 어깨너비쯤 자연스럽게 벌립니다.\n몸 전체를 가볍게 훑으며,\n힘이 남아 있는 곳을 풀어 줍니다.\n특히 턱 주변과 어금니,\n어깨의 긴장을 살며시 내려놓습니다.\n\n눈을 가볍게 감고,\n호흡에 주의를 둡니다.\n숨을 조절하지 않습니다.\n길면 긴 대로,\n짧으면 짧은 대로,\n드나드는 숨을 있는 그대로 알아차립니다.\n\n준비가 되었으면,\n등불을 들고 머리 꼭대기,\n정수리로 갑니다.\n정수리에서 어떤 감각이 느껴지는지 가만히 지켜봅니다.\n따끔한지, 무거운지,\n아무 느낌이 없는지.\n무엇이든 그대로 알아차립니다.\n\n불빛이 천천히 얼굴로 내려옵니다.\n이마, 눈꺼풀, 코, 입술,\n양쪽 볼. 간지러움, 떨림,\n따뜻함이 있는지 차례로 비춰 봅니다.\n\n이제 목입니다.\n목 안팎의 느낌,\n침이 넘어갈 때의 감각까지 그대로 알아차립니다.\n\n등불이 오른쪽 어깨로 갑니다.\n어깨에서 팔꿈치,\n손목을 지나 오른쪽 손가락 끝까지 천천히 내려갑니다.\n결림이 있는지,\n저림이 있는지,\n어떤 감각이라도 그대로 받아들입니다.\n이번에는 왼쪽 어깨에서 왼쪽 손가락 끝까지,\n같은 길을 비추며 내려갑니다.\n\n이제 가슴 한가운데,\n심장이 있는 자리입니다.\n조여 오는 느낌이 있는지,\n두근거림이 있는지,\n아니면 고요한지,\n있는 그대로 알아차립니다.\n\n배로 내려갑니다.\n숨을 따라 오르내리는 움직임과 그 안쪽의 감각을 가만히 지켜봅니다.\n\n이제 바닥에 닿아 있는 등입니다.\n척추를 따라 위에서 아래로,\n허리까지 천천히 내려가며 닿음과 무게,\n뻐근함을 비춰 봅니다.\n\n등불이 다리로 갑니다.\n오른쪽 허벅지, 무릎,\n종아리,\n발목을 지나 발가락 끝까지.\n이번에는 왼쪽 허벅지, 무릎,\n종아리, 발가락 끝까지.\n그곳에서 일어나는 감각을 있는 그대로 알아차립니다.\n\n돌아보면 방마다 감각이 달랐을 것입니다.\n어떤 방은 따뜻하고,\n어떤 방은 뻐근하고,\n어떤 방은 고요했습니다.\n그리고 그 감각들도 머무는 동안 일어났다가 사라졌을 것입니다.\n불빛이 지나는 사이 마음이 다른 곳으로 떠났다면,\n그것도 알아차리고 다시 몸으로 돌아오면 됩니다.\n\n이제 등불을 내려놓고,\n주의를 호흡에 둡니다.\n편안하게 들숨과 날숨을 쉽니다.\n몸 어딘가에서 감각이 느껴지면 알아차리고,\n다시 호흡으로 돌아옵니다.\n\n이제 호흡에 두었던 주의도 살며시 내려놓고,\n잠시 그대로 머뭅니다.\n온몸이 환해진 집처럼 느슨하고 편안합니다.\n\n준비가 되었으면,\n손가락과 발가락을 가볍게 움직여 봅니다.\n몸을 좌우로 천천히 흔들며 기지개를 켭니다.\n편안한 호흡을 두세 번 한 뒤,\n눈을 뜨고 천천히 일어나 앉습니다.\n\n우리는 몸에 주의를 두지 않고 살기에,\n긴장이 쌓여도 알아차리지 못합니다.\n긴장은 언제나 불빛이 닿지 않는 어두운 방에 쌓입니다.\n그러니 마음이 방황하는 날,\n지친 하루의 끝에,\n이 등불을 들고 몸을 한 바퀴 돌아 주세요.\n비추는 것만으로,\n몸은 스스로 풀리기 시작합니다.","duration":"","tags":"#몸관찰명상 #바디스캔 #깊은이완","series":"숨비명상"},{"id":"a6aa7240","category":"수용","title":"일상의 방석","body":"시끄러운 소리가 들려오면 우리는 어떻게 반응하나요.\n대부분 저도 모르게 짜증부터 냅니다.\n그런데 알아차림이 있다면,\n그 소리는 그저 지금 귀에 들려오는 하나의 소리일 뿐입니다.\n설령 화가 올라와도,\n알아차린 화는 오래 머물지 못합니다.\n이 알아차림은 방석 위에서만 연습하는 것이 아닙니다.\n사실 우리 하루 곳곳에는 보이지 않는 명상 방석이 숨어 있습니다.\n세면대 앞에, 싱크대 앞에,\n거실 한가운데에.\n오늘은 그 숨은 방석 세 개를 찾아가 보겠습니다.\n\n첫 번째 방석은 세면대 앞에 있습니다.\n양치하기입니다.\n우리는 매일 두 번 이상 이를 닦지만,\n닦는 3분 동안 마음은 오늘 할 일들을 먼저 닦고 있습니다.\n오늘은 다르게 해 봅니다.\n\n칫솔이 이에 닿는 그 자리에 주의를 둡니다.\n입안 구석구석에서 무슨 일이 벌어지고 있나요.\n칫솔이 오가는 소리,\n퍼지는 치약의 맛과 향,\n움직이는 팔,\n마지막 물로 헹구는 감각까지.\n한 번에 하나씩만 따라가면 됩니다.\n그러다 문득,\n서둘러 해치우려는 마음이 보일지도 모릅니다.\n그 마음을 본 것,\n그것이 이미 명상입니다.\n\n두 번째 방석은 싱크대 앞에 있습니다.\n설거지입니다.\n설거지를 좋아하는 사람은 드뭅니다.\n쌓인 그릇을 보는 순간 귀찮음과 짜증이 먼저 올라오지요.\n바로 거기서 시작합니다.\n\n그릇들을 바라보며 지금 올라오는 마음을 알아차립니다.\n귀찮구나. 짜증이 있구나.\n그리고 손에 주의를 옮깁니다.\n손에 닿는 물의 온도,\n차가운지, 따뜻한지.\n그릇의 매끄러움과 무게.\n거품이 미끄러지는 감촉.\n한 번에 그릇 하나씩,\n그 하나에만 머뭅니다.\n마음이 딴 데로 떠돌면 알아차리고,\n다시 손끝의 물소리로 돌아옵니다.\n그렇게 씻다 보면,\n짜증스럽던 설거지가 나를 들여다보는 고요한 시간으로 바뀌어 있습니다.\n\n세 번째 방석은 거실에 있습니다.\n청소하기입니다.\n청소기를 가지러 걸어가는 그 걸음부터 시작합니다.\n바닥을 딛는 발바닥에 주의를 둡니다.\n손잡이를 잡을 때의 감촉,\n청소기를 밀고 당길 때 팔에 실리는 힘,\n바닥 위를 오가는 움직임.\n그 하나하나를 따라갑니다.\n어떤 생각이나 감정이 끼어들면,\n그저 알아차리고 다시 하던 일로 돌아오면 됩니다.\n\n이 세 개의 방석에는 공통점이 있습니다.\n매일 반복되고, 몸을 쓰고,\n집중할 곳이 분명하다는 것.\n그래서 특별한 시간을 따로 내지 않아도,\n평범한 행동에 알아차림 하나만 얹으면 그 시간이 그대로 명상이 됩니다.\n\n오늘,\n셋 중 하나만 골라 보세요.\n그리고 당분간 그 하나만 꾸준히 연습해 보세요.\n매일 지나치던 그 평범한 몇 분이,\n하루 중 가장 고요한 나만의 시간이 되어 줄 것입니다.\n방석은 이미 집 안 곳곳에 깔려 있습니다.\n앉기만 하면 됩니다.","duration":"약 9분","tags":"#생활명상 #일상알아차림 #집안일명상","series":"숨비명상"},{"id":"2af76a3e","category":"수용","title":"아침의 선물","body":"우리에겐 선물처럼 매일 새로운 아침이 주어집니다.\n지금부터 그 선물을 열어 보는 짧은 명상을 함께하겠습니다.\n\n침대 위여도 좋고,\n지하철이나 버스 안이어도 좋습니다.\n지금 있는 그 자리에서,\n평화로운 하루를 시작할 수 있습니다.\n\n편안한 자세를 찾아보세요.\n어깨를 살짝 늘어뜨리고,\n눈을 감습니다.\n눈을 감기 어려운 곳이라면,\n시선을 아래로 부드럽게 내려도 좋습니다.\n\n이제 가볍게 호흡합니다.\n들이쉬고, 내쉬고.\n코로 숨이 들어왔다 나가는 느낌을 가만히 따라가 봅니다.\n\n어떤 생각이 떠오르거나 잠시 주의가 흐트러져도 괜찮습니다.\n알아차리고,\n다시 숨으로 돌아오면 됩니다.\n\n들이쉬고, 내쉬고. 들이쉬고,\n내쉬고.\n몸과 마음이 편안해질 때까지,\n이 호흡에 잠시 머뭅니다.\n\n이제 마음을 여는 말들을 함께 따라 해 보겠습니다.\n소리 내어 말해도 좋고,\n소리 낼 수 없는 곳이라면 마음속으로만 따라 해도 충분합니다.\n한 문장, 한 문장,\n천천히 스며들게 합니다.\n\n나는 늘 건강하고 활기차며,\n언제나 감사하는 마음으로 식사를 합니다.\n\n나의 가족은 언제나 건강하고 활력이 넘치며,\n서로 믿고, 서로 사랑합니다.\n\n나는 즐겁게 일하며,\n내가 하는 일에 감사를 느낍니다.\n나는 나의 일에 자부심을 느끼고,\n함께하는 사람들을 신뢰하고 사랑합니다.\n\n나는 늘 풍요롭고,\n필요한 것은 필요한 만큼 채워집니다.\n\n나는 언제나 기쁘고 평화롭습니다.\n지금 어렵다고 느끼는 일도,\n결국은 좋은 열매가 될 것임을 나는 압니다.\n\n나는 매일 편안하게 잠들고,\n상쾌한 기분으로 일어납니다.\n\n나는 모든 이를 사랑하고,\n모든 것에 감사합니다.\n\n아, 감사합니다.\n내가 바라는 모든 것이 이미 이루어져 있음에 감사합니다.\n\n이 말들의 여운을 가슴에 잠시 담아 둡니다.\n말이 지나간 자리에 따뜻한 기운이 남아 있습니다.\n\n이제 깊이 숨을 들이쉬고,\n길게 내쉽니다.\n준비가 되면 천천히 눈을 뜹니다.\n\n오늘 아침의 이 잠깐이,\n하루 전체를 데워 주는 작은 불씨가 되어 줄 것입니다.\n선물처럼 받은 오늘 하루를,\n순수한 즐거움과 평화로 가득 채워 보세요.","duration":"약 7분","tags":"#아침명상 #확언명상 #하루의시작","series":"숨비명상"},{"id":"78e2896e","category":"관찰","title":"한 모금의 온기","body":"우리는 하루에도 몇 번씩 차를 마십니다.\n오늘은 그 익숙한 한 잔을,\n처음 만나는 것처럼 새롭게 마셔 보려 합니다.\n\n평소에 즐겨 마시는 차를 한 잔 준비해 보세요.\n커피도 좋고,\n보리차도 좋습니다.\n따뜻한 차라면 더 좋습니다.\n그리고 방해받지 않는 조용한 자리에 편안히 앉습니다.\n\n허리는 가볍게 세우고,\n어깨의 힘은 스르르 내려놓습니다.\n아직 몸 어딘가에 긴장이 남아 있어도 괜찮습니다.\n지금 이대로, 충분합니다.\n\n숨을 한 번 천천히 들이쉬고,\n내쉬어 보세요.\n내쉬는 숨을 따라 몸이 조금씩 부드러워지는 것을 느껴 봅니다.\n\n이제 찻잔을 테이블 위에 내려놓고,\n가만히 바라봅니다.\n지금 눈에 보이는 것을 그저 바라보기만 합니다.\n찻잔의 모양,\n그 안에 담긴 차의 빛깔.\n\n따뜻한 차라면 잔 위로 피어오르는 김이 보일지도 모릅니다.\n하얀 김이 천천히 올라와 공기 속으로 사라지는 모습을 지켜봅니다.\n서두를 것은 아무것도 없습니다.\n\n천천히 손을 뻗어 봅니다.\n손이 찻잔을 향해 나아가는 그 움직임을 알아차리며,\n잔을 감싸 쥡니다.\n\n손바닥에 닿는 감각을 느껴 보세요.\n따뜻한가요, 매끄러운가요.\n손끝으로 스며드는 온기가 있다면,\n잠시 그 느낌에 머물러 봅니다.\n겨울날 언 손을 이불 속에 넣었을 때처럼,\n온기가 손에서 팔로 번져 가는 것을 느껴 봅니다.\n\n이제 찻잔을 천천히 들어 올립니다.\n들어 올리는 동안,\n잔의 무게가 손에 전해집니다.\n\n잔을 입술 가까이 가져와 봅니다.\n잔이 입술에 닿는 순간의 느낌을 알아차립니다.\n따뜻한지, 매끄러운지.\n그리고 차의 향이 코끝에 먼저 도착합니다.\n그 향을 한 번 깊이 들이마셔 보세요.\n\n이제 차를 한 모금,\n아주 천천히 마십니다.\n바로 삼키지 않고,\n입안에 가만히 머금어 봅니다.\n\n차가 머물고 있는 입안을 느껴 봅니다.\n온도가 느껴지나요.\n혀 위에 얹힌 액체의 무게가 느껴지나요.\n맛은 어떤가요. 단맛, 쓴맛,\n고소함.\n이름을 붙이지 않아도 괜찮습니다.\n그저 느껴지는 대로 두면 됩니다.\n\n이제 천천히 삼킵니다.\n한 모금의 온기가 목을 지나,\n가슴을 지나,\n몸 안쪽으로 부드럽게 내려가는 것을 따라가 봅니다.\n따뜻한 물줄기가 몸 한가운데를 지나가는 것 같습니다.\n그 길을 끝까지 배웅하듯 느껴 봅니다.\n\n차를 다 삼킨 입안은 어떤가요.\n혀끝에 남은 맛이 있나요.\n입안에 고인 침, 촉촉함,\n산뜻함.\n그런 작은 느낌들이 하나씩 다가왔다가 지나갑니다.\n느낌을 애써 찾으려 하지 않아도 됩니다.\n마음을 가만히 입안에 두면,\n느낌이 저절로 찾아옵니다.\n\n이제 자유롭게,\n자신의 속도로 차를 마셔 봅니다.\n한 모금마다 손의 온기,\n입술의 감촉, 혀 위의 맛,\n목을 타고 내려가는 따뜻함을 함께합니다.\n\n도중에 다른 생각이 떠올라도 괜찮습니다.\n알아차렸다면,\n다시 부드럽게 찻잔으로 돌아오면 됩니다.\n\n찻잔을 내려놓고,\n살며시 눈을 감아 봅니다.\n지금 몸 안에 남아 있는 느낌에 머물러 봅니다.\n배 속 어딘가에 남은 온기,\n가슴에 번진 편안함.\n\n늘 곁에 있었지만 미처 몰랐던 한 잔의 차가,\n오늘은 나를 이렇게 따뜻하게 데워 주었습니다.\n그 고마움이 은은하게 차오르는 것을 느껴 봅니다.\n\n이제 천천히 돌아올 시간입니다.\n손끝을 가볍게 움직여 보고,\n발끝도 살짝 움직여 봅니다.\n숨을 한 번 깊이 들이쉬고,\n내쉬면서 살며시 눈을 뜹니다.\n한 모금의 온기를 몸 안에 간직한 채,\n지금 이 자리로 돌아옵니다.\n\n오늘 하루,\n차 한 잔을 앞에 두는 순간이 온다면,\n그때마다 이 따뜻함을 잠시 떠올려 보셔도 좋습니다.","duration":"약 8분","tags":"#차명상 #오감알아차림 #일상속쉼","series":"숨비명상"},{"id":"e3f0daf0","category":"움직임명상","title":"발끝의 여행","body":"명상은 앉아서만 하는 것이 아닙니다.\n출근길에도, 퇴근길에도,\n산책하는 동안에도 할 수 있습니다.\n오늘은 걸으면서 하는 명상,\n매일 걷던 길이 특별한 여행이 되는 시간을 함께해 보겠습니다.\n\n운동화 끈을 단단히 조이고,\n자연과 가까운 곳을 찾아가 봅니다.\n산도 좋고, 바다도 좋고,\n집 앞 작은 공원도 좋습니다.\n가까이에 자연이 없다면,\n지금 걷는 이 길이 아름다운 숲길이라고 상상해 보아도 좋습니다.\n집 안을 천천히 걸어도 충분합니다.\n\n이제 걷기 시작합니다.\n평소보다 훨씬 천천히,\n한 걸음, 한 걸음. 오른발,\n왼발, 오른발, 왼발.\n\n걷는 동안 내 몸에서 느껴지는 감각을 가만히 살펴봅니다.\n발이 땅에 닿을 때마다 발바닥에 전해지는 느낌.\n바닥의 단단함,\n발에 실리는 무게.\n한 발이 땅을 딛는 동안 다른 발이 가볍게 떠오르는,\n그 리듬을 느껴 봅니다.\n\n걷다가 어떤 생각이 떠오를 수 있습니다.\n밀어내지 않아도 되고,\n따라 들어가지 않아도 됩니다.\n아,\n내가 이런 생각을 하고 있구나.\n그렇게 알아차리고,\n발걸음으로 돌아옵니다.\n생각은 바람처럼 왔다가 지나갑니다.\n\n이제 귀를 열어 봅니다.\n걸음 곁으로 찾아오는 소리들.\n새소리일 수도,\n자동차 소리일 수도 있습니다.\n시끄러운 소리가 들려도 괜찮습니다.\n아,\n저런 소리가 나고 있구나.\n그렇게 맞이하고,\n흘려보냅니다.\n소리 때문에 마음이 일렁인다면,\n그 마음도 같은 길로 흘려보냅니다.\n\n이번에는 코끝으로 주의를 옮겨 봅니다.\n걸음에 맞춰 공기가 코로 들어오고,\n코로 나갑니다.\n너무 당연해서 한 번도 고마운 줄 몰랐던 공기.\n하지만 단 한순간도 나를 떠난 적 없는 소중한 공기를,\n반갑고 기쁘게 맞이해 봅니다.\n\n이제 자유롭게 걸어 봅니다.\n걸음이 저도 모르게 빨라지지는 않았는지,\n몸에 불편한 곳은 없는지 가끔씩 살펴보면서,\n발바닥의 감각과 바람과 소리와 함께 나의 속도로 걷습니다.\n\n문득 주위를 둘러봅니다.\n매일 지나치던 익숙한 길인데,\n오늘은 조금 다르게 보입니다.\n여태 보이지 않던 것들이 하나둘 눈에 들어옵니다.\n담장 밑의 작은 풀,\n나뭇잎 사이로 흔들리는 빛.\n\n여행이 즐거운 것은 낯선 곳에서 처음 마주하는 새로운 나의 감정과 모습이 신기하고 반갑기 때문입니다.\n그렇다면 지금 이 길도 이미 여행입니다.\n새로운 눈으로 걷는 순간,\n평범했던 하루가 즐겁고 특별한 여행이 됩니다.\n\n이 여행은 언제든 다시 떠날 수 있습니다.\n필요한 것은 운동화 한 켤레와,\n천천히 걷겠다는 마음뿐입니다.\n오늘의 발걸음이 남은 하루를 가볍게 데려다줄 것입니다.","duration":"약 8분","tags":"#걷기명상 #일상명상 #오감알아차림","series":"숨비명상"},{"id":"ab242aeb","category":"용서감사","title":"용서의 씨앗","body":"마음속에 오래 담아 둔 미움과 분노는,\n누구보다 나 자신을 가장 아프게 합니다.\n그 무거움을 내려놓는 길이 바로 용서입니다.\n\n용서는 세 갈래의 길을 지납니다.\n내가 상처 준 사람에게 용서를 구하고,\n나에게 상처 준 사람을 용서하고,\n마지막으로 나 자신을 용서하는 길입니다.\n오늘 그 길을 천천히 함께 걸어 보겠습니다.\n가슴에 작은 씨앗 하나를 심는다는 마음이면 충분합니다.\n\n편안한 자세로 앉아서 부드럽게 눈을 감습니다.\n호흡에 주의를 기울이며 숨을 들이쉬고,\n내쉽니다. 들이쉬고, 내쉬고.\n들이쉬고, 내쉬고.\n숨결이 고요해질 때까지 잠시 머뭅니다.\n\n먼저,\n내가 다른 사람에게 말로,\n생각으로,\n행동으로 상처를 주었던 상황을 떠올려 봅니다.\n그때 그 사람이 느꼈을 아픔과 실망을 가만히 헤아려 봅니다.\n\n이제 그 사람을 향해 천천히 따라 해 주세요.\n소리 낼 수 없다면 마음속으로 따라 해도 좋습니다.\n\n지금 당신에게 용서를 구합니다.\n나를 용서해 주세요.\n\n진심을 담아,\n이 말을 몇 번이고 반복합니다.\n말이 오갈 때마다 가슴이 조금씩 가벼워집니다.\n\n다음은,\n나에게 상처를 준 사람을 용서할 차례입니다.\n이 길에서는 서두르지 않는 것이 가장 중요합니다.\n\n내가 어떻게 상처받았는지,\n가장 또렷하게 기억나는 한 장면을 떠올려 봅니다.\n너무 크고 깊은 상처라면,\n아직 꺼내지 않아도 됩니다.\n오늘 마주할 수 있을 만큼의 기억이면 충분합니다.\n\n그 기억과 함께 몸에서,\n가슴에서,\n마음에서 올라오는 아픔을 온화하게 맞이해 봅니다.\n아픔을 없애려 하지 않고,\n다만 곁에 두고 바라봅니다.\n\n이제 마음속으로 그 사람의 이름을 조용히 부릅니다.\n그리고 용서의 말을 건넵니다.\n천천히 따라 해 주세요.\n\n나는 사람들이 두려움과 고통,\n혼란과 분노 때문에 나에게 상처를 주었던 여러 순간들을 기억합니다.\n\n나는 이 아픔을 오랫동안 가슴속에 지닌 채 살아왔습니다.\n\n그렇지만 내가 할 수 있는 만큼,\n당신에게 용서의 마음을 전합니다.\n\n당신을 용서합니다.\n\n지금 다 용서되지 않아도 괜찮습니다.\n할 수 있는 만큼이면,\n오늘은 충분합니다.\n\n마지막으로,\n상처받은 나 자신을 용서할 차례입니다.\n\n내가 나에게 고통과 괴로움을 안겨 주었던 일들을 천천히 떠올려 봅니다.\n스스로를 몰아세우고, 탓하고,\n아프게 했던 시간들.\n그 시간을 지나며 몸과 가슴과 마음에 남은 아픔과 슬픔과 부끄러움을,\n있는 그대로 인정해 봅니다.\n\n이제 나에게 용서의 말을 건넵니다.\n천천히 따라 해 주세요.\n\n내가 나에게 어떻게 상처를 주었는지,\n이제는 알고 느낍니다.\n지금 나는, 나를 용서합니다.\n\n이 말을 몇 번이고 나에게 다시 보내 줍니다.\n지금 이 마음이 용서의 씨앗이 됩니다.\n\n이제 나와 타인에 대한 생각을 모두 살며시 내려놓습니다.\n텅 빈 고요 속에서 숨을 한 번 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되면 천천히 눈을 뜹니다.\n\n용서는 미움에 찬 마음을 내려놓는 일입니다.\n분노와 두려움이 더는 자라나지 않게 하는 일입니다.\n오늘 심은 이 작은 씨앗은,\n같은 자리에 다시 앉을 때마다 조금씩 자라날 것입니다.\n그리고 어느 날,\n온전히 사랑하려는 마음이 용서의 꽃으로 피어날 것입니다.","duration":"약 12분","tags":"#용서명상 #자기용서 #마음치유","series":"숨비명상"},{"id":"63a4823e","category":"수용","title":"손을 펴며","body":"우리는 하루 종일 무언가를 쥐고 삽니다.\n스마트폰을 쥐고,\n할 일을 쥐고,\n걱정과 서운함을 쥐고.\n잠들 때조차 마음의 주먹은 풀리지 않을 때가 많습니다.\n오늘은 쥐는 연습이 아니라,\n놓는 연습을 해 보겠습니다.\n\n편안한 자세로 앉습니다.\n허리를 세우고,\n어깨의 힘을 내려놓습니다.\n눈을 감고,\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n\n먼저 몸으로 한 가지 실험을 해 봅니다.\n두 손을 무릎 위에 놓고,\n주먹을 꽉 쥐어 봅니다.\n더 세게, 힘껏 쥐어 봅니다.\n손이 떨리고,\n팔이 뻐근해집니다.\n쥐고 있는 데에는 이렇게 힘이 듭니다.\n\n이제 숨을 내쉬며,\n천천히 주먹을 펴 봅니다.\n손가락이 하나씩 풀리고,\n손바닥이 열립니다. 어떤가요.\n펴는 데에는 아무 힘도 들지 않습니다.\n쥐는 것이 애씀이고,\n놓는 것이 쉼입니다.\n손바닥에 퍼지는 얼얼한 편안함을 잠시 느껴 봅니다.\n\n이제 마음속에 등에 멘 배낭 하나를 떠올려 봅니다.\n보이지 않지만 오랫동안 지고 다닌 마음의 배낭입니다.\n그 안에는 한 번도 쓰지 않으면서 버리지도 못한 짐들이 들어 있습니다.\n\n오늘은 그중 하나만 꺼내 보겠습니다.\n오래전에 끝난 일에 대한 후회일 수도 있고,\n다시 볼 일 없는 사람에 대한 미움일 수도 있고,\n언젠가 쓸지 모른다며 쌓아 둔 걱정일 수도 있습니다.\n가장 오래 업고 다닌 것 하나를 골라 봅니다.\n\n그 짐을 꺼내어 두 손 위에 가만히 올려놓습니다.\n그리고 무게를 느껴 봅니다.\n아, 이만큼을 지고 다녔구나.\n이 무게 때문에 어깨가 그렇게 무거웠구나.\n\n놓으면 큰일 날 것 같아 여태 쥐고 있었을 것입니다.\n하지만 기억해 주세요.\n천길 낭떠러지인 줄 알았던 그 아래에,\n땅은 언제나 한 뼘 거리에 있습니다.\n\n이제 숨을 깊이 들이쉬고,\n길게 내쉬면서,\n두 손을 천천히 펴 봅니다.\n짐이 손을 떠나,\n바로 아래의 땅에 가만히 내려앉습니다.\n떨어진 것이 아니라,\n내려놓아진 것입니다.\n\n그리고 살펴봅니다.\n아무 일도 일어나지 않았습니다.\n하늘이 무너지지도,\n내가 무너지지도 않았습니다.\n다만 어깨가 조금 가벼워졌고,\n숨이 조금 깊어졌을 뿐입니다.\n빈 두 손이 무릎 위에서 편안히 쉬고 있습니다.\n\n내일이면 나도 모르게 그 짐을 다시 주워 들지도 모릅니다.\n괜찮습니다.\n놓는 것은 한 번에 끝나는 일이 아니라,\n쥐고 있음을 알아차릴 때마다 다시 펴는 연습입니다.\n오늘 한 번 놓아 본 손은,\n다음번에는 조금 더 쉽게 펴집니다.\n\n이제 가벼워진 몸으로 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n오늘 하루,\n어깨가 무거워지는 순간이 온다면,\n가만히 주먹을 쥐었다가 숨과 함께 펴 보세요.\n그 작은 동작 하나가 기억하게 해 줄 것입니다.\n쥐는 것이 애씀이고,\n놓는 것이 쉼이라는 것을.\n그리고 땅은 언제나,\n한 뼘 아래에서 기다리고 있다는 것을.","duration":"약 9분","tags":"#내려놓기명상 #방하착 #마음비우기","series":"숨비명상"},{"id":"40823a60","category":"수용","title":"작은 악기","body":"우주가 하나의 거대한 악기라고 상상해 보세요.\n그렇다면 우리의 몸은 그 우주에 속한 작은 악기입니다.\n악기 곁에서 같은 음을 울리면,\n건드리지 않아도 줄이 함께 떨립니다.\n이것을 공명이라 합니다.\n오늘은 부처님의 이름을 불러,\n나라는 작은 악기를 우주라는 큰 악기에 맞추어 보는 시간,\n염불명상을 함께하겠습니다.\n\n편안한 자세로 앉습니다.\n허리를 바로 세우고,\n가슴을 부드럽게 엽니다.\n소리가 지나갈 길을 열어 주는 것입니다.\n눈을 가볍게 감고,\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n\n이제 부처님의 명호를 불러 봅니다.\n소리 내어 불러도 좋고,\n소리 낼 수 없는 곳이라면 마음속으로 불러도 좋습니다.\n숨을 들이쉬고,\n내쉬는 숨에 실어, 천천히.\n\n나무아미타불.\n\n소리가 몸을 지날 때,\n가슴 한가운데가 잔잔히 울리는 것을 느껴 봅니다.\n한 번 더.\n\n나무아미타불.\n\n이번에는 그 울림이 가슴에서 목으로,\n머리로,\n온몸으로 퍼져 가는 것을 따라가 봅니다.\n내 몸이 정말 하나의 악기처럼,\n이름을 부를 때마다 울리고 있습니다.\n\n이제 호흡의 결에 명호를 얹습니다.\n들이쉬며, 나무. 내쉬며,\n아미타불. 들이쉬며, 나무.\n내쉬며, 아미타불.\n숨이 오가는 대로,\n서두르지 않고,\n파도가 밀려왔다 밀려가듯 부릅니다.\n\n부르면서 이 이름의 뜻을 가만히 새겨 봅니다.\n아미타불은 무량광,\n끝없는 빛이며, 무량수,\n끝없는 생명입니다.\n이름을 부를 때마다 좁고 답답하던 마음의 문이 조금씩 열리고,\n그 틈으로 끝없는 빛이 들어옵니다.\n\n계속 부릅니다. 나무아미타불.\n나무아미타불.\n그러다 어느 순간,\n신기한 일이 일어납니다.\n내가 부르는 작은 소리와 우주의 큰 울림이 만나,\n누가 부르고 누가 응답하는지 경계가 옅어집니다.\n작은 악기의 떨림이 큰 악기의 울림과 하나의 소리가 됩니다.\n부르는 나와 불리는 부처님이,\n둘이 아닙니다.\n\n이제 소리를 살며시 멈추어 봅니다.\n그런데 들어 보세요.\n소리는 멈추었지만,\n울림은 아직 몸 안에 남아 있습니다.\n종을 치고 난 뒤의 긴 여운처럼.\n그 고요한 울림 속에 잠시 머뭅니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n기억해 주세요.\n나는 우주에서 떨어져 나온 존재가 아니라,\n우주와 함께 울리는 작은 악기입니다.\n하루 중 마음이 좁고 어두워질 때,\n명호를 한 번 불러 보세요.\n나무아미타불.\n그 한 번의 부름으로도 작은 악기는 다시 큰 울림에 이어지고,\n닫혔던 문틈으로 끝없는 빛이 들어오기 시작합니다.","duration":"약 9분","tags":"#염불명상 #아미타불 #공명","series":"숨비명상"},{"id":"239028a3","category":"자비희사","title":"마음의 햇살","body":"자애란 조건 없는 사랑의 마음입니다.\n잘했을 때만 비추는 빛이 아니라,\n햇살처럼 아무 조건 없이 행복하기를,\n평화롭기를 바라는 마음입니다.\n오늘은 이 햇살을 피워 내는 정식 연습을 함께하겠습니다.\n먼저 용서로 마음의 땅을 고르고,\n나를 비추고,\n고마운 분을 비추고,\n마지막에는 모든 존재에게로 햇살을 넓혀 갑니다.\n\n편안한 자세로 앉습니다.\n허리를 세우고,\n눈을 감습니다.\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n\n자애의 마음이 잘 자라려면 먼저 마음의 땅이 부드러워야 합니다.\n그래서 용서로 시작합니다.\n들려드리는 문구의 뜻을 마음속으로 음미해 봅니다.\n\n만일 내가 다른 사람에게 몸으로,\n입으로,\n생각으로 잘못을 행했다면,\n내가 평화롭고 행복하게 살 수 있도록 용서받기를 원합니다.\n\n또한 누군가가 나에게 몸으로,\n입으로,\n생각으로 잘못을 행했다면,\n그들이 평화롭고 행복하게 살 수 있도록 나는 용서합니다.\n\n자책과 서운함으로 굳어 있던 마음이 조금 부드러워지는 것을 느껴 봅니다.\n\n이제 첫 햇살은 나를 향합니다.\n잠시 생각해 봅니다.\n이 세상에서 나에게 가장 소중한 존재는 누구인가.\n배우자인가, 아이들인가,\n부모님인가. 모두 소중하지만,\n가만히 들여다보면 그 모두가 소중한 것도 내가 나에게 소중하기 때문입니다.\n\n그 소중한 나를 위해,\n내가 행복했던 순간,\n나의 좋은 점,\n잘 해냈던 일들을 떠올려 봅니다.\n실수한 나를 공격하는 대신,\n따뜻하게 감싸며 문구를 건넵니다.\n\n내 자신이 행복하고 평화롭기를.\n안전하고 자유롭기를.\n괴로움과 슬픔에서 벗어나기를.\n\n주문처럼 외우는 것이 아니라,\n한 구절 한 구절 뜻을 음미하며 반복합니다.\n누군가에게 비는 것이 아니라,\n내가 이 따뜻한 바람의 발신처가 되는 것입니다.\n잠시 나를 향해 이 햇살에 머뭅니다.\n\n이제 햇살을 한 사람에게로 옮깁니다.\n살아 계신 분 가운데 고마운 분,\n존경하는 분,\n나의 은인 한 분을 떠올립니다.\n설레는 마음이 이는 상대는 오늘은 접어 둡니다.\n자애가 다른 감정과 섞이지 않게 하기 위해서입니다.\n\n그분과 맺었던 좋은 인연,\n고마웠던 일,\n존경스러운 모습을 마음속 깊이 떠올립니다.\n그리고 그분의 얼굴을 마주하듯 그리며,\n그분의 이름이나 호칭을 넣어 문구를 건넵니다.\n\n당신께서 행복하고 평화롭기를.\n안전하고 자유롭기를.\n괴로움과 슬픔에서 벗어나기를.\n\n이것은 내가 그분보다 나아서가 아닙니다.\n누구라도 행복하기를 바라는 좋은 마음을,\n그저 계속 일으키는 것입니다.\n다른 생각이 끼어들면 가볍게 알아차리고 문구로 돌아옵니다.\n별 느낌이 없다면 고마웠던 일을 한 번 더 떠올리고 다시 건넵니다.\n그래도 잘 안 되면 다른 분으로 바꾸어도 됩니다.\n미안해할 일이 아닙니다.\n몸이 많이 불편하면 자세를 고쳐 앉고 이어 가도 괜찮습니다.\n\n충분히 머물렀다면,\n이제 햇살을 가장 넓게 펼칩니다.\n살아 있는 모든 존재를 향해서입니다.\n그들 모두,\n나와 똑같이 자기 자신에게 가장 소중한 존재들입니다.\n그들도 나처럼 행복을 바라고 고통을 바라지 않습니다.\n그 모두를 향해, 조건 없이,\n한계 없이, 문구를 보냅니다.\n\n모든 존재들이 행복하고 평화롭기를.\n안전하고 자유롭기를.\n괴로움과 슬픔에서 벗어나기를.\n\n잠시 이 넓은 햇살 속에 머뭅니다.\n\n이제 문구를 내려놓고,\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n이 연습은 방석 위에서만 하는 것이 아닙니다.\n길을 걸으며, 차 안에서,\n눈에 보이는 모든 이들을 향해 건넬 수 있습니다.\n그리고 마음이 힘든 날에는,\n나에게 먼저 건네 주세요.\n내가 이 괴로움에서 벗어나기를.\n내가 행복하고 평화롭기를.\n자애는 씨뿌리기와 같아서 바로 싹이 트지 않아도,\n자주 뿌리고 물을 주면 어느 날 하나씩 피어납니다.\n그렇게 피어난 햇살은 차차 사랑하는 이에게,\n무덤덤한 이에게,\n언젠가는 미운 이에게까지 가 닿게 될 것입니다.","duration":"약 12분","tags":"#자애명상 #자애문구 #모든존재","series":"숨비명상"},{"id":"0599e1c4","category":"호흡명상","title":"나의 숨자리","body":"우리는 평생 숨을 쉬어 왔지만,\n숨 쉬는 법을 배운 적은 없습니다.\n그래서 처음 명상을 하면 이상한 일이 생깁니다.\n숨에 주의를 두는 순간,\n오히려 답답해지는 것이지요.\n괜찮습니다.\n오늘은 숨을 잘 쉬는 연습이 아니라,\n내 숨과 처음 인사하고,\n내 숨이 가장 잘 느껴지는 나만의 자리를 찾는 시간입니다.\n잘하고 못하고가 없고,\n남과 비교할 일도 없습니다.\n\n자세부터 자유롭게 정합니다.\n앉아도 좋고,\n누워도 좋습니다.\n오늘은 편한 쪽이 정답입니다.\n눈은 감아도 좋지만,\n감았을 때 몸이 흔들리거나 어지럽다면,\n살짝 뜨고 시선을 바닥에 내려 두어도 됩니다.\n\n먼저 작은 확인을 하나 해 봅니다.\n입을 가만히 다물고 코로만 숨을 쉬어 봅니다.\n편안한가요. 혹시 답답하다면,\n어쩌면 나도 모르게 오랫동안 입으로 숨 쉬어 왔는지도 모릅니다.\n그것을 안 것만으로도 오늘 큰 것을 얻었습니다.\n무리하지 말고,\n할 수 있는 만큼만 입을 다물고 코로 쉬어 봅니다.\n\n이제 숨이 지나는 길을 따라 세 곳을 둘러보겠습니다.\n첫 번째 자리는 코끝입니다.\n숨이 들어올 때 콧속을 스치는 서늘한 느낌이 있나요.\n나갈 때의 미지근한 기운은요.\n느껴지면 잠시 머물고,\n잘 안 느껴져도 괜찮습니다.\n\n두 번째 자리는 가슴입니다.\n숨을 따라 가슴이 부드럽게 오르내리는 것을 살펴봅니다.\n여기가 더 또렷한 분도 있을 것입니다.\n\n세 번째 자리는 배입니다.\n숨이 들어올 때 부풀고,\n나갈 때 꺼지는 움직임을 찾아봅니다.\n그런데 여기서 아무것도 느껴지지 않는 분이 분명 있을 것입니다.\n배가 없는 것 같고,\n억지로 움직이면 엇박자만 나고.\n전혀 이상한 일이 아닙니다.\n아주 많은 사람이 처음에는 그렇습니다.\n\n배가 느껴지지 않는다면,\n한 손을 배 위에 가만히 얹어 보세요.\n손바닥의 무게 아래에서 작은 오르내림이 느껴질 수도 있습니다.\n앉아서 안 되면 누워서 얹어 보아도 좋습니다.\n그래도 없다면,\n없는 대로 둡니다.\n그 문은 언젠가 저절로 열립니다.\n\n이제 세 자리 가운데 숨이 가장 또렷하게 느껴진 한 곳을 고릅니다.\n코끝이어도, 가슴이어도,\n배여도 좋습니다.\n그곳이 바로 오늘의 내 숨자리입니다.\n남이 정해 준 자리가 아니라,\n내 몸이 알려 준 자리입니다.\n\n그 자리에 주의를 내려놓고,\n드나드는 숨과 함께 잠시 머뭅니다.\n생각이 끼어들면 알아차리고,\n다시 내 숨자리로 돌아옵니다.\n\n머무는 동안 기억해 둘 것이 하나 있습니다.\n숨은 매번 같지 않습니다.\n어제는 편안하던 숨이 오늘은 불안하기도 하고,\n아침에는 잘되던 것이 오후에는 흐트러지기도 합니다.\n숨이 이상해진 것이 아니라,\n숨이 그날의 마음을 비추고 있는 것입니다.\n그러니 잘 안 되는 날은 이렇게 생각해 주세요.\n아,\n오늘 내 마음이 이렇구나.\n그것을 안 것이 이미 명상입니다.\n\n이제 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n오늘 찾은 숨자리를 잊지 마세요.\n길을 걷다가,\n설거지를 하다가,\n잠자리에 눕다가,\n문득 그 자리에 손을 대듯 물어보세요.\n나는 지금 어떻게 숨 쉬고 있나.\n그렇게 하루에도 몇 번씩 내 숨을 찾아가다 보면,\n어느 날 알게 됩니다.\n평생 무심코 쉬어 온 숨이,\n어느새 온전히 내 것이 되어 있다는 것을.","duration":"약 9분","tags":"#호흡명상 #명상입문 #나에게맞는명상","series":"숨비명상"},{"id":"d7d00a30","category":"수면·이완","title":"불을 끄듯이","body":"잠자리에 들기 전,\n해야 할 일들을 모두 마쳐 주세요.\n화장실도 다녀오고,\n문단속도 하고, 불도 끄고.\n이제 남은 일은 잠드는 것뿐입니다.\n그리고 오늘의 명상은 끝까지 듣지 못해도 좋습니다.\n도중에 잠들어 버린다면,\n그것이 가장 잘한 것입니다.\n\n이불을 덮고 등을 대고 편안히 눕습니다.\n잠시 그대로 머물며,\n침대가 몸을 받쳐 주고 있는 느낌을 음미해 봅니다.\n몸이 조금씩 이불 속으로,\n침대 속으로 파묻혀 가는 느낌.\n오늘 하루 나를 지탱하던 힘을,\n이제 침대에게 맡깁니다.\n\n코로 깊이 들이쉬고,\n입으로 길게 내쉽니다.\n내쉬는 숨과 함께 오늘 하루의 생각들이 저 멀리 흩어진다고 상상해 봅니다.\n한 번 더 들이쉬고,\n내쉬면서,\n몸의 긴장이 따뜻한 물에 녹듯 풀려 나갑니다.\n한 번 더, 들이쉬고,\n길게 내쉽니다.\n\n이제 지금의 몸과 마음이 어떤지 살펴봅니다.\n무거운지, 가벼운지,\n분주한지, 고요한지.\n생각이 떠오르면 막지 말고 그냥 떠오르게 둡니다.\n머리끝에서 발끝까지,\n몸을 천천히 훑어 내려가 봅니다.\n다시 한 번,\n머리에서 발끝까지.\n그리고 숨을 따라 배가 부풀고 꺼지는 것을 가만히 느껴 봅니다.\n\n이제 오늘 하루를 되감기해 보겠습니다.\n아침에 눈을 뜬 그 순간부터,\n마음속 화면에 하루의 장면들을 무심히 재생해 봅니다.\n자세히 볼 필요 없습니다.\n알람을 끄던 손,\n세면대 앞의 나, 아침 식탁,\n집을 나서던 길,\n누군가와 나눈 인사,\n오후의 일들, 저녁의 시간들.\n빠르게 넘어가도 좋고,\n띄엄띄엄이어도 좋습니다.\n그 장면들을 극장 뒷자리에 앉은 사람처럼 무심히 지켜봅니다.\n좋았던 장면도,\n아쉬운 장면도,\n평가 없이 흘려보냅니다.\n하루가 그렇게 처음부터 끝까지 한 번 지나갑니다.\n오늘 하루는 이제 다 본 영화입니다.\n막이 내립니다.\n\n이제 다시 지금 이 순간,\n이불 속의 몸으로 돌아옵니다.\n지금부터는 하루 종일 켜져 있던 몸의 불을 하나씩 꺼 보겠습니다.\n\n가장 먼저,\n왼발 새끼발가락입니다.\n그 작은 곳에 주의를 두고,\n스위치를 끄듯 힘을 뺍니다.\n마음속으로 말해 주어도 좋습니다.\n이제 쉬자.\n새끼발가락의 불이 꺼지고,\n이어서 왼발 전체, 발목,\n종아리, 허벅지,\n엉덩이와 골반까지,\n불이 하나씩 꺼져 갑니다.\n\n이번에는 오른발 새끼발가락입니다.\n이제 쉬자. 오른발 전체,\n발목, 종아리, 허벅지,\n골반까지,\n차례차례 어두워집니다.\n\n허리의 불을 끕니다.\n가슴의 불을 끕니다.\n두 팔을 따라 내려가,\n손바닥,\n손가락 끝까지 꺼 줍니다.\n목구멍, 목, 얼굴,\n그리고 머리.\n마지막 불이 사르르 꺼집니다.\n\n이제 온 집이 고요하고 어둡습니다.\n긴장이 풀려 나간 자리,\n아무것도 붙잡지 않아도 되는 이 느낌을 그저 누립니다.\n이제부터는 마음이 이 생각 저 생각 떠돌아도 내버려 두세요.\n붙잡을 것도,\n돌아올 곳도 없습니다.\n오늘 밤 해야 할 일은 아무것도 남지 않았습니다.\n\n몸은 침대에게,\n하루는 어둠에게 맡기고,\n그렇게, 천천히, 잠 속으로,\n걸어 들어갑니다.\n\n편안한 밤 되세요.","duration":"약 15분","tags":"#수면명상 #잠들기전명상 #깊은잠","series":"숨비명상"},{"id":"74f51e0c","category":"자비희사","title":"자애명상(실습)","body":"먼저 명상의 자세를 잡는다.\n가장 편안하게 집중할 수 있는 자세로 앉는다.\n다리를 반가부좌를 했다가 위의 다리를 앞으로 내려놓고 앉는다.\n이렇게 다리를 수평이 되게 한다.\n방석을 써서 뒤를 약간 높게 해서 앉으면 허리를 바르게 세우는데 도움이 된다.\n이렇게 다리를 서로 겹치지 않게 앉는다.\n매번 좌선할 때마다 다리 위치를 번갈아하면서 앉는다.\n한번은 왼쪽 다리를 앞으로 내밀고,\n한번은 오른쪽 다리를 앞으로 내민다.\n이렇게 교대로 앉아야 한다.\n왜냐하면 다리를 두는 위치가 다를 때 골반에 가는 힘이 달라지기 때문이다.\n앉아보면 알 수 있다.\n앉을 때 불편한 쪽은 조금 더 시간을 할애해 앉아줄 필요가 있다.\n어느 쪽 다리를 앞에 놓아도 자세가 안정될 수 있도록 그렇게 앉는 것이 좋다.\n다리는 그렇게 하고,\n허리는 쭉 펴준다.\n허리를 쭉 펴려면 명치를 약간 들어 올린다.\n가슴이 약간 앞으로 나오게 하고 가슴을 살짝 벌리고 손은 편안한 곳에 둔다.\n\n20분 정도 함께 명상을 해보도록 한다.\n종소리가 울리면 시작을 알리는 것이다.\n눈은 감는 것이 좋은지,\n뜨는 것이 좋은지,\n각자에게 달려있지만,\n남방에서는 위빠사나든,\n자애명상이든,\n일단 감으라고 안내한다.\n특히 집중력을 요할 때는 꼭 감으라고 한다.\n위빠사나나 자애명상을 할 때에는 되도록 눈을 감고한다.\n눈을 감아야 마음속에 대상이 선명하게 나타나 집중하기 쉬워지기 때문이다.\n감고 싶지 않으면 뜨되,\n시선을 아래로 해서 자기 코끝에 자연스럽게 떨궈 놓는다.\n무엇을 보려고 하지 말되,\n눈을 뜨고 있는 것이다.\n그럼 보이는 것이 있을 것이다.\n그렇게 해도 좋지만,\n기본은 눈을 감고하는 것으로 한다.\n\n종소리 들으면서 시작한다.\n명상을 처음 시작할 때에 기본적으로 앉아있는 자세를 먼저 알아차려본다.\n정수리에서부터 발끝까지 앉아있는 자세를 쭉 훑어 내려가면서 알아차린다.\n몸의 어느 부위가 긴장하거나 힘이 들어가 있으면 편안하게 풀어준다.\n눈 주위, 입 주위,\n목과 어깨,\n그리고 무릎이나 다리에도 힘이 들어가 있으면 편안하게 풀어준다.\n허리를 바르게 세우는 동작은 항상 유지하려고 노력해본다.\n그 외에는 몸의 긴장을 풀고 편안하게 앉아있는 그 자세를 그대로 알아차려본다.\n마음을 향상시키는 것,\n마음을 개발하는 것이 명상이다.\n그러려면 마음으로 뭔가 작업을 해야 한다.\n그것이 처음에 내 몸에 대한 자세를 알아차리는 것으로부터 시작하는 것이다.\n\n어느 정도 몸의 자세가 가다듬어지고 알아차렸다면 이제 호흡에 주의를 가볍게 기울여 본다.\n호흡이 어디에서 선명하게 느껴지는지 그대로 호흡을 따라가면서 느껴본다.\n코로 숨을 들어 마시고 내쉬되,\n편안하고 자연스럽게 한다.\n호흡은 조절하지 않는다.\n빠르면 빠른 대로,\n깊으면 깊은 대로,\n느리면 느린 대로 호흡을 한다.\n그 호흡에 주의를 기울여 가만히 알아차릴 뿐이다.\n코끝에서 혹은 가슴에서 혹은 복부에서 호흡을 알아차린다.\n마음이 많이 산만할 때는 호흡을 세어도 좋다.\n들이마시고 내쉬면서 하나,\n둘, 하면서 여덟까지 세고,\n다시 하나로 내려와서 여덟까지 세는 것을 5분내지 10분 정도 반복하면 마음이 좀 가라앉을 것이다.\n숫자를 셀 때, 다섯 이상,\n열 이하로 센다.\n여덟까지 세는 것은 사성제의 팔정도를 닦는 것을 상징하는 숫자라고 이해하면 될 것이다.\n물론 다섯 까지 세도 좋고,\n열 까지 세도 좋다.\n호흡을 세는 것이 잘되면 그 다음에 호흡을 따라가면서 들숨과 날숨을 그대로 알아차리는 것도 좋다.\n이렇게 해서 사띠(마음챙김)를 호흡을 통해서 좀 더 회복을 한 다음,\n자애명상을 하든 위빠사나를 하는데,\n위빠사나를 먼저 해보겠다.\n\n위빠사나란 지금 현재 내 몸과 마음에서 일어나는 경험을 있는 그대로 놓치지 않고 마음챙겨서 알아차리고 관찰하는 것이다.\n눈으로 보는 것이 아니라 마음으로 있는 그대로 마음의 눈으로 보는 것이다.\n실재로 마음으로 관찰해도 뇌의 후두부인 시각영역이 활성화되는 것을 알 수 있다.\n\n지금 이 순간 내 몸과 마음에서 일어나는 경험 가운데 가장 선명하고 분명하고 두드러지는 경험을 있는 그대로 알아차려본다.\n그 경험은 몸의 여러 부위에서 나타나는 감각일수도 있다.\n특히 불쾌한 감각.\n허리의 뻐근함이나 얼굴의 가려움이나 다리가 저림이나 이런 감각으로 나타날 수 있다.\n그 감각들이 선명하면 그것을 알아차리면 된다.\n특별한 대상이 없으면 자연스럽게 호흡을 하면서 불렀다 꺼졌다 움직이는 복부에 주의를 기울여본다.\n숨을 들여 마실 때 배가 불러오면 ‘부른다’ 숨을 내쉴 때 배가 꺼지면 꺼진다' 이렇게 명칭을 가볍게 붙이면서 복부의 움직임에 주의를 모으는 훈련을 하는 것이다. 이것이 가장 기본적인 복부의 움직임에 마음챙김을 확립시키는 위빠사나의 방법이다. 그러다가 복부의 움직임보다 더 선명한 경험이 몸과 마음에서 일어나면 일어나는 즉시 사띠를 보내서 있는 그대로 알아차린다. '가려움,\n가려움', '생각, 생각’,\n‘욕망, 욕망' 이렇게 일어나는 대로,\n경험하는 대로,\n그대로 일상 언어로 명칭을 붙여가면서 마음챙겨 알아차린다.\n알아차린 다음에 대상이 어떻게 진행되고 사라지는 것까지 본 다음에 다시 일차적인 대상,\n기본 대상인 복부의 움직임으로 주의를 돌린다.\n이 훈련을 계속 이어가는 것이 위빠사나 명상이다.\n소리가 들리면 ’들림,\n들림' 더 이상 안 들리면 다시 복부로 돌아간다. 자 그렇게 내적인 경험에 주의를 기울이며 있는 그대로 마음챙겨 알아차리는 작업을 이어간다.\n\n위빠사나를 할 때는 허리가 바르게 펴는 동작을 늘 유지하는 것 외에는 좀 불편하더라고 움직이지 않는다.\n너무 통증이 심해지면,\n알아차리면서 잠깐 자세를 바꿀 수도 있지만,\n가능하면 그 통증을 대상으로 한 사띠,\n마음챙김을 계속 계발해 나가는 것을 기본 원칙으로 한다.\n특히 복부의 움직임에 사띠가 제대로 확립되어 있으면,\n마음이 움직일 때 바로 포착할 수 있다.\n사띠를 계속 날카롭게 지속적으로 유지하는 것이 위빠사나의 성공 여부를 가른다.\n이것은 처음에는 쉽지 않다.\n하지만 계속 연습하면 몸과 마음에서 일어나는 모든 경험을 일어나는 순간에 딱 포착할 수 있게 된다.\n그러한 기민한 사띠가 점점 길러지는 것이다.\n그럴 때,\n마음챙김의 확립이 점점 확고해지고 내 마음에 부정적인 다섯 덮개가 일어나더라도 바로 보고 내려놓을 수 있는 힘이 생기게 되는 것이다.\n\n이것이 나 자신을 보호하면서 남을 보호하는 구체적인 방법이다.\n한번 좌선을 할 때 최소한 30분 이상씩 이렇게 마음챙김을 확립시키는 훈련을 해간다.\n\n이제 자애명상을 해보겠다.\n자애의 마음이란 조건 없는 사랑의 마음,\n친절한 마음,\n행복하고 평화롭고 잘되기를 바라는 마음을 말한다.\n그래서 자애의 마음을 일으키기 위한 준비 단계로 용서의 마음을 먼저 일으킬 필요가 있다.\n내가 잘못한 일에 용서를 구하고 남들이 나에게 잘못한 일에 대해 용서를 해준다.\n일러드리는 용서의 문구를 들으면서 마음속으로 그 의미를 음미해본다.\n\n만일 내가 다른 사람에게 몸으로 입으로 생각으로 잘못을 행했다면 내가 평화롭고 행복하게 살 수 있도록 용서받기를 원합니다.\n또한 누군가가 나에게 몸으로 입으로 생각으로 잘못을 행했다면 그들이 평화롭고 행복하게 살 수 있도록 나는 용서합니다.\n\n간단하게 다음과 같이 할 수도 있다.\n내가 남에게 한 잘못에 용서를 구합니다.\n남들이 나에게 한 잘못을 용서합니다.\n\n용서의 마음을 일으키면 자책감이나 적개심에서 어느 정도 마음이 부드러워지는 것을 느낄 수 있다.\n용서는 점점 깊게 어려운 대상까지 확장되지만 처음에는 불특정다수를 향해서 하는 것이 좋다.\n\n다음에 나 자신을 향한 자애의 마음을 먼저 일으켜 본다.\n내가 나를 돌보고 사랑하고 나에게 친절함을 길러내는 것이다.\n한번 마음속으로 생각해보자.\n이 세상에서 나에게 가장 소중한 존재는 누구인가?\n내 배우자인가?\n내 아이들인가? 내 부모인가?\n깊게 생각해본다.\n물론 그들도 소중하고 사랑스럽지만 나에게는 내 자신이 가장 소중한 존재가 아닌가 한번 생각해 본다.\n내가 나에게 정말 소중하기 때문에 그래서 내 가족도,\n내 친구들도,\n내 주변 사람들도 소중한 것이 아닌가?\n이렇게 생각하면서 나 자신의 소중함을 깊게 생각해보고 이런 나를 위해서 내가 할 수 있는,\n내가 나에게 해줄 수 있는 가장 좋은 일을 지금 한다고 생각하고,\n내 자신이 행복했던 일,\n나의 좋은 점,\n잘 한 일들을 떠올리면서 나의 행복을 바라는 마음을 일으킨다.\n실수를 했거나 어려움에 처해있는 내 자신을 공격하지 말고 나에게 친절하게 다음과 같은 문구를 써서 나를 따뜻하게 감싼다.\n\n내 자신이 행복하고 평화롭기를,\n안전하고 자유롭기를,\n괴로움과 슬픔에서 벗어나기를.\n출처 입력\n\n강조하는 말을 넣고 완성된 문장으로 다음과 같이 할 수도 있다.\n\n내 자신이 진정으로 행복하고 평화롭기를,\n안전하고 자유롭기를 바랍니다.\n괴로움과 슬픔에서 벗어나기를 바랍니다.\n\n누구에게 기원하는 것이 아니라 내가 바라는 마음의 발신처가 돼서 나를 향해서 그것을 일으키는 것이다.\n고요히 내 자신을 향해서 나를 사랑하고 보살피는 마음으로 '내 자신이 행복하고 평화롭기를, 안전하고 자유롭기를, 괴로움과 슬픔에서 벗어나기를'이라는 자애의 문구를 반복하면서 진행한다.\n이 문구를 주문처럼 외우지 말고 의미를 음미하면서 반복한다.\n\n자기를 향한 자애명상은 길게 하지는 않아도 좋지만 언제라도 할 수 있다.\n내가 나를 돌보는 마음으로,\n특히 힘들 때,\n어려울 때 내가 이 힘든 상황에서 벗어나서 평화롭고 행복하기를 바라는 마음으로 진행한다.\n나를 공격하지 말고 나를 사랑하는 마음으로 반복하면 마음이 편안해지고 안정되는 것을 스스로 느낄 수 있다.\n\n짧게는 2분에서 5분정도 자신을 향한 자애명상을 하고 나서 다음 단계로 고마운 분,\n존경하는 분,\n은인 중에 한 사람,\n또는 한 집단을 우선 선택한다.\n살아있는 사람 가운데 선택하며 생사를 모르면 일단 한번 해본다.\n한 사람을 선택할 때는 이성으로 생각되는 대상은 일단 제외한다.\n감각적 욕망의 사랑으로 빠지는 함정을 피하기 위해서 이성은 일단은 제외한다고 이해한다.\n부부나 파트너 사이에 서로 배우자를 향해서 처음에는 자애명상을 하지 않는 것이 좋다.\n\n선택한 분이 가능하면 존경하고 고마운 분이면 자애심이 잘 일어난다.\n자애심을 일으키는 것은 내가 그들보다 더 여유가 있고 잘나서가 아니라 수평적 관계에서 누구라도 행복해지기를 바라는 마음이 좋은 의도이고,\n좋은 마음이기 때문에 일으키는 것이다.\n상하관계는 아무런 관계가 없다.\n그저 좋은 의도를 계속 일으켜서 상대방의 입장에서 행복을 바라는 마음으로 일으키는 것이다.\n한 분,\n한 집단의 구성원을 선택해서 그분들과 내가 맺었던 좋은 관계,\n고마웠던 일,\n존경하는 면을 마음속으로 깊이 떠올려본다.\n그리고 그분께서 정말로 행복하고 평화롭고 잘 되었으면 좋겠다고 생각한다.\n그 대상의 이름과 호칭을 주어로 한 문구를 만든다.\n얼굴모습이 어렵지 않게 기억나면 자연스럽게 그 모습을 떠올려서 마주하고 해본다.\n좌선할 때는 눈을 감고하는 것이 필요하다.\n필자는 스승님을 예로 들어 문구를 만들어보겠는데,\n각자 선택한 분의 호칭을 또는 명칭을 써서 따라 해보도록 한다.\n\n스승님께서 행복하고 평화롭기를,\n안전하고 자유롭기를,\n괴로움과 슬픔에서 벗어나기를.\n\n또는 스승님께서 진정으로 행복하고 평화롭기를,\n안전하고 자유롭기를 바랍니다.\n괴로움과 슬픔에서 벗어나기를 바랍니다.\n\n다른 생각이 들어오면 가볍게 알아차리고 다시 자애의 문구로 돌아온다.\n혹시 몸이 많이 불편해서 자애의 마음을 일으키는데 방해가 된다면 몸의 불편한 부분을 가볍게 움직여서 풀어주고 나서 다시 자애명상을 해도 괜찮다.\n위빠사나를 할 때는 통증이 관찰의 대상이지만 자애명상을 할 때에는 그렇게까지 참으면서 할 필요는 없다.\n견딜만하면 견디되,\n자애의 마음이 일어나는 것이 방해가 될 정도로 아프다면,\n자세를 바꿔서 몸을 편안하게 해준 다음에 하셔도 문제가 되지 않는다.\n\n1단계 고마운 분,\n존경하는 분,\n은인 가운데 한 대상을 향해서 5분~10분간 계속 해 본다.\n대상을 자주 바꾸지 않는다.\n한 시간을 해도 서너 명 이상 바꾸지 말고,\n한 사람 당 10분에서 20분씩 계속한다는 생각으로 한다.\n처음 5분~10분간 했는데 별 느낌이 없으면 다시 한 번 그 분과 내가 맺었던 좋은 관계를 다시 떠올린 다음에 고마웠던 점,\n존경하는 점을 떠올리고 다시 한 번 5분에서 10분 열심히 자애명상을 해본다.\n명상이 잘 되면 같은 대상을 향해 계속해도 좋고,\n두 번째에 10분 동안에도 잘 안되면 다른 대상을 찾아본다.\n편안하게 찾는다.\n왜 명상이 안 되는지 이유를 생각하지 말고,\n미안하게 생각하지도 말고,\n다른 대상을 찾으면 된다.\n이렇게 1단계 고마운 분,\n존경하는 분을 향해서 깊이 해보고,\n이것이 잘되면(보통 몇 시간에서 며칠이 걸린다) 그 다음 2단 계에서는 사랑하는 대상을 향해 같은 방식으로 자애명상을 계발해 간다,\n사랑하는 대상을 향해 자애명상이 잘되면,\n3단계에서는 무덤덤하고 무관한 대상을 향해 명상을 확장해 간다.\n그리고 마지막 4단계에서는 싫거나 미운대상까지 계속 확장시켜나가는 자애명상을 한다.\n\n보통 각 단계마다 일주일씩 연습을 한다.\n매일 매일 한 시간씩 또는 30분씩 좌선을 하면서 자애의 마음을 길러내는 것이다.\n\n한정된 대상 다음에는 모든 존재를 향해서 자애명상을 한다.\n살아있는 모든 대상,\n나처럼 몸과 마음이 있는 생명들을 향해서,\n'이 모든 존재들도 나처럼 자신에게 가장 소중한 존재이고 사랑스러운 존재들이다. 그들도 나처럼 행복하고 평화롭기를 바란다. 그들을 위해서 아무 조건 없고 한계 없이 자애의 마음을 일으켜 보겠다.'라고 생각하고 나서 다음과 같이 자애문구를 마음속으로 반복하면서 자애명상을 시도한다.\n\n모든 존재들이 행복하고 평화롭기를,\n안전하고 자유롭기를,\n괴로움과 슬픔에서 벗어나기를.\n\n또는 모든 존재들이 진정으로 행복하고 평화롭기를,\n안전하고 자유롭기를 바랍니다.\n괴로움과 슬픔에서 벗어나기를 바랍니다.\n\n모든 존재를 향한 자애명상은 언제든지 할 수 있다.\n눈을 뜨고 있을 때나,\n걸을 때나, 운전을 하거나,\n교통수단을 이용하거나,\n'내 눈에 보이는 모든 사람들이, 모든 승객들이, 모든 생명들이 행복하고 평화롭기를, 안전하고 자유롭기를, 괴로움과 슬픔에서 벗어나기를 하면서 명상을 할 수 있다. 만일 자신의 마음이 불편할 때면, '내가 이 불편함과 괴로움,\n슬픔에서 벗어나기를 하고 2~5분 정도 반복한다.\n마음이 어느 정도 안정되고 나면,\n자애의 문구 '내가 행복하고 평화롭기를 하며 반복한다. 자기에게 먼저 해서 불편한 마음을 가라앉힌 다음, 고마운 분, 존경하는 분을 향해서 자애명상을 하면 천천히 자애의 느낌이 생겨날 것이다. 마치 씨앗을 뿌리면 바로 싹이 트지 않더라도 자주 뿌리고 또 뿌리고 물을 주고 보살피면 천천히 씨앗이 하나씩 피어나듯이 그렇게 자애의 느낌이 일어날 수 있다.","duration":"약 20분","tags":"자애명상, 연민","series":"숨비명상"},{"id":"549212d6","category":"호흡명상","title":"숨의 파도","body":"오늘은 자리에 앉아 호흡을 깊이 들여다보는 좌선의 시간입니다.\n그리고 앉을 때는 언제나,\n자비의 마음으로 문을 여는 것이 좋습니다.\n부드러워진 마음이 집중을 쉽게 하고,\n앉아 있는 동안 일어날 수 있는 성난 마음으로부터 우리를 지켜 주기 때문입니다.\n\n편안히 앉아 허리를 세우고,\n눈을 감습니다.\n먼저 나를 향해,\n마음속으로 천천히 따라 해 봅니다.\n\n내가 건강하고 행복하고 평화롭기를.\n다치지 않기를.\n나에게 어떤 어려움도 생기지 않기를.\n내가 하는 일이 잘 이루어지기를.\n그리고 살면서 만나는 피할 수 없는 어려움과 실패에 잘 대처할 수 있는 참을성과 용기와 이해와 굳센 마음을 갖기를.\n\n이제 같은 바람을 넓혀 갑니다.\n부모님이 건강하고 행복하고 평화롭기를.\n스승님들이 건강하고 행복하고 평화롭기를.\n친척과 친구들이,\n좋아하지도 싫어하지도 않는 덤덤한 이들이,\n나와 어려운 사이인 이들까지도,\n건강하고 행복하고 평화롭기를.\n마지막으로,\n살아 있는 모든 존재들이 건강하고 행복하고 평화롭기를.\n\n부드러워진 마음으로,\n이제 호흡으로 갑니다.\n먼저 심호흡을 세 번 하겠습니다.\n숨을 들이쉬며 아랫배와 윗배와 가슴이 가득 부풀도록 하고,\n내쉬며 가라앉힙니다.\n한 번 더, 깊이 들이쉬고,\n내쉽니다. 마지막으로,\n들이쉬고, 내쉽니다.\n\n이제 애쓰지 않는 평소의 숨으로 돌아옵니다.\n숨이 저 혼자 물 흐르듯 흐르게 두고,\n콧구멍 끝에 공기가 닿는 느낌에 주의를 둡니다.\n사람에 따라 윗입술이나 콧속에서 더 잘 느껴지기도 합니다.\n나에게 맞는 한 자리를 정해,\n들고 나는 공기의 느낌만 알아차립니다.\n\n가만히 지켜보면,\n숨은 파도와 같습니다.\n밀려오는 들숨에도 처음이 있고,\n중간이 있고, 끝이 있습니다.\n애써 찾으려 하지 말고,\n파도가 오는 것을 그저 지켜봅니다.\n\n그리고 들숨이 끝나고 날숨이 시작되기 전,\n아주 짧은 멈춤이 있습니다.\n파도와 파도 사이의 고요한 한순간.\n너무 짧아 놓치기 쉽지만,\n마음을 기울이면 알아차릴 수 있습니다.\n\n이어서 날숨이 밀려 나갑니다.\n처음, 중간, 끝.\n그리고 다음 들숨이 오기 전,\n또 하나의 짧은 멈춤.\n그 고요도 알아차립니다.\n\n지켜보는 동안 숨은 스스로 변해 갑니다.\n처음에는 아마 길 것입니다.\n길다고 말하지 말고,\n긴 숨의 느낌만 알아차립니다.\n몸이 고요해지면 숨이 짧아질 것입니다.\n짧다고 말하지 말고,\n짧은 숨의 느낌만 알아차립니다.\n더 고요해지면 숨은 아주 미세해집니다.\n그 미세한 숨과 함께 찾아온 고요하고 평화로운 느낌을,\n가만히 알아차립니다.\n\n여기서 한 가지,\n이 명상에서는 이름표를 쓰지 않습니다.\n생각이다, 소리다,\n이름 붙이려는 사이에 그 현상은 이미 지나가 버리기 때문입니다.\n말이라는 다리를 거치지 않고,\n바로 봅니다.\n볼 때는 봄만 있고,\n들을 때는 들음만 있고,\n알 때는 앎만 있습니다.\n지켜보고 아는 것,\n그것으로 충분합니다.\n\n물론 마음은 달아날 것입니다.\n오래전의 기억으로,\n어제 먹은 음식으로,\n문득 떠오른 얼굴로.\n달아났음을 알아차린 바로 그때,\n마음을 호흡으로 데려와 닻을 내립니다.\n몇 번이고, 같은 자리에.\n\n이제 잠시 안내를 멈춥니다.\n각자의 숨과 함께,\n파도와 파도 사이의 고요와 함께,\n머물러 봅니다.\n\n이제 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n몸의 감각과 주위의 소리를 천천히 알아차리며,\n준비가 되었다면,\n눈을 뜹니다.\n\n오늘 만난 파도 사이의 고요는 어디로 가지 않습니다.\n숨이 있는 한,\n그 고요도 언제나 두 숨 사이에서 기다리고 있습니다.","duration":"약 12분","tags":"#좌선명상 #호흡관찰 #깊은고요","series":"숨비명상"},{"id":"7ae8741f","category":"관찰","title":"소리의 강","body":"마음이 불안하고 긴장한 날에는 호흡에 주의를 두는 것조차 쉽지 않습니다.\n그런 날을 위한 또 하나의 길이 있습니다.\n바로 소리입니다.\n소리에 귀 기울이는 동안,\n불안은 그 자리에 함께 있지 못합니다.\n오늘은 먼저 나의 소리를 듣고,\n그다음 세상의 소리가 흐르는 강가에 앉아 보겠습니다.\n\n편안한 자세로 앉아 허리를 폅니다.\n눈을 감고,\n잠시 호흡에 주의를 둡니다.\n들어오는 숨, 나가는 숨.\n\n이제 나의 소리를 내 보겠습니다.\n길고 낮은 음으로,\n옴 — 하고 소리를 냅니다.\n호흡이 허락하는 만큼 길게 냅니다.\n옴이라는 소리가 낯설다면,\n나에게 편안한 말이면 무엇이든 좋습니다.\n괜찮아. 사랑. 위로.\n나만의 소리를 정해도 됩니다.\n\n소리를 내면서,\n그 소리를 내 귀로 듣습니다.\n소리가 시작되고, 이어지고,\n점점 옅어지다가,\n사라지는 끝까지 따라가며 듣습니다.\n\n다시 한 번,\n옴 — 가슴에 울리는 떨림과 귀에 닿는 소리를 함께 느낍니다.\n몇 번이고 반복합니다.\n그러다 보면 알게 됩니다.\n내 목소리가 하나의 닻이 되어,\n떠돌던 마음을 지금 여기에 붙잡아 주고 있다는 것을.\n\n이제 나의 소리를 살며시 내려놓습니다.\n그리고 귀를 바깥으로 엽니다.\n지금 이 순간,\n주변에서 들려오는 소리들이 있을 것입니다.\n바람 소리, 자동차 소리,\n멀리서 나는 말소리,\n방 안의 작은 기척.\n찾으러 가지 말고,\n강가에 앉은 사람처럼,\n흘러오는 소리를 그저 맞이합니다.\n이런 소리가 들리는구나.\n\n듣기 좋다, 듣기 싫다,\n가리지 않습니다.\n소리의 높낮이, 크기,\n리듬을 있는 그대로 듣습니다.\n여러 소리가 한꺼번에 들려도 괜찮습니다.\n\n이제 그중 가장 또렷한 소리 하나에 주의를 둡니다.\n그 소리가 태어나서 사라지는 순간까지,\n끝까지 배웅하듯 따라가 봅니다.\n\n듣는 동안 몸과 마음에서 반응이 일어날 수 있습니다.\n어떤 소리에는 짜증이 올라오고,\n어떤 소리에는 그리움이나 슬픔이 스며 나올지도 모릅니다.\n그 모든 반응도 있는 그대로 알아차립니다.\n불편함이 오래 이어지면,\n잠시 호흡으로 돌아와 쉬었다 와도 됩니다.\n\n그렇게 듣다 보면 소리가 가르쳐 주는 것이 있습니다.\n어떤 소리도 머물러 있지 않습니다.\n생겨난 것은, 사라집니다.\n그리고 문득 알게 됩니다.\n곳곳에서 들려오는 소리를 내가 통제할 수 없듯,\n마음에 떠오르는 생각도 통제할 수 없다는 것을.\n하지만 괜찮습니다.\n소리가 나타났다 사라지듯,\n생각도 나타났다 사라집니다.\n강물은 붙잡지 않아도 알아서 흘러갑니다.\n\n그저 듣기만 하면 됩니다.\n그저 지금 여기에 있기만 하면 됩니다.\n잠시 더,\n소리의 강가에 머물러 봅니다.\n\n이제 천천히 호흡으로 돌아옵니다.\n드나드는 숨과 함께 잠시 쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n마음이 불안한 날,\n긴장으로 굳은 날,\n혹은 졸음이 밀려오는 날,\n소리의 강가를 기억해 주세요.\n나의 소리 한 번,\n옴 — 그리고 흘러오는 세상의 소리들.\n그 곁에 잠시 앉아 있는 것만으로,\n마음은 지금 여기로 돌아오고,\n생겨난 것은 사라진다는 오래된 진실이 조용히 나를 쉬게 해 줄 것입니다.","duration":"약 10분","tags":"#소리명상 #옴명상 #듣기명상","series":"숨비명상"},{"id":"8dfef40c","category":"탈중심화","title":"쥐지 않는 손","body":"장난감 가게에서 있었던 일입니다.\n두 살배기 아이가 좋아하는 장난감을 두 팔로 꼭 껴안은 채 그대로 가게를 나가려 했습니다.\n장난감이 제 것이 되려면 잠시 계산대에 내려놓아야 하는데,\n아이는 내려놓으면 빼앗기는 줄 알고 울면서 놓지 않았습니다.\n우리도 이 아이와 크게 다르지 않습니다.\n내려놓으면 잃는 줄 알고 움켜쥐지만,\n사실은 내려놓을 때에야 온전한 내 것이 됩니다.\n오늘은 그 역설을 직접 겪어 보는 시간입니다.\n\n편안히 앉아 허리를 세우고,\n눈을 감습니다.\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n\n이제 마음속에 내가 아끼는 것 하나를 떠올려 봅니다.\n지난번처럼 무거운 짐이 아니라,\n이번에는 소중한 것입니다.\n사랑하는 사람일 수도,\n애써 얻은 자리일 수도,\n아끼는 물건일 수도,\n이루어 놓은 무언가일 수도 있습니다.\n하나가 떠올랐다면,\n그것을 가슴에 품어 봅니다.\n\n그리고 품고 있는 내 마음을 살펴봅니다.\n소중한 것을 생각하는데,\n이상하게도 가슴 한켠이 조여 오지 않나요.\n잃으면 어쩌나.\n망가지면 어쩌나.\n누가 가져가면 어쩌나.\n아끼는 마음 뒤에 꼭 그만큼의 걱정이 붙어 있습니다.\n\n작은 새를 손안에 꼭 움켜쥐면 어떻게 될까요.\n날아갈까 봐 힘을 줄수록,\n새는 괴롭고 내 손도 아픕니다.\n쥐는 동안 우리는 새를 누리는 것이 아니라,\n새를 지키느라 애쓰고 있을 뿐입니다.\n어느 스님은 아끼던 난초 화분 하나 때문에 길을 나서서도 마음이 온통 화분에 매여 있었다고 합니다.\n무언가를 갖는다는 것은,\n그만큼 무언가에 얽매이는 일이기도 합니다.\n\n이제 실험을 하나 해 보겠습니다.\n가슴에 품고 있던 그 소중한 것을,\n숨을 길게 내쉬며,\n활짝 편 손바닥 위에 가만히 얹어 봅니다.\n쥐는 것이 아니라,\n얹는 것입니다.\n손가락은 펴진 채로,\n새가 앉을 자리를 내어 주듯이.\n\n그리고 살펴봅니다.\n어떻게 되었나요. 사라졌나요.\n날아가 버렸나요. 아닙니다.\n그것은 여전히 거기 있습니다.\n오히려 움켜쥔 손가락에 가려 있던 모습이,\n이제야 온전히 보이기 시작합니다.\n조여 있던 가슴이 풀리고,\n지키느라 굳어 있던 마음이 비로소 누리기 시작합니다.\n쥐고 있는 동안은 지키는 것이었지,\n누리는 것이 아니었던 것입니다.\n\n같은 손바닥 위에,\n미래에 대한 불안도 얹어 봅니다.\n어떻게 될까, 잘될까,\n하는 움켜쥔 걱정들도 손을 펴서 얹어 둡니다.\n얹어 두어도 삶은 무너지지 않습니다.\n다만 숨이 한결 깊어질 뿐입니다.\n\n펼친 손바닥의 이 가볍고 넉넉한 느낌에 잠시 머물러 봅니다.\n소중한 것들이 내 손바닥 위에서 편안히 쉬고 있습니다.\n나도 함께 쉬고 있습니다.\n\n이제 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n움켜잡으려 할수록 바스러지고,\n가지려 할수록 공허해지는 것이 우리 삶입니다.\n그러니 오늘,\n소중한 사람을 꽉 쥐고 싶어질 때,\n아끼는 것을 잃을까 가슴이 조여 올 때,\n펼친 손바닥을 기억해 주세요.\n쥐지 않을 때,\n소중한 것은 비로소 온전히 내 곁에 머물고,\n온전히 내 것이 됩니다.","duration":"약 10분","tags":"#내려놓음 #비움명상 #소중한것누리기","series":"숨비명상"},{"id":"fba0f513","category":"호흡명상","title":"오직 한 호흡","body":"우리의 생명은 한 호흡 사이에 있습니다.\n들어온 숨이 나가지 않으면 그것으로 끝이고,\n나간 숨이 들어오지 않아도 그것으로 끝입니다.\n숨은 곧 생명입니다.\n그리고 숨은 마음과 이어져 있어서,\n감정이 격해지면 빨라지고,\n숨이 고요해지면 마음도 고요해집니다.\n오늘 우리는 이 숨을 바꾸거나 다듬지 않습니다.\n숨을 하는 것이 아니라,\n숨을 지켜보는 것.\n그것이 오늘의 전부입니다.\n\n방석 위에 앉거나,\n의자에 앉습니다.\n허리는 편안하게 폅니다.\n너무 꼿꼿이 세우지 않아도 됩니다.\n혀는 입천장에 가볍게 대고,\n입을 다물고,\n입가에 미소를 살짝 지어 봅니다.\n미소 하나로 얼굴의 긴장이 풀리고,\n마음의 문턱이 낮아집니다.\n\n이제 아랫배로 주의를 가져갑니다.\n숨이 들어오면 아랫배가 천천히 일어납니다.\n그 감각을 알아차리며 마음속으로 조용히 이름을 붙입니다.\n일어남.\n숨이 나가면 아랫배가 가라앉습니다.\n사라짐.\n\n일어남. 사라짐.\n이름은 아주 작게,\n감각은 크게.\n말에는 마음의 5%만 두고,\n아랫배의 느낌에 95%를 둡니다.\n이름은 다만 알아차림을 또렷하게 해 주는 작은 표지판일 뿐입니다.\n\n지켜보는 사이 다른 것들이 찾아올 것입니다.\n생각이 오면,\n빠지지도 말고 밀어내지도 말고,\n생각, 하고 이름 붙입니다.\n몸의 감각이 오면, 감각.\n졸음이 오면, 졸음.\n그리고 천천히,\n다시 아랫배로 돌아옵니다.\n일어남. 사라짐.\n\n여기서 한 가지,\n이 명상에서 가장 중요한 마음가짐을 전합니다.\n5분을 해야지,\n10분을 채워야지,\n그런 생각을 내려놓습니다.\n우리가 할 일은 오직 한 호흡입니다.\n지금 이 한 숨에만 깨어 있는 것.\n그 한 숨이 끝나면,\n다시 새로운 한 숨.\n명상은 시간을 채우는 일이 아니라,\n한 호흡씩 깨어나는 일입니다.\n\n이제 조금 더 깊이 들어가 봅니다.\n숨이 들어왔다가 나가기 전,\n아주 잠깐의 틈이 있습니다.\n숨이 나갔다가 다시 들어오기 전에도,\n또 하나의 틈이 있습니다.\n그 틈을 자각해 봅니다.\n멈춤.\n처음에는 잘 느껴지지 않아도 괜찮습니다.\n자각하려는 마음만 있으면 됩니다.\n틈을 늘리려고 애쓰지도 않습니다.\n그저 편안히,\n있는 그대로 알아차리기만 합니다.\n일어남. 사라짐. 멈춤.\n\n그 틈에 머무는 사이,\n지켜보는 힘이 점점 맑아집니다.\n맑아진 자각은 소란한 생각을 쉬게 하고,\n출렁이던 감정을 가라앉히고,\n그 아래에 있던 깊고 고요한 자리로 우리를 데려갑니다.\n잠시,\n그 고요 속에서 오직 한 호흡과 함께 머물러 봅니다.\n\n이제 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n몸과 주위를 천천히 알아차리며,\n준비가 되었다면,\n눈을 뜹니다.\n\n살다 보면 생각이 엉키고,\n감정이 벅차고,\n일이 풀리지 않는 날이 옵니다.\n그런 날일수록 기억해 주세요.\n해답의 열쇠는 밖이 아니라 내 안에 있고,\n그 문은 언제나 오직 한 호흡에서 열린다는 것을.\n일어남. 사라짐.\n지금 이 한 숨이면,\n충분합니다.","duration":"약 10분","tags":"#호흡명상 #일어남사라짐 #지금여기","series":"숨비명상"},{"id":"e137bb7c","category":"수면·이완","title":"미소의 빛","body":"몸은 마음의 그림자입니다.\n마음으로 신 귤을 떠올리면 입안에 저절로 침이 고이고,\n마음에 걱정이 들어서면 심장과 숨이 빨라집니다.\n몸과 마음은 둘이 아니기 때문입니다.\n그렇다면 반대도 참입니다.\n마음이 따뜻해지면,\n몸도 따뜻해집니다.\n마음에는 몸을 어루만지는 치유의 힘이 있습니다.\n오늘은 마음의 말과 한 조각 미소로 몸을 데우는 명상을 함께하겠습니다.\n\n편안히 앉거나 누워서,\n가볍게 눈을 감습니다.\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n\n먼저 양팔로 주의를 가져갑니다.\n어깨에서 손가락 끝까지,\n양팔의 감각을 느껴 봅니다.\n팔의 힘을 다 빼고,\n축 늘어진다고 생각하며,\n마음속으로 천천히 따라 해 봅니다.\n\n양팔이 무겁고 따뜻하다.\n양팔이 점점 더 무겁고 따뜻해진다.\n양팔이 아주 무겁고 따뜻하다.\n\n일부러 힘을 주어 무겁게 하는 것이 아닙니다.\n생각에만 집중하고,\n팔에서 일어나는 감각을 가만히 느낍니다.\n다른 생각이 떠오르면 알아차리고 다시 팔로 돌아옵니다.\n감각이 잘 느껴지지 않아도 괜찮습니다.\n편안한 마음이면 충분합니다.\n\n이제 가슴으로 초점을 옮깁니다.\n\n가슴이 따뜻하고 고요하다.\n가슴이 점점 더 따뜻하고 고요해진다.\n가슴이 아주 따뜻하고 고요하다.\n\n말이 지나갈 때마다 가슴 한가운데가 난롯가처럼 데워지는 것을 느껴 봅니다.\n\n다음은 호흡입니다.\n\n호흡이 자유롭고 고요하다.\n호흡이 점점 더 자유롭고 고요해진다.\n호흡이 아주 자유롭고 고요하다.\n\n숨이 저 혼자 느리고 부드럽게 드나드는 것을 지켜봅니다.\n\n이제 배로 내려갑니다.\n\n배가 따뜻하고 편안하다.\n배가 점점 더 따뜻하고 편안해진다.\n배가 아주 따뜻하고 편안하다.\n\n배 속 깊은 곳까지 온기가 스며드는 것을 느껴 봅니다.\n\n몸이 무겁고 따뜻하게 가라앉은 지금,\n마지막 선물을 꺼냅니다.\n입가에 작은 미소를 지어 봅니다.\n억지웃음이 아니라,\n좋아하는 사람을 떠올릴 때 저절로 번지는 그런 미소입니다.\n미소와 함께 얼굴 전체가 환하게 밝아지고 편안해지는 것을 느낍니다.\n\n이제 그 환한 미소가 빛이 되어 온몸으로 퍼져 간다고 마음으로 그려 봅니다.\n머리와 목이 환해지고,\n어깨와 양팔이 빛으로 채워지고,\n가슴과 배,\n골반과 두 다리까지,\n발끝까지,\n미소의 빛이 구석구석 비춥니다.\n\n빛이 지나는 자리마다,\n평생 나를 살아 준 이 몸에게 사랑과 감사의 마음을 함께 보냅니다.\n고마워. 애쓰고 있구나.\n\n혹시 몸에 아프거나 불편한 곳이 있다면,\n그곳으로 따뜻한 미소의 빛을 조금 더 오래 보내 줍니다.\n빛이 그 자리를 부드럽게 감싸고,\n어루만져 줍니다.\n\n온몸이 환한 빛으로 따뜻하게 빛나는 이 느낌에,\n잠시 머물러 봅니다.\n\n이제 숨을 깊이 들이쉬고,\n길게 내쉽니다.\n손끝과 발끝을 가볍게 움직이고,\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n몸 따로,\n마음 따로가 아니라,\n마음이 몸을 돌본다는 것을 오늘 몸으로 느끼셨기를 바랍니다.\n하루 중 문득,\n얼굴에 미소가 있는지 알아차려 보세요.\n그리고 그 미소의 빛을 몸 구석구석에 한 번씩 보내 주세요.\n그 작은 실천이 몸과 마음을 함께 건강하게 데워 줄 것입니다.","duration":"약 12분","tags":"#이완명상 #미소명상 #셀프힐링","series":"숨비명상"},{"id":"5eead81e","category":"수용","title":"두 번째 화살","body":"살다 보면 화살처럼 날아와 박히는 일들이 있습니다.\n누군가의 말,\n뜻대로 되지 않는 상황.\n그 첫 화살에 화가 나고 불안해지는 것은 자연스러운 일입니다.\n아주 오래전부터 위험 앞에서 우리를 지켜 온 본능의 반응이니까요.\n문제는 그다음입니다.\n그 사람이 어떻게 나한테,\n그 상황이 왜 하필 나에게.\n이야기를 만들기 시작하면서,\n우리는 자신에게 두 번째,\n세 번째 화살을 쏘기 시작합니다.\n첫 화살은 피할 수 없지만,\n그다음 화살들은 내가 쏘는 것입니다.\n오늘은 그 화살을 내려놓는 연습을 하겠습니다.\n\n편안히 앉아 허리를 세우고,\n눈을 감습니다.\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n한 번 더 들이쉬고,\n내쉽니다.\n\n이제 최근에 스트레스를 받았던 일 하나를 떠올려 봅니다.\n가장 크고 아픈 일 말고,\n지금 다룰 수 있을 만한 것으로,\n하나면 됩니다.\n그 장면을 눈앞에 가져옵니다.\n\n떠올리는 순간,\n마음이 어디로 가는지 지켜봅니다.\n아마 밖으로 갈 것입니다.\n그 사람의 얼굴,\n그때의 말투, 억울한 상황.\n그리고 이야기가 자라나기 시작합니다.\n어떻게 그럴 수가.\n왜 나한테만.\n이야기가 한 줄 늘 때마다,\n화살이 하나씩 더 날아와 박힙니다.\n\n여기서, 시선을 돌립니다.\n밖이 아니라, 안으로.\n그 사람이 아니라,\n지금 그 일을 겪고 있는 나의 몸과 마음으로.\n\n몸부터 살펴봅니다.\n얼굴이 달아오르는가.\n숨이 빨라졌는가.\n가슴이 조여 오는가.\n어깨에 힘이 들어갔는가.\n있는 그대로 알아차립니다.\n아, 얼굴이 뜨거워졌구나.\n아, 숨이 빨라졌구나.\n\n이제 그 감정에 이름을 붙여 줍니다.\n화구나. 불안이구나.\n서운함이구나.\n만약 불안이라면,\n한 가지를 더 알아차립니다.\n불안이 가리키는 위협은 지금이 아니라,\n아직 오지 않은 미래에 있다는 것을.\n지금 이 순간의 나는,\n사실 안전합니다.\n\n감정을 어떻게 할지는 이미 알고 있습니다.\n터뜨리면 상처가 남고,\n누르면 보이지 않는 곳에서 더 크게 자랍니다.\n그래서 세 번째 길을 갑니다.\n터뜨리지도, 누르지도 않고,\n그저 바라보는 것.\n감정은 내가 아니라,\n마음이라는 하늘을 지나가는 구름입니다.\n바라보는 동안,\n구름은 제 길을 갑니다.\n\n그리고 알아차립니다.\n시선을 안으로 돌린 순간부터,\n새 화살이 더는 날아오지 않고 있다는 것을.\n이야기가 멈추면,\n화살도 멈춥니다.\n첫 화살의 얼얼함만 남아서,\n그것도 천천히 옅어져 갑니다.\n\n화살이 멎은 이 고요한 자리에서,\n비로소 물을 수 있습니다.\n자, 이제 나는 어떻게 할까.\n휘둘려서 터져 나오는 반응이 아니라,\n고요 속에서 고르는 대응.\n그 선택의 힘이 지금 내 손에 돌아와 있습니다.\n\n숨을 깊이 들이쉬고,\n길게 내쉽니다.\n준비가 되었다면,\n천천히 눈을 뜹니다.\n\n다음에 또 첫 화살이 날아와 박히는 순간이 오면,\n스스로에게 이렇게 물어봐 주세요.\n나는 지금 몇 번째 화살을 맞고 있는가.\n그 물음 하나가 이야기를 멈추고,\n시선을 안으로 돌리고,\n활시위를 내려놓게 해 줄 것입니다.\n첫 화살은 삶이 쏘지만,\n나머지는 내가 쏘지 않으면 날아오지 않습니다.","duration":"약 10분","tags":"#스트레스명상 #감정조절 #두번째화살","series":"숨비명상"},{"id":"0688ee13","category":"호흡명상","title":"물밑의 고요","body":"옛날 어느 절 마당에서 논쟁이 벌어졌습니다.\n바람에 나부끼는 깃발을 두고 한 사람은 깃발이 흔들리는 것이라 하고,\n다른 사람은 바람이 흔들리는 것이라 했습니다.\n그때 지나가던 한 스승이 말했습니다.\n깃발이 흔들리는 것도,\n바람이 흔들리는 것도 아니다.\n그대들의 마음이 흔들리는 것이다.\n\n요즘 우리도 많이 흔들립니다.\n세상의 소식들,\n끝나지 않는 걱정들.\n그런데 가만히 보면,\n흔들리는 것은 바깥의 일들이 아니라 그것을 받아 안는 내 마음입니다.\n그리고 여기에 희망이 있습니다.\n흔들리는 것이 마음이라면,\n고요해질 수 있는 것도 마음이기 때문입니다.\n\n마음을 깊은 바다라고 상상해 봅니다.\n바람이 불면 수면에는 파도가 입니다.\n세상일이 거셀수록 물결도 거세집니다.\n하지만 물밑 깊은 곳은,\n아무리 큰 파도가 쳐도 언제나 고요합니다.\n오늘은 호흡을 밧줄 삼아,\n그 깊은 곳으로 내려가 보겠습니다.\n\n방석이나 의자에 편안히 앉습니다.\n허리를 세우고,\n눈을 감습니다.\n숨을 깊게 들이쉬고,\n길게 내쉬며 몸을 이완합니다.\n한 번 더 들이쉬고,\n내쉽니다.\n\n이제 배로 주의를 가져갑니다.\n숨이 들어오면 배가 일어나고,\n나가면 가라앉습니다.\n숨을 깊게 하려고,\n길게 하려고,\n바꾸려 하지 않습니다.\n그저 들어오고 나가는 것을 지켜봅니다.\n\n지켜보는 동안 생각들이 지나갈 것입니다.\n그것은 수면의 물결입니다.\n무엇이 지나가든 상관하지 않습니다.\n잡으려 하지도 않고,\n누르려 하지도 않고,\n따지지도,\n판단하지도 않습니다.\n물결은 수면의 일,\n나는 호흡과 함께 머물 뿐입니다.\n하나하나의 호흡에만 마음을 모읍니다.\n마음이 물결을 따라가면,\n알아차리고 다시 호흡으로 돌아옵니다.\n\n한 호흡, 한 호흡마다,\n조금씩 깊이 내려갑니다.\n수면의 소리가 점점 멀어집니다.\n\n이제 조금 더 깊이 들어가 보겠습니다.\n자각을 명료하게 모읍니다.\n숨이 들어온 그 끝에,\n아주 미세한 정지가 있습니다.\n작은 고요의 공간.\n그 틈에 의식을 모아 봅니다.\n늘리려 하지 말고,\n그저 알아차립니다.\n숨이 나간 그 끝에도,\n또 하나의 멈춤이 있습니다.\n들숨의 끝, 날숨의 끝,\n그 멈춤의 공간에 가만히 머뭅니다.\n\n아무것도 느껴지지 않아도 걱정하지 않습니다.\n멈춤이 잘 잡히지 않아도 개의치 않습니다.\n자각이 맑아지면,\n그 공간은 서서히 스스로 모습을 드러냅니다.\n\n그리고 어느 순간,\n도착합니다.\n파도가 닿지 않는 물밑의 자리.\n텅 비어 있고,\n고요한 마음의 공간입니다.\n혼란도 갈등도 여기까지는 내려오지 못합니다.\n이 고요가 꾸며 낸 것이 아니라 본래부터 있던 내 마음의 바탕임을,\n가만히 느껴 봅니다.\n표면이 아무리 흔들려도,\n이 자리는 그대로입니다.\n\n잠시,\n그 깊은 고요 속에 머뭅니다.\n\n이제 천천히 올라올 시간입니다.\
